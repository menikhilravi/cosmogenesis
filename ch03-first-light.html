<script>
(function () {
'use strict';
/* =====================================================================
   COSMOGENESIS · Chapter 03 · First Light
   Act I  : recombination in a 2D box of plasma (Saha / Peebles, Thomson
            scattering random walks, the fog lifting).
   Act II : the last-scattering surface. A physically motivated analytic
            TT spectrum, Gaussian a_lm with a fixed seed, spherical-harmonic
            synthesis in a Blob worker, sphere / inside / Mollweide views,
            and a sonification of the acoustic peaks.
   ===================================================================== */
const U = Cosmos.util, F = Cosmos.fmt;
const SMALL = window.matchMedia('(max-width: 760px)').matches;
const TAU = Math.PI * 2;

/* ============================================================ PHYSICS */
const PH = {
  c: 299792458, Mpc: 3.0857e22, kB: 1.380649e-23, hbar: 1.054571817e-34, me: 9.1093837e-31, eV: 1.602176634e-19,
  sigT: 6.6524587e-29, T0: 2.7255, ogh2: 2.4728e-5, Yp: 0.245, mH: 1.6735575e-27, rhoc: 1.87847e-26, yr: 3.15576e7, ly: 9.4607e15,
};
PH.orh2 = PH.ogh2 * (1 + 0.22711 * 3.046);       // photons + 3.046 massless neutrinos
const FID = { obh2: 0.02237, och2: 0.1200, ns: 0.965, ok: 0, h: 0.674 };   // Planck 2018 (TT,TE,EE+lowE+lensing)

function cosmo(p) {
  const h = p.h || FID.h, obh2 = p.obh2, och2 = p.och2, ok = p.ok || 0;
  const wm = obh2 + och2, Om = wm / (h * h), Or = PH.orh2 / (h * h), OL = 1 - Om - Or - ok;
  const H0 = h * 3.2407793e-18;                    // s^-1
  const H = (z) => { const a = 1 + z; return H0 * Math.sqrt(Math.max(1e-12, Or * a * a * a * a + Om * a * a * a + ok * a * a + OL)); };
  const nH0 = (1 - PH.Yp) * obh2 * PH.rhoc / PH.mH;  // hydrogen nuclei today, m^-3
  return { h, obh2, och2, ok, wm, Om, Or, OL, H0, H, nH0 };
}
/* case-B recombination coefficient (Pequignot et al. 1991) with the RECFAST fudge 1.14 */
function alphaB(T) { const t = T / 1e4; return 1.14e-19 * 4.309 * Math.pow(t, -0.6166) / (1 + 0.6703 * Math.pow(t, 0.53)); }
const B1 = 13.605693 * PH.eV, B2 = B1 / 4, LYA = 121.567e-9, L2S = 8.2245809;
const thermal = (T) => Math.pow(PH.me * PH.kB * T / (TAU * PH.hbar * PH.hbar), 1.5);
function sahaX(z, nH) {
  const T = PH.T0 * (1 + z); const S = thermal(T) * Math.exp(-B1 / (PH.kB * T)) / nH;
  if (S > 1e8) return 1;
  return (-S + Math.sqrt(S * S + 4 * S)) / 2;
}
/* Peebles (1968) effective three-level atom, implicit in x_e, integrated in z */
function recomb(cs, zmax, zmin, dz) {
  const n = Math.round((zmax - zmin) / dz) + 1;
  const xs = new Float64Array(n), xsaha = new Float64Array(n);
  let x = sahaX(zmax, cs.nH0 * Math.pow(1 + zmax, 3));
  for (let i = 0; i < n; i++) {
    const z = zmax - i * dz, nH = cs.nH0 * Math.pow(1 + z, 3);
    xsaha[i] = sahaX(z, nH);
    if (i > 0) {
      const T = PH.T0 * (1 + z), kT = PH.kB * T, Hz = cs.H(z), al = alphaB(T);
      const beta = al * thermal(T) * Math.exp(-B2 / kT);
      const n1s = Math.max(1e-30, (1 - x) * nH), K = LYA * LYA * LYA / (8 * Math.PI * Hz);
      const Cr = (1 + K * L2S * n1s) / (1 + K * (L2S + beta) * n1s);
      const dt = dz / ((1 + z) * Hz), bexp = beta * Math.exp(-(B1 - B2) / kT);
      const a = dt * Cr * al * nH, b = 1 + dt * Cr * bexp, c = -(x + dt * Cr * bexp);
      x = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
      if (!(x > 0)) x = 1e-6;
    }
    xs[i] = x;
  }
  return { xs, xsaha, zmax, zmin, dz, n };
}

/* ---- Act I tables (fiducial cosmology) ---- */
const CS = cosmo(FID);
const REC = (function () {
  const zmax = 2000, zmin = 400, dz = 0.5;
  const r = recomb(CS, zmax, zmin, dz);
  const n = r.n;
  // cosmic age at zmax by quadrature in a, then step down
  let age0 = 0; { const N = 20000, a1 = 1 / (1 + zmax); for (let i = 0; i < N; i++) { const a = a1 * (i + 0.5) / N; age0 += (a1 / N) / (a * CS.H(1 / a - 1)); } }
  const age = new Float64Array(n); age[0] = age0;
  for (let i = 1; i < n; i++) { const z = zmax - (i - 0.5) * dz; age[i] = age[i - 1] + dz / ((1 + z) * CS.H(z)); }
  // optical depth to z (from below) and visibility, with the freeze-out value held below zmin
  const tau = new Float64Array(n), vis = new Float64Array(n);
  let t = 0; const xlow = r.xs[n - 1];
  { const N = 400; for (let k = 0; k < N; k++) { const z = zmin * (k + 0.5) / N; const ne = xlow * CS.nH0 * Math.pow(1 + z, 3); t += ne * PH.sigT * PH.c / ((1 + z) * CS.H(z)) * zmin / N; } }
  for (let i = n - 1; i >= 0; i--) { const z = zmax - i * dz; const ne = r.xs[i] * CS.nH0 * Math.pow(1 + z, 3); const dtdz = ne * PH.sigT * PH.c / ((1 + z) * CS.H(z)); if (i < n - 1) t += dtdz * dz; tau[i] = t; vis[i] = dtdz * Math.exp(-t); }
  let vmax = 0, zpk = 0; for (let i = 0; i < n; i++) if (vis[i] > vmax) { vmax = vis[i]; zpk = zmax - i * dz; }
  for (let i = 0; i < n; i++) vis[i] /= vmax;
  let zTau1 = 0; for (let i = n - 1; i > 0; i--) if (tau[i] < 1 && tau[i - 1] >= 1) { zTau1 = zmax - i * dz; break; }
  return { zmax, zmin, dz, n, xe: r.xs, xs: r.xsaha, age, tau, vis, zVisPeak: zpk, zTau1 };
})();
function recIdx(z) { const f = U.clamp((REC.zmax - z) / REC.dz, 0, REC.n - 1.001); const i = f | 0; return [i, f - i]; }
function recAt(arr, z) { const [i, t] = recIdx(z); return arr[i] * (1 - t) + arr[i + 1] * t; }
function xeAt(z, saha) {
  if (saha) { const n = CS.nH0 * Math.pow(1 + z, 3); return sahaX(z, n); }
  const [i, t] = recIdx(z); return Math.exp(Math.log(REC.xe[i]) * (1 - t) + Math.log(REC.xe[i + 1]) * t);
}
const TofZ = (z) => PH.T0 * (1 + z);
/** proper Thomson mean free path in metres */
function mfpAt(z, xe) { return 1 / (Math.max(xe, 1e-12) * CS.nH0 * Math.pow(1 + z, 3) * PH.sigT); }

/* ============================================= CMB TT SPECTRUM MODEL
   A thin-shell projection of the tight-coupling solution (Hu & Sugiyama 1995):
     Θ0+Ψ = ζ[-(A/5) cos(k r_s + φ) e^{-(k/k_D)^2} + (3/5) R T(k)]      (SW + acoustic, baryon-shifted)
     Θ1   =  ζ (A/5) √(3/(1+R)) sin(k r_s + φ) e^{-(k/k_D)^2}            (Doppler)
   A(k) blends the matter-era amplitude (1+3R) into the radiation-driven one as the potentials decay,
   with (1+R)^{-1/4} WKB damping and an early-ISW boost. Projection with j_l^2 → 1/(2x√(x²-ν²)).
   Nine constants below were calibrated once against Planck's best fit. */
const KCAL = { eisw: 0.5, gphi: 0.5, phi0: 0.19869, Ginf: 3.95788, gpow: 1.75091, wD: 0.59146, fD: 1.03201, Aisw: 0.68271, norm: 0.93290, zs: 0.83795, sL: 0.06169 };
const LMAX_SPEC = 2500;
function background(p) {
  const cs = cosmo(p);
  const { obh2, wm, ok } = cs;
  const g1 = 0.0783 * Math.pow(obh2, -0.238) / (1 + 39.5 * Math.pow(obh2, 0.763)), g2 = 0.560 / (1 + 21.1 * Math.pow(obh2, 1.81));
  const zs = 1048 * (1 + 0.00124 * Math.pow(obh2, -0.738)) * (1 + g1 * Math.pow(wm, g2));   // Hu & Sugiyama (1996) fit
  const Rf = 3 * obh2 / (4 * PH.ogh2);           // R = Rf · a
  const HM = (z) => cs.H(z) * PH.Mpc / PH.c;      // H/c in Mpc^-1
  let rs = 0; { const N = 1200, la0 = Math.log(1e-9), la1 = Math.log(1 / (1 + zs)); for (let i = 0; i < N; i++) { const la = la0 + (la1 - la0) * (i + 0.5) / N; const a = Math.exp(la); rs += (1 / Math.sqrt(3 * (1 + Rf * a))) / (a * HM(1 / a - 1)) * (la1 - la0) / N; } }
  let chi = 0; { const N = 1500; for (let i = 0; i < N; i++) { const z = zs * (i + 0.5) / N; chi += zs / N / HM(z); } }
  const DH = 299792.458 / (100 * cs.h);
  let DM = chi; if (ok > 1e-8) DM = DH / Math.sqrt(ok) * Math.sinh(Math.sqrt(ok) * chi / DH); else if (ok < -1e-8) DM = DH / Math.sqrt(-ok) * Math.sin(Math.sqrt(-ok) * chi / DH);
  const Rs = Rf / (1 + zs);
  // Silk damping with this cosmology's own recombination history
  const rec = recomb(cs, 3000, 600, 2);
  let kd2 = 0; { const N = 1500, la0 = Math.log(1 / (1 + 1e6)), la1 = Math.log(1 / (1 + zs)); for (let i = 0; i < N; i++) { const la = la0 + (la1 - la0) * (i + 0.5) / N; const a = Math.exp(la), z = 1 / a - 1; let xe = 1; if (z < 3000) xe = rec.xs[U.clamp(Math.round((3000 - z) / 2), 0, rec.n - 1)]; const ne = xe * cs.nH0 / (a * a * a); const lam = 1 / (ne * PH.sigT * a) / PH.Mpc; const R = Rf * a; kd2 += (la1 - la0) / N / (a * HM(z)) * lam / (6 * (1 + R)) * (R * R / (1 + R) + 16 / 15); } }
  const kD = 1 / Math.sqrt(kd2);
  const rstar = (PH.orh2 / wm) * (1 + zs);
  // age today (for readouts)
  let age = 0; { const N = 3000; for (let i = 0; i < N; i++) { const a = (i + 0.5) / N; age += (1 / N) / (a * cs.H(1 / a - 1)); } }
  return { cs, zs, rs, DM, chi, theta: rs / DM, lA: Math.PI * DM / rs, Rs, kD, rstar, zeq: wm / PH.orh2 - 1, OL: cs.OL, age: age / PH.yr };
}
function Tbbks(k, wm) { const q = k / wm, x = 2.34 * q; return (x < 1e-6 ? 1 : Math.log(1 + x) / x) * Math.pow(1 + 3.89 * q + Math.pow(16.1 * q, 2) + Math.pow(5.46 * q, 3) + Math.pow(6.71 * q, 4), -0.25); }
/* returns {D: Float64Array(LMAX+1) in µK², bg, peaks[], troughs[]} */
function spectrum(p) {
  const K = KCAL, bg = background(p);
  const As = 2.1e-9, ns = p.ns, tau = 0.054;
  const { rs, DM, Rs, kD, rstar } = bg, wm = bg.cs.wm;
  const phi = K.phi0 * Math.PI * Math.pow(rstar / 0.3, 0.1), kDe = kD * K.fD;
  const NK = 2500, k1 = 0.02, dk1 = k1 / 1000, dk2 = 4e-4, kmax = k1 + 1500 * dk2;
  const A = new Float64Array(NK), B = new Float64Array(NK);
  for (let i = 0; i < NK; i++) {
    const k = i < 1000 ? (i + 0.5) * dk1 : k1 + (i - 1000) * dk2;
    const Tk = Tbbks(k, wm), w = Math.pow(1 - Tk, K.gpow);
    const Aosc = ((1 + 3 * Rs) * (1 - w) + K.Ginf * w) / 5 * Math.pow(1 + Rs, -0.25) * Math.pow(rstar / 0.3211, K.eisw * (1 - Tk));
    const damp = Math.exp(-((k / kDe) * (k / kDe)));
    const ph = k * rs + phi * Math.pow(1 - Tk, K.gphi);
    const S0 = -Aosc * Math.cos(ph) * damp + 0.6 * Rs * Tk * K.zs;
    const S1 = Aosc * Math.sqrt(3 / (1 + Rs)) * Math.sin(ph) * damp;
    const D2 = As * Math.pow(k / 0.05, ns - 1);
    A[i] = D2 * S0 * S0; B[i] = D2 * S1 * S1 * K.wD;
  }
  const look = (arr, k) => { let f; if (k < k1) { f = k / dk1 - 0.5; if (f < 0) return arr[0]; } else { f = 1000 + (k - k1) / dk2; if (f >= NK - 1) return 0; } const i = f | 0, t = f - i; return arr[i] * (1 - t) + arr[i + 1] * t; };
  const T2 = (PH.T0 * 1e6) * (PH.T0 * 1e6), e2t = Math.exp(-2 * tau), iswA = K.Aisw * Math.pow(Math.max(0, bg.OL) / 0.685, 2) * As / 25;
  const one = (l) => {
    const nu = l + 0.5, kl = nu / DM; let s = 0, u = 0;
    for (let it = 0; it < 5000; it++) {
      const du = Math.min(0.04, 0.004 / (kl * (Math.sinh(u) + 0.02)));
      const um = u + du * 0.5, ch = Math.cosh(um), th = Math.tanh(um), k = kl * ch;
      if (k > kmax || ch > 60) break;
      s += du * (look(A, k) + look(B, k) * th * th) / (ch * ch);
      u += du;
    }
    const reion = e2t + (1 - e2t) * Math.exp(-(l / 12) * (l / 12));
    return K.norm * T2 * (s * reion + iswA * Math.exp(-l / 8)) * l * (l + 1) / (nu * nu);
  };
  const ls = []; for (let l = 2; l <= 40; l++) ls.push(l); for (let l = 46; l <= LMAX_SPEC + 10; l += 8) ls.push(l);
  const ds = ls.map(one);
  const raw = new Float64Array(LMAX_SPEC + 1);
  let j = 0;
  for (let l = 2; l <= LMAX_SPEC; l++) {
    while (j < ls.length - 2 && ls[j + 1] < l) j++;
    const t = (l - ls[j]) / (ls[j + 1] - ls[j]);
    const p0 = ds[Math.max(0, j - 1)], p1 = ds[j], p2 = ds[j + 1], p3 = ds[Math.min(ds.length - 1, j + 2)];
    raw[l] = Math.max(0, 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t));
  }
  // lensing-like smoothing (Gaussian in ℓ, σ = sL·ℓ)
  const D = new Float64Array(LMAX_SPEC + 1);
  for (let l = 2; l <= LMAX_SPEC; l++) {
    const sg = K.sL * l; if (sg < 1) { D[l] = raw[l]; continue; }
    // Gaussian weights by recurrence: w_d = q^(d²), so no exp() in the inner loop
    const r = Math.ceil(2.5 * sg), q = Math.exp(-1 / (2 * sg * sg)), q2 = q * q;
    let s = raw[l], w = 1, wd = 1, ratio = q;
    for (let d = 1; d <= r; d++) {
      wd *= ratio; ratio *= q2;
      const a = l - d, b = l + d;
      if (a >= 2) { s += wd * raw[a]; w += wd; }
      if (b <= LMAX_SPEC) { s += wd * raw[b]; w += wd; }
    }
    D[l] = s / w;
  }
  const peaks = [], troughs = [];
  for (let l = 60; l < LMAX_SPEC; l++) {
    if (D[l] > D[l - 1] && D[l] >= D[l + 1]) { const last = peaks[peaks.length - 1]; if (last && l - last.l < 0.55 * bg.lA) { if (D[l] > last.D) { last.l = l; last.D = D[l]; } } else peaks.push({ l, D: D[l] }); }
    else if (D[l] < D[l - 1] && D[l] <= D[l + 1]) { const last = troughs[troughs.length - 1]; if (last && l - last.l < 0.55 * bg.lA) { if (D[l] < last.D) { last.l = l; last.D = D[l]; } } else troughs.push({ l, D: D[l] }); }
  }
  return { D, bg, peaks, troughs };
}

<p>For its first 380,000 years the universe was a glowing fog, as hot as the surface of a star. Every electron roamed free. A photon could travel only a short way before an electron knocked it in a new direction, so light zig-zagged and got nowhere. The white scribbles are the paths of single photons. Each one bounces hundreds of times and ends up close to where it started.</p>

const SCIENCE = `
<h4>Recombination: the Saha equation</h4>
<p>In equilibrium, ionisation and capture balance:</p>
<span class="eq">x<sub>e</sub><sup>2</sup> / (1 − x<sub>e</sub>) = (1/n<sub>H</sub>) (m<sub>e</sub>kT / 2πħ<sup>2</sup>)<sup>3/2</sup> e<sup>−13.6 eV / kT</sup></span>
<p>with n<sub>H</sub> = (1 − Y<sub>p</sub>) η n<sub>γ</sub>, η = 6.1 × 10<sup>−10</sup>, n<sub>γ</sub> = 411 cm<sup>−3</sup> (1+z)<sup>3</sup>, T = 2.7255 K (1+z) and Y<sub>p</sub> = 0.245. Saha puts half the hydrogen neutral at z ≈ 1,370, where kT is only 0.32 eV. There are 1.6 billion photons per baryon, so the rare photons in the Wien tail keep hydrogen ionised long after kT falls below 13.6 eV.</p>
<h4>The Peebles bottleneck</h4>
<p>A capture straight to the ground state emits a photon that ionises the next atom. Real recombination goes through n = 2 and escapes only by the slow two-photon decay (Λ<sub>2s</sub> = 8.22 s<sup>−1</sup>) or by Lyman-α photons redshifting out of the line:</p>
<span class="eq">−dx<sub>e</sub>/dt = C [α<sub>B</sub> n<sub>H</sub> x<sub>e</sub><sup>2</sup> − β (1 − x<sub>e</sub>) e<sup>−hν<sub>α</sub>/kT</sup>]</span>
<span class="eq">C = (1 + KΛ<sub>2s</sub>n<sub>1s</sub>) / (1 + K(Λ<sub>2s</sub> + β) n<sub>1s</sub>),  K = λ<sub>α</sub><sup>3</sup> / 8πH</span>
<p>Here β = α<sub>B</sub>(m<sub>e</sub>kT/2πħ<sup>2</sup>)<sup>3/2</sup>e<sup>−3.4 eV/kT</sup> and α<sub>B</sub> is the case-B coefficient (Péquignot fit, times the RECFAST factor 1.14). The chapter integrates this implicitly. Half-ionisation slips to z ≈ 1,270 and a residue of x<sub>e</sub> ≈ 3 × 10<sup>−4</sup> freezes out. The deck plots both curves.</p>
<h4>Thomson scattering and the fog</h4>
<span class="eq">σ<sub>T</sub> = (8π/3) r<sub>e</sub><sup>2</sup> = 6.652 × 10<sup>−29</sup> m<sup>2</sup>,  λ<sub>mfp</sub> = 1 / (n<sub>e</sub>σ<sub>T</sub>)</span>
<p>Between bounces a photon travels one mean free path λ. After N random bounces it has wandered only about √N λ from its start, which is why the flash you fire in the fog stays a small glow. The same diffusion smears out the smallest sound waves (Silk damping, below). The labelled photon on screen records the redshift of its own last bounce, a single draw from the visibility function.</p>
<p>The proper mean free path is about 2,600 light-years at z = 1,500, 49,000 at z = 1,090 and 4.6 million at z = 800, which is larger than the Hubble radius then (1.0 million light-years). Scattering angles follow the dipole law 1 + cos<sup>2</sup>θ. The optical depth back to us reaches 1 at z<sub>*</sub> ≈ ${nfmt(REC.zTau1)}, and the visibility function τ′e<sup>−τ</sup> peaks at z ≈ ${nfmt(REC.zVisPeak)}, when the universe was about ${nfmt(Math.round(recAt(REC.age, 1090) / PH.yr / 1000))},000 years old.</p>
<h4>Sound in the plasma</h4>
<p>Before recombination, photons and baryons move as one fluid with sound speed c<sub>s</sub> = c / √(3(1 + R)), where R = 3ρ<sub>b</sub>/4ρ<sub>γ</sub> = ${FIDBG.Rs.toFixed(2)} at z<sub>*</sub>. Each Fourier mode is a driven oscillator:</p>
<span class="eq">[(1 + R) Θ<sub>0</sub>′]′ + (k<sup>2</sup>/3) Θ<sub>0</sub> = −(k<sup>2</sup>/3)(1 + R) Ψ</span>
<span class="eq">⇒  Θ<sub>0</sub> + Ψ = (Ψ/3)[(1 + 3R) cos kr<sub>s</sub> − 3R]</span>
<p>Gravity shifts the zero point, so compressions (odd peaks) beat rarefactions (even peaks). The more baryons, the bigger the asymmetry. The sound horizon is r<sub>s</sub> = ∫c<sub>s</sub>dt/a ≈ ${FIDBG.rs.toFixed(0)} Mpc (comoving) at z<sub>*</sub>, and 147 Mpc at the baryon drag epoch. Seen from ${(FIDBG.DM / 1000).toFixed(1)} Gpc away it subtends</p>
<span class="eq">θ<sub>*</sub> = r<sub>s</sub> / D<sub>M</sub> ≈ ${FIDBG.theta.toFixed(4)} rad = ${(FIDBG.theta * 180 / Math.PI).toFixed(3)}°,  ℓ<sub>A</sub> = π/θ<sub>*</sub> ≈ ${nfmt(FIDBG.lA)}</span>
<p>Radiation driving shifts the phases, so the peaks sit near ℓ ≈ ℓ<sub>A</sub>(n − φ): 220, 530, 810. Photon diffusion erases small scales (Silk damping), with k<sub>D</sub><sup>−2</sup> = ∫dη [R<sup>2</sup>/(1+R) + 16/15] / [6(1+R)n<sub>e</sub>σ<sub>T</sub>a], giving k<sub>D</sub> ≈ ${FIDBG.kD.toFixed(2)} Mpc<sup>−1</sup>. Curvature changes D<sub>M</sub>: rays converge in a closed universe (Ω<sub>k</sub> &lt; 0), so the same ruler looks bigger.</p>
<h4>The model on screen</h4>
<span class="eq">D<sub>ℓ</sub> = ℓ(ℓ+1)C<sub>ℓ</sub>/2π ≈ T<sub>0</sub><sup>2</sup> ∫du Δ<sub>ζ</sub><sup>2</sup>(k) [S<sub>0</sub><sup>2</sup> + S<sub>1</sub><sup>2</sup> tanh<sup>2</sup>u] / cosh<sup>2</sup>u</span>
<span class="eq">k = (ℓ + ½) cosh u / D<sub>M</sub></span>
<p>S<sub>0</sub> is the effective temperature Θ<sub>0</sub> + Ψ above and S<sub>1</sub> the Doppler term. This thin-shell projection replaces j<sub>ℓ</sub><sup>2</sup>(x) by its average 1/(2x√(x<sup>2</sup> − ν<sup>2</sup>)). Potential decay uses the BBKS transfer function, with radiation driving, early and late ISW, reionisation (τ = 0.054) and a lensing-like smoothing. Eleven shape constants were fixed once by matching Planck's best fit. The result follows the measured spectrum to about 10% up to ℓ ≈ 2,000 and responds to each slider in the right direction, but it is not a Boltzmann code. h = 0.674 stays fixed and Ω<sub>Λ</sub> = 1 − Ω<sub>m</sub> − Ω<sub>r</sub> − Ω<sub>k</sub>.</p>
<p>The sky is a Gaussian random field: a<sub>ℓm</sub> are drawn from a fixed seed with ⟨|a<sub>ℓm</sub>|<sup>2</sup>⟩ = C<sub>ℓ</sub>, and ΔT = Σ a<sub>ℓm</sub>Y<sub>ℓm</sub> is summed with the stable Legendre recurrence and an FFT over m, up to ℓ = 511 on a 1024 × 512 grid (ℓ = 767 on 2048 × 1024 if you ask for it), in a worker thread. Moving a slider rescales the same a<sub>ℓm</sub>, so the spots morph instead of reshuffling. The colours span ±300 µK around T<sub>0</sub> = 2.7255 K. The rms is about 100 µK, a few parts in 10<sup>5</sup>. Our motion adds a 3.36 mK dipole.</p>
<h4>Filtering the sky</h4>
<p><em>Show on the sky</em> multiplies every a<sub>ℓm</sub> by a window W<sub>ℓ</sub>, so the phases stay fixed and one sky splits into its scales. A telescope beam of full width θ<sub>FWHM</sub> acts as</p>
<span class="eq">B<sub>ℓ</sub> = exp[−ℓ(ℓ+1)σ<sup>2</sup>/2],  σ = θ<sub>FWHM</sub> / √(8 ln 2)</span>
<p>COBE's radiometers had a 7° beam, so they saw only ℓ ≲ 20: the Sachs–Wolfe plateau, where waves were too long to have oscillated before last scattering. WMAP's 13′ W-band beam resolved the first peaks, and Planck's 5′ maps reach ℓ ≈ 2,000. The band-pass options keep one peak at a time. The first peak alone draws spots about 180°/ℓ<sub>1</sub> ≈ 0.8° across. The colour scale switches to about ±2.6σ of each filtered map.</p>
<h4>What is scaled for the screen</h4>
<p>Act I is a 2D box roughly 1.4 million light-years across at z = 1,500. It holds about one photon per two baryons instead of 1.6 billion per baryon. Particle and photon motion runs much faster than the cosmic clock. The sound-wave density contrast is exaggerated thousands of times. Helium (8% of nuclei) is drawn already neutral, since its electrons were captured between z ≈ 2,500 and 1,700. The orange glow marks where light scatters. The radiation itself never disappears; it streams freely and still fills space today.</p>
<h4>Hearing it</h4>
<p>The first-peak mode had half a wavelength equal to the sound horizon: about ${nfmt(Math.round(FIDBG.rs / (1 + FIDBG.zs) * 3.2616e6 / 1e4) * 1e4)} light-years at the time, a full wavelength near a million light-years, and a period of about two million years. The button plays the peaks as a fundamental with overtones 2, 3, 4… at their measured strengths, shifted up 53 octaves (a factor of 9 × 10<sup>15</sup>) into the range of a cello.</p>
<span class="cite">Peebles, P. J. E. (1968). Recombination of the primeval plasma. ApJ 153, 1.</span>

const LAY = { W: innerWidth, H: innerHeight, x0: 0, x1: innerWidth, y0: 54, y1: innerHeight - 58, cx: innerWidth / 2, cy: innerHeight / 2, small: SMALL, deck: false };
let layKey = '';
function updateLayout() {
  const W = innerWidth, H = innerHeight, small = window.matchMedia('(max-width: 760px)').matches;
  const open = deckEl.classList.contains('cz-open') && !document.body.classList.contains('cz-cinema');
  const r = open ? deckEl.getBoundingClientRect() : null;
  const bar = small ? 50 : 54, foot = small ? 52 : 58;
  let x1 = W, y1 = H - foot;
  if (open && !small) x1 = r.left - 8;
  if (open && small) y1 = r.top - 6;
  Object.assign(LAY, { W, H, x0: 0, x1, y0: bar, y1, cx: x1 / 2, cy: (bar + y1) / 2, small, deck: open });
  document.body.classList.toggle('fl-deckopen', open && small);
  const nr = notesEl && notesEl.getBoundingClientRect();
  LAY.notes = nr && nr.width && !document.body.classList.contains('cz-cinema') ? [nr.left, nr.top, nr.right, nr.bottom].map(Math.round) : null;
  const key = [W, H, x1, y1].map(Math.round).join(',');
  if (key !== layKey) {
    layKey = key; const rs = document.documentElement.style;
    rs.setProperty('--fl-cx', Math.round(LAY.cx) + 'px'); rs.setProperty('--fl-cy', Math.round(LAY.cy) + 'px');
    rs.setProperty('--fl-x1', Math.round(x1) + 'px'); rs.setProperty('--fl-y1', Math.round(y1) + 'px');
    const lw = small ? 112 : (W < 1100 ? 150 : 188);
    rs.setProperty('--fl-lw', lw + 'px');
    LAY.loupe = small ? { x: W - lw - 14, y: bar + 64, w: lw } : { x: x1 - lw - 30, y: y1 - lw - 96, w: lw };
    if (!small && H < 640) LAY.loupe.y = bar + 40;
    rs.setProperty('--fl-lx', LAY.loupe.x + 'px'); rs.setProperty('--fl-ly', LAY.loupe.y + 'px');
  }
}

const NOISE_GLSL = `
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

const P1 = {

  vec2 t = len>1e-3 ? d/len : vec2(1.,0.); vec2 n=vec2(-t.y,t.x); float w=aCol.w;
  vec2 p = mix(a,b,aC.x) + t*(aC.x*2.-1.)*w*.7 + n*aC.y*w;
  vCol=aCol.rgb; vY=aC.y; vec2 q=p/uRes*2.-1.; gl_Position=vec4(q.x,-q.y,0.,1.); }`, `#version 300 es
precision mediump float; in vec3 vCol; in float vY; out vec4 o;

layout(location=0) in vec4 aP; layout(location=1) in vec4 aC;
uniform vec2 uRes; uniform float uDpr; out vec4 vC; flat out float vT;
void main(){ vec2 q=aP.xy/uRes*2.-1.; gl_Position=vec4(q.x,-q.y,0.,1.); gl_PointSize=max(1.,aP.z*uDpr); vC=aC; vT=aP.w; }`, `#version 300 es

  if(vT<.5) a=exp(-r*r*4.5);

uniform vec4 uW[6]; uniform float uWC[6];

void main(){ vec2 px=vec2(vUv.x, 1.-vUv.y)*uRes;
  float d=0.; for(int i=0;i<6;i++) d += uW[i].w*cos(dot(uW[i].xy,px)+uW[i].z)*uWC[i];

/* ---- render targets ---- */
let RT1 = null;
function makeTarget(gl, w, hh) {
  const opts = [{ internal: gl.RGBA16F, type: gl.HALF_FLOAT }, { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE }];
  for (const o of opts) { try { return GLK.target(gl, { w, h: hh, internal: o.internal, type: o.type, format: gl.RGBA, filter: 'linear' }); } catch (e) { /* try next */ } }
  throw new Error('No renderable colour format');
}
function freeTarget(gl, t) { if (!t) return; gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }
function ensureRT1() {
  GLK.fit(cv1, DPR1);
  const w = cv1.width, hh = cv1.height;
  if (RT1 && RT1.w === w && RT1.h === hh) return;
  if (RT1) ['trail', 'scene', 'half', 'q1', 'q2'].forEach((k) => freeTarget(gl1, RT1[k]));
  const qw = Math.max(1, w >> 2), qh = Math.max(1, hh >> 2);
  RT1 = { w, h: hh, trail: makeTarget(gl1, w, hh), scene: makeTarget(gl1, w, hh), half: makeTarget(gl1, w >> 1, hh >> 1), q1: makeTarget(gl1, qw, qh), q2: makeTarget(gl1, qw, qh) };
  RT1.trail.bind(); gl1.clearColor(0, 0, 0, 1); gl1.clear(gl1.COLOR_BUFFER_BIT);
}

/* ---- geometry buffers ---- */
const NP = SMALL ? 1100 : 2600, NE = NP, NHE = Math.round(NP * 0.0816), NG = SMALL ? 700 : 1500, NLY = 180, NFL = 256;
const MAXSEG = NG * 9 + NLY * 2 + 3 * 120 * 7 + 64, MAXPTS = NP * 3 + NE + NHE * 2 + NFL * 2 + NG * 2 + 3 * 120 + 64;
const segData = new Float32Array(MAXSEG * 8), ptData = new Float32Array(MAXPTS * 8);
let nSeg = 0, nPts = 0;
const vaoSeg = gl1.createVertexArray(), vaoPts = gl1.createVertexArray();
const segBuf = gl1.createBuffer(), ptBuf = gl1.createBuffer(), cornerBuf = gl1.createBuffer();
gl1.bindVertexArray(vaoSeg);
gl1.bindBuffer(gl1.ARRAY_BUFFER, cornerBuf); gl1.bufferData(gl1.ARRAY_BUFFER, new Float32Array([0, -1, 1, -1, 0, 1, 1, 1]), gl1.STATIC_DRAW);
gl1.enableVertexAttribArray(0); gl1.vertexAttribPointer(0, 2, gl1.FLOAT, false, 0, 0);
gl1.bindBuffer(gl1.ARRAY_BUFFER, segBuf); gl1.bufferData(gl1.ARRAY_BUFFER, segData.byteLength, gl1.DYNAMIC_DRAW);
gl1.enableVertexAttribArray(1); gl1.vertexAttribPointer(1, 4, gl1.FLOAT, false, 32, 0); gl1.vertexAttribDivisor(1, 1);
gl1.enableVertexAttribArray(2); gl1.vertexAttribPointer(2, 4, gl1.FLOAT, false, 32, 16); gl1.vertexAttribDivisor(2, 1);
gl1.bindVertexArray(vaoPts);
gl1.bindBuffer(gl1.ARRAY_BUFFER, ptBuf); gl1.bufferData(gl1.ARRAY_BUFFER, ptData.byteLength, gl1.DYNAMIC_DRAW);
gl1.enableVertexAttribArray(0); gl1.vertexAttribPointer(0, 4, gl1.FLOAT, false, 32, 0);
gl1.enableVertexAttribArray(1); gl1.vertexAttribPointer(1, 4, gl1.FLOAT, false, 32, 16);
gl1.bindVertexArray(null);

function seg(x0, y0, x1, y1, r, g, b, w) {
  if (nSeg >= MAXSEG) return; const o = nSeg++ * 8;
  segData[o] = x0; segData[o + 1] = y0; segData[o + 2] = x1; segData[o + 3] = y1; segData[o + 4] = r; segData[o + 5] = g; segData[o + 6] = b; segData[o + 7] = w;
}

  const bar = $('fl-mfp-bar'); bar.style.width = Math.min(mw, maxW).toFixed(1) + 'px'; bar.classList.toggle('fl-over', mw > maxW);
  $('fl-ly-bar').style.width = (1e5 * (1 + z) * PX_PER_COMOVING_LY).toFixed(1) + 'px';

    if (!ctaEl.classList.contains('on')) { ctaEl.classList.add('on'); S1.ctaAt = since; }

let ui2Clock = 0, specClock = 0;

  if (specClock > (Sound.hearing ? 0.05 : 0.2)) { specClock = 0; drawSpec(); drawLadder(); }

  // range for the legend
  const want = A2.dipole ? 3500 : A2.range; TR2.range += (want - TR2.range) * Math.min(1, dt * 4);

  const p1 = SPEC.peaks[0] || { l: 0, D: 0 }, spotDeg = 180 / Math.max(1, p1.l);
  hud[0].set('T₀ = 2.7255 K · colours ±' + (TR2.range > 1000 ? (TR2.range / 1000).toFixed(1) + ' mK' : Math.round(TR2.range) + ' µK'));
  hud[1].set('ℓ₁ = ' + p1.l + ' · spots ≈ ' + spotDeg.toFixed(2) + '°');
  hud[2].set(MAP.have ? 'ℓ ≤ ' + MAP.L + (A2.filter === 'all' ? '' : A2.filter === 'cobe' ? ' · COBE beam' : A2.filter === 'wmap' ? ' · WMAP beam' : ' · band-passed') + ' · rms ' + MAP.rms.toFixed(0) + ' µK · ' + MAP.ms + ' ms' : 'synthesising…');
  const ok = A2.params.ok; hud[3].set('Ωk = ' + (ok > 0 ? '+' : '') + ok.toFixed(3) + ' ' + (Math.abs(ok) < 0.003 ? 'flat' : ok < 0 ? 'closed' : 'open') + ' · ΩΛ = ' + SPEC.bg.OL.toFixed(3));
  $('fl-lspot').textContent = LAY.small ? 'spots ≈ ' + spotDeg.toFixed(2) + '°' : 'ℓ₁ = ' + p1.l + ' → spots ≈ 180°/ℓ₁ = ' + spotDeg.toFixed(2) + '°';
  const lk = $('fl-lkey'), lkW = LAY.small ? '<b>1°</b> bar · ring = Moon' : '<b>1°</b> bar · dashed ring = full Moon'; if (lk._w !== lkW) { lk._w = lkW; lk.innerHTML = lkW; }
  // loupe geometry: 1° bar and the Moon (0.52°) in SVG units (loupe radius = 50 units = 4°)
  const u = 50 * Math.tan(Math.PI / 180) / Math.tan(LOUPE_R * Math.PI / 180);
  const bar = document.querySelector('#fl-lbar'); if (bar) { const ls = bar.children; ls[0].setAttribute('x1', 50 - u / 2); ls[0].setAttribute('x2', 50 + u / 2); ls[1].setAttribute('x1', 50 - u / 2); ls[1].setAttribute('x2', 50 - u / 2); ls[2].setAttribute('x1', 50 + u / 2); ls[2].setAttribute('x2', 50 + u / 2); }
  const moon = document.querySelector('#fl-lmoon circle'); if (moon) moon.setAttribute('r', (u * 0.26).toFixed(2));
  // hover tooltip
  if (hover.on && hover.n && !CAM.dragging && !trans) {
    const n = hover.n, T = skyAt(n), l = ((Math.atan2(n[0], n[2]) * 180 / Math.PI) + 360) % 360, b = Math.asin(U.clamp(n[1], -1, 1)) * 180 / Math.PI;
    tipEl.innerHTML = 'ΔT <b style="color:' + (T >= 0 ? '#ffb070' : '#8fc2ff') + '">' + (T >= 0 ? '+' : '−') + Math.abs(T).toFixed(0) + ' µK</b> · l ' + l.toFixed(1) + '° b ' + (b >= 0 ? '+' : '−') + Math.abs(b).toFixed(1) + '°';
    tipEl.style.left = (hover.x + 16) + 'px'; tipEl.style.top = (hover.y + 14) + 'px'; tipEl.classList.add('on');
  } else tipEl.classList.remove('on');

  if (showObs) { const m = CM.vp, w = m[15]; const sx = (m[12] / w * 0.5 + 0.5) * LAY.W, sy = (0.5 - m[13] / w * 0.5) * LAY.H; obsTag.style.left = (sx + 30) + 'px'; obsTag.style.top = (sy - 7) + 'px'; }
  obsTag.classList.toggle('on', showObs);
  // hearing captions

}
function refreshSpectrum() {

  const p1 = SPEC.peaks[0] || { l: 0, D: 0 }, bg = SPEC.bg;
  ro6.l1.set(String(p1.l)); ro6.D1.set(F.num(Math.round(p1.D)) + ' µK²');

/* ---- keys ---- */
ch.onKey('1', () => goAct(1), 'Act I · the fog lifts');
ch.onKey('2', () => goAct(2), 'Act II · the oldest light');
ch.onKey('r', () => { if (act === 1) replay1(); else resetParams(); }, 'Replay (Act I) · Planck values (Act II)');
ch.onKey('v', () => { if (act !== 2) goAct(2); const order = ['outside', 'inside', 'moll']; setView(order[(order.indexOf(CAM.view) + 1) % 3]); }, 'Cycle view: outside, inside, Mollweide');
ch.onKey('b', () => toggleHear(), 'Hear the Big Bang');
ch.onKey('g', () => newSky(), 'New random sky');
ch.onKey('l', () => { A2.loupe = !A2.loupe; const t = document.getElementById('fl-loupe'); if (t) t.checked = A2.loupe; }, 'Toggle the loupe');
ctaEl.addEventListener('click', () => { autoAdvanced = true; goAct(2); });
[zSlider.input].forEach((el) => el.addEventListener('pointerdown', () => { userTouchedAct1 = true; }));
['fl-replay', 'fl-hold', 'fl-speed'].forEach((id) => { const el = document.getElementById(id); if (el) el.addEventListener('pointerdown', () => { userTouchedAct1 = true; }); });
ch.onSound((on) => { if (on) Sound.ensure(); else if (Sound.hearing) toggleHear(); });
ch.onResize(() => { updateLayout(); drawXe(); drawSpec(); drawGeo(); });

/* ---- local workaround: the shared help overlay can render its key list as "[object HTMLElement]" ---- */
const HELP_KEYS = [['Space', 'Pause / play'], ['H', 'Hide the interface'], ['N', 'Field notes'], ['C', 'Controls'], ['M', 'Sound'], ['F', 'Fullscreen'], ['[ ]', 'Previous / next chapter'], ['?', 'This help'],
  ['1', 'Act I · the fog lifts'], ['2', 'Act II · the oldest light'], ['R', 'Replay (Act I) · Planck values (Act II)'], ['V', 'Cycle view: outside, inside, Mollweide'], ['B', 'Hear the Big Bang'], ['G', 'New random sky'], ['L', 'Toggle the loupe']];
new MutationObserver((muts) => {
  for (const m of muts) for (const n of m.addedNodes) {
    if (!n.classList || !n.classList.contains('cz-help')) continue;
    const dl = n.querySelector('dl'); if (!dl || dl.textContent.indexOf('[object') < 0) continue;
    dl.textContent = '';
    HELP_KEYS.forEach(([k, d]) => { dl.append(h('dt', {}, h('kbd', { text: k })), h('dd', { style: { margin: 0 }, text: d })); });
  }
}).observe(document.body, { childList: true });

/* ---- init ---- */
initAct1();
settleBound(Math.round((1 - xeAt(1500, false)) * NP));
showGroups(1); setHudLabels(); setPlaying(true);
strip1.style.opacity = '1';
refreshSpectrum(); // fills readouts, charts, sound tuning, and the first map request
drawXe();

let lastNow = performance.now(), layoutClock = 0, lastSpecAt = 0;
const T_START = performance.now();
const PERF = { a1: 0, a2: 0 };
ch.loop((dt, t) => {
  const now = performance.now(), rdt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  layoutClock += rdt; if (layoutClock > 0.25 || trans) { layoutClock = 0; updateLayout(); }
  stepGlide(rdt);
  if (specDirty && now - lastSpecAt > 60) { lastSpecAt = now; refreshSpectrum(); }
  Sound.update();
  stepTrans(rdt);
  const show1 = act === 1 || (trans && trans.kind === '1to2' && trans.t < 2.4);
  const show2 = act === 2 || (trans && trans.kind === '2to1');
  const tA = performance.now();
  if (show1 && !ch.paused) frameAct1(dt, t);

  if (act === 1) updateOverlaysAct1(dt);

    renderAct2(t, rdt);
