<script>
(function () {
'use strict';

/* =====================================================================
   09 · THE PALE BLUE DOT
   A ray-traced Earth through 4.5 billion years: single-scattering
   Rayleigh + Mie atmosphere (Nishita et al. 1993), illustrative plate
   motion on the sphere, and a keyframed history of the planet.
   ===================================================================== */

const NOTES = `
<p>This is Earth, drawn live by tracing a ray of light through every pixel. The blue edge of the planet, the orange band along the line between day and night and the thin bright rim all come from one equation. Air molecules scatter blue light about five to six times more strongly than red, and the model follows sunlight through the air to your eye.</p>
<p>The ribbon at the bottom is 4.5 billion years long. At the start the planet is a glowing magma ocean and the newborn Moon hangs close. Scrub forward and the steam rains out into the first ocean. An orange haze hides a strange water world, oxygen turns the sky blue, ice swallows the planet twice, plants green the land, and the continents gather into Pangaea and drift apart again.</p>
<p>The window in the controls stands you on the ground at 30° north, looking east, while the planet turns. Dawn, day, dusk and night come round at the pace of that epoch’s day.</p>
<p>The readouts are real estimates from rocks, fossils and physics: the length of the day read from tidal layers in old sediments, the Moon’s distance, the dimmer young Sun, the oxygen and carbon dioxide in the air. The oldest values are uncertain, sometimes by a lot. The Science tab says where each one comes from.</p>
<h4>Try this</h4>
<ul>
<li>Drag the ribbon slowly from the magma ocean to today and watch the colour of the planet’s edge.</li>
<li>Press <strong>Theia impact</strong> <kbd>T</kbd> to see the collision that made the Moon, then <strong>Chicxulub</strong> <kbd>K</kbd> to end the age of dinosaurs.</li>
<li>Watch <strong>Standing on the surface</strong> in the controls. It is the same light calculation seen from the ground: a hazy orange dawn in the Archean, a blue sky after the Great Oxidation, and a Moon several times wider than today’s low over the magma ocean.</li>
<li>Let the tour run to the end, or drag the planet round to the night side. Only the last sliver of the ribbon has city lights. Hold <kbd>Shift</kbd> and drag to move the Sun.</li>
</ul>`;

const SCIENCE = `
<h4>Why the sky is blue</h4>
<p>Molecules much smaller than a wavelength scatter light with a strength that rises as the inverse fourth power of wavelength. The model uses the standard sea-level coefficients for air, and each species thins out exponentially with height:</p>
<span class="eq">β<sub>R</sub>(λ) ∝ λ<sup>−4</sup></span>
<p>At sea level β<sub>R</sub> = (5.8, 13.5, 33.1) × 10<sup>−6</sup> m<sup>−1</sup> for red, green and blue light (680, 550 and 440 nm).</p>
<span class="eq">ρ(h) = e<sup>−h/H</sup>, &nbsp; H<sub>R</sub> = 8 km, &nbsp; H<sub>M</sub> = 1.2 km</span>
<p>(680/440)<sup>4</sup> ≈ 5.7, which is why the blue coefficient is 5.7 times the red one. Aerosols (Mie scattering) are grey, with β<sub>M</sub> = 21 × 10<sup>−6</sup> m<sup>−1</sup> and a strong forward lobe. For every pixel the shader integrates single scattering along the view ray, as in Nishita et al. (1993):</p>
<span class="eq">L(λ) = ∫ I<sub>☉</sub> T(P→☉) [β<sub>R</sub>ρ<sub>R</sub>P<sub>R</sub>(θ) + β<sub>M</sub>ρ<sub>M</sub>P<sub>M</sub>(θ)] T(P→eye) ds</span>
<span class="eq">T = exp(−∫ β<sub>e</sub> ρ ds), &nbsp; P<sub>R</sub> = <sup>3</sup>⁄<sub>16π</sub>(1 + cos²θ)</span>
<p>P<sub>M</sub> is the Cornette–Shanks phase function with g = 0.76. The view ray is cut into 8 to 32 segments, and within each segment the densities and the attenuated integrand are treated as exponentials, which is exact for an exponential atmosphere between the sample points. The optical depth toward the Sun from each point uses the Chapman grazing-incidence function in closed form, so the planet’s own shadow falls on its atmosphere. Long, low sunlight loses its blue on the way in, and that gives the orange terminator. Surfaces reflect as Lambertian (albedo/π) plus a GGX sun glint on water.</p>

<h4>The faint young Sun</h4>
<span class="eq">L(t) = L<sub>☉</sub> / [1 + 0.4 (1 − t/t<sub>☉</sub>)], &nbsp; t<sub>☉</sub> = 4.57 Gyr</span>
<p>Gough’s fit to solar models gives 72% of today’s luminosity 4.5 billion years ago, 75% at 3.8 Ga and 83% at 2.4 Ga. The shader dims the Sun by exactly this factor. With today’s air, that Sun could not keep the oceans liquid before about 2 Ga, yet zircons show liquid water by 4.4 Ga (Wilde et al. 2001). Stronger greenhouse warming from CO₂ and methane is the usual answer. This is the faint young Sun paradox (Sagan &amp; Mullen 1972).</p>

<h4>Oxygen, haze and the Great Oxidation Event</h4>
<p>Before about 2.4 Ga, sulfur isotopes show that O₂ was below about 10<sup>−5</sup> of today’s level. Methane from microbes could then build an organic haze like Titan’s, which absorbs blue light and scatters orange: a “pale orange dot” (Arney et al. 2016). The model adds it as an extra aerosol layer (scale height 25 km) with blue-heavy extinction and an orange single-scattering albedo. Around 2.4–2.1 Ga, oxygen from cyanobacteria overwhelmed its sinks. The haze collapsed, iron rusted out of the oceans into banded iron formations, and red beds appeared on land. Oxygen then stayed low, perhaps 0.1–1% of today, until it rose again late in the Neoproterozoic (Lyons, Reinhard &amp; Planavsky 2014).</p>

<h4>Snowball Earth</h4>
<p>Twice, in the Sturtian (717–660 Ma) and Marinoan (about 650–635 Ma) glaciations, ice reached the equator. Ice reflects sunlight, which cools the planet and grows more ice, a runaway feedback. With the ocean sealed, volcanic CO₂ built up for millions of years until a greenhouse of order 0.1 bar melted everything fast, leaving cap carbonates on top of the glacial deposits (Hoffman et al. 1998).</p>

<h4>Tides and the length of the day</h4>
<p>The Moon raises tides, and friction drags the tidal bulge ahead of the Moon. That bulge pulls the Moon forward, so the Moon climbs outward while Earth’s spin slows. Lunar laser ranging measures the recession today at 3.8 cm per year. The total angular momentum stays fixed, which ties the day length to the Moon’s distance:</p>
<span class="eq">C ω + M<sub>☾</sub> √(G M a) = constant, &nbsp; S<sub>0</sub> = 5.86 × 10<sup>33</sup>, &nbsp; L<sub>orb,0</sub> = 2.89 × 10<sup>34</sup> kg m² s<sup>−1</sup></span>
<p>The model sets the day length from geological data and computes the distance from this relation. It gives 341,000 km at 1.4 Ga, where cyclostratigraphy gives 18.7 h days and about 341,000 km (Meyers &amp; Malinverno 2018), and 370,000 km at 620 Ma, where tidal rhythmites give 21.9 h and 58.2 Earth radii (Williams 2000). A 5.5 h day puts the newborn Moon near 39,000 km, about six Earth radii. Solar tides and the ocean’s changing response are ignored, and some work suggests the day stalled near 19 h for a billion years in the Proterozoic.</p>

<h4>Plate tectonics and the Wilson cycle</h4>
<p>Each rigid plate rotates about its own Euler pole, so a point on it moves at v = ω × r, a few centimetres a year. The continents gather into a supercontinent and break up again roughly every 500–700 million years: Columbia (Nuna), Rodinia and Pangaea. Here seven continental plates follow</p>
<span class="eq">R<sub>k</sub>(t) = Rot(ê<sub>2k</sub>, B<sub>k</sub> sin φ) · Rot(ê<sub>1k</sub>, A<sub>k</sub>(1 − cos φ)), &nbsp; φ = 2π (270 Ma − t) / 750 Myr</span>
<p>and the continental noise is evaluated in each plate’s own rotated frame, so coastlines ride with their plate. Where two continents overlap, the shader raises a mountain belt. The assemblies fall at 270 Ma, 1.02 Ga, 1.77 Ga and 2.52 Ga, close to Pangaea, Rodinia, Columbia and Kenorland. The geography itself is illustrative, not a reconstruction.</p>

<h4>Aurorae</h4>
<p>The faint green ovals on the night side are aurorae, near 67° magnetic latitude and centred on the magnetic poles, which sit about 9° from the spin axis. Solar-wind particles funnelled down by the magnetic field make oxygen atoms glow at 557.7 nm around 100–150 km up, with a fainter red 630.0 nm fringe higher still. They fade in around 3.5 Ga, close to the oldest well-dated evidence for a geodynamo, 3.4–3.45 Ga (Tarduno et al. 2010).</p>

<h4>Standing on the surface</h4>
<p>The window in the controls runs the same shader a second time, from a camera 1.5 km above the ground at 30° N, looking east. Sun, Moon and stars stay fixed in space while the planet turns under the camera, so sunrise, sunset and the stars come from geometry, not animation. The colours come from the same integral: a long, low path strips the blue from sunrise, the Archean haze turns the whole sky orange, and a snowball planet lies white under a blue sky. Stars fade when the sky outshines them, as they would for a camera. The Moon’s apparent width is</p>
<span class="eq">θ<sub>☾</sub> = 2 arcsin(R<sub>☾</sub> / d), &nbsp; R<sub>☾</sub> = 1,737 km</span>
<p>which gives 0.52° today and about 5° for a Moon 6 Earth radii away. Clouds are left out of this view, because in the model they are painted on the sphere. One day of the epoch takes 20 s (5.5 h) to 40 s (24 h).</p>

<h4>The Pale Blue Dot</h4>
<p>On 14 February 1990, Voyager 1 turned back from about 6 billion km and photographed Earth as a speck less than a pixel wide, sitting in a band of scattered sunlight. Sagan called it “a mote of dust suspended in a sunbeam.”</p>

<h4>What is simplified</h4>
<p>Earth’s radius is one unit (6,371 km) and the air is drawn to scale, so from this distance the 8 km scale height is under a pixel. The <em>Atmosphere scale</em> control stretches the scale heights by a factor k and divides the coefficients by k, which keeps the vertical optical depth (and so the colours) unchanged while making the shell visible. Scattering is single-scattering only, so twilight is slightly too dark. Clouds, terrain and colours are procedural; the brightest glows (magma, the debris disk, the fireball) are compressed, since true blackbody ratios would saturate any screen. Distances, temperatures and gas levels before 541 Ma are uncertain by large factors, and early values (Hadean temperature, CO₂) are model estimates. The planet spins at a visible rate scaled to the day length (24 h ≈ 40 s), and the Moon is placed where you can see it, at its true distance for the epoch. Clouds are a single layer with shading from a sample taken toward the Sun, not a true volume. City lights are drawn on a procedural population field in the style of NASA’s Black Marble composites, not on real cities. In the Pale Blue Dot view the camera stops at 17 million km, where Earth is about a pixel wide in this wide lens; Voyager’s telephoto camera saw it at 0.12 pixel from 6 billion km.</p>
<span class="cite">Nishita, T., Sirai, T., Tadamura, K. &amp; Nakamae, E. (1993). Display of the Earth taking into account atmospheric scattering. Proc. SIGGRAPH ’93, 175–182.</span>
<span class="cite">Gough, D. O. (1981). Solar interior structure and luminosity variations. Solar Physics 74, 21–34.</span>
<span class="cite">Lyons, T. W., Reinhard, C. T. &amp; Planavsky, N. J. (2014). The rise of oxygen in Earth’s early ocean and atmosphere. Nature 506, 307–315.</span>
<span class="cite">Hoffman, P. F., Kaufman, A. J., Halverson, G. P. &amp; Schrag, D. P. (1998). A Neoproterozoic snowball Earth. Science 281, 1342–1346.</span>
<span class="cite">Williams, G. E. (2000). Geological constraints on the Precambrian history of Earth’s rotation and the Moon’s orbit. Rev. Geophys. 38, 37–59.</span>
<span class="cite">Meyers, S. R. &amp; Malinverno, A. (2018). Proterozoic Milankovitch cycles and the history of the solar system. PNAS 115, 6363–6368.</span>
<span class="cite">Wilde, S. A., Valley, J. W., Peck, W. H. &amp; Graham, C. M. (2001). Evidence from detrital zircons for the existence of continental crust and oceans on the Earth 4.4 Gyr ago. Nature 409, 175–178.</span>
<span class="cite">Sagan, C. &amp; Mullen, G. (1972). Earth and Mars: evolution of atmospheres and surface temperatures. Science 177, 52–56.</span>
<span class="cite">Wilson, J. T. (1966). Did the Atlantic close and then re-open? Nature 211, 676–681.</span>
<span class="cite">Arney, G. et al. (2016). The pale orange dot: the spectrum and habitability of hazy Archean Earth. Astrobiology 16, 873–899.</span>
<span class="cite">Canup, R. M. &amp; Asphaug, E. (2001). Origin of the Moon in a giant impact near the end of the Earth’s formation. Nature 412, 708–712.</span>
<span class="cite">Tarduno, J. A. et al. (2010). Geodynamo, solar wind, and magnetopause 3.4 to 3.45 billion years ago. Science 327, 1238–1240.</span>
<span class="cite">Sagan, C. (1994). Pale Blue Dot: A Vision of the Human Future in Space. Random House.</span>`;

const ch = Cosmos.chapter({ id: 'earth', notes: NOTES, science: SCIENCE });
const U = Cosmos.util;
const small = () => window.matchMedia('(max-width: 760px)').matches;

/* =====================================================================
   1. DEEP TIME: the ribbon mapping (position 0..1 ↔ age in Ma)
   Eons get space in proportion to what happens in them; the Quaternary
   tail is stretched so the Last Glacial Maximum and "now" can be reached.
   ===================================================================== */
const MAP = [[0, 4500], [0.12, 4000], [0.33, 2500], [0.60, 541], [0.955, 2.58], [0.975, 0.02], [0.99, 0.0117], [0.996, 0.0002], [1, 0]];
function ageAt(pos) {
  pos = U.clamp(pos, 0, 1);
  for (let i = 0; i < MAP.length - 1; i++) {
    const a = MAP[i], b = MAP[i + 1];
    if (pos <= b[0]) return a[1] + (b[1] - a[1]) * (pos - a[0]) / (b[0] - a[0]);
  }
  return 0;
}
function posAt(age) {
  age = U.clamp(age, 0, 4500);
  for (let i = 0; i < MAP.length - 1; i++) {
    const a = MAP[i], b = MAP[i + 1];
    if (age >= b[1]) return a[0] + (b[0] - a[0]) * (a[1] - age) / (a[1] - b[1]);
  }
  return 1;
}
const EONS = [
  { name: 'Hadean', from: 4500, to: 4000, col: '#c2471f' },
  { name: 'Archean', from: 4000, to: 2500, col: '#c98a3a' },
  { name: 'Proterozoic', from: 2500, to: 541, col: '#7f9aa6' },
  { name: 'Phanerozoic', from: 541, to: 0, col: '#5cc8ff' },
];
function eonOf(age) { for (const e of EONS) if (age <= e.from && age >= e.to) return e; return EONS[3]; }
function periodOf(age) {
  const P = [[4500, 'Hadean'], [4000, 'Eoarchean'], [3600, 'Paleoarchean'], [3200, 'Mesoarchean'], [2800, 'Neoarchean'], [2500, 'Paleoproterozoic'], [1600, 'Mesoproterozoic'], [1000, 'Tonian'], [720, 'Cryogenian'], [635, 'Ediacaran'],
    [541, 'Cambrian'], [485.4, 'Ordovician'], [443.8, 'Silurian'], [419.2, 'Devonian'], [358.9, 'Carboniferous'], [298.9, 'Permian'], [251.9, 'Triassic'], [201.4, 'Jurassic'], [145, 'Cretaceous'], [66, 'Paleogene'], [23.03, 'Neogene'], [2.58, 'Quaternary']];
  let n = P[0][1]; for (const [a, name] of P) if (age <= a) n = name; return n;
}

/* =====================================================================
   2. KEYFRAMES: what the planet looks like (shader parameters)
   Each row overrides only what changes; values carry forward.
   ice/seaIce: latitude (deg) poleward of which land / sea is ice-covered.
   ===================================================================== */
const KF_RAW = [
  [4500, { magma: 1, crack: 0, water: 0, sea: 0, cont: 0, isl: 0, ice: 95, seaIce: 95, veg: 0, mats: 0, red: 0, bif: 0, coal: 0, desert: 0, ferrous: 0, cloud: 0.18, storm: 0.7, press: 2.2, mie: 3, haze: 0, steam: 0.55, lava: 1 }],
  [4470, { magma: 0.55, crack: 1 }],
  [4430, { magma: 0.08, crack: 0.8, steam: 0.7, cloud: 0.35 }],

  [4000, { crack: 0.1, sea: 0.3, cont: 0.2, isl: 0.55, lava: 0.5, steam: 0.08, press: 1.5, mie: 1.5, cloud: 0.45, storm: 0.8, ferrous: 0.85 }],

  [2750, { haze: 1, cont: 0.66, isl: 0.2, sea: 0.12 }],

  vec3 i = floor(x), f = fract(x); float d1 = 8.0, d2 = 8.0;
  for (int k = -1; k <= 1; k++) for (int j = -1; j <= 1; j++) for (int m = -1; m <= 1; m++) {
    vec3 g = vec3(float(m), float(j), float(k)); vec3 r = g + ih33(i + g) - f; float d = dot(r, r);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
  }
  return sqrt(vec2(d1, d2));
}
// blackbody at 610 / 550 / 465 nm, scaled so 1800 K ≈ 1 in green
vec3 glow(float T) { T = max(T, 300.0); return vec3(11.84, 19.87, 46.0) / (exp(min(vec3(23587.0, 26160.0, 30942.0) / T, 80.0)) - 1.0) * 1.0e5; }

vec3 glowC(float T, float k) { vec3 g = glow(T); return g / max(g.r, 1e-6) * k * pow(T / 1800.0, 1.5); }
vec2 sph(vec3 ro, vec3 rd, vec3 c, float r) {
  vec3 oc = ro - c; float b = dot(oc, rd); vec3 q = oc - b * rd; float h = r * r - dot(q, q);
  if (h < 0.0) return vec2(-1.0); h = sqrt(h); return vec2(-b - h, -b + h);
}

/* ---------- atmosphere ---------- */
float chap(float x, float cz) {   // Chapman grazing-incidence function, x = (R+h)/H
  float c = sqrt(1.5707963 * x);
  if (cz >= 0.0) return c / ((c - 1.0) * cz + 1.0);
  float s = sqrt(max(0.0, 1.0 - cz * cz)), x0 = x * s, c0 = sqrt(1.5707963 * x0);
  return 2.0 * c0 * exp(min(x - x0, 70.0)) - c / ((c - 1.0) * (-cz) + 1.0);
}
float column(float h, float cz, float H) { return H * exp(-h / H) * chap((1.0 + h) / H, cz); }
float aH() { return uAerP.y * uAtmK; }
vec3 aerB() { return uAerK * (uAerP.x / aH()); }
vec3 sunTrans(float h, float cz) {
  if (uAtmOn < 0.5) return vec3(smoothstep(-0.02, 0.03, cz));
  if (cz < 0.0 && (1.0 + h) * sqrt(1.0 - cz * cz) < 1.0) return vec3(0.0);   // ray into the ground
  vec3 tau = BR0 * uPress / uAtmK * column(h, cz, HR) + (BM0 * uMie / 0.9 / uAtmK) * column(h, cz, HM) + aerB() * column(h, cz, aH());
  return exp(-tau);
}
// log-mean of two samples of an exponential, given their logarithms: the exact segment average
float lmL(float a, float b, float la, float lb) { float d = la - lb; return abs(d) < 1e-3 ? 0.5 * (a + b) : (a - b) / d; }
vec3 lmL3(vec3 a, vec3 b, vec3 la, vec3 lb) { return vec3(lmL(a.x, b.x, la.x, lb.x), lmL(a.y, b.y, la.y, lb.y), lmL(a.z, b.z, la.z, lb.z)); }
void scatter(vec3 ro, vec3 rd, float t0, float t1, vec3 L, float jit, out vec3 ins, out vec3 tr) {
  // Single scattering (Nishita et al. 1993). The view ray is cut into N segments; along each
  // segment the densities and the attenuated integrand are treated as exponentials
  // (log-space trapezoid), exact for an exponential atmosphere between sample points.
  int N = int(clamp((t1 - t0) / 0.006, 8.0, 32.0));
  float dt = (t1 - t0) / float(N);
  float mu = dot(rd, L);
  float pR = 0.0596831 * (1.0 + mu * mu);
  const float g = 0.76; const float g2 = g * g;
  float pM = 0.1193662 * (1.0 - g2) * (1.0 + mu * mu) / ((2.0 + g2) * pow(1.0 + g2 - 2.0 * g * mu, 1.5));
  float ga = uAerP.z; float pA = 0.0795775 * (1.0 - ga * ga) / pow(1.0 + ga * ga - 2.0 * ga * mu, 1.5);
  vec3 bR = BR0 * uPress / uAtmK; float bMs = BM0 * uMie / uAtmK, bMe = bMs / 0.9; vec3 bA = aerB(); float HA = aH();
  vec3 invH = 1.0 / vec3(HR, HM, HA);
  vec3 sR = vec3(0.0), sM = vec3(0.0), sA = vec3(0.0);
  vec3 od = vec3(0.0);            // view-ray columns: (Rayleigh, Mie, aerosol)
  vec3 rhoP = vec3(0.0), lrP = vec3(0.0);
  vec3 fRp = vec3(0.0), fMp = vec3(0.0), fAp = vec3(0.0), ltP = vec3(0.0);
  for (int i = 0; i <= 32; i++) {
    if (i > N) break;
    float t = t0 + float(i) * dt;
    vec3 pos = ro + rd * t; float r = length(pos); float h = max(r - 1.0, 0.0);
    vec3 lr = -h * invH; vec3 rho = exp(lr);
    if (i > 0) od += dt * vec3(lmL(rhoP.x, rho.x, lrP.x, lr.x), lmL(rhoP.y, rho.y, lrP.y, lr.y), lmL(rhoP.z, rho.z, lrP.z, lr.z));
    float cz = dot(pos, L) / r;
    vec3 tau = vec3(80.0);
    if (!(cz < 0.0 && r * sqrt(1.0 - cz * cz) < 1.0))
      tau = min(bR * (od.x + column(h, cz, HR)) + bMe * (od.y + column(h, cz, HM)) + bA * (od.z + column(h, cz, HA)), vec3(80.0));
    vec3 T = exp(-tau);
    vec3 fR = T * rho.x, fM = T * rho.y, fA = T * rho.z;
    if (i > 0) {
      sR += dt * lmL3(fRp, fR, -ltP + lrP.x, -tau + lr.x);
      sM += dt * lmL3(fMp, fM, -ltP + lrP.y, -tau + lr.y);
      sA += dt * lmL3(fAp, fA, -ltP + lrP.z, -tau + lr.z);
    }
    rhoP = rho; lrP = lr; fRp = fR; fMp = fM; fAp = fA; ltP = tau;
  }
  ins = uSunI * (sR * bR * pR + sM * bMs * pM + sA * bA * uAerAlb * pA);
  tr = exp(-(bR * od.x + bMe * od.y + bA * od.z));
}

/* ---------- terrain: continents carried by rotating plates ---------- */
struct Terr { float e; float ec; float coll; float bnd; float d; vec3 g; };
Terr terrain(vec3 p) {
  Terr T;
  float best = -3.0, sec = -3.0; int bk = -1;
  for (int k = 0; k < 7; k++) {
    float rad = uContRad[k] * uCont;
    if (rad < 0.012) continue;
    float ang = acos(clamp(dot(p, uPlateC[k]), -1.0, 1.0));
    if (ang > rad * 1.9 + 0.16) continue;
    vec3 q = uPlateRT[k] * p;                    // domain-rotate into the plate's frame
    float f = (1.0 - ang / rad) * 0.6 + fbmG(q * 2.1, 3) * 0.95;
    if (f > best) { sec = best; best = f; bk = k; } else if (f > sec) sec = f;
  }
  vec3 q = p; mat3 RT = mat3(1.0);
  if (bk >= 0) { RT = uPlateRT[bk]; q = RT * p; }
  float ec = clamp(best, -1.2, 1.0);
  float coll = bk >= 0 ? smoothstep(-0.12, 0.22, sec) * smoothstep(-0.1, 0.2, best) : 0.0;
  vec3 w = vec3(gnoise(q * 2.7), gnoise(q * 2.7 + 17.1), gnoise(q * 2.7 + 31.7));
  int oct = int(clamp(log2(0.45 / (5.0 * gFoot)) + 1.0, 2.0, 7.0));
  vec4 D = fbmD(q * 5.0 + w * 0.6, oct);
  float amp = 0.28 + 0.4 * coll;
  // ridged mountain ranges (analytic gradients so the relief shades correctly)
  float mm = smoothstep(0.02, 0.35, ec) * (0.3 + 1.2 * coll);
  vec4 r1 = noised(q * 7.0 + w * 1.2), r2 = noised(q * 16.0 + w * 1.8 + 3.0);
  float a1 = 1.0 - abs(r1.x), a2 = 1.0 - abs(r2.x);
  vec3 g1 = -2.0 * a1 * sign(r1.x) * r1.yzw * 7.0, g2 = -2.0 * a2 * sign(r2.x) * r2.yzw * 16.0;
  float e = ec * 0.8 + 0.05 + D.x * amp + mm * (0.3 * a1 * a1 + 0.13 * a2 * a2);
  // volcanic islands (Hadean / Archean): hotspots in the body frame
  if (uIsl > 0.001) {
    float isl = smoothstep(0.04, 0.3, gnoise(p * 6.0 + 11.0) + 0.5 * D.x - (1.0 - uIsl) * 0.6);
    e = mix(e, max(e, uSea + 0.06 + D.x * 0.35 + 0.15 * isl), isl);
  }
  // plate boundaries (Voronoi over all twelve plates) → mid-ocean ridges
  float d1 = -2.0, d2 = -2.0;
  for (int k = 0; k < 12; k++) { float d = dot(p, uPlateC[k]); if (d > d1) { d2 = d1; d1 = d; } else if (d > d2) d2 = d; }
  float bnd = (d1 - d2) + gnoise(p * 9.0) * 0.012;
  if (e < -0.5) e += (1.0 - smoothstep(0.0, 0.03, bnd)) * 0.15;
  T.e = e - uSea; T.ec = ec - uSea; T.coll = coll; T.bnd = bnd; T.d = D.x;
  T.g = transpose(RT) * (D.yzw * 5.0 * amp + mm * (0.3 * g1 + 0.13 * g2) * 0.35);
  return T;
}

/* ---------- clouds: two moving noise layers, zonal winds, cyclones ---------- */
vec3 swirl(vec3 q) {
  // six mid-latitude cyclones: rotate the noise domain about each centre (spiral arms)
  for (int k = 0; k < 6; k++) {
    float fk = float(k);
    float hs = (k - (k / 2) * 2) == 0 ? 1.0 : -1.0;
    float la = hs * (0.62 + 0.3 * fract(fk * 0.618 + 0.2));
    float lo = fk * 2.39996 + 0.7 + uTime * 0.004 * hs;
    vec3 c = vec3(cos(la) * cos(lo), sin(la), cos(la) * sin(lo));
    float d = 1.0 - dot(q, c);
    float a = hs * (0.95 + 1.25 * fract(fk * 0.37)) * exp(-d * (30.0 + 16.0 * fract(fk * 0.73)));
    float ca = cos(a), sa = sin(a);
    q = q * ca + cross(c, q) * sa + c * dot(c, q) * (1.0 - ca);
  }
  return q;
}
float clouds(vec3 p, int oct) {
  float lat = asin(clamp(p.y, -1.0, 1.0));
  float wind = uTime * (0.010 - 0.022 * cos(2.2 * lat));      // trade winds / westerlies
  float ca = cos(wind), sa = sin(wind);
  vec3 q = vec3(ca * p.x - sa * p.z, p.y, sa * p.x + ca * p.z);
  q = swirl(q);
  vec3 w = vec3(fbmV(q * 2.2 + 1.7, 2), fbmV(q * 2.2 + 9.2, 2), fbmV(q * 2.2 + 4.4, 2));
  // stretch along latitude circles: jet-stream streaks
  vec3 qs = q * vec3(1.0, 1.45, 1.0);
  float n = fbmV(qs * 3.4 + w * 1.7 + vec3(0.0, 0.0, uTime * 0.004), min(oct, 4));
  // detail is added before thresholding, so edges are fractal at every scale
  if (oct > 3) {
    n += 0.36 * fbmV(q * 11.0 + w * 2.2 + vec3(uTime * 0.012, 0.0, -uTime * 0.008), 3);
    // finer octaves fade in with the pixel footprint (no LOD seams)
    float f1 = smoothstep(0.011, 0.006, gFoot), f2 = smoothstep(0.0036, 0.002, gFoot);
    if (f1 > 0.0) n += 0.17 * f1 * fbmV(q * 34.0 + w * 4.0 + vec3(0.0, uTime * 0.02, 0.0), 2);
    if (f2 > 0.0) n += 0.085 * f2 * fbmV(q * 110.0 + w * 5.0, 2);
    // cumulus: Worley cells give puffy, crisp-edged cloud streets near the edges
    if (f1 > 0.0) n += 0.085 * f1 * (0.42 - cell(q * 58.0 + w * 4.0).x);
  }
  float band = 0.10 * exp(-lat * lat * 60.0) - 0.11 * exp(-pow((abs(lat) - 0.47) * 6.0, 2.0)) + 0.09 * exp(-pow((abs(lat) - 1.0) * 4.0, 2.0));
  float cov = uCloud + band + 0.04;
  float lo = 0.655 - 0.33 * cov;
  float d = smoothstep(lo, lo + (oct > 3 ? mix(0.08, 0.16, smoothstep(0.002, 0.008, gFoot)) : 0.16), n + 0.5);
  d *= d * (3.0 - 2.0 * d) * 0.35 + 0.65;
  return d;
}

/* ---------- surface ---------- */
vec3 shadePlanet(vec3 pw, vec3 rdw, vec3 Lw) {
  mat3 ws = transpose(uSpin);
  vec3 p = normalize(ws * pw), L = ws * Lw, V = -(ws * rdw);
  float lat = asin(clamp(p.y, -1.0, 1.0)), alat = abs(lat);
  float cz = dot(p, L);
  vec3 sunC = uSunI * sunTrans(0.0, cz);
  vec3 skyTint = mix(vec3(0.20, 0.42, 1.0), uAerAlb * vec3(1.0, 0.8, 0.6), clamp(uAerP.x * 0.5, 0.0, 1.0));
  vec3 amb = uSunI * 0.045 * skyTint * sqrt(uPress) * smoothstep(-0.22, 0.45, cz) * (uAtmOn > 0.5 ? 1.0 : 0.2);
  float night = smoothstep(0.06, -0.12, cz);

  Terr T = terrain(p);
  float iceN = gnoise(p * 5.0) * 0.07 + gnoise(p * 17.0) * 0.03 + gnoise(p * 41.0) * 0.012;
  float cw = clamp(gFoot * 1.8, 0.0006, 0.02);
  float land = uWater < 0.5 ? 1.0 : smoothstep(-cw, cw, T.e);
  vec3 alb = vec3(0.0), emis = vec3(0.0), n = p;
  float spec = 0.0, rough = 0.9, arid = 0.0, iceL = 0.0;
  if (uDbg > 0.5) return vec3(land * 3.0, T.ec > 0.0 ? 1.5 : 0.0, clamp(T.coll, 0.0, 1.0) * 3.0);
  if (land > 0.0) {
    float e = max(T.e, 0.0);
    float n2 = gnoise(p * 23.0), n3 = gnoise(p * 6.5);
    // bare rock → microbial mats → oxidised red beds → banded-iron coasts
    // early crust is dark basalt; pale granitic continents grow through time
    vec3 rockD = vec3(0.05, 0.047, 0.045), rockL = mix(vec3(0.085, 0.08, 0.075), vec3(0.24, 0.21, 0.18), smoothstep(0.15, 0.6, uCont));
    vec3 a = mix(rockD, rockL, smoothstep(-0.25, 0.45, T.d + 0.4 * e));
    a = mix(a, vec3(0.16, 0.115, 0.09), uMats * 0.7 * smoothstep(0.14, 0.0, e));
    a = mix(a, vec3(0.37, 0.18, 0.10), uRed * 0.6 * smoothstep(-0.4, 0.3, n2 + T.d));
    a = mix(a, vec3(0.52, 0.14, 0.07), uBif * smoothstep(0.07, 0.0, e));
    // climate: Hadley-cell deserts at 15–35°, dry continental interiors, wet tropics
    float inland = smoothstep(0.05, 0.6, T.ec);
    float subtrop = smoothstep(0.17, 0.30, alat) * smoothstep(0.66, 0.46, alat);
    arid = clamp(subtrop * (0.35 + 0.65 * inland) + uDesert * inland * 1.1 + 0.28 * n3 + 0.12 * n2 - 0.16, 0.0, 1.0);
    arid *= 1.0 - 0.7 * smoothstep(0.16, 0.0, alat);
    vec3 veg = mix(vec3(0.045, 0.085, 0.030), vec3(0.090, 0.125, 0.055), smoothstep(0.25, 0.6, alat));
    veg = mix(veg, vec3(0.045, 0.070, 0.040), smoothstep(0.85, 1.0, alat));
    veg = mix(veg, vec3(0.16, 0.15, 0.11), smoothstep(1.05, 1.2, alat));
    veg = mix(veg, vec3(0.030, 0.070, 0.028), uCoal);
    veg *= 0.8 + 0.45 * (n2 * 0.5 + 0.5);
    vec3 savanna = vec3(0.25, 0.20, 0.11);
    vec3 desert = mix(vec3(0.58, 0.44, 0.28), vec3(0.50, 0.30, 0.16), smoothstep(-0.2, 0.3, n3));
    float wet = smoothstep(-0.3, 0.4, gnoise(p * 11.0) + 0.5 * n2) * (1.0 - arid);
    veg *= mix(1.15, 0.7, wet);                                   // dense forest is darker
    vec3 cover = mix(veg, savanna, smoothstep(0.3, 0.6, arid));
    cover = mix(cover, desert, smoothstep(0.6, 0.88, arid));
    cover = mix(cover, cover * vec3(1.25, 1.1, 0.85) + vec3(0.03, 0.02, 0.0), smoothstep(0.25, 0.5, e) * (1.0 - arid));  // uplands: browner
    a = mix(a, cover, uVeg * smoothstep(0.85, 0.45, e));
    vec3 rock = mix(vec3(0.13, 0.115, 0.10), vec3(0.26, 0.23, 0.20), smoothstep(-0.2, 0.3, n2));
    a = mix(a, rock, smoothstep(0.42, 0.62, e));
    float snow = smoothstep(0.8, 0.95, e + alat * 0.3 + n2 * 0.05);
    iceL = smoothstep(uIceLat - 0.035, uIceLat + 0.035, alat + iceN);
    a = mix(a, vec3(0.80, 0.84, 0.90), max(iceL, snow));
    float fk = smoothstep(0.0048, 0.0028, gFoot);
    if (fk > 0.0) {
      float fd = fbmG(p * 80.0, 3);
      a *= 1.0 + 0.5 * fd * fk;
      a = mix(a, a * vec3(0.85, 1.05, 0.9), fk * uVeg * smoothstep(0.0, 0.3, fbmG(p * 45.0 + 4.0, 2)) * (1.0 - arid));
    }
    alb = a;
    n = normalize(p - 0.05 * (1.0 - iceL * 0.7) * (T.g - dot(T.g, p) * p));
    // city lights (only at the very end of the timeline), like NASA's Black Marble:
    // bright metropolitan cores with sodium sprawl, chains of towns, faint highways
    if (uCity > 0.001 && night > 0.0) {
      float coast = smoothstep(0.45, 0.0, T.ec);
      float pop = vnoise(p * 5.0) * 0.5 + vnoise(p * 13.0) * 0.3 + coast * 0.38 - arid * 0.6 - smoothstep(0.95, 1.15, alat);
      pop = smoothstep(0.46, 1.0, pop) * (1.0 - iceL);
      if (pop > 0.005) {
        vec3 cid = floor(p * 34.0);
        vec2 C = cell(p * 34.0);
        float big = hash13(cid + 7.0);
        float metro = step(0.5, big) * (exp(-C.x * C.x * 70.0) * (0.5 + 2.0 * big) + 0.06 * exp(-C.x * C.x * 12.0));
        vec2 C2 = cell(p * 105.0);
        float towns = smoothstep(0.2, 0.0, C2.x) * step(0.5, hash13(floor(p * 105.0 + 0.5)));
        vec2 C3 = cell(p * 17.0 + 3.0);
        float roads = smoothstep(0.03, 0.0, C3.y - C3.x) * smoothstep(0.25, 0.7, pop) * smoothstep(0.45, 0.8, vnoise(p * 420.0));
        float vill = 0.0;
        float fv = smoothstep(0.0048, 0.0028, gFoot);
        if (fv > 0.0) { vec2 C4 = cell(p * 300.0); vill = fv * smoothstep(0.22, 0.0, C4.x) * smoothstep(0.35, 0.8, pop); }
        float lum = pop * (metro * 2.0 + towns * 0.8 + vill * 0.45 + roads * 0.28);
        vec3 lc = mix(vec3(1.0, 0.56, 0.2), vec3(1.0, 0.84, 0.62), smoothstep(0.8, 2.2, metro * pop * 2.0));
        emis += lc * lum * uCity * night * 1.4;
      }
    }
    if (uCrack > 0.001 && uWater > 0.5) {
      vec2 F = cell(p * 18.0);
      emis += glow(1250.0) * uCrack * smoothstep(0.06, 0.0, F.y - F.x) * 0.6 * smoothstep(0.02, 0.0, abs(e - 0.1) - 0.1);
    }
    if (uLava > 0.001) emis += glow(1400.0) * pow(vnoise(p * 55.0), 10.0) * uLava * 3.0;
    emis *= land;
  }
  if (land < 1.0) {
    float depth = -T.e;
    vec3 deep = mix(vec3(0.004, 0.016, 0.045), vec3(0.007, 0.030, 0.026), uFerrous);
    vec3 shelf = mix(vec3(0.020, 0.105, 0.125), vec3(0.035, 0.090, 0.055), uFerrous);
    shelf = mix(shelf, vec3(0.06, 0.07, 0.04), uMats * 0.4);
    vec3 o = mix(shelf, deep, smoothstep(0.0, 0.04, depth));
    o = mix(o, deep * 0.72, smoothstep(0.35, 1.1, depth));
    o = mix(o, o * vec3(0.8, 1.25, 0.9), uVeg * 0.35 * smoothstep(0.3, 0.05, depth) * smoothstep(0.0, 0.5, gnoise(p * 9.0)));  // coastal plankton
    float leads = abs(gnoise(p * 60.0)) < 0.05 ? 0.12 : 0.0;
    float seaIce = smoothstep(uSeaIceLat - 0.03, uSeaIceLat + 0.03, alat + iceN * 1.6) * (1.0 - leads);
    vec3 iceC = mix(vec3(0.78, 0.83, 0.89), vec3(0.55, 0.68, 0.80), smoothstep(0.1, 0.5, gnoise(p * 14.0) + 0.3 * gnoise(p * 50.0)) * 0.7);
    o = mix(o, iceC, seaIce);
    if (uPlates > 0.5) o += vec3(0.02, 0.03, 0.035) * (1.0 - smoothstep(0.0, 0.03, T.bnd));
    alb = mix(o, alb, land);
    spec = (1.0 - seaIce) * (1.0 - land);
    rough = mix(mix(0.16, 0.6, seaIce), 0.9, land);
  }

  // magma ocean / crusting-over
  if (uWater < 0.999 && (uMagma > 0.001 || uCrack > 0.001)) {
    float conv = fbmG(p * 3.0 + vec3(uTime * 0.004, -uTime * 0.003, 0.0), 3);
    vec3 wp = p * 5.0 + vec3(fbmG(p * 4.0 + 1.3, 2), fbmG(p * 4.0 + 7.1, 2), fbmG(p * 4.0 + 3.7, 2)) * 1.6 + vec3(0.0, uTime * 0.01, 0.0);
    vec2 F = cell(wp);
    vec2 Fs = cell(wp * 2.7 + 5.0);
    float edge = min(F.y - F.x, (Fs.y - Fs.x) * 1.6 + 0.08) + 0.12 * fbmG(p * 22.0, 2);
    float molten = smoothstep(-0.08, 0.08, uMagma * 1.15 - (0.5 + conv));
    float Tm = 1350.0 + 520.0 * smoothstep(0.0, 0.55, edge) + 160.0 * gnoise(p * 30.0 + uTime * 0.05);
    vec3 crust = vec3(0.045, 0.040, 0.037) * (0.8 + 0.4 * vnoise(p * 60.0));
    vec2 F2 = cell(p * 16.0);
    float crackT = 900.0 + 450.0 * uCrack * smoothstep(0.08, 0.0, F2.y - F2.x) + 250.0 * smoothstep(0.05, 0.0, edge) * uCrack;
    vec3 em = mix(glow(crackT) * 0.8, glow(Tm) * 1.4, molten);
    float k = 1.0 - uWater;
    alb = mix(alb, mix(crust, vec3(0.03, 0.02, 0.015), molten), k);
    emis = mix(emis, em, k);
    spec *= 1.0 - k; rough = mix(rough, 0.7, k);
    if (k > 0.5) n = normalize(p + 0.02 * vec3(gnoise(p * 40.0), gnoise(p * 40.0 + 5.0), gnoise(p * 40.0 + 9.0)) * (1.0 - molten));
  }

  // lighting
  float ndl = max(dot(n, L), 0.0);
  vec3 col = alb * INV_PI * (sunC * ndl + amb);
  if (spec > 0.0) {
    vec3 H = normalize(L + V);
    float nh = max(dot(p, H), 0.0), nv = max(dot(p, V), 1e-3), nl = max(dot(p, L), 0.0);
    float a2 = rough * rough * rough * rough;
    float Dg = a2 / (PI * pow(nh * nh * (a2 - 1.0) + 1.0, 2.0));
    float F = 0.02 + 0.98 * pow(1.0 - max(dot(V, H), 0.0), 5.0);
    float k2 = rough * rough * 0.5;
    float G = (nl / (nl * (1.0 - k2) + k2)) * (nv / (nv * (1.0 - k2) + k2));

  }

  // clouds, their shadows, and lightning
  if (uCloudsOn > 0.5 && uCloud > 0.01) {
    float cd = clouds(p, 5);
    vec3 ps = normalize(p + (L - p * cz) * (0.0035 / max(cz, 0.15)));
    float sh = clouds(ps, 2);
    // relief: flanks facing the Sun catch the light, lee sides fall into grey shade
    float relief = clamp(1.0 + 1.2 * (clouds(p, 2) - sh), 0.42, 1.25);
    col *= 1.0 - 0.65 * sh * smoothstep(-0.1, 0.2, cz);
    vec3 csun = uSunI * sunTrans(0.0012 * uAtmK, cz);
    float cl = mix(max(cz, 0.0), 1.0, 0.22) * smoothstep(-0.1, 0.06, cz);
    vec3 ccol = mix(vec3(0.9), vec3(0.32, 0.30, 0.29), clamp(uMagma * 1.5, 0.0, 1.0)) * INV_PI * (csun * cl * relief + amb * 1.2);
    col = mix(col, ccol, cd);
    col += emis * cd * 0.22;                 // steam lit from below by the glowing surface
    emis *= 1.0 - cd * 0.75;
    if (uStorm > 0.01) {
      vec3 lc = floor(p * 26.0);
      float ft = floor(uTime * 4.0 + hash13(lc) * 17.0);
      float hsh = hash13(lc + ft * 1.37);
      float flash = step(1.0 - 0.018 * uStorm, hsh) * step(0.55, cd);
      float fr = fract(uTime * 4.0 + hash13(lc) * 17.0);
      float fl = flash * exp(-fr * 9.0) * (0.6 + 0.4 * sin(fr * 60.0));
      vec3 lp = (lc + 0.3 + 0.4 * hash33(lc)) / 26.0;     // flash centre well inside its cell
      vec3 dl = (p - lp) * 26.0;
      float fall = exp(-dot(dl, dl) * 60.0);
      emis += vec3(0.72, 0.8, 1.0) * fl * fall * 5.0 * cd;
    }
  }

  // aurorae: oxygen 557.7 nm curtains around the auroral ovals (~67° magnetic latitude)
  if (uAurora > 0.01 && night > 0.0) {
    // ovals ring the magnetic poles, about 9° off the spin axis; red 630 nm glow on the poleward side
    const vec3 MPOLE = vec3(0.13, 0.985, 0.11);
    float mlat = abs(asin(clamp(dot(p, MPOLE), -1.0, 1.0)));
    float lon = atan(p.z, p.x);
    float ov = 1.17 + 0.03 * sin(lon * 3.0 + uTime * 0.05) + 0.02 * gnoise(vec3(lon * 3.0, uTime * 0.1, 1.0));
    float band = exp(-pow((mlat - ov) / 0.014, 2.0));
    float red = exp(-pow((mlat - ov - 0.035) / 0.03, 2.0));
    float curtain = 0.3 + 0.7 * smoothstep(-0.2, 0.5, gnoise(vec3(lon * 26.0, uTime * 0.25, mlat * 30.0)));
    emis += (vec3(0.22, 1.0, 0.42) * band + vec3(0.6, 0.1, 0.18) * red * 0.12) * curtain * night * uAurora * 0.09;
  }
  // Chicxulub: fireball, ejecta curtain, spreading debris
  if (uImp.y > 0.5) {
    float ang = acos(clamp(dot(p, uImpDir), -1.0, 1.0));
    float ti = uImp.x;
    float core = exp(-ang * ang / (0.0006 + 0.0012 * ti)) * exp(-ti * 0.35);
    float ring = exp(-pow((ang - uImp.z) / (0.012 + 0.05 * uImp.z), 2.0)) * exp(-ti * 0.09) * (0.55 + 0.9 * max(gnoise(p * 45.0 + ti), 0.0));
    float dust = smoothstep(uImp.z + 0.05, 0.0, ang) * smoothstep(0.0, 2.0, ti);
    col *= 1.0 - 0.55 * dust;
    emis += glowC(3200.0, 6.0) * core * uImp.w + glowC(1700.0, 2.0) * ring * uImp.w;
  }
  if (uPlates > 0.5) {
    float line = 1.0 - smoothstep(0.0022, 0.0055, T.bnd);
    col = mix(col, uEra * (0.35 + uSunI * 0.05 * ndl), line * 0.85);
    emis += uEra * line * 0.25;
  }
  return col + emis;
}

/* ---------- Moon, Theia, debris disk, stars ---------- */
vec3 moonShade(vec3 pos, vec3 rd, vec3 L) {
  vec3 nrm = normalize(pos - uMoon.xyz);
  vec3 q = uMoonRot * nrm;
  float maria = smoothstep(0.02, 0.22, fbmG(q * 1.9 + vec3(3.1, 0.4, 1.7), 4));
  vec2 C1 = cell(q * 7.0), C2 = cell(q * 19.0);
  float craters = smoothstep(0.05, 0.0, abs(C1.x - 0.32)) * 0.35 + smoothstep(0.04, 0.0, abs(C2.x - 0.3)) * 0.2 - smoothstep(0.3, 0.0, C1.x) * 0.12;
  float alb = mix(0.155, 0.075, maria) * (0.85 + 0.3 * vnoise(q * 40.0)) * (1.0 + craters);
  vec3 bump = vec3(gnoise(q * 25.0), gnoise(q * 25.0 + 7.0), gnoise(q * 25.0 + 13.0)) * 0.08;
  vec3 n = normalize(nrm + bump - nrm * dot(bump, nrm));
  float mu0 = max(dot(n, L), 0.0), mu = max(dot(n, -rd), 0.0);
  float lit = mix(mu0, 2.0 * mu0 / (mu0 + mu + 1e-3), 0.55);
  // Earth's shadow (lunar eclipse, reddened by the atmosphere)
  float dd = length(cross(pos, L)); float behind = step(dot(pos, L), 0.0);
  float sh = mix(1.0, smoothstep(0.98, 1.06, dd), behind);
  vec3 col = vec3(alb) * vec3(1.0, 0.97, 0.93) * uSunI * lit * 1.4 * INV_PI;
  col = mix(col * vec3(0.20, 0.06, 0.02), col, sh);
  float T = 1050.0 + 380.0 * smoothstep(0.0, 0.5, C1.y - C1.x) + 150.0 * gnoise(q * 12.0 + uTime * 0.05);
  col = mix(col, col * 0.35, uMoonGlow);
  col += glowC(T, 0.9) * uMoonGlow * (0.3 + 0.7 * smoothstep(0.12, 0.0, C1.y - C1.x)) * (0.6 + 0.4 * smoothstep(-0.2, 0.3, fbmG(q * 3.0, 2)));
  return col;
}
vec3 theiaShade(vec3 pos, vec3 rd, vec3 L) {
  vec3 nrm = normalize(pos - uTheia.xyz);
  vec4 D = fbmD(nrm * 3.0 + 4.0, 5);
  vec2 F = cell(nrm * 5.0), F2 = cell(nrm * 12.0 + 2.0);
  // cratered, differentiated protoplanet: dark basaltic plains, paler highlands
  float rim = smoothstep(0.07, 0.0, abs(F2.x - 0.3)) * 0.45 - smoothstep(0.28, 0.0, F2.x) * 0.25;
  vec3 g = D.yzw * 3.0;
  vec3 n = normalize(nrm - 0.07 * (g - nrm * dot(g, nrm)));
  vec3 alb = mix(vec3(0.085, 0.075, 0.068), vec3(0.30, 0.25, 0.20), smoothstep(-0.3, 0.35, D.x)) * (1.0 + rim);
  float mu0 = max(dot(n, L), 0.0);
  vec3 col = alb * uSunI * mu0 * INV_PI + alb * vec3(0.012, 0.016, 0.03);
  // tidal heating: fissures open on the face turned toward Earth; after contact it glows through
  float toE = dot(nrm, normalize(-uTheia.xyz));
  float fis = smoothstep(0.075, 0.0, F.y - F.x) * smoothstep(-0.1, 0.8, toE);
  col += glowC(1150.0 + 250.0 * fis, 1.4) * fis * smoothstep(0.0, 0.1, uTheiaGlow) * 0.9;
  col += glowC(1300.0 + 900.0 * uTheiaGlow + 300.0 * smoothstep(0.1, 0.0, F.y - F.x), 1.5) * uTheiaGlow * step(0.12, uTheiaGlow) * (0.06 + 0.94 * smoothstep(-0.2, 0.6, toE)) * 0.8;
  return col;
}
vec4 disk(vec3 ro, vec3 rd, out float tD) {
  tD = 1e9;
  if (uDisk.x <= 0.001) return vec4(0.0);
  float dn = dot(rd, uDiskN);
  if (abs(dn) < 1e-5) return vec4(0.0);
  float t = -dot(ro, uDiskN) / dn;
  if (t < 0.0) return vec4(0.0);
  vec3 pp = ro + rd * t; float r = length(pp);
  if (r < uDisk.z || r > uDisk.w * 1.25) return vec4(0.0);
  tD = t;
  vec3 ax = normalize(cross(uDiskN, vec3(0.3, 0.1, 0.95))), ay = cross(uDiskN, ax);
  float th = atan(dot(pp, ay), dot(pp, ax));
  float a = th - uDiskRot * pow(r, -1.5);             // Keplerian shear
  vec3 sp = vec3(cos(a) * r, sin(a) * r, 0.0);
  float nse = fbmV(sp * 1.4 + vec3(0.0, 0.0, uTime * 0.05), 5);
  float spiral = 0.5 + 0.5 * sin(2.0 * a + 5.0 * log(r));
  float radial = smoothstep(uDisk.z, uDisk.z + 0.35, r) * smoothstep(uDisk.w * 1.25, uDisk.w * 0.55, r);
  float dens = clamp((nse + 0.28) * 2.2, 0.0, 1.0) * radial * (0.55 + 0.45 * spiral);
  float T = uDisk.y * pow(max(r, 1.0) / 1.3, -0.55);
  vec3 lit = vec3(0.4, 0.3, 0.25) * uSunI * 0.08;
  vec3 em = (glowC(T, 0.55) + lit) * dens * uDisk.x;
  return vec4(em, clamp(dens * uDisk.x * 0.85, 0.0, 1.0));
}
vec3 stars(vec3 rd) {
  vec3 c = vec3(0.0);
  float px = 1.0 / uFocal;
  for (int l = 0; l < 2; l++) {
    float s = l == 0 ? 70.0 : 170.0;
    vec3 q = rd * s; vec3 id = floor(q); vec3 h = hash33(id + float(l) * 19.7);
    if (h.x > (l == 0 ? 0.62 : 0.45)) {
      vec3 sp = id + 0.25 + 0.5 * hash33(id + 3.1);
      vec3 dv = sp - q; dv -= rd * dot(dv, rd);
      float d = length(dv) / s;
      float mag = pow(h.y, l == 0 ? 7.0 : 11.0) * (l == 0 ? 1.6 : 0.8) + 0.03;
      vec3 tint = mix(vec3(1.0, 0.72, 0.48), vec3(0.72, 0.82, 1.0), smoothstep(0.2, 0.8, h.z));
      c += tint * mag * exp(-d * d / (px * px * 0.55));
    }
  }
  vec3 mwN = normalize(vec3(0.42, 0.78, -0.46));
  float b = dot(rd, mwN);
  float band = exp(-b * b * 22.0);
  float mw = band * (0.6 + 1.6 * fbmV(rd * 5.0, 3));
  float lanes = smoothstep(0.0, 0.25, fbmV(rd * 11.0 + 3.0, 2)) * exp(-b * b * 160.0);
  c += vec3(0.016, 0.016, 0.022) * max(mw, 0.0) * (1.0 - 0.75 * lanes);
  c += vec3(0.05, 0.035, 0.03) * exp(-pow(dot(rd, normalize(vec3(-0.6, 0.2, -0.7))) - 1.0, 2.0) * 60.0) * band;
  return c;
}
vec3 background(vec3 rd) {
  vec3 c = vec3(0.0);
  float sd = dot(rd, uSun);
  c += uSunI * vec3(1.0, 0.96, 0.9) * (smoothstep(0.999984, 0.999992, sd) * 400.0 + (pow(max(sd, 0.0), 2000.0) * 1.5 + pow(max(sd, 0.0), 120.0) * 0.03) * uGlare);
  return c;
}

void main() {
  vec2 fc = gl_FragCoord.xy;
  vec3 rd = uCamRot * normalize(vec3((fc - uCenter) / uFocal, -1.0));
  vec3 ro = uCamPos;
  float jit = fract(52.9829189 * fract(dot(fc, vec2(0.06711056, 0.00583715))));
  HR *= uAtmK; HM *= uAtmK;
  vec3 L = uSun;
  vec3 col = background(rd);
  // stars are added after the air: a bright sky hides them (uStarMask mimics the exposure)
  vec3 starC = stars(rd) * uStarK;
  float tFar = 1e9;
  if (uMoon.w > 0.001) { vec2 mh = sph(ro, rd, uMoon.xyz, uMoon.w); if (mh.x > 0.0) { col = moonShade(ro + rd * mh.x, rd, L); tFar = mh.x; starC = vec3(0.0); } }
  if (uTheia.w > 0.001) { vec2 th = sph(ro, rd, uTheia.xyz, uTheia.w); if (th.x > 0.0 && th.x < tFar) { col = theiaShade(ro + rd * th.x, rd, L); tFar = th.x; starC = vec3(0.0); } }
  float tPlanet = 1e9;
  vec2 ah = sph(ro, rd, vec3(0.0), 1.0 + uAtmTop * uAtmK);
  if (ah.y > 0.0 && ah.x < tFar) {
    vec2 gh = sph(ro, rd, vec3(0.0), 1.0);
    float t0 = max(ah.x, 0.0), t1 = ah.y;
    vec3 surf = col;
    if (gh.x > 0.0) { t1 = gh.x; tPlanet = gh.x; gFoot = gh.x / uFocal / max(0.25, -dot(rd, normalize(ro + rd * gh.x))); surf = shadePlanet(ro + rd * gh.x, rd, L); starC = vec3(0.0); }
    if (uAtmOn > 0.5) { vec3 ins, tr; scatter(ro, rd, t0, t1, L, jit, ins, tr); col = surf * tr + ins + starC * tr * exp(-dot(ins, vec3(0.2126, 0.7152, 0.0722)) * uStarMask); }
    else col = surf + starC;
  } else {
    col += starC;
    // sub-pixel planet (Pale Blue Dot): splat its light so it never vanishes
    vec3 oc = -ro; float tc = dot(oc, rd);
    if (tc > 0.0) {
      float d = length(oc - rd * tc) / tc;          // angular distance from the planet
      float ra = 1.0 / length(ro);                   // angular radius
      float px = 1.0 / uFocal;
      float phase = 0.5 + 0.5 * dot(normalize(ro), uSun);
      col += vec3(0.30, 0.48, 0.95) * uSunI * 1.6 * phase * max(ra * ra / (px * px), 0.02) * exp(-d * d / (px * px * 0.5)) * step(ra, px * 1.5);
    }
  }
  float tD; vec4 dk = disk(ro, rd, tD);
  if (dk.a > 0.0 && tD < min(tPlanet, tFar)) col = col * (1.0 - dk.a) + dk.rgb;
  if (uBolide.w > 0.0) {
    vec3 w = uBolide.xyz - ro; float tc = dot(w, rd);
    if (tc > 0.0 && tc < tPlanet + 0.02) { float d2 = dot(w, w) - tc * tc; col += vec3(1.0, 0.85, 0.6) * uBolide.w * (exp(-d2 * 90000.0) * 30.0 + exp(-d2 * 2500.0) * 1.2); }
  }
  if (uTonemap > 0.5) { col = col * uExposure; col = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), 0.0, 1.0); col = pow(col, vec3(1.0 / 2.2)); }
  fragColor = vec4(max(col, vec3(0.0)), 1.0);
}`;

/* ---------- post: bloom + tonemap ---------- */
const BRIGHT_FS = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uTexel; uniform float uThresh;
void main() {
  vec3 c = 0.25 * (texture(uTex, vUv + uTexel * vec2(-1.0, -1.0)).rgb + texture(uTex, vUv + uTexel * vec2(1.0, -1.0)).rgb
                 + texture(uTex, vUv + uTexel * vec2(-1.0, 1.0)).rgb + texture(uTex, vUv + uTexel * vec2(1.0, 1.0)).rgb);
  float l = max(max(c.r, c.g), c.b);
  o = vec4(min(c * max(l - uThresh, 0.0) / max(l, 1e-4), vec3(60.0)), 1.0);
}`;
const BLUR_FS = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uDir;
void main() {
  vec3 c = texture(uTex, vUv).rgb * 0.2270270;
  c += (texture(uTex, vUv + uDir * 1.3846154).rgb + texture(uTex, vUv - uDir * 1.3846154).rgb) * 0.3162162;
  c += (texture(uTex, vUv + uDir * 3.2307692).rgb + texture(uTex, vUv - uDir * 3.2307692).rgb) * 0.0702703;
  o = vec4(c, 1.0);
}`;
const COMP_FS = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uB1, uB2; uniform float uExposure, uBloom, uFlash, uTime, uTonemap, uBeam, uBeamX; uniform vec2 uRes, uFlashPos;
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main() {
  vec3 c = texture(uScene, vUv).rgb;
  vec3 b = texture(uB1, vUv).rgb * 0.55 + texture(uB2, vUv).rgb * 0.9;
  if (uBeam > 0.0) {
    float dx = (vUv.x - uBeamX) * uRes.x / uRes.y;
    float band = exp(-dx * dx * 900.0) + 0.45 * exp(-pow(dx + 0.12, 2.0) * 500.0) + 0.3 * exp(-pow(dx - 0.2, 2.0) * 300.0);
    vec3 tint = vec3(0.95, 0.72, 0.52) + vec3(0.0, 0.1, 0.25) * sin(dx * 40.0);
    c += tint * band * uBeam * 0.08 * (0.8 + 0.2 * sin(vUv.y * 3.0 + dx * 7.0));
  }
  // impact flash: a blinding point at the impact site that floods the lens, not a white screen
  vec2 fq = (vUv - uFlashPos) * vec2(uRes.x / uRes.y, 1.0);
  float fl = uFlash * (0.1 + 2.2 * exp(-dot(fq, fq) * 24.0) + 14.0 * exp(-dot(fq, fq) * 400.0));
  if (uTonemap > 0.5) { c += b * uBloom * 0.25 + vec3(1.0, 0.93, 0.82) * fl * 0.35; }
  else {
    c += b * uBloom + vec3(1.0, 0.93, 0.82) * fl;
    c = aces(c * uExposure);
    c = pow(c, vec3(1.0 / 2.2));
  }
  vec2 q = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  c *= 1.0 - 0.28 * smoothstep(0.35, 1.25, length(q));
  c += (h12(vUv * uRes + fract(uTime) * 91.0) - 0.5) * (2.0 / 255.0);
  o = vec4(c, 1.0);
}`;

/* =====================================================================
   7. GL SETUP
   ===================================================================== */
const canvas = ch.canvas('pbd-gl');
const overlay = ch.canvas('pbd-ov'); overlay.classList.add('pbd-overlay');
const octx = overlay.getContext('2d');
const gl = Cosmos.gl.context(canvas, { antialias: false });
if (!gl) { ch.fatal('This chapter ray-traces a planet on the GPU and needs WebGL2, which this browser does not provide.'); return; }
let progScene, progBright, progBlur, progComp;
try {
  progScene = Cosmos.gl.program(gl, Cosmos.gl.FS_VERT, SCENE_FS);
  progBright = Cosmos.gl.program(gl, Cosmos.gl.FS_VERT, BRIGHT_FS);
  progBlur = Cosmos.gl.program(gl, Cosmos.gl.FS_VERT, BLUR_FS);
  progComp = Cosmos.gl.program(gl, Cosmos.gl.FS_VERT, COMP_FS);
} catch (e) { ch.fatal('The planet shader could not be compiled on this GPU.', e); return; }
const drawTri = Cosmos.gl.quad(gl);
// optional GPU timing of the scene pass (for the adaptive resolution and QA)
const tq = { ext: gl.getExtension('EXT_disjoint_timer_query_webgl2'), q: null, ms: 0, n: 0 };
let HDR = !!(gl.ext.floatRT || gl.ext.halfFloatRT);
let tg = null;
function makeTargets(w, h) {
  const opt = HDR ? { internal: gl.RGBA16F, format: gl.RGBA, type: gl.HALF_FLOAT } : { internal: gl.RGBA8, format: gl.RGBA, type: gl.UNSIGNED_BYTE };
  const mk = (W, H) => Cosmos.gl.target(gl, Object.assign({ w: Math.max(1, W), h: Math.max(1, H), filter: 'linear' }, opt));
  const w4 = Math.ceil(w / 4), h4 = Math.ceil(h / 4), w8 = Math.ceil(w / 8), h8 = Math.ceil(h / 8);
  return { w, h, scene: mk(w, h), b1a: mk(w4, h4), b1b: mk(w4, h4), b2a: mk(w8, h8), b2b: mk(w8, h8) };
}
function ensureTargets(w, h) {
  if (tg && tg.w === w && tg.h === h) return;
  if (tg) ['scene', 'b1a', 'b1b', 'b2a', 'b2b'].forEach((k) => { gl.deleteTexture(tg[k].tex); gl.deleteFramebuffer(tg[k].fbo); });
  try { tg = makeTargets(w, h); }
  catch (e) { if (HDR) { HDR = false; tg = makeTargets(w, h); console.info('Earth: float render targets unavailable, using 8-bit mode'); } else throw e; }
}

/* =====================================================================
   8. CAMERA (drag to orbit, wheel / pinch to zoom, shift-drag moves the Sun)
   ===================================================================== */
const FOV = 36 * Math.PI / 180;
const cam = { zk: 1, theta: 0.52, phi: 1.2, dist: 5.6, tDist: 5.6, base: 5.6, vt: 0, vp: 0, userZoom: false, min: 1.07, max: 60, eye: [0, 0, 5], right: [1, 0, 0], up: [0, 1, 0], back: [0, 0, 1] };
const camRot = new Float32Array(9);
const sun = { az: 0, el: 0.2, dir: [1, 0, 0] };
let sunMode = false;

  o.frequency.value = 1500; g.gain.setValueAtTime(0.025, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  o.connect(g); g.connect(ch.sound.out); o.start(t); o.stop(t + 0.05);
}
ch.onResize(() => { layout(); ribbonDirty = true; });
document.addEventListener('visibilitychange', () => { const n = audio.n; if (n && document.hidden) { n.g.gain.setTargetAtTime(0, n.ac.currentTime, 0.1); n.rg.gain.setTargetAtTime(0, n.ac.currentTime, 0.1); } });
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); ch.fatal('The graphics processor reset and the planet can no longer be drawn. Reload the page to continue.'); });

/* keys (avoid Space H N C M F [ ] ?) */
ch.onKey('ArrowRight', () => stepEvent(1), 'Next event');
ch.onKey('ArrowLeft', () => stepEvent(-1), 'Previous event');
ch.onKey('p', () => toggleJourney(), 'Play / pause the journey');
ch.onKey('t', () => startTheia(), 'Theia impact');
ch.onKey('k', () => startChicxulub(), 'Chicxulub impact');
ch.onKey('b', () => (seq.pbd ? exitPBD() : enterPBD()), 'Pale Blue Dot');
ch.onKey('g', () => { tPlates.set(!state.plates, true); }, 'Plate boundaries');
ch.onKey('r', () => resetView(), 'Reset view');
ch.onKey('s', () => { tSun.set(!sunMode, true); }, 'Drag moves the Sun');

Cosmos.debug.state = () => ({
  age_Ma: +state.age.toFixed(4), pos: +state.pos.toFixed(4), eon: eonOf(state.age).name, day_h: +R.day.toFixed(2), moon_km: Math.round(R.moonKm),
  sun_L: +R.lum.toFixed(3), o2_PAL: R.o2, co2_bar: R.co2, temp_C: +R.temp.toFixed(1), plate_cm_yr: +plateSpeed(state.age).toFixed(2),
  journey: journey.on, stop: journey.i, theia: +seq.theia.toFixed(2), impact: +seq.imp.toFixed(2), pbd: seq.pbd,
  camDist: +cam.dist.toFixed(2), renderScale: +perf.rs.toFixed(2), sceneGpuMs: +tq.ms.toFixed(2), renderPx: tg ? tg.w + 'x' + tg.h : '', fps: perf.fps, hdr: HDR, magma: +S.magma.toFixed(2), haze: +S.haze.toFixed(2), ice: +S.ice.toFixed(1),
});
Cosmos.debug.plates = (a) => { updatePlates(a); const o = []; for (let k = 0; k < 7; k++) { const y = plateC[k * 3 + 1]; o.push([Math.round(Math.asin(y) * 57.3), Math.round(Math.atan2(plateC[k * 3], plateC[k * 3 + 2]) * 57.3)]); } return JSON.stringify(o); };
Cosmos.debug.bench = (batches = 12, per = 4) => {
  // minimum wall time per scene draw over several batches (robust to GPU time-slicing)
  const px = HDR ? new Float32Array(4) : new Uint8Array(4), sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, HDR ? gl.FLOAT : gl.UNSIGNED_BYTE, px);
  tg.scene.bind(); gl.useProgram(progScene); Cosmos.gl.uniforms(gl, progScene, P); sync();
  let best = 1e9;
  for (let b = 0; b < batches; b++) { const t0 = performance.now(); for (let i = 0; i < per; i++) drawTri(); sync(); best = Math.min(best, (performance.now() - t0) / per); }
  return +best.toFixed(2);
};
Cosmos.debug.sky = (th) => { if (th != null) sky.theta = th; return { theta: +sky.theta.toFixed(3), fail: sky.fail, shown: sky.shown }; };
Cosmos.debug.glerr = () => { const o = []; let e; while ((e = gl.getError()) && o.length < 5) o.push(e); return o; };
Cosmos.debug.face = (ks = 0.55) => { steerSpin(10, ks); state.spin = false; };
Cosmos.debug.spin = (a) => { spinAng = a; state.spin = false; };
Cosmos.debug.goto = (a) => { stopJourney(); seq.theia = -1; capOverride = null; state.pos = state.target = posAt(a); };
})();
</script>
