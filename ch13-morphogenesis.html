<script>
(function () {
'use strict';

/* =====================================================================
   Chapter 13 · Morphogenesis
   Turing patterns on the GPU: Gray–Scott (plus Gierer–Meinhardt and the
   Brusselator) on float ping-pong textures, rendered as lit living tissue,
   with a live (F, k) parameter atlas after Pearson (1993).
   ===================================================================== */

const NOTES = `
<p>You are looking at two chemicals on a sheet of cells, and nothing else. One of them, <strong>v</strong>, makes more of itself when it meets the other. The other, <strong>u</strong>, is fed in everywhere and spreads twice as fast. No cell knows where it is, and no picture is stored anywhere. Spots, stripes and mazes appear anyway.</p>
<p>In 1952 Alan Turing showed why. Diffusion normally smooths things out, but when a short-range activator is held in check by something that spreads further, a flat, even mixture becomes unstable. Tiny random ripples grow into a pattern with its own preferred spacing. He called it <em>morphogenesis</em>, the making of form.</p>
<p>Seventy years on, the idea holds up in real animals. The stripes on zebrafish come from pigment cells that obey Turing's rules. Mouse fingers are spaced by a Turing wave that Hox genes tune. Hair follicles, palate ridges and the maze on a pufferfish all look like this sheet.</p>
<p>The <strong>parameter map</strong> in the controls is the whole family at once: one simulation in which the feed rate F grows to the right and the kill rate k grows upward. Every pattern in this chapter lives somewhere on it. The leopard, the giraffe and the zebra differ only in where they sit on that map, how the skin is coloured, and which way the chemicals prefer to spread.</p>
<h4>Try this</h4>
<ul>
<li>Press <kbd>A</kbd> or <strong>Map mode</strong>, then drag the crosshair across the map. The lens shows the tissue changing species as you go. Click the lens to dive back in, or press <kbd>W</kbd> and let F and k wander on their own.</li>
<li>Choose <strong>Mitosis</strong> and watch one spot divide until it fills the screen.</li>
<li>Press <strong>Animal coat</strong>. The same chemistry, started from noise, puts spots on the body and rings on the thin tail. The blue callipers show how many wavelengths fit across.</li>
<li>Press <kbd>T</kbd> for a guided tour, or drag on the tissue to paint new activator. Right-drag, or switch on Erase, to wipe it.</li>
</ul>`;

const SCIENCE = `
<h4>Turing's insight (1952)</h4>
<p>Take two substances that react and diffuse. Without diffusion their mixture sits at a stable, uniform state. Turing showed that adding diffusion can destabilise it, provided the <strong>activator</strong> promotes itself locally and the <strong>inhibitor</strong> it triggers diffuses faster and further. Perturbations of one particular wavelength then grow exponentially while all others decay, and the uniform state breaks into a periodic pattern.</p>
<h4>The Gray–Scott model</h4>
<p>This sheet runs the Gray–Scott reaction U + 2V → 3V, V → P, with U fed in at rate F and V removed at rate F + k:</p>
<span class="eq">∂u/∂t = D<sub>u</sub> ∇²u − u v² + F (1 − u)</span>
<span class="eq">∂v/∂t = D<sub>v</sub> ∇²v + u v² − (F + k) v</span>
<p>V is autocatalytic (the u v² term) and U is its fuel, so this is an <em>activator–substrate depletion</em> system: a patch of V eats the U around it, and because U diffuses twice as fast (D<sub>u</sub> = 2 D<sub>v</sub>) the depletion reaches further than the activation.</p>
<p>Units are Pearson's: D<sub>u</sub> = 2 × 10⁻⁵ and D<sub>v</sub> = 10⁻⁵ on a 2.5 × 2.5 box of 256² cells, which is D<sub>u</sub> = 0.2097 and D<sub>v</sub> = 0.105 in cell² per step, with Δt = 1. The Laplacian is the isotropic 9-point stencil ∇²u ≈ [4 Σ(edges) + Σ(corners) − 20 u] / 6, integrated with forward Euler on 32-bit float textures, 1 to 40 steps per frame. The sheet has one cell per 1.3 to 3 screen pixels (up to about 1100 × 700 cells on a laptop) and no-flux boundaries.</p>
<p><strong>Measurements.</strong> A 256² window of v (128² on phones) is read back twice a second. The wavelength is the peak of its radially averaged power spectrum (2D FFT with a Hann window). Shape comes from counting connected blobs and holes, with an elongation test for worms, and stripe order is the anisotropy of the spectral ring.</p>
<h4>Linear stability</h4>
<p>Linearise about a uniform state with Jacobian J = [[f<sub>a</sub>, f<sub>h</sub>], [g<sub>a</sub>, g<sub>h</sub>]] for activator a and inhibitor h. A perturbation e<sup>σt + iq·x</sup> grows at rate σ(q), an eigenvalue of J − q² diag(D<sub>a</sub>, D<sub>h</sub>). Turing instability needs the state to be stable at q = 0 and unstable at some q > 0:</p>
<span class="eq">f<sub>a</sub> + g<sub>h</sub> &lt; 0,&nbsp;&nbsp; det J &gt; 0,&nbsp;&nbsp; D<sub>h</sub> f<sub>a</sub> + D<sub>a</sub> g<sub>h</sub> &gt; 2 √(D<sub>a</sub> D<sub>h</sub> det J)</span>
<p>The third condition cannot hold with f<sub>a</sub> &gt; 0 &gt; g<sub>h</sub> unless D<sub>h</sub> &gt; D<sub>a</sub>. The fastest-growing mode sits near q<sub>c</sub>² = (D<sub>h</sub> f<sub>a</sub> + D<sub>a</sub> g<sub>h</sub>) / (2 D<sub>a</sub> D<sub>h</sub>), which sets the spacing λ = 2π/q<sub>c</sub>. The <strong>Analysis</strong> panel draws σ(q) live and overlays the measured power spectrum of the sheet.</p>
<p>Gray–Scott has a twist. Its trivial state u = 1, v = 0 is always linearly stable, and a second uniform state (the blue state) exists only where F &gt; 4(F + k)², below the saddle-node curve k = √F / 2 − F on the map. Most of the famous patterns (mitosis, solitons, worms) live just above that curve, where only the trivial state exists. They are finite-amplitude, self-sustaining structures that need a disturbance to get started. They are relatives of Turing's mechanism, and they show that linear theory tells only part of the story. The Gierer–Meinhardt and Brusselator modes in the Reaction panel show the classic linear instability growing from pure noise.</p>
<h4>Pearson's map</h4>
<p>Pearson (1993) swept F and k and sorted the behaviours into twelve classes, α to μ; Munafo later extended the list (ν, ξ, π, ρ, σ) and gave a representative point for each, which is where the labels sit. The map recomputes that survey in one live simulation of 800 × 500 cells (480 × 300 on phones), with F rising from 0.008 to 0.095 along x and k from 0.045 to 0.07 along y. Because F and k change smoothly across it, neighbouring regimes meet at soft borders. Classes β (F 0.014, k 0.039) and ξ (F 0.010, k 0.041) lie below this window. Uniform areas are the red state (u = 1, v = 0, above the curve) or the blue state (below it). The dashed curve is the saddle-node line, the dotted curve is the Hopf line where the blue state starts to oscillate, and the thin shaded sliver is the only place where linear theory predicts a Turing instability at D<sub>u</sub>/D<sub>v</sub> = 2.</p>
<h4>Second models</h4>
<span class="eq">Gierer–Meinhardt: ∂a/∂t = D<sub>a</sub>∇²a + r [a² / (h(1 + κa²)) − a + σ],&nbsp; ∂h/∂t = D<sub>h</sub>∇²h + r ν (a² − h)</span>
<span class="eq">Brusselator: ∂x/∂t = D<sub>x</sub>∇²x + r [A − (B + 1) x + x² y],&nbsp; ∂y/∂t = D<sub>y</sub>∇²y + r (B x − x² y)</span>
<p>Here D<sub>h</sub> = D<sub>y</sub> = 0.3 cell²/step, σ = 0.01, and the rate r (0.0035 and 0.0037) is chosen so the Turing wavelength is 16 to 20 cells at the default settings. Saturation κ turns Gierer–Meinhardt peaks into stripes. The Brusselator becomes Turing-unstable when B &gt; (1 + A √(D<sub>x</sub>/D<sub>y</sub>))².</p>
<h4>The evidence in living things</h4>
<p><strong>Fish.</strong> Kondo and Asai (1995) watched the stripes of the angelfish <em>Pomacanthus</em> split and rearrange as the fish grew, exactly as a Turing pattern does on a growing domain. <strong>Growing angelfish</strong> reproduces this: the sheet is stretched by 2% per second along its length, and new stripes open between the old ones through Y-shaped forks while the spacing stays at one wavelength. In zebrafish, Nakamasu et al. (2009) found that black melanophores and yellow xanthophores eliminate each other at short range, while xanthophores help melanophores survive at a distance. That is short-range inhibition with long-range support: Turing's conditions, met by cells instead of molecules.</p>
<p><strong>Fingers.</strong> Sheth et al. (2012) removed Hox genes in mice and got extra, thinner digits: the Hox dose sets the wavelength of a Turing-type system (Sox9, BMP, WNT) in the limb bud. <strong>Skin.</strong> WNT and its inhibitor DKK space mouse hair follicles like an activator and inhibitor (Sick et al. 2006), and FGF and SHH lay down the ridges of the palate (Economou et al. 2012).</p>
<p><strong>Tails.</strong> Murray (1988) pointed out that a domain narrower than about one wavelength can hold only bands across it. A tapering tail therefore turns spots into rings near its tip. His prediction: a spotted animal may have a striped tail, but a striped animal cannot have a spotted tail. Cheetahs, jaguars and genets obey it. <strong>Animal coat</strong> tests this with the model closest to Murray's own analysis: a Brusselator just past its Turing threshold (A = 4.5, D<sub>y</sub>/D<sub>x</sub> = 8, B = 6.95 against an onset of 6.71), started from pure noise. On an open sheet it settles into hexagonal spots where the activator X is low, and those are drawn as pigment. On the silhouette the tail narrows from 1.4 wavelengths across to 0.36, and the blue callipers give its width in wavelengths. Once the tail is narrower than about half a wavelength, no mode across it can grow, only modes along it, so the spots become bands. Rings form where the tail gets thin; the body stays spotted. The <strong>tapered tail in 3D</strong> runs the same reaction on a closed tube: the sheet is an unrolled cone whose rows wrap around, with a circumference that grows from 0.6 wavelengths at the tip to 7 at the base. It neglects the small curvature terms of a slender cone's Laplacian.</p>
<h4>Direction</h4>
<p>Anisotropy makes one axis diffuse faster. Try it with <strong>Zebra</strong>. If only the inhibitor u spreads faster along x, stripes form across x; if only the activator v does, stripes run along x; if both do, it is just a stretched coordinate system and the labyrinth stays disordered. Shoji et al. (2002) studied this kind of directional bias as a way to orient fish stripes.</p>
<h4>What is simplified</h4>
<p>Lengths and times are in grid units, not microns and hours. Gray–Scott is a chemical toy, not a gene network. Real skin grows while it patterns and is curved, both of which change the result. Anisotropy multiplies diffusion along one direction for whichever chemical you choose. The lighting, fur, rosette gaps, chromatophores and iridescence are rendering choices laid over the computed v field. The giraffe net is drawn along the valleys of log v, the medial lines between neighbouring spots, so it is a way of looking at the same spot pattern. Real leopard rosettes may come from a pattern that changes during growth (Liu et al. 2006).</p>
<span class="cite">Turing, A. M. (1952). The chemical basis of morphogenesis. Phil. Trans. R. Soc. Lond. B 237, 37–72.</span>
<span class="cite">Gray, P. &amp; Scott, S. K. (1984). Autocatalytic reactions in the isothermal, continuous stirred tank reactor. Chem. Eng. Sci. 39, 1087–1097.</span>
<span class="cite">Pearson, J. E. (1993). Complex patterns in a simple system. Science 261, 189–192.</span>
<span class="cite">Murray, J. D. (1988). How the leopard gets its spots. Scientific American 258(3), 80–87.</span>
<span class="cite">Kondo, S. &amp; Miura, T. (2010). Reaction-diffusion model as a framework for understanding biological pattern formation. Science 329, 1616–1620.</span>
<span class="cite">Kondo, S. &amp; Asai, R. (1995). A reaction–diffusion wave on the skin of the marine angelfish Pomacanthus. Nature 376, 765–768.</span>
<span class="cite">Nakamasu, A., Takahashi, G., Kanbe, A. &amp; Kondo, S. (2009). Interactions between zebrafish pigment cells responsible for the generation of Turing patterns. PNAS 106, 8429–8434.</span>
<span class="cite">Sheth, R. et al. (2012). Hox genes regulate digit patterning by controlling the wavelength of a Turing-type mechanism. Science 338, 1476–1480.</span>
<span class="cite">Sick, S., Reinker, S., Timmer, J. &amp; Schlake, T. (2006). WNT and DKK determine hair follicle spacing through a reaction-diffusion mechanism. Science 314, 1447–1450.</span>
<span class="cite">Gierer, A. &amp; Meinhardt, H. (1972). A theory of biological pattern formation. Kybernetik 12, 30–39.</span>
<span class="cite">Shoji, H., Iwasa, Y., Mochizuki, A. &amp; Kondo, S. (2002). Directionality of stripes formed by anisotropic reaction–diffusion models. J. Theor. Biol. 214, 549–561.</span>`;

const ch = Cosmos.chapter({ id: 'morphogenesis', notes: NOTES, science: SCIENCE });
const U = Cosmos.util;
const small = window.matchMedia('(max-width: 760px)').matches;
const ERA = U.rgbf(ch.meta.accent);

/* ================================================================ GL setup */
const canvas = ch.canvas('mg-gl');
const ui = ch.canvas('mg-ui');
const cx = ui.getContext('2d');
const gl = Cosmos.gl.context(canvas, { alpha: false });
if (!gl) { ch.fatal('This chapter needs WebGL2, which this browser or device does not provide.'); return; }
if (!gl.ext.floatRT) { ch.fatal('The reaction runs on 32-bit floating-point textures (EXT_color_buffer_float), which this GPU does not expose. Half precision is too coarse: the feed term changes u by about one part in ten thousand per step.'); return; }

const HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\n';
const VS = Cosmos.gl.FS_VERT;
const drawTri = Cosmos.gl.quad(gl);

function makeTex(w, h, internal, format, type, filter, data) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, data || null);
  const f = filter === 'linear' ? gl.LINEAR : gl.NEAREST;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function makeTarget(w, h, kind, filter) {
  const fm = {
    rg32: [gl.RG32F, gl.RG, gl.FLOAT],
    rgba32: [gl.RGBA32F, gl.RGBA, gl.FLOAT],
    rgba16: [gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT],
    rgba8: [gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE],
  }[kind];
  const tex = makeTex(w, h, fm[0], fm[1], fm[2], filter);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (st !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incomplete for ' + kind + ' (0x' + st.toString(16) + ')');
  return { tex, fbo, w, h, dispose() { gl.deleteTexture(tex); gl.deleteFramebuffer(fbo); } };
}

/* ================================================================ shaders */
const SIM_FS = HEAD + `
uniform sampler2D uS; uniform sampler2D uMask; uniform int uUseMask;
uniform ivec2 uSize; uniform int uModel;
uniform vec2 uFK; uniform vec2 uD; uniform float uDt;
uniform int uGrad; uniform vec4 uGR;
uniform vec4 uAniso; uniform vec2 uAnisoW;
uniform vec4 uBrush; uniform vec3 uBrushP;
uniform vec4 uP; uniform vec2 uHi; uniform vec2 uBase; uniform vec2 uMax;
uniform int uTopo; uniform vec4 uCone; uniform float uConeYc;
out vec4 o;
vec2 S(ivec2 p){ return texelFetch(uS, clamp(p, ivec2(0), uSize - 1), 0).xy; }
float M(ivec2 p){ return texelFetch(uMask, clamp(p, ivec2(0), uSize - 1), 0).r; }
// cone topology: column x is a ring of 2h cells (h from the taper); rows wrap around it, the two ends are no-flux
int coneH(int x){ float t = clamp((float(x) - uCone.x) / (uCone.y - uCone.x), 0.0, 1.0); return int(max(2.0, floor(mix(uCone.z, uCone.w, pow(t, 1.8)) * 0.5))); }
ivec2 coneWrap(ivec2 q){ int h = coneH(q.x), yc = int(uConeYc); if (q.y >= yc + h) q.y -= 2 * h; else if (q.y < yc - h) q.y += 2 * h; return q; }
bool coneOut(ivec2 q){ return float(q.x) < uCone.x || float(q.x) > uCone.y; }
vec2 N(ivec2 p, vec2 c){
  if (uTopo == 1) return coneOut(p) ? c : S(coneWrap(p));
  if (uUseMask == 1 && M(p) < 0.5) return c;
  return S(p);
}
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec2 c = S(p);
  if (uTopo == 1) { int h = coneH(p.x), yc = int(uConeYc); if (coneOut(p) || p.y < yc - h || p.y >= yc + h) { o = vec4(uBase, 0.0, 1.0); return; } }
  else if (uUseMask == 1 && M(p) < 0.5) { o = vec4(uBase, 0.0, 1.0); return; }
  vec2 e = N(p + ivec2(1, 0), c), w = N(p - ivec2(1, 0), c), n = N(p + ivec2(0, 1), c), s = N(p - ivec2(0, 1), c);
  vec2 ne = N(p + ivec2(1, 1), c), nw = N(p + ivec2(-1, 1), c), se = N(p + ivec2(1, -1), c), sw = N(p + ivec2(-1, -1), c);
  vec2 lap = (4.0 * (e + w + n + s) + (ne + nw + se + sw) - 20.0 * c) / 6.0;
  if (uAniso.x != 0.0) lap += uAnisoW * uAniso.x * (uAniso.y * ((e + w) - (n + s)) + uAniso.z * 0.5 * ((ne + sw) - (nw + se)));
  float F = uFK.x, k = uFK.y;
  vec2 q = (vec2(p) + 0.5) / vec2(uSize);
  if (uGrad == 1) F = mix(uGR.x, uGR.y, q.x);
  else if (uGrad == 2) k = mix(uGR.z, uGR.w, q.x);
  else if (uGrad == 3) { F = mix(uGR.x, uGR.y, q.x); k = mix(uGR.z, uGR.w, q.y); }
  vec2 r;
  if (uModel == 0) {            // Gray-Scott: x = u (substrate), y = v (activator)
    float u = c.x, v = c.y, uvv = u * v * v;
    r = vec2(-uvv + F * (1.0 - u), uvv - (F + k) * v);
  } else if (uModel == 1) {     // Gierer-Meinhardt: x = h (inhibitor), y = a (activator)
    float h = max(c.x, 1e-3), a = c.y, a2 = a * a;
    r = uP.w * vec2(uP.y * (a2 - h), a2 / (h * (1.0 + uP.x * a2)) - a + uP.z);
  } else {                      // Brusselator: x = Y (inhibitor), y = X (activator)
    float X = c.y, Y = c.x, x2y = X * X * Y;
    r = uP.z * vec2(uP.y * X - x2y, uP.x - (uP.y + 1.0) * X + x2y);
  }
  vec2 nx = c + uDt * (uD * lap + r);
  if (uBrushP.y != 0.0) {
    vec2 pa = vec2(p) + 0.5 - uBrush.xy, ba = uBrush.zw - uBrush.xy;
    float t = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
    float d = length(pa - ba * t);
    float m = 1.0 - smoothstep(uBrushP.x * 0.6, uBrushP.x, d);
    if (uBrushP.y > 0.0) {   // paint a stipple of seed-sized drops: a solid disk starves itself of substrate and dies
      vec2 cq = (vec2(p) + 0.5) / 7.0, ci = floor(cq);
      vec2 jt = fract(sin(vec2(dot(ci, vec2(127.1, 311.7)), dot(ci, vec2(269.5, 183.3)))) * 43758.5453) - 0.5;
      m *= 1.0 - smoothstep(2.0, 3.0, length((cq - ci - 0.5 - jt * 0.4) * 7.0));
      nx = mix(nx, uHi, m);
    } else nx = mix(nx, uBase, m);
  }
  nx = clamp(nx, vec2(1e-4, 0.0), uMax);
  if (!(nx.x >= 0.0 && nx.y >= 0.0)) nx = uBase;   // NaN guard
  o = vec4(nx, 0.0, 1.0);
}`;

const SEED_FS = HEAD + `
uniform sampler2D uS; uniform int uAdd; uniform ivec2 uSize;
uniform vec2 uBase, uHi, uNoise; uniform float uSeed;
uniform vec4 uBlobs[64]; uniform int uN;
out vec4 o;
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031 + uSeed * 0.013); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec2 c = vec2(p) + 0.5;
  vec2 s = uAdd == 1 ? texelFetch(uS, p, 0).xy : uBase + (vec2(hash(c), hash(c + 17.31)) - 0.5) * 2.0 * uNoise;

      cx.font = `italic 500 15px ${FONT_DISP}`; const cw2 = Math.max(170, cx.measureText(cl).width + 28);
      cx.fillStyle = 'rgba(5,6,12,0.66)'; cx.beginPath();
      if (cx.roundRect) cx.roundRect(lp.x - cw2 / 2, ty - 5, cw2, 56, 8); else cx.rect(lp.x - cw2 / 2, ty - 5, cw2, 56);
      cx.fill();
      cx.font = `500 10.5px ${FONT_MONO}`;
      tickText(lp.x, ty, 'F ' + S.F.toFixed(4) + '  k ' + S.k.toFixed(4), 'center', 'rgba(236,230,214,0.9)');
      cx.font = `italic 500 15px ${FONT_DISP}`;
      tickText(lp.x, ty + 15, cl, 'center', '#f5b83d');
      cx.font = `500 9.5px ${FONT_MONO}`; tickText(lp.x, ty + 38, small ? 'tap the lens to dive in' : 'click the lens to dive in', 'center', 'rgba(151,157,178,0.85)');
    }
  }
  // title
  cx.textBaseline = 'alphabetic';
  cx.font = `italic 500 ${small ? 18 : 24}px ${FONT_DISP}`;
  tickText(r.x, r.y - 12, 'The Gray–Scott atlas', 'left', 'rgba(236,230,214,0.95)');
  if (!small) { cx.font = `500 10.5px ${FONT_MONO}`; tickText(r.x + r.w, r.y - 12, 'one live simulation · ' + MAPW + ' × ' + MAPH + ' cells · step ' + Cosmos.fmt.num(map.steps), 'right', 'rgba(151,157,178,0.9)'); }
  cx.globalAlpha = 1;
}
function mapClassAt(x, y) {   // the Pearson class whose label is under (x, y) in CSS px, if any
  if (mapT < 0.9) return null;
  const r = mapTransform(mapT), rad = small ? 12 : 14;
  let best = null, bd = rad;
  for (const cl of CLASSES) {
    const d = Math.hypot(x - (r.x + (cl.F - MAP_F[0]) / (MAP_F[1] - MAP_F[0]) * r.w), y - (r.y + (MAP_K[1] - cl.k) / (MAP_K[1] - MAP_K[0]) * r.h));
    if (d < bd) { bd = d; best = cl; }
  }
  return best;
}
function loupePos(r) {
  // the loupe sits in an empty uniform region of the atlas: the blue state (lower right) or the red state (upper left)
  if (S.model !== 'gs') return null;
  const x = r.x + (S.F - MAP_F[0]) / (MAP_F[1] - MAP_F[0]) * r.w, y = r.y + (MAP_K[1] - S.k) / (MAP_K[1] - MAP_K[0]) * r.h;
  if (small) {   // phones: the atlas is short and wide, so the loupe sits in the free space beneath it
    const R = Math.min(84, (canvas.clientHeight - (r.y + r.h) - 230) / 2);
    if (R > 40) return { x: r.x + r.w / 2, y: r.y + r.h + 58 + R, r: R };
  }
  const R = Math.min(small ? 52 : 96, r.h * 0.2);
  const A = { x: r.x + r.w * 0.7, y: r.y + r.h * 0.7 }, B = { x: r.x + r.w * 0.13 + R * 0.4, y: r.y + r.h * 0.17 + R * 0.3 };
  const p = Math.hypot(x - A.x, y - A.y) > R * 1.9 ? A : B;   // the lower-right blue state is always empty; move only if the crosshair is under it
  return { x: p.x, y: p.y, r: R };
}
function mapTransform(m) {
  // map rect animates from a deep zoom around the crosshair (tissue scale) to the full atlas
  const R = mapRect();
  const mm = U.clamp(m, 0, 1), e = mm < 0.5 ? 4 * mm * mm * mm : 1 - Math.pow(-2 * mm + 2, 3) / 2;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const fx = (S.F - MAP_F[0]) / (MAP_F[1] - MAP_F[0]), fy = (MAP_K[1] - S.k) / (MAP_K[1] - MAP_K[0]);
  const Z = Math.max(5, cellPx * MAPW / R.w * 1.6);
  const s = Math.exp(Math.log(Math.max(1, Z)) * (1 - e));
  const pcx = U.lerp(W / 2, R.x + fx * R.w, e), pcy = U.lerp(H / 2, R.y + fy * R.h, e);
  return { x: pcx - fx * R.w * s, y: pcy - fy * R.h * s, w: R.w * s, h: R.h * s };
}
function currentClassLabel() {
  if (S.model !== 'gs') return MODELS[S.model].label;
  const loc = localMapState(S.F, S.k);
  const k0 = snK(S.F);
  if (loc && loc.std < 0.012) {
    if (loc.mean < 0.02) return 'uniform · u = 1, v = 0';
    return 'uniform · the blue state';
  }
  if (!loc && S.k > k0 + 0.012) return 'uniform · u = 1, v = 0';
  const q = classify(S.F, S.k);
  return q.near ? 'near ' + q.c.g + ' · ' + q.c.d : 'between ' + q.c.g + ' and ' + q.c2.g;
}
function classTag() {   // short form for the HUD: the Pearson class only when the point is close to one
  if (S.model !== 'gs') return '';
  const q = classify(S.F, S.k);
  return q.near ? ' · ' + q.c.g + ' region' : ' · between ' + q.c.g + ' and ' + q.c2.g;
}

/* ================================================================ resize */
ch.onResize(() => {
  const [w, h] = simDims();
  if (Math.abs(w - SW) < 2 && Math.abs(h - SH) < 2) return;
  sim = resampleSim(sim, w, h); SW = w; SH = h;
  if (coat) { buildMask(); }
  ensureProbe();
});

/* ================================================================ sound: a quiet sonification */
const snd = { on: false, osc: [], gain: null, filt: null, lastComps: 0 };
function soundInit() {
  const ac = ch.sound.ensure(); if (!ac || snd.gain) return;
  snd.gain = ac.createGain(); snd.gain.gain.value = 0;
  snd.filt = ac.createBiquadFilter(); snd.filt.type = 'lowpass'; snd.filt.frequency.value = 900; snd.filt.Q.value = 0.7;
  snd.filt.connect(snd.gain).connect(ch.sound.out);
  [1, 1.5, 2, 3].forEach((m, i) => { const o = ac.createOscillator(); o.type = i ? 'sine' : 'triangle'; o.frequency.value = 110 * m; const g = ac.createGain(); g.gain.value = [0.22, 0.12, 0.08, 0.04][i]; o.connect(g).connect(snd.filt); o.start(); snd.osc.push(o); });
}
ch.onSound((on) => { snd.on = on; if (on) soundInit(); if (snd.gain) snd.gain.gain.setTargetAtTime(on ? 0.16 : 0, ch.sound.ctx.currentTime, 0.4); });
function pluck(freq, when) {
  const ac = ch.sound.ctx; if (!ac || !snd.on) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(0.09, when + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, when + 1.4);
  o.connect(g).connect(ch.sound.out); o.start(when); o.stop(when + 1.5);
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
function soundUpdate() {
  if (!snd.on || !snd.gain) return;
  const ac = ch.sound.ctx, now = ac.currentTime;
  const base = A.lambda ? U.clamp(55 * 16 / A.lambda * 2, 55, 220) : 82.4;
  snd.osc.forEach((o, i) => o.frequency.setTargetAtTime(base * [1, 1.5, 2, 3][i], now, 1.2));
  snd.filt.frequency.setTargetAtTime(300 + 2200 * A.coverage, now, 0.8);
  const born = A.comps - snd.lastComps;
  if (A.morph.indexOf('spots') >= 0 && born > 0 && snd.lastComps > 0) {
    for (let i = 0; i < Math.min(4, born); i++) pluck(base * 4 * Math.pow(2, PENTA[(Math.random() * PENTA.length) | 0] / 12), now + 0.05 + i * 0.13);
  }
  snd.lastComps = A.comps;
}

/* ================================================================ main loop */
let warm = small ? 1000 : 1400;          // warm-up steps spread over the first frames
let mapWarm = small ? 3000 : 6000;
let probeClock = 0, thumbClock = 0, hudClock = 0, frameN = 0, fpsAcc = 0, fpsN = 0, fps = 60, lightAng = 2.2;
let nanResets = 0, lastNow = 0, gov = 1;

applyPreset('leopard', true);
seed(map, [], false, { base: [1, 0], hi: [0.5, 0.25], noise: [0, 0] });
seed(map, randomBlobs(map, Math.round(MAPW * MAPH / 1100), 2, 5, U.rng(1993), false), true, { base: [1, 0], hi: [0.5, 0.25], noise: [0, 0] });
updateTheory();
hud.model.set('Gray–Scott');

const MAP_SETUP = { id: 0, D: [DU_GS, DU_GS / 2], P: [0, 0, 0, 0], base: [1, 0], hi: [0.5, 0.25], max: [1, 1], noise: [0, 0], dt: 1 };
const MAP_OPTS = { setup: MAP_SETUP, F: 0, k: 0, grad: 3, GR: new Float32Array([MAP_F[0], MAP_F[1], MAP_K[0], MAP_K[1]]), aniso: new Float32Array(4), mask: false };
const simOpts = { setup, F: 0, k: 0, grad: 0, GR: new Float32Array(4), aniso: new Float32Array(4), mask: false, brush, brushR: 8 };

const tq = gl.getExtension('EXT_disjoint_timer_query_webgl2');
const gpuT = { q: null, ms: 0, acc: 0, n: 0 };
ch.loop((dt, t) => {
  frameN++;
  if (tq && !gpuT.q) { gpuT.q = gl.createQuery(); gl.beginQuery(tq.TIME_ELAPSED_EXT, gpuT.q); gpuT.open = true; }
  Cosmos.gl.fit(canvas, small ? 2 : 1.5);
  const running = !ch.paused;
  // pointer painting
  if (ptr.down && !mapMode && !ptr.mapDrag && !tail3d) {
    const [x0, y0] = toCell(ptr.lx, ptr.ly), [x1, y1] = toCell(ptr.x, ptr.y);
    brush.active = true; brush.mode = ptr.erase ? -1 : 1; brush.x0 = x0; brush.y0 = y0; brush.x1 = x1; brush.y1 = y1;
    brush.frames = (brush.frames || 0) + 1;
    ptr.lx = ptr.x; ptr.ly = ptr.y;
  } else brush.active = false;
  if (running) tourUpdate(dt);
  if (running && S.wander && S.model === 'gs' && !coat && !tour) wanderUpdate(dt);

  // --- simulate
  const aniso = simOpts.aniso;
  const setupNow = setup;
  const dMax = Math.max(setupNow.D[0], setupNow.D[1]);
  const sMax = Math.max(0, Math.min(0.6, 1.9 / (4 * dMax) - 1));
  const sEff = Math.min(S.aniso, sMax), th = S.anisoAngle * Math.PI / 180;
  aniso[0] = sEff; aniso[1] = Math.cos(2 * th); aniso[2] = Math.sin(2 * th); aniso[3] = 0;
  ANISO_W[0] = S.anisoSp === 'v' ? 0 : 1; ANISO_W[1] = S.anisoSp === 'u' ? 0 : 1;
  simOpts.setup = setupNow; simOpts.F = S.F; simOpts.k = S.k; simOpts.mask = useMask; simOpts.brushR = S.brush; simOpts.topo = tail3d;
  simOpts.grad = S.model === 'gs' ? { off: 0, F: 1, k: 2, Fk: 3 }[S.grad] : 0;
  const GR = gradRange(); simOpts.GR[0] = GR[0]; simOpts.GR[1] = GR[1]; simOpts.GR[2] = GR[2]; simOpts.GR[3] = GR[3];
  let n = running ? Math.max(1, Math.round(S.speed * gov)) : (brush.active ? 1 : 0);
  if (running && warm > 0) { const w = Math.min(warm, frameN < 3 ? 60 : 160); n += w; warm -= w; }
  if (tour && running) n = Math.max(n, 28);
  const PR = Cosmos.debug.prof || {};
  if (running && S.grow > 0 && !coat) { const gx = 1 + S.grow / 100 * dt; growPass(sim, gx, 1); S.growLen *= gx; }
  if (!PR.noMain) stepSim(sim, n, simOpts);
  let mn = 0;
  if (running) {
    const deckShown = !!document.querySelector('.cz-deck.cz-open'), mature = map.steps > 60000;
    mn = Math.round((mapMode || tour ? 26 : deckShown ? (mature ? 5 : (small ? 6 : 10)) : (mature ? 0 : 6)) * gov);
    if (mapWarm > 0) { const w = Math.min(mapWarm, small ? 40 : 90); mn += w; mapWarm -= w; }
  }
  if (!PR.noMap) stepSim(map, mn, MAP_OPTS);

  // --- light
  if (S.lightOrbit) lightAng += dt * 0.12;
  LIGHT[0] = Math.cos(lightAng) * 0.78; LIGHT[1] = Math.sin(lightAng) * 0.78; LIGHT[2] = 0.62;   // constant 38° elevation

  // --- targets for mapMode transition
  const target = mapMode ? 1 : 0;
  const now = performance.now(), rdt = Math.min(0.05, (now - (lastNow || now)) / 1000); lastNow = now;   // real time, also while paused
  mapT = target > mapT ? Math.min(1, mapT + rdt / 1.5) : Math.max(0, mapT - rdt / 1.0);
  if (Math.abs(target - mapT) < 0.002) mapT = target;

  // --- render
  const dprS = canvas.width / Math.max(1, canvas.clientWidth);
  viewPass(sim, useMask);
  if (mapT > 0.001) viewPass(map, false);
  Cosmos.gl.screen(gl);
  gl.clearColor(0.02, 0.022, 0.035, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  const pal = S.palette;
  const tissue = { map: [0, 0, 1 / canvas.width, 1 / canvas.height], range: pigRange(), pal, t, cellPx: canvas.width / SW, mask: useMask, relief: S.relief, texture: tgTex.value, alpha: 1, vig: 0.6, hud: 1 };
  tissue.fade = (1 - 0.84 * U.smoothstep(0, 0.6, mapT)) * sceneFade;
  if (tail3d) {
    if (!tailCam.dragging) { tailCam.spin += rdt * 0.22; tailCam.yaw += tailCam.vyaw; tailCam.pitch = U.clamp(tailCam.pitch + tailCam.vpitch, -0.25, 1.2); tailCam.vyaw *= 0.94; tailCam.vpitch *= 0.94; }
    gl.useProgram(P.bg); const dW = (!small && document.querySelector('.cz-deck.cz-open')) ? 340 * dprS : 0;
    gl.uniform2f(L.bg.uRes, canvas.width, canvas.height); gl.uniform2f(L.bg.uC, (canvas.width - dW) / 2, canvas.height * 0.5); gl.uniform1f(L.bg.uFade, tissue.fade); drawTri();
    tissue.relief = Math.max(S.relief, 0.6);
    if (!PR.noRender) renderTail(tissue);
  } else if (!PR.noRender) renderPass(sim, tissue);
  if (mapT > 0.001) {
    const r = mapTransform(mapT);
    const H = canvas.height;
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    const x0 = r.x * dprS, y0 = H - (r.y + r.h) * dprS, w = r.w * dprS, h = r.h * dprS;
    renderPass(map, { map: [x0, y0, 1 / w, 1 / h], clip: [Math.max(0, x0), Math.max(0, y0), x0 + w, y0 + h], range: [0.0, 0.36], pal: 'atlas', t, cellPx: w / MAPW, relief: 1, alpha: U.smoothstep(0, 0.45, mapT), vig: 0.2, atlas: true });
    if (mapT > 0.9) {
      const lp = loupePos(mapRect());
      if (lp) {
        const R = lp.r * dprS, cxp = lp.x * dprS, cyp = H - lp.y * dprS;
        const view = Math.min(SW, SH) * 0.45;                     // cells across the loupe
        const sx = view / SW / (2 * R), sy = view / SH / (2 * R);
        renderPass(sim, { map: [cxp - 0.5 / sx, cyp - 0.5 / sy, sx, sy], circle: [cxp, cyp, R], range: pigRange(), pal, t, cellPx: 2 * R / view, relief: S.relief, texture: tgTex.value, alpha: U.smoothstep(0.9, 1, mapT), vig: 0 });
      }
    }
    gl.disable(gl.BLEND);
  }

  // --- readbacks & analysis
  probeClock += dt; thumbClock += dt; hudClock += dt;
  if (readPoll(probeR || { busy: false })) {
    analyse(probeR.data);
    if (A.nan) { nanResets++; ch.toast('The reaction blew up; reseeding.'); reseed(); }
    onAnalysis();
  }
  if (probeClock > 0.45 || !A.ready) { probeClock = 0; probeStart(); }
  if (thumbR && readPoll(thumbR)) {
    thumbImg.getContext('2d').putImageData(thumbData, 0, 0);
    thumbReady = true;
  }
  if (thumbClock > (mapMode || document.querySelector('.cz-deck.cz-open') ? 0.35 : 2) ) { thumbClock = 0; thumbStart(); }
  if (gpuT.open) { gl.endQuery(tq.TIME_ELAPSED_EXT); gpuT.open = false; }
  else if (gpuT.q && gl.getQueryParameter(gpuT.q, gl.QUERY_RESULT_AVAILABLE)) {
    if (!gl.getParameter(tq.GPU_DISJOINT_EXT)) { gpuT.acc += gl.getQueryParameter(gpuT.q, gl.QUERY_RESULT) / 1e6; gpuT.n++; if (gpuT.n >= 10) { gpuT.ms = gpuT.acc / gpuT.n; gpuT.acc = 0; gpuT.n = 0; } }
    gl.deleteQuery(gpuT.q); gpuT.q = null;
  }
  drawDeckMap();
  drawOverlay(t);

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) {
    fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0;
    // governor: trim steps per frame when frames run long, recover when there is headroom
    if (running && frameN > 120) { if (fps < 44) gov = Math.max(0.35, gov * 0.85); else if (fps > 56) gov = Math.min(1, gov * 1.06); }
  }
  if (hudClock > 0.2) {
    hudClock = 0;
    measureHud();
    if (S.model === 'gs') { hud.F.set(S.grad === 'F' || S.grad === 'Fk' ? GR[0].toFixed(4) + ' → ' + GR[1].toFixed(4) : S.F.toFixed(4)); hud.k.set(S.grad === 'k' || S.grad === 'Fk' ? GR[2].toFixed(4) + ' → ' + GR[3].toFixed(4) : S.k.toFixed(4)); }
    else if (S.model === 'gm') { hud.F.set(S.kappa.toFixed(3)); hud.k.set(S.nu.toFixed(2)); }
    else { hud.F.set(S.A.toFixed(2)); hud.k.set(S.B.toFixed(2)); }
    const lab = S.model === 'gs' ? ['Feed F', 'Kill k'] : S.model === 'gm' ? ['Saturation κ', 'Decay ν'] : ['Brusselator A', 'Brusselator B'];
    if (hud.F.el.firstChild.textContent !== lab[0]) { hud.F.el.firstChild.textContent = lab[0]; hud.k.el.firstChild.textContent = lab[1]; }
    hud.steps.set(Cosmos.fmt.num(sim.steps));
    hud.grow.el.style.display = S.grow > 0 && !coat ? '' : 'none';
    if (S.grow > 0) hud.grow.set('length ×' + S.growLen.toFixed(2) + (A.stripes ? ' · ≈' + Math.round(A.stripes * S.growLen) + ' stripes on the body' : ''));
  }
}, { always: true });

const INV_MORPH = { holes: 'spots', spots: 'holes', 'packed spots': 'holes', 'spots + holes': 'spots + holes' };
function onAnalysis() {
  const inv = pigInv(), morph = inv ? (INV_MORPH[A.morph] || A.morph) : A.morph, cov = inv && A.lambda ? 1 - A.coverage : A.coverage;
  const lam = A.lambda ? A.lambda.toFixed(1) + ' cells' : '—';
  hud.lam.set(lam);
  hud.cov.set(Cosmos.fmt.pct(cov, 1));
  let cls;
  const uni = S.model === 'gs' ? currentClassLabel() : '';
  if (coat) cls = 'coat · ' + morph;
  else if (S.model === 'gs' && (S.aniso > 0 || S.grow > 0)) cls = 'anisotropic · ' + morph;
  else if (S.model === 'gs' && S.grad === 'off') cls = uni.indexOf('uniform') === 0 ? uni : morph + classTag();
  else if (S.model === 'gs') cls = 'gradient · ' + morph;
  else cls = morph;
  hud.cls.set(cls);
  ro.lam.set(lam);
  ro.lamT.set(theory.unstable ? (2 * Math.PI / theory.qmax).toFixed(1) + ' cells' : '—');
  ro.morph.set(morph);
  ro.order.set(A.lambda ? A.order.toFixed(2) : '—');
  ro.comps.set(A.lambda ? String(inv ? A.holes : A.comps) : '—');
  ro.cov.set(Cosmos.fmt.pct(cov, 1));
  census.push([A.lambda ? (inv ? A.holes : A.comps) : 0]);
  let note;
  if (S.model === 'gs') {
    if (!theory.has) note = 'Here only the trivial state u = 1, v = 0 exists, and it is linearly stable (σ &lt; 0 for all q). Anything you see is a finite-amplitude structure that sustains itself.';
    else if (theory.osc) note = 'The non-trivial uniform state oscillates (σ(0) &gt; 0): a Hopf regime of waves and chaos.';
    else if (theory.unstable) note = 'Linear theory: the blue uniform state is Turing-unstable, fastest at λ = <b>' + (2 * Math.PI / theory.qmax).toFixed(1) + '</b> cells.';
    else note = 'The blue uniform state exists and is linearly stable here; patterns need a large disturbance.';
  } else {
    note = theory.unstable ? 'Turing-unstable: the band where σ(q) &gt; 0 grows out of noise. Fastest mode λ = <b>' + (2 * Math.PI / theory.qmax).toFixed(1) + '</b> cells.' : (theory.osc ? 'Oscillatory (Hopf) instability at q = 0.' : 'Linearly stable: no band of σ(q) &gt; 0, so noise decays and the sheet stays uniform.');
  }
  theoryNote.innerHTML = '<span class="mg-deck-sub">' + note + '</span>';
  drawSpectrum();
  soundUpdate();
}

Cosmos.debug.state = () => ({
  model: S.model, F: +S.F.toFixed(5), k: +S.k.toFixed(5), ratio: S.ratio, steps: sim.steps, mapSteps: map.steps,
  sim: [SW, SH], map: [MAPW, MAPH], lambda: +A.lambda.toFixed(2), lambdaTheory: theory.unstable ? +(2 * Math.PI / theory.qmax).toFixed(2) : null,
  coverage: +A.coverage.toFixed(3), morph: A.morph, comps: A.comps, order: +A.order.toFixed(2), cls: hud.cls.el.lastChild.textContent,
  range: [+A.lo.toFixed(3), +A.hi.toFixed(3)], mapT: +mapT.toFixed(3), gov: +gov.toFixed(2), gpuMs: +gpuT.ms.toFixed(2), mean: +A.mean.toFixed(4), std: +A.std.toFixed(4), nanResets, fps, mapMode, coat, tour: tour ? tour.i : null, palette: S.palette,
});
Cosmos.debug.preset = (id) => applyPreset(id);
Cosmos.debug.setFK = (F, k) => setFK(F, k);
Cosmos.debug.map = (on) => setMapMode(on);
Cosmos.debug.coat = (k) => enterCoat(k);
Cosmos.debug.tour = (i) => { startTour(); if (i) tour.i = i - 1; };
Cosmos.debug.reseed = (k) => reseed(k);
Cosmos.debug.ptr = ptr; Cosmos.debug.brush = brush;
Cosmos.debug.S = S;
Cosmos.debug.setModel = (m) => { setModel(m, false); };
Cosmos.debug.model = (m) => setModel(m, true);
Cosmos.debug.params = () => paramsChanged();
Cosmos.debug.wander = (on) => setWander(on);
})();
</script>
