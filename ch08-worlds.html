<script>
(function () {
'use strict';
/* ==========================================================================
   Chapter 08 · Birth of Worlds
   Act I  : live N-body accretion of ~2,000 planetesimals in a minimum-mass
            solar nebula (GPU direct O(N²) gravity, block-timestep leapfrog,
            momentum-conserving mergers, tidal gas damping, dispersing gas).
   Act II : the finished Solar System from J2000 Keplerian elements, the
            planetary rose, Kepler's music and a kinematic asteroid belt.
   ========================================================================== */
const U = Cosmos.util, F = Cosmos.fmt, h = Cosmos.h, M4 = Cosmos.mat4;
const SMALL = window.matchMedia('(max-width: 760px)').matches;
const TAU = Math.PI * 2, D2R = Math.PI / 180;

/* ---------------------------------------------------------------- physics */
const GMS = 4 * Math.PI * Math.PI;              // GM☉ in AU³/yr²
const ME_MS = 3.00348959632e-6;                 // M⊕ / M☉
const GME = GMS * ME_MS;                        // G·M⊕ in AU³/yr²
const MS_ME = 1 / ME_MS;                        // 332,946
const AU_CM = 1.495978707e13, ME_G = 5.9722e27;
const RK = Math.cbrt(3 * ME_G / (4 * Math.PI)) / AU_CM; // radius [AU] = RK·(m[M⊕]/ρ[g cm⁻³])^(1/3)
const RHO_ROCK = 3.3, RHO_ICE = 0.93;
const SNOW = 2.7, R_IN = 0.3, R_OUT = 5.0;
const periodYr = (a) => Math.pow(a, 1.5);
const MOON = 0.0123, MERCURY = 0.0553, MARS = 0.107, VENUS = 0.815;

/* ---------------------------------------------------------------- writing */
const STORY = `
<p>A star about a million years old sits inside a flat disk of gas and dust. The dust has already clumped into <strong>planetesimals</strong>: a couple of thousand of them here, each a third to two-thirds of the Moon’s mass. Inside the <em>snow line</em> at 2.7 AU they are rock. Beyond it water freezes into ice, and there is four times more solid material to build with.</p>
<p>Every body pulls on every other one, and when two touch they merge. The biggest grow fastest, because their gravity bends passing bodies into them. This <strong>runaway growth</strong> gives way to <strong>oligarchic growth</strong>: a few embryos each empty a lane of the disk and grow side by side. Growth runs from the inside out, where orbits are fastest.</p>
<p>Then the star’s ultraviolet light boils the gas away. A hole opens near the star and sweeps outward, and nothing calms the embryos any more. Their orbits cross and they collide in <strong>giant impacts</strong>, like the one that made our Moon.</p>
<p><strong>Act II</strong> jumps 4.6 billion years to the finished Solar System, every planet on its real orbit. Join Earth and Venus with a line every few days and a five-petalled rose appears, because 8 Earth years almost exactly equal 13 Venus years.</p>
<h4>Try this</h4>
<ul>
<li>Press <kbd>V</kbd> to ride with the largest embryo. The view turns with it, so the inner disk overtakes it and the outer disk falls behind.</li>
<li>Press <kbd>T</kbd> for the top-down view. Every body leaves a streak: inner orbits sweep long arcs while outer ones barely move. Click a body to see its orbit and feeding zone.</li>
<li>Press <kbd>U</kbd> to switch on the star’s ultraviolet now and watch the glowing edge sweep the gas away. Or press <em>Jump to the giant impacts</em>.</li>
<li>In Act II, wait eight years for the rose to close, then try Jupiter and Saturn. Turn on sound and each planet sings its speed round the Sun, as Kepler imagined.</li>
</ul>`;

const SCIENCE = `
<h4>Gravity, summed live</h4>
<p>Each body feels the star and every other body. All pairs are summed directly on the graphics card:</p>
<span class="eq">r̈<sub>i</sub> = −GM<sub>⋆</sub> r<sub>i</sub> / |r<sub>i</sub>|³ + Σ<sub>j≠i</sub> G m<sub>j</sub> (r<sub>j</sub> − r<sub>i</sub>) / (|r<sub>j</sub> − r<sub>i</sub>|² + ε<sub>ij</sub>²)<sup>3/2</sup></span>
<p>Units are AU, years and Earth masses, so GM<sub>☉</sub> = 4π² AU³ yr⁻². The star’s pull is integrated exactly: between kicks every body coasts along its own Kepler ellipse (Wisdom–Holman splitting, with Gauss’s f and g functions). The mutual pulls are applied as kicks. Bodies are sorted by perihelion into four levels; a pair is kicked every 1, 2, 4 or 8 base steps of Δt = P(0.3 AU)/10 ≈ 0.016 yr, set by the slower of the two, equally and oppositely, so momentum is conserved exactly. Inner orbits get about 10 steps each, the outer disk up to 85. The softening ε<sub>ij</sub> equals the sum of the two collision radii. When two bodies come within that distance along their relative path during a step, they merge, conserving mass and momentum.</p>
<p>The star’s term alone gives Kepler’s laws: ellipses with the star at one focus, equal areas in equal times, and P² = a³ with P in years and a in AU.</p>
<h4>The minimum-mass solar nebula</h4>
<p>Smear today’s planets into a smooth disk, add back the missing hydrogen and helium, and you get Hayashi’s nebula:</p>
<span class="eq">Σ<sub>gas</sub> = 1700 g cm⁻² (r / 1 AU)<sup>−3/2</sup></span>
<span class="eq">Σ<sub>solid</sub> = 7.1 g cm⁻² (r / 1 AU)<sup>−3/2</sup> inside 2.7 AU, 30 g cm⁻² (r / 1 AU)<sup>−3/2</sup> beyond</span>
<span class="eq">T = 280 K (r / 1 AU)<sup>−1/2</sup></span>
<p>Water ice condenses below about 170 K, which this temperature law reaches at 2.7 AU: the <strong>snow line</strong>. Between 0.3 and 5 AU the disk holds 3.7 M⊕ of rock inside the snow line and 8.3 M⊕ of ice-rich solids beyond it. With 2,048 bodies, rocky ones start at 0.0038 M⊕ (density 3.3 g cm⁻³) and icy ones at 0.0077 M⊕, 76% ice by mass. The disk colours follow the temperature law: gold near the star, rust towards the snow line, blue beyond it.</p>
<h4>Hill spheres and gravitational focusing</h4>
<span class="eq">R<sub>H</sub> = a (m / 3M<sub>⋆</sub>)<sup>1/3</sup></span>
<p>Inside its Hill sphere a body’s own gravity beats the star’s tide. A body of radius R and escape speed v<sub>esc</sub> = (2Gm/R)<sup>1/2</sup> sweeps up others arriving at speed v<sub>rel</sub> with the cross-section</p>
<span class="eq">σ = πR² (1 + v<sub>esc</sub>² / v<sub>rel</sub>²)</span>
<p>While random velocities are small the focusing term dominates, so dM/dt ∝ M<sup>4/3</sup> and the leader pulls ahead: <strong>runaway growth</strong> (Safronov 1969; Wetherill &amp; Stewart 1989). Once the largest bodies stir their neighbours, growth slows to dM/dt ∝ M<sup>2/3</sup> and similar-sized <strong>oligarchs</strong> emerge, spaced by about b ≈ 10 mutual Hill radii (Kokubo &amp; Ida 1998). Each stops growing when it has eaten its feeding zone, at the isolation mass</p>
<span class="eq">M<sub>iso</sub> ≈ 0.16 M⊕ (b / 10)<sup>3/2</sup> (Σ<sub>solid</sub>(a) a² / 10 g cm⁻² AU²)<sup>3/2</sup></span>
<p>That is about 0.1 M⊕ at 1 AU and about 3 M⊕ at 5 AU in this disk: the dashed curve on the mass plot. Rings on the plot mark today’s Mercury, Venus, Earth and Mars. The golden ellipses in the scene are the current (osculating) orbits of the largest embryos, worked out from their positions and velocities at each read-back from the graphics card.</p>
<h4>Gas: calm, then gone</h4>
<p>While gas remains it damps eccentricities and inclinations. Each velocity relaxes toward the local circular velocity on a timescale that combines drag on small bodies with the tidal damping of embryos (Tanaka &amp; Ward 2004):</p>
<span class="eq">1/τ = 1/τ<sub>drag</sub> + 1/τ<sub>tide</sub>,  τ<sub>drag</sub> ∝ m<sup>1/3</sup> a<sup>3/2</sup>,  τ<sub>tide</sub> ≈ (M<sub>⋆</sub>/m)(M<sub>⋆</sub>/Σ<sub>gas</sub>a²) h⁴ Ω⁻¹ ∝ a² / m</span>
<p>In nature τ<sub>tide</sub> is about 3,300 yr × (0.1 M⊕ / m)(a / 1 AU)² with h = H/r ≈ 0.033. The drag term stands in for the gas drag and collisional damping of the unresolved small bodies that each particle represents. The gas first drains slowly onto the star. Then comes the “ultraviolet switch” (Clarke et al. 2001): once accretion can no longer resupply the inner disk, photoevaporation opens a hole there that sweeps outward in a fraction of the disk’s lifetime. Its glowing inner edge is the pink front. Here the switch trips at 55% of the gas lifetime, or when you press <kbd>U</kbd>, and the hole’s radius then grows e-fold every 5% of the lifetime (at most 400 model years). Real disks last a few million years.</p>
<h4>Timescales in nature</h4>
<ul>
<li>Dust to kilometre-sized planetesimals: about 10⁵ years.</li>
<li>Runaway and oligarchic growth to Moon- and Mars-mass embryos: about 10⁵–10⁶ years at 1 AU, longer farther out.</li>
<li>Gas disk lifetime: about 3–5 million years.</li>
<li>Terrestrial giant-impact phase: 10⁷–10⁸ years (Chambers 2001). The Moon formed when a Mars-sized body struck the proto-Earth, some 30–100 million years after the first solids (Canup &amp; Asphaug 2001).</li>
</ul>
<h4>Act II: the finished system</h4>
<p>Planet positions come from JPL’s J2000 Keplerian elements and their rates per century (valid 1800–2050 and approximate outside it). Kepler’s equation is solved every frame for every planet:</p>
<span class="eq">M = E − e sin E,  r = a (1 − e cos E)</span>
<p>Two planets line up again every synodic period, 1/S = |1/P<sub>A</sub> − 1/P<sub>B</sub>|: 583.9 days for Earth and Venus. Eight Earth years (2,922.0 days) and thirteen Venus years (2,921.1 days) agree to 0.03%, and five synodic periods fit into those eight years. So the lines close into a five-fold rose, the <strong>pentagram of Venus</strong>. The small mismatch turns the pattern backwards by about 2.4° every 8 years.</p>
<p>Asteroids whose orbital period is a simple fraction of Jupiter’s are kicked at the same point of their orbit again and again. The <strong>Kirkwood gaps</strong> sit at a = a<sub>J</sub>(q/p)<sup>2/3</sup>: 3:1 at 2.50 AU, 5:2 at 2.82 AU, 7:3 at 2.95 AU and 2:1 at 3.27 AU (Kirkwood 1867). The belt in Act II is a kinematic model: 10,000 orbits (6,000 on phones) drawn from a smooth fit to the observed distribution, with the gaps, the Hildas held in the 3:2 resonance (resonant angle 3λ<sub>J</sub> − 2λ − ϖ near 0) and the Trojans librating 60° ahead of and behind Jupiter. Hildas and Trojans are over-represented so that they show. Each asteroid follows its own Kepler ellipse. The gaps took millions of years to clear, far too slow to watch. <em>Sort by orbit size</em> redraws every asteroid on a circle of radius a, smeared around it like a ring particle, so the gaps show.</p>
<p>With sound on, each planet’s pitch follows its angular speed around the Sun, raised by whole octaves, as in Kepler’s <em>Harmonices Mundi</em> (1619).</p>
<h4>What is simplified</h4>
<ul>
<li><strong>Few, large bodies.</strong> About 2,000 bodies of a third to two-thirds of a Moon mass stand in for billions of kilometre-sized planetesimals (1,024 on phones).</li>
<li><strong>Inflated radii.</strong> Collision radii are enlarged ×f (default ×10). That raises collision rates by roughly f to f², so the clock runs about 10–100× faster than nature. The clock shows model years.</li>
<li><strong>Strong damping, short gas lifetime.</strong> Damping is strengthened to match the faster clock, and the gas lifetime is set in model years (default 9,000).</li>
<li><strong>Perfect merging.</strong> Real impacts also shatter, erode and spray debris. Here the debris is decoration.</li>
<li><strong>No Jupiter in Act I</strong>, no migration and no aerodynamic drift. The star is fixed at the centre: the whole disk is only 4 × 10⁻⁵ M☉.</li>
<li><strong>Drawn, not computed:</strong> the glowing gas, its spiral wakes, gaps and the photoevaporation front are painted from the gas clock and each embryo’s mass and position, exaggerated so they show at these masses. There is no hydrodynamics. The disk is ray-marched through a flared layer with scale height H ∝ r<sup>5/4</sup>.</li>
<li><strong>Watchable motion.</strong> Each body is drawn on its true, current orbit, but moves along it at a watchable pace (one orbit per 16 s at 1 AU) while the model clock runs far faster. Otherwise the inner disk would spin hundreds of times a second. Switch on <em>True positions</em> to see raw snapshots. The long-exposure streaks trace the last 1.5 s of that display motion along each body’s current orbit. When you ride with an embryo the display slows further, to at least 40 s per orbit, so the turning view stays gentle.</li>
<li>Single-precision arithmetic, coarse steps and heavy super-particles add some spurious heating of the swarm, about 10⁻⁴ of its orbital energy per thousand model years.</li>
<li>T Tauri jets are drawn a few AU long; real ones reach hundreds of AU.</li>
</ul>
<span class="cite">Safronov, V. S. (1969). Evolution of the Protoplanetary Cloud and Formation of the Earth and the Planets. Nauka, Moscow (NASA TT F-677, 1972).</span>
<span class="cite">Hayashi, C. (1981). Structure of the solar nebula, growth and decay of magnetic fields and effects of magnetic and turbulent viscosities on the nebula. Prog. Theor. Phys. Suppl. 70, 35.</span>
<span class="cite">Wetherill, G. W. &amp; Stewart, G. R. (1989). Accumulation of a swarm of small planetesimals. Icarus 77, 330.</span>
<span class="cite">Kokubo, E. &amp; Ida, S. (1998). Oligarchic growth of protoplanets. Icarus 131, 171.</span>
<span class="cite">Chambers, J. E. (2001). Making more terrestrial planets. Icarus 152, 205.</span>
<span class="cite">Kirkwood, D. (1867). Meteoric Astronomy. Lippincott, Philadelphia.</span>
<span class="cite">Wisdom, J. &amp; Holman, M. (1991). Symplectic maps for the N-body problem. AJ 102, 1528.</span>
<span class="cite">Tanaka, H. &amp; Ward, W. R. (2004). Three-dimensional interaction between a planet and an isothermal gaseous disk. II. Eccentricity waves and bending waves. ApJ 602, 388.</span>
<span class="cite">Clarke, C. J., Gendrin, A. &amp; Sotomayor, M. (2001). The dispersal of circumstellar discs: the role of the ultraviolet switch. MNRAS 328, 485.</span>
<span class="cite">Rafikov, R. R. (2002). Planet migration and gap formation by tidally induced shocks. ApJ 569, 997.</span>
<span class="cite">Canup, R. M. &amp; Asphaug, E. (2001). Origin of the Moon in a giant impact near the end of the Earth’s formation. Nature 412, 708.</span>
<span class="cite">Standish, E. M. &amp; Williams, J. G. Keplerian elements for approximate positions of the major planets. JPL Solar System Dynamics.</span>
<span class="cite">Kepler, J. (1619). Harmonices Mundi. Linz.</span>`;

const ch = Cosmos.chapter({ id: 'worlds', notes: STORY, science: SCIENCE });

/* ---------------------------------------------------------------- WebGL */
const canvas = ch.canvas('wd-gl');
const ov = ch.canvas('wd-ov');
const octx = ov.getContext('2d');
const gl = Cosmos.gl.context(canvas, { alpha: false, antialias: false });
if (!gl) { ch.fatal('This chapter needs WebGL2, which this browser does not provide.'); return; }
// Act I integrates thousands of orbits in 32-bit float render targets. Without them, Act II still runs
// (half-float or, failing that, 8-bit colour targets), so the chapter opens there with an explanation.
let NBODY_OK = gl.ext.floatRT && !/[?&]nofloat/.test(location.search);
const HALF_OK = (gl.ext.floatRT || gl.ext.halfFloatRT) && !/[?&]nohalf/.test(location.search);
const HDR_FMT = HALF_OK ? [gl.RGBA16F, gl.HALF_FLOAT] : [gl.RGBA8, gl.UNSIGNED_BYTE];

canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); ch.fatal('The graphics card reset and this simulation lost its state. Reload the page to start again.'); });
const HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\n';
const prog = (vs, fs) => Cosmos.gl.program(gl, vs, fs);
const emptyVAO = gl.createVertexArray();

function mkTex(w, hh, internal, format, type, filter, data) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, hh, 0, format, type, data || null);
  const f = filter || gl.NEAREST;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f === gl.LINEAR_MIPMAP_LINEAR ? gl.LINEAR : f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  t.w = w; t.h = hh;
  return t;
}
const f32Tex = (w, hh, data) => mkTex(w, hh, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST, data);
function mkFBO(texs) {
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  texs.forEach((t, k) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + k, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(texs.map((_, k) => gl.COLOR_ATTACHMENT0 + k));
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (st !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incomplete 0x' + st.toString(16));
  return f;
}
function setU(p, u) { gl.useProgram(p); Cosmos.gl.uniforms(gl, p, u); }
function drawTri() { gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); }

/* ================================================================ SHADERS */
const GLSL_COMMON = `
float h11(float n){ return fract(sin(n) * 43758.5453123); }

    const err = Math.abs(q * lo - p * hi) / (p * hi);

  gl.readBuffer(gl.COLOR_ATTACHMENT1); gl.readPixels(0, 0, TW, rows, gl.RGBA, gl.FLOAT, V);
  gl.readBuffer(gl.COLOR_ATTACHMENT0); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
  let n = 0, se = 0, si = 0, K = 0, Us = 0, Ui = 0, M = 0, big = 0, se2 = 0;
  const idx = [];
  for (let i = 0; i < SIM.N; i++) { const o = i * 4, m = P[o + 3]; if (!(m > 0)) continue; idx.push(i); n++; M += m; big = Math.max(big, m);
    const el = elems(P[o], P[o + 1], P[o + 2], V[o], V[o + 1], V[o + 2]); se += el.e; se2 += el.e * el.e; si += el.i;
    K += 0.5 * m * (V[o] * V[o] + V[o + 1] * V[o + 1] + V[o + 2] * V[o + 2]); Us -= GMS * m / Math.hypot(P[o], P[o + 1], P[o + 2]); }
  for (let a = 0; a < idx.length; a++) for (let b = a + 1; b < idx.length; b++) { const i = idx[a] * 4, j = idx[b] * 4; Ui -= GME * P[i + 3] * P[j + 3] / Math.hypot(P[i] - P[j], P[i + 1] - P[j + 1], P[i + 2] - P[j + 2]); }
  return { t: +SIM.t.toFixed(1), n, meanE: +(se / n).toFixed(5), rmsE: +Math.sqrt(se2 / n).toFixed(5), meanI: +(si / n).toFixed(5), E: K + Us + Ui, Eint: Ui, M: +M.toFixed(4), big: +big.toFixed(4) };
};
Cosmos.debug.runTo = (T) => { let k = 0; while (SIM.t < T && k < 200000) { simSteps(32); k += 32; if (k % 2048 === 0) { compact(); } } return Cosmos.debug.analyze(); };
Cosmos.debug.restart = (o) => { Object.assign(PARAM, o || {}); restartDisk(); return SIM.N; };
Cosmos.debug.bench2 = (zc, n) => { SIM.zcap = zc; while (SIM.step % 32) simSteps(1); compact(); const r = Cosmos.debug.bench(n); SIM.zcap = null; return r; };
Cosmos.debug.setT = (yr) => { SIM.t = yr; };
})();
