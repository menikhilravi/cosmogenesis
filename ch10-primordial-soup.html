<style>
  #ps-gl { cursor: crosshair; }
  #ps-ov { pointer-events: none; }
  body.ps-heating #ps-gl { cursor: none; }
  body.ps-stirring #ps-gl { cursor: grabbing; }
  .ps-scale {
    position: fixed; z-index: 6; pointer-events: none; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--foot-h) + env(safe-area-inset-bottom, 0px) + 16px);
    display: grid; justify-items: center; gap: 5px; font: 500 10.5px/1 var(--f-mono); color: var(--star); letter-spacing: .08em;
    text-shadow: 0 1px 6px rgba(0,0,0,.9); transition: opacity .5s var(--ease);
  }
  .ps-scale i { display: block; height: 3px; border: 1px solid rgba(236,230,214,.85); border-top: 0; box-shadow: 0 1px 6px rgba(0,0,0,.8); }
  .ps-scale small { color: var(--faint); font-size: 9.5px; letter-spacing: .1em; }
  .ps-log {
    position: fixed; z-index: 6; pointer-events: none; left: var(--gutter);
    display: grid; gap: 3px; font: 500 10.5px/1.35 var(--f-mono); color: var(--dust); max-width: min(420px, 60vw);
    text-shadow: 0 1px 8px rgba(0,0,0,.95); transition: opacity .5s var(--ease);
  }
  .ps-log div { opacity: 0; transform: translateY(-4px); transition: opacity .6s var(--ease), transform .6s var(--ease); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ps-log div.on { opacity: 1; transform: none; }
  .ps-log div.old { opacity: .45; }
  .ps-log b { color: var(--era); font-weight: 500; }
  .ps-log em { color: var(--faint); font-style: normal; margin-right: 8px; }
  body.cz-cinema .ps-log, body.cz-cinema .ps-scale { opacity: 0; }
  .ps-mat { touch-action: none; cursor: ns-resize; }
  .ps-thumbs { cursor: pointer; touch-action: pan-y; }
  .ps-petri { touch-action: pan-y; }
  .ps-status { font: 500 11px/1.4 var(--f-mono); color: var(--dust); display: flex; justify-content: space-between; gap: 8px; }
  .ps-status b { color: var(--era); font-weight: 500; }
  .ps-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 500 10.5px/1.3 var(--f-mono); color: var(--dust); }
  .ps-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; box-shadow: 0 0 6px currentColor; }
  .ps-nb { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; margin: 0 0 14px; }

  .ps-tip {
    position: fixed; z-index: 60; pointer-events: none; padding: 6px 9px; border-radius: 6px; background: var(--panel-solid); border: 1px solid var(--line-strong);
    font: 500 11px/1.35 var(--f-mono); color: var(--star); opacity: 0; transition: opacity .15s; white-space: nowrap;
  }

  }

<script src="cosmos.js"></script>
<script>
/*CORE-BEGIN*/
function PLCore() {
  'use strict';
  // Half-shell neighbour offsets: each unordered pair of cells is visited once.
  const OX = [0, 1, -1, 0, 1], OY = [0, 0, 1, 1, 1];

  function rng(seed) {
    let s = seed >>> 0;
    return function () { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  function create() {
    const S = {
      N: 0, K: 4, W: 480, H: 300, rMax: 12, beta: 0.3, rep: 1, noise: 0, halfLife: 0.04, forceK: 10, dt: 0.02, vMax: 0,
      A: new Float32Array(64), steps: 0, time: 0, seed: 1,
      linkFrac: 0.33, minPts: 6, minSize: 12,
    };
    let cap = 0;
    let x, y, vx, vy, sp;                 // identity order
    let sx, sy, svx, svy, ssp, fx, fy, order, cellOf, nbc, parent; // sorted order
    let lab, prevLab;                     // identity order cluster labels
    let cols = 0, rows = 0, cw = 1, chh = 1, nc = 0, cellStart = null, cursor = null, gridKey = '';
    const kicks = [];                     // pending velocity perturbations {x,y,r,vx,vy,heat}
    let nrs = 1;                          // xorshift state for Brownian noise

    function alloc(n) {
      if (n <= cap) return;
      const c = Math.ceil(n * 1.25);
      const grow = (Old, T) => { const a = new T(c); if (Old) a.set(Old.subarray(0, Math.min(Old.length, c))); return a; };
      x = grow(x, Float32Array); y = grow(y, Float32Array); vx = grow(vx, Float32Array); vy = grow(vy, Float32Array); sp = grow(sp, Uint8Array);
      lab = grow(lab, Int32Array); prevLab = grow(prevLab, Int32Array);
      sx = new Float32Array(c); sy = new Float32Array(c); svx = new Float32Array(c); svy = new Float32Array(c); ssp = new Uint8Array(c);
      fx = new Float32Array(c); fy = new Float32Array(c); order = new Int32Array(c); cellOf = new Int32Array(c); nbc = new Uint16Array(c); parent = new Int32Array(c);
      cap = c;
    }
    function grid() {
      const key = S.W + ':' + S.H + ':' + S.rMax;
      if (key === gridKey) return;
      gridKey = key;
      cols = Math.max(3, Math.floor(S.W / S.rMax)); rows = Math.max(3, Math.floor(S.H / S.rMax));
      cw = S.W / cols; chh = S.H / rows; nc = cols * rows;
      cellStart = new Int32Array(nc + 1); cursor = new Int32Array(nc + 1);
    }
    function scatter(i0, i1, r) {
      for (let i = i0; i < i1; i++) { x[i] = r() * S.W; y[i] = r() * S.H; vx[i] = 0; vy[i] = 0; sp[i] = i % S.K; lab[i] = -1; prevLab[i] = -1; }
    }
    S.init = function (o) {
      Object.assign(S, o || {});
      if (S.W < 3 * S.rMax) S.W = 3 * S.rMax; if (S.H < 3 * S.rMax) S.H = 3 * S.rMax;
      alloc(S.N); grid();
      const r = rng(S.seed);
      scatter(0, S.N, r);
      S.steps = 0; S.time = 0; kicks.length = 0; nrs = (S.seed ^ 0x9e3779b9) >>> 0 || 1;
    };
    S.setMatrix = function (a, K) { if (K != null) S.K = K; S.A.fill(0); for (let i = 0; i < S.K * S.K; i++) S.A[i] = a[i] || 0; };
    S.setSpecies = function (K) { S.K = K; for (let i = 0; i < S.N; i++) sp[i] = i % K; };
    S.setCount = function (n, seed) {
      const old = S.N; alloc(n); S.N = n;
      if (n > old) scatter(old, n, rng(seed || (S.steps + 7)));
    };
    S.setWorld = function (W, H) {
      // rescale positions into a new torus
      const kx = W / S.W, ky = H / S.H;
      for (let i = 0; i < S.N; i++) { x[i] = Math.min(W - 1e-3, x[i] * kx); y[i] = Math.min(H - 1e-3, y[i] * ky); }
      S.W = W; S.H = H; grid();
    };
    S.set = function (o) { Object.assign(S, o); if (S.W < 3 * S.rMax) S.rMax = S.W / 3; if (S.H < 3 * S.rMax) S.rMax = S.H / 3; grid(); };
    S.kick = function (k) { kicks.push(k); };
    S.arrays = () => ({ x, y, vx, vy, sp, lab });

    function bin() {
      const N = S.N, invCw = 1 / cw, invCh = 1 / chh;
      cellStart.fill(0);
      for (let i = 0; i < N; i++) {
        let cx = (x[i] * invCw) | 0, cy = (y[i] * invCh) | 0;
        if (cx >= cols) cx = cols - 1; else if (cx < 0) cx = 0;
        if (cy >= rows) cy = rows - 1; else if (cy < 0) cy = 0;
        const c = cy * cols + cx; cellOf[i] = c; cellStart[c + 1]++;
      }
      for (let c = 0; c < nc; c++) cellStart[c + 1] += cellStart[c];
      cursor.set(cellStart);
      for (let i = 0; i < N; i++) {
        const k = cursor[cellOf[i]]++;
        order[k] = i; sx[k] = x[i]; sy[k] = y[i]; svx[k] = vx[i]; svy[k] = vy[i]; ssp[k] = sp[i];
      }
    }

    function forces() {
      const N = S.N, K = S.K, A = S.A, W = S.W, H = S.H, rMax = S.rMax, rMax2 = rMax * rMax, invR = 1 / rMax;
      const beta = S.beta, invBeta = 1 / beta, inv1b = 1 / (1 - beta), onePb = 1 + beta, rep = S.rep;
      fx.fill(0, 0, N); fy.fill(0, 0, N);
      for (let cy = 0; cy < rows; cy++) {
        for (let cx = 0; cx < cols; cx++) {
          const c = cy * cols + cx, a0 = cellStart[c], a1 = cellStart[c + 1];
          if (a0 === a1) continue;
          for (let nb = 0; nb < 5; nb++) {
            let nx = cx + OX[nb], ny = cy + OY[nb], shx = 0, shy = 0;
            if (nx < 0) { nx += cols; shx = -W; } else if (nx >= cols) { nx -= cols; shx = W; }
            if (ny >= rows) { ny -= rows; shy = H; }
            const c2 = ny * cols + nx, b0 = cellStart[c2], b1 = cellStart[c2 + 1];
            if (b0 === b1) continue;
            const self = nb === 0;
            for (let i = a0; i < a1; i++) {
              const xi = sx[i] - shx, yi = sy[i] - shy, si = ssp[i], rowI = si * K;
              let fxi = 0, fyi = 0;
              for (let j = self ? i + 1 : b0; j < b1; j++) {
                const dx = sx[j] - xi, dy = sy[j] - yi, r2 = dx * dx + dy * dy;
                if (r2 >= rMax2 || r2 < 1e-12) continue;
                const r = Math.sqrt(r2), q = r * invR, ir = 1 / r;
                let fi, fj;
                if (q < beta) { fi = fj = (q * invBeta - 1) * rep; }
                else {
                  const t = 1 - Math.abs(2 * q - onePb) * inv1b, sj = ssp[j];
                  fi = A[rowI + sj] * t; fj = A[sj * K + si] * t;
                }
                const ux = dx * ir, uy = dy * ir;
                fxi += fi * ux; fyi += fi * uy;
                fx[j] -= fj * ux; fy[j] -= fj * uy;
              }
              fx[i] += fxi; fy[i] += fyi;
            }
          }
        }
      }
    }

    function integrate() {
      const N = S.N, W = S.W, H = S.H, dt = S.dt;
      const fr = Math.pow(0.5, dt / S.halfLife), fs = S.rMax * S.forceK * dt;
      const vMax = S.vMax > 0 ? S.vMax : S.rMax * 40, vMax2 = vMax * vMax;
      let nk = kicks.length;
      const nz = S.noise * 3.4641016 / 4294967296; // uniform in ±√3·σ per axis → rms σ
      let rs = nrs;
      for (let k = 0; k < N; k++) {
        let ux = svx[k] * fr + fx[k] * fs, uy = svy[k] * fr + fy[k] * fs;
        if (nz) {
          rs ^= rs << 13; rs ^= rs >>> 17; rs ^= rs << 5; ux += ((rs >>> 0) - 2147483648) * nz;
          rs ^= rs << 13; rs ^= rs >>> 17; rs ^= rs << 5; uy += ((rs >>> 0) - 2147483648) * nz;
        }
        if (nk) {
          for (let q = 0; q < nk; q++) {
            const kk = kicks[q];
            let dx = sx[k] - kk.x, dy = sy[k] - kk.y;
            if (dx > W * 0.5) dx -= W; else if (dx < -W * 0.5) dx += W;
            if (dy > H * 0.5) dy -= H; else if (dy < -H * 0.5) dy += H;
            const d2 = dx * dx + dy * dy, r2 = kk.r * kk.r;
            if (d2 > r2) continue;
            const w = 1 - d2 / r2;
            ux += kk.vx * w; uy += kk.vy * w;
            if (kk.radial) { const d = Math.sqrt(d2) + 1e-3; ux += dx / d * kk.radial * w; uy += dy / d * kk.radial * w; }
            if (kk.heat) { ux += (kk.rnd() - 0.5) * kk.heat * w; uy += (kk.rnd() - 0.5) * kk.heat * w; }
          }
        }
        const v2 = ux * ux + uy * uy;
        if (!(v2 <= vMax2)) { if (v2 > vMax2) { const s = vMax / Math.sqrt(v2); ux *= s; uy *= s; } else { ux = 0; uy = 0; } }
        let px = sx[k] + ux * dt, py = sy[k] + uy * dt;
        if (px < 0) px += W; else if (px >= W) px -= W;
        if (py < 0) py += H; else if (py >= H) py -= H;
        if (!(px >= 0 && px < W)) px = Math.random() * W;
        if (!(py >= 0 && py < H)) py = Math.random() * H;
        const id = order[k];
        x[id] = px; y[id] = py; vx[id] = ux; vy[id] = uy;
      }
      kicks.length = 0; nrs = rs;
    }

    S.step = function (n) {
      n = n || 1;
      for (let s = 0; s < n; s++) {
        bin(); forces(); integrate();
        S.steps++; S.time += S.dt;
      }
    };

    /* ---- cluster statistics (DBSCAN-like on the cell grid) ---- */
    function find(a) { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; }
    S.stats = function (maxList) {
      const N = S.N, W = S.W, H = S.H, eps = S.rMax * S.linkFrac, eps2 = eps * eps, minPts = S.minPts;
      bin();
      nbc.fill(0, 0, N);
      // pass 1: neighbour counts within eps
      for (let cy = 0; cy < rows; cy++) for (let cx = 0; cx < cols; cx++) {
        const c = cy * cols + cx, a0 = cellStart[c], a1 = cellStart[c + 1];
        if (a0 === a1) continue;
        for (let nb = 0; nb < 5; nb++) {
          let nx = cx + OX[nb], ny = cy + OY[nb], shx = 0, shy = 0;
          if (nx < 0) { nx += cols; shx = -W; } else if (nx >= cols) { nx -= cols; shx = W; }
          if (ny >= rows) { ny -= rows; shy = H; }
          const c2 = ny * cols + nx, b0 = cellStart[c2], b1 = cellStart[c2 + 1];
          for (let i = a0; i < a1; i++) {
            const xi = sx[i] - shx, yi = sy[i] - shy;
            for (let j = nb === 0 ? i + 1 : b0; j < b1; j++) {
              const dx = sx[j] - xi, dy = sy[j] - yi;
              if (dx * dx + dy * dy < eps2) { nbc[i]++; nbc[j]++; }
            }
          }
        }
      }
      for (let i = 0; i < N; i++) parent[i] = i;
      // pass 2: link core-core pairs, and border points to a core
      for (let cy = 0; cy < rows; cy++) for (let cx = 0; cx < cols; cx++) {
        const c = cy * cols + cx, a0 = cellStart[c], a1 = cellStart[c + 1];
        if (a0 === a1) continue;
        for (let nb = 0; nb < 5; nb++) {
          let nx = cx + OX[nb], ny = cy + OY[nb], shx = 0, shy = 0;
          if (nx < 0) { nx += cols; shx = -W; } else if (nx >= cols) { nx -= cols; shx = W; }
          if (ny >= rows) { ny -= rows; shy = H; }
          const c2 = ny * cols + nx, b0 = cellStart[c2], b1 = cellStart[c2 + 1];
          for (let i = a0; i < a1; i++) {
            const ci = nbc[i] >= minPts;
            const xi = sx[i] - shx, yi = sy[i] - shy;
            for (let j = nb === 0 ? i + 1 : b0; j < b1; j++) {
              const cj = nbc[j] >= minPts;
              if (!ci && !cj) continue;
              const dx = sx[j] - xi, dy = sy[j] - yi;
              if (dx * dx + dy * dy < eps2) {
                if (ci && cj) { const ra = find(i), rb = find(j); if (ra !== rb) { if (ra < rb) parent[rb] = ra; else parent[ra] = rb; } }
                else if (ci) { if (parent[j] === j) parent[j] = find(i); }
                else { if (parent[i] === i) parent[i] = find(j); }
              }
            }
          }
        }
      }
      // gather clusters
      const rootId = new Map();
      const cl = [];
      for (let k = 0; k < N; k++) {
        const r = find(k);
        let id = rootId.get(r);
        if (id === undefined) { id = cl.length; rootId.set(r, id); cl.push({ n: 0, rx: sx[k], ry: sy[k], sx: 0, sy: 0, sxx: 0, syy: 0, sxy: 0, svx: 0, svy: 0, sv2: 0, L: 0, sp: new Int32Array(S.K), id }); }
        const c = cl[id];
        let dx = sx[k] - c.rx, dy = sy[k] - c.ry;
        if (dx > W * 0.5) dx -= W; else if (dx < -W * 0.5) dx += W;
        if (dy > H * 0.5) dy -= H; else if (dy < -H * 0.5) dy += H;
        const u = svx[k], v = svy[k];
        c.n++; c.sx += dx; c.sy += dy; c.sxx += dx * dx; c.syy += dy * dy; c.sxy += dx * dy; c.svx += u; c.svy += v; c.sv2 += u * u + v * v; c.L += dx * v - dy * u;
        c.sp[ssp[k]]++;
        cellOf[k] = id; // reuse: sorted index -> cluster id
      }
      const minSize = S.minSize;
      let nBig = 0, inBig = 0, speedSum = 0, tSum = 0, cohSum = 0, rotSum = 0, rgSum = 0, elongSum = 0, mixSum = 0;
      for (let k = 0; k < N; k++) speedSum += Math.sqrt(svx[k] * svx[k] + svy[k] * svy[k]);
      const big = [];
      for (const c of cl) {
        const n = c.n, mx = c.sx / n, my = c.sy / n, vxm = c.svx / n, vym = c.svy / n;
        const cxx = c.sxx / n - mx * mx, cyy = c.syy / n - my * my, cxy = c.sxy / n - mx * my;
        const I = (cxx + cyy) * n;
        c.cx = c.rx + mx; c.cy = c.ry + my; if (c.cx < 0) c.cx += W; else if (c.cx >= W) c.cx -= W; if (c.cy < 0) c.cy += H; else if (c.cy >= H) c.cy -= H;
        c.vx = vxm; c.vy = vym; c.rg = Math.sqrt(Math.max(0, cxx + cyy));
        const tr = cxx + cyy, det = cxx * cyy - cxy * cxy, disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));
        const l1 = tr / 2 + disc, l2 = Math.max(1e-9, tr / 2 - disc);
        c.elong = Math.sqrt(l1 / l2);
        c.omega = n > 1 && I > 1e-9 ? (c.L - n * (mx * vym - my * vxm)) / I : 0;
        c.tint = Math.max(0, c.sv2 / n - vxm * vxm - vym * vym);
        if (n >= minSize) {
          nBig++; inBig += n; tSum += c.tint * n; cohSum += Math.sqrt(vxm * vxm + vym * vym) * n; rotSum += Math.abs(c.omega) * n; rgSum += c.rg * n; elongSum += c.elong * n;
          let nsp = 0, H2 = 0; for (let s = 0; s < S.K; s++) if (c.sp[s]) { const p = c.sp[s] / n; H2 -= p * Math.log(p); nsp++; }
          c.mix = S.K > 1 ? H2 / Math.log(S.K) : 0; mixSum += c.mix * n;
          big.push(c);
        } else {
          tSum += c.tint * n + (vxm * vxm + vym * vym) * n; // free particles: all motion is thermal
        }
      }
      // shell structure: radial position of each species inside big clusters (second pass)
      let shell = 0;
      if (big.length) {
        const rs = new Float64Array(cl.length * S.K), rn = new Float64Array(cl.length * S.K);
        for (let k = 0; k < N; k++) {
          const c = cl[cellOf[k]]; if (c.n < minSize) continue;
          let dx = sx[k] - c.cx, dy = sy[k] - c.cy;
          if (dx > W * 0.5) dx -= W; else if (dx < -W * 0.5) dx += W;
          if (dy > H * 0.5) dy -= H; else if (dy < -H * 0.5) dy += H;
          const idx = c.id * S.K + ssp[k]; rs[idx] += Math.sqrt(dx * dx + dy * dy); rn[idx]++;
        }
        let wsum = 0;
        for (const c of big) {
          let lo = Infinity, hi = -Infinity;
          for (let s = 0; s < S.K; s++) { const n = rn[c.id * S.K + s]; if (n >= Math.max(4, c.n * 0.08)) { const m = rs[c.id * S.K + s] / n; lo = Math.min(lo, m); hi = Math.max(hi, m); } }
          c.shell = hi > lo && c.rg > 0 ? (hi - lo) / c.rg : 0;
          shell += c.shell * c.n; wsum += c.n;
        }
        shell /= wsum || 1;
      }
      // identity labels + persistence / divisions against the previous call
      for (let k = 0; k < N; k++) { const id = order[k]; const c = cl[cellOf[k]]; lab[id] = c.n >= minSize ? c.id : -1; }
      let persist = 0, splits = 0, merges = 0, cleanSplits = 0, cellSplits = 0; const events = [];
      if (S._hadPrev) {
        const pairs = new Map(); const prevSize = new Map();
        for (let i = 0; i < N; i++) {
          const p = prevLab[i], q = lab[i];
          if (p >= 0) prevSize.set(p, (prevSize.get(p) || 0) + 1);
          if (p >= 0 && q >= 0) { const key = p * 1048576 + q; pairs.set(key, (pairs.get(key) || 0) + 1); }
        }

        pairs.forEach((cnt, key) => {
          const p = Math.floor(key / 1048576), q = key - p * 1048576;
          if (cnt > (bestOfCur.get(q) || 0)) bestOfCur.set(q, cnt);
          const ps = prevSize.get(p) || 1, qs = cl[q].n;
          if (cnt >= 0.25 * ps && cnt >= S.minSize * 0.6 && qs >= S.minSize) { (kidsOfPrev.get(p) || kidsOfPrev.set(p, []).get(p)).push(q); }
          if (cnt >= 0.25 * qs && cnt >= S.minSize * 0.6) { parentsOfCur.set(q, (parentsOfCur.get(q) || 0) + 1); }
        });
        let pw = 0;
        for (const c of big) { persist += (bestOfCur.get(c.id) || 0); pw += c.n; }
        persist = pw ? persist / pw : 0;
        kidsOfPrev.forEach((kids, p) => {
          if (kids.length >= 2) {
            // a division only counts if the daughters did not also come from other parents (that would be a reshuffle)
            let clean = kids.filter((q) => (parentsOfCur.get(q) || 0) === 1);
            if (clean.length >= 2) {
              splits++;
              clean.sort((u, v) => cl[v].n - cl[u].n);
              const a = cl[clean[0]], b = cl[clean[1]], ps = prevSize.get(p) || 1;
              const ev = { type: 'split', x: a.cx, y: a.cy, x2: b.cx, y2: b.cy, n: ps, n1: a.n, n2: b.n };

                cleanSplits++; ev.clean = true;
                const psh = S._prevShell ? S._prevShell.get(p) || 0 : 0;

                if (psh > 0.6 && (a.shell || 0) > 0.45 && (b.shell || 0) > 0.45 && b.n >= 25) { cellSplits++; ev.cell = true; }
              }
              events.push(ev);
            }
          }
        });
        parentsOfCur.forEach((n) => { if (n >= 2) merges++; });

      const t = prevLab; prevLab = lab; lab = t; S._hadPrev = true;
      const shMap = new Map(); for (const c of big) shMap.set(c.id, c.shell || 0); S._prevShell = shMap;
      big.sort((a, b) => b.n - a.n);
      const out = {
        steps: S.steps, time: S.time, N,
        clusters: nBig, clusteredFrac: inBig / N,
        meanSpeed: speedSum / N, temperature: tSum / N / 2,
        coherent: inBig ? cohSum / inBig : 0, rotation: inBig ? rotSum / inBig : 0, rg: inBig ? rgSum / inBig : 0,
        elong: inBig ? elongSum / inBig : 0, mix: inBig ? mixSum / inBig : 0, shell,
        meanSize: nBig ? inBig / nBig : 0, maxSize: big.length ? big[0].n : 0,
        persist, splits, merges, cleanSplits, cellSplits, events,
      };
      if (maxList) out.list = big.slice(0, maxList).map((c) => ({ x: c.cx, y: c.cy, n: c.n, vx: c.vx, vy: c.vy, rg: c.rg, omega: c.omega, elong: c.elong, shell: c.shell || 0, sp: Array.from(c.sp) }));
      return out;
    };
    return S;
  }

  /* ---- lifelikeness score from a time series of stats (search for life) ---- */
  function score(hist, o) {
    // hist: array of stats objects from the measurement window
    const n = hist.length; if (!n) return { score: 0 };
    const avg = (f) => hist.reduce((s, h) => s + f(h), 0) / n;
    const rMax = o.rMax;
    const clusters = avg((h) => h.clusters), frac = avg((h) => h.clusteredFrac), persist = avg((h) => h.persist);
    const speed = avg((h) => h.meanSpeed) / rMax, coh = avg((h) => h.coherent) / rMax, rot = avg((h) => h.rotation);
    const temp = avg((h) => h.temperature) / (rMax * rMax), mix = avg((h) => h.mix), shell = avg((h) => h.shell), elong = avg((h) => h.elong);
    const meanSize = avg((h) => h.meanSize), splits = hist.reduce((s, h) => s + h.splits, 0), maxFrac = avg((h) => h.maxSize / h.N);
    const expected = o.N / 60; // ~ one cluster per 60 particles is a crowded, cell-like field
    const cCount = Math.min(1, clusters / Math.max(2, expected * 0.35)) * (maxFrac > 0.5 ? 0.3 : 1);
    const cFrac = Math.min(1, frac / 0.6);
    const alive = Math.min(1, (coh + 0.4 * rot) / 0.25);             // movement of whole bodies
    const notGas = 1 / (1 + Math.pow(temp / 0.35, 2));                // hot, jittery soup is penalised
    const stable = Math.pow(Math.max(0, persist), 1.5);
    const organ = 0.5 + 0.5 * Math.min(1, mix * 1.4) * Math.min(1, shell * 1.5 + 0.25);
    const s = cCount * cFrac * stable * (0.35 + 0.65 * alive) * notGas * organ;
    return { score: s, clusters, frac, persist, speed, coh, rot, temp, mix, shell, elong, meanSize, splits, maxFrac };
  }

  return { create, score, rng };
}

<h4>Particle Life</h4>
<p>N particles of K species move in a flat box whose edges wrap around (a torus). Particle i feels every particle j closer than the interaction radius r<sub>max</sub>:</p>
<span class="eq">F<sub>i</sub> = k r<sub>max</sub> Σ<sub>j</sub> f( r<sub>ij</sub> / r<sub>max</sub> ; a<sub>s(i) s(j)</sub> ) r̂<sub>ij</sub></span>

<p>The first branch is a short-range repulsion shared by every pair, so particles never sit on top of each other. The second is a triangular bump of height a that peaks at q = (1 + β)/2. The number a<sub>αβ</sub> is the matrix entry: how strongly species α is drawn to (a &gt; 0) or pushed from (a &lt; 0) species β. Here β = 0.3.</p>
<p>Motion is integrated with strong friction:</p>

<p>with velocity half-life t<sub>½</sub> = 40 ms, time step Δt = 20 ms, force scale k = 10 s⁻² and r<sub>max</sub> = 10 µm. The friction is so strong that a particle forgets its velocity within a few steps, as microscopic objects in water do. Each step also adds a small random velocity kick, uniform with an rms of σ = 1 µm/s per axis, standing in for Brownian motion. The dish holds 12 particles per (10 µm)²: 12,000 particles in 0.1 mm² on a laptop, 4,200 in 0.035 mm² on a phone. The Galaxies rule set uses r<sub>max</sub> = 21 µm, t<sub>½</sub> = 99 ms and k = 7 s⁻² in a smaller dish of 5,000 particles.</p>
<h4>Why lopsided rules make life-like motion</h4>
<p>When a<sub>αβ</sub> ≠ a<sub>βα</sub>, particle i can pull j harder than j pulls i. Momentum is then not conserved and there is no energy function for the system to slide down. A pair of species that chase each other becomes a self-propelled swimmer, and a ring of chasers becomes a rotor. Fruchart and colleagues showed in 2021 that such non-reciprocal interactions generically produce time-dependent phases, chasing and rotating states, in active matter from bird flocks to mixtures of self-propelled particles. Press Symmetrise to set a<sub>αβ</sub> = a<sub>βα</sub>: every force becomes one half of an equal and opposite pair, friction drains the motion, and the dish freezes into a static arrangement. The deck’s non-reciprocity readout is η = ‖A<sub>a</sub>‖ / ‖A‖, the share of the matrix in its antisymmetric part A<sub>a</sub> = (A − Aᵀ)/2 (Frobenius norms): 0 for Newtonian rules and around 0.6 for random ones. The graph under the matrix draws an arrow wherever a<sub>αβ</sub> &gt; 0.25 and marks it gold when β pushes back.</p>

<span class="eq">A(λ) = A<sub>s</sub> + λ A<sub>a</sub>, &nbsp; A<sub>s</sub> = (A + Aᵀ)/2, &nbsp; A<sub>a</sub> = (A − Aᵀ)/2</span>

<h4>What is measured</h4>

<h4>The search for life</h4>
<p>Each experiment draws K between 3 and 7 and every matrix entry uniformly from −1 to +1, then grows 1,400 particles (900 on a phone) at the same density in a separate worker thread: 300 steps to settle, then 8 samples 20 steps apart. Once four good dishes exist, 60% of new experiments are mutants of the best: every entry nudged by a Gaussian with σ between 0.12 and 0.30, and one in eight redrawn. Dishes that stay a thin gas or collapse into one clump are rejected early. The rest are scored</p>
<span class="eq">S = C · Φ · P<sup>1.5</sup> · (0.35 + 0.65 M) · Θ · O</span>
<p>where C rewards many bodies, Φ is the fraction of particles in bodies, P is persistence, M is the motion of whole bodies (drift plus spin), Θ = 1/(1 + (T/T₀)²) with T₀ = 0.35 r<sub>max</sub>² s⁻² penalises a boiling soup, and O rewards bodies built from several species arranged in shells. It is a heuristic stand-in for “looks alive”, run at about one to three experiments per second on a laptop, depending on how many are rejected early.</p>
<p>The <strong>map of rule space</strong> places every experiment by its non-reciprocity η (across) and its mean self-interaction ⟨a<sub>αα</sub>⟩ (up), how much each species likes its own kind. Colour and size show the score, and a smoothed average of the scores glows underneath. The λ dial moves the dish on stage straight across the map, because it leaves the diagonal alone. In a test of 160 random tables, those with ⟨a<sub>αα</sub>⟩ &lt; 0 averaged a score of 0.42 and those with ⟨a<sub>αα</sub>⟩ ≥ 0 averaged 0.17. Species that shun their own kind can only cluster with other species, and the score rewards mixed, layered bodies. The score barely depends on η, because it rewards bodies that last more than bodies that move.</p>
<h4>The real primordial soup</h4>
<p>In the 1920s Aleksandr Oparin and J. B. S. Haldane independently proposed that energy acting on the young Earth’s atmosphere filled the oceans with organic molecules, Haldane’s “hot dilute soup”, from which the first cells assembled. In 1953 Stanley Miller ran sparks through methane, ammonia, hydrogen and water for a week and found amino acids, including glycine and alanine, in the flask. It was the first test of the idea, and it worked.</p>
<p>Walter Gilbert named the <em>RNA world</em> in 1986: before DNA and proteins, RNA may have been both gene and enzyme. Catalytic RNA exists, and the heart of every ribosome, where proteins are joined, is RNA. Fatty acids self-assemble into hollow vesicles in water, and Jack Szostak’s group has made vesicles that grow and divide. A replicating RNA inside a growing vesicle is one proposal for the first protocell. Alkaline hydrothermal vents offer another setting, with natural chemical gradients across thin mineral walls. Tracing 355 protein families found across all life, Weiss and colleagues reconstructed LUCA, the last universal common ancestor, as an anaerobe that lived on hydrogen and carbon dioxide in a hot, vent-like place.</p>
<h4>What is simplified</h4>
<p>This is not chemistry. The particles are not molecules: nothing bonds, reacts, copies itself or uses up fuel. The motion is paid for by the broken third law, an invisible and endless energy supply. None of these bodies carries heredity, which any real definition of life requires. The world is two-dimensional. The glowing rims are drawn at a fixed contour of the smoothed particle density: they show where dark-field light would catch the edge of a body, not a modelled membrane. The dish opens hot, with σ = 16 µm/s of Brownian motion cooling to 1 µm/s over about 4 s, so that you see the bodies condense. The scale bar gives a sense of size only; r<sub>max</sub> = 10 µm makes the bodies about as large as real lipid vesicles. Colours are rendering choices. The presets were found by running the same measurements offline on dishes of 1,600 to 3,000 particles, then checked by eye at full size (see the Notebook tab).</p>

  if (fpsAcc > 0.5) {
    fpsS = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    hud.fps.set(Math.round(fpsS) + ' fps'); ro.fps.set(Math.round(fpsS) + ' fps');
  }
}, { always: true });

ch.onResize(() => { fitAll(); drawMatrix(); drawGraph(); placeLog(); drawPetri(); drawThumbs(); drawMap(); drawLamPlot(); freeR = null; });
if (window.ResizeObserver) { const ro2 = new ResizeObserver(() => { drawMatrix(); drawGraph(); drawPetri(); drawThumbs(); drawProgress(); drawMap(); drawLamPlot(); }); [matCanvas, graphCanvas, petri, thumbs, progC, mapC, lamPlot].forEach((c) => ro2.observe(c)); }
function holdSearch() { if (searchW) searchW.postMessage({ type: 'hold', on: ch.paused || document.hidden }); }
ch.onPause(() => holdSearch());
document.addEventListener('visibilitychange', holdSearch);

// debug hook for QA
Cosmos.debug.state = () => ({
  N: simInfo.N, K: P.K, steps: simInfo.steps, simTime: +simInfo.time.toFixed(2), stepMs: +simInfo.ms.toFixed(2), fps: Math.round(fpsS),
  preset: P.preset, seed: P.seed, world: [+P.W.toFixed(1), +P.H.toFixed(1)], zoom: +cam.zoom.toFixed(2),
  clusters: lastStats ? lastStats.clusters : null, clusteredFrac: lastStats ? +lastStats.clusteredFrac.toFixed(3) : null,
  meanSpeed: lastStats ? +lastStats.meanSpeed.toFixed(2) : null, temperature: lastStats ? +lastStats.temperature.toFixed(1) : null,
  persist: lastStats ? +lastStats.persist.toFixed(3) : null, divisions, cellDivisions,
  lam: +P.lam.toFixed(3), eta: +etaOf(P.A, P.K).toFixed(3), drift: lastStats ? +lastStats.coherent.toFixed(2) : null, spin: lastStats ? +lastStats.rotation.toFixed(3) : null,
  noise: +P.noise.toFixed(2), experiments: search.all.length, halos: P.halos,
});
Cosmos.debug.loadPreset = (i) => loadPreset(PRESETS[i]);
Cosmos.debug.loadRule = (r) => loadPreset(Object.assign({ id: 'custom', name: r.name || 'Test rule' }, r));
Cosmos.debug.search = search;
Cosmos.debug.setNoise = (v) => sNoise.set(v, true);

/* ------------------------------------------------------------ boot */
setPalette(null);
fitAll();
placeLog();
drawMatrix();
drawPetri(); drawThumbs(); drawProgress(); drawLamPlot();
loadPreset(PRESETS[0], true);
P.noise = anneal.from; sendParams(); sNoise.set(P.noise);
if (!small) setTimeout(() => { if (!search.running && !search.trials && !document.hidden) startSearch(true); }, 9000);
})();
</script>
</body>
</html>
