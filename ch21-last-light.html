<script>
(function () {
'use strict';

/* =====================================================================
   21 · THE LAST LIGHT
   The far future of one galaxy on a logarithmic clock, 10^10 → 10^110 yr.
   - a restricted N-body merger of the Milky Way and Andromeda (GPU transform
     feedback, deterministic so the clock can be scrubbed backwards)
   - population synthesis per particle: Kroupa IMF, t_MS ∝ M^-2.5, giants,
     supernovae, blue dwarfs, Mestel white-dwarf cooling, brown dwarfs
   - dynamical evaporation, proton decay (τp slider), Hawking evaporation
   - ΛCDM expansion for the CMB temperature and the event horizon
   ===================================================================== */

const U = Cosmos.util, FM = Cosmos.fmt;
const lg = Math.log10;
const clamp = U.clamp, ss = U.smoothstep, lerp = U.lerp;

function hash1(n) { const s = Math.sin(n) * 43758.5453123; return s - Math.floor(s); }

/* ------------------------------------------------------------ constants */
const T0 = 1.3787e10;                 // age of the universe now, yr (Planck 2018)
const X_NOW = lg(T0);                 // 10.1395
const X_MIN = 10, X_MAX = 110;
const X_SF_END = 14;                  // star formation ends (gas exhausted)
const TSF = 1e14;
const H0 = 67.7 / 3.0857e19 * 3.15576e7;  // per yr
const OM = 0.31, OL = 0.69;
const HL = H0 * Math.sqrt(OL);             // late-time de Sitter rate, per yr
const T_CMB0 = 2.7255;
const GAM = 0.35;                          // per-particle brightness compression, as in the shader
const T_DS = 2.2155e-30;                   // de Sitter (Gibbons–Hawking) temperature, K
const S_DS = 3.25e122;                     // horizon entropy / k
const K_EVAP = 2.0957e67;                  // yr per Msun^3 (photon-only Hawking lifetime)
const TH_SUN = 6.17e-8;                    // K, Hawking T for 1 Msun
const S_SUN = 1.049e77;                    // S_BH / k for 1 Msun
const MSUN_KG = 1.98847e30;
const K_EVAP_S = 8.4115e-17;               // s per kg^3
const YR = 3.15576e7;
const small = window.matchMedia('(max-width: 760px)').matches;

/* ------------------------------------------------------------ stellar physics (JS mirror of the shader) */
function tauMS(M) { return 1e10 * Math.pow(M, -2.5) * (1 + 1.2 * ss(0.35, 0.08, M)); }
function logLms(M) {
  if (M < 0.43) return lg(0.23) + 2.3 * lg(M);
  if (M < 2) return 4 * lg(M);
  if (M < 55) return lg(1.4) + 3.5 * lg(M);
  return lg(32000) + lg(M);
}
const TEFF = [[-2, 900], [-1.097, 2300], [-1, 2700], [-0.7, 3200], [-0.5, 3400], [-0.3, 3800], [0, 5770], [0.3, 9000], [0.7, 15500], [1, 25000], [1.5, 38000], [2.1, 45000]];
function remnantOf(M) { // [type, mass]  type: 0 BD, 1 WD, 2 NS, 3 BH
  if (M < 0.08) return [0, M];
  if (M < 0.5) return [1, M];
  if (M < 8) return [1, Math.min(1.35, 0.109 * M + 0.394)];
  if (M < 25) return [2, 1.4];
  return [3, 5 + 0.12 * (M - 25)];
}
/* Kroupa (2001) IMF */
const IMF_SEG = [[0.01, 0.08, 0.3], [0.08, 0.5, 1.3], [0.5, 150, 2.3]];
const IMF_K = [1]; IMF_K[1] = Math.pow(0.08, -0.3) / Math.pow(0.08, -1.3); IMF_K[2] = IMF_K[1] * Math.pow(0.5, -1.3) / Math.pow(0.5, -2.3);
function imfXi(M) { for (let i = 0; i < 3; i++) if (M < IMF_SEG[i][1] || i === 2) return IMF_K[i] * Math.pow(M, -IMF_SEG[i][2]); return 0; }
function imfN(a, b) { let s = 0; IMF_SEG.forEach(([lo, hi, al], i) => { const l = Math.max(lo, a), h = Math.min(hi, b); if (h <= l) return; s += IMF_K[i] * (Math.pow(h, 1 - al) - Math.pow(l, 1 - al)) / (1 - al); }); return s; }
const IMF_CACHE = {};
function sampleKroupa(rng, a, b) {
  const key = a + ',' + b;
  const w = IMF_CACHE[key] || (IMF_CACHE[key] = IMF_SEG.map(([lo, hi]) => (Math.min(hi, b) > Math.max(lo, a) ? imfN(Math.max(lo, a), Math.min(hi, b)) : 0)));
  const tot = w[0] + w[1] + w[2]; let u = rng() * tot, i = 0;
  while (i < 2 && u > w[i]) { u -= w[i]; i++; }
  const [lo, hi, al] = IMF_SEG[i]; const l = Math.max(lo, a), h = Math.min(hi, b); const e = 1 - al;
  const v = rng(); return Math.pow(Math.pow(l, e) + v * (Math.pow(h, e) - Math.pow(l, e)), 1 / e);
}

/* ------------------------------------------------------------ cosmology */
const A_NORM = Math.cbrt(OM / OL);
const A_NOW = A_NORM * Math.pow(Math.sinh(1.5 * Math.sqrt(OL) * H0 * T0), 2 / 3);
/** log10 of the scale factor a(t)/a(now) for t = 10^x years, stable for enormous t */
function logA(x) {
  const arg = 1.5 * Math.sqrt(OL) * H0 * Math.pow(10, Math.min(x, 300));
  let ls;
  if (x > 300 || arg > 30) { // sinh → e^arg/2
    const lnArg = Math.log(1.5 * Math.sqrt(OL) * H0) + x * Math.LN10; // ln(arg)
    const argL = lnArg > 690 ? Infinity : Math.exp(lnArg);
    if (!isFinite(argL)) return { big: true, l10: (lnArg / Math.LN10) }; // log10 of log10(a) handled below
    ls = argL / Math.LN10 - lg(2);
  } else ls = lg(Math.sinh(arg));
  return { big: false, v: lg(A_NORM) + (2 / 3) * ls - lg(A_NOW) };
}
/** CMB temperature: returns {l: log10 T} or {ll: log10(-log10 T)} for astronomically small T */
function cmbT(x) {
  const la = logA(x);
  if (!la.big) {
    const lt = lg(T_CMB0) - la.v;
    if (lt > -1e15) return { l: lt };
    return { ll: lg(-lt) };
  }
  // log10 a = (2/3)(arg/ln10) with log10(arg) = la.l10 → log10(-log10 T) ≈ log10(2/3/ln10) + log10(arg)
  return { ll: lg(2 / 3 / Math.LN10) + la.l10 };
}

/* ------------------------------------------------------------ text */
const NOTES = `
<p>You are looking at our galaxy on a clock that counts powers of ten. Each notch on the ribbon at the bottom marks a time ten times later than the one before it. Everything that has happened so far, all 13.8 billion years, sits in the first sliver at its left edge.</p>
<p>First Andromeda falls in, and the two spirals merge into one smooth, golden galaxy. Then the lights go out in order of brightness. Blue stars burn out first, then yellow ones. The red dwarfs last a thousand times longer, and at the very end they flare blue. Around 10<sup>14</sup> years the gas runs out and the last star is born.</p>
<p>After that the galaxy is a swarm of cinders: white dwarfs cooling to black, neutron stars, brown dwarfs, black holes. Over 10<sup>19</sup> years it evaporates. If protons decay, the cinders dissolve too. Then only black holes remain, and each one slowly evaporates into a last flash of gamma rays. The last is our own central black hole, grown fat on a tenth of the galaxy. After it the universe goes dark, and as far as we know nothing ever happens again.</p>
<p>Starlight is drawn in its true colours, with the exposure raised as the galaxy fades, until even that cannot help. Dead objects are drawn in false colour, and black holes are drawn millions of times larger than they are.</p>
<h4>Try this</h4>
<ul>
<li>Drag along the ribbon to travel. Drag the scene to turn it, scroll or pinch to zoom.</li>
<li>Press <strong>Last black hole</strong> <kbd>B</kbd> to watch the final evaporation, with a countdown down to its last second.</li>
<li>Move the <strong>proton lifetime</strong> slider and watch the degenerate era dissolve earlier or later.</li>
<li>Turn on sound <kbd>M</kbd>. The drone loses a harmonic with each age, and every evaporating black hole rings a bell.</li>
</ul>`;

const SCIENCE = `
<h4>The five ages</h4>
<p>Adams &amp; Laughlin (1997) divide time by the <em>cosmological decade</em> η = log<sub>10</sub>(t / 1 yr). Their Primordial Era runs to η ≈ 5. The <strong>Stelliferous Era</strong> (6 &lt; η &lt; 14) is the age of fusion. In the <strong>Degenerate Era</strong> (15 &lt; η &lt; 39) most baryons sit in white dwarfs, neutron stars and brown dwarfs. In the <strong>Black Hole Era</strong> (40 &lt; η &lt; 100) black holes are the only large objects left, and the <strong>Dark Era</strong> (η &gt; 101) holds only radiation and light particles. The ribbon uses round boundaries at 14, 40 and 100. We live at η = 10.14.</p>

<h4>Population synthesis</h4>
<p>Each particle is a sample of the galaxy, drawn from the Kroupa (2001) initial mass function, ξ(M) ∝ M<sup>−α</sup> with α = 0.3 (0.01–0.08 M<sub>☉</sub>), 1.3 (0.08–0.5) and 2.3 (above 0.5). The main-sequence lifetime is</p>
<span class="eq">t<sub>MS</sub> ≈ 10<sup>10</sup> yr (M/M<sub>☉</sub>)<sup>−2.5</sup> × [1 + 1.2 S(M)]</span>
<p>where S rises from 0 at 0.35 M<sub>☉</sub> to 1 at 0.08 M<sub>☉</sub>. The correction is for fully convective red dwarfs, which burn nearly all their hydrogen instead of about a tenth. It gives about 7 × 10<sup>12</sup> yr at 0.1 M<sub>☉</sub> and 1.2 × 10<sup>13</sup> yr at 0.08 M<sub>☉</sub>, close to the stellar-evolution models of Laughlin, Bodenheimer &amp; Adams (1997). Luminosity follows L ∝ M<sup>2.3</sup> below 0.43 M<sub>☉</sub>, M<sup>4</sup> to 2 M<sub>☉</sub> and M<sup>3.5</sup> above, and colours are blackbody colours of the effective temperature. In the model, stars above 0.5 M<sub>☉</sub> spend a last tenth of their lives as giants. Stars above 8 M<sub>☉</sub> end as supernovae and leave neutron stars, or black holes above 25 M<sub>☉</sub>. Lighter stars leave white dwarfs, with masses from the initial–final relation M<sub>WD</sub> ≈ 0.109 M + 0.394 M<sub>☉</sub> (Kalirai et al. 2008). Black holes keep 5 to 16 M<sub>☉</sub>.</p>
<p>Red dwarfs below about 0.25 M<sub>☉</sub> never become giants. Laughlin et al. (1997) found that as their hydrogen runs down they grow hotter and several times brighter, becoming “blue dwarfs”, before contracting into helium white dwarfs. No blue dwarf exists yet, because no red dwarf has had time to die.</p>

<h4>White-dwarf cooling</h4>
<p>A white dwarf has no fuel and simply cools. Mestel’s (1952) theory gives</p>
<span class="eq">t<sub>cool</sub> ≈ 8.8 × 10<sup>6</sup> yr (A/12)<sup>−1</sup> (M/M<sub>☉</sub>)<sup>5/7</sup> (μ/2)<sup>−2/7</sup> (L/L<sub>☉</sub>)<sup>−5/7</sup></span>
<p>so a 0.6 M<sub>☉</sub> carbon white dwarf is at L ≈ 3 × 10<sup>−5</sup> L<sub>☉</sub> after 10 billion years, matching the faint end of the observed white-dwarf population. By 10<sup>15</sup> yr it is at tens of kelvin, a black dwarf. Crystallisation and Debye cooling speed up the end.</p>

<h4>Star formation stops</h4>
<p>The two galaxies together form about two solar masses of stars a year now. The model lets the rate fall as SFR ∝ t<sup>−2</sup>, with a burst during the merger, and ends it at 10<sup>14</sup> yr when the recycled gas is used up. Young massive stars are drawn by particles that stand for “stars younger than their own lifetime”, and their numbers follow this rate. Before the merger they light up where they cross a rigidly rotating two-armed spiral pattern, as in density-wave theory.</p>

<h4>The merger</h4>
<p>The Milky Way (1.06 × 10<sup>12</sup> M<sub>☉</sub>) and Andromeda (1.6 × 10<sup>12</sup> M<sub>☉</sub>) are rigid potentials: a Hernquist halo and bulge plus a Miyamoto–Nagai disk each. The stars are test particles, integrated with a leapfrog on the GPU in steps of 1.5 Myr, as in Toomre &amp; Toomre’s restricted method. The centres start 780 kpc apart, approaching at 110 km/s with a sideways speed of 29 km/s, and slow by Chandrasekhar dynamical friction. This model makes a first passage about 4 Gyr from now and merges near 6 Gyr. Measured sideways speeds are uncertain, and Gaia-based analyses put the chance of a merger within 10 Gyr at about one half (Sawala et al. 2025). A real merger scrambles orbits by violent relaxation; here the disks are turned into a spheroid by rotating each star’s velocity by small random angles, which keeps its energy. The integration is deterministic, so dragging backwards replays it from today.</p>

<h4>The event horizon and the CMB</h4>
<p>With H<sub>0</sub> = 67.7 km s<sup>−1</sup> Mpc<sup>−1</sup>, Ω<sub>m</sub> = 0.31 and Ω<sub>Λ</sub> = 0.69, the scale factor is</p>
<span class="eq">a(t) ∝ sinh<sup>2/3</sup>(<sup>3</sup>⁄<sub>2</sub> √Ω<sub>Λ</sub> H<sub>0</sub> t), &nbsp; T<sub>CMB</sub> = 2.7255 K / a</span>
<p>Late on, a grows as e<sup>t/17.4 Gyr</sup>. Light that galaxies now more than 16.6 billion light-years away (comoving distance) emit today will never reach us, and the galaxies we can see are redshifted exponentially until they fade. After about 10<sup>11</sup> yr nothing beyond the Local Group is visible (Krauss &amp; Scherrer 2007). By 10<sup>14</sup> yr the CMB temperature is about 10<sup>−2500</sup> K. It drops below the temperature of the cosmic horizon itself, T = ħH/2πk<sub>B</sub> ≈ 2.2 × 10<sup>−30</sup> K (Gibbons &amp; Hawking 1977), at about 10<sup>12</sup> yr.</p>

<h4>Dynamical evaporation</h4>
<p>Two-body encounters exchange energy on the relaxation time</p>
<span class="eq">t<sub>relax</sub> ≈ (N / 8 ln N) t<sub>cross</sub></span>
<p>For N ≈ 10<sup>12</sup> stars and t<sub>cross</sub> ≈ 10<sup>8</sup> yr that is about 5 × 10<sup>17</sup> yr. A stellar system evaporates in roughly a hundred relaxation times, so over 10<sup>19</sup>–10<sup>20</sup> yr most objects are flung out and the rest sink to the centre (Adams &amp; Laughlin 1997). The model ejects 90% of the particles, and sends the rest (preferring heavy remnants) into the central black hole. That grows it from 1.4 × 10<sup>8</sup> M<sub>☉</sub> (Andromeda’s hole, which absorbs the Milky Way’s 4.3 × 10<sup>6</sup> M<sub>☉</sub> Sagittarius A* in the merger) to more than 10<sup>10</sup> M<sub>☉</sub>. Escaping objects are drawn at compressed distances.</p>

<h4>Brown-dwarf collisions</h4>
<p>With number density n ≈ 0.1 pc<sup>−3</sup>, speed v ≈ 200 km/s and cross-section σ ≈ π(2R)²(1 + v<sub>esc</sub>²/v²), a brown dwarf meets another about once every 10<sup>20</sup> yr. In a galaxy of about 10<sup>11</sup> brown dwarfs that is a new low-mass star every few billion years, each shining for trillions. The flashes in the Degenerate Era stand for this process; there are far fewer of them than the real rate.</p>

<h4>Proton decay (hypothetical)</h4>
<p>Grand unified theories predict that protons decay, for example p → e<sup>+</sup>π<sup>0</sup>. None has been seen. Super-Kamiokande finds τ/B(p → e<sup>+</sup>π<sup>0</sup>) &gt; 1.6 × 10<sup>34</sup> yr (Abe et al. 2017), raised to 2.4 × 10<sup>34</sup> yr with more data (Takenaka et al. 2020). The slider starts at that bound. If τ<sub>p</sub> = 10<sup>37</sup> yr, a white dwarf powered by proton decay emits</p>
<span class="eq">L ≈ M c² / τ<sub>p</sub> ≈ 400 W, &nbsp; T<sub>eff</sub> ≈ 0.06 K</span>
<p>and by about 40 τ<sub>p</sub> less than 10<sup>−17</sup> of the degenerate matter is left. The remnants’ mass falls as e<sup>−t/τ<sub>p</sub></sup>, and their glow is drawn in proportion to the energy released per logarithmic interval of time. If protons do not decay, degenerate stars survive much longer.</p>

<h4>Hawking evaporation</h4>
<span class="eq">T<sub>H</sub> = <span class="hb">ħ</span>c³ / (8πGMk<sub>B</sub>) ≈ 6.2 × 10<sup>−8</sup> K (M<sub>☉</sub>/M)</span>
<span class="eq">t<sub>ev</sub> ≈ 5120π G²M³ / <span class="hb">ħ</span>c⁴ ≈ 2.1 × 10<sup>67</sup> yr (M/M<sub>☉</sub>)³</span>
<p>This lifetime counts photons only and treats the hole as a perfect blackbody. Greybody factors and graviton emission (Page 1976) change the coefficient by a factor of order unity. A hole only starts to lose mass once the CMB is colder than T<sub>H</sub>; for 10<sup>10</sup> M<sub>☉</sub> that happens after about 10<sup>12</sup> yr. The mass falls as M(t) = M<sub>0</sub>(1 − t/t<sub>ev</sub>)<sup>1/3</sup>, so the hole spends almost all its life near its original mass and dies fast. In the photon-only estimate, the last second releases about 2 × 10<sup>22</sup> J from about 230 tonnes of mass, at T<sub>H</sub> ≈ 5 × 10<sup>17</sup> K. At those temperatures every particle species is emitted, so the true end is somewhat quicker and hotter.</p>

<h4>Entropy and heat death</h4>
<span class="eq">S<sub>BH</sub> = k c³ A / (4 G <span class="hb">ħ</span>) = 4πG M² k / <span class="hb">ħ</span>c ≈ 1.05 × 10<sup>77</sup> k (M/M<sub>☉</sub>)²</span>
<p>The readout sums the Local Group’s black holes, its CMB photons (about 2 × 10<sup>77</sup> k in a 1 Mpc comoving sphere) and its stars. Black holes dominate by more than fifteen orders of magnitude, and the jump at 10<sup>19</sup>–10<sup>20</sup> yr is the central hole swallowing stars. Evaporation turns each hole into radiation carrying somewhat more entropy than the hole had (the model uses 1.5 times), so the total never falls. The ceiling for everything inside our cosmic horizon is the horizon’s own entropy, πc⁵/(GħH²) ≈ 3 × 10<sup>122</sup> k. A universe near that ceiling, in equilibrium at 2 × 10<sup>−30</sup> K, can do no more work. That is heat death.</p>

<h4>Begin again? (speculation)</h4>
<p>Penrose’s conformal cyclic cosmology (2010) notes that once only massless particles remain, there is no clock and no ruler. He argues that the cold, infinite future can then be rescaled into the hot, dense Big Bang of a new aeon. It needs even the electron’s mass to fade away, which no known physics does, and the patterns claimed as evidence in the CMB are disputed. It is a beautiful idea, and speculation.</p>

<h4>What is scaled for the screen</h4>
<p>A particle stands for a few million stars, and its brightness is compressed as L<sup>0.35</sup> so that dwarfs and giants share one picture. The exposure rises automatically as the galaxy dims (the HUD shows by how much). Remnants, brown dwarfs and black holes are in false colour. Black holes are drawn millions of times larger than their horizons, and orbits keep turning at a watchable pace even when a frame spans 10<sup>50</sup> years.</p>

  }
  // Proxima Centauri, our nearest neighbour: a 0.12 M☉ red dwarf that will outlive the Sun by a factor of four hundred
  if (trkValid && x > 11.3 && x < 13.6) {
    const p = renderPos(I_PROX, _p); const q = project(p, _s);
    if (q) {
      const xd = CPU.xMS[I_PROX];
      const ph = x < xd - 0.07 ? 'Proxima Centauri · red dwarf' : x < xd ? 'Proxima Centauri · blue dwarf' : 'Proxima Centauri · white dwarf';
      const col = x < xd - 0.07 ? 'rgba(255,170,140,0.95)' : x < xd ? 'rgba(170,200,255,0.95)' : 'rgba(200,210,235,0.8)';
      c.strokeStyle = col; c.lineWidth = 1; c.beginPath(); c.arc(q[0], q[1], 6, 0, 7); c.stroke();
      c.font = `500 10px ${mono}`; c.fillStyle = col; c.textAlign = 'right'; c.fillText(ph, q[0] - 10, q[1] + 12);
    }
  }
  // the last star
  if (trkValid && x > CPU.xB[I_LAST] - 0.01 && x < CPU.xMS[I_LAST] + 0.02) {
    const p = renderPos(I_LAST, _p); const q = project(p, _s);
    if (q) tag(q[0], q[1], 'the last star to form', '0.09 M☉ red dwarf', 'rgba(255,190,160,0.95)', 40, -40);
  }
  // central black hole
  if (x > 14.3 && x < X_FINAL) {
    const q = project([0, 0, 0], _s);
    const m = centralMassAt(x, S.remL);
    if (q && m > 0) tag(q[0], q[1], 'central black hole', FM.sci(m, 2) + ' M☉' + (small ? '' : ' · drawn enlarged'), 'rgba(200,185,255,0.95)', -70, 64);
  }
  if (x > 38 && x < 90) WANDER.forEach((wd) => { if (x < wd.x) { const q = project(wanderPos(wd, tAcc * 0.3 + S.visT * 0.02), _s); if (q) { c.font = `500 9.5px ${mono}`; const t = FM.sci(wd.m, 2) + ' M☉', tw = c.measureText(t).width; if (free(q[0] + 12, q[1] - 17, q[0] + 16 + tw, q[1] - 3)) { c.fillStyle = 'rgba(180,160,255,0.75)'; c.textAlign = 'left'; c.fillText(t, q[0] + 14, q[1] - 10); } } } });
  // transient events
  const now = performance.now();
  for (let i = EVENTS.length - 1; i >= 0; i--) {
    const e = EVENTS[i]; const age = (now - e.t0) / 1000; if (age > 2.2) { EVENTS.splice(i, 1); continue; }
    let q = null;
    if (e.i != null && trkValid) q = project(renderPos(e.i, _p), _s);
    else if (e.w != null) q = project(wanderPos(WANDER[e.w], tAcc * 0.3 + S.visT * 0.02), _s);
    if (!q || q[1] < (small ? 132 : 60) || q[0] > overlay.clientWidth - 40) continue;
    c.globalAlpha = age < 0.2 ? age / 0.2 : Math.max(0, 1 - (age - 1.4) / 0.8);
    c.font = `500 9.5px ${mono}`; c.fillStyle = 'rgba(210,200,255,0.95)'; c.textAlign = 'left'; c.fillText(e.text, q[0] + 12, q[1] + 12);
    c.globalAlpha = 1;
  }
  // distant galaxies, crossing the event horizon
  if (x > 10.33 && x < 11.35) {
    const n = bgFadeCount(x);
    c.font = `500 10px ${mono}`; c.textAlign = small ? 'right' : 'left'; c.fillStyle = 'rgba(255,170,140,0.85)';
    const tx = small ? overlay.clientWidth - 16 : LAY.l + 24, ty = small ? 104 : rib.getBoundingClientRect().top - 58;
    c.fillText(n > 0 ? 'distant galaxies still visible: ' + n : 'no other galaxy is visible', tx, ty);
    c.fillStyle = 'rgba(151,157,178,0.7)'; c.fillText(n > 0 ? 'redshifting behind the event horizon' : 'the Local Group is alone', tx, ty + 14);
  }
  // scale bar
  const q0 = project(camState.tgt, _s);
  if (q0) {
    const D = q0[2]; const Hc = overlay.clientHeight; const kpcPerPx = 2 * D * Math.tan(camState.fov / 2) / Hc;
    const nice = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]; let L = nice[0]; for (const n of nice) if (n / kpcPerPx < 130) L = n;
    const len = L / kpcPerPx; const rt = rib.getBoundingClientRect().top; const bx = small ? overlay.clientWidth - 16 - len : (LAY.l + LAY.r) / 2 - len / 2, by = small ? 76 : rt - 30;
    if (x < 100) {
      c.strokeStyle = 'rgba(236,230,214,0.45)'; c.beginPath(); c.moveTo(bx, by - 4); c.lineTo(bx, by); c.lineTo(bx + len, by); c.lineTo(bx + len, by - 4); c.stroke();
      c.font = `500 10px ${mono}`; c.fillStyle = 'rgba(151,157,178,0.9)'; c.textAlign = 'center'; c.textAlign = small ? 'right' : 'center'; c.fillText(L + ' kpc' + (x > 18.6 && !small ? ' · escapees shown closer' : ''), small ? bx + len : bx + len / 2, by + 11);
    }
  }
}

/* ------------------------------------------------------------ robustness */
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); ch.toast('The graphics context was lost; it will be restored when the GPU is free.', 6000); }, false);
canvas.addEventListener('webglcontextrestored', () => { location.reload(); }, false);
document.addEventListener('visibilitychange', () => { if (AU.nodes && document.hidden) AU.nodes.master.gain.setTargetAtTime(0, AU.nodes.ctx.currentTime, 0.1); });

/* ------------------------------------------------------------ debug */
Cosmos.debug.state = () => {
  const st = stateAt(S.x);
  return { x: +S.x.toFixed(4), era: eraOf(S.x), J: +S.J.toFixed(2), playing: S.playing, cd: +S.cd.toFixed(3), remL: S.remL, kCur: S.kCur, tfMode: S.tfMode,
    stars: st.ms, wd: st.wd, ns: st.ns, bh: st.bh, lumRel: st.lum / L_NOW, logS: st.logS, cmb: cmbT(S.x), bigBH: centralMassAt(S.x, S.remL),
    fGas: st.fGas, fStar: st.fStar, fRemn: st.fRemn, fBH: st.fBH, fGone: st.fGone, xPeri: X_PERI, xMerge: X_MERGE, xFinal: X_FINAL, mFinal: M_FINAL, fps: Math.round(fps), N, hdr: !!HDR };
};
Cosmos.debug.jump = (x) => jumpTo(x, false);
Cosmos.debug.budget = (x) => { const m = { mStar: tget(TB.mStar, x), mRemn: tget(TB.mRemn, x), mBH: tget(TB.mBH, x), mc: centralMass(x) }; return m; };
Cosmos.debug.play = (p) => setPlaying(p);
Cosmos.debug.xOfJ = (j) => xOfJ(j);
Cosmos.debug.colliders = () => { const a = []; for (let i = I_COL0; i < I_COL0 + N_COL; i++) a.push(+CPU.xMS[i].toFixed(2)); return a.sort((p, q) => p - q); };
Cosmos.debug.jOfX = (x) => jOfX(x);
Cosmos.debug.J = { cd0: () => J_CD0(), cd1: () => J_CD1(), end: () => J_END() };
console.info('[last-light] ' + N + ' particles · merger peri ' + X_PERI.toFixed(3) + ', merge ' + X_MERGE.toFixed(3) + ' · last black hole ' + FM.sci(M_FINAL, 3) + ' Msun → η ' + X_FINAL.toFixed(2));
})();
</script>
