(function () {
'use strict';

/* =====================================================================
   THE BEATING HEART
   A 2D excitable-medium model of cardiac tissue (Aliev–Panfilov 1996) on
   the GPU, coupled to a CPU model of the specialised conduction system
   (SA node, atrial pathways, AV node, His bundle, bundle branches,
   Purkinje network). A lead-field pseudo-ECG is computed on the GPU from
   the voltage field and read back for a bedside-monitor display.
   ===================================================================== */

const NOTES = `
<p>Every heartbeat starts as a spark in a knot of cells smaller than a grain of rice: the <strong>sinoatrial node</strong>, high in the right atrium. You are watching that spark spread. Each muscle cell fires an <em>action potential</em>, a pulse of voltage that lasts about a third of a second, and passes it to its neighbours. The white-hot line is the wavefront. The red glow behind it is muscle that is still charged and cannot fire again yet.</p>
<p>The wave crosses the atria, then waits for about a tenth of a second in the <strong>AV node</strong>, the only electrical doorway through the insulating ring between the upper and lower chambers. That pause lets the atria finish filling the ventricles. Then the His bundle and the Purkinje fibres, the heart's fast wiring, flash the signal across both ventricles in a few hundredths of a second, and the whole lower heart lights up at once.</p>
<p>The monitor reads this heart the way a real one does. The green ECG comes from electrodes on the arms and leg: the small P wave is the atria firing, the sharp QRS is the ventricles firing, and the T wave is the ventricles recovering. The red line is the pressure in an artery. Electricity only matters because it makes the muscle squeeze together, and every squeeze throws a pulse of blood into the aorta.</p>
<p>Now break it. Stimulate the recovering tail of a wave and the new wave can travel only one way. Its broken end curls into a spiral that keeps re-exciting the muscle it has just left. That is <strong>ventricular tachycardia</strong>. When the spirals shatter you have <strong>fibrillation</strong>: the muscle quivers in a hundred places at once, the red pressure line falls flat, and death follows within minutes unless a shock resets every cell at once.</p>
<h4>Try this</h4>
<ul>
<li>Press <strong>Cardiac arrest → rescue</strong>. Watch the spirals, the alarm and the collapsing pressure, then the shock, the silence and the first beat. Or press <strong>Shock</strong> on the monitor yourself.</li>
<li>Turn on <strong>S1 pacing</strong>, then click the amber line at the back of a wave to start your own spiral. Hover anywhere to see that cell's action potential.</li>
<li>Block the AV node and watch the P waves march on alone while the pressure sags. Then switch on the pacemaker.</li>
<li>Open the accessory pathway, look for the short PR and the slurred delta wave, then fire a premature beat. Turn the sound on to hear the monitor and the valves.</li>
</ul>`;

const SCIENCE = `
<p><strong>Educational model, not medical advice.</strong> Nothing here should guide the care of a real patient.</p>
<h4>Tissue: the monodomain equation</h4>
<p>Heart muscle is a syncytium: cells are joined by gap junctions, so voltage spreads like heat while each cell's ion channels drive it through an action potential. The continuum description is the monodomain equation</p>
<span class="eq">C<sub>m</sub> ∂V/∂t = ∇·(σ ∇V) − I<sub>ion</sub>(V, w) + I<sub>stim</sub></span>
<p>where σ is a conductivity tensor, larger along the muscle fibres than across them, and <i>w</i> stands for the gating variables. Detailed human cell models carry dozens of variables. This chapter uses the two-variable <strong>Aliev–Panfilov</strong> model, which captures the action potential's shape, refractoriness and restitution:</p>
<span class="eq">∂u/∂t = ∇·(D∇u) − k u (u − a)(u − 1) − u v + I<sub>stim</sub></span>
<span class="eq">∂v/∂t = ε(u,v) (−v − k u (u − a − 1)),&nbsp;&nbsp; ε = ε<sub>0</sub> + μ<sub>1</sub> v / (u + μ<sub>2</sub>)</span>
<p>with k = 8, a = 0.15, ε<sub>0</sub> = 0.002, μ<sub>1</sub> = 0.2 and μ<sub>2</sub> = 0.3. The voltage is V = 100u − 80 mV and one model time unit is 12.9 ms. Recovery (ε) is scaled by 0.66 in the ventricles, giving an action potential of about 300 ms at 72 bpm, and by 1.8 in the atria (about 180 ms). The sheet is 122 mm across on a 512 × 512 grid (0.24 mm cells; 256 × 256 on phones), stepped with a nine-point anisotropic Laplacian and forward Euler at about 0.19 ms per step, some 90 steps per displayed frame, in real time.</p>
<h4>Excitability and refractoriness</h4>
<p>A resting cell fires when it is pushed past threshold (u ≈ a). While the slow variable v is high it is refractory. The <em>vulnerable window</em> is the edge of that refractory tail: a stimulus there excites tissue on one side but not the other, which is how one-way block and re-entry begin. Hover over the heart to see a cell's action potential with the classic phases: 0 upstroke, 1 early repolarisation (barely present in a two-variable model), 2 plateau, 3 repolarisation, 4 rest.</p>
<h4>The conduction system</h4>
<p>Real conduction velocities: atrial muscle about 1 m/s, ventricular muscle 0.3–1 m/s (roughly twice as fast along the fibres as across), AV node about 0.05 m/s, Purkinje fibres 2–4 m/s. Here the SA node, the atrial preferential pathways, the AV node, His bundle, bundle branches and a Purkinje tree (grown by space colonisation) form a graph running at true speed: His 1.5 m/s, bundle branches 2 m/s, Purkinje 2.8 m/s (left) and 3.6 m/s (right). The tree meets the muscle at about 100 Purkinje–muscle junctions that work both ways, with a junction delay of 3–17 ms and a source–sink rule: a thin fibre cannot excite muscle that is still recovering.</p>
<p>The SA node fires at the rate set by the heart-rate slider, with a small respiratory sinus arrhythmia. The same slider stands for autonomic tone: sympathetic drive also shortens action potentials (recovery up to 1.55 times faster) and Purkinje refractoriness, so the ventricles can follow rates near 180 bpm. The AV node conducts <em>decrementally</em>: the atrio-His delay is AH = AH<sub>min</sub> + α e<sup>−(RP − ERP)/τ</sup>, where RP is the time since the node last conducted (the H–A interval, reset also by retrograde invasion of the His bundle, which is concealed conduction). At rest AH<sub>min</sub> ≈ 58 ms, α ≈ 300 ms, τ = 150 ms and ERP ≈ 100 ms, all shortened by sympathetic tone; the Wenckebach setting uses AH<sub>min</sub> = 200 ms, α = 150 ms and ERP = 500 ms, for which no steady PR exists at 72 bpm. Early impulses creep through slowly or block, which gives Wenckebach periodicity. With the node blocked, an idioventricular escape pacemaker in the left posterior fascicle fires at 34 bpm. The VVI pacemaker paces the right-ventricular apex at 70 bpm unless it senses the heart's own beat first.</p>
<h4>The ECG</h4>
<p>Einthoven showed that the body surface sees the heart as a moving electrical dipole. The monitor computes a pseudo-ECG from the whole voltage field, the lead-field integral</p>
<span class="eq">Φ(x<sub>e</sub>) ∝ −∫ D ∇u · ∇(1/r) dA,&nbsp;&nbsp; r = |x − x<sub>e</sub>|</span>
<p>for electrodes on the right arm, left arm and left leg, 26 cm from the heart at the corners of Einthoven's triangle. Lead I = LA − RA, lead II = LL − RA and aVF = LL − ½(RA + LA). Each patch of tissue is weighted by an effective wall thickness (atria 0.028, right ventricle 0.3, left ventricle 1), which sets the relative sizes of the P wave and the QRS.</p>
<p>A flat sheet misses what shapes every real QRS and T wave: the thickness of the ventricular wall. Each patch of real wall fires from the inside out and, because the outer layers have shorter action potentials, recovers from the outside in (Yan and Antzelevitch). Both make a dipole along the wall's outward normal <b>n</b>, so every ventricular cell also contributes</p>
<span class="eq">Φ<sub>T</sub>(x<sub>e</sub>) ∝ h (g<sub>d</sub> [f]<sub>+</sub> + g<sub>r</sub> [−f]<sub>+</sub>) <b>n</b> · ∇(1/r),&nbsp;&nbsp; f = −k u (u − a)(u − 1) − u v</span>
<p>where f is the ionic rate of change of u (positive in the upstroke, negative during phase-3 repolarisation), h is the wall thickness (left ventricle 1, right 0.33), g<sub>r</sub>/g<sub>d</sub> = 0.5, and <b>n</b> is the frontal projection of the outward normal of a half-ellipsoid whose rim is the valve ring. The ventricles are cups open at the base, so these normals add up to point toward the apex and the left. The in-plane term above keeps a fifth of its weight in the ventricles. In sinus rhythm the QRS axis then sits near +50° and the T axis near +65°: a tall R and upright T in leads I and II, and a negative QRS and T in aVR, as in a healthy adult. As a refinement, after the first clean beat the model measures when each ventricular cell was activated and shortens its action potential by 1.4 ms for every millisecond it activated later, so in-plane repolarisation also runs roughly opposite to activation. The trace is sampled at 500 Hz and low-pass filtered at 40 Hz like a bedside monitor, and a Pan–Tompkins-style detector finds each QRS for the heart rate and the beep. PR is measured from the SA discharge to the first ventricular activation, so pre-excitation shortens it.</p>
<h4>Pressure and flow</h4>
<p>The red trace is arterial pressure from a lumped model of the left heart, driven by the electrical one. The ventricle is a chamber whose stiffness rises as its muscle depolarises, the time-varying elastance of Suga and Sagawa:</p>
<span class="eq">P<sub>LV</sub> = E(t) (V − V<sub>0</sub>),&nbsp;&nbsp; E(t) = E<sub>min</sub> + (E<sub>max</sub> − E<sub>min</sub>) e(t)<sup>3/2</sup></span>
<p>with E<sub>max</sub> = 4.3 mmHg/ml, E<sub>min</sub> = 0.09 mmHg/ml and V<sub>0</sub> = 10 ml. The activation e(t) follows the fraction φ of ventricular muscle that is depolarised through two lags (30 ms, then 100 ms; relaxation 40 ms and 25 ms), as calcium and then force follow the action potential. Force is cooperative: the drive rises smoothly from 0 at φ = 0.3 to 1 at φ = 0.9, and stiffness grows as e<sup>3/2</sup>, so only a nearly synchronous squeeze counts. Sympathetic tone (the heart-rate slider) raises E<sub>max</sub> by up to 25% and speeds contraction and relaxation by up to 1.55 times. The mitral and aortic valves are one-way resistances of 0.005 and 0.008 mmHg·s/ml, the left atrium sits at 6 mmHg plus a 5 mmHg atrial kick, and the arteries are a three-element Windkessel with characteristic impedance Z<sub>c</sub> = 0.035 mmHg·s/ml, compliance C = 1.6 ml/mmHg and peripheral resistance R = 0.95 mmHg·s/ml draining to P<sub>v</sub> = 8 mmHg:</p>
<span class="eq">C dP<sub>w</sub>/dt = Q<sub>ao</sub> − (P<sub>w</sub> − P<sub>v</sub>)/R,&nbsp;&nbsp; P<sub>ao</sub> = P<sub>w</sub> + Z<sub>c</sub> Q<sub>ao</sub></span>
<p>At 72 bpm this gives about 120/75 mmHg, a stroke volume near 65–70 ml, an ejection fraction near 60% and a cardiac output near 5 L/min; at 150 bpm with full sympathetic drive the output rises to about 7 L/min. A small damped dip when the aortic valve shuts draws the dicrotic notch. The heart sounds are the model's valve events: S1 as the mitral valve closes, S2 as the aortic valve closes. The pressure–volume panel shows the loop each beat traces between the end-diastolic and end-systolic limits. In fibrillation φ wanders but never approaches one, so the loop collapses, the valves stop working and arterial pressure sinks within seconds toward the 8 mmHg filling pressure: circulatory arrest. Complete heart block lowers the pressure because the rate is slow; right-ventricular pacing lowers it a little because the two ventricles no longer squeeze together.</p>
<h4>Re-entry, spirals and fibrillation</h4>
<p>Winfree showed that any excitable medium can carry rotating spiral waves, and Gray, Pertsov and Jalife filmed them on the surfaces of fibrillating hearts. <em>Induce VT</em> uses the cross-field S1–S2 protocol of computational studies: a plane wave from the base, then a premature stimulus over half the ventricles, delivered when two probes show the base recovered and the tissue below still refractory. The conduction system is disconnected for the second or so this takes. With <em>S1 pacing</em> you can do it by hand: plane waves leave the base every 560 ms, the amber line marks tissue that is just recovering (0.13 &lt; u &lt; 0.33 with v still high), and a click there is an S2 in the vulnerable window. A single spiral then drives ventricular tachycardia at 130–180 bpm here. <em>Induce VF</em> adds a fibrillation substrate like that of scarred or ischaemic muscle: ventricular conduction slowed to about three-quarters (D × 0.6), patchy refractoriness (local action-potential duration varied by up to ±90%, deliberately exaggerated), and recovery kinetics with μ<sub>1</sub> = 0.07. Once re-entry is running, the ischaemia deepens over about 3.5 s, as it does in the first minute of a real arrest: μ<sub>1</sub> falls to 0.05, recovery speeds up by a further 30%, and the Purkinje junctions stop re-exciting the muscle except where it has fully recovered. Wave backs then catch wavefronts, arms break, and every broken end becomes a new rotor; four to eight usually wander at once. The spirals turn two to three times a second here, slower than the 4–8 Hz of human fibrillation, because the muscle conducts slowly (see below).</p>
<h4>Defibrillation</h4>
<p>A 200 J biphasic shock drives some 10–30 amperes through the chest for about 10 ms. Only a fraction of it crosses the heart, but that is enough to depolarise essentially every cell at once, including the excitable gaps that spirals need, and resets their refractory clocks together. Every wavefront then meets refractory tissue and dies. After a pause of electrical silence, the SA node, the fastest surviving pacemaker, takes over again. Here the shock excites every cell for 10 ms.</p>
<h4>What is simplified</h4>
<p>The tissue is a flat sheet in the shape of a four-chamber view, with the chambers filled with muscle so that waves have room to turn, much as optical mapping sees the heart's surface. The model heart is life-size (about 11 cm), but ordinary muscle conducts at 0.07–0.13 m/s, four to eight times slower than in life, which shortens the wavelength so that spirals fit. The fast conduction system runs at true speed, which keeps P, PR and QRS durations realistic. Atrial muscle is excited all along the atrial pathways, so the P-wave front sweeps out from the SA node as one sheet. The cell model is phenomenological: no individual ion currents and no calcium. The mechanics are a lumped model of the left heart and arteries, not a contracting tissue; the squeeze you see follows its volume. The accessory pathway (right free wall) joins two points across the fibrous ring with a 12 ms delay and a 330 ms refractory period. With it open, <em>Premature beat</em> fires an atrial premature beat near the pathway 300 ms after a sinus P wave: it blocks in the still-refractory pathway, creeps slowly through the AV node, and returns up the pathway, starting orthodromic AV re-entrant tachycardia at about 145 bpm. The right heart, the lungs, the coronary circulation and the autonomic nervous system are not simulated.</p>
<span class="cite">Einthoven, W. (1912). The different forms of the human electrocardiogram and their signification. The Lancet 179, 853–861.</span>
<span class="cite">Hodgkin, A. L. &amp; Huxley, A. F. (1952). A quantitative description of membrane current and its application to conduction and excitation in nerve. J. Physiol. 117, 500–544.</span>
<span class="cite">Durrer, D. et al. (1970). Total excitation of the isolated human heart. Circulation 41, 899–912.</span>
<span class="cite">Winfree, A. T. (1987). When Time Breaks Down: The Three-Dimensional Dynamics of Electrochemical Waves and Cardiac Arrhythmias. Princeton University Press.</span>
<span class="cite">Aliev, R. R. &amp; Panfilov, A. V. (1996). A simple two-variable model of cardiac excitation. Chaos, Solitons &amp; Fractals 7, 293–301.</span>
<span class="cite">Fenton, F. &amp; Karma, A. (1998). Vortex dynamics in three-dimensional continuous myocardium with fiber rotation: filament instability and fibrillation. Chaos 8, 20–47.</span>
<span class="cite">Gray, R. A., Pertsov, A. M. &amp; Jalife, J. (1998). Spatial and temporal organization during cardiac fibrillation. Nature 392, 75–78.</span>
<span class="cite">Suga, H. &amp; Sagawa, K. (1974). Instantaneous pressure–volume relationships and their ratio in the excised, supported canine left ventricle. Circ. Res. 35, 117–126.</span>
<span class="cite">Yan, G.-X. &amp; Antzelevitch, C. (1998). Cellular basis for the normal T wave and the electrocardiographic manifestations of the long-QT syndrome. Circulation 98, 1928–1936.</span>
<span class="cite">Clayton, R. H. et al. (2011). Models of cardiac tissue electrophysiology: progress, challenges and open questions. Prog. Biophys. Mol. Biol. 104, 22–48.</span>`;

const T_INIT0 = performance.now();
const ch = Cosmos.chapter({ id: 'heart', notes: NOTES, science: SCIENCE });
const clamp = Cosmos.util.clamp;
const SMALL = window.matchMedia('(max-width: 760px)').matches;
const ERA = Cosmos.util.rgbf(ch.meta.accent);

/* --------------------------------------------------------------- scales */
const TU = 12.9;                       // ms per Aliev–Panfilov time unit
const ms = (x) => x / TU;              // ms → t.u.
const N = SMALL ? 256 : 512;           // simulation grid
const DOM = 122;                       // mm, side of the simulated square
const DX = DOM / N;                    // mm per cell
const HALF = DOM / 2;
const GEO_DOM = 176;                   // mm, side of the display-geometry square (includes great vessels)
const GN = SMALL ? 320 : 512;
const RES = (N / 512) * (N / 512);     // D scaling so dynamics match at any resolution
// diffusion in cells²/t.u. at 512²: atria 20, ventricles 8 (across) / 24 (along)
const DC_ATR = 20 * RES, DC_VPERP = 8 * RES, DC_VPAR = 24 * RES, DC_MAX = 26 * RES;
const EPS0 = 0.002, K_AP = 8, A_AP = 0.15;
const EPS_K = 0.66;                   // global recovery-rate scale: tissue APD ≈ 300 ms at 72 bpm
const PK_RV = 3.6, PK_LV = 2.8;       // Purkinje conduction (m/s = mm/ms) in the right and left trees
const JD_SPAN = 30, JD_LAT = 7, JD_BASE = 6, JD_APEX = 0;      // junction-delay field (see junctionDelay)
const RT_SLOPE = 1.4;                 // ms of APD lost per ms of later activation (reverses repolarisation)

/* ------------------------------------------------------------ geometry */
// Shapes are drawn in an "upright" frame (U → patient's left, W → toward the apex) in mm,
// then rotated so the apex points down and to the patient's left, as in a frontal view.
const ROT = 24 * Math.PI / 180, CR = Math.cos(ROT), SR = Math.sin(ROT);
const GS = 1.16;                       // upright mm → sim mm
let GOX = 0, GOY = 0;
function u2s(U, W) { const x = U * CR + W * SR, y = -U * SR + W * CR; return [x * GS + GOX, y * GS + GOY]; }
function s2u(x, y) { x = (x - GOX) / GS; y = (y - GOY) / GS; return [x * CR - y * SR, x * SR + y * CR]; }
const RING_W = -12, RING_H = 1.35;
function sdEll(x, y, cx, cy, rx, ry) { const px = (x - cx) / rx, py = (y - cy) / ry; const k0 = Math.hypot(px, py), k1 = Math.hypot(px / rx, py / ry); return k1 < 1e-9 ? -Math.min(rx, ry) : k0 * (k0 - 1) / k1; }
function smin(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; }
function sdSeg(x, y, ax, ay, bx, by) { const pax = x - ax, pay = y - ay, bax = bx - ax, bay = by - ay; const h = clamp((pax * bax + pay * bay) / (bax * bax + bay * bay), 0, 1); return Math.hypot(pax - bax * h, pay - bay * h); }
function septumU(W) { const t = clamp((W + 10) / 66, 0, 1); return -4 + 15 * t * t; }
const ATR_SEPT_U = -3;
const APEX = [13, 56];                 // upright
const Gq = { heart: 0, ven: 0, atr: 0, ves: 0, ring: 0, lv: 0, rv: 0 };
function geo(U, W) {
  const t = clamp((W - 12) / 46, 0, 1);
  const lv = sdEll(U, W, 8 + 5 * t, 17, 25 * (1 - 0.36 * t * t), 39);
  const t2 = clamp((W - 8) / 30, 0, 1);
  const rv = sdEll(U, W, -14 + 6 * t2 * t2, 8, 26 * (1 - 0.25 * t2 * t2), 27);
  const ven = smin(lv, rv, 12);
  const ra = sdEll(U, W, -21, -26, 21, 17), la = sdEll(U, W, 14, -27, 22, 16);
  const raa = sdEll(U, W, -35, -37, 10, 8), laa = sdEll(U, W, 33, -34, 9, 6);
  const atr = smin(smin(smin(ra, la, 8), raa, 6), laa, 5);
  Gq.heart = smin(ven, atr, 7);
  Gq.ven = ven; Gq.atr = atr; Gq.lv = lv; Gq.rv = rv;
  Gq.ring = Math.abs(W - RING_W) - RING_H;
  return Gq;
}
function vessels(U, W) {
  const svc = sdSeg(U, W, -25, -36, -24, -76) - 7.5;
  const ao = Math.min(sdSeg(U, W, -4, -30, -6, -56), sdSeg(U, W, -6, -56, 0, -68), sdSeg(U, W, 0, -68, 14, -73), sdSeg(U, W, 14, -73, 27, -65)) - 7.5;
  const pa = Math.min(sdSeg(U, W, 10, -30, 15, -54), sdSeg(U, W, 15, -54, 23, -60)) - 6;
  return Math.min(svc, ao, pa);
}

// region codes: 0 none, 1 RA, 2 LA, 3 RV, 4 LV, 5 ring
const region = new Uint8Array(N * N);
const paramB = new Uint8Array(N * N * 4);
let nVent = 0;
(function buildGeometry() {
  // centre the heart in the sim domain
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let y = -90; y <= 90; y += 1) for (let x = -90; x <= 90; x += 1) {
    const [U, W] = s2u(x, y); if (geo(U, W).heart < 0) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  }
  GOX = -(x0 + x1) / 2; GOY = -(y0 + y1) / 2;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = (i + 0.5) * DX - HALF, y = (j + 0.5) * DX - HALF;
    const [U, W] = s2u(x, y);
    const g = geo(U, W);
