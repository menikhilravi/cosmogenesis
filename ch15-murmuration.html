<script>
(function () {
'use strict';

/* =====================================================================
   MURMURATION — GPU flocking of tens of thousands of starlings.
   Simulation (all on the GPU, WebGL2 float textures):
     1. key pass      : spatial-hash key per bird
     2. bitonic sort  : sort (key, slot) pairs
     3. reorder pass  : bird state copied into sorted order (MRT)
     4. cell pass     : first index of each hash cell (point scatter)
     5. update pass   : adaptive topological neighbourhood (≈k nearest),
                        separation / alignment / cohesion, banking flight,
                        roost attraction, predator, excitable escape waves
   ===================================================================== */

const NOTES = `
<p>On winter evenings starlings gather above a reed bed before they roost. Tens of thousands fly as one: a dark cloud that swells, folds, thins to a ribbon and pours back into a ball. Nobody leads it. There is no plan.</p>
<p>Each bird here follows three habits: keep a little space, match your neighbours' heading, and stay close. It watches only its six or seven nearest neighbours, however far away they are. Real starlings do the same, and it lets the flock stretch without tearing. Birds roll into their turns like real wings. A rolled bird shows you more wing, so turning parts of the flock look darker.</p>
<p>Then a peregrine falcon dives. Birds next to it swerve. Their neighbours copy the swerve a fraction of a second later, and a dark band races outward through the flock, far faster than any bird moves inside it. The wave is a message passed from bird to bird.</p>
<h4>Try this</h4>
<ul>
<li>Press <strong>Attack now</strong> (<kbd>A</kbd>). Time slows as the falcon strikes, and fine orange dots mark the birds that have just started to swerve: the front of the wave.</li>
<li>Choose <strong>Chaos (k = 1)</strong>. With one neighbour each, the order melts into a swarm. Slide k back to 7 and it heals.</li>
<li>Drag <strong>Time of dusk</strong> below −6.5°. The light fails and the flock funnels into the reeds.</li>
<li>Pick <strong>Be the falcon</strong> and chase the flock, or <strong>Fly with the flock</strong> (<kbd>V</kbd>) and ride inside it.</li>
</ul>`;

const SCIENCE = `
<h4>Three local rules</h4>
<p>Reynolds (1987) showed that flocking needs no leader: separation, alignment and cohesion are enough. Each bird <i>i</i> here steers with an acceleration</p>
<span class="eq">a<sub>i</sub> = 16 w<sub>s</sub> Σ<sub>j</sub> q<sub>ij</sub>(½ + q<sub>ij</sub>) x̂<sub>ji</sub> + 20 w<sub>a</sub> (⟨v̂⟩<sub>𝒩<sub>i</sub></sub> − v̂<sub>i</sub>) + w<sub>c</sub> (0.2 + 6 C<sub>i</sub>) x̂<sub>i→⟨x⟩</sub> + a<sub>far</sub> + a<sub>roost</sub> + a<sub>falcon</sub> + 7 η ξ<sub>i</sub>(t)</span>
<p>in m/s², with q<sub>ij</sub> = 1 − r<sub>ij</sub>/r<sub>s</sub> for neighbours closer than r<sub>s</sub> = 1.15 m, ξ an Ornstein–Uhlenbeck noise with τ = 0.7 s, and C<sub>i</sub> = |⟨x⟩<sub>𝒩<sub>i</sub></sub> − x<sub>i</sub>| / r<sub>i</sub>. C<sub>i</sub> is near 0 deep inside the flock and near ½ on its border, so only border birds are pulled in hard. That gives the cloud its sharp edge (Hildenbrandt et al. 2010).</p>
<h4>Topological neighbours</h4>
<p>Ballerini et al. (2008) reconstructed flocks of up to a few thousand starlings over Rome in 3D and found that each bird interacts with a fixed number of neighbours, six to seven, not with everyone inside a fixed distance. A topological rule keeps the flock cohesive when its density changes. Here each bird carries its own radius r<sub>i</sub> and rescales it every step so that the ball holds k birds:</p>
<span class="eq">r<sub>i</sub> ← r<sub>i</sub> · ((k + ½) / (n<sub>i</sub> + ½))<sup>1/3</sup></span>
<p>n<sub>i</sub> counts neighbours inside r<sub>i</sub>, ignoring a blind cone behind the bird. Candidates come from a spatial hash grid rebuilt every frame on the GPU with a bitonic sort. In practice r<sub>i</sub> settles at the distance of the bird's k-th nearest neighbour, about 1.5 to 2 m here. <strong>Fly with the flock</strong> draws lines from one bird to the k birds it is watching. At k = 1, alignment passes only between pairs and the order parameter collapses.</p>
<h4>Seeing the flock</h4>
<p>Starlings can also see the dark mass of the flock beyond their neighbours. Pearce et al. (2014) showed that responding to this projected view explains why flocks sit near "marginal opacity": looking out from inside, the sky is patchy, neither blocked nor clear. The model adds a version of that cue. Every frame the flock is binned onto a coarse grid, and for each point of space the GPU adds up the directions to every occupied cell, each weighted by the solid angle it fills:</p>
<span class="eq">a<sub>view</sub> = 5 w<sub>c</sub> · Σ<sub>c</sub> m<sub>c</sub> ê<sub>c</sub> / (d<sub>c</sub><sup>2</sup> + s<sup>2</sup>) ÷ Σ<sub>c</sub> m<sub>c</sub> / (d<sub>c</sub><sup>2</sup> + s<sup>2</sup>)</span>
<p>Here m<sub>c</sub> is the number of birds in cell c, d<sub>c</sub> its distance, ê<sub>c</sub> the unit vector toward it and s, a few tens of metres, a softening length. Deep inside the flock the sky is dark all round and the sum cancels. At the edge, or from a stray group, it points toward where the flock looks biggest. It works like a surface tension: it keeps the edge sharp and calls splinter groups home without crushing the flock into a ball. Two weaker cues help: a step up the gradient of a blurred density map, a<sub>far</sub> ∝ ∇ρ/(ρ + ρ<sub>0</sub>), and a gentle pull toward the main mass. The <strong>Sky hidden</strong> readout measures this directly: it renders the flock onto a small cube map from inside a randomly chosen bird, three times a second, and averages the fraction of sky covered by birds.</p>
<h4>Flight</h4>
<p>Speed relaxes to the cruise speed v<sub>0</sub> (default 12 m/s). Birds turn by banking: the lift vector tilts by the roll angle φ and gives a sideways acceleration g tan φ, with |φ| ≤ 80° and a roll rate of at most 8 rad/s. So every turn starts with a visible roll. A horizontal pull toward the roost grows between 90 and 210 m from it, which keeps the flock sweeping back and forth over the reeds, and a slowly drifting altitude band makes it rise and fall.</p>
<h4>Order and the Vicsek transition</h4>
<span class="eq">Φ = | (1/N) Σ<sub>i</sub> v̂<sub>i</sub> |</span>
<p>The polarisation Φ is about 1 when every bird flies the same way and about 0 when headings are random. Vicsek et al. (1995) showed that self-propelled particles that only align with their neighbours undergo a phase transition: below a critical noise the group orders spontaneously. <strong>Sweep noise</strong> ramps η from 0 to 3 and plots Φ(η). Real starling flocks are highly ordered, with Φ above 0.9.</p>
<h4>Scale-free correlations</h4>
<p>Cavagna et al. (2010) subtracted the flock's mean velocity from each bird and correlated the fluctuations u<sub>i</sub> = v<sub>i</sub> − ⟨v⟩:</p>
<span class="eq">C(r) = Σ<sub>i≠j</sub> û<sub>i</sub>·û<sub>j</sub> δ(r − r<sub>ij</sub>) / Σ<sub>i≠j</sub> δ(r − r<sub>ij</sub>)</span>
<p>The correlation length ξ is the first zero of C(r). In real flocks ξ grows in proportion to the flock size L, at about a third of it, whatever that size: the correlations are scale-free, so a change of heading anywhere can be felt everywhere. The deck computes C(r) every second from 1,024 birds.</p>
<h4>Waves of escape</h4>
<p>Procaccini et al. (2011) filmed peregrine attacks on starling flocks in Rome and described waves: dark bands that sweep across the flock, travelling away from the predator. Here each bird is an excitable unit. It fires when the falcon comes within 14 m, or when more than a tenth of its topological neighbours are firing (in practice, one close neighbour is enough). After a reaction delay of 0.02 to 0.04 s it rolls hard (to about 80°) away from the alarm for 1 s, then stays refractory for 4 s. Each relayed alarm is 1.5% weaker than the one that set it off, and birds ignore alarms below 30% strength, so a wave fades out after about a hundred metres. Without that fading, the flock turns into a self-sustaining excitable medium: waves re-enter parts that have recovered and circle forever, like spiral waves in heart muscle. After each strike the deck measures the wave: it back-dates every alarmed bird to the moment it fired, removes the flock's own drift, and fits distance from the first birds to fire against time. In the model the front moves at roughly 8 to 16 m/s through the flock, while neighbouring birds drift relative to each other at only a metre or two per second. Birds within 36 m of the falcon also flee directly, which opens a hole around it. Hemelrijk et al. (2015) showed in a similar model that the band looks dark because rolling birds turn more wing toward the observer. That is how it is drawn here: birds smaller than a pixel are rendered with their exact projected area at their current roll and flap angle.</p>
<h4>Sky</h4>
<p>The dusk sky is computed, not painted: single Rayleigh and Mie scattering in a spherical atmosphere (scale heights 8 km and 1.2 km), ozone absorption, a thin stratospheric aerosol layer near 20 km and a small multiple-scattering term. With the sun below the horizon, Earth's shadow falls into the air. That produces the gold-to-rose-to-violet gradient, the purple light of mid-twilight and the grey-blue band opposite the sunset. A thin cloud layer at 6 km is lit by the same calculation: the clouds stay pink after sunset because, seen from 6 km up, the sun stays above the horizon until it is about 2.5° below ours. Then Earth's shadow climbs past them and they turn grey.</p>
<h4>Scaled for the screen</h4>
<p>A starling's wingspan is about 0.4 m. The default flock of 40,000 is larger than the flocks Ballerini measured but smaller than the biggest winter roosts. Weights, the roost geometry, the long-range cue and the falcon's tactics are tuned by eye for realism, not fitted to data. Reaction times and wave speeds in the model are illustrative.</p>
<span class="cite">Reynolds, C. W. (1987). Flocks, herds and schools: a distributed behavioral model. Computer Graphics 21(4), 25–34.</span>
<span class="cite">Vicsek, T., Czirók, A., Ben-Jacob, E., Cohen, I. &amp; Shochet, O. (1995). Novel type of phase transition in a system of self-driven particles. Physical Review Letters 75, 1226.</span>
<span class="cite">Ballerini, M. et al. (2008). Interaction ruling animal collective behavior depends on topological rather than metric distance. PNAS 105, 1232–1237.</span>
<span class="cite">Hildenbrandt, H., Carere, C. &amp; Hemelrijk, C. K. (2010). Self-organized aerial displays of thousands of starlings: a model. Behavioral Ecology 21, 1349–1359.</span>
<span class="cite">Cavagna, A. et al. (2010). Scale-free correlations in starling flocks. PNAS 107, 11865–11870.</span>
<span class="cite">Procaccini, A. et al. (2011). Propagating waves in starling, Sturnus vulgaris, flocks under predation. Animal Behaviour 82, 759–765.</span>
<span class="cite">Pearce, D. J. G., Miller, A. M., Rowlands, G. &amp; Turner, M. S. (2014). Role of projection in the control of bird flocks. PNAS 111, 10422–10426.</span>
<span class="cite">Hemelrijk, C. K., van Zuidam, L. &amp; Hildenbrandt, H. (2015). What underlies waves of agitation in starling flocks. Behavioral Ecology and Sociobiology 69, 755–764.</span>`;

const ch = Cosmos.chapter({ id: 'murmuration', notes: NOTES, science: SCIENCE });
const U = Cosmos.util, FMT = Cosmos.fmt, M4 = Cosmos.mat4;
const SMALL = window.matchMedia('(max-width: 760px)').matches;
const ERA = U.rgbf(ch.meta.accent);

const canvas = ch.canvas('mm-gl');
const annCanvas = ch.canvas('mm-ann');
const ann = annCanvas.getContext('2d');
const gl = Cosmos.gl.context(canvas, { antialias: false, alpha: false, depth: false, stencil: false });
if (!gl) { ch.fatal('This chapter needs WebGL2, which this browser or device does not provide.'); return; }
if (!gl.ext.floatRT) { ch.fatal('This chapter simulates the flock in 32-bit float textures (EXT_color_buffer_float), which this GPU does not support.'); return; }
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); ch.fatal('The graphics context was lost. Reload the page to restart the flock.'); });

/* ------------------------------------------------------------ world layout (metres) */
const EYE0 = [0, 2.2, 0];                 // observer standing at the lagoon shore
const ROOST = [10, 0, -255];              // reed-bed roost centre
const ROOST_R = 150;                      // horizontal roost radius
const ALT = [48, 135];                    // preferred altitude band
const SUN_AZ = 22 * Math.PI / 180;        // sun azimuth (from −z toward +x)
const RING_T = 1400, RING_H = 6500;       // tree line / hills radii
const TOR_AZ = -31 * Math.PI / 180;

/* ------------------------------------------------------------ shared JS noise (mirrors GLSL) */
function pcg(v) { const s = (Math.imul(v >>> 0, 747796405) + 2891336453) >>> 0; const w = Math.imul(((s >>> ((s >>> 28) + 4)) ^ s) >>> 0, 277803737) >>> 0; return ((w >>> 22) ^ w) >>> 0; }
function h2(x, y) { return pcg((Math.imul((x + 1000000) >>> 0, 1597334677) ^ pcg((y + 1000000) >>> 0)) >>> 0) / 4294967296; }
function n2(x, y) { const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = h2(ix, iy), b = h2(ix + 1, iy), c = h2(ix, iy + 1), d = h2(ix + 1, iy + 1); return (a + (b - a) * fx) + ((c + (d - c) * fx) - (a + (b - a) * fx)) * fy; }
function fbm2(x, y) { let s = 0, a = 0.5; for (let i = 0; i < 4; i++) { s += a * n2(x, y); x = x * 2.03 + 17.1; y = y * 2.03 + 5.3; a *= 0.5; } return s; }
function waterMask(x, z) { const cx = (x + 10) / 270, cz = (z + 125) / 112; return 1 - Math.hypot(cx, cz) - (fbm2(x * 0.011, z * 0.011) - 0.47) * 0.9 - (n2(x * 0.045, z * 0.045) - 0.5) * 0.12; }
function reedMask(x, z) { const cx = (x - 10) / 330, cz = (z + 275) / 85; return 1 - Math.hypot(cx, cz) - (fbm2(x * 0.013 + 40, z * 0.013 + 40) - 0.47) * 0.9; }

/* ===================================================================== GLSL */
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
`;
const NOISE = `
uint pcg(uint v){ uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float rnd(uint v){ return float(pcg(v)) * (1.0/4294967296.0); }
float h1(float x){ return float(pcg(uint(int(x) + 1000000))) * (1.0/4294967296.0); }
float h2(vec2 x){ uvec2 u = uvec2(ivec2(x) + 1000000); return float(pcg(u.x * 1597334677u ^ pcg(u.y))) * (1.0/4294967296.0); }
float n1(float x){ float i = floor(x), f = x - i; f = f*f*(3.0-2.0*f); return mix(h1(i), h1(i+1.0), f); }
float fbm1(float x){ float s = 0.0, a = 0.5; for (int i=0;i<5;i++){ s += a*n1(x); x = x*2.03 + 17.1; a *= 0.5; } return s; }
float n2(vec2 x){ vec2 i = floor(x), f = x - i; f = f*f*(3.0-2.0*f); return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }
float fbm2(vec2 x){ float s = 0.0, a = 0.5; for (int i=0;i<4;i++){ s += a*n2(x); x = x*2.03 + vec2(17.1, 5.3); a *= 0.5; } return s; }
float waterMask(vec2 q){ vec2 c = (q - vec2(-10.0, -125.0)) / vec2(270.0, 112.0); return 1.0 - length(c) - (fbm2(q*0.011) - 0.47)*0.9 - (n2(q*0.045) - 0.5)*0.12; }
float reedMask(vec2 q){ vec2 c = (q - vec2(10.0, -275.0)) / vec2(330.0, 85.0); return 1.0 - length(c) - (fbm2(q*0.013 + 40.0) - 0.47)*0.9; }
float channelMask(vec2 q){ float d = abs(fbm2(q * 0.0022 + 7.0) - 0.5); float w = 0.009 + 0.006 * n2(q * 0.01); return w - d; }
bool isWater(vec2 q){ float r = reedMask(q); return (waterMask(q) > 0.0 && r < 0.0) || (channelMask(q) > 0.0 && r < 0.12 && length(q) > 45.0); }
`;
const SIMC = `
uniform int uW; uniform int uLW; uniform int uN; uniform float uCellSize;
ivec2 slotUV(int i){ return ivec2(i & (uW - 1), i >> uLW); }
uint cellHash(ivec3 c){ uvec3 u = uvec3(c + 1048576); uint h = (u.x * 73856093u) ^ (u.y * 19349663u) ^ (u.z * 83492791u); h ^= h >> 16; h *= 0x7feb352du; h ^= h >> 15; return h & 262143u; }
ivec3 cellOf(vec3 p){ return ivec3(floor(p / uCellSize)); }
`;

const FS_KEY = HEAD + SIMC + `
uniform sampler2D uP; out vec4 o;
void main(){ ivec2 ij = ivec2(gl_FragCoord.xy); int i = ij.y * uW + ij.x;
  if (i >= uN) { o = vec4(1e7, float(i), 0.0, 0.0); return; }
  vec3 p = texelFetch(uP, ij, 0).xyz;
  o = vec4(float(cellHash(cellOf(p))), float(i), 0.0, 0.0); }`;

/* bitonic sort, up to 3 merge stages fused per pass: each fragment loads its closed group of
   2^S elements (indices differing only in the stage bits), runs the S compare-exchange stages
   locally, and keeps its own slot. */
const FS_SORT = HEAD + SIMC + `
uniform sampler2D uK; uniform int uJ; uniform int uS; uniform int uKk; out vec4 o;
bool lessK(vec2 a, vec2 b){ return a.x < b.x || (a.x == b.x && a.y < b.y); }
void main(){ ivec2 ij = ivec2(gl_FragCoord.xy); int i = ij.y * uW + ij.x;
  int G = 1 << uS;
  int mask = 0; for (int b = 0; b < 3; b++) if (b < uS) mask |= (uJ >> b);
  int base = i & ~mask;
  vec2 v[8]; int me = 0;
  for (int m = 0; m < 8; m++) {
    if (m >= G) break;
    int idx = base;
    for (int b = 0; b < 3; b++) if (b < uS && ((m >> b) & 1) == 1) idx |= (uJ >> (uS - 1 - b));
    if (idx == i) me = m;
    v[m] = texelFetch(uK, slotUV(idx), 0).xy;
  }
  bool asc = (i & uKk) == 0;
  for (int st = 2; st >= 0; st--) {
    if (st >= uS) continue;
    int lj = 1 << st;
    for (int m = 0; m < 8; m++) {
      if (m >= G) break;
      if ((m & lj) != 0) continue;
      int q = m | lj;
      vec2 a = v[m], c = v[q];
      if (lessK(c, a) == asc) { v[m] = c; v[q] = a; }
    }
  }
  o = vec4(v[me], 0.0, 0.0); }`;

const FS_REORDER = HEAD + SIMC + `
uniform sampler2D uK, uP, uV, uX, uS;
layout(location=0) out vec4 oP; layout(location=1) out vec4 oV; layout(location=2) out vec4 oX; layout(location=3) out vec4 oS;
void main(){ ivec2 ij = ivec2(gl_FragCoord.xy); int s = int(texelFetch(uK, ij, 0).y + 0.5); ivec2 sj = slotUV(s);
  oP = texelFetch(uP, sj, 0); oV = texelFetch(uV, sj, 0); oX = texelFetch(uX, sj, 0); oS = texelFetch(uS, sj, 0); }`;

const VS_CELL = HEAD + SIMC + `
uniform sampler2D uP; flat out float vI;
void main(){ int i = gl_VertexID; gl_PointSize = 1.0; vI = float(i);
  gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
  if (i >= uN) return;
  uint h = cellHash(cellOf(texelFetch(uP, slotUV(i), 0).xyz));
  if (i > 0) { uint h0 = cellHash(cellOf(texelFetch(uP, slotUV(i - 1), 0).xyz)); if (h0 == h) return; }
  vec2 t = (vec2(float(h & 511u), float(h >> 9u)) + 0.5) / 512.0;
  gl_Position = vec4(t * 2.0 - 1.0, 0.0, 1.0); }`;
const FS_CELL = HEAD + `flat in float vI; out vec4 o; void main(){ o = vec4(vI, 0.0, 0.0, 0.0); }`;

const FS_UPDATE = HEAD + NOISE + SIMC + `
uniform sampler2D uP, uV, uX, uS, uCell;
uniform float uDt, uK, uWs, uWa, uWc, uWr, uV0, uNoise, uRSep, uRoostR, uFleeR, uReact, uThresh, uSpont;
uniform vec4 uGain; // separation, alignment, cohesion base, cohesion edge
uniform float uNoiseK; uniform float uAlarmR; uniform float uActT; uniform float uRoosting;
uniform sampler2D uDens; uniform vec3 uDO; uniform float uDC; uniform float uWv; uniform vec3 uMain; uniform float uWg; uniform float uTrapL;
uniform sampler2D uView; uniform float uWp;
vec4 viewAt(vec3 g){
  // the projected-view field on a 16^3 atlas (64x64, 4x4 tiles of z); g in 32-grid units
  g = clamp(g * 0.5, vec3(0.5), vec3(15.5));
  float z = g.z - 0.5; float z0 = floor(z); float fz = z - z0; int zi0 = int(z0); int zi1 = min(zi0 + 1, 15);
  vec2 t0 = (vec2(float((zi0 & 3) * 16), float((zi0 >> 2) * 16)) + g.xy) / 64.0;
  vec2 t1 = (vec2(float((zi1 & 3) * 16), float((zi1 >> 2) * 16)) + g.xy) / 64.0;
  return mix(texture(uView, t0), texture(uView, t1), fz); }
float densAt(vec3 g){
  g = clamp(g, vec3(0.5), vec3(31.5));
  float z = g.z - 0.5; float z0 = floor(z); float fz = z - z0; int zi0 = int(z0); int zi1 = min(zi0 + 1, 31);
  vec2 t0 = (vec2(float((zi0 & 7) * 32), float((zi0 >> 3) * 32)) + g.xy) / vec2(256.0, 128.0);
  vec2 t1 = (vec2(float((zi1 & 7) * 32), float((zi1 >> 3) * 32)) + g.xy) / vec2(256.0, 128.0);
  return mix(texture(uDens, t0).r, texture(uDens, t1).r, fz); }
uniform int uFrame;
uniform vec3 uRoost, uCentroid; uniform vec2 uAlt; uniform vec4 uFalcon;
layout(location=0) out vec4 oP; layout(location=1) out vec4 oV; layout(location=2) out vec4 oX; layout(location=3) out vec4 oS;
const float G = 9.81;
void main(){
  ivec2 ij = ivec2(gl_FragCoord.xy); int i = ij.y * uW + ij.x;
  vec4 P = texelFetch(uP, ij, 0), V = texelFetch(uV, ij, 0), X = texelFetch(uX, ij, 0), S = texelFetch(uS, ij, 0);
  if (i >= uN) { oP = P; oV = V; oX = X; oS = S; return; }
  uint sd0 = uint(X.w) * 2654435761u + uint(uFrame) * 97u;
  if (P.w < 0.0) {
    // perched in the reeds (P.w < 0). Leave in staggered waves when roosting ends.
    if (uRoosting < 0.3 && rnd(sd0 + 31u) < uDt * 0.9) {
      vec3 d0 = normalize(V.xyz + vec3(1e-4, 0.0, 0.0)) * 0.001;
      vec3 hdir = normalize(vec3(d0.x, 0.0, d0.z) + vec3(1e-4, 0.0, 0.0));

    corrT0 = now; corrBusy = true;
    const m = stats.subN; const pos = new Float32Array(subPos.subarray(0, m * 3)), vel = new Float32Array(subVel.subarray(0, m * 3));
    corrWorker.postMessage({ pos, vel, m }, [pos.buffer, vel.buffer]);
  }
  pollOpacity();
  if (now - opacT0 > 350 && stats.got && stats.subN > 0 && !sim.noOpac) {
    opacT0 = now;
    // probe from a random bird: averaged over many probes this is the flock-mean opacity
    const b = Math.floor(Math.random() * stats.subN);
    probeOpacity([subPos[b * 3], subPos[b * 3 + 1] + 0.01, subPos[b * 3 + 2]]);
  }
  // ---- camera & render
  updateCamera(Math.max(dtRaw, 1 / 240));
  render(t);
  renderAnnotations();
  soundUpdate();
  // ---- readouts
  fpsAcc += dtRaw; fpsN++;
  // conservative dynamic resolution for slower GPUs (the simulation itself is never reduced)
  if (!dyn.fixed && !ch.paused && !document.hidden) {
    dyn.acc += dtRaw; dyn.n++;
    if (dyn.acc > 3) { const f = dyn.n / dyn.acc; dyn.acc = 0; dyn.n = 0;
      if (f < 38 && dyn.scale > 0.72) dyn.scale = Math.max(0.72, dyn.scale * 0.88);
      else if (f > 57 && dyn.scale < 1) dyn.scale = Math.min(1, dyn.scale * 1.07); }
  }
  if (now - hudT0 > 250) {
    hudT0 = now; fps = fpsN / Math.max(fpsAcc, 1e-3); fpsAcc = 0; fpsN = 0;
    const xiL = stats.xi && stats.L ? stats.xi / stats.L : null;
    hudN.set(FMT.num(N)); hudV.set(stats.speed.toFixed(1) + ' m/s'); hudPhi.set(stats.polar.toFixed(3)); hudXi.set(xiL ? xiL.toFixed(2) : '—');
    ro.n.set(FMT.num(N)); ro.v.set(stats.speed.toFixed(1) + ' m/s'); ro.phi.set(stats.polar.toFixed(3));
    ro.rho.set(stats.rho.toFixed(2) + ' /m³'); ro.r1.set(stats.r1.toFixed(2) + ' m'); ro.kk.set(stats.cnt.toFixed(1));
    ro.xi.set(stats.xi ? stats.xi.toFixed(1) + ' m' : '—'); ro.L.set(stats.L ? stats.L.toFixed(0) + ' m' : '—');
    ro.xil.set(xiL ? xiL.toFixed(2) : '—'); ro.op.set(stats.opacity != null ? stats.opacity.toFixed(2) : '—');
    ro.ws.set(wave.active ? 'measuring' : wave.speed ? wave.speed.toFixed(0) + ' m/s' : '—'); ro.drift.set(stats.relV != null ? stats.relV.toFixed(1) + ' m/s' : '—');
    const pf = stats.perched || 0; roRoost.perched.set(FMT.num(Math.round(pf * N))); roRoost.air.set(FMT.num(Math.round((1 - pf) * N)));
    if (!ch.paused) polChart.push([stats.polar, Math.min(1, stats.alarm * 5)]);
  }
}, { always: true });

function render(t) {
  const W = canvas.width, H = canvas.height;
  const eye = cam.eye;
  const L = light;
  const fogCol = L.fog;
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.msFbo); gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  // sky + landscape
  pB('r-sky');
  gl.useProgram(P.scene);
  setU(P.scene, {
    uInvVP: cam.invVP, uEye: eye, uSky: skyLUT.tex, uSun: L.sun, uSunDisk: L.sunDisk, uMoon: L.moon, uMoonCol: L.moonCol, uVenus: L.venus, uVenusCol: L.venusCol,
    uSil: L.sil, uGround: L.ground, uFogCol: fogCol, uTime: sim.time, uVis: 7500, uPixAng: 1 / cam.focal, uStars: L.stars, uTorS: TOR_AZ * RING_H, uCloud: sim.cloud, uCloudL: cloudLUT,
  });
  drawFS();
  // reeds (alpha to coverage)
  pB('r-reeds');
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
  if (MSAA > 1) gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  const wind = [0.8, 0.35];
  for (const mir of [0, 1]) {
    if (mir) { gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false); }
    gl.useProgram(P.clump);
    setU(P.clump, { uVP: cam.VP, uEye: eye, uMirror: mir, uTime: sim.time, uSil: L.sil, uFogCol: fogCol, uVis: 5200 });
    gl.bindVertexArray(reeds.clumps.vao); gl.drawArraysInstanced(gl.TRIANGLES, 0, reeds.clumps.count, reeds.clumps.inst);
    gl.useProgram(P.reed);
    setU(P.reed, { uVP: cam.VP, uEye: eye, uTime: sim.time, uFocal: cam.focal, uMirror: mir, uWind: wind, uSil: L.sil, uFogCol: fogCol, uSun: L.sun, uSunCol: L.sunCol, uVis: 5200 });
    gl.bindVertexArray(reeds.near.vao); gl.drawArraysInstanced(gl.TRIANGLES, 0, reeds.near.count, reeds.near.inst);
  }
  gl.bindVertexArray(null);
  gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE); gl.disable(gl.BLEND); gl.depthMask(true);
  // birds
  pB('r-birds');
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  gl.useProgram(P.bird);
  const expo = tExpo.value ? 0.125 : 0;
  const base = { uP: SA.P, uV: SA.V, uX: SA.X, uW: TW, uLW: LTW, uN: N, uCellSize: sim.cell, uVP: cam.VP, uEye: eye, uFocal: cam.focal, uTime: sim.time % 900, uMinPx: sim.minPx, uExpo: expo,
    uCol: L.bird, uFogCol: fogCol, uAccent: ERA.map((c) => c * L.refL * 9), uVis: 5200, uShowAct: tWave.value ? 1 : 0 };
  for (const mir of [1, 0]) {
    gl.bindVertexArray(starlingMesh.vao);
    setU(P.bird, Object.assign({}, base, { uMirror: mir, uScale: 1, uSpan: 0.4, uSingle: 0, uAlpha: 0.95, uQuad: 0, uRes: [W, H] }));
    gl.drawArraysInstanced(gl.TRIANGLES, 0, starlingMesh.count, N);
    setU(P.bird, { uQuad: 1 });
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, N);
    if (falcon.active) {
      setU(P.bird, Object.assign({}, base, { uMirror: mir, uScale: 1, uSpan: 1.0, uSingle: 1, uQuad: 0, uSP: falcon.p, uSV: falcon.v, uSBank: falcon.bank, uSTuck: falcon.tuck, uAlpha: 1, uShowAct: 0, uExpo: 0 }));
      gl.bindVertexArray(falconMesh.vao); gl.drawArraysInstanced(gl.TRIANGLES, 0, falconMesh.count, 1);
    }
  }
  gl.bindVertexArray(null);
  gl.depthMask(true); gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
  // resolve
  pB('r-post');
  if (MSAA > 1) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, RT.msFbo); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, RT.resolve.fbo);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  }
  // bloom
  const B = RT.bloom;
  gl.useProgram(P.down);
  let srcTex = RT.resolve.tex, sw = W, sh = H;
  for (let i = 0; i < B.length; i++) {
    B[i].bind();
    setU(P.down, { uSrc: srcTex, uTexel: [1 / sw, 1 / sh], uThr: i === 0 ? 0.9 / L.exposure : 0, uClamp: 60 / L.exposure });
    drawFS(); srcTex = B[i].tex; sw = B[i].w; sh = B[i].h;
  }
  gl.useProgram(P.up); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = B.length - 1; i > 0; i--) {
    B[i - 1].bind(); setU(P.up, { uSrc: B[i].tex, uTexel: [1 / B[i].w, 1 / B[i].h] }); drawFS();
  }
  gl.disable(gl.BLEND);
  // final
  Cosmos.gl.screen(gl);
  gl.useProgram(P.final);
  setU(P.final, { uScene: RT.resolve.tex, uBloom: B[0].tex, uExposure: L.exposure, uBloomK: 0.12, uTime: sim.time });
  drawFS();
  pE();
}

Cosmos.debug.state = () => ({
  birds: N, cap: NCAP, cell: +sim.cell.toFixed(2), polar: +stats.polar.toFixed(3), speed: +stats.speed.toFixed(2), R: +stats.R.toFixed(2), neighbours: +stats.cnt.toFixed(2),
  r1: +stats.r1.toFixed(2), bankAct: +(stats.bankAct || 0).toFixed(2), bankIdle: +(stats.bankIdle || 0).toFixed(2), nAct: stats.nAct, rho: +stats.rho.toFixed(3), alarm: +stats.alarm.toFixed(3), xi: stats.xi && +stats.xi.toFixed(1), L: stats.L && +stats.L.toFixed(1), opacity: stats.opacity && +stats.opacity.toFixed(3),
  centroid: sim.centroid.map((v) => +v.toFixed(1)), main: sim.main.map((v) => +v.toFixed(1)), mainFrac: stats.mainFrac && +stats.mainFrac.toFixed(2), spread: +stats.spread.toFixed(1), axes: stats.axes && stats.axes.map((v) => +v.toFixed(1)), falcon: { mode: falconMode, state: falcon.state, p: falcon.p.map((v) => +v.toFixed(1)) },
  waveSpeed: wave.speed && +wave.speed.toFixed(1), relV: stats.relV && +stats.relV.toFixed(2), waveN: wave.last && wave.last.n,
  roosting: +sim.roosting.toFixed(2), perched: stats.perched != null ? +stats.perched.toFixed(3) : null,
  renderScale: +dyn.scale.toFixed(2),
  cam: cam.mode, camYaw: +cam.yaw.toFixed(3), camPitch: +cam.pitch.toFixed(3), camC: cam.C.map((v) => +v.toFixed(1)), mainScr: (project(sim.main) || []).map((v) => Math.round(v)), fps: +fps.toFixed(1), msaa: MSAA, sunEl: light.sunEl, exposure: +light.exposure.toFixed(3), simTime: +sim.time.toFixed(2),
});
Cosmos.debug.attack = startAttack;
Cosmos.debug.clusters = (link) => {
  // largest connected group in the subsample (single linkage), as a fraction of the sample
  link = link || 7; const n = stats.subN || 0; if (!n) return null;
  const par = new Int32Array(n); for (let i = 0; i < n; i++) par[i] = i;
  const f = (i) => { while (par[i] !== i) { par[i] = par[par[i]]; i = par[i]; } return i; };
  const l2 = link * link;
  for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) { const dx = subPos[a * 3] - subPos[b * 3], dy = subPos[a * 3 + 1] - subPos[b * 3 + 1], dz = subPos[a * 3 + 2] - subPos[b * 3 + 2]; if (dx * dx + dy * dy + dz * dz < l2) { const ra = f(a), rb = f(b); if (ra !== rb) par[ra] = rb; } }
  const cnt = new Map(); for (let i = 0; i < n; i++) { const r = f(i); cnt.set(r, (cnt.get(r) || 0) + 1); }
  const sizes = [...cnt.values()].sort((x, y) => y - x);
  return { largest: +(sizes[0] / n).toFixed(2), second: +((sizes[1] || 0) / n).toFixed(2), groups10: sizes.filter((s) => s > n * 0.05).length };
};
Cosmos.debug.waveBins = () => { const D = wave.lastD || []; const bins = {}; for (const [t, d] of D) { const k = Math.floor((t - wave.lastT0) * 5) / 5; (bins[k] = bins[k] || []).push(d); } return Object.keys(bins).sort((a, b) => a - b).map((k) => { const a = bins[k].sort((x, y) => x - y); return [+k, a.length, +a[Math.floor(a.length * 0.5)].toFixed(1), +a[Math.floor(a.length * 0.9)].toFixed(1)]; }); };
Cosmos.debug.pulse = () => { selFalcon.set('ai', true); falcon.pulse = 3; falcon.p = sim.main.slice(); falcon.v = [0, 0.01, 0]; falcon.state = 'pass'; falcon.t = 0; return sim.main; };
Cosmos.debug.poke = () => { const m = sim.main; falcon.p = m.slice(); falcon.v = [0, -30, 0]; falcon.state = 'pass'; falcon.t = 0; falcon.active = true; return m; };
Cosmos.debug.sim = sim;
Cosmos.debug.wave = wave;
Cosmos.debug.dyn = dyn;
Cosmos.debug.setSun = (v) => sSun.set(v);
Cosmos.debug.roost = (on) => setRoost(on);
Cosmos.debug.checkSort = () => {
  simStep(0, 2); const t = sim.sorted; const buf = new Float32Array(NCAP * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo); gl.readPixels(0, 0, TW, TH, gl.RGBA, gl.FLOAT, buf);
  let bad = 0, seen = new Uint8Array(NCAP), dup = 0;
  for (let i = 0; i < NCAP; i++) { const k = buf[i * 4], id = buf[i * 4 + 1]; if (seen[id]) dup++; seen[id] = 1; if (i && (k < buf[(i - 1) * 4] || (k === buf[(i - 1) * 4] && id < buf[(i - 1) * 4 + 1]))) bad++; }
  return { n: NCAP, outOfOrder: bad, duplicates: dup };
};
Cosmos.debug.gpu = (on) => { if (on !== undefined) { prof.on = !!on; prof.acc = {}; prof.n = {}; return TQ ? 'timer on' : 'no timer ext'; } const o = {}; let tot = 0; for (const k in prof.acc) { o[k] = +(prof.acc[k] / prof.n[k]).toFixed(2); tot += o[k]; } o.total = +tot.toFixed(2); return o; };
Cosmos.debug.profile = () => {
  // coarse CPU-side timing with a readback as a sync point (contended GPUs make this noisy)
  const r = {}; const px = new Float32Array(4); const sync = () => { gl.bindFramebuffer(gl.FRAMEBUFFER, trackT.fbo); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px); };
  const T = (name, fn, n) => { sync(); const t0 = performance.now(); for (let i = 0; i < n; i++) fn(); sync(); r[name] = +((performance.now() - t0) / n).toFixed(2); };
  T('sim', () => simStep(1 / 60), 10); T('render', () => render(0), 10);
  r.w = canvas.width; r.h = canvas.height; return r; };
Cosmos.debug.light = light;
Cosmos.debug.setCam = setCamMode;
Cosmos.debug.cam = cam;
})();
