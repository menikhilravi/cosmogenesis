<script>
(function () {
'use strict';

/* =====================================================================
   Chapter 7 · The Event Horizon
   Real-time GPU ray tracing of Schwarzschild null geodesics.
   Units: G = c = M = 1 throughout the shaders (lengths in M = GM/c²).
   ===================================================================== */

const NOTES = `
<p>You are hovering near a black hole four million times the mass of the Sun. Every pixel on your screen is a ray of light traced backwards from your eye, along the curved path that Einstein's gravity allows, until it escapes to the stars or falls in. Nothing here is painted on. Drag to orbit, scroll or pinch to move in, and watch the light-path diagram in the controls follow you.</p>
<p>The glowing ring is gas in orbit, heated as it spirals inward. It seems to wrap over the top and under the bottom of the hole. That is the far side of the same flat disk, its light bent up and over the hole toward you. The left side blazes white because the gas there rushes toward you at up to half the speed of light. The right side recedes, so it dims and reddens.</p>
<p>The black disk in the middle is the shadow. It is 2.6 times wider than the event horizon, because light that passes too close spirals in. A hair-thin ring hugs its edge: light that looped around the hole before reaching you. A few seconds after you arrive, a young blue galaxy drifts directly behind the hole. Its light comes round both sides at once and closes into a complete Einstein ring around the disk.</p>
<p><strong>Try this:</strong></p>
<ul>
<li>Switch to <em>Interstellar style</em>, which drops the Doppler effect as the film did, and compare.</li>
<li>Turn on the <em>Event Horizon Telescope view</em> (<kbd>T</kbd>) to blur the same light down to the resolution of the 2019 picture of M87*.</li>
<li>Press <kbd>Z</kbd> or <em>Zoom into the photon ring</em> to magnify the edge of the shadow 40 times. The hair-thin ring splits into a nest of ever thinner rings, each a complete image of the disk.</li>
<li>Press <em>Fall in</em> (<kbd>P</kbd>) and ride a real free-fall trajectory through the event horizon.</li>
</ul>`;

const SCIENCE = `
<h4>Spacetime</h4>
<p>The hole is described by the Schwarzschild metric, the exact solution of Einstein's equations outside a non-rotating mass. Units have G = c = 1, so lengths are in M = GM/c² (1.48 km per solar mass) and times in GM/c³ (4.93 µs per solar mass).</p>
<span class="eq">ds² = −(1 − 2M/r) dt² + (1 − 2M/r)<sup>−1</sup> dr² + r² dΩ²</span>
<span class="eq">r<sub>s</sub> = 2GM/c² ≈ 2.95 km × (M/M<sub>☉</sub>)</span>
<h4>Light rays</h4>
<p>A light ray stays in a plane through the centre. With u = 1/r, its orbit obeys the Binet equation. For every pixel the shader integrates it with fourth-order Runge–Kutta and an adaptive step, then finishes the last stretch to infinity as a quadrature of the first integral. Run in double precision against a fine reference integration, the same scheme agrees to about 10⁻⁶ rad. The impact parameter b = L/E is fixed by the pixel's direction: b = r sin α / √(1 − 2M/r).</p>
<span class="eq">d²u/dφ² + u = 3Mu²,&nbsp;&nbsp; (du/dφ)² = 1/b² − u²(1 − 2Mu)</span>
<p>Circular photon orbits exist at the photon sphere, r = 3M = 1.5 r<sub>s</sub>. Rays with b &lt; 3√3 M ≈ 5.196 M are captured, so a distant observer sees a shadow of radius √27 M ≈ 2.6 r<sub>s</sub>. A static observer at radius r sees its edge at sin α = (3√3 M/r)√(1 − 2M/r), which is 5.6° at the default distance of 52M. A source directly behind the hole appears as an Einstein ring about 17° from the centre there. The galaxy that forms it is a young, blue spiral. Lensing conserves surface brightness, so the ring is exactly as bright per square degree as the galaxy itself: it just covers far more sky. Its radius in the caption is solved on the spot, by bisecting for the ray whose total sweep is exactly 180°. Every crossing of the disk plane is recorded, so the far side of the disk appears above and below the hole and a thin higher-order image hugs the shadow. The light-travel time along each ray, dt/dφ = r²/[b(1 − 2M/r)], is integrated too, so each image shows the disk as it was when that light left.</p>
<h4>The disk</h4>
<p>A thin disk runs from the innermost stable circular orbit, r<sub>ISCO</sub> = 6M = 3 r<sub>s</sub>, out to 25M. Gas moves on Keplerian orbits. The temperature follows the thin-disk profile of Shakura &amp; Sunyaev (1973), plus a small torque at the inner edge (δ = 0.04, after Agol &amp; Krolik 2000). With δ = 0 the rim would fade to black. Here it stays lit at 55% of peak brightness, and the peak sits at 7.5M.</p>
<span class="eq">Ω = √(M/r³),&nbsp;&nbsp; T⁴ ∝ r<sup>−3</sup> [1 − (1 − δ)√(r<sub>in</sub>/r)]</span>
<p>For gas on a circular orbit seen by a static observer at r<sub>obs</sub>, the ratio of observed to emitted frequency uses the photon's conserved angular momentum L<sub>z</sub> about the spin axis:</p>
<span class="eq">g = √(1 − 3M/r) / [(1 − Ω L<sub>z</sub>/E) √(1 − 2M/r<sub>obs</sub>)]</span>
<p>It splits into a gravitational part √(1 − 2M/r)/√(1 − 2M/r<sub>obs</sub>) and a Doppler part 1/[γ(1 − Ω L<sub>z</sub>/E)], where the orbital speed is v = √(M/(r − 2M)): 0.5c at the ISCO. Because I<sub>ν</sub>/ν³ is conserved along a ray, a blackbody at T is seen as a blackbody at gT, and its total brightness scales as g⁴. That is Doppler beaming. Each colour on screen is the CIE 1931 colour of a Planck spectrum at gT. Stars are drawn as points through the local lensing map, so near the Einstein ring they brighten and stretch into arcs.</p>
<h4>Clocks and tides</h4>
<span class="eq">dτ/dt = √(1 − 2M/r),&nbsp;&nbsp; Δa ≈ 2GM L / r³</span>
<p>A hovering clock at radius r runs slow by the first factor. The stretch across a body of length L at the horizon is c⁶L/(4G²M²). That is about 2 × 10⁸ m/s² across a 2 m person at a 10 M<sub>☉</sub> hole, and a gentle 10⁻³ m/s² at Sgr A*.</p>
<h4>Falling in</h4>
<p>The plunge is a radial geodesic dropped from rest at r<sub>0</sub> = 30M. In closed form, r = (r<sub>0</sub>/2)(1 + cos η) and τ = √(r<sub>0</sub>³/8M)(η + sin η). The far-away time t diverges at the horizon. The view is carried into the faller's frame with relativistic aberration, cos θ′ = (cos θ + β)/(1 + β cos θ), and the matching Doppler shift. β is the speed measured by hovering observers, √(1 − (1 − 2M/r)/(1 − 2M/r<sub>0</sub>)). The fall takes 181 M of proper time to reach the horizon, then 1.4 M more to reach the singularity. Playback speed varies, but the clocks show the true values. The view ends at the horizon: the tracer is anchored to hovering observers, and none exist inside.</p>
<h4>The photon rings</h4>
<p>Rays with b just above 3√3 M wind round the photon sphere before they escape. Light in ring n has made n extra half orbits, and each ring holds a complete, squeezed image of the whole disk. Nearby orbits peel away from the circular one as e<sup>φ</sup>, so each ring is e<sup>π</sup> ≈ 23 times thinner than the one before. The magnifier (<kbd>Z</kbd>) turns the camera to the left edge of the shadow and narrows the field 40 times (24 on a phone). A worker thread traces 1,400 rays along that line on the CPU. The labels mark where each order meets the disk, with the widths it measures. Seen from the default view, along the left edge, the n = 1 band is 0.38 M wide, n = 2 is 30 times thinner and n = 3 is 24 times thinner again, closing in on e<sup>π</sup>.</p>
<span class="eq">w<sub>n+1</sub> / w<sub>n</sub> → e<sup>−γ</sup>,&nbsp;&nbsp; γ = π for Schwarzschild</span>
<h4>The iron line</h4>
<p>X-rays from hot gas above an inner disk make its iron fluoresce at 6.40 keV. Each patch of disk is seen at 6.40 g keV, so the whole disk smears the line into a broad, skewed profile. The chart traces a 150 × 150 grid of rays from your position, keeps each ray's first hit on the disk, and adds photon flux with an emissivity ε ∝ r⁻³ from 6M to 25M. Jittered passes are averaged until the profile settles. The dashed Newtonian curve uses g = 1 + v sin i sin φ, with no light bending, beaming or redshift. Profiles like this were first seen in the Seyfert galaxy MCG−6-30-15 by the ASCA satellite (Tanaka et al. 1995).</p>
<span class="eq">N(E) ∝ Σ<sub>pixels</sub> g³ ε(r) δ(E − g E<sub>0</sub>) ΔΩ,&nbsp;&nbsp; E<sub>0</sub> = 6.40 keV</span>
<h4>The telescope's view</h4>
<p>The Event Horizon Telescope photographed M87* at a wavelength of 1.3 mm with an Earth-sized array. Its resolution, about 20 µas, is half the 42 µas ring. The EHT view points the camera 17° from the spin axis, as inferred from M87's jet. It weights the emission toward the hole, where the radio glow comes from, and blurs the image with a Gaussian beam of that width relative to the ring. The result is shown in the afmhot palette used for the published images. The lopsided brightness is the same Doppler beaming as in the full-resolution view.</p>
<h4>What is simplified</h4>
<p>The hole does not spin. Real holes almost certainly do, and spin reshapes the shadow and moves the ISCO. The disk is infinitely thin and optically thick, with no corona, jet or radiative transfer. Its turbulence is noise carried round at the Keplerian rate, not magnetohydrodynamics. Real disk temperatures are 10⁴–10⁷ K and peak in the ultraviolet or X-rays. The colours are toned by mapping the peak to a chosen visible temperature. Brightness is bolometric (∝ T⁴), and stars and galaxies are treated as blackbodies so that they shift colour correctly. The stars and galaxies are procedural. The camera hovers on rockets except during the fall. Sgr A* and M87* are fed by hot, thick, faint flows rather than thin disks, so they appear here only for scale.</p>
<span class="cite">Schwarzschild, K. (1916). Über das Gravitationsfeld eines Massenpunktes nach der Einsteinschen Theorie. Sitzungsber. Preuss. Akad. Wiss., 189–196.</span>
<span class="cite">Luminet, J.-P. (1979). Image of a spherical black hole with thin accretion disk. Astron. Astrophys. 75, 228–235.</span>
<span class="cite">Novikov, I. D. &amp; Thorne, K. S. (1973). Astrophysics of black holes. In Black Holes (Les Astres Occlus), 343–450. Gordon &amp; Breach.</span>
<span class="cite">James, O., von Tunzelmann, E., Franklin, P. &amp; Thorne, K. S. (2015). Gravitational lensing by spinning black holes in astrophysics, and in the movie Interstellar. Class. Quantum Grav. 32, 065001.</span>
<span class="cite">Fabian, A. C., Rees, M. J., Stella, L. &amp; White, N. E. (1989). X-ray fluorescence from the inner disc in Cygnus X-1. Mon. Not. R. Astron. Soc. 238, 729–736.</span>
<span class="cite">Johnson, M. D., Lupsasca, A., Strominger, A. et al. (2020). Universal interferometric signatures of a black hole's photon ring. Sci. Adv. 6, eaaz1310.</span>
<span class="cite">Event Horizon Telescope Collaboration (2019). First M87 Event Horizon Telescope Results. I. The shadow of the supermassive black hole. ApJL 875, L1.</span>
<span class="cite">Event Horizon Telescope Collaboration (2022). First Sagittarius A* Event Horizon Telescope Results. I. The shadow of the supermassive black hole in the center of the Milky Way. ApJL 930, L12.</span>`;

const ch = Cosmos.chapter({ id: 'black-hole', notes: NOTES, science: SCIENCE, notesFolded: true });
const U = Cosmos.util, F = Cosmos.fmt, h = Cosmos.h;
const small = () => window.matchMedia('(max-width: 760px)').matches;
const PHONE = small();
const DEG = Math.PI / 180;

/* ------------------------------------------------------------ physics */
const RIN = 6, ROUT = 25;
const DELTA_T = 0.04;  // inner-edge torque parameter (0 = zero-torque Shakura–Sunyaev/Novikov–Thorne edge)
const fT = (r) => Math.pow(r, -0.75) * Math.pow(Math.max(0, 1 - (1 - DELTA_T) * Math.sqrt(RIN / r)), 0.25);
const FPEAK = (() => { let m = 0; for (let r = RIN; r < 20; r += 0.01) m = Math.max(m, fT(r)); return m; })();
const MSUN_M = 1476.625;            // GM☉/c² in metres
const MSUN_S = 4.925491e-6;         // GM☉/c³ in seconds
const AU = 1.495978707e11, C = 2.99792458e8, G0 = 9.80665;
const R0_PLUNGE = 30;
const BC = Math.sqrt(27);            // critical impact parameter 3√3 M

/* CPU twin of the shader's tracer (same Binet equation, same disk-plane crossing logic, finer steps).
   Pure function, so it can also be shipped to the worker as source text.
   out = [nCrossings, escaped, b, L_y/E, r_0 … r_5] (radii of successive disk-plane crossings) */
function bhTrace(px, py, pz, dx, dy, dz, out) {
  const rc = Math.hypot(px, py, pz), hx = px / rc, hy = py / rc, hz = pz / rc;
  const dn = Math.hypot(dx, dy, dz); dx /= dn; dy /= dn; dz /= dn;
  let u = 1 / rc;
  const lapse = Math.sqrt(Math.max(1 - 2 * u, 1e-6));
  const dr = dx * hx + dy * hy + dz * hz;
  let qx = dx - dr * hx, qy = dy - dr * hy, qz = dz - dr * hz;
  let ql = Math.hypot(qx, qy, qz);
  if (ql < 1e-9) {
    const ax = Math.abs(hy) < 0.9 ? 0 : 1, ay = Math.abs(hy) < 0.9 ? 1 : 0;
    qx = hy * 0 - hz * ay; qy = hz * ax - hx * 0; qz = hx * ay - hy * ax;
    const l2 = Math.hypot(qx, qy, qz); qx /= l2; qy /= l2; qz /= l2; ql = 1e-9;
  } else { qx /= ql; qy /= ql; qz /= ql; }
  let up = -u * lapse * dr / ql;
  const ib2 = up * up + u * u * (1 - 2 * u), b = 1 / Math.sqrt(ib2);
  const by = -b * (hz * qx - hx * qz);
  let pc = ((Math.atan2(qy, hy) + 0.5 * Math.PI) % Math.PI + Math.PI) % Math.PI;
  if (pc < 1e-4) pc += Math.PI;
  let phi = 0, n = 0, esc = 0;
  for (let i = 0; i < 4000; i++) {
    if (u >= 0.5) break;
    if (up < 0 && u < 1 / 27 && up * up > 0.64 * ib2) { esc = 1; break; }
    const a = Math.abs(up) + 1e-5;
    const hs = Math.max(Math.min(0.05, 0.02 / a, 0.2 * u / a), 1e-6);
    const k1p = 3 * u * u - u;
    const u2 = u + 0.5 * hs * up, p2 = up + 0.5 * hs * k1p, k2p = 3 * u2 * u2 - u2;
    const u3 = u + 0.5 * hs * p2, p3 = up + 0.5 * hs * k2p, k3p = 3 * u3 * u3 - u3;
    const u4 = u + hs * p3, p4 = up + hs * k3p, k4p = 3 * u4 * u4 - u4;
    const un = u + hs / 6 * (up + 2 * p2 + 2 * p3 + p4), upn = up + hs / 6 * (k1p + 2 * k2p + 2 * k3p + k4p);
    while (pc <= phi + hs && n < 6) {
      const s = (pc - phi) / hs, s2 = s * s, s3 = s2 * s;
      const uc = (2 * s3 - 3 * s2 + 1) * u + (s3 - 2 * s2 + s) * hs * up + (3 * s2 - 2 * s3) * un + (s3 - s2) * hs * upn;
      out[4 + n] = 1 / Math.max(uc, 1e-9); n++; pc += Math.PI;
    }
    phi += hs; u = un; up = upn;
    if (u <= 0) { esc = 1; break; }
  }
  out[0] = n; out[1] = esc; out[2] = b; out[3] = by;
  return n;
}

/* Worker: (1) the iron-line profile seen from the camera, (2) where the nested photon-ring images sit. */
function bhWorkerMain() {
  const out = new Float64Array(16);
  const firstHit = (n, rin, rout) => { for (let k = 0; k < n; k++) { const r = out[4 + k]; if (r > rin && r < rout) return k; } return -1; };
  self.onmessage = (ev) => {
    const m = ev.data;
    if (m.type === 'line') {
      const NB = m.nb, hist = new Float64Array(NB), N = m.n, Tn = m.tan;
      const px = m.pos[0], py = m.pos[1], pz = m.pos[2], f = m.fwd, R = m.right, U = m.up;
      const lapseInv = 1 / Math.sqrt(Math.max(1 - 2 / Math.hypot(px, py, pz), 1e-6));
      const step = 2 * Tn / N;

/* ------------------------------------------------- blackbody colour LUT */
const bbTex = (function () {
  const N = 256, data = new Float32Array(N * 4);
  const lo = Math.log(500), hi = Math.log(60000);
  const gg = (x, mu, s1, s2) => { const t = (x - mu) / (x < mu ? s1 : s2); return Math.exp(-0.5 * t * t); };
  for (let i = 0; i < N; i++) {
    const T = Math.exp(lo + (hi - lo) * i / (N - 1));
    let X = 0, Y = 0, Z = 0;
    for (let l = 380; l <= 780; l += 4) {
      const lm = l * 1e-9;
      const B = 1 / (Math.pow(lm, 5) * (Math.exp(0.0143877735 / (lm * T)) - 1));
      X += B * (1.056 * gg(l, 599.8, 37.9, 31.0) + 0.362 * gg(l, 442.0, 16.0, 26.7) - 0.065 * gg(l, 501.1, 20.4, 26.2));
      Y += B * (0.821 * gg(l, 568.8, 46.9, 40.5) + 0.286 * gg(l, 530.9, 16.3, 31.1));
      Z += B * (1.217 * gg(l, 437.0, 11.8, 36.0) + 0.681 * gg(l, 459.0, 26.0, 13.8));
    }
    X /= Y; Z /= Y; Y = 1;
    let r = 3.2406 * X - 1.5372 * Y - 0.4986 * Z, g = -0.9689 * X + 1.8758 * Y + 0.0415 * Z, b = 0.0557 * X - 0.2040 * Y + 1.0570 * Z;
    r = Math.max(r, 0); g = Math.max(g, 0); b = Math.max(b, 0);
    const Yl = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    data.set([r / Yl, g / Yl, b / Yl, 1], i * 4);
  }
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, N, 1, 0, gl.RGBA, gl.FLOAT, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
})();

let skyCube = null, skySize = 0;
function buildSky() {
  const maxCube = gl.getParameter(gl.MAX_CUBE_MAP_TEXTURE_SIZE);
  const N = Math.min(1024, maxCube);
  const levels = Math.floor(Math.log2(N)) + 1;
  const tex = gl.createTexture();

  gl.texStorage2D(gl.TEXTURE_CUBE_MAP, levels, gl.RG16F, N, N);

  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_CUBE_MAP);

    rCam: +rc.toFixed(3), inclinationDeg: +(cam.phi / DEG).toFixed(2), massMsun: S.mass, mode: S.mode,
    doppler: S.doppler, grav: S.grav, disk: S.disk, grid: S.grid, overlay: S.overlay, hotspot: S.hotspot,
    traceRes: T ? [T.w, T.h] : null, renderScale: S.scale, fps: +S.fps.toFixed(1), simTimeM: +S.simT.toFixed(1),
    shadowHalfAngleDeg: +(Math.asin(Math.min(1, Math.sqrt(27) * Math.sqrt(Math.max(0, 1 - 2 / rc)) / rc)) / DEG).toFixed(3),
    clockRate: +Math.sqrt(Math.max(0, 1 - 2 / rc)).toFixed(5),
    plunge: { state: PL.state, r: +PL.r.toFixed(4), tauM: +PL.tau.toFixed(3), tFarM: +PL.tfar.toFixed(3), beta: +PL.beta.toFixed(4) },
    skyCube: skySize,
    zoom: { on: ZOOM.on, factor: +ZOOM.Zf.toFixed(2), bands: ZOOM.runs ? ZOOM.runs.filter((r) => r.n >= 0 && r.n <= 3).map((r) => [r.n, +(r.b0 - BC).toExponential(2), +(r.b1 - BC).toExponential(2)]) : null },
    ironLine: IRON.span ? { keV: IRON.span.map((v) => +v.toFixed(2)), inclinationDeg: +(cam.phi / DEG).toFixed(1) } : null,
    lensGalaxyOffsetDeg: S.ringAng != null ? +S.ringAng.toFixed(2) : null,
  };
};
Cosmos.debug.plunge = startPlunge;
Cosmos.debug.view = (theta, phi, dist) => { cancelIntro(); cam.theta = theta; cam.phi = phi; if (dist) { cam.dist = dist; cam.setDist(dist); } return [cam.theta, cam.phi, cam.dist]; };
Cosmos.debug.set = (k, v) => { S[k] = v; return S[k]; };
Cosmos.debug.bench = (n = 10) => {
  const px = new Uint8Array(4);
  const tiny = Cosmos.gl.target(gl, { w: 1, h: 1, internal: gl.RGBA8, filter: 'nearest' });
  const sync = () => { tiny.bind(); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); };
  const out = {};
  sync();
  let t0 = performance.now();
  for (let i = 0; i < n; i++) render(0);
  sync(); out.full = (performance.now() - t0) / n;
  BENCH.skip = { resolve: 1, bloom: 1, final: 1 };
  t0 = performance.now(); for (let i = 0; i < n; i++) render(0); sync(); out.traceOnly = (performance.now() - t0) / n;
  BENCH.skip = { trace: 1, bloom: 1, final: 1 };
  t0 = performance.now(); for (let i = 0; i < n; i++) render(0); sync(); out.resolveOnly = (performance.now() - t0) / n;
  BENCH.skip = { trace: 1, resolve: 1, final: 1 };
  t0 = performance.now(); for (let i = 0; i < n; i++) render(0); sync(); out.bloomOnly = (performance.now() - t0) / n;
  BENCH.skip = { trace: 1, resolve: 1, bloom: 1 };
  t0 = performance.now(); for (let i = 0; i < n; i++) render(0); sync(); out.finalOnly = (performance.now() - t0) / n;
  BENCH.skip = { trace: 1, resolve: 1, bloom: 1, final: 1 };
  t0 = performance.now(); for (let i = 0; i < n; i++) render(0); sync(); out.taaOnly = (performance.now() - t0) / n;
  BENCH.skip = { trace: 1, resolve: 1, bloom: 1, final: 1, taa: 1 };
  t0 = performance.now(); for (let i = 0; i < n; i++) render(0); sync(); out.nothing = (performance.now() - t0) / n;
  BENCH.skip = {};
  gl.deleteTexture(tiny.tex); gl.deleteFramebuffer(tiny.fbo);
  out.res = [T.w, T.h]; out.canvas = [canvas.width, canvas.height];
  Object.keys(out).forEach((k) => { if (typeof out[k] === 'number') out[k] = +out[k].toFixed(2); });
  return out;
};

document.addEventListener('visibilitychange', () => { if (!document.hidden) ft.acc = ft.n = 0; });

setMass(S.mass);
drawIron();
let roT = 0;
ch.loop((dt, t, frame) => {
  if (document.hidden) return;
  frameN = frame;
  const realDt = dt;
  // far-away (coordinate) time runs 1/√(1−2M/r) faster than the hovering viewer's own clock
  const rNow = currentR();
  const dilation = (PL.state === 'fall' || PL.state === 'dark') ? 1 : 1 / Math.sqrt(Math.max(1 - 2 / rNow, 0.05));
  S.simT += realDt * S.timeRate * dilation;
  if (S.simT > 2e5) S.simT -= 1.5e5;
  S.ehtMix += ((S.eht ? 1 : 0) - S.ehtMix) * Math.min(1, (ch.paused ? 1 / 60 : realDt) * 1.6);
  {
    const zd = (ch.paused ? 1 / 60 : realDt) / 3.2;      // 3.2 s zoom
    ZOOM.mix = U.clamp(ZOOM.mix + (ZOOM.on ? zd : -zd * 1.4), 0, 1);
    const x = ZOOM.mix; ZOOM.e = x * x * x * (x * (x * 6 - 15) + 10);
  }
  if (Math.abs(S.ehtMix - (S.eht ? 1 : 0)) < 1e-3) S.ehtMix = S.eht ? 1 : 0;
  updateCamera(realDt, ch.paused ? 1 / 60 : realDt);
  render(realDt);
  adaptScale(realDt);
  roT += realDt || 1 / 60;
  if (roT > 0.25) {
    roT = 0;
    const rc = currentR();
    updateReadouts();
    if (PL.state === 'off' || PL.state === 'return' || PL.state === 'glide') {
      if (!sDist.input.matches(':active')) sDist.set(cam.dist);
      if (!sInc.input.matches(':active')) sInc.set(cam.phi / DEG);
    }
    hudR.set((PL.state === 'fall' ? 'free fall' : 'hovering') + ' · r = ' + rc.toFixed(1) + ' M');
    hudClock.set(Math.sqrt(Math.max(0, 1 - 2 / rc)).toFixed(4) + ' × far-away');
    const aS = Math.asin(Math.min(1, Math.sqrt(27) * Math.sqrt(Math.max(0, 1 - 2 / rc)) / rc));
    hudShadow.set((2 * aS / DEG).toFixed(1) + '° wide');
    hudRes.set(T ? F.num(T.w * T.h) + ' · ' + Math.round(S.fps) + ' fps' : '');
    hudPlay.set('1 s = ' + timeStr(S.timeRate) + ' of your time');
    updateFraming();
    if (PL.state === 'off' && !S.eht && !ZOOM.on && S.ringAng != null) {
      if (S.ringAng < 2.4 && performance.now() - (S.ringToast || -1e9) > 60000) {
        S.ringToast = performance.now();
        const aE = einsteinRingDeg(rc);
        caption('Einstein ring · radius ' + aE.toFixed(1) + '°', 'A blue spiral galaxy far behind the hole is exactly aligned. Its light reaches you from every side of the shadow at once.', 6500, 'ring');
      }
    }
    stamp.innerHTML = `i = <b>${(cam.phi / DEG).toFixed(0)}°</b> · r = <b>${rc.toFixed(1)} M</b> = ${lengthStr(rc)}<br>M = ${F.sci(S.mass, 2)} M☉`;
    soundUpdate();
  }
  if (PL.state === 'fall' || PL.state === 'dark') {
    clk.tau.innerHTML = PL.tau.toFixed(1) + ' M <em>' + timeStr(PL.tau) + '</em>';
    clk.tfar.innerHTML = (PL.state === 'dark' ? '∞' : PL.tfar.toFixed(1) + ' M') + ' <em>' + (PL.state === 'dark' ? '' : timeStr(PL.tfar)) + '</em>';
    clk.r.textContent = PL.r.toFixed(2) + ' M';
    clk.v.textContent = (PL.beta).toFixed(3) + ' c';
  }
  if (frame % 3 === 0) drawInset();
  if (ZOOM.e > 0.5) requestRings();
  layoutRings();
  if (frame % 10 === 0) requestIron();
  if (frame % 10 === 5 && IRON.drawn !== ironKey()) drawIron();   // e.g. the deck (bottom sheet) was just opened
}, { always: true });

ch.onResize(() => { insetKey = ''; drawIron(); });
console.info('Event Horizon: ray tracer ready, sky cube ' + skySize + '², ' + (gl.ext.floatRT ? 'float32' : 'half-float') + ' targets');
})();
</script>
