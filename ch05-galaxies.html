<script>
(function () {
'use strict';
const U = Cosmos.util, FMT = Cosmos.fmt;
const SMALL = window.matchMedia('(max-width: 760px)').matches;

/* =====================================================================================
   FIELD NOTES
   ===================================================================================== */
const NP_TXT = SMALL ? '65,536' : '262,144';
const NOTES = `
<p>Two spiral galaxies, each a disk of about a hundred billion suns, are falling into each other. Every point of light here stands for roughly ${SMALL ? 'five million' : 'a million'} stars. The gold is old starlight, the blue-white is young stars, and the pink knots are hydrogen clouds lit up by the stars being born inside them. Dark threads are dust.</p>
<p>Watch the first close pass. Nothing crashes. Stars are so small and so far apart that the two disks sweep straight through each other. What changes everything is <em>tides</em>. The near side of each galaxy is pulled harder than the far side, so long arcs of stars and gas are peeled off and flung out as tails more than a hundred thousand light-years long.</p>
<p>Friction with the invisible dark matter then drains the orbit. The galaxies swing back, pass again and settle into one glowing ball of old stars. Where their gas clouds collide, bursts of new stars flare up. Our Milky Way will do this with Andromeda.</p>
<h4>Try this</h4>
<ul>
<li>Let the Antennae run until the tails are long, then press <strong>Reverse time</strong> (<kbd>R</kbd>). The tail stars turn teal and all ${NP_TXT} stars retrace their paths, exactly. When the two spirals come back whole, the teal stars sit in their outer rims. That is where tails come from.</li>
<li>Turn on <strong>Paint with the dye</strong> (<kbd>T</kbd>, or Shift-drag) and stain a patch of a disk before the first pass. Then follow your stars.</li>
<li>In <strong>Custom</strong>, tick <em>Disk 1 retrograde</em>. Its tail almost vanishes. Long tails need a disk that spins the same way as the orbit.</li>
<li>In <strong>Milkomeda</strong>, set the camera to <em>From the Sun</em> and watch Andromeda swell in our own night sky over four billion years.</li>
</ul>
<p class="gx-sub">Drag to orbit, pinch or scroll to zoom. Drag along the history chart to scrub time. Keys: <kbd>V</kbd> camera, <kbd>D</kbd> dark matter, <kbd>O</kbd> orbit tracks, <kbd>,</kbd> <kbd>.</kbd> step 50 Myr, <kbd>1</kbd>–<kbd>6</kbd> encounters.</p>`;

const SCIENCE = `
<h4>Gravity, restricted</h4>
<p>Every star obeys Newton, pulled by every galaxy:</p>
<span class="eq">d²<b>x</b>/dt² = −Σ<sub>g</sub> ∇Φ<sub>g</sub>(<b>x</b> − <b>X</b><sub>g</sub>(t))</span>
<p>This is the <em>restricted</em> N-body method of Toomre &amp; Toomre (1972), upgraded. Each galaxy is a rigid analytic potential centred on <b>X</b><sub>g</sub>. The centres move as a small N-body system, each feeling the others' full potentials, and the ${NP_TXT} stars and gas clouds are massless test particles. What it leaves out: particles do not pull on each other, so disks cannot grow their own bars or spirals, halos do not deform, and gas does not dissipate energy. A real merger scrambles its disks into an elliptical galaxy by violent relaxation; the remnant here is only an approximation.</p>
<h4>The potentials</h4>
<p>Dark halo: Navarro–Frenk–White, truncated at r<sub>t</sub> (or logarithmic, or none, in Custom):</p>
<span class="eq">ρ = ρ<sub>s</sub> / [(r/r<sub>s</sub>)(1 + r/r<sub>s</sub>)²], &nbsp; M(&lt;r) = M<sub>h</sub> m(r/r<sub>s</sub>)/m(r<sub>t</sub>/r<sub>s</sub>), &nbsp; m(x) = ln(1+x) − x/(1+x)</span>
<p>Bulge (Hernquist 1990) and disk (Miyamoto &amp; Nagai 1975):</p>
<span class="eq">Φ<sub>b</sub> = −GM<sub>b</sub>/(r + a<sub>b</sub>), &nbsp; Φ<sub>d</sub> = −GM<sub>d</sub> / √(R² + (a + √(z² + b²))²)</span>
<p>A Milky-Way-like galaxy has M<sub>h</sub> = 10¹² M<sub>☉</sub> (r<sub>s</sub> = 20 kpc, r<sub>t</sub> = 200 kpc), M<sub>b</sub> = 10¹⁰ M<sub>☉</sub> (a<sub>b</sub> = 0.6 kpc) and M<sub>d</sub> = 5 × 10¹⁰ M<sub>☉</sub> (a = 3 kpc, b = 0.3 kpc). Its rotation curve is flat near 210 km/s, like ours (see the chart in Readouts). Stars start in an exponential disk (R<sub>d</sub> = 2.8 kpc) on near-circular orbits at v<sub>c</sub>(R) from the potential, with a velocity dispersion falling with radius, the epicyclic ratio and an asymmetric-drift correction. The bulge gets isotropic velocities from the Jeans equation. Because test particles cannot make spiral arms, isolated disks carry a weak two-armed spiral potential (4% of the radial force, pitch 16°, corotation at 10 kpc, after Lin &amp; Shu 1964 and Cox &amp; Gómez 2002) so the gas has arms to crowd into. The M51 flyby switches it off: those arms come from the tide alone.</p>
<h4>Integrator</h4>
<p>Leapfrog, Δt = 0.5 Myr, on the GPU. Positions and velocities are 32-bit integers on a grid of 2⁻²¹ kpc (about 100 AU), so the scheme is time-reversible to the last bit (Levesque &amp; Verlet 1993):</p>
<span class="eq">x<sub>n+1</sub> − 2x<sub>n</sub> + x<sub>n−1</sub> = round[a(x<sub>n</sub>, t<sub>n</sub>) Δt²]</span>
<p>Reverse time swaps x<sub>n+1</sub> and x<sub>n</sub>, and the same rule marches every particle back. The galaxy centres are replayed from a recorded history, so even the friction, which is irreversible, cannot spoil it. Tested: after 1 Gyr forward and back, all ${NP_TXT} particles are exactly where they started. Forces are softened over 0.12 kpc so the cuspy centres stay well resolved by the step.</p>
<h4>Tides and friction</h4>
<p>A galaxy of mass M at distance r stretches a disk of size d with a tidal acceleration of about 2GMd/r³. In a fast pass at speed v and impact parameter b, a star is kicked by about Δv ≈ 2GMd/(b²v) relative to its own centre (Spitzer 1958). Stars on the near side that orbit the same way as the companion (a prograde pass) stay in step with the tide longest, and become the tails. The centres slow down by Chandrasekhar's dynamical friction, the drag of the wake raised in the other halo:</p>
<span class="eq">d<b>v</b>/dt = −4πG²Mρ lnΛ / v² · [erf(X) − (2X/√π) e<sup>−X²</sup>] <b>v̂</b>, &nbsp; X = v/(√2σ)</span>
<p>with lnΛ = 1.3 ln(1 + M<sub>host</sub>/M<sub>sat</sub>) (after Boylan-Kolchin et al. 2008) and ρ smoothed over the satellite's own scale radius. A smaller galaxy also loses the halo outside its Jacobi radius r<sub>J</sub> = r [M<sub>s</sub>(&lt;r<sub>J</sub>)/3M<sub>h</sub>(&lt;r)]<sup>1/3</sup> over about one orbit.</p>
<h4>Where tails come from</h4>
<p>The tidal acceleration grows with distance from a galaxy's centre (≈ 2GMR/r³), while the disk's own grip, v<sub>c</sub>²/R, weakens outward. So the tide wins first in the outer disk, beyond about two scale lengths, and wins most for stars on the side facing the companion (the bridge) and the side opposite (the tail). The tracer dye makes this visible. It is a label written into a spare bit of each particle's record, never read by the integrator, so dyeing costs nothing in accuracy. Dye a tail, reverse time, and its stars land back in the outer rim of their own disk.</p>
<h4>Timescales</h4>
<p>Crossing a 30 kpc galaxy at 300 km/s takes about 100 Myr. In this model the Antennae make their first pericentre at 13 kpc, swing out to 58 kpc and merge about 1 Gyr later. A satellite sinks by friction in t ≈ (1.17/lnΛ) r²v<sub>c</sub>/GM (Binney &amp; Tremaine 2008): for 10¹⁰ M<sub>☉</sub> at 50 kpc in a 220 km/s halo with lnΛ = 3 that is about 5 Gyr.</p>
<h4>Why stars almost never collide</h4>
<table class="gx-t">
<tr><td>Radius of the Sun</td><td>6.96 × 10⁸ m = 2.3 × 10⁻⁸ pc</td></tr>
<tr><td>Cross-section for contact, π(2R<sub>☉</sub>)²</td><td>6.4 × 10⁻¹⁵ pc²</td></tr>
<tr><td>Gravitational focusing at 300 km/s, 1 + (618 km/s ÷ v)²</td><td>× 5.2</td></tr>
<tr><td>Stars per pc² seen through a disk (≈ 100 M<sub>☉</sub>/pc², mean mass 0.5 M<sub>☉</sub>)</td><td>≈ 200</td></tr>
<tr><td>Chance that one star hits another crossing a whole disk</td><td>≈ 7 × 10⁻¹²</td></tr>
</table>
<p>Even for 10¹¹ stars that is fewer than one collision per passage. Gas is different: clouds are huge, so they do collide, shock and form stars.</p>
<h4>Star formation, gas and dust (the colours)</h4>
<p>Each galaxy's gas is binned on its own 64³ grid every frame. The star-formation rate follows a Schmidt law, ρ̇<sub>*</sub> ∝ ρ<sup>1.5</sup>, above a threshold density; it is boosted where gas is compressed above its 150 Myr running mean, and by a collision term ∝ n<sub>other</sub> × v<sub>rel</sub> where two galaxies' gas interpenetrates, in the spirit of Barnes (2004). Hα (pink) fades over 15 Myr and young-star blue over 60 Myr, as massive stars die. Dust follows the gas: each star is dimmed and reddened (A ∝ roughly 1/λ) by the part of the gas column in front of it, and young stars keep some birth-cloud dust of their own (Charlot &amp; Fall 2000). This is a visual model of star formation, not hydrodynamics.</p>
<h4>Dark matter contours</h4>
<p>The overlay (<kbd>D</kbd>) draws lines of equal projected halo density, every 0.25 dex from about 0.3 to 100 M<sub>☉</sub>/pc², using the closed-form projection of the NFW profile (Wright &amp; Brainerd 2000), summed over all halos. The <em>From the Sun</em> camera rides a test star 8.2 kpc from the Galactic centre on a circular orbit, integrated in the same potentials.</p>
<h4>What is scaled for the screen</h4>
<p>Each star particle stands for about ${SMALL ? '2.4 × 10⁶' : '6 × 10⁵'} M<sub>☉</sub>. Particles are drawn with a smoothing kernel that widens where stars are sparse, and the image is stretched with an asinh curve (Lupton et al. 2004) so faint tails and bright cores share one plate. The dwarf in Satellite shredding is drawn 9× brighter than its true mass-to-light ratio, or its stream would be invisible. Playback runs at 60–300 Myr per second, with an adaptive time-lapse while galaxies are far apart. Milkomeda uses the measured distance of 770 kpc, a radial approach of 110 km/s and a tangential 57 km/s (van der Marel et al. 2019), M31's disk orientation on the sky, M<sub>MW</sub> = 1.06 × 10¹² and M<sub>M31</sub> = 1.6 × 10¹² M<sub>☉</sub>; this model makes first passage at 4.2 Gyr (about 100 kpc apart) and merges at 6.4 Gyr. The real outcome is uncertain: with the Large Magellanic Cloud, M33 and the error on the tangential velocity, a merger within 10 Gyr is roughly a coin toss (Sawala et al. 2025).</p>
<span class="cite">Toomre, A. &amp; Toomre, J. (1972). Galactic bridges and tails. ApJ 178, 623.</span>
<span class="cite">Hernquist, L. (1990). An analytical model for spherical galaxies and bulges. ApJ 356, 359.</span>
<span class="cite">Barnes, J. E. &amp; Hernquist, L. (1992). Dynamics of interacting galaxies. ARA&amp;A 30, 705.</span>
<span class="cite">Cox, T. J. &amp; Loeb, A. (2008). The collision between the Milky Way and Andromeda. MNRAS 386, 461.</span>
<span class="cite">van der Marel, R. P. et al. (2019). First Gaia dynamics of the Andromeda system: DR2 proper motions, orbits, and rotation of M31 and M33. ApJ 872, 24.</span>
<span class="cite">Also: Miyamoto &amp; Nagai (1975) PASJ 27, 533 · Lin &amp; Shu (1964) ApJ 140, 646 · Cox &amp; Gómez (2002) ApJS 142, 261 · Spitzer (1958) ApJ 127, 17 · Binney &amp; Tremaine (2008) Galactic Dynamics, 2nd ed. · Navarro, Frenk &amp; White (1996) ApJ 462, 563 · Chandrasekhar (1943) ApJ 97, 255 · Levesque &amp; Verlet (1993) J. Stat. Phys. 72, 519 · Boylan-Kolchin, Ma &amp; Quataert (2008) MNRAS 383, 93 · Barnes (2004) MNRAS 350, 798 · Charlot &amp; Fall (2000) ApJ 539, 718 · Wright &amp; Brainerd (2000) ApJ 534, 34 · Lupton et al. (2004) PASP 116, 133 · Sawala et al. (2025) Nature Astronomy.</span>`;

const ch = Cosmos.chapter({ id: 'galaxies', notes: NOTES, science: SCIENCE });

/* =====================================================================================
   PHYSICS CORE (units: kpc, Myr, 10¹⁰ M☉)
   ===================================================================================== */
const G = 0.044985;          // kpc³ Myr⁻² (10¹⁰ M☉)⁻¹
const KMS = 977.792;          // km/s per kpc/Myr
const DT = 0.5;               // Myr per leapfrog step
const RAD = Math.PI / 180;
const SCALE = 2097152;        // integer units per kpc (2^21)
const EPS = 0.12;             // force softening, kpc
const MAXG = 4;
function mnfw(x) { return x < 0.02 ? x * x * (0.5 - x * (2 / 3 - 0.75 * x)) : Math.log1p(x) - x / (1 + x); }
function erf(x) { const t = 1 / (1 + 0.3275911 * x); return 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); }
const V3 = {
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};
function basisFromNormal(n, hint) {
  n = V3.norm(n); hint = hint || [1, 0, 0];
  let d = V3.dot(hint, n); let e1 = [hint[0] - d * n[0], hint[1] - d * n[1], hint[2] - d * n[2]];
  if (Math.hypot(e1[0], e1[1], e1[2]) < 1e-6) { hint = Math.abs(n[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0]; d = V3.dot(hint, n); e1 = [hint[0] - d * n[0], hint[1] - d * n[1], hint[2] - d * n[2]]; }

  return [e1[0], e1[1], e1[2], e2[0], e2[1], e2[2], n[0], n[1], n[2]];   // column-major, disk frame → world
}

class Galaxy {
  constructor(o) {
    Object.assign(this, {
      halo: 'nfw', Mh: 100, rs: 20, rt: 200, v0: 0.18, rc: 5, Mb: 1, ab: 0.6, Md: 5, ad: 3, bd: 0.3,
      Rd: 2.8, Rmax: 16, z0: 0.3, gRd: 4.5, gRmax: 24, gz0: 0.1, gasFrac: 0.3, sig0: 0.08, gsig: 0.007,
      spiral: 0.04, pitch: 16, name: 'Galaxy', sub: '', dsph: false, lumBoost: 1, share: null, clumps: 0.25,
    }, o);
    this.R = this.R || [1, 0, 0, 0, 1, 0, 0, 0, 1];
    this.pos = this.pos || [0, 0, 0]; this.vel = this.vel || [0, 0, 0];
    this.rt0 = this.rt; this.setup();
  }
  setup() {
    if (this.halo === 'nfw') { this.mc = mnfw(this.rt0 / this.rs); this.hx = G * this.Mh / this.mc; }
    else if (this.halo === 'log') this.hx = this.v0 * this.v0;
    else this.hx = 0;
    this.coreR = this.halo === 'nfw' ? 0.5 * this.rs : this.halo === 'log' ? this.rc : 2 * this.ab;
    this.rtMin = this.dsph ? 4 * this.ab : Math.max(2 * this.ad, 3 * this.ab);
    this.setRt(this.rt0);
  }
  setRt(rt) { this.rt = rt; this.Mhalo = this.haloEnc(rt); this.Mtot = this.Mhalo + this.Md + this.Mb; }
  haloEnc(r) {
    const x = Math.min(r, this.rt);
    if (this.halo === 'nfw') return this.Mh * mnfw(x / this.rs) / this.mc;
    if (this.halo === 'log') return this.v0 * this.v0 * x * x * x / (G * (x * x + this.rc * this.rc));
    return 0;
  }
  enc(r) { const s = this.ad + this.bd; return this.haloEnc(r) + this.Mb * r * r / ((r + this.ab) * (r + this.ab)) + this.Md * r * r * r / Math.pow(r * r + s * s, 1.5); }
  rhoHalo(r) {
    if (r > this.rt) return 0;
    if (this.halo === 'nfw') { const x = r / this.rs; return this.Mh / (4 * Math.PI * this.rs ** 3 * this.mc) / (x * (1 + x) * (1 + x)); }
    if (this.halo === 'log') { const r2 = r * r, c2 = this.rc * this.rc; return this.v0 * this.v0 * (3 * c2 + r2) / (4 * Math.PI * G * (r2 + c2) * (r2 + c2)); }
    return 0;
  }
  /** GPU halo uniform for a given truncation radius: vec4 + potential constant */
  haloU(rt) {
    if (this.halo === 'nfw') { const GM = G * this.Mh * mnfw(rt / this.rs) / this.mc; return [this.hx, this.rs, rt, GM, -GM / rt + this.hx * Math.log1p(rt / this.rs) / rt]; }
    if (this.halo === 'log') { const GM = this.hx * rt * rt * rt / (rt * rt + this.rc * this.rc); return [this.hx, -this.rc, rt, GM, 0]; }
    return [0, 0, 1, 0, 0];
  }
  accLocal(qx, qy, qz, out) {
    const r2 = qx * qx + qy * qy + qz * qz + EPS * EPS, r = Math.sqrt(r2), ir3 = 1 / (r2 * r);

    if (this.halo === 'nfw') f = r < this.rt ? this.hx * mnfw(r / this.rs) * ir3 : G * this.Mhalo * ir3;
    else if (this.halo === 'log') f = r < this.rt ? this.hx / (r2 + this.rc * this.rc) : G * this.Mhalo * ir3;
    const rb = r + this.ab; f += G * this.Mb / (r * rb * rb);
    const zeta = Math.sqrt(qz * qz + this.bd * this.bd), az = this.ad + zeta, dd = qx * qx + qy * qy + az * az;
    const k = G * this.Md / (dd * Math.sqrt(dd));
    out[0] = -f * qx - qx * k; out[1] = -f * qy - qy * k; out[2] = -f * qz - qz * k * az / zeta;

  }
  potLocal(qx, qy, qz) {
    const r = Math.sqrt(qx * qx + qy * qy + qz * qz + EPS * EPS); let p = 0;
    if (this.halo === 'nfw') { const u = this.haloU(this.rt); p = r < this.rt ? -this.hx * Math.log1p(r / this.rs) / r + u[4] : -G * this.Mhalo / r; }
    else if (this.halo === 'log') { const c2 = this.rc * this.rc; p = r < this.rt ? 0.5 * this.hx * Math.log((r * r + c2) / (this.rt * this.rt + c2)) - G * this.Mhalo / this.rt : -G * this.Mhalo / r; }

    const zeta = Math.sqrt(qz * qz + this.bd * this.bd), az = this.ad + zeta;

  // isotropic Jeans dispersion for the bulge in the (spherically averaged) total potential
  const nb = 220, rmin = 0.01 * g.ab, rmax = 60 * g.ab, lr = Math.log(rmax / rmin);
  const sig = new Float64Array(nb);
  const rho = (r) => 1 / (r * (r + g.ab) ** 3);
  const gr = (r) => { let s = 0; const dirs = [[1, 0, 0], [0.7071, 0, 0.7071], [0, 0, 1]]; for (const d of dirs) { g.accLocal(r * d[0], 0, r * d[2], a); s += -(a[0] * d[0] + a[2] * d[2]); } return s / 3; };
  let acc = 0;
  for (let i = nb - 1; i >= 0; i--) {
    const r = rmin * Math.exp(lr * i / (nb - 1));
    if (i < nb - 1) { const r1 = rmin * Math.exp(lr * (i + 1) / (nb - 1)); const rm = 0.5 * (r + r1); acc += rho(rm) * gr(rm) * (r1 - r); }
    sig[i] = Math.sqrt(Math.max(0, acc / rho(r)));
  }
  const sigAt = (r) => { const x = U.clamp(Math.log(Math.max(r, rmin) / rmin) / lr * (nb - 1), 0, nb - 1.001), i = Math.floor(x), f = x - i; return sig[i] * (1 - f) + sig[i + 1] * f; };
  return { vc: (R) => at(vc, R), kap: (R) => at(kap, R), nu: (R) => at(nu, R), sig: sigAt };
}

/** Build all particles. Order in the texture: all gas first (so the density grid can draw one range), then disk stars, then bulge stars. */
function buildParticles(gals, seed) {
  const rng = U.rng(seed), gauss = () => U.gauss(rng);
  const pos = new Int32Array(N * 4), del = new Int32Array(N * 4), aux = new Float32Array(N * 4);
  const ng = gals.length;
  // particle shares ∝ luminous mass (with optional overrides)
  let lumTot = 0; gals.forEach((g) => (lumTot += g.Md + g.Mb));
  const share = gals.map((g) => (g.share != null ? g.share : (g.Md + g.Mb) / lumTot));
  const sSum = share.reduce((a, b) => a + b, 0);
  const counts = gals.map((g, i) => {
    const n = Math.round(N * share[i] / sSum);
    const nb = g.dsph ? n : Math.round(n * g.Mb / (g.Md + g.Mb) * 0.9);
    const ngas = g.dsph ? 0 : Math.round((n - nb) * g.gasFrac);
    return { n, nb, ngas, nd: n - nb - ngas };
  });
  let diff = N - counts.reduce((a, c) => a + c.n, 0); counts[0].n += diff; counts[0].nd += diff;
  // mass per particle (for brightness), relative to a Milky-Way-like galaxy at REF_N particles
  gals.forEach((g, i) => { g.lumPer = ((g.Md + g.Mb) / Math.max(1, counts[i].n - counts[i].ngas)) / (6 / (REF_N * 0.45)); g.counts = counts[i]; });
  const tables = gals.map(tablesFor), sps = gals.map(spiralParams);
  gals.forEach((g, i) => { g.sp = sps[i]; });
  let idx = 0;
  const put = (gi, typ, q, u, glow, young) => {
    const g = gals[gi];
    const x = g.toWorld(q), v = g.toWorld(u);
    const a = g.accLocal(q[0], q[1], q[2], [0, 0, 0]), aw = g.toWorld(a);
    const o = idx * 4;
    for (let c = 0; c < 3; c++) {
      pos[o + c] = Math.round((g.pos[c] + x[c]) * SCALE);
      del[o + c] = Math.round(((g.vel[c] + v[c]) - 0.5 * aw[c] * DT) * DT * SCALE);
    }
    const rnd = Math.floor(rng() * 1024) & 1023;
    pos[o + 3] = gi | (typ << 2) | (rnd << 4) | (young ? 1 << 14 : 0);
    del[o + 3] = 0;
    if (typ === 2) { aux[o] = -1; aux[o + 1] = glow; aux[o + 2] = glow; aux[o + 3] = 0; }
    idx++;
  };
  const sampleDisk = (gi, typ) => {
    const g = gals[gi], T = tables[gi], sp = sps[gi];
    const gas = typ === 2;
    const Rd = gas ? g.gRd : g.Rd, Rmax = gas ? g.gRmax : g.Rmax, z0 = gas ? g.gz0 : g.z0;
    let R, phi, glow = 0, clump = null, young = false;
    if (gas && g.clumpList && rng() < g.clumps) {
      clump = g.clumpList[Math.floor(rng() * g.clumpList.length)];
      const cx = clump[0] + gauss() * clump[2], cy = clump[1] + gauss() * clump[2];
      R = Math.hypot(cx, cy); phi = Math.atan2(cy, cx); glow = 0.6 + 0.6 * rng();
    } else {
      do { R = -Rd * Math.log(rng() * rng() + 1e-12); } while (R > Rmax || R < 0.05 || (gas && rng() > 1 - Math.exp(-((R / (0.9 * g.ad)) ** 2))));
      // disk stars come in two populations: old (smooth, warm) and young (blue-white, crowded into the arms, commoner further out)
      if (!gas) young = rng() < 0.08 + 0.32 * U.smoothstep(0.4, 3.0, R / Rd);
      const amp = sp ? (gas ? 0.75 : young ? 0.9 : 0.12) : 0;
      for (let k = 0; k < 30; k++) { phi = rng() * 2 * Math.PI; if (!amp || rng() * (1 + amp) < 1 + amp * Math.cos(chiAt(sp, R, phi))) break; }
      if (gas && sp) glow = Math.pow(Math.max(0, Math.cos(chiAt(sp, R, phi))), 6) * 0.5 * Math.exp(-R / (2.5 * g.gRd));
    }
    let z = z0 * Math.atanh(U.clamp(2 * rng() - 1, -0.995, 0.995));
    const vc = T.vc(R), kap = T.kap(R), Om = Math.max(1e-4, vc / R), nu = T.nu(R);
    let sR, sP, sZ, vphi;
    if (gas) { sR = g.gsig; sP = g.gsig; sZ = Math.min(g.gsig, nu * z0); vphi = vc; }
    else {
      sR = g.sig0 * Math.exp(-R / (2 * Rd)); sP = sR * kap / (2 * Om); sZ = nu * z0 * 0.9;
      vphi = Math.sqrt(Math.max(0, vc * vc + sR * sR * (1 - kap * kap / (4 * Om * Om) - 2 * R / Rd)));
    }
    const uR = sR * gauss(), uP = vphi + sP * gauss(), uZ = sZ * gauss();
    const c = Math.cos(phi), s = Math.sin(phi);
    put(gi, typ, [R * c, R * s, young ? z * 0.45 : z], [uR * c - uP * s, uR * s + uP * c, young ? uZ * 0.45 : uZ], glow, young);
  };
  const sampleBulge = (gi) => {
    const g = gals[gi], T = tables[gi];
    let r; do { const u = Math.sqrt(rng()); r = g.ab * u / (1 - u); } while (r > (g.dsph ? 12 : 7) * g.ab);
    const ct = 2 * rng() - 1, st = Math.sqrt(1 - ct * ct), ph = 2 * Math.PI * rng();
    const q = [r * st * Math.cos(ph), r * st * Math.sin(ph), r * ct];
    const vesc = Math.sqrt(Math.max(0, -2 * g.potLocal(q[0], q[1], q[2])));
    const sg = T.sig(r);
    let u; do { u = [sg * gauss(), sg * gauss(), sg * gauss()]; } while (Math.hypot(u[0], u[1], u[2]) > 0.92 * vesc);
    put(gi, 1, q, u, 0);
  };
  // clumps of star-forming gas strung along the arms
  gals.forEach((g, gi) => {
    const sp = sps[gi]; g.clumpList = null;
    if (g.gasFrac <= 0 || g.dsph) return;
    const list = [];
    for (let k = 0; k < 140; k++) {
      let R; do { R = -g.gRd * Math.log(rng() * rng() + 1e-12); } while (R > g.gRmax * 0.8 || R < 1.2 * g.ad * 0.5);
      let phi = rng() * 2 * Math.PI;
      if (sp) { const chi0 = chiAt(sp, R, 0); phi = (-chi0 + 2 * Math.PI * Math.round(rng()) + gauss() * 0.35) / 2; }
      list.push([R * Math.cos(phi), R * Math.sin(phi), (0.18 + 0.25 * rng()) * Math.cbrt(g.Md / 5 + 0.01)]);
    }
    g.clumpList = list;
  });
  for (let gi = 0; gi < ng; gi++) for (let k = 0; k < counts[gi].ngas; k++) sampleDisk(gi, 2);
  const nGas = idx;
  for (let gi = 0; gi < ng; gi++) for (let k = 0; k < counts[gi].nd; k++) sampleDisk(gi, 0);
  for (let gi = 0; gi < ng; gi++) for (let k = 0; k < counts[gi].nb; k++) sampleBulge(gi);
  return { pos, del, aux, nGas };
}

const canvas = ch.canvas('gx-gl');
const gl = Cosmos.gl.context(canvas, { antialias: false });
if (!gl) { ch.fatal('This chapter needs WebGL2, which this browser does not provide. Try a recent Chrome, Edge, Firefox or Safari.'); return; }
const FULL = gl.ext.floatRT && !/[?&]lite\b/.test(location.search);                          // HDR, bloom, density grid and star formation
const FLOAT_BLEND = !!gl.getExtension('EXT_float_blend');
const PT_MAX = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1] || 64;

const GLSL_HEAD = `#version 300 es
precision highp float; precision highp int; precision highp isampler2D; precision highp sampler2D;
#define MAXG ${MAXG}
const float INV_S = ${(1 / SCALE).toExponential(10)};
const float EPS2 = ${(EPS * EPS).toFixed(6)};
`;
const GAL_GLSL = `
uniform int uNG;
uniform ivec3 uC[MAXG];
uniform mat3 uR[MAXG];
uniform vec4 uH[MAXG];
uniform float uHC[MAXG];
uniform vec4 uB[MAXG];
uniform vec4 uD[MAXG];
uniform vec4 uS[MAXG];
uniform vec4 uS2[MAXG];
float mnfw(float x){ return x < 0.02 ? x*x*(0.5 - x*(0.6666667 - 0.75*x)) : log(1.0 + x) - x/(1.0 + x); }
vec3 accGal(int g, vec3 r){
  vec4 H = uH[g];
  float r2 = dot(r, r) + EPS2;          // Plummer-softened radius keeps the cuspy centres harmonic for the 0.5 Myr step
  float rr = sqrt(r2);
  float ir3 = 1.0/(r2*rr);
  float f = 0.0;
  if (H.y > 0.0) f = rr < H.z ? H.x*mnfw(rr/H.y)*ir3 : H.w*ir3;
  else if (H.y < 0.0) f = rr < H.z ? H.x/(r2 + H.y*H.y) : H.w*ir3;
  vec4 B = uB[g];
  float rb = rr + B.y;
  f += B.x/(rr*rb*rb);
  vec3 acc = -f*r;
  vec4 D = uD[g];
  vec3 q = r*uR[g];
  float zeta = sqrt(q.z*q.z + D.z*D.z);
  float az = D.y + zeta;
  float dd = q.x*q.x + q.y*q.y + az*az;
  float k = D.x*inversesqrt(dd)/dd;
  vec3 gd = vec3(-q.x*k, -q.y*k, -q.z*k*az/zeta);
  vec4 S = uS[g];
  if (S.x != 0.0) {
    vec4 S2 = uS2[g];
    float R2 = q.x*q.x + q.y*q.y + 1.0e-4;
    float R = sqrt(R2);
    // χ = 2φ + m cot(p) ln(R/R0) − Ω-phase, using cos 2φ and sin 2φ directly (no atan)
    float c2 = (q.x*q.x - q.y*q.y)/R2, s2 = 2.0*q.x*q.y/R2;
    float psi = S.z*(0.5*log(R2) - S.w) - S.y;
    float cp_ = cos(psi), sp_ = sin(psi);
    float cc = c2*cp_ - s2*sp_, ss = s2*cp_ + c2*sp_;
    float fr = R2/(R2 + S2.x)*exp(-R*S2.y);
    float dfr = fr*(2.0*S2.x/(R*(R2 + S2.x)) - S2.y);
    float ez = exp(-2.0*abs(q.z)*S2.z);
    float th = sign(q.z)*(1.0 - ez)/(1.0 + ez);
    float hz = 1.0 - th*th;
    float dhz = -2.0*S2.z*hz*th;
    float dPdR = -S.x*hz*(dfr*cc - fr*ss*S.z/R);
    float dPdp = 2.0*S.x*hz*fr*ss/R;
    float dPdz = -S.x*fr*cc*dhz;
    float cp = q.x/R, sp = q.y/R;
    gd += vec3(-(dPdR*cp - dPdp*sp), -(dPdR*sp + dPdp*cp), -dPdz);
  }
  return acc + uR[g]*gd;
}
vec3 accAll(ivec3 p){
  vec3 a = vec3(0.0);
  for (int g = 0; g < MAXG; g++) { if (g >= uNG) break; a += accGal(g, vec3(p - uC[g])*INV_S); }
  return a;
}
float potGal(int g, vec3 r){
  vec4 H = uH[g];
  float rr = sqrt(dot(r, r) + EPS2);
  float ph = 0.0;
  if (H.y > 0.0) ph = rr < H.z ? -H.x*log(1.0 + rr/H.y)/rr + uHC[g] : -H.w/rr;
  else if (H.y < 0.0) { float c2 = H.y*H.y; ph = rr < H.z ? 0.5*H.x*log((rr*rr + c2)/(H.z*H.z + c2)) - H.w/H.z : -H.w/rr; }
  ph -= uB[g].x/(rr + uB[g].y);
  vec3 q = r*uR[g];
  float zeta = sqrt(q.z*q.z + uD[g].z*uD[g].z);
  float az = uD[g].y + zeta;
  return ph - uD[g].x*inversesqrt(q.x*q.x + q.y*q.y + az*az);
}
`;

// --- integer leapfrog step (Levesque–Verlet, bit-reversible) ---
const STEP_FS = GLSL_HEAD + GAL_GLSL + `
uniform highp isampler2D uPos, uDel;
uniform float uK;
layout(location = 0) out ivec4 oPos;
layout(location = 1) out ivec4 oDel;
void main(){
  ivec2 ij = ivec2(gl_FragCoord.xy);
  ivec4 p = texelFetch(uPos, ij, 0);
  ivec4 d = texelFetch(uDel, ij, 0);
  vec3 k = clamp(accAll(p.xyz)*uK, vec3(-1.0e8), vec3(1.0e8));
  ivec3 dn = d.xyz + ivec3(round(k));
  ivec3 pn = p.xyz + dn;
  if (any(greaterThan(abs(pn), ivec3(1900000000)))) { pn = p.xyz; dn = ivec3(0); }
  oPos = ivec4(pn, p.w);
  oDel = ivec4(dn, d.w);
}`;
const FLIP_FS = GLSL_HEAD + `
uniform highp isampler2D uPos, uDel;
layout(location = 0) out ivec4 oPos;
layout(location = 1) out ivec4 oDel;
void main(){
  ivec2 ij = ivec2(gl_FragCoord.xy);
  ivec4 p = texelFetch(uPos, ij, 0);
  ivec4 d = texelFetch(uDel, ij, 0);
  oPos = ivec4(p.xyz - d.xyz, p.w);
  oDel = ivec4(-d.xyz, d.w);
}`;

// --- tracer dye: sets or clears bit 15 of the particle's tag word; positions and displacements pass through untouched,
//     so dyeing never disturbs the orbits or the bit-exact reversibility ---
const TAG_FS = GLSL_HEAD + GAL_GLSL + `
uniform highp isampler2D uPos, uDel;
uniform int uMode, uGal;              // 0 brush (add), 1 tails (set), 2 wash out, 3 one galaxy (set)
uniform ivec3 uOrigin;
uniform mat4 uVP;
uniform vec3 uBrush;                  // NDC centre and radius (in NDC-y units)
uniform float uAspect;
uniform float uTail[MAXG];
layout(location = 0) out ivec4 oPos;
layout(location = 1) out ivec4 oDel;
void main(){
  ivec2 ij = ivec2(gl_FragCoord.xy);
  ivec4 p = texelFetch(uPos, ij, 0);
  ivec4 d = texelFetch(uDel, ij, 0);
  int w = p.w;
  const int TAG = 32768;
  if (uMode == 0) {
    vec4 c = uVP*vec4(vec3(p.xyz - uOrigin)*INV_S, 1.0);
    if (c.w > 0.05) { vec2 q = (c.xy/c.w - uBrush.xy)*vec2(uAspect, 1.0); if (dot(q, q) < uBrush.z*uBrush.z) w = w | TAG; }
  } else if (uMode == 1) {
    bool far = true;
    for (int g = 0; g < MAXG; g++) { if (g >= uNG) break; if (length(vec3(p.xyz - uC[g])*INV_S) < uTail[g]) far = false; }
    w = far ? (w | TAG) : (w & ~TAG);
  } else if (uMode == 3) {
    w = (p.w & 3) == uGal ? (w | TAG) : (w & ~TAG);
  } else w = w & ~TAG;
  oPos = ivec4(p.xyz, w);
  oDel = d;
}`;

// --- density grid: 64³ cells per galaxy, as 8×8 tiles of 64² in one quadrant of a 1024² atlas ---
const GRID_VS = GLSL_HEAD + `
uniform highp isampler2D uPos;
uniform int uW, uG;
uniform ivec3 uGC;
uniform float uInv;
void main(){
  ivec4 p = texelFetch(uPos, ivec2(gl_VertexID % uW, gl_VertexID / uW), 0);
  vec3 c = vec3(p.xyz - uGC)*INV_S*uInv + 32.0;
  ivec3 ic = ivec3(floor(c));
  gl_PointSize = 1.0;
  // each galaxy's grid holds only its own gas, so a particle can tell its own gas from a colliding galaxy's
  if ((p.w & 3) != uG || any(lessThan(ic, ivec3(0))) || any(greaterThan(ic, ivec3(63)))) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  vec2 px = vec2(float((uG & 1)*512 + (ic.z & 7)*64 + ic.x), float((uG >> 1)*512 + (ic.z >> 3)*64 + ic.y)) + 0.5;
  gl_Position = vec4(px/1024.0*2.0 - 1.0, 0.0, 1.0);
}`;
const GRID_FS = GLSL_HEAD + `out vec4 o; void main(){ o = vec4(1.0, 0.0, 0.0, 1.0); }`;
const GRID_SAMPLE = `
uniform sampler2D uGrid;
float gridAt(int g, vec3 c){
  c = clamp(c - 0.5, vec3(0.0), vec3(63.0));
  float z0 = floor(c.z); float fz = c.z - z0; int iz0 = int(z0); int iz1 = min(iz0 + 1, 63);
  vec2 xy = c.xy + 0.5;
  vec2 base = vec2(float((g & 1)*512), float((g >> 1)*512));
  vec2 t0 = base + vec2(float((iz0 & 7)*64), float((iz0 >> 3)*64)) + xy;
  vec2 t1 = base + vec2(float((iz1 & 7)*64), float((iz1 >> 3)*64)) + xy;
  return mix(texture(uGrid, t0*(1.0/1024.0)).r, texture(uGrid, t1*(1.0/1024.0)).r, fz);
}`;

// --- per-particle star-formation state: (running mean density, Hα, blue light, density) ---
const AUX_FS = GLSL_HEAD + GRID_SAMPLE + `
uniform highp isampler2D uPos;
uniform sampler2D uAux;
uniform int uNG;
uniform ivec3 uGC[MAXG];
uniform float uGInv[MAXG];
uniform float uNorm, uDtMyr, uRef, uShock;
out vec4 o;
void main(){
  ivec2 ij = ivec2(gl_FragCoord.xy);
  ivec4 p = texelFetch(uPos, ij, 0);
  vec4 A = texelFetch(uAux, ij, 0);
  if (((p.w >> 2) & 3) != 2) { o = vec4(0.0); return; }
  // own and foreign gas density from the per-galaxy grids
  int gal = p.w & 3;
  float nOwn = 0.0, nFor = 0.0;
  for (int g = 0; g < MAXG; g++) {
    if (g >= uNG) break;
    float inv = uGInv[g];
    vec3 c = vec3(p.xyz - uGC[g])*INV_S*inv + 32.0;
    if (any(lessThan(c, vec3(0.5))) || any(greaterThan(c, vec3(63.5)))) continue;
    float v = gridAt(g, c)*inv*inv*inv*uNorm;
    if (g == gal) nOwn = v; else nFor += v;
  }
  float n = nOwn + nFor;
  float nbar = A.x < 0.0 ? n : A.x;
  float dt = uDtMyr;
  nbar += (n - nbar)*(1.0 - exp(-dt/150.0));
  float x = n/uRef;
  float comp = n/max(nbar, 0.02*uRef);
  // Schmidt law above a threshold, boosted where the gas is being compressed ...
  float sfr = pow(x, 1.5)*smoothstep(0.75, 1.4, x)*(1.0 + 3.0*smoothstep(1.2, 2.6, comp));

  sfr += uShock*(nFor/uRef)*smoothstep(0.1, 0.6, nOwn/uRef);
  sfr = min(sfr, 40.0);
  float ha = A.y + (sfr - A.y)*(1.0 - exp(-dt/15.0));
  float bl = A.z + (sfr - A.z)*(1.0 - exp(-dt/60.0));

// --- diagnostics per particle, then summed on the GPU ---
const FLAG_FS = GLSL_HEAD + GAL_GLSL + `
uniform highp isampler2D uPos, uDel;
uniform sampler2D uAux;
uniform float uTail[MAXG];
uniform vec3 uVcom;
uniform float uInvDt;

    if (length(r) < uTail[g]) far = false;

const REDUCE_FS = GLSL_HEAD + `
uniform sampler2D uSrc;
uniform int uK;

const PART_COMMON = `
uniform highp isampler2D uPos;

    const f = progs.final; gl.useProgram(f);
    bindTex(0, scene.tex, f, 'uScene'); bindTex(1, blooms[0].tex, f, 'uBloom');
    setF(f, 'uExpo', expo.value); setF(f, 'uBloomK', bloomS.value); setF(f, 'uTime', now * 0.001); setF(f, 'uBeta', GRADE.beta); setF(f, 'uVib', GRADE.vib);
    gl.uniform4f(U_(f, 'uG'), GRADE.lmax, GRADE.b0, GRADE.b1, GRADE.bk);
    gl.uniform2f(U_(f, 'uRes'), canvas.width, canvas.height);
    let nDM = 0;
    if (dmTog.value) sim.gals.forEach((g, i) => {
      if (g.halo === 'none' || nDM >= MAXG) return;
      const q = project(galPos(i)); if (!q) return;
      const dpr = canvas.width / (canvas.clientWidth || 1);
      const ppk = cam.focal / q[2];
      dmU.a.set([q[0] * dpr, canvas.height - q[1] * dpr, ppk, g.halo === 'nfw' ? g.rs : g.rc], nDM * 4);
      const amp = 1e4 * (g.halo === 'nfw' ? g.Mh / (4 * Math.PI * g.rs * g.rs * g.mc) : g.v0 * g.v0 / (2 * G) / Math.PI);   // ρ_s r_s in M☉/pc²
      dmU.b.set([g.halo === 'nfw' ? sim.hist.RT[U.clamp(sim.n, 0, sim.hist.n - 1) * sim.hist.ng + i] : 0, amp, 0, 0], nDM * 4); nDM++;
    });
    setI(f, 'uDMn', nDM);
    if (nDM) { gl.uniform4fv(U_(f, 'uDM'), dmU.a); gl.uniform4fv(U_(f, 'uDM2'), dmU.b); gl.uniform3f(U_(f, 'uDMcol'), 0.70, 0.78, 1.0); }
    fsTri();
  } else {
    // no float render targets: a simple tone curve straight from the 8-bit scene
    Cosmos.gl.screen(gl);
    const f = progs.lite; gl.useProgram(f);
    bindTex(0, scene.tex, f, 'uScene'); setF(f, 'uExpo', expo.value * 1.5);
    fsTri();
  }
}

let lastNow = performance.now();
ch.loop((dt, t, frame) => {
  const now = performance.now();
  const dtReal = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  // ---- advance the simulation ----
  let steps = 0;
  while (dyeQueue.length) { const d = dyeQueue.shift(); if (dyeQueue.length > 8) continue; dyePass(d[0], d[1], d[2], d[3], d[4]); }
  if (sim.seekN != null) { steps = seekTick(); sim.acc = 0; }
  else if (!ch.paused) {
    tourTick(dt);
    let rate = speedSlider.value;
    if (timelapseToggle.value && sim.gals.length > 1) rate *= U.clamp(sepNow() / 90, 1, 9);
    sim.acc += rate * dt / DT;
    // adaptive budget: when frames run long, the simulation slows down instead of spiralling
    sim.ft = sim.ft ? sim.ft * 0.9 + dtReal * 0.1 : dtReal;       // smoothed frame time
    if (sim.ft > 1 / 28) sim.budget = Math.max(2, sim.budget - 2); else if (sim.ft < 1 / 42) sim.budget = Math.min(48, sim.budget + 1);
    steps = Math.min(Math.floor(sim.acc), sim.budget);
    sim.acc -= steps; if (sim.acc > 2) sim.acc = sim.acc % 1;
    gl.disable(gl.BLEND);
    for (let k = 0; k < steps; k++) {
      if (sim.reversed && sim.n <= 0) {
        if (tour.on && TOUR[tour.stage] === 'reverse') {
          // the tour rests at t = 0 (still reversed) until it moves on; flipping here would make it re-reverse every frame
          if (!tour.atZero) { tour.atZero = true; ch.toast('Back at t = 0. Every star is exactly where it started, to the last bit.' + (sim.dyed ? ' The teal ones sat in the outer disks.' : ''), 4800); }
          break;
        }
        setReversed(false);
        const msg = 'Back at t = 0. Every star is exactly where it started, to the last bit.' + (sim.dyed ? ' The teal ones sat in the outer disks.' : '');
        if (!tour.on) { ch.setPaused(true); ch.toast(msg, 5200); } else ch.toast(msg, 4800);
        break;
      }
      runStep();
    }
  }
  if (sim.gals.length > 1 && !sim.reversed) { const s = sepNow(); if (s < (sim.minSep ?? 1e9)) sim.minSep = s; else if (sim.periT == null && sim.minSep < 40 && s > sim.minSep + 3) sim.periT = sim.n * DT; }
  if (sim.reversed && sim.periT != null && sim.n * DT < sim.periT) { sim.periT = null; sim.minSep = 1e9; }
  if (FULL && (steps > 0 || frame < 3)) { updateGrid(); updateAux(Math.max(steps, frame < 3 ? 1 : 0) * DT); }
  if (FULL) { pollStats(); if (++statTick % 10 === 0) requestStats(); }
  render(now, dtReal);
  updateLabels();
  drawTracks();
  audioTick(dtReal);
  // ---- readouts ----
  frames++; fpsAcc += dtReal;
  if (now - lastHud > 200) {
    fps = frames / Math.max(1e-3, fpsAcc); frames = 0; fpsAcc = 0; lastHud = now;
    const tM = sim.n * DT, s = sim.gals.length > 1 ? sepNow() : 0, v = sim.gals.length > 1 ? relvNow() * KMS : 0;
    const tStr = fmtT(tM);
    hudT.set(tStr + (sim.reversed ? '  ◂◂' : '')); ro.t.set(tStr);
    hudS.set(s.toFixed(1) + ' kpc'); ro.sep.set(s.toFixed(1) + ' kpc');
    hudV.set(Math.round(v) + ' km/s'); ro.v.set(Math.round(v) + ' km/s');
    ro.n.set(N.toLocaleString('en-US'));
    const tail = FMT.pct(sim.stats.tail, 1), unb = FMT.pct(sim.stats.unbound, 1);
    hudTail.set(tail + ' · unbound ' + unb); ro.tail.set(tail); ro.unb.set(unb);
    ro.sfr.set(sim.sfr0 ? (sim.stats.sfr / sim.sfr0).toFixed(1) + '× start' : '…');
    const h = sim.hist, n = U.clamp(sim.n, 0, h.n - 1);
    ro.rt.set(sim.gals.length > 1 ? Math.round(h.RT[n * h.ng + 1]) + ' kpc' : '—');
    drawHistory();
  }
}, { always: true });

Cosmos.debug.state = () => ({
  preset: sim.preset.id, tMyr: sim.n * DT, step: sim.n, reversed: sim.reversed,
  sepKpc: +sepNow().toFixed(2), relKms: +(relvNow() * KMS).toFixed(1), particles: N, gas: sim.nGas,
  tailFrac: +sim.stats.tail.toFixed(4), unboundFrac: +sim.stats.unbound.toFixed(4), sfrRel: sim.sfr0 ? +(sim.stats.sfr / sim.sfr0).toFixed(3) : null,
  fps: Math.round(fps), full: FULL, tour: tour.on, halo2rt: sim.gals[1] ? +sim.hist.RT[U.clamp(sim.n, 0, sim.hist.n - 1) * sim.hist.ng + 1].toFixed(1) : null, dyed: !!sim.dyed, seek: sim.seekN,
});
Cosmos.debug.sim = sim;
Cosmos.debug.auxStats = () => {
  if (!FULL) return null;
  const buf = new Float32Array(W * W * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, auxPP.read.fbo); gl.readPixels(0, 0, W, W, gl.RGBA, gl.FLOAT, buf); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const pick = (k) => { const a = []; for (let i = 0; i < sim.nGas; i += 7) a.push(buf[i * 4 + k]); a.sort((x, y) => x - y); return [0.1, 0.5, 0.9, 0.99, 1].map((q) => +a[Math.min(a.length - 1, Math.floor(q * a.length))].toFixed(3)); };
  return { nbar: pick(0), ha: pick(1), blue: pick(2), n: pick(3) };
};
Cosmos.debug.sceneStats = () => {
  const w = scene.w, h = scene.h, buf = new Float32Array(w * h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo); gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, buf); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  let nan = 0, inf = 0, neg = 0, mx = 0, big = 0;
  for (let i = 0; i < buf.length; i += 4) for (let k = 0; k < 3; k++) { const v = buf[i + k]; if (v !== v) nan++; else if (!isFinite(v)) inf++; else { if (v < 0) neg++; if (v > mx) mx = v; if (v > 1000) big++; } }
  return { w, h, nan, inf, neg, max: mx, big };
};
/** jump to a preset at time tMyr with a fixed camera, paused (for QA screenshots) */
Cosmos.debug.look = (id, tMyr, view, opts = {}) => {
  stopTour();
  const p = PRESETS.find((x) => x.id === id) || CUSTOM;
  loadPreset(p);
  gl.disable(gl.BLEND);
  const n = Math.round((tMyr || 0) / DT);
  for (let k = 0; k < n; k++) { runStep(); if (k % 8 === 7) { updateGrid(); updateAux(8 * DT); } }
  for (let k = 0; k < 3; k++) { updateGrid(); updateAux(1); }
  if (view) { camSel.set('free', true); orbit.theta = view.theta; orbit.phi = view.phi; orbit.dist = view.dist; orbit.setDist(view.dist); if (view.target) cam.fixed = view.target; }
  if (opts.play) ch.setPaused(false); else ch.setPaused(true);
  return Cosmos.debug.state();
};
Cosmos.debug.layers = LAYERS;
Cosmos.debug.dustStats = () => {
  if (!dustT) return null;
  const w = dustT.w, h = dustT.h, buf = new Float32Array(w * h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dustT.fbo); gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, buf); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  let mx = 0, sum = 0, nz = 0, zmin = 1e9, zmax = -1e9;
  for (let i = 0; i < buf.length; i += 4) { const v = buf[i]; if (v > mx) mx = v; sum += v; if (v > 1e-3) { nz++; const z = buf[i + 1] / v; zmin = Math.min(zmin, z); zmax = Math.max(zmax, z); } }
  return { w, h, max: mx, mean: sum / (w * h), nonzero: nz, zmin, zmax, kappa: DUST_KAPPA };
};
Cosmos.debug.dustCut = (x, y0, y1) => {
  const n = y1 - y0, buf = new Float32Array(n * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dustT.fbo); gl.readPixels(x, y0, 1, n, gl.RGBA, gl.FLOAT, buf); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const out = []; for (let i = 0; i < n; i += 2) out.push([y0 + i, +buf[i * 4].toFixed(0), +(buf[i * 4 + 1] / Math.max(buf[i * 4], 1e-6)).toFixed(3)]);
  return out;
};
/** run n steps forward, reverse, run back to t = 0 and compare every particle with the initial state */
Cosmos.debug.reversibility = (id, n) => {
  stopTour();
  loadPreset(PRESETS.find((x) => x.id === id) || PRESETS[0]);
  const read = () => { const a = new Int32Array(N * 4), b = new Int32Array(N * 4); const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, PS[cur].pos, 0); gl.readPixels(0, 0, W, W, gl.RGBA_INTEGER, gl.INT, a);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, PS[cur].del, 0); gl.readPixels(0, 0, W, W, gl.RGBA_INTEGER, gl.INT, b);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(f); return [a, b]; };
  const [p0, d0] = read();
  gl.disable(gl.BLEND);
  for (let k = 0; k < n; k++) runStep();
  const [pm] = read();
  setReversed(true);
  let guard = 0; while (sim.n > 0 && guard++ < n + 5) runStep();
  const [p1] = read();            // reversed state at m = 0 holds X_0 exactly if the scheme is reversible
  let badP = 0, badParticles = 0, maxDev = 0, moved = 0, worst = -1;
  for (let i = 0; i < N; i++) {
    let bad = false;
    for (let c = 0; c < 3; c++) { const e = Math.abs(p1[i * 4 + c] - p0[i * 4 + c]); if (e) { badP++; bad = true; if (e > maxDev) { maxDev = e; worst = i; } } }
    if (bad) badParticles++;
    moved = Math.max(moved, Math.hypot(pm[i * 4] - p0[i * 4], pm[i * 4 + 1] - p0[i * 4 + 1], pm[i * 4 + 2] - p0[i * 4 + 2]) / SCALE);
  }
  const info = worst >= 0 ? { worst, type: (p0[worst * 4 + 3] >> 2) & 3, gal: p0[worst * 4 + 3] & 3, start: [0, 1, 2].map((c) => +(p0[worst * 4 + c] / SCALE).toFixed(2)), mid: [0, 1, 2].map((c) => +(pm[worst * 4 + c] / SCALE).toFixed(2)) } : null;
  setReversed(false);
  ch.setPaused(true);
  return { steps: n, tMyr: n * DT, particles: N, particlesNotRestored: badParticles, maxDevKpc: maxDev / SCALE, maxDisplacementKpc: +moved.toFixed(1), worst: info };
};
Cosmos.debug.seek = (tMyr) => seekTo(tMyr / DT); Cosmos.debug.dye = (mode, gal) => dyeQueue.push([mode, 0, 0, 0, gal || 0]);
Cosmos.debug.CART = CART; Cosmos.debug.SAT = SAT;
Cosmos.debug.camInfo = () => ({ target: cam.target.map((x) => +x.toFixed(1)), dist: +orbit.dist.toFixed(1), g: sim.gals.map((g, i) => galPos(i).map((x) => +x.toFixed(1))), mode: cam.mode, fixed: cam.fixed || null });
Cosmos.debug.bench = (k = 200) => {
  const pi = new Int32Array(4), pu = new Uint8Array(4);
  const sync = () => { gl.bindFramebuffer(gl.FRAMEBUFFER, PS[cur].fbo); gl.readBuffer(gl.COLOR_ATTACHMENT0); gl.readPixels(0, 0, 1, 1, gl.RGBA_INTEGER, gl.INT, pi); gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pu); };
  gl.disable(gl.BLEND); sync(); let a = performance.now(); for (let i = 0; i < k; i++) runStep(); sync(); const step = (performance.now() - a) / k;
  a = performance.now(); for (let i = 0; i < 20; i++) render(performance.now(), 0.016); sync(); const rend = (performance.now() - a) / 20;
  a = performance.now(); for (let i = 0; i < 20; i++) { updateGrid(); updateAux(1); } sync(); const aux = (performance.now() - a) / 20;
  return { stepMs: +step.toFixed(3), renderMs: +rend.toFixed(2), gridAuxMs: +aux.toFixed(2) };
};
/** CPU-only orbit timeline of a preset's galaxy centres: pericentres, apocentres, merger time */
Cosmos.debug.orbitEvents = (id, tMax = 8000) => {
  const p = PRESETS.find((x) => x.id === id); Phys.lnL = dfSlider.value; Phys.strip = stripToggle.value;
  const gals = p.build(); const H = new History(gals); const ev = []; let prev = 1e9, dec = false, merged = null;
  for (let n = 0; n * DT < tMax; n++) { H.ensure(n); const sp = H.sep(n); if (sp > prev && dec) ev.push('peri ' + Math.round((n - 1) * DT) + ' Myr @ ' + prev.toFixed(1) + ' kpc'); if (!dec && sp < prev && n > 1) ev.push('apo ' + Math.round((n - 1) * DT) + ' @ ' + prev.toFixed(0)); dec = sp < prev; prev = sp; if (sp < 3 && merged == null) merged = n * DT; if (ev.length > 7) break; }
  return { events: ev, sepBelow3kpc: merged, start: H.sep(0).toFixed(1) };
};
Cosmos.debug.tour = tour; Cosmos.debug.tourLoad = (id) => { tour.stage = TOUR.indexOf(id); tourLoad(id); };
Cosmos.debug.setKappa = (k) => { DUST_KAPPA = k; };
Cosmos.debug.grade = GRADE; Cosmos.debug.lookK = LOOK;
Cosmos.debug.setSpiral = (v) => { sim.spiralOn = v; packStatic(); };
Cosmos.debug.profile = () => {
  const px = new Uint8Array(4), pf = new Float32Array(4);
  const sync = () => { gl.bindFramebuffer(gl.FRAMEBUFFER, red2.fbo); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, pf); gl.bindFramebuffer(gl.FRAMEBUFFER, null); };
  const t = (fn, k = 1) => { sync(); const a = performance.now(); for (let i = 0; i < k; i++) fn(); sync(); return +((performance.now() - a) / k).toFixed(2); };
  const nSave = sim.n, rev = sim.reversed;
  const out = {
    step: t(() => { gl.disable(gl.BLEND); runStep(); }, 10),
    grid: t(updateGrid, 5), aux: t(() => updateAux(0), 5),
    render: t(() => render(performance.now(), 0.016), 5),
  };
  out.nAfter = sim.n; out.nBefore = nSave; out.rev = rev;
  return out;
};

ch.onResize(() => { drawRotationCurve(); drawHistory(); });
updVHint();
loadPreset(PRESETS[0]);
})();
</script>
