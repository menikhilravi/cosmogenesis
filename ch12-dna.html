<style>
  /* ---- chapter 12: the code of life ---- */
  #dna-lbl-cv { pointer-events: none; }
  .dna-cap {
    position: fixed; z-index: 15; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 8px);
    left: var(--cap-x, 50%); transform: translateX(-50%);
    width: min(560px, calc(100vw - 2 * var(--gutter) - 460px)); min-width: 300px;
    display: grid; gap: 5px; justify-items: center; text-align: center; pointer-events: none;
    transition: opacity .5s var(--ease), left .6s var(--ease);
  }
  .dna-cap::before { content: ""; position: absolute; inset: -14px -40px -18px; z-index: -1; background: radial-gradient(closest-side, rgba(5,6,12,.62), rgba(5,6,12,0)); pointer-events: none; }
  .dna-steps { display: flex; gap: 6px; align-items: center; font: 600 9.5px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
  .dna-steps span { display: inline-flex; align-items: center; gap: 6px; transition: color .4s; }
  .dna-steps span + span::before { content: ""; width: 18px; height: 1px; background: var(--line-strong); }
  .dna-steps span.on { color: var(--era); }
  .dna-steps span.done { color: var(--dust); }
  .dna-cap-line { font: italic 500 19px/1.25 var(--f-display); color: var(--star); text-shadow: 0 1px 14px rgba(0,0,0,.9); min-height: 1.25em; text-wrap: balance; transition: opacity .35s; }
  .dna-cap-sub { font: 500 11px/1.4 var(--f-mono); color: var(--dust); text-shadow: 0 1px 10px rgba(0,0,0,.95); min-height: 1.4em; }
  .dna-prog { width: 180px; height: 1px; background: var(--line-strong); position: relative; overflow: hidden; }
  .dna-prog i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); background: var(--era); box-shadow: 0 0 8px var(--era); }
  body.cz-cinema .dna-cap { opacity: 0; }

  .dna-gene { font: 500 11.5px/1.75 var(--f-mono); color: var(--dust); word-break: break-word; max-height: 168px; overflow: auto; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-s); background: rgba(255,255,255,.02); scrollbar-width: thin; }
  .dna-gene .c { display: inline-block; padding: 0 2px; margin-right: 3px; border-radius: 3px; transition: background .25s, color .25s; cursor: default; }
  .dna-gene .c.start { color: #7de3a0; }
  .dna-gene .c.stop { color: #ff8a8a; }
  .dna-gene .c.rare { color: #c9a0ff; }
  .dna-gene .c.on { background: var(--era); color: var(--era-ink); }
  .dna-gene .end { color: var(--faint); }
  .dna-map { font: 500 11px/1.55 var(--f-mono); color: var(--dust); }
  .dna-map b { color: var(--star); font-weight: 600; }
  .dna-map .skip { color: var(--warn); }
  .dna-fact { font-size: 12px; line-height: 1.5; color: var(--dust); border-left: 2px solid var(--era); padding: 2px 0 2px 10px; }
  .dna-fact b { color: var(--star); font: 600 12px/1 var(--f-mono); }
  .dna-fx { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-s); background: rgba(255,255,255,.02); }
  .dna-fx b { font: italic 500 17px/1.2 var(--f-display); color: var(--star); letter-spacing: .01em; word-break: break-all; }
  .dna-fx b sub { font: 500 10px/1 var(--f-mono); color: var(--dust); vertical-align: -2px; margin-left: 1px; }
  .dna-fx span { font: 500 10.5px/1.3 var(--f-mono); color: var(--dust); }
  .dna-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 500 10.5px/1.3 var(--f-mono); color: var(--dust); }
  .dna-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .dna-tip { position: fixed; z-index: 35; pointer-events: none; padding: 6px 9px; border-radius: 6px; background: var(--panel-solid); border: 1px solid var(--line-strong); font: 500 11px/1.4 var(--f-mono); color: var(--star); opacity: 0; transition: opacity .15s; white-space: nowrap; }
  .dna-tip.on { opacity: 1; }
  @media (max-width: 760px) {
    .dna-cap { top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 74px); width: calc(100vw - 24px); min-width: 0; left: 50%; }
    .dna-cap-line { font-size: 16px; }
    .dna-cap-sub { font-size: 10px; }
    .dna-steps { font-size: 8.5px; letter-spacing: .12em; gap: 4px; }
    .dna-steps span + span::before { width: 8px; }
  }
</style>

  const DSE = 'GTGTGTTGGTTTTTTG', DOWN = 'GCGC';
  const POLYA = 24; // drawn poly(A) length (real tails are ~200–250 nt)

  function build(text) {

    const up = raw.toUpperCase();
    const residues = []; const skipped = [];

      const ch = up[i];
      if (AA[ch]) residues.push(ch);

      { name: 'TSS +1', a: tss, b: tss + 1 },
      { name: 'Kozak', a: cdsStart - 6, b: cdsStart },
      { name: 'start', a: cdsStart, b: cdsStart + 3 },
      { name: 'stop', a: cdsEnd - 3, b: cdsEnd },

      }

const NOTES = `
<p>Twenty letters of the alphabet are also the one-letter codes of amino acids, the beads that proteins are strung from. So a name is already a small protein. <strong>NIKHIL</strong> reads asparagine, isoleucine, lysine, histidine, isoleucine, leucine.</p>
<p>Here we write that protein back into DNA, codon by codon, using the codons human cells use most. Then the cell machinery reads it forwards. RNA polymerase opens a bubble in the double helix and copies one strand into messenger RNA. The mRNA gets a cap and a tail, and a ribosome reads it three letters at a time while transfer RNAs deliver each amino acid.</p>
<p>At the end the chain folds. Oily residues hide from water, opposite charges pull together, and the thread crumples into a compact shape as the temperature falls. Then each bead resolves into its atoms: carbon, nitrogen, oxygen and sulfur, the actual molecule your name spells. Water molecules gather on its nitrogens and oxygens and shy away from its oily carbons. Real proteins fold in microseconds to seconds. This one is a small physics simulation running live in your browser.</p>
<h4>Try this</h4>
<ul>
<li>Type your own name, or a friend's. B, J, X and Z are skipped, because no amino acid uses them.</li>
<li>Put a <strong>U</strong> or an <strong>O</strong> in a name to summon selenocysteine or pyrrolysine, the rare 21st and 22nd amino acids.</li>
<li>Load <strong>Insulin</strong> and watch the cell cut one chain into two, stapled by three disulfide bonds.</li>
<li>Press <strong>Melt &amp; refold</strong> (or <kbd>G</kbd>) to heat the chain to 430 K and watch it find a compact shape again. The contact map in the deck lights up as contacts return.</li>
</ul>`;

<h4>The central dogma</h4>
<p>Genetic information flows from DNA to RNA to protein, and never from protein back into nucleic acid. Crick stated it in 1958 and restated it in 1970. Every step on screen follows that arrow.</p>
<h4>The genetic code</h4>
<p>Three bases make a codon, so there are 4³ = 64 codons. In the standard code 61 of them name the 20 amino acids and three (UAA, UAG, UGA) mean stop. Nirenberg and Matthaei cracked the first word in 1961: poly-U RNA made polyphenylalanine, so UUU means Phe. Two amino acids are added by recoding. UGA becomes selenocysteine (Sec, U) when a SECIS hairpin sits in the 3′ UTR; humans have 25 selenoprotein genes. UAG becomes pyrrolysine (Pyl, O) in some methanogenic archaea and bacteria such as <em>Methanosarcina</em>. A human cell would stop at it.</p>
<h4>Codon usage</h4>
<p>Most amino acids have several codons, and cells do not use them equally. We back-translate with the most frequent human codon for each residue, from the Kazusa table (per thousand codons in human genes): Leu CUG 39.6, Glu GAG 39.6, Lys AAG 31.9, Ala GCC 27.7, Arg AGA 12.2. The outer ring of the code wheel plots all 64 frequencies. Real genes are not written this way, and most contain introns; this is what biotechnologists call a codon-optimised gene. The start codon AUG (Met) sits in the Kozak context GCCACCAUG, with the purine at −3 that matters most; the ideal G at +4 depends on the first letter of the name. The gene ends with UAA. We avoid UGA as the stop so it can stay free for Sec.</p>
<h4>B-DNA geometry</h4>
<span class="eq">twist = 360° / 10.5 = 34.3° per bp &nbsp;·&nbsp; rise = 3.38 Å &nbsp;·&nbsp; pitch ≈ 35.5 Å</span>
<p>The helix is right-handed, about 20 Å across, with phosphorus atoms 8.9 Å from the axis. The two sugar–phosphate backbones sit 144° apart around the axis, which opens a major groove about 22 Å wide and a minor groove about 12 Å wide. A pairs with T through two hydrogen bonds and G with C through three; toggle <em>hydrogen bonds</em> to see them. Purines (A, G) are drawn longer than pyrimidines (C, T), so every pair has the same width.</p>
<h4>Transcription</h4>
<p>RNA polymerase II binds at a promoter (here a TATA box 30 to 25 bp upstream of the start site), melts a bubble of about 12 to 14 bp and reads the template strand 3′→5′, building RNA 5′→3′ with U in place of T. About 8 to 9 bases of new RNA stay paired with the template before the strand peels away. It moves at roughly 1 to 4 kb per minute. The 5′ end receives a 7-methylguanosine cap, and the 3′ end is cut 10 to 30 nt past an AAUAAA signal and given a poly(A) tail, about 200 to 250 A long in mammals. We draw 24.</p>
<h4>Translation</h4>
<p>The small subunit binds the cap, scans to the first AUG and the large subunit joins. Aminoacyl-tRNAs enter the A site, the peptide is handed to them in the P site, and spent tRNAs leave from the E site. Eukaryotic ribosomes add about 5 amino acids per second and bacterial ones up to about 20. At UAA the release factor eRF1 enters instead of a tRNA and the chain is freed. With sound on, each residue plays a note as it joins the chain, low for oily residues and high for charged ones, and the whole melody plays again when the atoms appear.</p>
<h4>Folding</h4>
<p>Anfinsen showed that ribonuclease refolds on its own, so the sequence carries the structure. Levinthal noted that a 100-residue chain with 3 states per residue has 3¹⁰⁰ ≈ 5 × 10⁴⁷ conformations; trying 10¹³ per second would take about 10²⁷ years. Real chains fold in microseconds to seconds because the energy landscape is funnel-shaped.</p>
<h4>The model used here</h4>
<p>One bead per residue (mass 110 Da), with Langevin dynamics:</p>
<span class="eq">E = Σ k<sub>b</sub>(r − 3.8 Å)² + Σ k<sub>θ</sub>(θ − 105°)² − Σ ε<sub>H</sub>w<sup>2</sup><sub>H</sub>(φ) − Σ ε<sub>E</sub>w<sup>2</sup><sub>E</sub>(φ)</span>
<span class="eq">+ Σ<sub>|i−j|≥3</sub> [ U<sub>WCA</sub>(r) − ε<sub>ij</sub> e<sup>−(r − 6.2)²/2σ²</sup> + 332 q<sub>i</sub>q<sub>j</sub> e<sup>−r/λ<sub>D</sub></sup> / (ε<sub>r</sub> r) ]</span>
<p>Here k<sub>b</sub> = 40 kcal mol⁻¹ Å⁻² and k<sub>θ</sub> = 10 kcal mol⁻¹ rad⁻² (half for Gly, 1.6× for Pro). The torsion wells w(φ) = (1 + cos(φ − φ₀))/2 sit at 50° (helix) and −170° (strand), with depths from the Pace–Scholtz helix scale and Chou–Fasman β propensities. Contact strength is ε<sub>ij</sub> = 0.07 + 0.77 h<sub>i</sub>h<sub>j</sub> kcal/mol, with h = (KD + 4.5)/9 from the Kyte–Doolittle hydropathy, σ = 1.3 Å. Sec and Pyl are not in that scale, so Sec borrows the value for Cys (2.5) and Pyl the value for Trp (−0.9); Pyl carries no charge because its ε-amine is acylated. The WCA wall has σ = 4.2 Å. The Debye length is λ<sub>D</sub> = 7.85 Å (150 mM salt), ε<sub>r</sub> = 80 and pH 7.4 partial charges. Cysteines that meet within 6.5 Å lock into disulfides at 5.6 Å. The integrator is BAOAB with dt = 30 fs and γ = 1 ps⁻¹, and the temperature is annealed from 420 K to the slider value. In this model a long chain melts near 340 K.</p>
<h4>Every atom</h4>
<p>Once the chain has cooled, each bead is dressed in its heavy atoms. Ideal trans peptide planes (N–Cα 1.46 Å, Cα–C 1.53 Å, C–N 1.33 Å, C=O 1.23 Å) are laid between neighbouring Cα beads and turned to face along the local binormal of the trace. On an ideal α-helix this puts each C=O about 2.9 Å from the N–H four residues along, which is where real helices put their hydrogen bonds. Side chains are grown atom by atom (NeRF) from ideal bond lengths and angles and common rotamers such as χ₁ = −65°, with L-chirality at every Cα. Cysteines in a disulfide choose the rotamer pair that brings their sulfurs together. Hydrogens are hidden, as in most crystal structures. A shell of explicit waters (drawn dim, with their two hydrogens at 104.5°) settles 2.9 Å from the nearest protein N or O, the length of a hydrogen bond, and keeps about 4 Å from carbon and sulfur. Next to a carbonyl or carboxylate oxygen a water turns its hydrogens inward to donate; next to an N–H it turns them away. That is the hydrophobic effect in miniature: oily groups cannot bond to water, so water arranges itself around them. The atoms follow the beads and do not push on one another, so this is an illustration, not a prediction.</p>
<p>The molecular formula counts every atom: each residue brings its atoms minus one water, each chain end adds the water back, and each disulfide removes two hydrogens. Mature human insulin comes out as C₂₅₇H₃₈₃N₆₅O₇₇S₆, the textbook formula, and 5,807.6 Da. The contact map marks every residue pair whose Cα atoms lie within 8 Å, a standard definition. Helices thicken the diagonal with i→i+3 and i→i+4 contacts; antiparallel hairpins draw streaks at right angles to it.</p>
<p>This is a toy. It captures collapse, hydrophobic burial and helix-like turns, but not real native structures. Those come from experiment (X-ray, NMR, cryo-EM) or from AlphaFold. For scale, the ribosome and tRNAs are drawn at about 40% of their true size relative to the mRNA (a human ribosome is 25 to 30 nm across), and the exit tunnel, which really shelters 30 to 40 residues, is shortened. Molecular mass sums average residue masses plus one water per chain, minus 2.016 Da per disulfide. The hydrophobic fraction counts residues with a positive Kyte–Doolittle value. pI comes from the Henderson–Hasselbalch net charge with EMBOSS pKa values.</p>

      const deck = document.querySelector('.cz-deck'), notes = document.querySelector('.cz-notes');
      if (deck && deck.classList.contains('cz-open')) r = deck.getBoundingClientRect().left - 8;
      if (notes && !notes.classList.contains('cz-folded')) { const nr = notes.getBoundingClientRect(); if (nr.height > Hc * 0.4) l = nr.right + 8; }
      tp = 54 + 70;
    }
    freeC = [(l + r) / 2 / Wc, (tp + bt) / 2 / Hc];
    // rectangles of interface chrome that scene labels must not print over
    blockRects.length = 0;
    if (!document.body.classList.contains('cz-cinema')) {
      const sr = ch.stage.getBoundingClientRect();
      for (const sel of ['.cz-notes', '.cz-deck.cz-open', '.cz-foot', '.cz-hud', '.cz-bar', '.dna-cap']) {
        const el = document.querySelector(sel); if (!el) continue;
        const q = el.getBoundingClientRect(); if (q.width < 2 || q.height < 2) continue;
        blockRects.push([q.left - sr.left - 6, q.top - sr.top - 4, q.right - sr.left + 6, q.bottom - sr.top + 4]);
      }
    }
  }
  const tx = (freeC[0] - 0.5) * 2, ty = small() ? -0.03 : -(freeC[1] - 0.5) * 2;
  cam.shiftX += (tx - cam.shiftX) * 0.08;
  cam.shiftY += (ty - cam.shiftY) * 0.08;
  capEls.el.style.setProperty('--cap-x', (small() ? Wc / 2 : Wc * freeC[0]).toFixed(0) + 'px');
}

setGene(nameIn.value, { quiet: true });
resize();
ch.onResize(() => { resize(); drawWheel(); });

let cpuMs = 0, buildMs = 0;
ch.loop((dt, t) => {
  const tA = performance.now();
  clock += dt;
  if (S.flashT > 0) { S.flashT -= dt; if (S.flashT <= 0) { S.sub = null; } }
  const sdt = dt * S.speed; S.frameDt = ch.paused ? 0 : sdt;
  if (!ch.paused) S.t += sdt;
  if (S.stage === 0) stepDNA(sdt);
  else if (S.stage === 1) stepTX(sdt);
  else if (S.stage === 2) stepTL(sdt);
  else stepFold(sdt);
  // progress line
  const prog = S.stage === 0 ? S.t / T_DNA : S.stage === 1 ? S.t / txTimes().t2 : S.stage === 2 ? S.t / tlTimes().end : Math.min(1, (420 - sim.T) / Math.max(1, 420 - S.Ttarget));
  capEls.prog.style.setProperty('--p', (U.clamp(prog, 0, 1) * 100).toFixed(1) + '%');
  motesStep(dt);
  layoutShift(dt);
  camUpdate(dt);
  // assemble scene
  SPH.n = 0; CYL.n = 0; SLAB.n = 0; HEX.n = 0; PENT.n = 0; TUBE.rings = 0; TUBE.draws.length = 0;
  if (S.stage <= 2 && !PF.nodna) buildDNA();
  buildRNA();
  buildTRNAs();
  buildChain();
  buildGhosts(sdt);
  buildBlobs();
  const tB = performance.now();
  render(dt);
  drawLabels();
  updateGeneHighlight();
  cpuMs = cpuMs * 0.9 + (performance.now() - tA) * 0.1; buildMs = buildMs * 0.9 + (tB - tA) * 0.1;
  // readouts
  fpsN++; fpsAcc += dt;
  hudAcc += dt;
  if (hudAcc > 0.25) {
    fps = fpsN / fpsAcc; fpsN = 0; fpsAcc = 0; hudAcc = 0;
    hudStage.set(String(S.stage + 1).padStart(2, '0') + ' · ' + STAGES[S.stage]);
    hudRate.set(playbackText());
    hudSim.set(S.stage >= 2 && sim.n ? (sim.time / 1000).toFixed(2) + ' ns · ' + sim.n + ' beads' : '—');
    if (sim.n > 1 && S.stage >= 2) {
      const rg = sim.rg();
      RO.rg.set(rg.toFixed(1) + ' Å'); RO.e.set(S.stage === 3 ? sim.E.total.toFixed(1) + ' kcal/mol' : '—'); RO.T.set(Math.round(sim.T) + ' K');
      if (S.stage === 3) { deckRefs.rgChart.push([rg]); deckRefs.eChart.push([sim.E.total]); }
    } else { RO.rg.set('—'); RO.e.set('—'); RO.T.set(Math.round(S.Ttarget) + ' K'); }
    if (S.stage === 3 && ((S.fold.t * 4) | 0) % 4 === 0) refreshReadouts();
  }
  wheelAcc += dt;
  if (wheelAcc > 0.1) { wheelAcc = 0; drawWheel(); drawStrip(); if ((cmTick = (cmTick + 1) % 3) === 0) drawContact(); }
});
function playbackText() {
  const G = S.gene;
  if (S.stage === 1) { const T = txTimes(); const ntps = (T.kEnd - T.start) / T.run * S.speed; const real = 2000 / 60; return ntps > real ? (ntps / real).toFixed(1) + '× faster than Pol II' : (real / ntps).toFixed(1) + '× slower than Pol II'; }
  if (S.stage === 2) { const T = tlTimes(); const aas = S.speed / T.Tc; return aas > 5 ? (aas / 5).toFixed(1) + '× faster than a ribosome' : (5 / aas).toFixed(1) + '× slower than a ribosome'; }
  if (S.stage === 3) return 'toy model · Langevin';
  return G.protein.length + ' aa · ' + G.sense.length + ' bp shown';
}

Cosmos.debug.state = () => ({
  stage: S.stage, stageName: STAGES[S.stage], t: +S.t.toFixed(2), name: S.gene.text, protein: S.gene.protein, aa: S.gene.protein.length, cdsBp: S.gene.cds.length,
  mw: +CORE.mass(S.gene.protein).toFixed(2), pI: +CORE.pI(S.gene.protein).toFixed(2), hydrophobic: +CORE.hydrophobicFraction(S.gene.protein).toFixed(3),
  beads: sim.n, rg: +sim.rg().toFixed(2), energy: +sim.E.total.toFixed(2), T: +sim.T.toFixed(1), simNs: +(sim.time / 1000).toFixed(3), resets: sim.resets,
  atomK: +S.atomK.toFixed(2), atoms: S.stage === 3 ? MOL.nA : 0, bonds: S.stage === 3 ? MOL.nB : 0, formula: S.fx, contacts: cmContacts, waters: WAT.n, waterMs: +(PF.waterMs || 0).toFixed(2),
  rnaN: S.rnaN, cP: +S.cP.toFixed(2), trnas: S.tl ? S.tl.trnas.length : 0, spheres: SPH.n, cylinders: CYL.n, slabs: SLAB.n, tubeRings: TUBE.rings, fps: Math.round(fps), cpuMs: +cpuMs.toFixed(2), buildMs: +buildMs.toFixed(2), simMs: +simBudget.toFixed(2), msaa: !!(RT && RT.msaa), hdr: !!HDR,
});
Cosmos.debug.go = (k) => goStage(k, false);
Cosmos.debug.zoom = (z) => { cam.zoom = z; };
Cosmos.debug.cam = () => ({ target: cam.target.map((v) => +v.toFixed(1)), goal: cam.goal.target.map((v) => +v.toFixed(1)), dist: +cam.dist.toFixed(1), com: simCOM().map((v) => +v.toFixed(1)), x0: [sim.x[0], sim.x[1], sim.x[2]].map((v) => +v.toFixed(1)), shift: [cam.shiftX, cam.shiftY].map((v) => +v.toFixed(3)) });
Cosmos.debug.setName = (s) => { nameIn.set(s); setGene(s); };

})();
</script>
</body>
</html>
