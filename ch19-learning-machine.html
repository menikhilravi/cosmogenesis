<script>
(function () {
'use strict';

/* =====================================================================
   THE LEARNING MACHINE
   A coordinate network f(x, y) → (r, g, b) trained from scratch, live.
   Training runs on the GPU: every matrix multiply of the forward pass,
   the backward pass and Adam is a fragment-shader pass over float32
   textures. No libraries. A CPU Web Worker takes over when float render
   targets are missing.
   ===================================================================== */

const NOTES = `<p>The right side of the frame is a painting made by a neural network. The network is a single mathematical function with 16,771 adjustable numbers. Give it a position (<em>x</em>, <em>y</em>) and it answers with a colour (<em>r</em>, <em>g</em>, <em>b</em>). When this page opened those numbers were random and the canvas was grey fog.</p>
<p>Since then your graphics card has shown the network a couple of thousand random pixels of the target, many times a second. After each glimpse every number moves a tiny step in the direction that makes the answer less wrong. That is all the learning there is. The strip of snapshots records the journey: first the average colour, then big shapes, then the swirls. Networks learn broad strokes before fine detail.</p>
<p>Below the painting are the network's neurons. Each tile shows where one neuron fires across the whole picture. In the first layer they are random ripples. By the third layer some have become detectors: one lights up on stars, another on the cypress. Nobody told them to. <strong>Hover or tap a tile</strong> to look through its eyes. <strong>Click it</strong> (or press and hold) to silence it. The painting cracks where that neuron worked, and within seconds the survivors learn to cover for it.</p>
<p>Feed the network raw <em>x</em> and <em>y</em> and it paints as if through frosted glass. This is <em>spectral bias</em>: networks find smooth patterns easy and sharp ones hard. Hand it waves first, sines and cosines of the coordinates at random frequencies, and the detail arrives. The race in mode II shows the difference side by side. In the deck you can also paint your own word or drawing, dive in ×12 (<kbd>Z</kbd>), or replay the whole learning as a time-lapse (<kbd>P</kbd>).</p>
<h4>Try this</h4>
<ul>
<li>Press <kbd>L</kbd> to silence a quarter of all neurons. Training pauses on the damage, then the survivors heal it. The loss chart marks each cut.</li>
<li>Press <kbd>B</kbd> to zoom out beyond the edge. The network never saw a pixel out there, yet it paints anyway. Switch off <strong>Fourier features</strong> and look again: now it paints rays.</li>
<li>Back at ×1, switch Fourier features off, wait, then switch them back on, and watch the detail return.</li>
<li>Press <kbd>3</kbd>, choose XOR and give the classifier one hidden layer. With one neuron it can only draw a single straight edge and fails, the limit Minsky and Papert proved in 1969. Three or four neurons bend the boundary and win.</li>
</ul>
<h4>Eighty years of learning machines</h4>
<ol class="ml-tl">
<li><b>1943</b>McCulloch and Pitts describe a neuron as a logic gate that fires when its weighted inputs pass a threshold.</li>
<li><b>1958</b>Rosenblatt's perceptron learns its own weights from examples and is built in hardware.</li>
<li><b>1969</b>Minsky and Papert prove that a single-layer perceptron cannot compute XOR. Interest fades for over a decade.</li>
<li><b>1986</b>Rumelhart, Hinton and Williams popularise backpropagation, which trains hidden layers with the chain rule.</li>
<li><b>1989</b>LeCun's convolutional LeNet reads handwritten zip codes. By 1998 its descendants read millions of bank cheques.</li>
<li><b>2012</b>AlexNet, trained on two gaming GPUs, wins the ImageNet contest by a wide margin. Deep learning takes off.</li>
<li><b>2017</b>The transformer arrives in a paper titled “Attention is all you need”. It powers today's language models.</li>
<li class="now"><b>Today</b>This network has 1.7 × 10⁴ parameters. Frontier models have more than 10¹¹ to 10¹². Your brain has around 10¹⁴ synapses.</li>
</ol>`;
const SCIENCE = `<h4>One neuron</h4>
<p>A neuron multiplies its inputs by weights, adds a bias and passes the sum through a nonlinearity φ.</p>
<span class="eq">y = φ(Σ<sub>i</sub> w<sub>i</sub> x<sub>i</sub> + b)</span>
<p>The painter stacks them in layers: <em>h</em><sub>l</sub> = φ(<em>W</em><sub>l</sub> <em>h</em><sub>l−1</sub> + <em>b</em><sub>l</sub>). Here φ is ReLU, max(0, z), unless you choose tanh or sine. Three sigmoid outputs give <em>r</em>, <em>g</em>, <em>b</em> in [0, 1].</p>
<h4>The coordinate network</h4>
<p>Pixel positions are scaled to <strong>x</strong> ∈ [−1, 1]². The default shape is 128 → 64 → 64 → 64 → 3: 16,771 parameters. The target is 768 × 768 pixels, 1.77 × 10⁶ numbers, so the network must compress it about 100 : 1 and can only approximate it.</p>
<h4>Loss</h4>
<span class="eq">L = (1 / 3N) Σ<sub>n</sub> ‖ f(<b>x</b><sub>n</sub>) − <b>y</b><sub>n</sub> ‖²,   PSNR = −10 log<sub>10</sub> L</span>
<p>Training adds a tiny term, (λ/3N) Σ max(0, |z| − 5)² with λ = 0.02, on the three output pre-activations z. It never touches a visible colour, since σ(±5) is within 2/255 of 0 or 1, but it stops the sigmoids from saturating when you switch targets. By default each step draws N = 2,048 random positions, with bilinear lookups in the target. The PSNR readout is measured on a full rendering of the network, not on the training batch.</p>
<h4>Backpropagation</h4>
<span class="eq">δ<sub>l</sub> = (W<sub>l+1</sub><sup>T</sup> δ<sub>l+1</sub>) ⊙ φ′(z<sub>l</sub>),   ∂L/∂W<sub>l</sub> = Σ<sub>n</sub> δ<sub>l</sub> h<sub>l−1</sub><sup>T</sup>,   ∂L/∂b<sub>l</sub> = Σ<sub>n</sub> δ<sub>l</sub></span>
<p>This is the chain rule, applied from the output back to the input.</p>
<h4>Adam</h4>
<span class="eq">m<sub>t</sub> = β<sub>1</sub>m<sub>t−1</sub> + (1−β<sub>1</sub>)g<sub>t</sub>,   v<sub>t</sub> = β<sub>2</sub>v<sub>t−1</sub> + (1−β<sub>2</sub>)g<sub>t</sub>²</span>
<span class="eq">θ<sub>t</sub> = θ<sub>t−1</sub> − η · m̂<sub>t</sub> / (√v̂<sub>t</sub> + ε),   m̂ = m / (1−β<sub>1</sub><sup>t</sup>),  v̂ = v / (1−β<sub>2</sub><sup>t</sup>)</span>
<p>β<sub>1</sub> = 0.9, β<sub>2</sub> = 0.999, ε = 10⁻⁸. Default η = 4 × 10⁻³ for ReLU, 3 × 10⁻³ for tanh and 10⁻⁴ for SIREN in the painter (3 × 10⁻⁴ for SIREN in the race).</p>
<h4>Universal approximation, and its limits</h4>
<p>One hidden layer with enough sigmoidal units can approximate any continuous function on a bounded domain as closely as you like (Cybenko 1989; Hornik 1991). The theorem does not say how many units are needed, or whether gradient descent will find the weights.</p>
<h4>Spectral bias and Fourier features</h4>
<p>Trained networks fit low frequencies first and high frequencies much more slowly (Rahaman et al. 2019). The fix used here maps the input through random waves first (Tancik et al. 2020):</p>
<span class="eq">γ(<b>x</b>) = [ sin(2π B<b>x</b>), cos(2π B<b>x</b>) ],   B ∈ ℝ<sup>64×2</sup>,   B<sub>ij</sub> ~ 𝒩(0, σ²)</span>
<p>Default σ = 6 on [−1, 1], the same as σ = 12 on [0, 1]. On this page's starry target, after 3,000 steps, ReLU on raw coordinates reached 16.8 dB and ReLU on γ(<b>x</b>) reached 21.8 dB. A raw network twice as wide, with 33,795 parameters, still stalled at 17.0 dB.</p>
<h4>Beyond the frame</h4>
<p>Training only ever samples <b>x</b> ∈ [−1, 1]². Outside it, the network's answer is pure extrapolation, and its character comes from the architecture. A ReLU network is piecewise linear, and far from the data its pieces become cones pointing away from the origin. Along each ray the output pre-activations grow linearly, so the sigmoids saturate and the picture turns into straight streaks of pure colour. With Fourier features or sine activations the answer is a sum of waves, which never settles down, so the plane fills with a restless, star-flecked texture that has no connection to anything real.</p>
<h4>Lesions</h4>
<p>Silencing neuron <em>j</em> of layer <em>l</em> multiplies it by a mask, <em>h</em><sub>l,j</sub> = <em>m</em><sub>l,j</sub> φ(<em>z</em><sub>l,j</sub>) with <em>m</em> ∈ {0, 1}, in the forward pass. The same mask zeroes its δ in the backward pass, so its weights freeze while the rest keep learning. The survivors re-learn the lost work. Measured on the starry target after 3,000 steps (three trials): silencing a quarter of the neurons drops the PSNR from about 21.7 to 11.4 dB. Two thirds of the loss is back after 100 steps and 90% after about 1,000. Restoring the silenced neurons 4,000 steps later drops it again, to about 13.2 dB, because the network has rearranged itself without them. Silencing a random subset at every step is dropout, a standard way to make networks robust (Srivastava et al. 2014). Neuroscientists run the same experiment with lesions and optogenetic silencing.</p>
<h4>SIREN</h4>
<p>Sine activations, φ(z) = sin(ω<sub>0</sub>z) with ω<sub>0</sub> = 30, reach detail without any feature mapping. They need a special initialisation: first-layer weights ~ U(−1/n, 1/n), later layers ~ U(−√(6/n)/ω<sub>0</sub>, √(6/n)/ω<sub>0</sub>) (Sitzmann et al. 2020).</p>
<h4>How this page computes</h4>
<p>No libraries. Every step is 13 fragment-shader passes over float32 textures: features, three forward layers, output and loss gradient, three backward layers, four weight-gradient reductions and one Adam update. The GPU gradients agree with an independent CPU implementation to a relative error below 10⁻⁴. The neuron tiles are rendered by running the network on the GPU for every pixel of every tile. The classifier in mode III is a separate network of up to 4 × 10 neurons, trained on the CPU with full-batch Adam and binary cross-entropy, −[y ln p + (1−y) ln(1−p)].</p>
<span class="cite">Rumelhart, D. E., Hinton, G. E. & Williams, R. J. (1986). Learning representations by back-propagating errors. Nature 323, 533–536.</span>
<span class="cite">Cybenko, G. (1989). Approximation by superpositions of a sigmoidal function. Math. Control Signals Systems 2, 303–314.</span>
<span class="cite">Hornik, K. (1991). Approximation capabilities of multilayer feedforward networks. Neural Networks 4, 251–257.</span>
<span class="cite">Kingma, D. P. & Ba, J. (2015). Adam: a method for stochastic optimization. ICLR.</span>
<span class="cite">Rahaman, N. et al. (2019). On the spectral bias of neural networks. ICML, PMLR 97, 5301–5310.</span>
<span class="cite">Tancik, M. et al. (2020). Fourier features let networks learn high frequency functions in low dimensional domains. NeurIPS 33.</span>
<span class="cite">Sitzmann, V. et al. (2020). Implicit neural representations with periodic activation functions. NeurIPS 33.</span>
<span class="cite">Srivastava, N., Hinton, G., Krizhevsky, A., Sutskever, I. & Salakhutdinov, R. (2014). Dropout: a simple way to prevent neural networks from overfitting. JMLR 15, 1929–1958.</span>`;

const ch = Cosmos.chapter({ id: 'learning-machine', notes: NOTES, science: SCIENCE });
const U = Cosmos.util, FMT = Cosmos.fmt;
const ERA = ch.meta.accent;
const isSmall = () => window.matchMedia('(max-width: 760px)').matches;

/* ------------------------------------------------------------ canvases */
const cv = ch.canvas('ml-gl');
const ov = ch.canvas('ml-ov');
const ox = ov.getContext('2d');
const gl = Cosmos.gl.context(cv, { alpha: false, antialias: false });
if (!gl) { ch.fatal('This chapter trains a neural network on your graphics card and needs WebGL2, which this browser does not provide.'); return; }
const GPU_TRAIN = !!gl.ext.floatRT && !/cpu=1/.test(location.hash);
const DF = Cosmos.debug.flags = {};
const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');
// GPU profiler (debug only; enabled from Cosmos.debug.profile())
const prof = { on: false, pending: [], acc: {}, cur: null,
  begin(name) { if (!this.on || !timerExt || this.cur) return; const q = gl.createQuery(); gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q); this.cur = { q, name }; },
  end() { if (!this.cur) return; gl.endQuery(timerExt.TIME_ELAPSED_EXT); this.pending.push(this.cur); this.cur = null; },
  poll() {
    if (!timerExt) return;
    const disjoint = gl.getParameter(timerExt.GPU_DISJOINT_EXT);
    this.pending = this.pending.filter((e) => {
      if (!gl.getQueryParameter(e.q, gl.QUERY_RESULT_AVAILABLE)) return true;
      const ns = gl.getQueryParameter(e.q, gl.QUERY_RESULT); gl.deleteQuery(e.q);
      if (!disjoint) { const a = this.acc[e.name] || (this.acc[e.name] = { n: 0, ms: 0 }); a.n++; a.ms += ns / 1e6; }
      return false;
    });
  } };

/* =====================================================================
   CPU reference network (packed layout identical to the GPU textures).
   Self-contained so its source can also run inside a Worker.
   ===================================================================== */
function CPUNET() {
  const OMEGA = 30;
  function pcg(v) {
    const s = (Math.imul(v >>> 0, 747796405) + 2891336453) >>> 0;
    const w = Math.imul(((s >>> ((s >>> 28) + 4)) ^ s) >>> 0, 277803737) >>> 0;
    return ((w >>> 22) ^ w) >>> 0;
  }
  function sampleX(b, seed, out) {
    const h = pcg((b ^ pcg(seed >>> 0)) >>> 0);
    const h2 = pcg((h ^ 0x9E3779B9) >>> 0);
    out[0] = ((h >>> 8) + 0.5) * (2 / 16777216) - 1;
    out[1] = ((h2 >>> 8) + 0.5) * (2 / 16777216) - 1;
  }
  function make(s) {
    // s: {L, W, K0, ff, m, act, WT, R, rowOff[], kin4[], Bm Float32Array(2m)}
    const N = s.WT * s.R * 4;
    const P = new Float32Array(N), M = new Float32Array(N), V = new Float32Array(N), G = new Float32Array(N);
    const L = s.L, Wd = s.W, WT = s.WT;
    const f = new Float32Array(Math.max(4, s.K0));
    const Z = [], H = [], D = [];
    for (let l = 0; l < L; l++) { Z.push(new Float32Array(Wd)); H.push(new Float32Array(Wd)); D.push(new Float32Array(Wd)); }
    const tmp = new Float32Array(Math.max(Wd, s.K0));
    const keep = new Float32Array(L * Wd).fill(1); // lesion mask: 0 silences a hidden neuron
    const yo = new Float32Array(3), zo = new Float32Array(3), dout = new Float32Array(3);
    const act = s.act === 0 ? (z) => (z > 0 ? z : 0) : s.act === 1 ? (z) => Math.tanh(z) : (z) => Math.sin(OMEGA * z);
    const dact = s.act === 0 ? (z) => (z > 0 ? 1 : 0) : s.act === 1 ? (z) => { const t = Math.tanh(z); return 1 - t * t; } : (z) => OMEGA * Math.cos(OMEGA * z);
    const kinOf = (l) => (l === 0 ? (s.ff ? 2 * s.m : 2) : Wd);
    function feats(x0, x1) {
      if (s.ff) { for (let k = 0; k < s.m; k++) { const a = 6.283185307179586 * (s.Bm[2 * k] * x0 + s.Bm[2 * k + 1] * x1); f[k] = Math.sin(a); f[s.m + k] = Math.cos(a); } }
      else { f[0] = x0; f[1] = x1; f[2] = 0; f[3] = 0; }
    }
    function forward(x0, x1) {
      feats(x0, x1);
      for (let l = 0; l < L; l++) {
        const Kin = kinOf(l), inp = l ? H[l - 1] : f, r0 = s.rowOff[l], bc = s.kin4[l] * 4;
        for (let j = 0; j < Wd; j++) {
          const base = (r0 + j) * WT * 4; let z = P[base + bc];
          for (let i = 0; i < Kin; i++) z += P[base + i] * inp[i];
          Z[l][j] = z; H[l][j] = act(z) * keep[l * Wd + j];
        }
      }
      const r0 = s.rowOff[L], bc = s.kin4[L] * 4, hl = H[L - 1];
      for (let k = 0; k < 3; k++) {
        const base = (r0 + k) * WT * 4; let z = P[base + bc];
        for (let i = 0; i < Wd; i++) z += P[base + i] * hl[i];
        zo[k] = z; z = Math.max(-30, Math.min(30, z));
        yo[k] = 1 / (1 + Math.exp(-z));
      }
      return yo;
    }
    // accumulate gradient of scale * sum_k (y_k - t_k)^2 into G; returns mean sq err over channels
    function backward(t, scale) {
      let se = 0;
      for (let k = 0; k < 3; k++) { const e = yo[k] - t[k], a = Math.abs(zo[k]); se += e * e; dout[k] = scale * (e * yo[k] * (1 - yo[k]) + (a > 5 ? 0.02 * Math.sign(zo[k]) * (a - 5) : 0)); }
      // output layer
      { const r0 = s.rowOff[L], bc = s.kin4[L] * 4, hl = H[L - 1];
        tmp.fill(0, 0, Wd);
        for (let k = 0; k < 3; k++) {
          const base = (r0 + k) * WT * 4, d = dout[k];
          for (let i = 0; i < Wd; i++) { G[base + i] += d * hl[i]; tmp[i] += P[base + i] * d; }
          G[base + bc] += d;
        }
        for (let i = 0; i < Wd; i++) D[L - 1][i] = tmp[i] * dact(Z[L - 1][i]) * keep[(L - 1) * Wd + i];
      }
      for (let l = L - 1; l >= 0; l--) {
        const Kin = kinOf(l), inp = l ? H[l - 1] : f, r0 = s.rowOff[l], bc = s.kin4[l] * 4, Dl = D[l];
        if (l > 0) tmp.fill(0, 0, Wd);
        for (let j = 0; j < Wd; j++) {
          const base = (r0 + j) * WT * 4, d = Dl[j];
          if (d === 0) continue;
          for (let i = 0; i < Kin; i++) G[base + i] += d * inp[i];
          G[base + bc] += d;
          if (l > 0) for (let i = 0; i < Wd; i++) tmp[i] += P[base + i] * d;
        }
        if (l > 0) for (let i = 0; i < Wd; i++) D[l - 1][i] = tmp[i] * dact(Z[l - 1][i]) * keep[(l - 1) * Wd + i];
      }
      return se / 3;
    }
    function adam(lr, t) {
      const b1 = 0.9, b2 = 0.999, c1 = 1 - Math.pow(b1, t), c2 = 1 - Math.pow(b2, t);
      for (let i = 0; i < N; i++) {
        const g = G[i];
        const m = (M[i] = b1 * M[i] + (1 - b1) * g);
        const v = (V[i] = b2 * V[i] + (1 - b2) * g * g);
        P[i] -= lr * (m / c1) / (Math.sqrt(v / c2) + 1e-8);
      }
    }
    return { P, M, V, G, H, Z, f, keep, forward, backward, adam, spec: s };
  }
  // bilinear sampler over RGBA8 pixels (N×N, row 0 = top), GL clamp-to-edge convention, y up
  function sampler(px, N) {
    const out = new Float32Array(3);
    return function (x0, x1) {
      const u = (x0 * 0.5 + 0.5) * N - 0.5, v = (1 - (x1 * 0.5 + 0.5)) * N - 0.5;
      let i0 = Math.floor(u), j0 = Math.floor(v); const fu = u - i0, fv = v - j0;
      const cl = (a) => (a < 0 ? 0 : a > N - 1 ? N - 1 : a);
      const i1 = cl(i0 + 1), j1 = cl(j0 + 1); i0 = cl(i0); j0 = cl(j0);

window.addEventListener('pointerdown', () => { touched = true; }, { once: true });

window.addEventListener('wheel', () => { touched = true; }, { once: true, passive: true });
setTimeout(() => { if (state.mode === 'paint') ch.toast(paintNet.spec.params.toLocaleString('en-US') + ' random numbers are learning to paint this picture. Hover anything.', 3600); }, 1100);
setTimeout(() => { if (!touched && state.mode === 'paint') { modeBtns.race.classList.add('ml-hint'); modeBtns.decide.classList.add('ml-hint'); } }, 16000);
// if nobody has touched anything yet, stage one experiment: silence a quarter of the brain and let it heal
setTimeout(() => {
  if (touched || state.mode !== 'paint' || ch.paused || document.hidden || paintNet.silenced() || !isFinite(train.psnr) || /nodemo/.test(location.hash)) return;
  lesionRandom(0.25);
  ch.toast('Experiment: a quarter of the neurons just went silent. Watch the rest heal the painting. (Restore all is in the deck.)', 5200);
}, 21000);
ch.onResize(() => { updateLayout(false); ensureRTs(); });
setInterval(() => updateLayout(false), 300);
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('italic 600 100px "Bodoni Moda"'), document.fonts.load('600 20px "JetBrains Mono"')]).then(() => { if (state.target === 'word' || state.target === 'card') drawTarget(); }).catch(() => {});
}

let lastNow = performance.now(), roT = 0;
const cpuT = Cosmos.debug.cpuT = {};
const tm = (k, t0) => { cpuT[k] = (cpuT[k] || 0) * 0.95 + (performance.now() - t0) * 0.05; };
ch.loop((dt, t) => {
  const now = performance.now();

  { const q = performance.now(); rbPump(); tm('pump', q); }

    updateProbe(raw / 1000);
    stepDive(now); stepReplay(now);
    let t0 = performance.now();
    if (!DF.notrain) done = trainFrame(dt);
    tm('train', t0); t0 = performance.now();
    if (!DF.norb) { const q0 = performance.now(); readbacks(now); tm('poll', q0); const q1 = performance.now(); requestParams(now); tm('req', q1); }
    tm('rb', t0); t0 = performance.now();
    if (!DF.nooff) renderOffscreen(now);
    tm('off', t0);
  } else if (state.mode === 'race') {
    done = raceTrain();
    raceRender(now);
  } else if (state.mode === 'decide') {
    if (!ch.paused) { const k = Math.max(1, Math.min(3, train.spf)); for (let i = 0; i < k; i++) decStep(); done = k; if (dec.epoch % 10 < k) dec.hist.push([dec.epoch, dec.loss]); if (dec.hist.length > 500) dec.hist.splice(0, 100); }
    decFields(now);
  }
  let t1 = performance.now();
  prof.begin('composite');
  if (!DF.nocomp) composite();
  prof.end();
  prof.poll();
  tm('comp', t1); t1 = performance.now();
  if (!DF.noov) drawOverlay();
  tm('ov', t1);
  spsAcc += done; spsT += raw / 1000;
  if (spsT > 0.5) { train.stepsPerSec = spsAcc / spsT; spsAcc = 0; spsT = 0; }
  roT += raw;
  if (roT > 200) {
    roT = 0;
    cpuTrainerCfg();
    soundUpdate();
    if (!GPU_TRAIN) train.stepsPerSec = cpuTrainer.sps || 0;
    const sps = ch.paused ? '—' : Math.round(train.stepsPerSec).toLocaleString('en-US');
    hudSps.set(ch.paused ? 'paused' : sps + (state.mode === 'decide' ? ' epochs/s' : state.mode === 'race' ? ' steps/s × 3' : ' steps/s'));
    if (state.mode === 'paint') {
      const st = paintNet.steps;
      hudStep.set(st.toLocaleString('en-US')); roTr.step.set(st.toLocaleString('en-US'));
      roTr.sps.set(sps);
      hudPsnr.set(isFinite(train.psnr) ? train.psnr.toFixed(1) + ' dB' : '—'); roTr.psnr.set(isFinite(train.psnr) ? train.psnr.toFixed(1) + ' dB' : '—');
      roTr.loss.set(isFinite(train.mse) ? FMT.sci(train.mse, 3) : '—');
      hudPar.set(paintNet.spec.params.toLocaleString('en-US'));
      drawLossChart(lossCv, [{ data: train.history, color: ERA, label: 'MSE' }], { yLo: 1e-4, yHi: 1e-1, xLabel: 'step', marks: lesion.marks.map((m) => ({ step: m.step - snaps.base, kind: m.kind })) });
      syncLesionUI();
      { const out = view.zoom > 1.5 || (dive && dive.z1 > 1); if (btnDive.out !== out) { btnDive.out = out; btnDive[0].setLabel(out ? 'Back out to ×1' : 'Dive in ×12'); }
        const bey = view.zoom < 0.9 || (dive && dive.z1 < 1); if (btnDive.bey !== bey) { btnDive.bey = bey; btnDive[1].setLabel(bey ? 'Back to the square' : 'Beyond the edge'); } }
    } else if (state.mode === 'race' && race.nets) {
      const st = race.nets[0].steps, pv = (k) => (isFinite(race.mse[k]) ? (-10 * Math.log10(race.mse[k])).toFixed(1) + ' dB' : '—');
      hudStep.set(st.toLocaleString('en-US'));
      hudPsnr.set(RACERS.map((r, k) => pv(k)).join(' · '));
      hudPar.set(race.nets.map((n) => n.spec.params.toLocaleString('en-US')).join(' · '));
      roRace.raw.set(pv(0)); roRace.ff.set(pv(1)); roRace.siren.set(pv(2)); roRace.step.set(st.toLocaleString('en-US'));
      drawLossChart(raceCv, race.hist.map((h, k) => ({ data: h, color: RACERS[k].col, label: RACERS[k].short })), { yLo: 1e-4, yHi: 1e-1, xLabel: 'step' });
    } else if (state.mode === 'decide' && dec.net) {
      hudStep.set(dec.epoch.toLocaleString('en-US'));
      hudPsnr.set(isFinite(dec.acc) ? (dec.acc * 100).toFixed(1) + ' %' : '—');
      let np = 0; dec.net.W.forEach((w) => (np += w.length)); dec.net.B.forEach((b) => (np += b.length));
      hudPar.set(String(np));
      roDec.epoch.set(dec.epoch.toLocaleString('en-US')); roDec.loss.set(isFinite(dec.loss) ? dec.loss.toFixed(3) : '—');
      roDec.acc.set(isFinite(dec.acc) ? (dec.acc * 100).toFixed(1) + ' %' : '—'); roDec.n.set(String(dec.pts.length));
      drawLossChart(decCv, [{ data: dec.hist, color: ERA, label: 'loss' }], { yLo: 1e-3, yHi: 1, xLabel: 'epoch' });
    }
  }
}, { always: true });

/* ------------------------------------------------------------- debug */
Cosmos.debug.state = () => ({
  mode: state.mode, gpuTrain: GPU_TRAIN, step: paintNet.steps, stepsPerSec: Math.round(train.stepsPerSec), spf: train.spf,
  batchLoss: train.lastLoss, mse: train.mse, psnr: train.psnr, params: paintNet.spec.params, arch: roParams.arch ? paintNet.spec.K0 + '/' + paintNet.spec.L + 'x' + paintNet.spec.W + ' ' + paintNet.spec.actName : '',
  target: state.target, lr: state.lr, batch: state.batch, frameMs: +frameMs.toFixed(2), nanResets: train.nanResets, zoom: +view.zoom.toFixed(3),
  silenced: paintNet.silenced(), lesion: lesion.ev ? { kind: lesion.ev.kind, before: +(+lesion.ev.before).toFixed(2), worst: +(+lesion.ev.worst).toFixed(2), done: lesion.ev.done, healSteps: lesion.ev.healSteps || null } : null, replay: replay.on,
  race: race.nets ? { step: race.nets[0].steps, psnr: race.mse.map((m) => +(-10 * Math.log10(m)).toFixed(2)) } : null,
  decide: dec.net ? { epoch: dec.epoch, loss: +dec.loss.toFixed(4), acc: dec.acc, points: dec.pts.length, set: dec.set } : null,
});
// gradient check: GPU batch gradient vs the CPU reference on the same random batch
Cosmos.debug.gradCheck = (B, lesionFrac) => {
  B = B || 256;
  const net = new GPUNet({ depth: state.depth, width: state.width, act: state.act, ff: state.ff, m: MF_DEFAULT, sigma: state.sigma, seed: 77 });
  const s = net.spec, seed = 4242;
  const keep = new Float32Array(s.L * s.W).fill(1), KR = U.rng(9);
  if (lesionFrac) for (let i = 0; i < keep.length; i++) if (KR() < lesionFrac) keep[i] = 0;
  net.setKeep(keep);
  net.step(B, 0, targetTex, seed); // lr = 0: params unchanged, gradient left in net.G
  const G = new Float32Array(SPLITS * s.WT * s.R * 4);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, net.G.fbo); gl.readPixels(0, 0, SPLITS * s.WT, s.R, gl.RGBA, gl.FLOAT, G); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
  const Dout = new Float32Array(B * 4);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, net.Dout.fbo); gl.readPixels(0, 0, 1, B, gl.RGBA, gl.FLOAT, Dout); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
  const gpu = new Float32Array(s.WT * s.R * 4);
  for (let r = 0; r < s.R; r++) for (let c = 0; c < s.WT; c++) for (let k = 0; k < 4; k++) { let a = 0; for (let sp = 0; sp < SPLITS; sp++) a += G[(r * SPLITS * s.WT + sp * s.WT + c) * 4 + k]; gpu[(r * s.WT + c) * 4 + k] = a; }
  const cpu = CPU.make(s); cpu.P.set(net.initP); cpu.keep.set(keep);
  const samp = CPU.sampler(getTargetPixels(), TS), x = [0, 0];
  let lossC = 0, lossG = 0;
  for (let b = 0; b < B; b++) { CPU.sampleX(b, seed, x); cpu.forward(x[0], x[1]); lossC += cpu.backward(samp(x[0], x[1]), 2 / (3 * B)); lossG += Dout[b * 4 + 3]; }
  let num = 0, den = 0, maxRel = 0;
  for (let i = 0; i < gpu.length; i++) { const d = gpu[i] - cpu.G[i]; num += d * d; den += cpu.G[i] * cpu.G[i]; }
  net.dispose();
  return { B, relErr: Math.sqrt(num / Math.max(den, 1e-30)), lossCPU: lossC / B, lossGPU: lossG / B, gradNorm: Math.sqrt(den) };
};
// hyper-parameter experiment: train a throwaway net synchronously, return full-image PSNR at checkpoints
Cosmos.debug.experiment = (o) => {
  o = Object.assign({ depth: state.depth, width: state.width, act: state.act, ff: state.ff, m: MF_DEFAULT, sigma: state.sigma, seed: 5, lr: state.lr, batch: state.batch, steps: 1000, checks: [100, 300, 1000] }, o);
  const net = new GPUNet(o); const res = { cfg: o.act + ' ff=' + o.ff + ' s=' + o.sigma + ' lr=' + o.lr + ' B=' + o.batch + ' ' + o.depth + 'x' + o.width };
  const tmp = rt(256, 256, gl.RGBA8, 'nearest'); const px = new Uint8Array(256 * 256 * 4);
  const tp = getTargetPixels(); const t0 = performance.now();
  const psnr = () => { net.render(tmp.fbo, 0, 0, 256, 256, [-1, -1, 2, 2]); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, tmp.fbo); gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, px); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    let se = 0; for (let j = 0; j < 256; j++) for (let i = 0; i < 256; i++) { const ty = TS - 1 - Math.floor((j + 0.5) / 256 * TS), tx = Math.floor((i + 0.5) / 256 * TS); for (let k = 0; k < 3; k++) { const e = (px[(j * 256 + i) * 4 + k] - tp[(ty * TS + tx) * 4 + k]) / 255; se += e * e; } }
    return +(-10 * Math.log10(se / (3 * 65536))).toFixed(2); };
  for (let i = 1; i <= o.steps; i++) { net.step(o.batch, o.lr, targetTex, 1000 + i); if (o.checks.indexOf(i) >= 0) res['s' + i] = psnr(); }
  res.ms = Math.round(performance.now() - t0);
  gl.deleteFramebuffer(tmp.fbo); gl.deleteTexture(tmp.tex); net.dispose();
  return JSON.stringify(res);
};
// lesion experiment: train, silence a random fraction per layer, keep training; PSNR before, after the cut and while healing
Cosmos.debug.lesionTrial = (frac, seed, pre) => {
  const net = new GPUNet({ depth: state.depth, width: state.width, act: state.act, ff: state.ff, m: MF_DEFAULT, sigma: state.sigma, seed: seed || 5 });
  const tmp = rt(256, 256, gl.RGBA8, 'nearest'), px = new Uint8Array(256 * 256 * 4), tp = getTargetPixels();
  const psnr = () => { net.render(tmp.fbo, 0, 0, 256, 256, [-1, -1, 2, 2]); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, tmp.fbo); gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, px); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    let se = 0; for (let j = 0; j < 256; j++) for (let i = 0; i < 256; i++) { const ty = TS - 1 - Math.floor((j + 0.5) / 256 * TS), tx = Math.floor((i + 0.5) / 256 * TS); for (let k = 0; k < 3; k++) { const e = (px[(j * 256 + i) * 4 + k] - tp[(ty * TS + tx) * 4 + k]) / 255; se += e * e; } }
    return +(-10 * Math.log10(se / (3 * 65536))).toFixed(2); };
  let st = 0; const tr = (n) => { for (let i = 0; i < n; i++) net.step(state.batch, state.lr, targetTex, 5000 + (st++)); };
  tr(pre || 3000); const res = { before: psnr() };
  const s = net.spec, keep = new Float32Array(s.L * s.W).fill(1), R = U.rng((seed || 5) * 31);
  for (let l = 0; l < s.L; l++) { const alive = []; for (let j = 0; j < s.W; j++) alive.push(j); for (let n = Math.round(s.W * frac); n > 0; n--) { const k = Math.floor(R() * alive.length); keep[l * s.W + alive[k]] = 0; alive.splice(k, 1); } }
  net.setKeep(keep); res.cut = psnr();
  let done = 0; [100, 300, 1000, 2000, 4000].forEach((c) => { tr(c - done); done = c; res['h' + c] = psnr(); });
  net.setKeep(new Float32Array(s.L * s.W).fill(1)); res.restored = psnr();
  gl.deleteFramebuffer(tmp.fbo); gl.deleteTexture(tmp.tex); net.dispose();
  return JSON.stringify(res);
};
Cosmos.debug.decTrial = (width, depth, epochs, seeds) => {
  const out = [], keep = { w: dec.width, d: dec.depth, s: dec.seed, n: dec.net };
  for (let k = 0; k < seeds; k++) { dec.width = width; dec.depth = depth; dec.seed = 100 + k; decMakeNet(); for (let e = 0; e < epochs; e++) decStep(); out.push(+dec.acc.toFixed(3)); }
  dec.width = keep.w; dec.depth = keep.d; dec.seed = keep.s; decMakeNet();
  return out.join(' ');
};
Cosmos.debug.profile = (on) => { prof.on = on !== false; prof.acc = {}; return 'ok'; };
Cosmos.debug.profileResult = () => { const o = {}; for (const k in prof.acc) o[k] = +(prof.acc[k].ms / prof.acc[k].n).toFixed(3); o.spf = train.spf; return o; };
Cosmos.debug.bench = (n) => {
  n = n || 50;
  const pf = new Float32Array(4), pb = new Uint8Array(4);
  const syncF = (fbo) => { gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, pf); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null); };
  const syncB = (fbo) => { gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pb); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null); };
  const res = {};
  syncB(outRT.fbo); let t0 = performance.now();
  for (let i = 0; i < n; i++) paintNet.step(state.batch, state.lr, targetTex, 99 + i);
  syncF(paintNet.adamFbo[paintNet.cur]); res.msPerStep = (performance.now() - t0) / n;
  t0 = performance.now();
  for (let i = 0; i < 10; i++) paintNet.render(outRT.fbo, 0, 0, OUTRES, OUTRES, [-1, -1, 2, 2]);
  syncB(outRT.fbo); res.msPerRender = (performance.now() - t0) / 10; res.res = OUTRES;
  ensureAtlas(paintNet); t0 = performance.now();
  for (let i = 0; i < 3; i++) paintNet.atlas(atlasRT.fbo, atlasRT.w, atlasRT.h, atlasRT.tile, atlasRT.cols, 0);
  syncF(atlasRT.fbo); res.msAtlas = (performance.now() - t0) / 3;
  t0 = performance.now(); syncB(outRT.fbo); res.msEmptySync = performance.now() - t0;
  return res;
};
