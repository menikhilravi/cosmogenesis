<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endless Forms · Cosmogenesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="cosmos.css">
<style>
  /* ---- Endless Forms: chapter styles (shared tokens only) ---- */
  .cz-stage { cursor: grab; }
  .cz-stage.ev-dragging { cursor: grabbing; }
  .cz-stage.ev-hover { cursor: pointer; }
  #ev-ov { pointer-events: none; }

  /* specimen card: a museum label for the creature you follow */
  .ev-card {
    position: fixed; z-index: 24; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 6px); right: calc(var(--gutter) + 304px + 12px);
    width: 292px; padding: 12px 14px 12px; display: grid; gap: 9px;
    opacity: 0; transform: translateY(-6px); pointer-events: none; visibility: hidden;
    transition: opacity .35s var(--ease), transform .35s var(--ease), right .5s var(--ease), visibility 0s linear .35s;
    max-height: calc(100% - var(--bar-h) - var(--foot-h) - 30px); overflow: auto; scrollbar-width: thin;
  }
  body.ev-deck-closed .ev-card { right: var(--gutter); }
  .ev-card.on { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity .35s var(--ease), transform .35s var(--ease), right .5s var(--ease), visibility 0s; }
  .ev-card-head { display: flex; align-items: flex-start; gap: 10px; }
  .ev-card-head > div { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .ev-name { font: italic 500 21px/1.05 var(--f-display); color: var(--star); overflow-wrap: anywhere; }
  .ev-sub { font: 500 10.5px/1.3 var(--f-mono); color: var(--faint); letter-spacing: .06em; }
  .ev-sub b { color: var(--dust); font-weight: 500; }
  .ev-x { width: 26px; height: 26px; flex: none; }
  .ev-kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 8px; }
  .ev-kv div { display: grid; gap: 1px; min-width: 0; }
  .ev-kv span:first-child { font: 600 8.5px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .ev-kv span:last-child { font: 500 12.5px/1.2 var(--f-mono); color: var(--star); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-energy { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .ev-energy i { display: block; height: 100%; width: 50%; background: linear-gradient(90deg, #b8732e, #f3cf6a); transition: width .2s; }
  .ev-sec { font: 600 9px/1.2 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--faint); display: flex; gap: 8px; align-items: center; margin-top: 2px; }
  .ev-sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .ev-brain { width: 100%; height: 170px; display: block; }
  .ev-genome { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; font: 500 10.5px/1.25 var(--f-mono); }
  .ev-genome .l { color: var(--dust); white-space: nowrap; }
  .ev-genome .v { color: var(--star); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ev-bar { position: relative; height: 5px; border-radius: 3px; background: rgba(255,255,255,.05); }
  .ev-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--era); opacity: .85; }
  .ev-bar b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--star); opacity: .55; }
  .ev-lineage { font: 400 11.5px/1.45 var(--f-ui); color: var(--dust); }
  .ev-lineage em { font-family: var(--f-display); font-style: italic; color: var(--star); font-size: 1.05em; }
  .ev-dyn { display: flex; align-items: baseline; gap: 8px; font: 400 11.5px/1.4 var(--f-ui); color: var(--dust); }
  .ev-dyn b { font: 500 17px/1 var(--f-mono); color: var(--era); font-variant-numeric: tabular-nums; }
  .ev-dyn i { font-style: normal; display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--era); box-shadow: 0 0 6px var(--era); flex: none; align-self: center; }
  .ev-death { font: 400 12.5px/1.45 var(--f-ui); color: #d9d4c6; border-left: 2px solid var(--bad); padding: 6px 10px; background: rgba(255,107,122,.06); border-radius: 0 6px 6px 0; }
  .ev-card .cz-btns { margin-top: 2px; }

  /* fast-forward veil */
  .ev-ff { position: fixed; z-index: 26; left: 50%; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 18px); transform: translateX(-50%);
    width: min(420px, calc(100vw - 32px)); padding: 14px 16px; display: grid; gap: 8px; opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .3s var(--ease), visibility 0s linear .3s; }
  .ev-ff.on { opacity: 1; pointer-events: auto; visibility: visible; transition: opacity .3s var(--ease), visibility 0s; }
  .ev-ff-t { font: italic 500 22px/1.1 var(--f-display); }
  .ev-ff-s { font: 500 11px/1.3 var(--f-mono); color: var(--dust); display: flex; justify-content: space-between; gap: 12px; }
  .ev-ff-bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .ev-ff-bar i { display: block; height: 100%; width: 0%; background: var(--era); box-shadow: 0 0 12px var(--era); }

  /* tree hover label under the phylogeny */
  .ev-tip { font: 400 11.5px/1.45 var(--f-ui); color: var(--dust); min-height: 3em; }
  .ev-tip em { font-family: var(--f-display); font-style: italic; color: var(--star); font-size: 1.08em; }
  .ev-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 10px/1.3 var(--f-mono); color: var(--faint); }
  .ev-legend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 5px; }

  .ev-ramp { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; font: 500 10px/1.3 var(--f-mono); color: var(--faint); }
  .ev-ramp i { grid-column: 1 / -1; height: 6px; border-radius: 3px; display: block; }
  .ev-ramp span:last-child { text-align: right; }
  .ev-ramp em { grid-column: 1 / -1; font: 400 11.5px/1.4 var(--f-ui); font-style: normal; color: var(--dust); }
  /* full-screen tree of life */
  .ev-tree { position: fixed; z-index: 35; left: var(--gutter); right: var(--gutter); top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 6px); bottom: calc(var(--foot-h) + env(safe-area-inset-bottom, 0px) + 6px);
    display: grid; grid-template-rows: auto 1fr auto; padding: 16px 18px 12px; gap: 8px; background: rgba(6, 8, 15, .9); }
  .ev-tree-head { display: flex; align-items: flex-start; gap: 16px; }
  .ev-tree-head > div { flex: 1; min-width: 0; }
  .ev-tree-k { font: 600 10px/1.2 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--era); }
  .ev-tree h2 { margin: 4px 0 2px; font: italic 500 clamp(26px, 3vw, 38px)/1.05 var(--f-display); }
  .ev-tree-sub { margin: 0; color: var(--dust); font-size: 13px; max-width: 80ch; }
  .ev-tree-cv { width: 100%; height: 100%; min-height: 0; display: block; cursor: crosshair; }
  .ev-tree-tip { min-height: 2.9em; font: 400 12.5px/1.45 var(--f-ui); color: var(--dust); }
  .ev-tree-tip em { font-family: var(--f-display); font-style: italic; font-size: 1.1em; }
  .ev-tree-tip span { font: 500 11px/1.4 var(--f-mono); color: var(--faint); }
  /* chronicle tab */
  .ev-chron { display: grid; gap: 0; }
  .ev-chron-row { display: grid; grid-template-columns: 5.2em 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.45; color: #d9d4c6; }
  .ev-chron-row b { font: 500 11px/1.9 var(--f-mono); color: var(--faint); font-weight: 500; white-space: nowrap; }
  .ev-chron-row em { font-family: var(--f-display); font-style: italic; font-size: 1.06em; }
  .ev-chron-row.ext span { color: var(--dust); }
  .ev-chron-row.event b { color: var(--warn); }
  .ev-chron-row.hunt b { color: #ff8a75; }
  .ev-chron-row.gen b { color: var(--era); }
  /* bestiary tab */
  .ev-best { display: grid; gap: 10px; }
  .ev-best-row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; padding: 8px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: rgba(255,255,255,.015); }
  .ev-best-row:hover { border-color: var(--era); }
  .ev-best-row.ev-anc { cursor: default; border-style: dashed; opacity: .82; }
  .ev-best-row.ev-anc:hover { border-color: var(--line); }
  .ev-best-row canvas { width: 96px; height: 56px; display: block; }
  .ev-best-row b { display: block; font: italic 500 16px/1.1 var(--f-display); color: var(--star); font-weight: 500; }
  .ev-best-row small { display: block; font: 500 10.5px/1.45 var(--f-mono); color: var(--faint); }
  .ev-best-row small span { color: var(--dust); }
  .ev-best-head { font: 500 11px/1.4 var(--f-mono); color: var(--faint); display: flex; justify-content: space-between; }

  @media (max-width: 760px) {
    .ev-card { left: var(--gutter); right: var(--gutter) !important; width: auto; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 4px); max-height: 46%; padding: 10px 12px; gap: 7px; }
    .ev-brain { height: 128px; }
    .ev-name { font-size: 19px; }
    body.ev-card-on .cz-hud { opacity: 0; }
    body:not(.ev-deck-closed) .ev-card.on { opacity: 0; pointer-events: none; visibility: hidden; }
    .ev-tree { padding: 12px 12px 8px; }
    .ev-tree-sub { font-size: 12px; }
    .ev-tree-k { font-size: 9px; letter-spacing: .12em; }
  }
</style>
</head>
<body>
<script src="cosmos.js"></script>
<script>
/*SIM-BEGIN*/
function evoSimModule(scope) {
  'use strict';
  /* ------------------------------------------------------------------
     ENDLESS FORMS — the ecosystem engine.  Runs in a Blob worker (or on
     the main thread as a fallback).  Plain typed arrays, no allocation in
     the hot loop.  World units: 1 = 1 mm.  One tick = 0.1 s of swimming.
     ------------------------------------------------------------------ */
  const NI = 18, NH = 10, NO = 4, NT = 12, NR = 5;
  const O_W1 = NT, O_B1 = O_W1 + NI * NH, O_REC = O_B1 + NH, O_W2 = O_REC + NH, O_B2 = O_W2 + NH * NO, GLEN = O_B2 + NO;
  const STRIDE = 24, YEAR = 4000, CS = 50, FC = 12.5, SAMPLE = 30, SPEC_D = 0.65;
  const TS = 0, TV = 1, TT = 2, TE = 3, TF = 4, THUE = 5, TM = 6, TR = 7, TD = 8, TO = 9, TSEG = 10, TFIN = 11;
  const PI = Math.PI, TWO_PI = PI * 2;
  const K = {
    plantE: 10, basal: 0.014, move: 0.022, turn: 0.030, eye: 0.0024, fovc: 0.0010, brain: 0.0025,
    capPerMass: 40, bite: 0.05, graze: 0.0015, birthFrac: 0.33, birthEff: 0.85, birthFix: 6, minAge: 80, cool: 60,
    life: 2600, digest: 45, meatE: 18, hunterFloorT: 2 * YEAR,
  };

  function createSim(cfg) {
    const W = cfg.W, H = cfg.H, CAP = cfg.cap, HW = W / 2, HH = H / 2;
    const FW = Math.round(W / FC), FH = Math.round(H / FC), GW = Math.round(W / CS), GH = Math.round(H / CS);
    const invFC = 1 / FC;
    const P = Object.assign({ growth: 1, fertility: 1, mutation: 1, sex: false, seasons: true, autoPred: true, spec: 1, ice: false, predT: 6000 }, cfg.params || {});

    /* ---------------- rng ---------------- */
    // RNG state lives in typed arrays: closure variables holding uint32/doubles would be boxed on every write
    const RS = new Uint32Array(1); RS[0] = (cfg.seed || 1) >>> 0;
    function rnd() { const s0 = (RS[0] + 0x6D2B79F5) >>> 0; RS[0] = s0; let t = s0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
    const GS = new Float64Array(2); // [spare, has]
    function gauss() { if (GS[1]) { GS[1] = 0; return GS[0]; } let u, v, s; do { u = rnd() * 2 - 1; v = rnd() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0); const m = Math.sqrt(-2 * Math.log(s) / s); GS[0] = v * m; GS[1] = 1; return u * m; }

    /* ---------------- per-creature state ---------------- */
    const G = new Float32Array((CAP + 1) * GLEN); // slot CAP is a scratch genome
    const X = new Float32Array(CAP), Y = new Float32Array(CAP), HD = new Float32Array(CAP), V = new Float32Array(CAP), E = new Float32Array(CAP);
    const AGE = new Int32Array(CAP), GEN = new Int32Array(CAP), UID = new Uint32Array(CAP), PAR = new Uint32Array(CAP), SPC = new Int32Array(CAP);
    const KIDS = new Int32Array(CAP), KILLS = new Int32Array(CAP), DIG = new Int32Array(CAP), COOL = new Int32Array(CAP), FLAG = new Int32Array(CAP), ALIVE = new Uint8Array(CAP);
    const PH = new Float32Array(CAP), OPH = new Float32Array(CAP), RADC = new Float32Array(CAP), EATEN = new Float32Array(CAP), BORN = new Int32Array(CAP);
    // phenotype (developed from the genome at birth)
    const RAD = new Float32Array(CAP), VMAX = new Float32Array(CAP), TMAX = new Float32Array(CAP), EYER = new Float32Array(CAP), FOV = new Float32Array(CAP);
    const MET = new Float32Array(CAP), THR = new Float32Array(CAP), DIET = new Float32Array(CAP), OSCF = new Float32Array(CAP), MASS = new Float32Array(CAP);
    const ECAP = new Float32Array(CAP), BASAL = new Float32Array(CAP), ECOST = new Float32Array(CAP), LIFE = new Float32Array(CAP), BITE = new Float32Array(CAP);
    const SZ = new Float32Array(CAP), PEFF = new Float32Array(CAP), MEFF = new Float32Array(CAP), ELONG = new Float32Array(CAP), RAYC = new Float32Array(CAP * NR), RAYS = new Float32Array(CAP * NR);
    const HID = new Float32Array(CAP * NH), OUT = new Float32Array(CAP * NO), INP = new Float32Array(CAP * NI);
    const DYN = new Uint8Array(CAP);   // 1 = descends from the creature being followed (its dynasty)
    const PER = [[G, GLEN], [X, 1], [Y, 1], [HD, 1], [V, 1], [E, 1], [AGE, 1], [GEN, 1], [UID, 1], [PAR, 1], [SPC, 1], [KIDS, 1], [KILLS, 1], [DIG, 1], [COOL, 1], [FLAG, 1], [ALIVE, 1],
      [PH, 1], [OPH, 1], [RADC, 1], [EATEN, 1], [BORN, 1], [RAD, 1], [VMAX, 1], [TMAX, 1], [EYER, 1], [FOV, 1], [MET, 1], [THR, 1], [DIET, 1], [OSCF, 1], [MASS, 1], [ECAP, 1],
      [BASAL, 1], [ECOST, 1], [SZ, 1], [LIFE, 1], [BITE, 1], [PEFF, 1], [MEFF, 1], [ELONG, 1], [RAYC, NR], [RAYS, NR], [HID, NH], [OUT, NO], [INP, NI], [DYN, 1]];
    let n = 0, tick = 0, nextUid = 1, maxGen = 0, dynBorn = 0, dynRoot = 0;

    /* ---------------- world: algae field ---------------- */
    const food = new Float32Array(FW * FH), fert = new Float32Array(FW * FH);
    const foodU8 = new Uint8Array(FW * FH), fertU8 = new Uint8Array(FW * FH);
    const CL = new Float64Array([1, 1, 1, 0]); // climate: K factor, r factor, impact recovery, dust (ice age lowers K and r; asteroid → impact winter)
    function buildFertility() {
      const blobs = [];
      const nb = 9 + Math.floor(rnd() * 5);
      for (let b = 0; b < nb; b++) blobs.push([rnd() * W, rnd() * H, 70 + rnd() * 170, 0.55 + rnd() * 0.6, rnd() * PI, 0.6 + rnd() * 0.8]);
      // cheap value noise for texture
      const NS = 32, nz = new Float32Array(NS * NS); for (let i = 0; i < nz.length; i++) nz[i] = rnd();
      const vn = (u, v) => { const x0 = Math.floor(u), y0 = Math.floor(v), fx = u - x0, fy = v - y0; const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
        const a = nz[((y0 % NS + NS) % NS) * NS + ((x0 % NS + NS) % NS)], b = nz[((y0 % NS + NS) % NS) * NS + (((x0 + 1) % NS + NS) % NS)], c = nz[(((y0 + 1) % NS + NS) % NS) * NS + ((x0 % NS + NS) % NS)], d = nz[(((y0 + 1) % NS + NS) % NS) * NS + (((x0 + 1) % NS + NS) % NS)];
        return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy; };
      for (let j = 0; j < FH; j++) for (let i = 0; i < FW; i++) {
        const x = (i + 0.5) * FC, y = (j + 0.5) * FC;
        let s = 0;
        for (const [bx, by, r, a, ang, el] of blobs) {
          let dx = x - bx, dy = y - by; if (dx > HW) dx -= W; else if (dx < -HW) dx += W; if (dy > HH) dy -= H; else if (dy < -HH) dy += H;
          const ca = Math.cos(ang), sa = Math.sin(ang); const u = (dx * ca + dy * sa) / (r * el), v = (-dx * sa + dy * ca) / (r / el);
          s += a * Math.exp(-(u * u + v * v));
        }
        // periodic noise: sample on torus-wrapped lattice (NS cells across the world)
        const u = i / FW * NS, v = j / FH * NS;
        const nn = 0.55 * vn(u, v) + 0.3 * vn(u * 2, v * 2) + 0.15 * vn(u * 4, v * 4);
        let f = s * (0.55 + 0.9 * nn) + 0.12 * nn;
        f = Math.min(1, Math.max(0.03, f));
        fert[j * FW + i] = f;
        fertU8[j * FW + i] = Math.round(f * 255);
      }
      for (let k = 0; k < food.length; k++) food[k] = fert[k] * (0.22 + 0.25 * rnd());
    }
    function seasonAt(row) { // 0..1 light / fertility of a latitude band; the band sweeps round the torus once a year
      if (!P.seasons) return 0.62;
      return 0.5 + 0.5 * Math.cos(TWO_PI * (row / FH) - TWO_PI * tick / YEAR);
    }
    function growFood() {
      // climate relaxes towards its target (ice age), impact winter decays
      const tk = P.ice ? 0.42 : 1, tr = P.ice ? 0.5 : 1;
      CL[0] += (tk - CL[0]) * 0.0012; CL[1] += (tr - CL[1]) * 0.0012;
      CL[2] += (1 - CL[2]) * 0.0007; CL[3] *= 0.9993;
      const g = 0.0029 * P.growth * CL[1] * CL[2], fk = P.fertility * CL[0] * (0.35 + 0.65 * CL[2]);
      for (let j = 0; j < FH; j++) {
        const s = seasonAt(j), rate = g * (0.15 + 0.85 * s), kk = fk * (0.3 + 0.7 * s);
        let o = j * FW;
        for (let i = 0; i < FW; i++, o++) {
          const Kc = fert[o] * kk; let f = food[o];
          if (f < Kc) f += rate * (f + 0.08) * (1 - f / Kc);
          else f -= 0.006 * (f - Kc);
          food[o] = f;
        }
      }
    }
    // algal spores drift: a little diffusion every 4 ticks (also keeps mats from being cell-shaped)
    const ftmp = new Float32Array(FW * FH);
    function diffuseFood() {
      const D = 0.06;
      for (let j = 0; j < FH; j++) {
        const jm = (j === 0 ? FH - 1 : j - 1) * FW, jp = (j === FH - 1 ? 0 : j + 1) * FW, jo = j * FW;
        for (let i = 0; i < FW; i++) {
          const im = i === 0 ? FW - 1 : i - 1, ip = i === FW - 1 ? 0 : i + 1, c = food[jo + i];
          ftmp[jo + i] = c + D * (food[jo + im] + food[jo + ip] + food[jm + i] + food[jp + i] - 4 * c);
        }
      }
      food.set(ftmp);
    }
    function foodAt(x, y) {
      let fx = Math.floor(x * invFC) % FW; if (fx < 0) fx += FW;
      let fy = Math.floor(y * invFC) % FH; if (fy < 0) fy += FH;
      return fy * FW + fx;
    }

    /* ---------------- spatial hash ---------------- */
    const cellStart = new Int32Array(GW * GH + 1), cellItems = new Int32Array(CAP), cellOf = new Int32Array(CAP), cellFill = new Int32Array(GW * GH);
    function buildGrid() {
      cellStart.fill(0);
      for (let i = 0; i < n; i++) { let cx = Math.floor(X[i] / CS); if (cx >= GW) cx = GW - 1; let cy = Math.floor(Y[i] / CS); if (cy >= GH) cy = GH - 1; const c = cy * GW + cx; cellOf[i] = c; cellStart[c + 1]++; }
      for (let c = 0; c < GW * GH; c++) cellStart[c + 1] += cellStart[c];
      cellFill.set(cellStart.subarray(0, GW * GH));
      for (let i = 0; i < n; i++) cellItems[cellFill[cellOf[i]]++] = i;
    }

    /* ---------------- species / phylogeny ---------------- */
    const species = []; // {id,parent,born,died,hue,genus,epithet,count,peak,hunter,cent,sum,depth}
    const newSpEvents = [], extSpEvents = [];
    let extinctCount = 0, aliveSpecies = 0;
    const GEN_A = ['Ano', 'Opa', 'Hallu', 'Marro', 'Waxo', 'Pika', 'Ayshe', 'Sido', 'Leancho', 'Yoho', 'Kery', 'Necto', 'Amplecto', 'Otto', 'Burge', 'Helio', 'Cana', 'Oleno', 'Para', 'Eo', 'Proto', 'Xeno', 'Tama', 'Vauxi', 'Hurdi', 'Kiiso', 'Parva', 'Odara', 'Thylo', 'Sancto', 'Emu', 'Cheng', 'Isoxy', 'Branchi', 'Selki', 'Naro', 'Lyra', 'Cambro', 'Tuzo', 'Fuxi', 'Jiango', 'Dino', 'Glypto', 'Lepto'];
    const GEN_B = ['caris', 'bina', 'genia', 'rella', 'xia', 'aia', 'nella', 'lites', 'toides', 'dora', 'spina', 'ops', 'aspis', 'morpha', 'cystis', 'ella', 'onyx', 'tella', 'ichthys', 'pterus', 'nectes', 'soma'];
    const EPI = {

<p>This is a Cambrian sea floor, a little over half a billion years ago. Every creature here carries a genome: twelve numbers that build its body, and 244 more that wire a tiny brain. Nobody programs what they do. Each one senses algae and other animals through a five-ray eye, and its brain decides how to turn, how hard to swim, when to bite and when to breed.</p>
<p>At first the brains are random. Many creatures spin in circles and starve. The few that happen to steer toward the glowing algae eat more and breed more, and their young inherit the wiring with small copying errors. Watch the <strong>straightness</strong> strip in the Traits chart rise, and the swimmers start cutting clean lines between the mats. That is learning with no teacher.</p>
<p>Then the hunters arrive: bigger, redder, armed with grasping claws. Now speed and sharp eyes pay off for grazers, and the hunters must keep up. It is an arms race with no finish line, the Red Queen's race.</p>
<p>When a lineage drifts far enough from its founder it becomes a new species. It gets its own colour and a Latin name, and a new branch grows on the tree in the deck. Most branches end. A few become dynasties. Darwin closed <em>On the Origin of Species</em> with the phrase that names this chapter: “endless forms most beautiful and most wonderful”.</p>
<h4>Try this</h4>

<li>Colour the creatures by <strong>top speed</strong> or <strong>eye range</strong> and watch a new trait sweep through a population.</li>

const SCIENCE = `
<h4>Darwin's argument</h4>
<p>Darwin (1859) needed three facts. Individuals vary. Much of that variation is inherited. More are born than can survive, so some variants leave more offspring than others. Put them together and a population changes, generation by generation, without any goal. Nothing in this simulation tells a creature what is good. Only the bookkeeping of energy decides who breeds.</p>
<h4>Fitness is counted in descendants</h4>
<p>Follow a creature and every descendant born while you watch wears a ring; the card counts the living ones. That number is what biologists mean by fitness. Speed, size and sharp eyes matter only through it. Most dynasties die out within a few generations. Now and then one spreads until it rings a large part of the sea: that is a new variant sweeping toward fixation, seen one family at a time.</p>
<h4>Bodies and energy</h4>
<p>Each creature pays energy every tick (0.1 s) and gains it by eating. It senses and thinks every other tick (5 Hz) and its body acts every tick. Body mass is <i>M</i> = (<i>r</i>/6 mm)<sup>3</sup>. Basal metabolism follows Kleiber's law, and swimming costs grow with size and the square of speed:</p>
<span class="eq">dE/dt = e<sub>food</sub> − b<sub>0</sub> μ M<sup>3/4</sup> − k<sub>v</sub> (r/6) v<sup>2</sup> − k<sub>θ</sub> M ω<sup>2</sup> − c<sub>R</sub> R − c<sub>φ</sub> φ − c<sub>brain</sub></span>
<p>with μ the metabolism gene, <i>v</i> the swimming speed, ω the turn rate, <i>R</i> the eye range and φ the field of view. Sharp, wide eyes cost energy every tick, so they only spread when they pay for themselves. Biting costs a little extra. Energy storage scales as <i>M</i>, so large animals outlast famines, and lifespan scales as <i>M</i><sup>1/4</sup>. Algae yield 10 energy units per unit eaten, times a digestive efficiency 1 − <i>d</i><sup>1.5</sup> that falls as the diet gene <i>d</i> moves toward meat. Meat is digested with efficiency <i>d</i><sup>2</sup>. A hunter can only subdue prey less than about 1.3 times its own size, and fast prey escape more often.</p>
<p>A creature breeds when its brain says so and its energy passes a heritable threshold. The child costs a third of a full store plus a fixed overhead, and it starts life at a little over half size. Algae regrow logistically toward a patchy carrying capacity (the reefs), drift slowly between cells, and keep a thin film that no grazer can scrape off, so a grazed patch can always recover.</p>
<h4>The brain</h4>
<p>Eighteen inputs: five eye rays that each report algae, grazers and hunters, plus energy, an internal clock and the algae underfoot. Ten hidden units with tanh activations, each with a self-connection that gives it a short memory. Four outputs: turn, thrust, bite and breed. All 244 weights sit in the genome. No gradient descent is used. The only teacher is who survives, as in Sims (1994) and neuroevolution methods such as NEAT (Stanley &amp; Miikkulainen 2002).</p>
<h4>Mutation and selection</h4>
<p>Each birth copies the genome with errors. Every weight mutates with probability 7% (Gaussian, σ = 0.3), every trait with probability 11% (σ = 0.045 of its range), and 2.5% of births carry one large-effect mutation. Mutation keeps adding variation and selection keeps removing the harmful part. In the simplest case the frequency of a harmful allele settles where the two balance:</p>
<span class="eq">q̂ ≈ μ / s &nbsp;(dominant) &nbsp;&nbsp; q̂ ≈ √(μ / s) &nbsp;(recessive)</span>
<p>Turn the mutation rate up and populations get sloppier and more diverse. Turn it right down and adaptation stalls. Real populations adapt just as visibly: in Lenski's long-term experiment, twelve flasks of <i>E. coli</i> grew measurably fitter in their glucose broth over their first 2,000 generations, and diverged from one another as they did (Lenski et al. 1991).</p>
<h4>Predator and prey</h4>
<p>Lotka (1925) and Volterra (1926) wrote the classic model for prey <i>x</i> and predators <i>y</i>:</p>
<span class="eq">dx/dt = α x − β x y &nbsp;&nbsp;&nbsp; dy/dt = δ x y − γ y</span>
<p>Its solutions cycle around the point (γ/δ, α/β). The phase plot in the deck draws this plane from the live populations. Here hunters also need time to digest each kill (a Holling type II response) and get in each other's way when crowded (predator interference, as in the Beddington–DeAngelis model), and the algae regrow logistically. So the cycles are noisy and damped rather than perfect closed orbits.</p>
<h4>The Red Queen</h4>
<p>Van Valen (1973) found that a family's risk of extinction does not fall with its age. His explanation: every species' environment is made of other species that are also evolving. When grazers get faster, hunters must get faster just to eat as well as before. Watch the speed and eye-range strips climb together once hunters arrive.</p>
<h4>What tends to evolve</h4>
<p>Nothing below is scripted. In long test runs of this model these patterns turned up again and again. Before hunters arrive, steering improves and top speed creeps up until swimming costs balance the extra food. Once hunters arrive, grazer speed and eye range climb, hunters follow, and over hundreds of generations both sides end up far faster than their ancestors. Under heavy predation grazers also get smaller and breed at lower energy: when adult life is short, it pays to reproduce early and cheaply, a classic result of life-history theory. Their paths get twistier too, since a predictable swimmer is an easy meal.</p>
<h4>Species and extinction</h4>
<p>Each species remembers its founder's genome. A newborn whose genetic distance from that founder exceeds a threshold starts a new species, unless it falls close to a sister species that split the same way:</p>
<span class="eq">D = ( Σ<sub>traits</sub> w<sub>i</sub> Δg<sub>i</sub><sup>2</sup> + Σ<sub>weights</sub> Δw<sub>j</sub><sup>2</sup> / 150 )<sup>1/2</sup> &gt; 0.65</span>
<p>The fossil record holds five mass extinctions: the end-Ordovician (about 445 million years ago), Late Devonian (about 372), end-Permian (252, the worst, taking roughly 80–90% of marine species), end-Triassic (201) and end-Cretaceous (66, an asteroid impact, about three quarters of species). After each, survivors spread into emptied niches in bursts of adaptive radiation. The <strong>Asteroid</strong> button replays that experiment.</p>
<h4>What is simplified</h4>
<p>Everything, honestly. Reproduction is asexual by default (switch on recombination to shuffle whole genes and whole neurons between two parents of one species). Brains are tiny and fixed in shape. Costs are arbitrary units tuned so evolution is visible in minutes. The cup-shaped sponges on the reefs are archaeocyaths, the first animal reef builders of the early Cambrian; here they are scenery, not food. The colour gene is a neutral marker, nudged at each speciation so you can tell species apart. The segment and fringe genes only change looks and drift freely. A model year is 4,000 ticks so seasons pass in minutes. The founding grazers share one ancestor with random wiring. The first hunters arrive with a crude hunting reflex already wired (turn toward grazers, surge, strike when prey is dead ahead), because a predator with a random brain starves before selection can shape it. If grazers ever drop below 16, a few larvae drift in from outside the map. If hunters die out, a fresh wave arrives two model years later, from a notional neighbouring sea where hunters kept pace with their prey: its founders descend from the most successful hunter seen so far and are sized, sped and sighted to match the local grazers.</p>
<span class="cite">Darwin, C. (1859). On the Origin of Species by Means of Natural Selection. John Murray, London.</span>
<span class="cite">Lotka, A. J. (1925). Elements of Physical Biology. Williams &amp; Wilkins, Baltimore.</span>
<span class="cite">Volterra, V. (1926). Fluctuations in the abundance of a species considered mathematically. Nature 118, 558–560.</span>
<span class="cite">Van Valen, L. (1973). A new evolutionary law. Evolutionary Theory 1, 1–30.</span>
<span class="cite">Sims, K. (1994). Evolving virtual creatures. Proceedings of SIGGRAPH '94, 15–22.</span>
<span class="cite">Stanley, K. O. &amp; Miikkulainen, R. (2002). Evolving neural networks through augmenting topologies. Evolutionary Computation 10, 99–127.</span>
<span class="cite">Lenski, R. E., Rose, M. R., Simpson, S. C. &amp; Tadler, S. C. (1991). Long-term experimental evolution in Escherichia coli. I. Adaptation and divergence during 2,000 generations. American Naturalist 138, 1315–1341.</span>
<span class="cite">Kleiber, M. (1932). Body size and metabolism. Hilgardia 6, 315–353.</span>`;

precision highp float;

uniform vec2 uRes, uCam, uWorld; uniform float uZoom, uT, uYear, uSeason, uIce, uDust, uFlash, uGreen, uDetail; uniform vec4 uImp;
uniform sampler2D uFood, uFert; uniform vec3 uEra;
float hash(vec2 p){ uvec2 q = uvec2(ivec2(floor(p)) + 65536); q *= uvec2(1597334673u, 3812015801u); uint n = (q.x ^ q.y) * 1597334673u; return float(n >> 8) * (1. / 16777216.); }   // integer hash: exact at any world coordinate
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
const mat2 ROT = mat2(.8, .6, -.6, .8);
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++) { s += a * vn(p); p = ROT * p * 2.03 + 17.1; a *= .5; } return s; }
// cubic B-spline sampling from 4 bilinear taps (smooth, no grid blocks)
vec4 cubic(float v){ vec4 n = vec4(1., 2., 3., 4.) - v; vec4 s = n * n * n; float x = s.x, y = s.y - 4. * s.x, z = s.z - 4. * s.y + 6. * s.x; return vec4(x, y, z, 6. - x - y - z) * (1. / 6.); }
float texBicubic(sampler2D t, vec2 uv){
  vec2 ts = vec2(textureSize(t, 0)); vec2 inv = 1. / ts;
  uv = uv * ts - .5; vec2 fxy = fract(uv); uv -= fxy;
  vec4 xc = cubic(fxy.x), yc = cubic(fxy.y);
  vec4 c = uv.xxyy + vec2(-.5, 1.5).xyxy;
  vec4 s = vec4(xc.xz + xc.yw, yc.xz + yc.yw);
  vec4 off = c + vec4(xc.yw, yc.yw) / s;
  off *= inv.xxyy;
  float s0 = texture(t, off.xz).r, s1 = texture(t, off.yz).r, s2 = texture(t, off.xw).r, s3 = texture(t, off.yw).r;
  float sx = s.x / (s.x + s.y), sy = s.z / (s.z + s.w);
  return mix(mix(s3, s2, sx), mix(s1, s0, sx), sy);
}
vec2 voro(vec2 p){
  vec2 i = floor(p), f = fract(p); float d1 = 8., d2 = 8.;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(float(x), float(y)); vec2 o = vec2(hash(i + g), hash(i + g + 19.1));
    vec2 r = g + o - f; float d = dot(r, r);

}
float caustic(vec2 p, float t){
  vec2 i = p; float c = 1.; float inten = .005;

    float tt = t * (1. - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    float sx = sin(i.x + tt), cy = cos(i.y + tt);
    sx = sign(sx) * max(abs(sx), 1e-4); cy = sign(cy) * max(abs(cy), 1e-4);
    c += 1. / max(length(vec2(p.x / (sx / inten), p.y / (cy / inten))), 1e-3);

}

  const res = [glc.width, glc.height];
  const iceAmt = U.clamp((1 - climate.K) / 0.58, 0, 1);
  if (fx.impact && fx.impact.hitT) { impU[0] = fx.impact.x; impU[1] = fx.impact.y; impU[2] = (now - fx.impact.hitT) / 1000; impU[3] = 1; } else impU[3] = 0;

  // start every frame from a cleared drawable with replace-blending, so a driver that splits or replays
  // the render pass can never stack the sea floor on top of itself
  Cosmos.gl.screen(gl);
  gl.disable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ZERO);
  gl.clearColor(0.012, 0.036, 0.058, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  const SK = Cosmos.debug.skip || {};
  if (fertTex && foodTex && !SK.bg) {
    const bt = bgTarget(), full = bt.w === glc.width;
    if (full) Cosmos.gl.screen(gl); else bt.bind();
    gl.useProgram(bgProg);
    Cosmos.gl.uniforms(gl, bgProg, { uRes: [bt.w, bt.h], uCam: [camX, camY], uWorld: [WW, WH], uZoom: Z * bt.w / glc.width, uT: t, uYear: simTick / YEAR, uSeason: params.seasons ? 1 : 0, uIce: iceAmt, uDust: climate.dust, uFlash: fx.flash, uImp: impU, uGreen: 0, uDetail: U.smoothstep(1.6, 4.5, cam.z), uFood: foodTex, uFert: fertTex, uEra: Cosmos.util.rgbf(ERA) });
    drawQuad();
    if (!full) { Cosmos.gl.screen(gl); gl.useProgram(blitProg); Cosmos.gl.uniforms(gl, blitProg, { uTex: bt.tex }); drawQuad(); }
  } else { Cosmos.gl.screen(gl); gl.clearColor(0.01, 0.02, 0.035, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
  Cosmos.gl.screen(gl);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  // marine snow (far layer, drawn under the creatures)
  for (let i = 0; i < SNOW; i++) {
    const o = i * 4, par = snow[o + 2];
    snow[o] += (-(cam.vx) * cam.z * par * 0.35 + Math.sin(t * 0.3 + snow[o + 3]) * 0.02 * rdt * 60 / cssW * 3) / cssW;
    snow[o + 1] += (0.012 * rdt * par) + (-(cam.vy) * cam.z * par * 0.35) / cssH;
    snow[o] -= Math.floor(snow[o]); snow[o + 1] -= Math.floor(snow[o + 1]);
    const g = i * 8; snowGpu[g] = snow[o]; snowGpu[g + 1] = snow[o + 1]; snowGpu[g + 2] = 1.2 + 2.6 * par; snowGpu[g + 3] = 0;
    snowGpu[g + 4] = 0.75; snowGpu[g + 5] = 0.85; snowGpu[g + 6] = 0.8; snowGpu[g + 7] = 0.10 + 0.2 * par;
  }
  gl.useProgram(ptProg);
  gl.bindVertexArray(snowVao); gl.bindBuffer(gl.ARRAY_BUFFER, snowBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, snowGpu);
  Cosmos.gl.uniforms(gl, ptProg, { uRes: res, uCam: [camX, camY], uWorld: [WW, WH], uZoom: Z, uScreen: 1, uDpr: DPR });
  gl.drawArrays(gl.POINTS, 0, SNOW);
  // creatures
  if (nInst > 0 && !SK.cr) {
    gl.useProgram(crProg);
    Cosmos.gl.uniforms(gl, crProg, { uRes: res, uCam: [camX, camY], uWorld: [WW, WH], uZoom: Z, uMinPx: 2.2 * DPR, uT: t, uSel: sel || -1, uHiSp: phHover, uMode: colourMode, uDyn: dynTg.value && sel ? 1 : 0, uEra: ERA_RGB });
    gl.bindVertexArray(crVao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, nInstDraw);
  }
  // event particles
  stepParticles(rdt);
  if (pN > 0) {
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(ptProg);
    gl.bindVertexArray(ptVao); gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, pGpu, 0, pN * 8);
    Cosmos.gl.uniforms(gl, ptProg, { uRes: res, uCam: [camX, camY], uWorld: [WW, WH], uZoom: Z, uScreen: 0, uDpr: DPR });
    gl.drawArrays(gl.POINTS, 0, pN);
  }
  gl.bindVertexArray(null);
  gl.disable(gl.BLEND);

  if (!SK.ov) drawOverlay(now, selI);

  // UI refresh
  uiT += rdt;
  if (uiT > 0.25) {
    uiT = 0;
    const last = hist[hist.length - 1];
    const yr = simTick / YEAR, season = ['spring', 'summer', 'autumn', 'winter'][Math.floor(((yr % 1) + 1) % 1 * 4)];
    hudYear.set(`${yr.toFixed(2)} · ${params.seasons ? season : 'no seasons'}`);
    hudGen.set(F.num(maxGen));
    hudSp.set(`${F.num(aliveSp)} alive · ${F.num(extinctSp)} extinct`);
    if (last) hudPop.set(`${F.num(last.g)} grazer${last.g === 1 ? '' : 's'} · ${F.num(last.h)} hunter${last.h === 1 ? '' : 's'}`);
    hudSpeed.set(ff ? 'fast-forward' : ch.paused ? 'paused' : `×${speed}` + (realSpeed > 0.5 && realSpeed < speed * 0.8 ? ` (×${realSpeed.toFixed(1)} actual)` : ''));
    ro.time.set(`yr ${yr.toFixed(2)}`);
    ro.gen.set(F.num(maxGen)); ro.alive.set(F.num(aliveSp)); ro.ext.set(F.num(extinctSp));
    if (last) {
      ro.graz.set(F.num(last.g)); ro.hunt.set(F.num(last.h));
      ro.spd.set((last.tr[0] / TICK_S).toFixed(1) + ' mm/s');
      ro.size.set((2 * last.tr[1] * (1.25 + 1.1 * U.clamp((last.tr[0] - 0.3) / 2.4, 0, 1))).toFixed(1) + ' mm');
    }
    ffBtns[0].setLabel(ff && ff.target - ff.from === 100 ? 'Stop' : '+100 generations');
    ffBtns[1].setLabel(ff && ff.target - ff.from === 1000 ? 'Stop' : '+1,000 generations');
    if (ch.tab === 'bestiary') updateBestiary();
    if (ch.tab === 'chronicle') updateChronicle(); else chronDirty = true;
    checkMilestones();
  }
  chartT += rdt;
  if (chartsDirty && chartT > (ff ? 0.2 : 0.35)) { chartT = 0; chartsDirty = false; drawCharts(); }
  if (treeOpen) { treeT += rdt; if (treeT > 0.5) { treeT = 0; drawTreeBig(); } }
  if (cardOn) drawBrain();
}, { always: true });

// keys (also recorded locally, so the help overlay can be repaired if the shared one renders badly)
const KEYS = [['Space', 'Pause / play'], ['H', 'Hide the interface'], ['N', 'Field notes'], ['C', 'Controls'], ['M', 'Sound'], ['F', 'Fullscreen'], ['[ ]', 'Previous / next chapter'], ['?', 'This help']];
const _onKey = ch.onKey;
ch.onKey = (k, fn, desc) => { if (desc) KEYS.push([k === '1' ? '1–7' : k.length === 1 ? k.toUpperCase() : k, desc]); return _onKey(k, fn, desc); };
new MutationObserver(() => {
  const dl = document.querySelector('.cz-help dl');
  if (!dl || dl.dataset.evFixed || !/\[object /.test(dl.textContent)) return;
  dl.dataset.evFixed = '1'; dl.textContent = '';
  for (const [k, d] of KEYS) dl.append(H('dt', {}, H('kbd', { text: k })), H('dd', { style: { margin: 0 }, text: d }));
}).observe(document.body, { childList: true });
ch.onKey('a', () => asteroid(), 'Asteroid impact');
ch.onKey('i', () => toggleIce(), 'Ice age on / off');
ch.onKey('p', () => introducePredators(), 'Introduce hunters');
ch.onKey('g', () => fastForward(100), 'Fast-forward 100 generations');
ch.onKey('d', () => { docCam = !docCam; docTg.set(docCam); docT = 0; ch.toast(docCam ? 'Documentary camera on' : 'Documentary camera off'); }, 'Documentary camera');
ch.onKey('o', () => overview(), 'Overview of the whole sea');
ch.onKey('r', () => newWorld(), 'New world');
ch.onKey('=', () => { cam.tz = U.clamp(cam.tz * 1.4, zFit(), zMax()); }, 'Zoom in');
ch.onKey('-', () => { cam.tz = U.clamp(cam.tz / 1.4, zFit(), zMax()); }, 'Zoom out');
for (let k = 1; k <= 7; k++) ch.onKey(String(k), () => { speed = SPEEDS[k - 1]; speedSl.set(k - 1); }, k === 1 ? 'Speed: keys 1 to 7 give ×1, ×2, ×3, ×5, ×10, ×20, ×50' : undefined);

/* debug */
Cosmos.debug.state = () => {
  const last = hist[hist.length - 1] || {};
  return {
    mode, ready, tick: simTick, year: +(simTick / YEAR).toFixed(3), n: nInst, grazers: last.g, hunters: last.h, maxGen, speciesAlive: aliveSp, speciesExtinct: extinctSp,
    meanSpeedMmS: last.tr ? +(last.tr[0] / TICK_S).toFixed(2) : null, meanRadiusMm: last.tr ? +last.tr[1].toFixed(2) : null, eyeMm: last.tr ? +last.tr[2].toFixed(1) : null, straightness: last.tr ? +last.tr[3].toFixed(3) : null,
    hunterSpeed: last.tr ? +(last.tr[4] / TICK_S).toFixed(2) : null, fps: Math.round(fps), speed, realSpeed: +realSpeed.toFixed(2), workerMs: +(workerMs || 0).toFixed(2), stepsReq, lastDone, playing, sel, particles: pN, world: [WW, WH], zoom: +cam.z.toFixed(3), hist: hist.length, ff: !!ff,
  };
};
Cosmos.debug.select = (uid) => select(uid);
Cosmos.debug.selectParent = () => post({ cmd: 'pick', kind: 'any', tag: 'dbg' });
Cosmos.debug.selScreen = () => { const i = findSel(); return i < 0 ? null : toScreen(inst[i * STRIDE], inst[i * STRIDE + 1]).map(Math.round).concat([cssW, cssH, +cam.z.toFixed(2)]); };
Cosmos.debug.selectAny = (kind) => { let best = -1, bs = -1; for (let i = 0; i < nInst; i++) { const s = (kind === 'hunter' ? (inst[i * STRIDE + 6] >= 0.5 ? 2 : 0) : 0) + inst[i * STRIDE + 8] + Math.random() * 0.3; if (s > bs) { bs = s; best = i; } } if (best >= 0) select(inst[best * STRIDE + 15] >>> 0); return best; };
Cosmos.debug.species = () => species.filter(Boolean).map((s) => ({ id: s.id, name: s.name, parent: s.parent, born: s.born, died: s.died, count: s.count, peak: s.peak, hunter: s.hunter }));

glc.addEventListener('webglcontextlost', (e) => { e.preventDefault(); ch.toast('The graphics context was lost. Reload the page to see the sea again.', 8000); });
// go
if (/[?&]noworker/.test(location.search)) { startFallback(); return; }
worker = startWorker();
if (!worker) startFallback();
else worker.postMessage({ cmd: 'init', cfg: simCfg(seed) });
})();
</script>
</body>
