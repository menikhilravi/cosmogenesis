    }
  }

<script>
(function () {
'use strict';

/* =========================================================================
   Chapter 2 · The First Three Minutes
   A real reduced Big Bang nucleosynthesis network (8 species, 15 reactions)
   integrated with a stiff second-order implicit solver, then played back as
   a glowing soup of nucleons whose populations follow the network.
   ========================================================================= */

/* -------------------------------------------------------------------------
   The physics engine. Self-contained (it is also stringified into a Worker).
   Units: MeV, s, cm, g. Rates N_A<σv> in cm³ s⁻¹ mol⁻¹ as functions of T9.

  'use strict';

    { name: 'D(p,γ)³He', i: [2, 1], o: [4], Q: 5.493485, f: (T9, w) => 2.65e3 / w.t23 * Math.exp(-3.720 / w.t13) * (1 + 0.112 * w.t13 + 1.99 * w.t23 + 1.56 * T9 + 0.162 * w.t43 + 0.324 * w.t53) },

    { name: '³He(D,p)⁴He', i: [4, 2], o: [5, 1], Q: 18.353053, f: (T9, w) => 5.021e10 / w.t23 * Math.exp(-7.144 / w.t13 - Math.pow(T9 / 0.270, 2)) * (1 + 0.058 * w.t13 + 0.603 * w.t23 + 0.245 * T9 + 6.97 * w.t43 + 7.19 * w.t53) + 5.212e8 / w.t12 * Math.exp(-1.762 / T9) },
    { name: '³He(n,p)³H', i: [4, 0], o: [3, 1], Q: 0.763755, f: (T9, w) => 7.21e8 * (1 - 0.508 * w.t12 + 0.228 * T9) },
    { name: '³H(p,γ)⁴He', i: [3, 1], o: [5], Q: 19.813852, f: (T9, w) => 2.87e4 / w.t23 * Math.exp(-3.87 / w.t13) * (1 + 0.108 * w.t13 + 0.466 * w.t23 + 0.352 * T9 + 0.300 * w.t43 + 0.576 * w.t53) },
    { name: '³He(n,γ)⁴He', i: [4, 0], o: [5], Q: 20.577612, f: (T9) => 6.62 * (1 + 905 * T9) },
    { name: '³H(α,γ)⁷Li', i: [3, 5], o: [6], Q: 2.467032, f: (T9, w) => { const a = T9 / (1 + 0.1378 * T9); return 3.032e5 / w.t23 * Math.exp(-8.090 / w.t13) * (1 + 0.0516 * w.t13 + 0.0229 * w.t23 + 8.28e-3 * T9 - 3.28e-4 * w.t43 - 3.01e-4 * w.t53) + 5.109e5 * Math.pow(a, 5 / 6) / w.t32 * Math.exp(-8.068 / Math.cbrt(a)); } },
    { name: '³He(α,γ)⁷Be', i: [4, 5], o: [7], Q: 1.586627, f: (T9, w) => { const a = T9 / (1 + 0.1071 * T9); return 4.817e6 / w.t23 * Math.exp(-14.964 / w.t13) * (1 + 0.0325 * w.t13 - 1.04e-3 * w.t23 - 2.37e-4 * T9 - 8.11e-5 * w.t43 - 4.69e-5 * w.t53) + 5.938e6 * Math.pow(a, 5 / 6) / w.t32 * Math.exp(-12.859 / Math.cbrt(a)); } },
    { name: '⁷Be(n,p)⁷Li', i: [7, 0], o: [6, 1], Q: 1.644243, f: (T9, w) => { const a = T9 / (1 + 13.076 * T9); return 2.675e9 * (1 - 0.560 * w.t12 + 0.179 * T9 - 0.0283 * w.t32 + 2.214e-3 * T9 * T9 - 6.851e-5 * T9 * T9 * w.t12) + 9.391e8 * Math.pow(a, 1.5) / w.t32 + 4.467e7 / w.t32 * Math.exp(-0.07486 / T9); } },
    { name: '⁷Li(p,α)⁴He', i: [6, 1], o: [5, 5], Q: 17.346249, f: (T9, w) => { const d = T9 / (1 + 0.759 * T9); return 1.096e9 / w.t23 * Math.exp(-8.472 / w.t13) - 4.830e8 * Math.pow(d, 5 / 6) / w.t32 * Math.exp(-8.472 / Math.cbrt(d)) + 1.06e10 / w.t32 * Math.exp(-30.442 / T9) + 1.56e5 / w.t23 * Math.exp(-8.472 / w.t13 - Math.pow(T9 / 1.696, 2)) * (1 + 0.049 * w.t13 - 2.498 * w.t23 + 0.860 * T9 + 3.518 * w.t43 + 3.08 * w.t53) + 1.55e6 / w.t32 * Math.exp(-4.478 / T9); } },
    { name: '⁷Be(n,α)⁴He', i: [7, 0], o: [5, 5], Q: 18.990, f: (T9) => 1.2e7 * T9 },
  ];
  // detailed balance: reverse = forward × (g, μ factors) × [T9^{3/2}] × exp(−Q/kT)
  const CPH = 9.8686e9; // (m_u k·10⁹K / 2πħ²)^{3/2} / N_A
  const mu = (a, b) => (M[a] * M[b]) / (M[a] + M[b]);
  R.forEach((r) => {
    const gin = r.i.reduce((s, k) => s * G[k], 1), gout = r.o.reduce((s, k) => s * G[k], 1);
    r.din = r.i[0] === r.i[1] ? 2 : 1; r.dout = r.o.length === 2 && r.o[0] === r.o[1] ? 2 : 1;
    r.photo = r.o.length === 1;
    r.rev = r.photo ? (gin / gout) * Math.pow(mu(r.i[0], r.i[1]), 1.5) * CPH / r.din
      : (r.dout / r.din) * (gin / gout) * Math.pow(mu(r.i[0], r.i[1]) / mu(r.o[0], r.o[1]), 1.5);
    r.Q9 = r.Q / KB9;
  });
  const NR = R.length;
  // e± thermodynamics (g = 4), in units of T⁴
  function epm(z) {
    const n = 240, b = z + 48, hh = 48 / n; let sr = 0, sp = 0;
    for (let k = 0; k <= n; k++) {
      const x = z + k * hh, w = k === 0 || k === n ? 1 : k % 2 ? 4 : 2;
      const q = Math.sqrt(Math.max(0, x * x - z * z)), fd = 1 / (Math.exp(x) + 1);
      sr += w * x * x * q * fd; sp += w * q * q * q * fd;
    }
    return { rho: (2 / PI2) * sr * hh / 3, p: (2 / (3 * PI2)) * sp * hh / 3 };
  }
  const TT_N = 900, T_HI = 12, T_LO = 0.004;
  const tab = { lnT: new Float64Array(TT_N), Tnu: new Float64Array(TT_N), gs: new Float64Array(TT_N), rhoE: new Float64Array(TT_N) };

    const lnT = Math.log(T_HI) + (Math.log(T_LO) - Math.log(T_HI)) * k / (TT_N - 1);

  const q = QNP / ME, ALPHA = 1 / 137.036;
  const fermi = (e) => { const b = Math.sqrt(Math.max(1e-12, 1 - 1 / (e * e))); const y = 2 * Math.PI * ALPHA / b; return y / (1 - Math.exp(-y)); };
  let fPS = 0;
  { const n = 4000, hh = Math.sqrt(q - 1) / n;
    for (let k = 0; k <= n; k++) { const u = k * hh, e = 1 + u * u, w = k === 0 || k === n ? 1 : k % 2 ? 4 : 2; fPS += w * e * Math.sqrt(e * e - 1) * (q - e) * (q - e) * 2 * u * (COUL ? fermi(e) : 1); }
    fPS *= hh / 3; }

  for (let k = 0; k < TT_N; k++) {
    const T = Math.exp(tab.lnT[k]), Tn = tab.Tnu[k], z = ME / T, zn = ME / Tn;
    const emax = q + 60 / Math.min(z, zn) + 2, n = 600, hh = Math.sqrt(emax - 1) / n;
    let snp = 0, spn = 0;
    for (let j = 0; j <= n; j++) {
      const u = j * hh, e = 1 + u * u, w = j === 0 || j === n ? 1 : j % 2 ? 4 : 2;
      const ps = e * Math.sqrt(e * e - 1) * 2 * u, Fc = COUL ? fermi(e) : 1;

    const x = (lnT - tab.lnT[0]) / (tab.lnT[TT_N - 1] - tab.lnT[0]) * (TT_N - 1);
    if (x <= 0) return arr[0]; if (x >= TT_N - 1) return arr[TT_N - 1];

    const t = new Float64Array(TT_N), H = new Float64Array(TT_N);
    for (let k = 0; k < TT_N; k++) {
      const T = Math.exp(tab.lnT[k]), Tn = tab.Tnu[k], T4 = T * T * T * T;

    }
    t[0] = 1 / (2 * H[0]);
    for (let k = 1; k < TT_N; k++) t[k] = t[k - 1] + 0.5 * Math.log(tab.Tnu[k - 1] / tab.Tnu[k]) * (1 / H[k - 1] + 1 / H[k]);
    const lnt = new Float64Array(TT_N); for (let k = 0; k < TT_N; k++) lnt[k] = Math.log(t[k]);
    return { t, H, lnt };
  }
  function lnTofT(hist, lt) {
    const lnt = hist.lnt; let lo = 0, hi = TT_N - 1;
    if (lt <= lnt[0]) return tab.lnT[0]; if (lt >= lnt[hi]) return tab.lnT[hi];
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (lnt[m] < lt) lo = m; else hi = m; }
    const f = (lt - lnt[lo]) / (lnt[hi] - lnt[lo]); return tab.lnT[lo] + f * (tab.lnT[hi] - tab.lnT[lo]);
  }
  // the network: variable-step BDF2 with Newton iteration and an analytic Jacobian, on log-spaced time steps
  function run(opt) {
    const eta = opt.eta, Neff = opt.Neff, tau = opt.tau;
    const steps = opt.steps || 1200, tEnd = opt.tEnd || 1.2e4, nOut = Math.max(2, opt.nOut || 400);
    const hist = history(Neff);
    const lnTs = Math.log((opt.T9start || 30) * KB9);
    let ks = 0; while (ks < TT_N - 1 && tab.lnT[ks] > lnTs) ks++;
    const t0 = hist.t[ks];
    const Y = new Float64Array(NS), F = new Float64Array(NS), J = new Float64Array(NS * NS), Jm = new Float64Array(NS * NS), res = new Float64Array(NS);
    const Ym1 = new Float64Array(NS), base = new Float64Array(NS), Yold = new Float64Array(NS);
    const kf = new Float64Array(NR), kr = new Float64Array(NR);
    { const T = Math.exp(tab.lnT[ks]), r = Math.exp(-QNP / T); Y[0] = r / (1 + r); Y[1] = 1 / (1 + r); for (let s = 2; s < NS; s++) Y[s] = 1e-30; }
    let lNP = 0, lPN = 0, rho = 0;
    const setRates = (t) => {
      const lT = lnTofT(hist, Math.log(t)), T9 = Math.exp(lT) / KB9;
      rho = eta * 3.3675e4 * T9 * T9 * T9; // ρ_b = m_u η n_γ  [g cm⁻³]
      lNP = interpT(wNP, lT) / tau; lPN = interpT(wPN, lT) / tau;
      const w = pw(T9);
      for (let r = 0; r < NR; r++) {
        const re = R[r]; let f = re.f(T9, w); if (!(f > 0)) f = 0;
        kf[r] = f; const ex = re.Q9 / T9;
        kr[r] = ex > 600 ? 0 : re.photo ? f * re.rev * w.t32 * Math.exp(-ex) : f * re.rev * Math.exp(-ex);
      }
    };
    const rhs = (Yv, out, jac) => {
      out.fill(0); jac.fill(0);
      const wn = lNP * Yv[0], wp = lPN * Yv[1];
      out[0] += wp - wn; out[1] += wn - wp;
      jac[0] -= lNP; jac[NS] += lNP; jac[1] += lPN; jac[NS + 1] -= lPN;
      for (let r = 0; r < NR; r++) {
        const re = R[r], a = re.i[0], b = re.i[1], c = re.o[0], d = re.o[1], ph = re.photo;
        const cf = rho * kf[r] / re.din, cr = ph ? kr[r] : rho * kr[r] / re.dout;
        const net = cf * Yv[a] * Yv[b] - (ph ? cr * Yv[c] : cr * Yv[c] * Yv[d]);
        out[a] -= net; out[b] -= net; out[c] += net; if (!ph) out[d] += net;
        const add = (k, v) => { jac[a * NS + k] -= v; jac[b * NS + k] -= v; jac[c * NS + k] += v; if (!ph) jac[d * NS + k] += v; };
        if (a === b) add(a, 2 * cf * Yv[a]); else { add(a, cf * Yv[b]); add(b, cf * Yv[a]); }
        if (ph) add(c, -cr); else if (c === d) add(c, -2 * cr * Yv[c]); else { add(c, -cr * Yv[d]); add(d, -cr * Yv[c]); }
      }
    };
    const solve = (Am, bv) => {
      for (let c = 0; c < NS; c++) {
        let p = c, mx = Math.abs(Am[c * NS + c]);
        for (let r = c + 1; r < NS; r++) { const v = Math.abs(Am[r * NS + c]); if (v > mx) { mx = v; p = r; } }
        if (p !== c) { for (let k = 0; k < NS; k++) { const tmp = Am[c * NS + k]; Am[c * NS + k] = Am[p * NS + k]; Am[p * NS + k] = tmp; } const tb = bv[c]; bv[c] = bv[p]; bv[p] = tb; }
        const dd = Am[c * NS + c] || 1e-300;
        for (let r = c + 1; r < NS; r++) { const f = Am[r * NS + c] / dd; if (!f) continue; for (let k = c; k < NS; k++) Am[r * NS + k] -= f * Am[c * NS + k]; bv[r] -= f * bv[c]; }
      }
      for (let r = NS - 1; r >= 0; r--) { let s = bv[r]; for (let k = r + 1; k < NS; k++) s -= Am[r * NS + k] * bv[k]; bv[r] = s / (Am[r * NS + r] || 1e-300); }
    };
    const outT = new Float64Array(nOut), outY = new Float64Array(nOut * NS), outTemp = new Float64Array(nOut);
    const ltA = Math.log(opt.tOut0 || 0.5), ltB = Math.log(opt.tOut1 || tEnd);
    let oi = 0;
    const record = (tp, tc, Ya, Yb) => {
      const lp = Math.log(tp), lc = Math.log(tc);
      while (oi < nOut) {
        const lt = ltA + (ltB - ltA) * oi / (nOut - 1);
        if (lt > lc + 1e-12) break;
        const f = lc === lp ? 1 : Math.max(0, (lt - lp) / (lc - lp));
        outT[oi] = Math.exp(lt);
        for (let s = 0; s < NS; s++) { const a = Math.max(Ya[s], 1e-300), b = Math.max(Yb[s], 1e-300); outY[oi * NS + s] = Math.exp(Math.log(a) * (1 - f) + Math.log(b) * f); }
        outTemp[oi] = Math.exp(lnTofT(hist, lt));
        oi++;
      }
    };
    let t = t0, hPrev = 0, bad = 0;
    const lt0 = Math.log(t0), lt1 = Math.log(tEnd);
    record(t0, t0, Y, Y);
    for (let step = 1; step <= steps; step++) {
      const tn = Math.exp(lt0 + (lt1 - lt0) * step / steps), h = tn - t;
      setRates(tn);
      let beta = 1;
      if (hPrev > 0) { const om = h / hPrev, dd = 1 + 2 * om; beta = (1 + om) / dd; for (let s = 0; s < NS; s++) base[s] = ((1 + om) * (1 + om) / dd) * Y[s] - (om * om / dd) * Ym1[s]; }
      else for (let s = 0; s < NS; s++) base[s] = Y[s];
      for (let s = 0; s < NS; s++) { Ym1[s] = Y[s]; Yold[s] = Y[s]; }
      hPrev = h;
      const hb = h * beta;
      let err = 1;
      for (let it = 0; it < 30 && err > 1e-9; it++) {
        rhs(Y, F, J);
        for (let r = 0; r < NS; r++) { res[r] = base[r] + hb * F[r] - Y[r]; for (let c = 0; c < NS; c++) Jm[r * NS + c] = (r === c ? 1 : 0) - hb * J[r * NS + c]; }
        solve(Jm, res);
        err = 0;
        for (let s = 0; s < NS; s++) { let yn = Y[s] + res[s]; if (!(yn > 1e-40)) yn = 1e-40; const e = Math.abs(yn - Y[s]) / Math.max(yn, 1e-25); if (e > err) err = e; Y[s] = yn; }
      }
      if (!(err < 1e-6)) bad++;
      // renormalise baryon number (guards round-off and clamping)
      let sA = 0; for (let s = 0; s < NS; s++) sA += A[s] * Y[s];
      if (sA > 0 && isFinite(sA)) for (let s = 0; s < NS; s++) Y[s] /= sA; else { for (let s = 0; s < NS; s++) Y[s] = Yold[s]; bad++; }
      record(t, tn, Yold, Y);
      t = tn;
    }
    while (oi < nOut) { outT[oi] = Math.exp(ltA + (ltB - ltA) * oi / (nOut - 1)); for (let s = 0; s < NS; s++) outY[oi * NS + s] = Y[s]; outTemp[oi] = Math.exp(lnTofT(hist, Math.log(outT[oi]))); oi++; }
    const Hn = Y[1] + Y[0];
    return { t: outT, Y: outY, T: outTemp, hist, bad, t0,
      fin: { Yp: 4 * Y[5], DH: Y[2] / Hn, He3H: (Y[4] + Y[3]) / Hn, Li7H: (Y[6] + Y[7]) / Hn, Li7onlyH: Y[6] / Hn, Be7H: Y[7] / Hn } };
  }
  // gross forward and reverse fluxes (dY/dt per baryon) of every reaction at temperature T (MeV); last entry is n ⇄ p
  function flux(Tmev, Yv, eta, tau, fwd, rev) {
    const T9 = Tmev / KB9, lT = Math.log(Tmev), rho = eta * 3.3675e4 * T9 * T9 * T9, w = pw(T9);
    for (let r = 0; r < NR; r++) {
      const re = R[r]; let f = re.f(T9, w); if (!(f > 0)) f = 0;
      const ex = re.Q9 / T9, k = ex > 600 ? 0 : re.photo ? f * re.rev * w.t32 * Math.exp(-ex) : f * re.rev * Math.exp(-ex);
      fwd[r] = rho * f / re.din * Yv[re.i[0]] * Yv[re.i[1]];
      rev[r] = re.photo ? k * Yv[re.o[0]] : rho * k / re.dout * Yv[re.o[0]] * Yv[re.o[1]];
    }
    fwd[NR] = interpT(wNP, lT) / tau * Yv[0]; rev[NR] = interpT(wPN, lT) / tau * Yv[1];
  }
  return { run, history, lnTofT, interpT, flux, R, NAMES, A, NS, tab, wNP, wPN, KB9, QNP, ME, fPS };
}

const NOTES = `
<p>One second after the Big Bang, the universe is a ten-billion-kelvin soup of protons (amber), neutrons (blue-grey), electrons, positrons, neutrinos and light. The particles you see are a sample of that soup. Their numbers follow a real nuclear reaction network, solved in your browser reaction by reaction. The colour is a thermometer: white-hot at first, then amber, then embers.</p>
<p>Neutrons are the scarce ingredient. The weak force turns them into protons and back until about one second, then falls behind the expansion. After that, free neutrons simply decay, with a mean life of 878 seconds. Every neutron that lasts long enough ends up in helium.</p>
<p>Deuterium is the first step and the hardest. A proton and a neutron can stick, but there are 1.6 billion photons for every nucleon. While enough of them carry more than 2.2 MeV, each new deuteron is blasted apart. Watch the bright blue photons thin out. Near 0.08 MeV, about three and a half minutes in, the dam breaks, and within a minute almost every neutron is locked inside helium-4.</p>
<p>By twenty minutes the universe is too cool and too thin for fusion. It leaves the recipe we still find in the oldest gas: about 75% hydrogen and 25% helium by mass, a few parts in 100,000 of deuterium and helium-3, and a trace of lithium.</p>
<p><strong>Try this:</strong></p>
<ul>
<li>Press <em>Break the bottleneck</em> (<kbd>B</kbd>) and watch helium form in a rush. Tap any particle to see what it is.</li>
<li>Raise the baryon density η. Deuterium survives earlier and burns more completely, so D/H plummets. The measured D/H fixes η to about 1%.</li>
<li>Set N<sub>eff</sub> to 4. A fourth kind of neutrino speeds up the expansion and pushes helium outside the observed band. BBN counted the neutrino families before particle colliders did.</li>
<li>Look at the lithium panel of the Schramm plot. The prediction sits about three times above what old stars show. That is the lithium problem, and it is still open.</li>
</ul>`;

const SCIENCE = `
<h4>The network</h4>
<p>Eight species (n, p, D, ³H, ³He, ⁴He, ⁷Li, ⁷Be) are coupled by the n ⇄ p weak rates and 15 nuclear reactions: p(n,γ)D, D(p,γ)³He, D(n,γ)³H, D(D,n)³He, D(D,p)³H, ³H(D,n)⁴He, ³He(D,p)⁴He, ³He(n,p)³H, ³H(p,γ)⁴He, ³He(n,γ)⁴He, ³H(α,γ)⁷Li, ³He(α,γ)⁷Be, ⁷Be(n,p)⁷Li, ⁷Li(p,α)⁴He and ⁷Be(n,α)⁴He. With abundances Y<sub>i</sub> = n<sub>i</sub>/n<sub>b</sub>:</p>
<span class="eq">dY<sub>i</sub>/dt = Σ ρ<sub>b</sub>N<sub>A</sub>⟨σv⟩<sub>jk</sub>Y<sub>j</sub>Y<sub>k</sub> − Σ ρ<sub>b</sub>N<sub>A</sub>⟨σv⟩<sub>ik</sub>Y<sub>i</sub>Y<sub>k</sub></span>
<p>plus the photodissociation and weak terms, with</p>
<span class="eq">ρ<sub>b</sub> = m<sub>u</sub> η n<sub>γ</sub> = 3.37 × 10⁴ η T<sub>9</sub>³ g cm⁻³</span>
<p>Rates N<sub>A</sub>⟨σv⟩(T<sub>9</sub>) use the fits of Smith, Kawano &amp; Malaney (1993). Every reverse rate follows from detailed balance, with spin factors, reduced masses and Q-values. The <em>Reaction network</em> panel draws both directions of every reaction live, on a chart of nuclides. For deuterium photodissociation:</p>
<span class="eq">λ<sub>γ</sub>(D) = ⟨σv⟩<sub>np</sub> (g<sub>n</sub>g<sub>p</sub>/g<sub>D</sub>) (μkT/2πħ²)<sup>3/2</sup> e<sup>−B<sub>D</sub>/kT</sup></span>
<span class="eq">λ<sub>γ</sub>(D) = 4.71 × 10⁹ T<sub>9</sub><sup>3/2</sup> e<sup>−25.82/T<sub>9</sub></sup> N<sub>A</sub>⟨σv⟩<sub>np</sub> s⁻¹</span>
<h4>Solver</h4>
<p>The equations are stiff: at the start, deuterium photodissociation runs about 10¹⁵ times faster than the expansion. They are integrated with the variable-step BDF2 formula (second-order backward differentiation) and Newton iteration on an analytic Jacobian. The run takes 1,200 log-spaced steps from 0.11 s (3 × 10¹⁰ K) to 3.3 hours, which costs about 10 ms. Baryon number is conserved to round-off. The Schramm plot re-runs the whole network 106 times in a Web Worker.</p>
<h4>Weak freeze-out</h4>
<p>The six processes n + ν ⇄ p + e⁻, n + e⁺ ⇄ p + ν̄ and n ⇄ p + e⁻ + ν̄ are integrated over the electron and neutrino Fermi–Dirac distributions (Born approximation, with the Coulomb correction F(Z, E)). They are normalised so that the zero-temperature decay rate is exactly 1/τ<sub>n</sub>. With q = Q/m<sub>e</sub>, Q = 1.293 MeV and ε = E<sub>e</sub>/m<sub>e</sub>:</p>
<span class="eq">λ<sub>n→p</sub> = (1/τ<sub>n</sub> f) ∫<sub>1</sub><sup>∞</sup> ε√(ε²−1) [a(ε) + b(ε)] dε</span>
<span class="eq">a = (ε−q)² F(ε) / [(1+e<sup>−εz</sup>)(1+e<sup>(ε−q)z<sub>ν</sub></sup>)]</span>
<span class="eq">b = (ε+q)² / [(1+e<sup>εz</sup>)(1+e<sup>−(ε+q)z<sub>ν</sub></sup>)]</span>
<p>The first term covers n + ν → p + e⁻ and neutron decay, the second n + e⁺ → p + ν̄. λ<sub>p→n</sub> follows with q → −q. Here z = m<sub>e</sub>/kT, z<sub>ν</sub> = m<sub>e</sub>/kT<sub>ν</sub> and f = 1.69 is the decay phase-space integral. In equilibrium n/p = e<sup>−Q/kT</sup>. The rates drop below H near kT<sub>f</sub> ≈ 0.7 MeV, where e<sup>−Q/kT<sub>f</sub></sup> ≈ 1/6. The full integration freezes out gradually: n/p levels off near 1/5 by t ≈ 10 s, and decay brings it to about 1/7 by t ≈ 3.5 min, when deuterium finally survives. Nearly all of those neutrons end up in helium:</p>
<span class="eq">Y<sub>p</sub> ≈ 2(n/p) / (1 + n/p) ≈ 0.25</span>
<h4>Expansion</h4>
<span class="eq">H² = (8πG/3) [ρ<sub>γ</sub> + ρ<sub>e±</sub>(T) + ρ<sub>ν</sub>]</span>
<span class="eq">ρ<sub>ν</sub> = N<sub>eff</sub> (7/8)(π²/15) T<sub>ν</sub>⁴,&nbsp;&nbsp; H = 1.66 √g<sub>*</sub> T²/M<sub>Pl</sub></span>
<p>ρ<sub>e±</sub> and the pair entropy are integrated exactly. Neutrinos decouple before e⁺e⁻ annihilation, so entropy conservation gives T<sub>ν</sub>/T = [g<sub>s</sub>(T)/(11/2)]<sup>1/3</sup>, which falls to (4/11)<sup>1/3</sup> = 0.714 afterwards. Once the pairs are gone, t ≈ 1.32 s (MeV/kT)². The universe reaches 10⁹ K at 2.8 minutes.</p>
<h4>The deuterium bottleneck</h4>
<p>B<sub>D</sub> = 2.224 MeV, but there are 1/η ≈ 1.6 × 10⁹ photons per baryon. The number of photons per baryon energetic enough to split a deuteron is</p>
<span class="eq">N<sub>γ&gt;B</sub> ≈ η⁻¹ e<sup>−B/kT</sup> [(B/kT)² + 2B/kT + 2] / 2ζ(3)</span>
<p>It falls below 1 at kT ≈ 0.082 MeV (shown live in the readouts). Deuterium then accumulates, peaks at a mass fraction of 0.6% at t ≈ 4.1 min (kT ≈ 0.072 MeV), and is burned through ³H and ³He into ⁴He.</p>
<h4>Results at η₁₀ = 6.1, N<sub>eff</sub> = 3.044, τ<sub>n</sub> = 878.4 s</h4>
<p>Y<sub>p</sub> = 0.2447, D/H = 2.68 × 10⁻⁵, ³He/H = 1.05 × 10⁻⁵, ⁷Li/H = 4.3 × 10⁻¹⁰ (mostly as ⁷Be, which later captures an electron). Precision codes give Y<sub>p</sub> ≈ 0.247, D/H ≈ 2.5 × 10⁻⁵ and ⁷Li/H ≈ 4.7 × 10⁻¹⁰ (Fields et al. 2020). Each extra neutrino species adds about 0.0125 to Y<sub>p</sub>. The observed boxes are Y<sub>p</sub> = 0.245 ± 0.003, D/H = (2.527 ± 0.030) × 10⁻⁵ and the halo-star lithium plateau ⁷Li/H = (1.6 ± 0.3) × 10⁻¹⁰. η₁₀ = 273.9 Ω<sub>b</sub>h². The Planck CMB value is η₁₀ = 6.10 ± 0.06.</p>
<h4>What is simplified</h4>
<ul>
<li>A 15-reaction network with 1993-era rate fits. Modern evaluations, including the 2020 LUNA measurement of D(p,γ)³He, bring D/H down to about 2.5 × 10⁻⁵ at the same η.</li>
<li>Of the corrections to the weak rates, only the Coulomb one is included. Finite nucleon mass, the remaining radiative corrections and incomplete neutrino decoupling together add about 0.002 to Y<sub>p</sub>.</li>
<li>On screen, each dot is one of a few thousand nucleons in a sample. Species too rare to appear even once, such as the surviving D, ³He and ⁷Li, are shown as single tagged specimens with their true ratio. The short-lived deuterons that flicker before 3 minutes illustrate formation and photodissociation. They are not counted.</li>
<li>Colour is a thermometer, scaled down. The plasma, the nucleons and the photon streaks all take the blackbody colour of 1,250 K + T/(2.2 × 10⁶), so the soup cools from white-hot through amber to embers, and the photon sea reddens. The real radiation is gamma rays and hard X-rays. After fusion ends, free nucleons are dimmed so the helium stands out. The gold ring at the dam break marks the moment; it is not a physical shock.</li>
<li>Time runs on a warped logarithmic clock: brisk through the first three minutes, slow through the helium cascade.</li>
</ul>
<span class="cite">Alpher, R. A., Bethe, H. &amp; Gamow, G. (1948). The origin of chemical elements. Phys. Rev. 73, 803.</span>
<span class="cite">Wagoner, R. V., Fowler, W. A. &amp; Hoyle, F. (1967). On the synthesis of elements at very high temperatures. ApJ 148, 3.</span>
<span class="cite">Weinberg, S. (1977). The First Three Minutes. Basic Books.</span>
<span class="cite">Smith, M. S., Kawano, L. H. &amp; Malaney, R. A. (1993). Experimental, computational, and observational analysis of primordial nucleosynthesis. ApJS 85, 219.</span>
<span class="cite">Cyburt, R. H., Fields, B. D., Olive, K. A. &amp; Yeh, T.-H. (2016). Big bang nucleosynthesis: present status. Rev. Mod. Phys. 88, 015004.</span>
<span class="cite">Fields, B. D., Olive, K. A., Yeh, T.-H. &amp; Young, C. (2020). Big-Bang nucleosynthesis after Planck. JCAP 03, 010.</span>`;

function render(Tmev, nSpr, nLn) {

    Cosmos.gl.uniforms(gl, progDown, { uTex: src.tex, uTexel: [1 / src.w, 1 / src.h], uThresh: 0.75, uPre: k === 0 ? 1 : 0 });

}

      box = dir > 0 ? [lx, ly - 14, lx + tw, ly + 14] : [lx - tw, ly - 14, lx, ly + 14];
      if (!placed.some((b) => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) break;

  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), o3 = ctx.createOscillator();

function audioFrame(Tmev) {

  const TK = Tmev / 8.617333e-11;

  const ctx = ch.sound.ctx, t = ctx.currentTime + 0.005;
  const src = ctx.createBufferSource(); src.buffer = AUD.noiseBuf;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = kind === 5 ? 2600 + Math.random() * 1800 : 3000 + Math.random() * 4000; bp.Q.value = 2.5;
  const g = ctx.createGain(); const peak = kind === 5 ? 0.35 : kind === 0 ? 0.06 : kind === 2 ? 0.12 : 0.18;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + (kind === 5 ? 0.09 : 0.04));
  src.connect(bp); bp.connect(g); g.connect(ch.sound.out);
  src.start(t, Math.random() * 1.5, 0.12);
  if (kind === 5) { // a soft gold chime for helium
    const o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'sine'; o.frequency.value = PENTA[(Math.random() * PENTA.length) | 0];
    og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.05, t + 0.006); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(og); og.connect(ch.sound.out); o.start(t); o.stop(t + 0.75);
  }
}
// the dam breaks: a deep swell under the cascade of chimes
function boom() {
  const ctx = ch.sound.ctx; if (!ctx || !AUD.noiseBuf) return;
  const t = ctx.currentTime + 0.01;
  const o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(74, t); o.frequency.exponentialRampToValueAtTime(31, t + 2.2);
  og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.32, t + 0.08); og.gain.exponentialRampToValueAtTime(0.0001, t + 3.0);
  o.connect(og); og.connect(ch.sound.out); o.start(t); o.stop(t + 3.1);
  const src = ctx.createBufferSource(); src.buffer = AUD.noiseBuf;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2400, t); lp.frequency.exponentialRampToValueAtTime(160, t + 2.0);
  const ng = ctx.createGain(); ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.22, t + 0.05); ng.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
  src.connect(lp); lp.connect(ng); ng.connect(ch.sound.out); src.start(t, 0, 2.3);
}
ch.onSound((on) => { if (on) audioInit(); else if (AUD.amb) AUD.amb.out.gain.setTargetAtTime(0, ch.sound.ctx.currentTime, 0.1); });
if (ch.sound.enabled) audioInit();

/* ------------------------------------------------------------------------- main loop */
rebuild();
let lastReconT = -1, uiAcc = 1, deckAcc = 1, netAcc = 1, fpsAcc = 0, fpsN = 0, fps = 60, frameMs = 0;
setTimeout(() => startScan(), 350);
ch.loop((dt) => {
  const f0 = performance.now();
  now += dt;
  flushRun();
  // advance cosmic time
  const tBefore = Math.exp(lt);
  if (dt > 0 && !abDrag && !stripDrag) {
    if (lt < LT_MAX - 1e-6) lt = Math.min(LT_MAX, lt + lrate(lt) * speed * dt);
    else {
      holdT += dt;
      if (holdT > 1.2 && !endCard.classList.contains('on')) { buildEnd(); endCard.classList.add('on'); cap.classList.remove('on'); }
      if (loopOn && holdT > 16) { hideEnd(); replay(); }
    }
  }
  const t = Math.exp(lt);
  const Tmev = stateAt(t); T_NOW = Tmev;
  const dtCos = Math.max(0, t - tBefore);
  checkCaptions(t, tBefore);
  if (t !== lastReconT || dt > 0) { reconcile(dtCos, Tmev); lastReconT = t; }
  bottleneckFlicker(dt, Tmev);
  if (dt > 0) pairSparks(dt, Tmev);
  move(dt, Tmev);
  movePhotons(dt);
  pulse *= Math.exp(-dt * 1.6);
  updateZoom(dt, t);
  // render
  const nS = assemble(Tmev), nL = assembleLines(Tmev);
  render(Tmev, nS, nL);
  drawLabels(Tmev);
  drawProbeNucleus();
  audioFrame(Tmev);
  // UI (throttled)
  uiAcc += dt || 0.016; deckAcc += dt || 0.016;
  if (uiAcc > 0.08) {
    uiAcc = 0;
    hudT.set(fmtClock(t));
    hudTemp.set(fmtK(Tmev) + ' · ' + Tmev.toFixed(3) + ' MeV');
    hudNP.set(npStr(XS[0] / XS[1]));
    const nb = nAboveB(Tmev); hudNB.set((nb > 1e5 ? FM.sci(nb, 2) : nb >= 10 ? FM.num(nb, 0) : nb >= 0.01 ? nb.toFixed(2) : FM.sci(nb, 1)) + ' per nucleon');
    hudHe.set((XS[5] * 100).toFixed(XS[5] < 0.001 ? 4 : 2) + '%');
    rebuildLists();
    censusEls.forEach((o) => { const v = cnt[o.s]; o.b.textContent = FM.num(v); o.el.classList.toggle('zero', v === 0); });
    if (!sT.input.matches(':active')) sT.set(t);
    drawStrip();
    drawClock(Tmev);
  }
  netAcc += dt || 0.016; if (netAcc > 1 / 30) { drawNet(Tmev, netAcc); netAcc = 0; }
  if (deckAcc > 0.1) { deckAcc = 0; drawAbund(); schAcc++; if (schrammDirty || schAcc > 8) { schAcc = 0; if (drawSchramm() !== false) schrammDirty = SC.busy; } }
  fpsAcc += dt; fpsN++; if (fpsAcc > 1) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  frameMs = frameMs * 0.9 + (performance.now() - f0) * 0.1;
}, { always: true });

/* ------------------------------------------------------------------------- debug */
Cosmos.debug.state = () => {
  const f = RUN.fin, t = Math.exp(lt);
  rebuildLists();
  return {
    t: +t.toFixed(3), kT_MeV: +T_NOW.toFixed(5), T_K: +(T_NOW / 8.617333e-11).toExponential(3), n_over_p: +(XS[0] / XS[1]).toFixed(5),
    X: Object.fromEntries(eng.NAMES.map((n, i) => [n, +XS[i].toExponential(3)])),
    eta: P.eta, Neff: P.Neff, tau_n: P.tau,
    final: { Yp: +f.Yp.toFixed(5), DH: +f.DH.toExponential(4), He3H: +f.He3H.toExponential(4), Li7H: +f.Li7H.toExponential(4) },
    key: { tBreak: +KEY.tBreak.toFixed(1), tDpeak: +KEY.tDpeak.toFixed(1), tDone: +KEY.tDone.toFixed(1), tNgammaB1: +KEY.tNB1.toFixed(1), np10s: +KEY.np10.toFixed(4) },
    N_gamma_gt_B: nAboveB(T_NOW), runMs: +runMs.toFixed(2), engineInitMs: +ENGINE_MS.toFixed(1), solverBadSteps: RUN.bad,
    onScreen: { n: cnt[0], p: cnt[1], D: cnt[2], T: cnt[3], He3: cnt[4], He4: cnt[5], specimens: Array.from(cntSpec).reduce((a, b) => a + b, 0) },
    events: Object.assign({}, EV), scan: { done: SC.main.filter(Boolean).length, busy: SC.busy, worker: !!scanWorker },
    fps: +fps.toFixed(1), frameMs: +frameMs.toFixed(2), hdr: !!HDR,
  };
};
Cosmos.debug.setT = (t) => { setLt(Math.log(t), true); return Math.exp(lt); };
Cosmos.debug.params = (eta, Neff, tau) => { preset(eta || P.eta, Neff || P.Neff, tau || P.tau, 'debug'); return RUN.fin; };
Cosmos.debug.speed = (s) => { speed = s; sSpeed.set(s); return speed; };
Cosmos.debug.pause = (b) => { ch.setPaused(!!b); return ch.paused; };
Cosmos.debug.frame = (t, secs) => { setLt(Math.log(t), true); const s0 = now; return new Promise((res) => { const f = () => { if (now - s0 >= (secs || 1.2)) { ch.setPaused(true); res(+Math.exp(lt).toFixed(2)); } else requestAnimationFrame(f); }; f(); }); };
console.info('[nucleosynthesis] network ready in ' + ENGINE_MS.toFixed(0) + ' ms · Y_p = ' + RUN.fin.Yp.toFixed(4) + ', D/H = ' + RUN.fin.DH.toExponential(3) + ', ⁷Li/H = ' + RUN.fin.Li7H.toExponential(3));
})();
