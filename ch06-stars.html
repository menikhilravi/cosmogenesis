<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Lives of Stars · Cosmogenesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="cosmos.css">
<style>
  /* ---- phase caption (top centre) ---- */
  .st-cap {
    position: fixed; z-index: 15; left: 50%; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 12px);
    transform: translateX(-50%); width: min(560px, calc(100vw - 2 * var(--gutter) - 660px));
    min-width: 300px; text-align: center; pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.9);
    transition: opacity .6s var(--ease), margin-top .5s var(--ease);
  }
  .st-cap.toasted { margin-top: 42px; }
  .st-cap b { display: block; font: 600 10.5px/1.2 var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--era); margin-bottom: 5px; }
  .st-cap .st-ph { display: block; font: italic 500 clamp(21px, 2.4vw, 30px)/1.1 var(--f-display); color: var(--star); letter-spacing: -.005em; }
  .st-cap .st-desc { display: block; margin-top: 7px; font: 400 13.5px/1.45 var(--f-ui); color: #cfc8b8; text-wrap: balance; }
  .st-cap.swap .st-ph, .st-cap.swap .st-desc { animation: st-in .9s var(--ease) both; }
  @keyframes st-in { from { opacity: 0; transform: translateY(-5px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  body.cz-cinema .st-cap .st-desc { opacity: 0; }

  /* ---- big-number clock (bottom centre) ---- */
  .st-clock {
    position: fixed; z-index: 14; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--foot-h) + env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; gap: 26px; align-items: flex-end; pointer-events: none;
    font: 500 11px/1.25 var(--f-mono); color: var(--dust); text-shadow: 0 1px 10px rgba(0,0,0,.95);
  }
  .st-clock div { display: grid; gap: 3px; text-align: center; }
  .st-clock small { font: 600 9.5px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  .st-clock b { font: 500 20px/1.1 var(--f-mono); color: var(--star); font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
  .st-clock b em { font-style: normal; color: var(--era); font-size: 13px; margin-left: 3px; }
  .st-clock .st-countdown b { color: #ffb38a; }
  .st-clock .st-countdown { display: none; }
  .st-clock.cd .st-countdown { display: grid; }
  body.cz-cinema .st-clock { opacity: .0; }

  /* ---- scale bar (drawn in overlay canvas; label here for crisp text) ---- */
  .st-ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ---- deck extras ---- */
  .st-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .st-presets .cz-btn { padding: 7px 4px; font-size: 11.5px; display: grid; gap: 2px; justify-items: center; }
  .st-presets .cz-btn small { font: 500 9.5px/1 var(--f-mono); color: var(--faint); letter-spacing: .04em; }
  .st-presets .cz-btn[aria-pressed="true"] small { color: var(--era); }
  .st-ribbon { cursor: pointer; touch-action: none; }
  .st-hrwrap { position: relative; }
  .st-hrwrap canvas { cursor: crosshair; }
  .st-legend { display: flex; flex-wrap: wrap; gap: 5px 10px; font: 500 10px/1.2 var(--f-mono); color: var(--dust); }
  .st-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .st-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .st-ptmini { cursor: pointer; }

  /* ---- periodic table overlay ---- */
  .st-pt {
    position: fixed; inset: 0; z-index: 42; display: grid; place-items: center; padding: 70px 16px 70px;
    background: rgba(4, 5, 10, .72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .45s var(--ease);
  }
  .st-pt.on { opacity: 1; pointer-events: auto; }
  .st-pt > .cz-panel { width: min(1080px, 100%); max-height: 100%; overflow: auto; padding: 18px 20px 16px; display: grid; gap: 12px; }
  .st-pt-head { display: flex; align-items: flex-start; gap: 16px; }
  .st-pt-head h3 { margin: 0; font: italic 500 28px/1.05 var(--f-display); }
  .st-pt-head p { margin: 4px 0 0; color: var(--dust); font-size: 13px; max-width: 70ch; }
  .st-pt-head .cz-icon { margin-left: auto; flex: none; }
  .st-grid { display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 3px; }
  .st-el {
    position: relative; aspect-ratio: 1 / 1.08; border-radius: 4px; overflow: hidden; background: rgba(255,255,255,.03);
    border: 1px solid rgba(236,230,214,.08); cursor: default; min-width: 0;
    transition: box-shadow .5s var(--ease), border-color .5s var(--ease), transform .3s var(--ease), filter .5s;
  }
  .st-el .st-fill { position: absolute; inset: 0; display: flex; flex-direction: column-reverse; opacity: .62; transition: opacity .5s; }
  .st-el .st-fill i { display: block; width: 100%; }
  .st-el b { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-46%); text-align: center; font: 600 clamp(9px, 1.25vw, 15px)/1 var(--f-ui); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .st-el small { position: absolute; left: 3px; top: 2px; font: 500 clamp(6px, .62vw, 8.5px)/1 var(--f-mono); color: rgba(255,255,255,.75); text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .st-el.none { background: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 3px, transparent 3px 6px); }
  .st-el.none b { color: var(--faint); text-shadow: none; }
  .st-grid.dim .st-el:not(.lit) { filter: saturate(.25) brightness(.55); }
  .st-el.lit { border-color: var(--era); box-shadow: 0 0 0 1px var(--era), 0 0 18px rgba(255,224,138,.55); transform: translateY(-1px); z-index: 1; }
  .st-el.lit .st-fill { opacity: .95; }
  .st-el.maybe { border-color: rgba(236,230,214,.5); border-style: dashed; }
  .st-el:hover { border-color: var(--star); z-index: 2; }
  .st-gap { visibility: hidden; }
  .st-pt-foot { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; justify-content: space-between; }
  .st-pt-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 500 11px/1.2 var(--f-mono); color: var(--dust); }
  .st-pt-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .st-pt-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .st-pt-info { font: 500 12px/1.4 var(--f-mono); color: var(--star); min-height: 1.4em; }
  .st-pt-info em { color: var(--era); font-style: normal; }
  .st-pt-status { font: italic 400 16px/1.35 var(--f-display); color: var(--era); }

  /* ---- end card ---- */
  .st-end {
    position: fixed; z-index: 16; right: calc(var(--gutter) + 320px); bottom: calc(var(--foot-h) + env(safe-area-inset-bottom, 0px) + 96px);
    width: 290px; padding: 14px 16px; display: grid; gap: 8px; opacity: 0; pointer-events: none; transform: translateY(8px);
    transition: opacity .8s var(--ease), transform .8s var(--ease);
  }
  .st-end.on { opacity: 1; pointer-events: auto; transform: none; }
  .st-end small { font: 600 9.5px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
  .st-end h4 { margin: 0; font: italic 500 21px/1.15 var(--f-display); color: var(--star); }
  .st-end p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--dust); }
  .st-end .cz-btns { margin-top: 2px; }
  body.cz-cinema .st-end { opacity: 0; pointer-events: none; }

  @media (max-width: 1100px) and (min-width: 761px) {
    .st-cap { width: calc(100vw - 690px); min-width: 0; }
    .st-cap .st-desc { display: none; }
    .st-clock { left: var(--gutter); transform: none; bottom: calc(var(--foot-h) + env(safe-area-inset-bottom, 0px) + 128px); }
    .st-clock div { text-align: left; }
    .st-clock .st-rate { display: none; }
    .st-end { right: calc(var(--gutter) + 320px); }
  }
  @media (max-width: 760px) {
    .st-cap { top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 96px); width: calc(100vw - 24px); min-width: 0; }
    .st-clock .st-rate { display: none; }
    .st-cap .st-ph { font-size: 20px; }
    .st-cap .st-desc { font-size: 12px; display: none; }
    .st-clock { gap: 14px; left: var(--gutter); transform: none; bottom: calc(var(--foot-h) + env(safe-area-inset-bottom, 0px) + 112px); }
    .st-clock div { text-align: left; }
    .st-clock b { font-size: 15px; }
    .st-end { left: var(--gutter); right: var(--gutter); width: auto; bottom: calc(var(--foot-h) + env(safe-area-inset-bottom, 0px) + 112px); }
    .cz-deck.cz-open ~ .st-end, .cz-deck.cz-open ~ .st-cap, .cz-deck.cz-open ~ .st-clock { display: none; }
    .st-pt { padding: 56px 8px 60px; }
    .st-pt > .cz-panel { padding: 12px 10px; }
    .st-grid { gap: 1.5px; }
    .st-el small { display: none; }
    .st-pt-head h3 { font-size: 22px; }
  }
  body.st-deck-open-small .st-clock { display: none; }
</style>

/* Evaluate the track at continuous parameter s ∈ [0, nSeg]. Writes into out (no allocation). */

  out.m = sg.code === 'shock' ? a.m : a.m + (b.m - a.m) * u;

    // ~135,000 K from the old surface, fading within hours as the ejecta expand and cool
    const k = Math.exp(-u * 25);
    out.logL = Math.max(out.logL, a.logL + 1.9 * k); out.logT += 0.53 * k;
  }

  if (sg.geo != null && a.age - sg.geo > 0) out.age = sg.geo + (a.age - sg.geo) * Math.pow((b.age - sg.geo) / (a.age - sg.geo), u);

function sAtAge(T, age) {

  let lo = 0, hi = n; while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (P[mid].age <= age) lo = mid; else hi = mid; }

const NOTES = `
<p>This is a star drawn from its physics. Its colour is the glow of its surface temperature. The dim rim is limb darkening, where you see shallower, cooler gas. The boiling cells are convection, sized by the star’s surface gravity. It opens on the Sun as it is today, 4.6 billion years in and halfway through its life. Let it run and watch it swell into a red giant that reaches for Earth’s orbit.</p>
<p>A star is a truce between gravity pulling in and hot gas pushing out. Mass sets the terms. A red dwarf sips its hydrogen for trillions of years. A star of 20 suns burns through its hydrogen in about 8 million.</p>
<p>When a fuel runs out, the core shrinks and heats until its ash ignites. Hydrogen becomes helium, helium becomes carbon and oxygen. The Sun stops there. It swells into a red giant that swallows Mercury and Venus, puffs its envelope into a glowing nebula, and ends as a white dwarf the size of Earth. Heavier stars press on through neon, oxygen and silicon to iron, and then the core collapses in less than a second.</p>
<p>Those deaths built the periodic table. The carbon in your cells came mostly from dying Sun-like stars. The oxygen you breathe came from exploding massive ones. The gold in a ring came largely from colliding neutron stars.</p>
<h4>Try this</h4>
<ul>
<li>Press <strong>Go supernova</strong> or <kbd>S</kbd> and watch the onion shells ignite one by one, then the collapse.</li>
<li>Drag <strong>Cluster age</strong> under the HR diagram. The main sequence peels away from the top, which is how astronomers date star clusters.</li>
<li>At the end of a life, watch the new elements drift out with the gas, then open the periodic table with <kbd>T</kbd> to see everything that star gave back.</li>
<li>Click any dot in the cluster on the HR diagram to follow that star from its current age.</li>
</ul>`;

const SCIENCE = `
<h4>Structure</h4>
<p>A star is a self-gravitating ball of gas in hydrostatic equilibrium, with every layer supported by the pressure below it:</p>
<span class="eq">dP/dr = − G m(r) ρ / r²,&nbsp;&nbsp; dm/dr = 4π r² ρ</span>
<p>Its surface obeys the Stefan–Boltzmann law, which is how this page computes the radius from each point on a track:</p>
<span class="eq">L = 4π R² σ T<sub>eff</sub><sup>4</sup></span>
<p>On the main sequence, luminosity climbs steeply with mass, roughly L ∝ M<sup>3.5</sup> for Sun-like to intermediate stars, flattening toward L ∝ M at the top. Fuel scales with M, so the lifetime falls fast:</p>
<span class="eq">t<sub>MS</sub> ≈ 10<sup>10</sup> yr · (M / M<sub>☉</sub>)<sup>−2.5</sup></span>
<h4>The evolution model</h4>
<p>The engine holds a table of key phases for 21 grid masses from 0.1 to 100 M<sub>☉</sub> at solar metallicity: zero-age and terminal-age main sequence, subgiant, red-giant base and tip, helium flash or quiet ignition, clump or blue loop, early and thermally pulsing AGB, post-AGB, planetary nebula and white-dwarf cooling; for massive stars the blue and red supergiant phases, Luminous Blue Variable and Wolf–Rayet stripping, and the carbon, neon, oxygen and silicon stages. Values are matched by hand to MIST and Geneva tracks. For example, the Sun starts at 0.71 L<sub>☉</sub> and 5,600 K and leaves the main sequence near 10 Gyr, and a 20 M<sub>☉</sub> star leaves it at 8.1 Myr. Any other mass interpolates between grid tracks in log M, with phase durations interpolated in log time.</p>
<p>Time runs phase-weighted: every phase gets a few seconds of screen time, whether it lasts 10 billion years or 11 days. The age readout is always the real age. For a 25 M<sub>☉</sub> star the stages last: H 6.7 Myr, He 0.84 Myr, C 522 yr, Ne 0.89 yr, O 0.40 yr, Si 0.73 days (Woosley, Heger &amp; Weaver 2002).</p>
<h4>Nuclear burning</h4>
<span class="eq">4 ¹H → ⁴He + 2e⁺ + 2ν<sub>e</sub> &nbsp;(26.7 MeV)</span>
<p>Below about 1.3 M<sub>☉</sub> the pp chain dominates (ε ∝ T<sup>4</sup>). In hotter cores the CNO cycle takes over, using carbon, nitrogen and oxygen as catalysts (ε ∝ T<sup>≈17</sup>). That steep temperature dependence concentrates the energy release and makes massive-star cores convective. Helium burns by the triple-alpha process at about 10<sup>8</sup> K through the ⁸Be bottleneck and Hoyle’s 7.65 MeV resonance in carbon, and then ¹²C(α,γ)¹⁶O:</p>
<span class="eq">3 ⁴He → ¹²C + 7.27 MeV</span>
<p>Binding energy per nucleon peaks in the iron group, near ⁵⁶Fe and ⁶²Ni. Past that point fusion absorbs energy, so a massive star’s iron core can only grow until it collapses.</p>
<h4>Limits and remnants</h4>
<span class="eq">M<sub>Ch</sub> ≈ 5.83 μ<sub>e</sub><sup>−2</sup> M<sub>☉</sub> ≈ 1.46 M<sub>☉</sub> &nbsp;(μ<sub>e</sub> = 2)</span>
<p>White dwarfs are held up by electron degeneracy pressure and cannot exceed the Chandrasekhar mass, about 1.4 M<sub>☉</sub> once corrections for Coulomb forces and general relativity are included. Their radius follows R ≈ 0.0112 R<sub>☉</sub> [(M/M<sub>Ch</sub>)<sup>−2/3</sup> − (M/M<sub>Ch</sub>)<sup>2/3</sup>]<sup>1/2</sup> (Nauenberg 1972), about Earth’s size for 0.6 M<sub>☉</sub>. White-dwarf masses follow the initial–final mass relation of Cummings et al. (2018). Neutron stars are held up by neutron degeneracy and nuclear forces up to the Tolman–Oppenheimer–Volkoff limit, about 2.2 to 2.3 M<sub>☉</sub>. Heavier cores become black holes. In this model stars above 22 M<sub>☉</sub> leave black holes. Real outcomes are patchier, with “islands of explodability”.</p>
<h4>What you are seeing</h4>
<p>Surface colour is a blackbody at T<sub>eff</sub>. Limb darkening follows I(μ) = 1 − a(1 − μ) − b(1 − μ)², with stronger darkening for cooler stars. Granule size tracks the pressure scale height H<sub>p</sub> = kT / (μ m<sub>H</sub> g), so the number of cells across the disc scales as R/H<sub>p</sub> ∝ M / (T<sub>eff</sub> R). Real solar granules are about 1,000 km across, a million of them on the disc; they are drawn far larger here, but the ratio between stars is kept. A red supergiant has only a handful of cells (Schwarzschild 1975). Stars hotter than about 8,000 K have no surface convection zone. The faint mottling drawn on them stands for the turbulence stirred by a deeper convection zone near 150,000 K, where iron opacity peaks (Cantiello et al. 2009). Their winds are pushed by light acting on spectral lines, a process that is unstable, so the outflow breaks into dense clumps.</p>
<p>A core-collapse shock takes about a day to cross a red supergiant. When it breaks out, the surface flashes at about 10<sup>11</sup> L<sub>☉</sub> and over 100,000 K for a few hours; the photospheric radii on the readout follow from L and T<sub>eff</sub>. Around a young pulsar, its wind of particles and field blows a synchrotron nebula with an equatorial torus and polar jets, as Chandra images of the Crab show.</p>
<p>Planet orbits are to scale. They widen as the star loses mass (a ∝ 1/M). A planet counts as engulfed once the star grows past its original orbit, a simple stand-in for the tidal drag that Schröder &amp; Smith (2008) found would pull Earth in.</p>
<h4>Spectrum</h4>
<p>The spectrum panel draws the Planck curve, B<sub>λ</sub> ∝ λ<sup>−5</sup> / (e<sup>hc/λkT</sup> − 1), which peaks at λ<sub>max</sub> = 2.898 mm·K / T (Wien’s law), plus the absorption lines that define the spectral classes: helium in O and B stars, hydrogen’s Balmer lines peaking in A stars near 9,500 K, ionised calcium and sodium in cooler stars, and titanium-oxide bands in M stars. Line depths are schematic.</p>
<h4>Sound</h4>
<p>With sound on, the star sings its own p-modes, acoustic waves trapped inside it. The comb of modes sits around ν<sub>max</sub> with spacing Δν:</p>
<span class="eq">ν<sub>max</sub> ≈ 3090 µHz · (M/M<sub>☉</sub>)(R/R<sub>☉</sub>)<sup>−2</sup>(T<sub>eff</sub>/5777 K)<sup>−1/2</sup>,&nbsp; Δν ≈ 135 µHz · (M/M<sub>☉</sub>)<sup>1/2</sup>(R/R<sub>☉</sub>)<sup>−3/2</sup></span>
<p>Frequencies are raised into hearing by f = 330 Hz · (ν<sub>max</sub>/ν<sub>max,☉</sub>)<sup>0.28</sup>, which keeps their order but squeezes a range of about 10<sup>8</sup> in ν<sub>max</sub> into five and a half octaves. Giants hum low and dwarfs chirp high. A pulsar plays its real spin rate.</p>
<h4>The HR diagram and clusters</h4>
<p>Behind the live track, 3,000 stars are drawn from the Kroupa (2001) initial mass function, dN/dM ∝ M<sup>−1.3</sup> below 0.5 M<sub>☉</sub> and M<sup>−2.3</sup> above, with 30% unresolved binaries. All are the same age. Stars heavier than the turn-off mass have already left the main sequence, so the turn-off dates the cluster.</p>
<h4>Origins of the elements</h4>
<p>Burbidge, Burbidge, Fowler and Hoyle (B²FH) named the processes in 1957. Hydrogen burning, helium burning and the α-process build light and α-elements in stars. The e-process (nuclear statistical equilibrium) builds the iron peak. The s-process, slow neutron capture in AGB stars, and the r-process, rapid capture now tied to neutron-star mergers such as GW170817, build the heavy elements. The table follows Jennifer Johnson’s 2019 version. Its fractions are rounded here.</p>
<h4>Simplified</h4>
<p>This model covers single, non-rotating stars at solar metallicity. Most massive stars have companions that strip or merge them. Nebula shapes are schematic, and remnants are not to scale inside their nebulae. The cutaway enlarges the core, and its labels give true mass coordinates.</p>

/* =====================================================================
   5. SHADERS
   ===================================================================== */
const GLSL_COMMON = `
float h11(float n){ return fract(sin(n)*43758.5453123); }
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec3 h33(vec3 p){ p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6))); return fract(sin(p)*43758.5453123); }
float vnoise(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float n=i.x+i.y*57.+113.*i.z;
  return mix(mix(mix(h11(n),h11(n+1.),f.x),mix(h11(n+57.),h11(n+58.),f.x),f.y),mix(mix(h11(n+113.),h11(n+114.),f.x),mix(h11(n+170.),h11(n+171.),f.x),f.y),f.z); }
float fbm3(vec3 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
`;

/* --- background sky: procedural stars, a faint Milky Way, optional gravitational lensing --- */
const FS_BG = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform float uTime; uniform vec2 uLensC; uniform float uLensR; uniform float uDim; uniform float uDpr;
${GLSL_COMMON}
vec3 stars(vec2 px, float cell, float thr, float gain){
  vec2 g=px/cell, id=floor(g), f=fract(g);
  vec3 c=vec3(0.);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 cid=id+vec2(i,j); float n=h21(cid);
    if(n<thr) continue;
    vec2 off=vec2(h21(cid+.37),h21(cid+.71));
    vec2 d=(vec2(i,j)+off-f)*cell;
    float b=pow((n-thr)/(1.-thr),3.)*gain;
    float t=h21(cid+2.3);
    vec3 col=mix(vec3(1.,.74,.52),vec3(.72,.82,1.),t); col=mix(col,vec3(1.),.35);
    float tw=.8+.2*sin(uTime*(.7+2.*h21(cid+5.1))+n*50.);
    float r2=dot(d,d)/(uDpr*uDpr);
    c+=col*b*tw*(exp(-r2*1.3)+.02*exp(-r2*.08));
  }
  return c;
}
void main(){
  vec2 px=gl_FragCoord.xy;
  if(uLensR>0.){ vec2 th=px-uLensC; float r=max(length(th),1e-3); vec2 beta=th*(1.-uLensR*uLensR/(r*r)); px=uLensC+beta; }
  vec3 c=stars(px, 34.*uDpr, .86, 2.6)+stars(px+vec2(311.,97.), 13.*uDpr, .93, 1.1)+stars(px+vec2(71.,413.), 7.*uDpr, .965, .55);
  vec2 q=px/uRes.y;
  float band=exp(-pow((q.y-.62+.35*(q.x-.9)*.6)*2.6,2.));
  float neb=fbm3(vec3(q*3.,.3))*fbm3(vec3(q*7.+3.,1.7));
  c+=band*neb*vec3(.10,.085,.075)*.55+band*.006*vec3(.6,.62,.8);
  c+=vec3(.004,.005,.012);
  o=vec4(c*uDim,1.);
}`;

/* --- the star: granulation, spots, limb darkening, chromosphere, corona, winds, cutaway --- */
const FS_STAR = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform vec2 uC; uniform float uRpx; uniform float uTime;
uniform vec3 uCol, uColLimb, uColHot; uniform float uBright, uCells, uGran, uSpots, uLimbA, uLimbB;
uniform float uCorona, uChromo, uWind, uDust, uGlow, uRot, uSeed, uPtI, uNS, uHotspot;
uniform float uCut; uniform int uNZ; uniform float uZr[8]; uniform vec3 uZc[8]; uniform float uZconv[8]; uniform float uZburn[8];
uniform float uShock, uCrystal, uFlashCore, uDpr, uSN, uHotTex, uHotScale;
${GLSL_COMMON}
vec2 worley(vec3 p, float t){
  vec3 id=floor(p), f=fract(p); float d1=8., d2=8.;
  for(int z=-1;z<=1;z++) for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec3 g=vec3(x,y,z); vec3 h=h33(id+g);
    vec3 of=.5+.36*sin(t*(.5+.6*h)+6.2831*h);
    vec3 r=g+of-f; float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; } else if(d<d2) d2=d;
  }
  return vec2(sqrt(d1), sqrt(d2));
}
mat3 rotY(float a){ float c=cos(a), s=sin(a); return mat3(c,0.,-s, 0.,1.,0., s,0.,c); }
mat3 rotX(float a){ float c=cos(a), s=sin(a); return mat3(1.,0.,0., 0.,c,s, 0.,-s,c); }
vec3 interior(vec2 d, float r){
  float ang=atan(d.y,d.x);
  int zi=0; float rin=0., rout=1.;
  for(int i=0;i<8;i++){ if(i>=uNZ) break; if(r<uZr[i]){ zi=i; rout=uZr[i]; break; } rin=uZr[i]; zi=i; }
  vec3 col=uZc[0]; float conv=0., burn=0.;
  for(int i=0;i<8;i++){ if(i==zi){ col=uZc[i]; conv=uZconv[i]; burn=uZburn[i]; } }
  float depth=1.-r;
  vec3 c=col*(.30+.30*depth)*(zi==uNZ-1&&uNZ>2?.62:1.);
  float t=uTime;
  if(conv>.5){
    float sw=fbm3(vec3(r*14.-t*.35, ang*5.+sin(r*9.+t*.4)*.6, t*.12));
    float cells=sin(ang*18.+r*26.+sw*7.-t*.8)*.5+.5;
    c*=.72+.55*sw+.18*cells;
  } else {
    c*=.9+.1*sin(r*260.)*(.6+.4*sin(ang*3.));
  }
  if(burn>0.){ float pulse=.8+.2*sin(t*4.+r*20.); float rim=exp(-pow((rout-r)*uRpx/(3.*uDpr+.012*uRpx),2.)); c+=col*burn*pulse*(.25+1.6*rim); if(burn>1.){ c+=(col*1.5+vec3(1.,.9,.7))*(burn-1.)*(.6+.4*sin(t*23.)); } }
  if(uCrystal>0.&&r<uCrystal*.85){ vec2 g=fract(d*60.)-.5; c+=vec3(.5,.7,1.)*.25*smoothstep(.45,.5,max(abs(g.x),abs(g.y))); }
  for(int i=0;i<8;i++){ if(i>=uNZ-1) break; float e=abs(r-uZr[i]); c*=1.-.55*exp(-e*e*uRpx*uRpx/(uDpr*uDpr)*.5); }
  if(uShock>0.){
    float rcore=uZr[0]*(1.-smoothstep(0.,.3,uShock));
    float rs=uZr[0]+(1.-uZr[0])*smoothstep(.15,1.,uShock);
    if(r<uZr[0]) c=mix(c, vec3(0.02), 1.-step(r,rcore));
    c+=vec3(.8,.9,1.)*1.6*exp(-pow((r-rs)*40.,2.))*step(.12,uShock);
    c+=vec3(.7,.8,1.)*2.*exp(-r*r*900.)*(1.-smoothstep(.1,.5,uShock));
  }
  c+=vec3(1.,.8,.5)*.35*exp(-r*r*uRpx*uRpx/(900.*uDpr*uDpr))*step(uShock,0.);
  // wedge faces: soft shading along the cut edges
  float edge=min(abs(d.y), abs(sin(ang-uCut*1.5708)*r));
  c*=.82+.18*smoothstep(0.,.05,edge);
  return c;
}
void main(){
  vec2 p=gl_FragCoord.xy-uC;
  float R=max(uRpx, .001);
  vec2 d=p/R; float r=length(d);
  if(uSN>0.){ float an=atan(d.y,d.x); float rf=1.+.07*(fbm3(vec3(cos(an)*3.,sin(an)*3.,uTime*.15))-.5)+.03*(fbm3(vec3(cos(an)*9.,sin(an)*9.,uTime*.2))-.5); d/=rf; r/=rf; }
  vec3 c=vec3(0.); float a=0.; o=vec4(0.);
  // point-source rendering when the disc is tiny
  if(uRpx<2.5*uDpr){
    float q=length(p)/(1.2*uDpr);
    c+=uColHot*uPtI*(exp(-q*q)*1.4+.12*exp(-q*.8)+.02/(1.+q*q*.02));
    vec2 ap=abs(p)/uDpr; c+=uColHot*uPtI*.35*(exp(-ap.y/.7)*exp(-ap.x/16.)+exp(-ap.x/.7)*exp(-ap.y/16.));
    o=vec4(c,0.); return;
  }
  if(r<1.){
    float ang=atan(d.y,d.x);
    if(uCut>0.&&ang>0.&&ang<uCut*1.5708){ o=vec4(interior(d,r),1.); return; }
    float mu=sqrt(max(0.,1.-r*r));
    vec3 n=rotX(.35)*rotY(uRot)*vec3(d.x,d.y,mu);
    float t=uTime;
    float I=1.-uLimbA*(1.-mu)-uLimbB*(1.-mu)*(1.-mu);
    float g=0.;
    if(uGran>0.){
      vec3 pw=n*uCells+uSeed;
      if(uCells<14.){ pw+=vec3(fbm3(n*uCells*.9+1.3),fbm3(n*uCells*.9+7.1),fbm3(n*uCells*.9+3.7))*.9-.45; }
      vec2 w=worley(pw, t*1.1);
      float lane=smoothstep(.0,.22,w.y-w.x);
      float cen=exp(-w.x*w.x*3.5);
      g=pow(lane,.8)*(.3+.7*cen);
      g*=.85+.3*vnoise(n*uCells*3.1+t*.3);
      if(uCells<14.){ float big=fbm3(n*uCells*1.3+vec3(t*.05)); g=mix(g,g*(.4+1.2*big),.7); }
      float net=uCells>14.?fbm3(n*uCells*.22+vec3(0.,t*.01,0.)):.5;
      I*=1.+uGran*(g-.55)*.75*(.45+.55*mu)+uGran*(net-.5)*.18;
    }
    if(uSpots>0.){
      float grp=fbm3(n*2.2+uSeed*1.7);
      float s=fbm3(n*9.+uSeed*3.1+vec3(0.,t*.004,0.))*.7+grp*.45;
      float band=smoothstep(.55,.2,abs(n.y))*smoothstep(.04,.14,abs(n.y));
      float um=smoothstep(.735,.75,s)*band, pen=smoothstep(.69,.72,s)*band;
      I*=1.-uSpots*(.45*pen+.45*um);
      I+=uSpots*.35*pow(1.-mu,1.5)*smoothstep(.6,.68,s)*band;
    }
    if(uSN>0.){
      // expanding ejecta: Rayleigh–Taylor plumes of hot nickel-rich matter pushing up through cooler hydrogen
      vec3 q=n*2.4+vec3(0.,0.,t*.06);
      float f=fbm3(q), f2=fbm3(n*6.5+vec3(f*2.2,-t*.09,f*1.3)), f3=vnoise(n*17.+f2*2.+t*.15);
      float plume=smoothstep(.42,.78,f2);
      I*=.42+.95*f*f+.55*plume+.12*f3;
      c+=uColHot*plume*plume*.35*mu*uBright;
    }
    else if(uGran<=0.&&uNS<=0.){
      // radiative envelope: no surface convection, but sub-surface (iron-opacity) convection stirs a faint, slow turbulent mottling
      vec3 q=n*uHotScale+uSeed;
      float w1=fbm3(q+vec3(0.,0.,t*.035));
      float w2=fbm3(q*2.1+vec3(w1*2.4,-t*.045,w1*1.4));
      float w3=vnoise(q*7.7+w2*1.6+vec3(t*.18));
      float m=w2*.8+w3*.2;
      I*=1.+uHotTex*((m-.5)*1.05+(w3-.5)*.12)*(.45+.55*mu);
      // bright magnetic spots and the base of the clumpy wind
      I+=uHotTex*.3*smoothstep(.64,.8,w2)*mu;
    }
    if(uNS>0.){ vec3 ax=normalize(vec3(sin(uHotspot),.25,cos(uHotspot))); float hs=max(dot(n,ax),dot(n,-ax)); I*=.7+1.6*pow(max(hs,0.),18.); }
    vec3 col=mix(uColLimb,uCol,pow(mu,.45));
    // hot photospheres: a whiter, blinding centre falling to deep blue at the limb
    col=mix(col,mix(col,vec3(max(col.r,max(col.g,col.b)))*vec3(.88,.94,1.),.3),uHotTex*pow(mu,2.5));
    c+=col*max(I,0.)*uBright;
    // bright core flash (helium flash / collapse) seen through the surface
    c+=uColHot*uFlashCore*mu*mu;
    float aa=clamp((1.-r)*R*.9,0.,1.);
    a=aa;
    o=vec4(c*aa,aa);
    if(aa>=1.) return;
  }
  float x=max(r-1.,0.);
  float ang=atan(d.y,d.x);
  vec3 h=vec3(0.);
  h+=vec3(1.,.38,.32)*uChromo*exp(-x*70.)*1.2;
  if(uChromo>0.&&uCorona>.15){ float pa=fbm3(vec3(cos(ang)*5.,sin(ang)*5.,uTime*.05+uSeed)); float pr=smoothstep(.62,.75,pa)*exp(-x*(18.+30.*(1.-pa))); float fl=.6+.4*fbm3(vec3(ang*30.,x*60.,uTime*.3)); h+=vec3(1.,.3,.25)*uChromo*pr*fl*1.6; }
  float str=fbm3(vec3(cos(ang)*3.,sin(ang)*3.,uTime*.03+uSeed));
  float str2=pow(.5+.5*sin(ang*7.+str*9.),6.);
  h+=vec3(.95,.93,1.)*uCorona*(pow(1./(1.+x),7.)*(.35+.9*str)+.5*str2*pow(1./(1.+x*1.4),4.)*(.3+str))*.55;
  float streak=fbm3(vec3(cos(ang)*4.,sin(ang)*4.,log(1.+x)*3.-uTime*.35));
  h+=uColHot*uWind*pow(1./(1.+x*1.3),3.)*(.35+.9*streak*streak);
  if(uWind>0.){
    // line-driven winds are unstable: they break into dense clumps that stream out radially
    float lx=log(1.+x);
    float cl=fbm3(vec3(cos(ang)*11.,sin(ang)*11.,lx*6.-uTime*.55+uSeed));
    float rays=pow(.5+.5*sin(ang*23.+cl*6.+uSeed),5.)*.6+pow(.5+.5*sin(ang*9.-cl*4.),8.)*.8;
    h+=uColHot*uWind*smoothstep(.55,.8,cl)*exp(-x*2.2)*1.1*smoothstep(0.,.03,x);
    h+=mix(uColHot,uCol,.4)*uWind*rays*exp(-x*1.4)*.22*(.5+cl);
  }
  if(uSN>0.){
    // ejecta beyond the photosphere: turbulent fingers racing outward
    float lx=log(1.+x);
    float ej=fbm3(vec3(cos(ang)*6.,sin(ang)*6.,lx*5.-uTime*.5));
    float fing=pow(.5+.5*sin(ang*31.+ej*9.),3.);
    vec3 ejc=mix(mix(uColHot,uCol,.5),vec3(1.,.42,.34),.3*smoothstep(.5,.9,ej));
    h+=ejc*uSN*(pow(ej,2.5)*1.6+fing*ej*.6)*exp(-x*3.)*smoothstep(0.,.02,x)*uBright;
  }
  if(uDust>0.){ float f=fbm3(vec3(d*1.4,uTime*.03+uSeed)); float f2=fbm3(vec3(d*3.7+7.,uTime*.05)); h+=vec3(1.,.42,.2)*uDust*exp(-x*1.6)*pow(f,2.2)*(.6+f2)*1.4; }
  h+=uCol*uGlow*(.045/(x*x*6.+.045))*.8+uCol*uGlow*.06/(1.+x*3.);
  o=vec4(o.rgb+h*(1.-a),a);
}`;

/* --- nebulae: planetary nebula / supernova remnant, ray-marched through a 3D noise texture --- */
const FS_NEB = `#version 300 es
precision highp float; precision highp sampler3D; in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform vec2 uC; uniform float uRpx; uniform float uTime; uniform mat3 uRot; uniform sampler3D uNoise; uniform float uScale;
uniform float uType, uAmp, uIon, uWaist, uLobe, uSeed, uPWN, uAge, uHalo;
float nz(vec3 p){ return texture(uNoise,p).r; }
float rz(vec3 p){ return texture(uNoise,p).g; }
void main(){
  vec2 p=(gl_FragCoord.xy/uScale-uC)/uRpx; // reduced-resolution target; uC and uRpx are in full-resolution pixels
  float L=length(p);
  float BR=uType<.5?1.42:1.22;
  if(L>BR||uAmp<=0.){ o=vec4(0.); return; }
  vec3 acc=vec3(0.);
  float zmax=sqrt(max(0.,BR*BR-L*L));
  const int N=40; float dz=2.*zmax/float(N);
  float j=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);
  for(int i=0;i<N;i++){
    float z=-zmax+(float(i)+j)*dz;
    vec3 q=uRot*vec3(p,z);
    float rho=length(q);
    if(rho>BR) continue;
    float ct=abs(q.z)/max(rho,1e-3);
    vec3 e=vec3(0.);
    if(uType<.5){
      // bipolar planetary nebula: hourglass shell, ionisation-stratified; equatorial torus; faint AGB halo rings
      float Rs=.62*(uWaist+(1.-uWaist)*pow(ct,uLobe));
      float n1=nz(q*.7+uSeed), r2=rz(q*1.9+uSeed*1.7), r3=rz(q*4.1+uSeed*.3);
      float clump=.35+1.3*pow(n1,1.5);
      float fil=smoothstep(.4,.75,r2)*1.4+smoothstep(.5,.8,r3)*1.1+.18;
      float oiii=exp(-pow((rho-Rs*.84)/.07,2.))*(1.-.4*ct)*clump;
      float ha=exp(-pow((rho-Rs*1.02)/.03,2.))*fil*clump;
      float nii=exp(-pow((rho-Rs*1.05)/.022,2.))*smoothstep(.5,.85,r3)*2.;
      float tor=exp(-pow(q.z/.05,2.))*exp(-pow((length(q.xy)-.33)/.045,2.))*(.3+2.*smoothstep(.4,.75,r2));
      float halo=uHalo*exp(-pow((rho-1.12)/.18,2.))*pow(.5+.5*sin(rho*52.+n1*2.),4.)*(.4+n1);
      float core=exp(-rho*rho/.01)*.6;
      e+=vec3(.10,.92,.78)*oiii*uIon*1.1;
      e+=vec3(1.,.12,.14)*(ha*1.2+tor*1.4)+vec3(1.,.35,.2)*nii*.6;
      e+=vec3(.5,.6,1.)*core*uIon;
      e+=vec3(.9,.3,.28)*halo*.05;
    } else {
      // supernova remnant: Crab-like filament cage over synchrotron glow (with a pulsar), or Cas A-like knots and blast wave
      vec3 qe=q*vec3(1.,1.22,.9);
      float rr=length(qe);
      float n1=nz(qe*.8+uSeed), r1=rz(qe*1.7+uSeed*2.3), r2=rz(qe*3.6+uSeed*.7);
      float shell=smoothstep(1.02,.82,rr)*smoothstep(.3,.72,rr);
      float fil=smoothstep(.6,.9,r1)*2.1+smoothstep(.64,.92,r2)*1.5+smoothstep(.45,.75,r1)*.25;
      vec3 fc=mix(vec3(1.,.22,.1),vec3(1.,.62,.22),smoothstep(.35,.7,n1));
      fc=mix(fc,vec3(.35,1.,.55),smoothstep(.7,.9,r2)*.5*(1.-uPWN*.4));
      float rim=smoothstep(.55,.95,rr);
      e+=fc*fil*shell*(.15+1.4*n1*n1)*(.5+1.3*rim)*1.5;
      float syn=exp(-rr*rr/.3)*(.4+.9*n1)*(.6+.6*smoothstep(.35,.7,r1))*uPWN;
      e+=vec3(.42,.58,1.)*syn*.9;
      float blast=exp(-pow((rr-1.1)/.03,2.))*(.35+.9*n1)*(1.-uPWN*.7);
      e+=vec3(.35,.55,1.)*blast*.5;
      e+=vec3(.15,1.,.8)*smoothstep(.6,.85,r1)*smoothstep(1.,.55,rr)*smoothstep(.25,.55,rr)*(1.-uPWN)*1.4;
    }
    acc+=e*dz;
  }
  o=vec4(acc*uAmp,1.);
}`;

/* --- pulsar beams, black hole, flashes (additive / alpha) --- */
const FS_FX = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform vec2 uC; uniform float uTime, uDpr;
uniform float uBeam, uBeamLen, uSpin, uIncl, uAlpha, uField; // pulsar
uniform float uBH, uRs; // black hole (Schwarzschild radius in px)
uniform float uFlash; uniform vec3 uFlashCol; uniform float uRing, uRingR;
uniform float uTor, uTorR; // pulsar wind nebula
${GLSL_COMMON}
void main(){
  vec2 p=gl_FragCoord.xy-uC; float L=length(p);
  vec3 c=vec3(0.); float a=0.;
  if(uBeam>0.){
    // magnetic axis precesses about the spin axis; project the two cones onto the sky
    vec3 m=vec3(sin(uAlpha)*cos(uSpin), cos(uAlpha), sin(uAlpha)*sin(uSpin));
    float ci=cos(uIncl), si=sin(uIncl);
    vec3 mv=vec3(m.x, m.y*ci-m.z*si, m.y*si+m.z*ci);
    vec2 ax=normalize(mv.xy+1e-4);
    float along=dot(p,ax), perp=abs(dot(p,vec2(-ax.y,ax.x)));
    float s=clamp(along/(10.*uDpr),-1.,1.); float la=abs(along);
    float width=la*.16+2.*uDpr;
    float beam=exp(-pow(perp/width,2.))*exp(-la/uBeamLen)*smoothstep(0.,6.*uDpr,la);
    float face=pow(max(0.,s*mv.z),6.);
    float fl=.8+.4*fbm3(vec3(la*.02-uTime*3.,perp*.05,uTime));
    c+=mix(vec3(.55,.7,1.),vec3(.9,.95,1.),face)*beam*uBeam*(.7+2.*face)*fl;
    c+=vec3(.6,.75,1.)*uBeam*(.3+pow(abs(mv.z),6.)*2.2)*exp(-L*L/(900.*uDpr*uDpr));
    // dipole field lines r = k sin²θ in the plane of the magnetic axis
    float th=atan(dot(p,vec2(-ax.y,ax.x)), along);
    float sn=sin(th); float k=L/max(sn*sn,1e-3);
    float lines=0.; for(int i=1;i<=4;i++){ float kk=uBeamLen*.18*float(i); lines+=exp(-pow((k-kk)/(kk*.04),2.)); }
    c+=vec3(.5,.62,1.)*lines*.18*uBeam*uField*smoothstep(uBeamLen*.02,uBeamLen*.06,L);
  }
  if(uBH>0.){
    float rsh=2.6*uRs;
    // accretion disc from fallback: near side as an ellipse, far side lensed up over the shadow
    float inc=.22;
    vec2 q=vec2(p.x, p.y/inc);
    float rq=length(q);
    float disc=smoothstep(3.*uRs,3.4*uRs,rq)*smoothstep(11.*uRs,6.*uRs,rq);
    float dop=1.+.65*(-p.x/max(rq,1.))*1.;
    float turb=.6+.4*fbm3(vec3(atan(q.y,q.x)*3.+uTime*.9-rq/uRs*.3, rq/uRs*.6, uTime*.2));
    float T=pow(3.*uRs/max(rq,3.*uRs),.75);
    vec3 dcol=mix(vec3(1.,.42,.12),vec3(1.,.9,.75),T)*T*T*dop*dop*turb*.9;
    float dfront=disc*step(p.y,0.), dback=disc*step(0.,p.y)*step(rsh,L);
    float lr=L/uRs; float arc=exp(-pow((lr-3.05)/.35,2.))*(.55+.45*smoothstep(-.3,.9,p.y/max(L,1.)));
    vec3 acol=vec3(1.,.72,.42)*arc*turb*.7*(1.+.5*(-p.x/max(L,1.)));
    float ring=exp(-pow((L-rsh)/(.9*uDpr),2.))*1.6;
    float sh=smoothstep(rsh+.8*uDpr,rsh-.8*uDpr,L);
    c+=((acol+vec3(1.,.85,.7)*ring)*(1.-sh)+dcol*(dfront+dback))*uBH;
    a=sh*uBH;
  }
  if(uTor>0.){
    // pulsar wind nebula: an equatorial torus and polar jets of synchrotron light, as Chandra sees the Crab
    float ca=cos(.52), sa=sin(.52);
    vec2 q=vec2(p.x*ca+p.y*sa, -p.x*sa+p.y*ca);
    float el=length(vec2(q.x, q.y/.4));
    float an=atan(q.y/.4,q.x);
    float knots=.45+.9*fbm3(vec3(cos(an)*5.,sin(an)*5.,uTime*.15));
    float ring=exp(-pow((el-uTorR)/(uTorR*.1+uDpr),2.))*(q.y>0.?.75:1.);
    float ring2=exp(-pow((el-uTorR*.62)/(uTorR*.08+uDpr),2.))*.45;
    float jet=exp(-pow(q.x/(uTorR*.045+uDpr),2.))*exp(-abs(q.y)/(uTorR*1.1))*smoothstep(0.,uTorR*.12,abs(q.y))*(q.y>0.?1.:.55);
    float fog=exp(-L*L/(uTorR*uTorR*1.6))*.35;
    c+=vec3(.58,.72,1.)*uTor*(ring*knots+ring2*knots+jet*.9+fog);
  }
  if(uFlash>0.){
    // shock breakout: a blinding point with diffraction spikes, not a grey screen
    vec2 ap=abs(p); float Hs=uRes.y;
    float core=exp(-L/(Hs*.035)), halo=exp(-L/(Hs*.16));
    float spikes=exp(-ap.y/(Hs*.0035+1.))*exp(-ap.x/(Hs*.55))+exp(-ap.x/(Hs*.0035+1.))*exp(-ap.y/(Hs*.4))*.75;
    float dg=(exp(-abs(p.x-p.y)*.7071/(Hs*.0025+1.))+exp(-abs(p.x+p.y)*.7071/(Hs*.0025+1.)))*exp(-L/(Hs*.12))*.5;
    c+=uFlashCol*uFlash*(3.2*core+1.2*halo+.9*spikes+dg+.012);
  }
  if(uRing>0.){
    // the breakout flash racing out through the surrounding wind
    float an=atan(p.y,p.x);
    float wob=fbm3(vec3(cos(an)*4.,sin(an)*4.,uTime*.25));
    float rr=uRingR*(1.+.07*(wob-.5));
    float w=uRes.y*.003+uRingR*.012;
    float sh=exp(-pow((L-rr)/w,2.));
    float inner=exp(-max(0.,rr-L)/(uRingR*.2+1.))*step(L,rr);
    c+=vec3(.72,.84,1.)*uRing*(sh*(.5+1.1*wob)+inner*.07);
  }
  o=vec4(c,a);
}`;

/* --- post: bloom down/up sampling and tone-mapped composite --- */
const FS_DOWN = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uPre;
void main(){ vec2 t=uTexel;
  vec3 a=texture(uSrc,vUv+t*vec2(-2,2)).rgb, b=texture(uSrc,vUv+t*vec2(0,2)).rgb, c=texture(uSrc,vUv+t*vec2(2,2)).rgb;
  vec3 d=texture(uSrc,vUv+t*vec2(-2,0)).rgb, e=texture(uSrc,vUv).rgb, f=texture(uSrc,vUv+t*vec2(2,0)).rgb;
  vec3 g=texture(uSrc,vUv+t*vec2(-2,-2)).rgb, h=texture(uSrc,vUv+t*vec2(0,-2)).rgb, i=texture(uSrc,vUv+t*vec2(2,-2)).rgb;
  vec3 j=texture(uSrc,vUv+t*vec2(-1,1)).rgb, k=texture(uSrc,vUv+t*vec2(1,1)).rgb, l=texture(uSrc,vUv+t*vec2(-1,-1)).rgb, m=texture(uSrc,vUv+t*vec2(1,-1)).rgb;
  vec3 s=e*.125+(a+c+g+i)*.03125+(b+d+f+h)*.0625+(j+k+l+m)*.125;
  if(uPre>0.){ float br=max(s.r,max(s.g,s.b)); s*=smoothstep(uPre*.5,uPre*1.5,br); s=min(s,vec3(60.)); }
  o=vec4(s,1.); }`;
const FS_UP = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uW;
void main(){ vec2 t=uTexel;
  vec3 s=texture(uSrc,vUv).rgb*4.;
  s+=(texture(uSrc,vUv+vec2(t.x,0)).rgb+texture(uSrc,vUv-vec2(t.x,0)).rgb+texture(uSrc,vUv+vec2(0,t.y)).rgb+texture(uSrc,vUv-vec2(0,t.y)).rgb)*2.;
  s+=texture(uSrc,vUv+t).rgb+texture(uSrc,vUv-t).rgb+texture(uSrc,vUv+vec2(t.x,-t.y)).rgb+texture(uSrc,vUv+vec2(-t.x,t.y)).rgb;
  o=vec4(s/16.*uW,1.); }`;
const FS_COMP = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uScene, uBloom; uniform float uExp, uBloomK, uEnc, uTime, uVig; uniform vec2 uRes;
${GLSL_COMMON}
void main(){
  vec3 s=texture(uScene,vUv).rgb/uEnc, b=texture(uBloom,vUv).rgb/uEnc;
  vec3 c=(s+b*uBloomK)*uExp;
  c=aces(c);
  vec2 q=vUv-.5; c*=1.-uVig*dot(q,q)*1.2;
  c=pow(c,vec3(1./2.2));
  c+=(h21(gl_FragCoord.xy+fract(uTime)*91.)-.5)/255.*1.5;
  o=vec4(c,1.); }`;
const FS_BLIT = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uSrc; uniform float uEnc;
void main(){ o=vec4(texture(uSrc,vUv).rgb*uEnc,1.); }`;

function setPlaying(p) { if (p && S.T && S.s >= S.T.segs.length - 1e-3) { S.s = 0; S.ended = false; resetDeath(); } S.playing = p; playB.setLabel(p ? 'Pause life' : 'Play life'); playB.setPressed(!p); }
function resetDeath() { S.released = null; S.engulfed = {}; S.flares = []; S.glyphs = null; endCard.classList.remove('on'); ptDirty = true; snT0 = -1; }
function setMass(M, sNew, presetId) {
  const prevCode = st.code;
  S.M = M; S.T = buildTrack(M); S.jumpT = performance.now(); if (typeof VIEW !== 'undefined') VIEW.fast = presetId !== undefined ? 1.2 : 0.4;

  S.preset = presetId || null;

  if (massS.value !== M) massS.set(M);
  evalTrack(S.T, S.s, st);
}

let ribbonDrag = false;
function ribbonPick(e) {
  const r = ribbon.getBoundingClientRect(); const x = U.clamp((e.clientX - r.left) / r.width, 0, 1) * S.T.total;
  let i = 0; while (i < S.T.segs.length - 1 && S.T.cum[i + 1] < x) i++;
  S.s = i + U.clamp((x - S.T.cum[i]) / S.T.segs[i].dur, 0, 0.9999); S.jumpT = performance.now();
  if (S.s < S.T.segs.length - 0.01) S.ended = false;
  if (!(S.T.idxCollapse && S.s >= S.T.idxCollapse) && !(S.T.idxAGBtip && S.s >= S.T.idxAGBtip)) resetDeath();
}

const tmpSt = { ...st };
const RIB_GROUP = { ms: 'Main sequence', rgb: 'Giant', rsg: 'Supergiant', wn: 'Wolf–Rayet', tpagb: 'AGB', pn: 'Nebula', wd: 'White dwarf', cburn: 'C Ne O Si', plateau: 'SN', peak: 'SN', snr: 'Remnant', ns: 'NS', bh: 'BH', bd: 'Blue dwarf', rgbx: 'Giant', clump: 'Clump', loop: 'Loop', cheb: 'He', bsg: 'BSG', lbv: 'LBV' };
function drawRibbon() {
  const c = ribbon, dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(c.clientWidth * dpr), H = Math.round(c.clientHeight * dpr); if (!W || !H) return;
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const x = c.getContext('2d'), T = S.T;
  x.clearRect(0, 0, W, H);
  const y0 = 16 * dpr, bh = H - y0 - 6 * dpr;
  let lastLab = -1e9;
  for (let i = 0; i < T.segs.length; i++) {
    const xa = (T.cum[i] / T.total) * W, xb = (T.cum[i + 1] / T.total) * W;
    evalTrack(T, i + 0.5, tmpSt);
    const code = T.segs[i].code;
    let col = U.blackbody(tmpSt.T);
    if (code === 'shock' || code === 'rise' || code === 'plateau' || code === 'peak' || code === 'tail') col = [1, 0.95, 0.85];
    if (code === 'snr' || code === 'snrold') col = [0.95, 0.4, 0.3];
    if (code === 'bh') col = [0.25, 0.2, 0.2];
    const past = i + 1 <= S.s ? 1 : i <= S.s ? 0.8 : 0.45;
    x.fillStyle = `rgba(${col.map((v) => Math.round(v * 255)).join(',')},${past})`;
    x.fillRect(xa + 0.5 * dpr, y0, Math.max(1, xb - xa - 1 * dpr), bh);
    const lab = RIB_GROUP[code];
    if (lab && (i === 0 || T.segs[i - 1].code !== code) && xa - lastLab > 34 * dpr && (xa < W - 30 * dpr)) {
      x.font = `${9 * dpr}px ${getComputedStyle(document.documentElement).getPropertyValue('--f-mono')}`;
      x.fillStyle = 'rgba(151,157,178,.95)'; x.textBaseline = 'top'; x.textAlign = 'left';
      x.fillText(lab, xa + 1, 2 * dpr); lastLab = xa + x.measureText(lab).width;
    }
  }
  const i = Math.min(T.segs.length - 1, Math.floor(S.s));
  const px = ((T.cum[i] + (S.s - i) * T.segs[i].dur) / T.total) * W;
  x.fillStyle = '#ffe08a'; x.fillRect(px - 1 * dpr, y0 - 4 * dpr, 2 * dpr, bh + 8 * dpr);
  x.beginPath(); x.arc(px, y0 - 4 * dpr, 3 * dpr, 0, 7); x.fill();
}

  ro.tc.set(bh ? '—' : fmtTK(st.logTc)); ro.burn.set(burn);
  ro.sp.set(VS.tSN > 0.01 ? (VS.ns ? 'pulsar' : bh ? '—' : 'SN ' + T_.snType) : spectral(st.T, st.code, st.L, VS.Rvis));
  ro.g.set(VS.tSN > 0.01 ? '—' : (Math.log10(27400 * st.m / (VS.Rvis * VS.Rvis))).toFixed(2));
  ro.nu.set(VS.tSN > 0.01 || Z.mode === 'wd' ? '—' : fmtNu(numax()));
  ro.fate.set(fateText());
  // bottom clock
  clock.querySelector('.ck-age').textContent = fmtAge(st.age);
  const i = Math.min(T_.segs.length - 1, Math.floor(S.s));
  const a0 = st.age; const o = clTmp; evalTrack(T_, Math.min(T_.segs.length - 1e-6, S.s + 0.002), o);
  const rate = (o.age - a0) / 0.002 / T_.segs[i].dur * S.pace;
  clock.querySelector('.ck-rate').innerHTML = S.playing && !ch.paused ? (rate * YR < 86400 * 2 ? F.time(rate * YR) : F.time(rate * YR)) : 'paused';
  const cd = T_.idxCollapse != null && S.s >= 7 && S.s < T_.idxCollapse;
  clock.classList.toggle('cd', cd);
  if (cd) { const left = (T_.pts[T_.idxCollapse].age - st.age) * YR; clock.querySelector('.ck-cd').textContent = left < 86400 * 2 ? (left / 3600).toFixed(1) + ' hours' : left < YR * 2 ? (left / 86400).toFixed(left < 86400 * 20 ? 1 : 0) + ' days' : F.time(left); }
}

/* stage interaction: wheel / pinch zoom, drag to turn the nebula */
let lastInteract = performance.now();
['pointerdown', 'keydown', 'wheel'].forEach((ev) => window.addEventListener(ev, () => (lastInteract = performance.now()), { passive: true }));
const ptrs = new Map(); let pinch0 = 0;
ch.stage.addEventListener('pointerdown', (e) => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); } try { ch.stage.setPointerCapture(e.pointerId); } catch (_) { /* capture unsupported */ } });
ch.stage.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch0) S.zoomU = U.clamp(S.zoomU * pinch0 / d, 0.05, 30); pinch0 = d; return; }
  nebRot.th += (e.clientX - prev[0]) * 0.006; nebRot.ph = U.clamp(nebRot.ph + (e.clientY - prev[1]) * 0.006, 0.1, 3.0);
});
const up = (e) => { ptrs.delete(e.pointerId); pinch0 = 0; };
ch.stage.addEventListener('pointerup', up); ch.stage.addEventListener('pointercancel', up);
ch.stage.addEventListener('wheel', (e) => { e.preventDefault(); S.zoomU = U.clamp(S.zoomU * Math.exp(e.deltaY * 0.0012), 0.05, 30); }, { passive: false });
ch.stage.addEventListener('dblclick', () => { S.zoomU = 1; });

/* ---- go ---- */
setMass(1, 1, 'sun');
evalTrack(S.T, S.s, st); deriveVisual(0);
VIEW.logR = Math.log(targetViewR());
buildClusterTracks(40);
let hudAcc = 1, frameN = 0, fpsAcc = 0, fpsN = 0, fps = 0, idleHold = 0, introHold = 3.5; // linger on the Sun as it is today before time starts to run
ch.loop((dt, t) => {
  frameN++;
  if (CL.built < NCL) buildClusterTracks(5);
  const Tk = S.T, nseg = Tk.segs.length;
  if (introHold > 0) { introHold -= dt; if (S.preset !== 'sun' || S.s !== 1) introHold = 0; }
  if (S.playing && !ribbonDrag && dt > 0 && introHold <= 0) {
    const i = Math.min(nseg - 1, Math.floor(S.s));
    S.s += dt * S.pace / Tk.segs[i].dur;
    if (S.s >= nseg - 1e-6) { S.s = nseg - 1e-6; S.ended = true; setPlaying(false); }
  }
  evalTrack(Tk, S.s, st);
  deriveVisual(t);
  if (st.code !== lastCode) { onPhaseEvent(st.code, lastCode); lastCode = st.code; if (S.autoCut && (st.code === 'rise' || st.code === 'peak')) { S.cutOn = false; cutT.set(false); S.autoCut = false; } }
  updateCaption();
  if (frameN % 30 === 1) capW = cap.offsetWidth || 560;
  if (!small() && VIEW.W > 1100) { const cw = capW; cap.style.left = U.clamp(VIEW.cx, 310 + cw / 2, VIEW.W - 340 - cw / 2) + 'px'; clock.style.left = Math.max(VIEW.cx, 470 + (clock.offsetWidth || 300) / 2) + 'px'; } else { cap.style.left = ''; clock.style.left = ''; }
  if (frameN % 6 === 0) cap.classList.toggle('toasted', !!document.querySelector('.cz-toast.on'));
  checkRelease();
  renderFrame(t, dt);
  drawOverlay(t);
  hudAcc += dt;
  if (hudAcc > 0.1 || (dt === 0 && frameN % 8 === 0)) { updateReadouts(); hudAcc = 0; }
  if (clusterDirty && (CL.built === NCL || frameN % 20 === 0)) updateCluster();
  if (frameN % 2 === 0) drawHR(t);
  if (frameN % 3 === 0) drawRibbon();
  if (frameN % 6 === 0) drawLC();
  if (frameN % 6 === 3) drawSpectrum();
  if (frameN % 4 === 0) drawPTMini(t);
  soundUpdate(dt);
  fpsAcc += dt; fpsN++; if (fpsAcc > 1) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  // ambient carousel: after a finished life sits idle, move on to the next preset
  if (S.ended && dt > 0 && performance.now() - lastInteract > 25000) {
    idleHold += dt;
    if (idleHold > 14) { idleHold = 0; const k = PRESETS.findIndex((p) => p.id === S.preset); const nx = PRESETS[(k + 1) % PRESETS.length]; applyPreset(nx.id); }
  } else idleHold = 0;
}, { always: true });

Cosmos.debug.state = () => ({
  M: S.M, s: +S.s.toFixed(3), code: st.code, phase: (PH[st.code] || [''])[0], ageYr: st.age, L: st.L, Teff: Math.round(st.T), R: VS.Rvis, massNow: st.m, Tcore: Math.pow(10, st.logTc),
  remnant: S.T.remnant, viewRsun: Math.exp(VIEW.logR), starPx: VIEW.Rpx, cells: VIEW.cells, neb: VS.neb, tSN: VS.tSN, tPN: VS.tPN, cut: S.cut, zones: Z.n,
  cluster: { built: CL.built, age: S.clusterAge, turnoff: +turnoff.toFixed(3), wd: nWD }, released: S.released, fps: Math.round(fps), hdr: HDR === gl.RGBA16F ? 'RGBA16F' : 'RGBA8',
});
Cosmos.debug.jump = (M, s) => { setMass(M, s, null); setPlaying(false); };
Cosmos.debug.play = (p) => setPlaying(p);
})();
</script>
