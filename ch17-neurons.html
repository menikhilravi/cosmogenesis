<script>
(function () {
'use strict';

/* =====================================================================
   THE SPARK OF THOUGHT
   I   The spike    Hodgkin–Huxley (1952) squid-axon membrane, RK4 at
                    dt = 0.01 ms, with stochastic channel glyphs and ion sparks.
   II  The axon     a 300-compartment HH cable (Crank–Nicolson + exponential
                    Euler gates), bare or myelinated, with live conduction velocity.
   III The network  10,000 Izhikevich (2003) neurons in a brain-shaped cortex,
                    distance-dependent sparse synapses with conduction delays,
                    AMPA/GABA currents, thalamic noise, optional STDP.
   ===================================================================== */

const NOTES = `<p>Every thought you have travels as a spike: a one-millisecond flick of voltage across the skin of a nerve cell. You are looking at that skin, a patch of squid giant axon membrane studded with ion channels. When the <strong>sodium</strong> channels snap open, yellow sparks of Na⁺ pour in and the inside swings from −65 mV to above +30 mV. A moment later the <strong>potassium</strong> channels open, violet K⁺ sparks stream out, and the voltage falls back. The simulation slows down at each upstroke so you can see it happen.</p>
<p>Alan Hodgkin and Andrew Huxley measured these currents in 1952 and wrote four equations that reproduce the spike. This page solves their equations live, a hundred thousand times a second of model time. The same equations explain why tetrodotoxin, the pufferfish poison, stops a nerve cold.</p>
<p>A spike also travels. In <em>The axon</em>, pale loops trace the current that flows ahead of it inside the fibre. That current wakes the next patch of channels, so the pulse rebuilds itself as it goes. The squid made its axon half a millimetre thick to go fast. Vertebrates found a better trick: <strong>myelin</strong>. Insulate the axon and the impulse jumps from gap to gap, faster than the squid's in a fibre forty times thinner.</p>
<p>Your brain holds about 86 billion neurons. <em>The network</em> wires up to 20,000 simple model neurons into a brain-shaped cortex. Nobody programmed a rhythm into it, yet it hums at about 10 Hz, the alpha rhythm Hans Berger first reported from a human scalp in 1929. Drive it harder and it shifts to gamma. Anaesthetise it and it falls into slow waves. Break its inhibition and a seizure sweeps across it.</p>
<h4>Try this</h4>
<ul>
<li>Press <strong>Journey</strong> (or <kbd>J</kbd>) for an 80-second guided flight from one ion channel to the whole brain.</li>
<li>In <em>The spike</em>, switch on TTX and watch the yellow sparks stop. Then try TEA, or the voltage clamp that Hodgkin and Huxley used.</li>
<li>In <em>The axon</em>, press <strong>Bare vs myelin</strong>. Then pick a myelinated fibre, strip its myelin with the lesion slider, and watch the impulse slow down and die.</li>
<li>In <em>The network</em>, press <strong>Seizure</strong>, watch it spread out of the temporal lobe, then stop it. With the sound on, hover over one neuron and hear its spikes click over the rain of the crowd.</li>
</ul>`;
const SCIENCE = `<h4>I · The Hodgkin–Huxley membrane</h4>
<p>The membrane is a capacitor in parallel with three conductances. Voltage V is in mV relative to the outside, currents in µA/cm².</p>
<span class="eq">C<sub>m</sub> dV/dt = I − ḡ<sub>Na</sub> m³h (V − E<sub>Na</sub>)<br>&emsp;&emsp;&emsp;&emsp;&ensp;− ḡ<sub>K</sub> n⁴ (V − E<sub>K</sub>) − ḡ<sub>L</sub> (V − E<sub>L</sub>)</span>
<p>Each gate x ∈ {m, h, n} opens and closes with voltage-dependent rates:</p>
<span class="eq">dx/dt = φ [α<sub>x</sub>(V)(1 − x) − β<sub>x</sub>(V) x],&nbsp;&nbsp; φ = 3<sup>(T − 6.3 °C)/10</sup></span>
<span class="eq">α<sub>m</sub> = 0.1(V+40) / (1 − e<sup>−(V+40)/10</sup>),&nbsp;&nbsp; β<sub>m</sub> = 4 e<sup>−(V+65)/18</sup></span>
<span class="eq">α<sub>h</sub> = 0.07 e<sup>−(V+65)/20</sup>,&nbsp;&nbsp; β<sub>h</sub> = 1 / (1 + e<sup>−(V+35)/10</sup>)</span>
<span class="eq">α<sub>n</sub> = 0.01(V+55) / (1 − e<sup>−(V+55)/10</sup>),&nbsp;&nbsp; β<sub>n</sub> = 0.125 e<sup>−(V+65)/80</sup></span>
<p>Rates are in ms⁻¹. Parameters: C<sub>m</sub> = 1 µF/cm², ḡ<sub>Na</sub> = 120, ḡ<sub>K</sub> = 36, ḡ<sub>L</sub> = 0.3 mS/cm², E<sub>Na</sub> = +50, E<sub>K</sub> = −77, E<sub>L</sub> = −54.4 mV, rest −65 mV. The model is integrated with fourth-order Runge–Kutta at dt = 0.01 ms. At 6.3 °C it fires repetitively above about 6.3 µA/cm² (68 Hz at 10 µA/cm²) and follows 1-ms pulses of 25 µA/cm² one for one up to about 80 Hz. Warming shortens and shrinks the spike, and near 29 °C a 1-ms pulse no longer triggers one at all (heat block). TTX and TEA set ḡ<sub>Na</sub> or ḡ<sub>K</sub> to zero over about a second of wash-in.</p>
<p><strong>Voltage clamp</strong> reproduces the experiment behind the equations (Hodgkin, Huxley and Katz, 1952). A feedback amplifier holds V at −65 mV and steps it to a command voltage for 12 ms, supplying whatever current the membrane passes. With V fixed, each gate relaxes exponentially toward x<sub>∞</sub> = α<sub>x</sub>/(α<sub>x</sub> + β<sub>x</sub>) with time constant τ<sub>x</sub> = 1/(α<sub>x</sub> + β<sub>x</sub>), so the update is exact. The Na⁺ current rises and inactivates within a few milliseconds and its peak reverses sign at E<sub>Na</sub>; the K⁺ current rises slowly and does not inactivate. The I–V panel plots the peak Na⁺ current and the K⁺ current at the end of each step. TTX removes the first, TEA the second.</p>
<p>The channel glyphs are two-state Markov chains whose open probability equals m³h (sodium) or n⁴ (potassium), so the fraction of open glyphs tracks the equations. Sparks are drawn in proportion to the charge each current carries. A real spike admits about 3.5 pmol/cm² of Na⁺, some 20,000 ions per µm² of membrane. The phase plane plots V against n: every spike traces the same closed loop, the model's limit cycle.</p>
<h4>II · The cable</h4>
<p>Along an axon of diameter d with axoplasm resistivity R<sub>i</sub>, charge spreads as in a leaky cable:</p>
<span class="eq">(d / 4R<sub>i</sub>) ∂²V/∂x² = C<sub>m</sub> ∂V/∂t + I<sub>ion</sub></span>
<p>For a passive membrane of resistance R<sub>m</sub> (V measured from rest) this is the cable equation, the same one Rall later used to follow synaptic potentials through branching dendrites:</p>
<span class="eq">λ² ∂²V/∂x² − τ<sub>m</sub> ∂V/∂t − V = 0<br>λ = √(R<sub>m</sub> d / 4R<sub>i</sub>),&nbsp;&nbsp; τ<sub>m</sub> = R<sub>m</sub>C<sub>m</sub></span>
<p>For the squid axon (d = 476 µm, R<sub>i</sub> = 35.4 Ω·cm, R<sub>m</sub> ≈ 1.5 kΩ·cm² at rest), λ ≈ 7 mm and τ<sub>m</sub> ≈ 1.5 ms. The simulation splits 10 cm of axon into 300 Hodgkin–Huxley compartments. Voltage is advanced with the Crank–Nicolson scheme (a tridiagonal solve by the Thomas algorithm) and the gates with exponential Euler, dt = 5 µs. At 18.5 °C it conducts at about 19 m/s. Hodgkin and Huxley computed 18.8 m/s and measured 21.2 m/s.</p>
<p>The vertebrate fibre has outer diameter D, axon diameter 0.7 D, internodes 100 D long and 1-µm nodes of Ranvier. The nodes carry 25 times the squid channel density. Myelin gives the internode a capacitance of 0.005 µF/cm² and a conductance of 0.001 mS/cm² at D = 10 µm, both scaled as 1/D because thicker fibres have thicker sheaths. Each internode is split into 7 to 15 compartments, dt = 2 µs, R<sub>i</sub> = 70 Ω·cm. Current crosses the insulated internode almost instantly and regenerates only at the nodes: saltatory conduction, first shown by Huxley and Stämpfli recording at single nodes of frog fibres. The model reaches about 4.8 m/s per µm of D at 37 °C, close to the roughly 6 m/s per µm of real mammalian nerve, and speed grows in proportion to D. Bare axons speed up only as √d. The bare vertebrate axon uses twice the squid channel density so that squid kinetics survive 37 °C.</p>
<p>The <strong>lesion</strong> control thins the myelin on three internodes between the electrodes, as in the demyelinated plaques of multiple sclerosis. A sheath with a fraction r of its wraps has capacitance and leak scaled by 1/r, up to those of bare membrane. In the model the impulse slows, to about 36 m/s across the electrodes with 30% of the myelin left, and fails outright when less than about a sixth remains: conduction block. Real demyelinated axons can partly recover by inserting sodium channels along the bare stretch, which this model leaves out.</p>
<p>The pale loops trace the local-circuit current. Axial current (V<sub>i</sub> − V<sub>i+1</sub>)/r<sub>a</sub> flows from the active patch through the axoplasm, leaves through the membrane ahead, where it discharges the membrane capacitance toward threshold, and returns through the fluid outside. Each loop is drawn from the patch with the largest Na⁺ current to the first point ahead that is still within 3 mV of rest, which is about one length constant for a bare axon and several internodes for a myelinated one.</p>
<p>Scaled for the screen: time runs 600 to 5,000 times slower than life, the axon is drawn much fatter than scale, internodes are drawn far shorter than 100 fibre diameters, and each node is drawn wider than its true 1 µm. The neighbouring axons of the nerve are decoration, with schematic impulses.</p>
<h4>III · The network</h4>
<p>Each neuron is an Izhikevich model, two equations tuned to reproduce the firing patterns of real cortical cells:</p>
<span class="eq">v′ = 0.04v² + 5v + 140 − u + I,&nbsp;&nbsp; u′ = a(bv − u)<br>if v ≥ 30 mV:&nbsp; v ← c,&nbsp; u ← u + d</span>
<p>Regular spiking (RS): a = 0.02, b = 0.2, c = −65, d = 8. Intrinsically bursting (IB): c = −55, d = 4. Chattering (CH): c = −50, d = 2. Fast spiking (FS): a = 0.1, b = 0.2, c = −65, d = 2. Following Izhikevich (2003), 80% are excitatory with c = −65 + 15r², d = 8 − 6r², spanning RS to CH, and 20% inhibitory with a = 0.02 + 0.08r, b = 0.25 − 0.05r, spanning FS to low-threshold spiking (r uniform on [0, 1]). v is advanced in two 0.5-ms half steps per millisecond.</p>
<p>The neurons sit in the grey-matter shell of a brain-shaped cortex about 16 cm long. Each sends 100 synapses: 90% to neighbours drawn from a Gaussian (σ = 1 cm for excitatory, 0.5 cm for inhibitory cells) and 10% of excitatory synapses to anywhere, standing in for white-matter tracts. Weights are uniform random, as in the 2003 paper, rescaled for 100 rather than 1,000 inputs. Excitatory axons are delayed by 1 ms plus distance at 5 m/s. The tuft of faint arcs around the recorded neuron is its own set of outgoing synapses. Each time it fires, a pulse runs along every branch, drawn about 15 times slower than the true delay so the eye can follow it. Synaptic currents decay with τ = 1.5 ms (AMPA) and 3 to 8 ms (GABA<sub>A</sub>). Every neuron receives thalamic noise each millisecond, σ = 5.5 for excitatory and 2 for inhibitory cells, partly shared within 96 thalamocortical territories. The LFP is the summed synaptic current onto excitatory cells, and its spectrum is a Welch estimate from five 0.5-s Hann windows with 50% overlap, plotted on a logarithmic frequency axis.</p>
<p>No oscillator is built in. The rhythms come from the loop between excitation, inhibition and adaptation, as in Izhikevich's network. <strong>Awake</strong> settles near 10 Hz (alpha). <strong>Focused</strong> raises the drive and the inhibitory feedback and decorrelates the input, and the loop runs near 40 Hz (gamma). <strong>Anaesthesia</strong> lengthens GABA<sub>A</sub> currents to 8 ms, as propofol does, lowers the drive, and strengthens slow adaptation and recurrent excitation, as happens when cholinergic tone falls. The cortex then alternates between silent down states and active up states about once a second, the slow oscillation of sleep and anaesthesia. <strong>Seizure</strong> releases a recruitment front from a focus. Inside it excitation grows, inhibition fails to 15% of normal, adaptation slows and slow GABA<sub>B</sub> inhibition is recruited. The result is hypersynchronous discharge at 3 to 5 Hz, each burst followed by a silent wave. The crimson ring on the cortical surface marks the edge of the recruitment front, which advances at 5.5 cm per second of model time. Real seizures spread far more slowly, over seconds to minutes.</p>
<p><strong>STDP</strong> adds pair-based spike-timing-dependent plasticity to excitatory synapses onto excitatory cells. Traces decay with τ = 20 ms, A<sub>+</sub> = 0.006, A<sub>−</sub> = 0.0072, and weights are capped.</p>
<h4>Scale</h4>
<p>The human brain has about 86 billion neurons: 16 billion in the cerebral cortex and 69 billion in the cerebellum. They make roughly 10<sup>14</sup> synapses. With 10,000 model neurons, each stands for about 1.6 million real cortical neurons, and the model's million synapses are one hundred-millionth of the real number. The network runs at a quarter of real time by default. Click the brain to inject current into a 1.3-cm patch and watch the activity spread.</p>
<span class="cite">Hodgkin, A. L. &amp; Huxley, A. F. (1952). A quantitative description of membrane current and its application to conduction and excitation in nerve. J. Physiol. 117, 500–544.</span>
<span class="cite">Huxley, A. F. &amp; Stämpfli, R. (1949). Evidence for saltatory conduction in peripheral myelinated nerve fibres. J. Physiol. 108, 315–339.</span>
<span class="cite">Rall, W. (1967). Distinguishing theoretical synaptic potentials computed for different soma-dendritic distributions of synaptic input. J. Neurophysiol. 30, 1138–1168.</span>
<span class="cite">Izhikevich, E. M. (2003). Simple model of spiking neurons. IEEE Trans. Neural Netw. 14, 1569–1572.</span>
<span class="cite">Azevedo, F. A. C. et al. (2009). Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain. J. Comp. Neurol. 513, 532–541.</span>
<span class="cite">Buzsáki, G. (2006). Rhythms of the Brain. Oxford University Press.</span>`;

const ch = Cosmos.chapter({ id: 'neurons', notes: NOTES, science: SCIENCE });
let tourOn = false;                                   // while the guided journey plays, its captions replace toasts
function toast(msg) { if (!tourOn) ch.toast(msg); }
const U = Cosmos.util, clamp = U.clamp, lerp = U.lerp;
const SMALL = window.matchMedia('(max-width: 760px)').matches;
const ERA = U.rgbf(ch.meta.accent);
const C = {
  na: [1.0, 0.76, 0.28], k: [0.62, 0.44, 1.0], v: [0.94, 0.9, 1.0], h: [1.0, 0.5, 0.3], leak: [0.55, 0.58, 0.66],
  exc: [0.86, 0.72, 1.0], inh: [0.32, 0.86, 1.0], myelin: [1.0, 0.93, 0.82],
};
const css = (c, a = 1) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a})`;
const MONO = getComputedStyle(document.documentElement).getPropertyValue('--f-mono').trim() || 'monospace';
const DISP = getComputedStyle(document.documentElement).getPropertyValue('--f-display').trim() || 'serif';

/* =====================================================================
   GL CORE
   ===================================================================== */
const canvas = ch.canvas('nx-gl');
const gl = Cosmos.gl.context(canvas, { alpha: false, antialias: false });
if (!gl) { ch.fatal('This chapter needs WebGL2, which this browser does not provide.'); return; }
const G = Cosmos.gl;
const HDR = gl.ext.floatRT ? gl.RGBA16F : gl.RGBA8;
const overlay = document.createElement('canvas'); overlay.className = 'nx-ov'; ch.stage.append(overlay);
const octx = overlay.getContext('2d');
const MAXDPR = SMALL ? 2 : 1.75;

const VS_GLOW = `#version 300 es
layout(location=0) in vec2 aCorner;
layout(location=1) in vec3 aP0;
layout(location=2) in vec3 aP1;
layout(location=3) in vec4 aCol;
layout(location=4) in float aSize;
uniform mat4 uVP; uniform vec2 uRes; uniform float uPx, uMinPx, uMaxPx, uFog, uLine;
uniform vec3 uEye;
out vec2 vLoc; out float vLen; out float vR; out vec3 vCol; out float vCore;
void main(){
  vec4 c0 = uVP*vec4(aP0,1.), c1 = uVP*vec4(aP1,1.);
  if (c0.w < 0.05 || c1.w < 0.05 || aCol.a <= 0.0) { gl_Position = vec4(3.,3.,3.,1.); return; }
  vec2 s0 = (c0.xy/c0.w*.5+.5)*uRes, s1 = (c1.xy/c1.w*.5+.5)*uRes;
  float rTrue = aSize*uPx/c0.w;
  float r = clamp(rTrue, uMinPx, uMaxPx);
  vec2 d = s1-s0; float L = length(d);
  vec2 dir = L > 1e-3 ? d/L : vec2(1.,0.); vec2 nr = vec2(-dir.y, dir.x);
  float along = aCorner.x*.5+.5;
  vec2 p = s0 + d*along + dir*aCorner.x*r + nr*aCorner.y*r;
  vLoc = vec2(dot(p-s0,dir), dot(p-s0,nr)); vLen = L; vR = r;
  float sub = rTrue < uMinPx ? (rTrue*rTrue)/(uMinPx*uMinPx) : 1.;
  float fog = exp(-max(0., distance(uEye, aP0)-2.)*uFog);
  vCol = aCol.rgb*aCol.a*sub*fog*mix(r/(r+L*.35), 1., uLine);
  vCore = aSize < 0. ? 1. : 0.;
  gl_Position = vec4(p/uRes*2.-1., 0., 1.);
}`;
const FS_GLOW = `#version 300 es
precision highp float;
in vec2 vLoc; in float vLen; in float vR; in vec3 vCol; in float vCore; out vec4 o;
uniform float uLine;
void main(){
  float x = clamp(vLoc.x, 0., vLen);
  float d = length(vec2(vLoc.x-x, vLoc.y))/vR;
  float I = exp(-d*d*5.5)*1.0 + exp(-d*d*1.6)*.22;
  float tail = vLen > 1. && uLine < .5 ? mix(.08, 1., clamp(vLoc.x/vLen, 0., 1.)) : 1.;
  o = vec4(vCol*I*tail, 1.);
}`;
const VS_DISC = `#version 300 es
layout(location=0) in vec2 aCorner;
layout(location=1) in vec3 aC;
layout(location=2) in vec3 aT1;
layout(location=3) in vec3 aT2;
layout(location=4) in vec4 aCol;
layout(location=5) in vec4 aState; // open, blocked, rot, highlight
uniform mat4 uVP; uniform vec3 uEye;
out vec2 vUV; out vec4 vCol; out vec4 vState; out float vFace;
void main(){
  vec3 p = aC + aT1*aCorner.x + aT2*aCorner.y;
  vec3 n = normalize(cross(aT1, aT2));
  vFace = dot(n, normalize(uEye - aC));
  vUV = aCorner; vCol = aCol; vState = aState;
  gl_Position = uVP*vec4(p,1.);
}`;
const FS_DISC = `#version 300 es
precision highp float;
in vec2 vUV; in vec4 vCol; in vec4 vState; in float vFace; out vec4 o;
void main(){
  float r = length(vUV);
  if (r > 1.) discard;
  float a = atan(vUV.y, vUV.x) + vState.z;

  sTa.set(sq ? axon.T : axon.Tvert);
  bRace1.setPressed(axon.race === 'squid'); bRace2.setPressed(axon.race === 'myelin');
}
syncAxonUI();
function cableConsts(o) {
  // resting membrane of the HH model: g ≈ 0.68 mS/cm² per unit channel density
  const k = o.kind === 'squid' ? 1 : (o.myelin ? 0 : 2);
  const Ri = o.kind === 'squid' ? 35.4 : 70;
  const g = k ? 0.678e-3 * k : 1e-6 * 10 / o.D;           // S/cm²
  const cm = k ? 1 : 0.005 * 10 / o.D;                  // µF/cm²
  const Rm = 1 / g, lam = Math.sqrt(Rm * o.d / (4 * Ri)); // cm
  return { lam, tau: Rm * cm * 1e-3 };                  // cm, ms
}
// --- network
function netCam() { const d = fitDist(8.4, 7.0, 0.62); net.camD0 = d; cam.goal = { dist: d, target: [0, -0.9, -0.4], phi: 1.2, minD: Math.max(8, d * 0.45), maxD: 90, fov: 0.62 }; }
const gB1 = grp('Brain state', 'network');
const presetBtns = gB1.buttons(Object.keys(PRESETS).map((k) => ({ label: PRESETS[k].label, pressed: k === 'awake', onClick: () => { if (net.seizure && !net.seizure.stop) netSeizure(false); netSetPreset(k); } })));
const [bSeiz, bStim] = gB1.buttons([
  { label: 'Seizure', kind: 'danger', pressed: false, onClick: () => netSeizure(!(net.seizure && !net.seizure.stop)) },
  { label: 'Stimulate', onClick: () => { if (!net.ready) return; const s = net.s; netStimulate(Math.floor(Math.random() * s.Ne)); } },
]);
gB1.note('Click the brain to stimulate a spot. Hover to record from a single neuron.');
const gB2 = grp('Network', 'network');
const sDrive = gB2.slider({ id: 'nx-drive', label: 'Thalamic drive', min: 0, max: 10, step: 0.1, value: 5.5, digits: 1, format: (v) => 'σ = ' + v.toFixed(1), hint: 'Random input from the thalamus to every neuron each millisecond (Izhikevich units).', onInput: (v) => { net.drive = v / net.target.thE; } });
const sInh = gB2.slider({ id: 'nx-inh', label: 'E/I balance', min: 0.3, max: 2.5, value: 1, log: true, format: (v) => 'inhibition ×' + v.toFixed(2), hint: 'Scales every inhibitory synapse. Too little and activity runs away; more speeds the rhythm toward gamma.', onInput: (v) => { net.inhib = v; } });
const sStr = gB2.slider({ id: 'nx-str', label: 'Synaptic strength', min: 0.3, max: 2, value: 1, log: true, format: (v) => '×' + v.toFixed(2), onInput: (v) => { net.strength = v; } });
const tStdp = gB2.toggle({ id: 'nx-stdp', label: 'STDP learning', value: false, hint: 'Spike-timing-dependent plasticity: a synapse strengthens when its input fires just before the target, and weakens when it fires just after.', onChange: (v) => { net.stdp = v; toast(v ? 'STDP on: excitatory synapses now learn from spike timing' : 'STDP off: weights frozen'); } });
const gB3 = grp('View', 'network');
const sTs = gB3.slider({ id: 'nx-ts', label: 'Slow motion', min: 0.02, max: 1, value: net.timeScale, log: true, format: (v) => v >= 0.99 ? 'real time' : '×1/' + (1 / v).toFixed(1).replace(/\.0$/, ''), hint: 'At real time the alpha rhythm flickers ten times a second.', onInput: (v) => { net.timeScale = v; } });
gB3.toggle({ id: 'nx-arcs', label: 'Axon arcs', value: true, onChange: (v) => { net.arcsOn = v; if (!v) net.arcList.length = 0; } });
gB3.toggle({ id: 'nx-wire', label: 'Wiring of recorded neuron', value: true, hint: 'All 100 outgoing synapses of the neuron under the electrode. Each time it fires, the spike runs down every branch.', onChange: (v) => { wire.on = v; } });
gB3.toggle({ id: 'nx-nlab', label: 'Labels', value: true, onChange: (v) => { net.labels = v; } });
gB3.select({ id: 'nx-n', label: 'Neurons', options: [{ value: '4000', label: '4,000 neurons · 0.4 M synapses' }, { value: '10000', label: '10,000 neurons · 1 M synapses' }, { value: '20000', label: '20,000 neurons · 2 M synapses' }], value: String(net.N), onChange: (v) => { if (net.seizure) netSeizure(false); netBuild(+v); toast('Rewiring the cortex with ' + (+v).toLocaleString('en-US') + ' neurons'); } });
const gB4 = grp('Readouts', 'network');
const roN = gB4.readouts([{ id: 're', label: 'Excitatory' }, { id: 'ri', label: 'Inhibitory' }, { id: 'rh', label: 'Rhythm' }, { id: 'w', label: 'Mean E→E weight' }]);
const hud1 = ch.hud.add('Model', 'Hodgkin–Huxley 1952');
const hud2 = ch.hud.add('Membrane', '−65.0 mV');
const hud3 = ch.hud.add('Time', '×1/50');
const hudRows = [hud1, hud2, hud3];
function hudLabel(i, label) { const el = hudRows[i].el.firstChild; if (el.textContent !== label) el.textContent = label; }
function hudMode() {
  if (mode === 'spike') { hudLabel(0, 'Model'); hud1.set('Hodgkin–Huxley 1952'); hudLabel(1, 'Membrane'); hudLabel(2, 'Time'); }
  if (mode === 'axon') { hudLabel(0, 'Cable'); hudLabel(1, 'Velocity'); hudLabel(2, 'Time'); }
  if (mode === 'network') { hudLabel(0, 'Network'); hudLabel(1, 'Firing'); hudLabel(2, 'Rhythm'); }
}

/* =====================================================================
   THE JOURNEY: a guided flight from one ion channel to the whole brain.
   Each step drives the real simulation through the same controls a visitor would use.
   ===================================================================== */
const capEl = document.createElement('div'); capEl.className = 'nx-cap'; capEl.setAttribute('aria-live', 'polite');
capEl.innerHTML = '<small></small><p></p><em></em>'; document.body.append(capEl);
const capK = capEl.querySelector('small'), capP = capEl.querySelector('p');
function capPlace() {
  const W = window.innerWidth, H = window.innerHeight;
  capEl.style.left = (SMALL ? W / 2 : lay.cx) + 'px';
  if (SMALL) { capEl.style.top = (lay.T - 54) + 'px'; capEl.style.bottom = 'auto'; }
  else { capEl.style.top = 'auto'; capEl.style.bottom = (H - lay.B + 4) + 'px'; }
}
function netSpot(fx, fy) { // the excitatory neuron nearest a point of the free region (so the camera can see it)
  const x = lay.L + (lay.R - lay.L) * fx, y = lay.T + (lay.B - lay.T) * fy;
  let i = netPick(x, y, 260); if (i < 0 || !net.s || i >= net.s.Ne) i = net.s ? Math.floor(net.s.Ne * 0.3) : -1; return i;
}
const TOUR = [
  { at: 0, k: 'I · The spike', c: 'A patch of squid axon membrane, studded with ion channels. Yellow sparks are sodium ions, violet ones potassium.', run() {
    if (CL.on) tClamp.set(false, true);
    if (HH.ttxOn) tTTX.set(false, true); if (HH.teaOn) tTEA.set(false, true);
    HH.trainOn = false; bTrain.setPressed(false); sI.set(0, true); sTemp.set(6.3, true);
    setMode('spike');
  } },
  { at: 2.6, c: 'A brief pulse of current. The sodium gates snap open, Na⁺ floods in, and time slows so you can watch.', run() { hhPulse(25, 1); } },
  { at: 7.6, c: 'A beat later the potassium gates open. K⁺ streams out and the voltage falls back. The whole spike is over in a couple of milliseconds.', run() { hhPulse(25, 1); } },
  { at: 12.6, k: 'II · The axon', c: 'A spike does not stay put. Current flowing ahead of it wakes the next patch of membrane, so the pulse rebuilds itself as it goes.', run() {
    axon.fibre = 'squid'; axon.race = 'off'; axon.lesion = 1; axon.T = 18.5; sLes.set(1); selF.set('squid'); sPlay.set(1, true);
    syncAxonUI(); axonBuild(); setMode('axon'); axonFire();
  } },
  { at: 20.6, c: 'Vertebrates wrapped their axons in myelin. The impulse leaps from node to node, faster than the squid’s in a fibre fifty times thinner.', run() {
    axon.fibre = 'vert'; axon.myelin = true; axon.D = 10; axon.Tvert = 37; sD.set(10); selF.set('vert');
    syncAxonUI(); axonBuild(); axonCam(); axonFire();
  } },
  { at: 29.6, k: 'III · The network', c: () => { const N = net.s ? net.s.N : net.N, S = N * NETCFG.K; return `${N.toLocaleString('en-US')} model neurons, ${S >= 1e6 ? S / 1e6 + ' million' : S.toLocaleString('en-US')} synapses. Nobody built a rhythm in, yet they hum near 10 Hz, like a resting human cortex.`; }, run() {
    if (net.seizure && !net.seizure.stop) netSeizure(false);
    if (net.preset !== 'awake') netSetPreset('awake');
    sTs.set(0.25, true); setMode('network');
  } },
  { at: 38.6, c: 'Touch one spot and the excitation spreads outward through the local wiring.', run() { if (net.ready) netStimulate(netSpot(0.42, 0.4)); } },
  { at: 45.6, c: 'Attention drives the circuit harder. Inhibition tightens the loop and the rhythm quickens into gamma.', run() { if (net.ready) netSetPreset('focused'); } },
  { at: 53.6, c: 'Now let inhibition fail. A seizure breaks out of the temporal lobe and pulls every neuron into lockstep.', run() { if (net.ready) { netSetPreset('awake'); net.selUser = false; netSeizure(true); } } },
  { at: 64.6, c: 'Restore inhibition and the storm passes, into a postictal hush.', run() { if (net.ready) netSeizure(false); } },
  { at: 70.6, k: 'You', c: 'About 86 billion neurons are doing this inside your head, right now, as you read this.', run() {} },
  { at: 78.5, end: true },
];
const tour = { t: 0, i: 0, capT: 0 };
function tourStart() {
  tourOn = true; tour.t = 0; tour.i = 0; document.body.classList.add('nx-touring');
  const notes = document.querySelector('.cz-notes');
  tour.notesWere = !!(notes && !notes.classList.contains('cz-folded')); if (tour.notesWere) ch.foldNotes(true);
  tourBtn.setAttribute('aria-pressed', 'true'); tourBtn.querySelector('span').textContent = 'Stop';
  tourBtn.classList.remove('nx-hint');
}
function tourStop() {
  if (!tourOn) return;
  tourOn = false; capEl.classList.remove('on'); document.body.classList.remove('nx-touring');
  if (tour.notesWere) { tour.notesWere = false; ch.foldNotes(false); }
  tourBtn.setAttribute('aria-pressed', 'false'); tourBtn.querySelector('span').textContent = 'Journey';
}
function tourTick(dt) {
  tour.t += dt;

    const st = TOUR[tour.i++];

    try { st.run(); } catch (e) { tourStop(); return; }
    if (st.k) capK.textContent = st.k;
    capP.textContent = typeof st.c === 'function' ? st.c() : st.c; capPlace();

  }
  capEl.style.setProperty('--p', clamp(tour.t / TOUR[TOUR.length - 1].at, 0, 1).toFixed(4));

  const next = TOUR[tour.i];

}
// a visitor who takes the controls ends the journey
document.addEventListener('pointerdown', (e) => { if (tourOn && e.isTrusted && e.target.closest && e.target.closest('.cz-deck')) tourStop(); }, true);

function onHHSpike() {
  spike.flash = 1;
  if (mode === 'spike') click(0.8, 0, 1, 0);
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let fps = 60, fpsAcc = 0, fpsN = 0, roT = 0;
function stepSpike(dtWall) {
  // wash-in/out of drugs over about a second of wall time
  HH.ttx += ((HH.ttxOn ? 1 : 0) - HH.ttx) * (1 - Math.exp(-dtWall * 1.6));
  HH.tex += ((HH.teaOn ? 1 : 0) - HH.tex) * (1 - Math.exp(-dtWall * 1.6));
  // spend this frame's wall-clock budget; in bullet time each step costs more wall time when V moves fast
  let wall = dtWall * 1000, guard = 0;
  const dt = 0.01;
  let naQ = 0, kQ = 0, vmin = 1;
  while (wall > 0 && guard++ < 6000) {
    const dvdt = Math.abs(hk[0]);
    const f = CL.on ? (HH.t >= CL.tStart && HH.t < CL.tStart + 3 ? 0.25 : 1) : spike.bullet ? 1 / (1 + dvdt / 12) : 1;
    const sp = spike.speed * f; vmin = Math.min(vmin, f);

    hhStep(dt);
    naQ += Math.max(0, -HH.iNa) * dt; kQ += Math.max(0, HH.iK - 1.5) * dt;
    if (HH.t >= hist.next) { histPush(); hist.next = HH.t + HDT; }
  }
  spike.effSpeed = spike.speed * vmin;
  spike.bulletK = lerp(spike.bulletK || 1, vmin, 0.2);
  // charge → visible ion transits (≈ 0.8 per nC/cm²)
  spike.naQueue += naQ * 1.1; spike.kQueue += kQ * 1.0;
  spikeScene(dtWall);
}
ch.loop((dt, t) => {
  frameU.t = t;
  if (tourOn && dt > 0) tourTick(dt);
  G.fit(canvas, MAXDPR);
  fitOverlay();
  camUpdate(dt, t);
  modeFade = Math.min(1, modeFade + dt * 1.6);
  if (mode === 'spike') {
    if (dt > 0) stepSpike(dt);
    spikeDraw();
    beginScene(ERA, 1);
    drawTube(spike.tube, spike.data, { x0: spike.x0, x1: spike.x1, r: RAX, glow: 0, fog: 0.035, pulse: 0.3, endFade: 1 });
    drawTube(spike.tube, spike.data, { x0: spike.x0, x1: spike.x1, r: RAX * 0.94, glow: 0, fog: 0.035, bright: 0.55, endFade: 1 });
    drawGlow(spike.glow, { minPx: 1.3, fog: 0.03, maxPx: 90 });
    drawDiscs(spike.discs);
    endScene(0.9, 1.0, modeFade);
    spikeLabels();
    drawSpikeRig();
  } else if (mode === 'axon') {
    if (dt > 0) axonStep(dt);
    axonDraw();
    beginScene(ERA, 0.7);
    drawAxonScene();
    endScene(0.9, 1.0, modeFade);
    axonLabels();
    drawAxonRig();
  } else if (mode === 'network') {
    if (dt > 0) netFrame(dt);
    if (net.hoverXY && net.ready && !ptr.down && (frameU.hov = (frameU.hov || 0) + 1) % 4 === 0) { const i = netPick(net.hoverXY[0], net.hoverXY[1], 16); if (i >= 0 && i !== net.sel) { net.sel = i; net.selUser = true; net.vrec.fill(-65); } }
    netDraw(dt);
    beginScene(ERA, 0.8);
    drawNetScene();
    // exposure eases down as the camera moves in, so a close view of the glowing cortex stays legible
    const zk = clamp(cam.dist / (net.camD0 || cam.dist), 0.3, 1);
    endScene(1.0, 0.5 + 0.5 * zk, modeFade);
    netLabels();
    drawNetRig();
  }
  if (mode !== 'network' && net.ready && net.s.t < 2400 && dt > 0) netWarm(24);
  // readouts
  fpsAcc += dt; fpsN++;
  if ((roT += dt) > 0.2) {
    roT = 0; if (fpsAcc > 0) fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    if (mode === 'spike') {
      const sp = HH.spikes, rate = sp.length > 2 && HH.t - sp[sp.length - 1] < 3 * (sp[sp.length - 1] - sp[sp.length - 2]) + 5 ? 1000 / ((sp[sp.length - 1] - sp[0]) / (sp.length - 1)) : 0;
      ro.v.set(HH.V.toFixed(1) + ' mV' + (CL.on ? ' · clamped' : '')); ro.rate.set(rate && !CL.on ? rate.toFixed(0) + ' Hz' : '—');
      ro.peak.set(CL.on ? '—' : HH.lastPeak.toFixed(1) + ' mV'); ro.width.set(HH.apWidth && !CL.on ? HH.apWidth.toFixed(2) + ' ms' : '—');
      ro.gna.set((HH.gNa * (1 - HH.ttx) * HH.m ** 3 * HH.h).toFixed(2) + ' mS/cm²'); ro.gk.set((HH.gK * (1 - HH.tex) * HH.n ** 4).toFixed(2) + ' mS/cm²');
      hud2.set(HH.V.toFixed(1) + ' mV'); hud3.set('×1/' + Math.round(1 / spike.effSpeed) + (spike.bulletK < 0.6 ? ' · bullet time' : ' slow motion'));
      hud1.set(CL.on ? 'voltage clamp · step to ' + (CL.cmd > 0 ? '+' : '') + CL.cmd + ' mV' : 'Hodgkin–Huxley 1952');
    } else if (mode === 'axon' && axon.lanes.length) {
      const l = axon.lanes[axon.lanes.length - 1], c = l.c;
      hud1.set(axon.lanes.length > 1 ? 'race · ' + axon.lanes.length + ' fibres' : c.N + ' HH compartments · ' + (c.length).toFixed(c.length < 1 ? 2 : 1) + ' cm');
      hud2.set(axon.lanes.map((q) => q.blocked && q.t2 < 0 ? 'conduction block' : q.cv ? q.cv.toFixed(q.cv < 10 ? 2 : 1) + ' m/s' : '—').join('  vs  '));
      const sp = axon.speed * axon.speedMul; hud3.set('×1/' + Math.round(1 / sp).toLocaleString('en-US') + ' slow motion');
      roA.cv.set(l.blocked && l.t2 < 0 ? 'blocked' : l.cv ? l.cv.toFixed(l.cv < 10 ? 2 : 1) + ' m/s' : '—');
      roA.dt.set(l.blocked && l.t2 < 0 ? 'no arrival' : l.t2 > 0 ? ((l.t2 - l.t1) < 1 ? ((l.t2 - l.t1) * 1000).toFixed(0) + ' µs' : (l.t2 - l.t1).toFixed(2) + ' ms') : '—');
      const k = cableConsts(c.o); roA.lam.set(k.lam < 1 ? (k.lam * 10).toFixed(2) + ' mm' : k.lam.toFixed(2) + ' cm'); roA.tau.set(k.tau < 1 ? (k.tau * 1000).toFixed(0) + ' µs' : k.tau.toFixed(2) + ' ms');
    } else if (mode === 'network') {
      if (net.ready) {
        const s = net.s;
        hud1.set(s.N.toLocaleString('en-US') + ' Izhikevich neurons · ' + (s.S / 1e6).toFixed(1) + ' M synapses' + (net.building ? ' · rewiring…' : ''));
        hud2.set('E ' + net.rE.toFixed(1) + ' Hz · I ' + net.rI.toFixed(1) + ' Hz');
        hud3.set(net.seizure && !net.seizure.stop ? 'seizure · ' + bandName(net.peakF) + ' ' + net.peakF.toFixed(1) + ' Hz' : net.peakF > 0 ? bandLong(net.peakF) + ' · ' + net.peakF.toFixed(1) + ' Hz' : 'measuring…');
        roN.re.set(net.rE.toFixed(1) + ' Hz'); roN.ri.set(net.rI.toFixed(1) + ' Hz'); roN.rh.set(net.peakF > 0 ? bandName(net.peakF) + ' ' + net.peakF.toFixed(1) + ' Hz' : '—');
        if (net.stdp || net.meanW !== net.w0mean) { let sw = 0, nw = 0; for (let q = 0; q < 4000; q++) { const i = (Math.random() * s.Ne) | 0, k = (i * s.K + ((Math.random() * s.K) | 0)); if (s.post[k] < s.Ne) { sw += s.w[k]; nw++; } } net.meanW = sw / Math.max(1, nw); }
        roN.w.set(net.meanW.toFixed(3) + (net.stdp ? ' · learning' : ''));
      } else { hud1.set('building…'); hud2.set('—'); hud3.set('—'); }
    }
  }
});
ch.onKey('p', () => { if (mode === 'spike') hhPulse(); }, 'Stimulus pulse');
ch.onKey('j', () => { if (tourOn) tourStop(); else tourStart(); }, 'Play or stop the journey');
ch.onKey('1', () => { tourStop(); setMode('spike'); }, 'The spike');
ch.onKey('2', () => { tourStop(); setMode('axon'); }, 'The axon');
ch.onKey('3', () => { tourStop(); setMode('network'); }, 'The network');

setMode('spike');
layout();
// if the visitor stays on the membrane, invite them onward to the network after a while
const hint = (b) => { b.classList.add('nx-hint'); b.addEventListener('animationend', () => b.classList.remove('nx-hint'), { once: true }); };
setTimeout(() => { if (mode === 'spike' && !tourOn) hint(tourBtn); }, 5000);
setTimeout(() => { if (mode === 'spike' && !tourOn) hint(modeBtns[2]); }, 22000);
setTimeout(() => { if (!net.ready && !net.building) netBuild(net.N); }, 1200);
setTimeout(layout, 0);
// warm the membrane up so the first frame is already mid-rhythm
for (let i = 0; i < 3000; i++) { hhStep(0.01); if (HH.t >= hist.next) { histPush(); hist.next = HH.t + HDT; } }

Cosmos.debug.internals = () => ({ net, axon, HH, spike, cam, lay, tour, tourStart, tourStop });
Cosmos.debug.state = () => ({
  mode, fps: Math.round(fps), journey: tourOn ? +tour.t.toFixed(1) : null,
  hh: { V: +HH.V.toFixed(2), m: +HH.m.toFixed(4), h: +HH.h.toFixed(4), n: +HH.n.toFixed(4), t: +HH.t.toFixed(2), T: HH.T, spikes: HH.spikes.length, lastPeak: +HH.lastPeak.toFixed(1), width: +HH.apWidth.toFixed(3), ttx: +HH.ttx.toFixed(2), tea: +HH.tex.toFixed(2) },
  axon: axon.lanes.map((l) => ({ name: l.name, N: l.c.N, lengthCm: +l.c.length.toFixed(3), T: l.c.o.T, cv: +l.cv.toFixed(2), t: +l.c.t.toFixed(3), arrivedMs: l.arrivedAt ? +l.arrivedAt.toFixed(3) : null, blocked: l.blocked, lesion: l.c.lesion == null ? null : l.c.lesion })),
  net: net.ready ? { N: net.s.N, synapses: net.s.S, simMs: net.s.t, rateE: +net.rE.toFixed(2), rateI: +net.rI.toFixed(2), peakHz: +net.peakF.toFixed(2), band: bandLong(net.peakF), preset: net.preset, seizure: !!(net.seizure && !net.seizure.stop), stdp: net.stdp, meanW: +net.meanW.toFixed(4), arcs: net.arcList.length, frameCostMs: +net.frameCost.toFixed(2), sel: net.sel } : { building: net.building, msg: net.buildMsg },
});
})();
