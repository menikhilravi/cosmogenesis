/* =====================================================================
   Chapter 11 · First Life
   Continuous cellular automata (Lenia, SmoothLife) computed on the GPU and
   viewed through a dark-field microscope.
   ===================================================================== */

const NOTES = `
<p>You are looking down a microscope at something that is not alive, and not quite dead either. Each glowing shape is a pattern in a continuous field of numbers. Every point obeys the same rule: sense your surroundings through a soft ring, grow if the average is just right, and fade if it is not.</p>
<p>From that one rule come creatures. <em>Orbium</em> glides like a tiny jellyfish and keeps its shape for as long as you watch. When two meet, usually both dissolve. Sometimes one survives. Now and then a collision ignites a labyrinth that spreads until it fills the dish.</p>
<p>This is a toy model of the deepest question about the young Earth, about 3.8 billion years ago: how does chemistry become something that keeps itself going, copies itself and changes? Nobody saw it happen. Patterns like these show how little machinery self-maintenance and self-copying need, and how narrow the conditions for them are.</p>
<p>The atlas in the deck holds hundreds of tiny worlds, each with its own settings and each seeded with one Orbium. It survives only on a thin diagonal. Step off it and life either fades away or runs riot. The faint wakes behind each creature are a long exposure: they show where it has been over the last second or two.</p>
<h4>Try this</h4>
<ul>
<li>Tap the slide to drop a new creature into the school. Drag to pan; scroll or pinch to zoom. On a computer, hover anywhere to see the ring that point senses and whether the rule tells it to grow or fade.</li>
<li>Slide σ down from 0.015 to 0.013 and the school dissolves. Push it up to 0.019 and they swell into a labyrinth. Watch the bars in <em>Anatomy of the rule</em> slide off the bell as you do it.</li>
<li>Pick <strong>Self-replicating cells</strong>: one cell becomes two, then four, and the organism count traces a real growth curve.</li>
<li>Pick <strong>Three-channel cells</strong> or <strong>crescents</strong>: three interacting fields, each shown as its own fluorescent dye. Press <kbd>A</kbd> to see where they grow and where they decay.</li>
</ul>`;
const SCIENCE = `
<h4>Lenia</h4>
<p>The state is a field A(x, t) between 0 and 1 on a 512 × 512 grid whose edges wrap around (256 × 256 on phones). Every step, each cell looks at its neighbours through a ring-shaped kernel K and grows or shrinks:</p>
<span class="eq">A<sup>t+Δt</sup> = clip[ A<sup>t</sup> + Δt · G(K ∗ A<sup>t</sup>), 0, 1 ],&nbsp;&nbsp; Δt = 1/T</span>
<span class="eq">K<sub>C</sub>(ρ) = exp(4 − 1 / (ρ(1 − ρ))),&nbsp; 0 &lt; ρ &lt; 1,&nbsp;&nbsp; ρ = |x|/R,&nbsp;&nbsp; ΣK = 1</span>
<span class="eq">G(u) = 2 exp(−(u − μ)² / 2σ²) − 1</span>
<p>A kernel with several rings uses peaks β: K(ρ) = β<sub>⌊Bρ⌋</sub> K<sub>C</sub>(Bρ mod 1) for B rings. <em>Orbium</em> lives at R = 13 cells, T = 10, μ = 0.15, σ = 0.015, β = [1]. Here its mass ΣA is about 71 and it glides 0.62 cells per step. The convolution runs directly on the GPU: each cell sums about 530 weighted neighbours from a precomputed tap texture, with no Fourier transform.</p>
<h4>Extended Lenia</h4>
<p>Chan’s 2020 generalisation adds more kernels and channels. With several kernels on one channel, A grows by Δt Σ h<sub>k</sub> G<sub>k</sub>(K<sub>k</sub> ∗ A), where the weights h<sub>k</sub> sum to 1. The self-replicating cells and the primordial soup each use three kernels. The three-channel cultures run three fields at once, shown as three dyes, with six kernels: each channel feeds itself and the next one around (0→0, 1→1, 2→2, 0→1, 1→2, 2→0). Growth into a channel is the h-weighted mean of the kernels that target it. The rotator uses a two-ring kernel, β = [1, ½], μ = 0.252, σ = 0.026, and turns about 0.021 radians per step. All of these were found for this page by GPU searches: 1,440 random three-kernel rules, 1,440 random three-channel rules, and a scan of two-ring parameters. They are not species from Chan’s catalogue. His own self-replicator is called <em>Geminium</em>.</p>
<h4>Reading the rule</h4>
<p>The <em>Anatomy of the rule</em> chart draws the kernel K and the growth curve G. Behind the curve is a live histogram of U = K ∗ A over the living tissue, where the block-averaged A exceeds 0.03, sampled on a 4-cell grid four times a second. Green bars sit where G &gt; 0 and the tissue grows. Blue bars sit where it decays. In the Orbium school only about a third of the living tissue sits under the bell at any moment. Growth gathers at the leading edge and decay at the trailing edge, which is how a pattern with no moving parts travels (press <kbd>A</kbd> to see it). For rules with several kernels the chart shows kernel 1 only. The kernel lens reads the same grid under the cursor.</p>
<h4>SmoothLife</h4>
<p>Rafler’s continuous Game of Life measures the filling m of an inner disc (radius r<sub>a</sub>/3) and the filling n of the surrounding annulus (r<sub>a</sub> = 21 cells), then sets the next state with smooth thresholds:</p>
<span class="eq">f ← s(n, m) = σ<sub>2</sub>(n, σ<sub>m</sub>(b<sub>1</sub>, d<sub>1</sub>, m), σ<sub>m</sub>(b<sub>2</sub>, d<sub>2</sub>, m))</span>
<span class="eq">σ<sub>1</sub>(x, a) = 1 / (1 + e<sup>−4(x − a)/α</sup>),&nbsp; σ<sub>2</sub>(x, a, b) = σ<sub>1</sub>(x, a)(1 − σ<sub>1</sub>(x, b))</span>
<p>Here σ<sub>m</sub>(x, y, m) = x(1 − σ<sub>1</sub>(m, ½)) + y σ<sub>1</sub>(m, ½), with b<sub>1</sub> = 0.278, b<sub>2</sub> = 0.365, d<sub>1</sub> = 0.267, d<sub>2</sub> = 0.445, α<sub>n</sub> = 0.028 and α<sub>m</sub> = 0.147. Time is discrete, and the glider shown was grown from a speckled soup. It travels 5.3 cells per step.</p>
<h4>From Conway’s Life to Lenia</h4>
<p>In Conway’s Game of Life, cells are 0 or 1, the neighbourhood is the 8 surrounding squares, and time moves in whole steps: a cell is born with exactly 3 live neighbours and survives with 2 or 3. Lenia makes all three continuous. States become real numbers, the neighbourhood becomes a smooth ring of radius R, and the time step shrinks to 1/T. Space really is continuous here: an Orbium rescaled to R = 9, 18 or 24 cells keeps living. Time is touchier. In test runs at μ = 0.15 and σ = 0.015 it survived every T from 4 to 16, but dissolved at T = 3 and below, and at T = 20 and 40. The knife edge runs through time as well as through μ and σ.</p>
<h4>What would count as alive?</h4>
<p>Common criteria are an individual that maintains itself, reproduces, and carries variation that natural selection can act on. Orbium maintains itself. The replicating cells also reproduce. None of these patterns carries heritable variation, so none of them can evolve. Gánti’s <em>chemoton</em> is a classic minimal model of a living thing: an autocatalytic metabolic cycle, a template polymer and a self-assembling membrane, each driving the others.</p>
<h4>Real first life</h4>
<p>The oldest widely accepted traces of life are stromatolites, layered mounds built by microbial mats, in rocks about 3.43 to 3.48 billion years old in the Pilbara of Western Australia. Estimates for LUCA, the last universal common ancestor of bacteria and archaea, range from about 3.5 to 4.2 billion years ago.</p>
<h4>What is simplified</h4>
<p>The scale is fictional: one cell is drawn as 2 µm and T steps as one second. Colours are rendering choices. Dark-field brightness follows the gradient of A. The epifluorescence false colours show A in green, dense cores in blue, growth in cyan and decay in magenta. Nothing here actually fluoresces. The wakes are a running maximum of A that decays with an e-folding time of 1.5 s (0.4 s for the fast SmoothLife gliders). The atlas runs one Orbium in each 40 × 40 tile for 320 steps over μ 0.08–0.23 and σ 0.004–0.030. A tile dissolves if its mass falls below 8 % of the seed’s and overgrows if it passes twice the seed’s; otherwise it glides if its centre of mass keeps moving, and lives in place if not. Organisms are the connected pieces of a 4 × 4-averaged copy of the field, read back from the GPU four times a second. Head-on collisions in headless test runs usually destroyed both Orbium. Crowded schools always ended empty or overgrown, so the dish re-plates itself.</p>
<span class="cite">Gardner, M. (1970). Mathematical Games: The fantastic combinations of John Conway’s new solitaire game “life”. Scientific American 223(4), 120–123.</span>
<span class="cite">Rafler, S. (2011). Generalization of Conway’s “Game of Life” to a continuous domain: SmoothLife. arXiv:1111.1567.</span>
<span class="cite">Chan, B. W.-C. (2019). Lenia: Biology of artificial life. Complex Systems 28(3), 251–286.</span>
<span class="cite">Chan, B. W.-C. (2020). Lenia and expanded universe. ALIFE 2020: The 2020 Conference on Artificial Life. MIT Press.</span>
<span class="cite">Gánti, T. (2003). The Principles of Life. Oxford University Press.</span>
<span class="cite">Allwood, A. C. et al. (2006). Stromatolite reef from the Early Archaean era of Australia. Nature 441, 714–718.</span>`;

function encounter(x, y, dA, oy, sep) {

// The staged encounters: geometries measured in headless runs (see science notes).
// Hero pair: turned 0.1 rad from head-on, offset 9 cells laterally, one Orbium survives.
// Second pair: offset 3 cells, both dissolve.
const HERO = small ? { sep: 88, dA: 0.1, oy: 9 } : { sep: 130, dA: 0.1, oy: 9 };
const PAIR2 = { sep: 175, dA: 0.1, oy: 3, dx: 30, dy: 95 };

  const rng = Ut.rng(seed || 20);

  const corridors = [];
  encounter(cx, cy, HERO.dA, HERO.oy, HERO.sep);
  corridors.push([cx - HERO.sep - 20, cy, cx + HERO.sep + 20, cy + HERO.oy]);
  if (!small) {
    encounter(cx + PAIR2.dx, cy + PAIR2.dy, PAIR2.dA, PAIR2.oy, PAIR2.sep);
    corridors.push([cx + PAIR2.dx - PAIR2.sep - 20, cy + PAIR2.dy, cx + PAIR2.dx + PAIR2.sep + 20, cy + PAIR2.dy + PAIR2.oy]);
  }

  const pts = [];

  while (pts.length < n && tries++ < 8000) {
    const x = rng() * N, y = rng() * N;
    if (pts.some((q) => tdist(q[0], q[1], x, y) < 52)) continue;
    if (corridors.some((c) => segDist(x, y, ...c) < 44)) continue;
    if (tdist(x, y, cx, cy) < (small ? 70 : 120)) continue;
    const dir = rng() < 0.75 ? head + (rng() - 0.5) * 0.9 : rng() * TAU;
    // do not aim anything straight into the hero's path during the opening
    const fx = x + Math.cos(dir) * 180, fy = y + Math.sin(dir) * 180;
    if (corridors.some((c) => segDist(fx, fy, ...c) < 30 || segDist((x + fx) / 2, (y + fy) / 2, ...c) < 30)) continue;

}

/* the opening: follow one Orbium, pull back to reveal the school, watch the collision */
const intro = { on: false, k: 0, contact: 0, P: [0, 0], A0: [0, 0], verdict: false };

}
function startIntro() {
  const cx = view.cx, cy = view.cy;
  intro.on = true; intro.verdict = false;
  intro.A0 = [cx - HERO.sep, cy]; intro.P = [cx, cy + HERO.oy / 2];
  intro.contact = (2 * HERO.sep - 22) / (2 * 0.616);
  intro.z0 = small ? 5.2 : 7.5; intro.z1 = view.tscale || view.scale;
  view.tscale = null; view.scale = intro.z0;
  view.cx = intro.A0[0]; view.cy = intro.A0[1];
  intro.stage = 0;
}
function updateIntro() {
  const k = sim.gen;
  const hx = intro.A0[0] + 0.616 * k, hy = intro.A0[1];
  const w = Ut.smoothstep(intro.contact * 0.25, intro.contact * 0.95, k);
  view.cx = Ut.lerp(hx, intro.P[0], w); view.cy = Ut.lerp(hy, intro.P[1], w);
  view.scale = Ut.lerp(intro.z0, intro.z1, Ut.smoothstep(intro.contact * 0.15, intro.contact * 0.8, k));
  if (intro.stage === 0 && k > 6) { intro.stage = 1; caption('One Orbium. No genes, no membrane: one rule, applied everywhere at once.', 4.4); }
  if (intro.stage === 1 && k > intro.contact * 0.5) { intro.stage = 2; caption('Pull back, and there is a whole school of them.', 3.4); }
  if (intro.stage === 2 && k > intro.contact * 0.83) {
    intro.stage = 3; caption('Two are on a collision course.', 2.6);
    // remember the two protagonists, so strays drifting in later are not mistaken for survivors
    intro.ids = tracks.filter((t) => !t.miss && t.age > 1).sort((a, b) => tdist(a.x, a.y, intro.P[0], intro.P[1]) - tdist(b.x, b.y, intro.P[0], intro.P[1])).slice(0, 2).map((t) => t.id);
  }
  if (intro.stage === 3 && k > intro.contact + 95 && anaGen > intro.contact + 90) {
    intro.stage = 4;
    const ids = intro.ids || [];
    let alive = tracks.filter((t) => ids.includes(t.id) && !t.miss && tdist(t.x, t.y, intro.P[0], intro.P[1]) < 140).length;
    if (!ids.length) alive = tracks.filter((t) => !t.miss && t.age > 1 && tdist(t.x, t.y, intro.P[0], intro.P[1]) < 60).length;

  }

}

/* ---------------- anatomy of the rule: the kernel, the growth map, and where the living field sits on it */
const gAnat = ch.ui.group('Anatomy of the rule');
const anatCanvas = gAnat.canvas(small ? 124 : 132);
const anatNote = gAnat.note('');
const anat = { hist: new Float32Array(64), grow: 0, tissue: 0, pts: new Float32Array(1200), np: 0, kimg: null, kkey: '', simg: null, skey: '', uMax: 0.4 };

function growthG(u, mu, sg) { const d = u - mu; return 2 * Math.exp(-d * d / (2 * sg * sg)) - 1; }
function slS(r, n, m) {

  const cx = c.getContext('2d'), img = cx.createImageData(S, S), d = img.data;

// Collect the live distribution of U (or of (n, m) for SmoothLife) over living tissue from the analysis readback.
function anatomyCollect(buf) {

  anat.hist.fill(0); anat.grow = 0; anat.tissue = 0; anat.np = 0;
  if (L) { const k = r.kernels[0]; anat.uMax = Math.min(1, Math.max(0.3, k.mu * 2.2 + 3 * k.sigma)); }
  const NB = anat.hist.length, stride = Math.max(1, Math.floor((M * M) / 4000));

function drawAnatomy() {
