<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You Are Here · Cosmogenesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="cosmos.css">
<style>
  /* ---- chapter 22: You Are Here ---- */
  :root {
    --paper: #ede5d2; --paper-2: #e4dac4; --ink: #1c1a17; --ink-2: #544f47; --ink-3: #8a8375; --stamp: #b0392b;
    --rc-w: 330px;
  }

  /* scene overlay: formation labels, galaxy marker, pick tooltip */
  .yo-over { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .yo-flab {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); text-align: center; white-space: nowrap;
    font: 600 9.5px/1.3 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--c, var(--star));
    opacity: 0; transition: opacity .7s var(--ease); text-shadow: 0 1px 10px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.9);
  }
  .yo-flab b { display: block; font: italic 500 18px/1.1 var(--f-display); letter-spacing: 0; text-transform: none; color: var(--star); margin: 3px 0 2px; }
  .yo-flab small { display: block; color: var(--dust); letter-spacing: .06em; text-transform: none; font-weight: 500; font-size: 10.5px; }
  .yo-flab.side { text-align: left; } .yo-flab.side.sl { text-align: right; }
  .yo-flab.side::after, .yo-flab.below::after { display: none; }
  .yo-flab.below::before { content: ""; display: block; width: 1px; height: 12px; margin: 0 auto 5px; background: linear-gradient(transparent, var(--c, var(--star))); opacity: .7; }
  .yo-flab::after { content: ""; display: block; width: 1px; height: 14px; margin: 5px auto 0; background: linear-gradient(var(--c, var(--star)), transparent); opacity: .7; }
  .yo-sun { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity 1s var(--ease); }
  .yo-sun i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--era); box-shadow: 0 0 10px var(--era-soft); }
  .yo-sun i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 2px; height: 2px; border-radius: 50%; background: var(--era); }
  .yo-sun b { position: absolute; left: 0; top: 0; height: 1px; transform-origin: 0 50%; background: linear-gradient(90deg, rgba(255,233,199,.7), rgba(255,233,199,.25)); }
  .yo-sun span {
    position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 9.5px/1.35 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--era);
    text-shadow: 0 1px 8px rgba(0,0,0,.95); border-left: 1px solid rgba(255,233,199,.45); padding: 1px 0 2px 8px;
  }
  .yo-sun span small { display: block; color: var(--dust); letter-spacing: .06em; text-transform: none; font-weight: 500; font-size: 10px; }
  .yo-tip {
    position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity .15s;
    padding: 7px 10px 8px; border-radius: 8px; background: rgba(8,10,19,.86); border: 1px solid var(--line-strong);
    font: 500 11px/1.4 var(--f-mono); color: var(--dust); white-space: nowrap; transform: translateY(-50%);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .yo-tip b { display: block; font: italic 500 16px/1.15 var(--f-display); color: var(--star); margin-bottom: 1px; }
  .yo-tip i { font-style: normal; color: var(--c, var(--era)); }
  .yo-cap {
    position: fixed; z-index: 21; left: 0; top: 0; width: 220px; text-align: left; pointer-events: none; opacity: 0; transition: opacity .35s var(--ease);
    text-shadow: 0 1px 14px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.8); border-left: 1px solid var(--c, var(--era)); padding: 2px 0 4px 12px;
  }
  .yo-cap.on { opacity: 1; }
  .yo-cap .k { font: 600 10px/1.3 var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--c, var(--era)); }
  .yo-cap .t { font: italic 500 22px/1.1 var(--f-display); color: var(--star); margin: 4px 0 6px; text-wrap: balance; }
  .yo-cap .d { font: 500 10.5px/1.5 var(--f-mono); color: var(--dust); }

  .yo-intro {
    position: fixed; z-index: 21; left: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 6px); transform: translateX(-50%);
    width: min(470px, calc(100vw - 32px)); text-align: center; pointer-events: none; opacity: 0; transition: opacity .8s var(--ease);
    text-shadow: 0 1px 14px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.8);
  }
  .yo-intro .k { font: 600 10px/1.3 var(--f-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--era); }
  .yo-intro .t { font: italic 500 clamp(22px, 2.3vw, 30px)/1.1 var(--f-display); color: var(--star); margin: 5px 0 5px; text-wrap: balance; }
  .yo-intro .d { font: 400 13px/1.5 var(--f-ui); color: #cfc9bb; text-wrap: balance; }
  @media (max-width: 760px) { .yo-intro .d { display: none; } .yo-intro .t { font-size: 20px; } body.yo-echo .yo-intro .d { display: block; font-size: 11.5px; } }

  /* light-echo labels */
  .yo-elab {
    position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .5s var(--ease), color .6s;
    font: 600 9px/1.25 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dust);
    text-shadow: 0 1px 8px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.9); padding-left: 7px; border-left: 1px solid rgba(255,255,255,.18);
  }
  .yo-elab small { display: block; font-weight: 500; letter-spacing: .04em; text-transform: none; font-size: 9.5px; color: var(--faint); }
  .yo-elab.on { color: var(--era); border-left-color: var(--era); }
  .yo-elab.on small { color: var(--dust); }
  .yo-elab.ring { border-left: 0; padding: 0; color: rgba(255,233,199,.5); font-weight: 500; letter-spacing: .1em; }
  @media (max-width: 760px) { .yo-elab small { display: none; } .yo-elab { font-size: 8.5px; } }

  /* ---------------- the receipt ---------------- */
  .yo-rc {
    position: fixed; z-index: 22; width: calc(var(--rc-w) + 20px);
    top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 2px);
    bottom: calc(var(--foot-h) + env(safe-area-inset-bottom, 0px) + 4px);
    right: calc(var(--gutter) + 304px + 14px);
    display: flex; flex-direction: column; pointer-events: none;
    transition: right .7s var(--ease), opacity .6s var(--ease), transform .7s var(--ease);
  }
  .yo-rc.deck-shut { right: var(--gutter); }
  .yo-rc.gone { opacity: 0; transform: translateY(24px); }
  .yo-rc.gone * { pointer-events: none !important; }
  body.cz-cinema .yo-rc { opacity: 0; transform: translateY(24px); }
  body.cz-cinema .yo-rc * { pointer-events: none !important; }
  .yo-win { position: relative; flex: 1; min-height: 0; margin: 0 10px; overflow: hidden; pointer-events: auto; }
  .yo-scroll {
    position: absolute; inset: 0; overflow-x: hidden; overflow-y: hidden; scrollbar-width: none; overscroll-behavior: contain;
    touch-action: pan-y; will-change: transform;
  }
  .yo-scroll.live { overflow-y: auto; }
  .yo-scroll::-webkit-scrollbar { display: none; }
  .yo-win::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46px; pointer-events: none;
    background: linear-gradient(to bottom, rgba(5,6,12,0), rgba(5,6,12,.55));
  }
  .yo-tear { height: 7px; background:
      linear-gradient(-45deg, var(--paper) 5px, transparent 0) 0 0 / 10px 10px repeat-x,
      linear-gradient(45deg, var(--paper) 5px, transparent 0) 0 0 / 10px 10px repeat-x; transform: scaleY(-1); }
  .yo-tear.bot { transform: none; background:
      linear-gradient(-45deg, var(--paper-2) 5px, transparent 0) 0 0 / 10px 10px repeat-x,
      linear-gradient(45deg, var(--paper-2) 5px, transparent 0) 0 0 / 10px 10px repeat-x; margin-bottom: 30px; }
  .yo-paper {
    position: relative; padding: 16px 16px 34px; color: var(--ink);
    background:
      linear-gradient(90deg, rgba(60,45,20,.10), rgba(60,45,20,0) 7%, rgba(60,45,20,0) 93%, rgba(60,45,20,.10)),
      linear-gradient(180deg, #f1eadb, var(--paper) 30%, var(--paper-2));
    font: 400 10.8px/1.55 var(--f-mono); letter-spacing: .005em; font-variant-numeric: tabular-nums;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
  }
  .yo-paper ::selection { background: var(--ink); color: var(--paper); }
  .yo-c { text-align: center; }
  .yo-b { font-weight: 600; }
  .yo-dim { color: var(--ink-2); }
  .yo-faint { color: var(--ink-3); }
  .yo-logo { display: block; margin: 4px auto 8px; image-rendering: pixelated; width: 192px; height: 84px; }
  .yo-brand { font: 600 15px/1.2 var(--f-mono); letter-spacing: .34em; text-align: center; margin-right: -.34em; }
  .yo-sub { text-align: center; letter-spacing: .14em; font-size: 10px; margin-top: 2px; }
  .yo-rule { border: 0; border-top: 1px dashed rgba(28,26,23,.55); margin: 11px 0; }
  .yo-dbl { border: 0; border-top: 3px double rgba(28,26,23,.7); margin: 12px 0; }
  .yo-h {
    display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; font: 600 10.5px/1.2 var(--f-mono); letter-spacing: .16em; text-transform: uppercase;
  }
  .yo-h::before, .yo-h::after { content: ""; flex: 1; border-top: 1px dashed rgba(28,26,23,.5); }
  .yo-h span { padding: 1px 5px; background: var(--ink); color: var(--paper); letter-spacing: .06em; }
  .yo-r { display: flex; align-items: baseline; }
  .yo-r > span { white-space: nowrap; }
  .yo-r > i { flex: 1; min-width: 6px; margin: 0 5px; border-bottom: 1px dotted rgba(28,26,23,.4); transform: translateY(-3px); }
  .yo-r > b { font-weight: 600; white-space: nowrap; }
  .yo-n { color: var(--ink-2); font-size: 9.8px; line-height: 1.45; margin: 0 0 6px; text-wrap: pretty; }
  .yo-p { font-size: 10.4px; line-height: 1.55; margin: 6px 0; text-wrap: pretty; }
  .yo-big {
    display: block; text-align: center; font: 600 23px/1 var(--f-mono); letter-spacing: -.01em; margin: 8px 0 7px;
    transform: scaleY(1.32); transform-origin: 50% 50%;
  }
  .yo-big small { font-size: 12px; font-weight: 500; letter-spacing: .04em; }
  .yo-ch {
    display: inline-block; margin-left: 5px; padding: 0 3px; border: 1px solid rgba(28,26,23,.75); border-radius: 2px;
    font: 600 8.5px/1.35 var(--f-mono); color: var(--ink); text-decoration: none; letter-spacing: .04em; vertical-align: 1px; transform: translateY(-1px);
  }
  .yo-ch:hover, .yo-ch:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
  .yo-cust { position: relative; display: grid; gap: 6px; padding: 2px 0; }
  .yo-cust label { display: flex; align-items: baseline; gap: 8px; }
  .yo-cust label > span:first-child { width: 42px; flex: none; letter-spacing: .1em; }
  .yo-in {
    font: 600 11.5px/1.2 var(--f-mono); color: var(--ink); background: rgba(28,26,23,.04); border: 0; border-bottom: 1px solid var(--ink);
    padding: 3px 4px; border-radius: 2px 2px 0 0; color-scheme: light; min-width: 0;
  }
  .yo-in:focus { outline: none; background: rgba(28,26,23,.09); }
  .yo-in[type="number"] { width: 56px; }
  .yo-in[type="time"] { width: 78px; }
  .yo-stamp {
    position: absolute; right: 0; top: 30px; transform: rotate(-9deg); pointer-events: none;
    border: 2px solid var(--stamp); color: var(--stamp); border-radius: 4px; padding: 4px 7px 3px; text-align: center;
    font: 700 11px/1.1 var(--f-mono); letter-spacing: .16em; opacity: .85; mix-blend-mode: multiply; transition: opacity .5s, transform .5s;
  }
  .yo-stamp small { display: block; font-size: 7.5px; letter-spacing: .12em; font-weight: 600; margin-top: 2px; }
  .yo-stamp.off { opacity: 0; transform: rotate(-9deg) scale(1.3); }
  .yo-tbl { width: 100%; border-collapse: collapse; font-size: 10px; margin: 4px 0 6px; }
  .yo-tbl th { font-weight: 600; text-align: right; padding: 0 0 3px; border-bottom: 1px solid rgba(28,26,23,.6); letter-spacing: .06em; font-size: 8.8px; }
  .yo-tbl th:first-child, .yo-tbl td:first-child { text-align: left; }
  .yo-tbl td { text-align: right; padding: 1px 0; white-space: nowrap; }
  .yo-tbl td.src { text-align: left; padding-left: 8px; }
  .yo-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink); margin-right: 2px; vertical-align: 0; }
  .yo-dot.f { background: var(--ink); }
  .yo-dot.h { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
  .yo-stars { width: 100%; border-collapse: collapse; font-size: 10px; margin: 6px 0; }
  .yo-stars td { padding: 1px 0; white-space: nowrap; }
  .yo-stars td:nth-child(3), .yo-stars td:nth-child(4) { text-align: right; }
  .yo-stars tr.no { color: var(--ink-3); }
  .yo-stars tr.nx td { font-weight: 600; }
  .yo-cv { display: block; width: 100%; margin: 8px 0; }
  .yo-fig { display: flex; gap: 12px; align-items: center; margin: 6px 0 4px; }
  .yo-fig canvas { image-rendering: pixelated; width: 50px; height: 110px; flex: none; }
  .yo-close { margin-top: 12px; font-size: 11px; line-height: 1.62; text-align: center; text-wrap: pretty; }
  .yo-close em { font-style: normal; font-weight: 600; }
  .yo-links { display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px; }
  .yo-links a {
    font: 600 10px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); text-decoration: none;
    border: 1px solid var(--ink); padding: 7px 10px; border-radius: 2px;
  }
  .yo-links a:hover, .yo-links a:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
  .yo-play {
    all: unset; cursor: pointer; font: 600 10px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--paper);
    background: var(--ink); padding: 8px 12px 7px; border-radius: 2px;
  }
  .yo-play::before { content: ""; display: inline-block; width: 0; height: 0; border-left: 6px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; margin-right: 7px; vertical-align: 0; }
  .yo-play:hover, .yo-play:focus-visible { background: #3a352d; outline: none; }
  .yo-barcode { display: block; margin: 12px auto 2px; width: 220px; height: 70px; image-rendering: pixelated; }
  .yo-tearline { text-align: center; color: var(--ink-3); letter-spacing: .3em; font-size: 9px; margin-top: 16px; }
  .yo-paper a.yo-inl { color: inherit; }
  .yo-paper [data-hs], .yo-paper [data-hc] { cursor: pointer; border-radius: 2px; transition: background .2s; }
  .yo-paper .hl { background: rgba(28,26,23,.085); box-shadow: 0 0 0 3px rgba(28,26,23,.085); }

  /* printer mouth */
  .yo-slot {
    position: relative; flex: none; height: 26px; pointer-events: auto; border-radius: 8px 8px 10px 10px;
    background: linear-gradient(#1b1f2d, #0a0c14 60%, #07080e); border: 1px solid var(--line-strong);
    box-shadow: 0 -10px 22px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
    display: flex; align-items: flex-end; justify-content: space-between; padding: 0 12px 4px;
    font: 600 8.5px/1 var(--f-mono); letter-spacing: .2em; color: var(--faint); text-transform: uppercase;
  }
  .yo-slot::before {
    content: ""; position: absolute; left: 8px; right: 8px; top: 5px; height: 3px; border-radius: 2px; background: #000;
    box-shadow: inset 0 1px 2px rgba(0,0,0,1), 0 1px 0 rgba(255,255,255,.07);
  }
  .yo-led { width: 5px; height: 5px; border-radius: 50%; background: var(--era); box-shadow: 0 0 8px var(--era); opacity: .35; transition: opacity .2s; }
  .yo-rc.printing .yo-led { animation: yo-blink .18s steps(2) infinite; opacity: 1; }
  @keyframes yo-blink { 50% { opacity: .25; } }
  .yo-slot button {
    all: unset; cursor: pointer; font: inherit; letter-spacing: inherit; color: var(--dust); padding: 2px 0;
  }
  .yo-slot button:hover, .yo-slot button:focus-visible { color: var(--era); }

  /* deck: birth + legend */
  .yo-date-row { display: grid; grid-template-columns: 1fr 88px; gap: 6px; }
  .cz-input.yo-date { color-scheme: dark; padding: 7px 8px; }
  .yo-ex { display: inline-block; font: 600 9px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--era-ink); background: var(--era); padding: 3px 5px 2px; border-radius: 3px; margin-left: 6px; vertical-align: 1px; }
  .yo-ex.off { display: none; }
  .yo-leg { display: grid; gap: 1px; }
  .yo-lh, .yo-lr { display: grid; grid-template-columns: 12px minmax(0, 1fr) 56px 58px 26px; align-items: center; gap: 0 4px; }
  .yo-lh { font: 600 9px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding: 0 6px 4px; }
  .yo-lh span { text-align: right; }
  .yo-lr {
    padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 12.3px; color: #d6d0c2; transition: background .2s, color .2s;
    border: 1px solid transparent; user-select: none; -webkit-user-select: none;
  }
  .yo-lr:hover, .yo-lr.on { background: rgba(255,255,255,.05); color: var(--star); }
  .yo-lr.on { border-color: var(--line-strong); }
  .yo-lr .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .yo-lr .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .yo-lr .v { font: 500 10.5px/1 var(--f-mono); text-align: right; color: var(--star); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .yo-lr .v.m { color: var(--dust); }
  .yo-lr a { font: 600 9.5px/1 var(--f-mono); color: var(--faint); text-decoration: none; text-align: right; padding: 3px 0; }
  .yo-lr a:hover { color: var(--era); }
  .yo-lcap { min-height: 64px; font-size: 12px; line-height: 1.5; color: var(--dust); padding: 2px 2px 0; }
  .yo-lcap b { color: var(--star); font-weight: 600; }
  .yo-lcap a { color: var(--era); text-decoration: none; white-space: nowrap; }
  .yo-lcap a:hover { text-decoration: underline; }

  /* science tab tables */
  .yo-stw { overflow-x: auto; margin: .5em 0 1em; }
  .yo-stw .yo-st { margin: 0; }
  .yo-st { width: 100%; border-collapse: collapse; font: 400 11px/1.4 var(--f-mono); margin: .5em 0 1em; font-variant-numeric: tabular-nums; }
  .yo-st th { font-weight: 600; color: var(--faint); text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--line-strong); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; }
  .yo-st td { text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); color: #d8d2c4; white-space: nowrap; }
  .yo-st th:first-child, .yo-st td:first-child { text-align: left; }
  .yo-st td.l { text-align: left; white-space: normal; font-size: 10px; color: var(--dust); min-width: 96px; }
  .yo-st td:first-child { white-space: normal; }

  /* copy fallback */
  .yo-copy { position: fixed; inset: 0; z-index: 46; display: grid; place-items: center; background: rgba(5,6,12,.7); padding: 20px; }
  .yo-copy .cz-panel { width: min(460px, 100%); padding: 16px; display: grid; gap: 10px; }
  .yo-copy textarea { width: 100%; height: 50vh; resize: none; background: var(--paper); color: var(--ink); border: 0; border-radius: 6px; padding: 12px; font: 400 11px/1.45 var(--f-mono); }

  /* the paper tab that stands in for the receipt on phones */
  .yo-tab {
    position: fixed; z-index: 23; right: calc(var(--gutter) + 2px); top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 6px);
    width: 134px; padding: 9px 8px 13px; border: 0; cursor: pointer; text-align: center; color: var(--ink);
    background: linear-gradient(180deg, #f1eadb, var(--paper-2)); font: 600 9px/1.35 var(--f-mono); letter-spacing: .14em;
    box-shadow: 0 14px 30px rgba(0,0,0,.5); transform: rotate(2.5deg); transform-origin: 50% 0; transition: opacity .5s var(--ease), transform .5s var(--ease);
    -webkit-mask: linear-gradient(#000, #000) 0 0 / 100% calc(100% - 6px) no-repeat, conic-gradient(from 135deg at 50% 0, #000 90deg, #0000 0) 0 100% / 10px 6px repeat-x;
            mask: linear-gradient(#000, #000) 0 0 / 100% calc(100% - 6px) no-repeat, conic-gradient(from 135deg at 50% 0, #000 90deg, #0000 0) 0 100% / 10px 6px repeat-x;
  }
  .yo-tab b { display: block; font: 600 13px/1.1 var(--f-mono); letter-spacing: -.01em; margin: 5px 0 4px; transform: scaleY(1.3); white-space: nowrap; }
  .yo-tab small { display: block; color: var(--ink-2); letter-spacing: .1em; font-weight: 500; font-size: 8.5px; }
  .yo-tab.off { opacity: 0; transform: rotate(2.5deg) translateY(-12px); pointer-events: none; }
  @media (min-width: 761px) { .yo-tab { display: none; } }

const pctS = (x) => { const p = x * 100; if (p >= 10) return p.toFixed(1) + '%'; if (p >= 1) return p.toFixed(2) + '%'; if (p >= 0.01) return p.toFixed(2) + '%'; return FMT.sci(p, 2) + '%'; };
const pctC = (x) => { const p = x * 100; if (p >= 0.01) return pctS(x); const e = Math.floor(Math.log10(p)); return Math.round(p / Math.pow(10, e)) + '×10' + FMT.sup(e) + '%'; };
const srcCodes = (f) => Object.keys(f).sort((a, b) => f[b] - f[a]).map((k) => k.toUpperCase() + '\u00a0' + Math.round(f[k] * 100)).join(' · ');
const srcShares = (f) => Object.keys(f).sort((a, b) => f[b] - f[a]).map((k) => Math.round(f[k] * 100) + '% ' + SOURCES[SI[k]].name.toLowerCase()).join(', ');

const NOTES = `
<p>This figure is you, drawn with ${SMALL ? '60,000' : '120,000'} points of light. Each point stands for an equal share of your mass, and its colour says where that matter was made. Coral points were forged in massive stars that exploded before the Sun existed. Amber ones came from dying stars like the Sun. Blue ones are hydrogen, made in the first twenty minutes of the universe.</p>
<p>Switch to counting atoms instead of grams and the figure turns blue. Hydrogen is light, so it is under a tenth of your weight, yet it is six in every ten of your atoms. By mass you are mostly supernova. By count you are mostly Big Bang.</p>
<p>The figure breathes at your breathing rate, and each heartbeat sends a pulse out from the chest at the speed of a real arterial pressure wave. Points drift off and new ones arrive, because you swap atoms with the world every second through water, food and air. Here that exchange runs about half a million times faster than life.</p>
<p>The light that left Earth on your first day is still travelling. <strong>Follow my light</strong> shows how far it has got, among the real neighbouring stars, and which ones it has already reached.</p>
<p>The receipt is yours. Give it your birth date and it itemises you: heartbeats, the kilometres you have ridden through space, the stars that made your atoms, and how far the light from your first day has travelled. Nothing you type leaves this page.</p>
<h4>Try this</h4>
<ul>
<li>Hover the sources in the controls to light up only the atoms that one kind of star made. Try <strong>Neutron stars</strong> (merging neutron stars) and look at the neck.</li>
<li>Switch <strong>Colour</strong> to <strong>Element</strong> and hover <strong>Calcium</strong>. Your skeleton appears.</li>
<li>Press <strong>Return my atoms to the stars</strong> (<kbd>O</kbd>) and watch every point fly home.</li>
<li>Press <strong>Follow my light</strong> (<kbd>L</kbd>). You shrink into the Sun, and the light of the day you were born sweeps out across the real stars around us.</li>
<li>Scroll the receipt to the end. It finishes where the journey began.</li>
</ul>`;

function scienceHTML() {
  const C = COMP70;
  const majRows = C.rows.filter((r) => !r.trace).map((r) =>
    `<tr><td>${r.s} · ${r.n}</td><td>${r.pct}%</td><td>${r.kg >= 1 ? r.kg.toFixed(2) + ' kg' : Math.round(r.kg * 1000) + ' g'}</td><td>${pctS(r.atoms / C.atoms)}</td><td class="l">${srcCodes(r.f)}</td></tr>`).join('');
  const trRows = ['Fe', 'F', 'Zn', 'Si', 'Rb', 'Sr', 'Br', 'Cu', 'B', 'I', 'Au'].map((s) => { const r = C.by(s); const g = r.kg * 1000;
    return `<tr><td>${r.s} · ${r.n}</td><td>${FMT.sci(r.kg / 70 * 100, 2)}%</td><td>${g >= 1 ? g.toFixed(1) + ' g' : g >= 0.01 ? Math.round(g * 1000) + ' mg' : (g * 1000).toFixed(1) + ' mg'}</td><td>${pctS(r.atoms / C.atoms)}</td><td class="l">${srcCodes(r.f)}</td></tr>`; }).join('');
  const srcRows = SOURCES.map((s, i) => `<tr><td>${s.name}</td><td>${pctS(C.srcKg[i] / C.kgTot)}</td><td>${pctS(C.srcAtoms[i] / C.atoms)}</td></tr>`).join('');
  return `
<h4>What each point is</h4>
<p>The figure is a procedural body: about ninety capsules and ellipsoids blended with a smooth minimum into one signed distance field, in a standing contrapposto pose with the head tipped up. Points are sampled uniformly on the skin (about 55%) and through the volume (45%). A separate skeleton, a thyroid gland and the heart position are built from the same joints.</p>
<p>Each point first gets an element, drawn from your composition by mass (or, with <strong>By atoms</strong>, by number of atoms), then a birthplace, drawn from that element's origin shares. Calcium and phosphorus points sit in the skeleton, iodine in the thyroid; everything else is spread through soft tissue. With N points and body mass M, one point is M/N of you: 0.58 g for 70 kg and 120,000 points, or 5.4 × 10²² atoms.</p>
<h4>Composition by mass and by number</h4>
<p>The textbook table gives the major elements by mass. Traces come from Emsley's inventory of a 70 kg body and scale with your mass. The number of atoms of each element is</p>
<span class="eq">N<sub>i</sub> = m<sub>i</sub> N<sub>A</sub> / A<sub>i</sub>, &nbsp; N<sub>A</sub> = 6.022 × 10²³ mol⁻¹</span>
<p>For 70 kg this gives ${FMT.sci(C.atoms, 3)} atoms, of which ${pctS(C.by('H').atoms / C.atoms)} are hydrogen. The rounded table sums to 99.9%, so the majors are rescaled until they and the 12 g of traces add up to exactly your mass. Textbook tables list potassium as 0.4%, but whole-body counting of potassium-40 points to nearer 0.2% (about 140 g).</p>
<div class="yo-stw"><table class="yo-st"><tr><th>Element</th><th>Mass</th><th>70 kg</th><th>Atoms</th><th>Made in, %</th></tr>${majRows}${trRows}</table></div>
<p style="font:400 11px/1.5 var(--f-mono);color:var(--faint)">BB Big Bang · LM dying low-mass stars · MS exploding massive stars · WD exploding white dwarfs · NS merging neutron stars · CR cosmic-ray fission. Shares after Johnson (2019), rounded.</p>
<h4>Where the elements were made</h4>
<p>The origin shares follow Jennifer Johnson's 2019 periodic table of nucleosynthesis, the same one chapter 6 uses. They are coarse and rounded, and some are debated. The largest open question is the r-process: Johnson credits merging neutron stars, but rare kinds of exploding massive star (collapsars, magnetorotational supernovae) may make part of it. Deuterium is only destroyed in stars, so every deuteron in you (about 150 per million hydrogen atoms; ocean water has 156) dates from the first twenty minutes.</p>
<div class="yo-stw"><table class="yo-st"><tr><th>Source</th><th>By mass</th><th>By atoms</th></tr>${srcRows}</table></div>
<h4>Time and the body</h4>
<p>Age is the time since your birth date (noon local time if you give no time). Beats, breaths and blinks integrate age-dependent resting rates, which are piecewise linear so the integral is exact:</p>
<span class="eq">N<sub>beats</sub> = ∫<sub>0</sub><sup>A</sup> f<sub>HR</sub>(a) da</span>
<p>Heart rate falls from about 130 bpm at birth to 80 in late childhood and 70 in adults; breathing from 44 to 15 a minute (Fleming et al. 2011). Blinks use about 15 a minute while awake for adults (newborns blink only a few times a minute) and the fraction of each day spent awake. Exercise raises these rates and sleep lowers them, so treat them as ±15% estimates. The figure breathes and beats at your current rates.</p>
<p>Cell counts are for the 70 kg reference adult of Sender, Fuchs and Milo (2016), scaled by your mass: 3.0 × 10¹³ human cells, 84% of them red blood cells, and 3.8 × 10¹³ bacteria, mostly in the colon. Red cells are made at count ÷ lifespan = 2.5 × 10¹³ ÷ 120 days ≈ 2.4 million a second, scaled for children by the median body mass at each age. The body replaces about 3.3 × 10¹¹ cells a day, the great majority of them blood cells (Sender and Milo 2021). Most neurons in your neocortex are as old as you are (Bhardwaj et al. 2006).</p>
<h4>Motion</h4>
<span class="eq">d = v t</span>
<p>Earth's mean orbital speed is 29.78 km/s. The Sun circles the Galaxy at about 230 km/s (estimates run 220–240). Relative to the cosmic microwave background, the Sun moves at 369.82 ± 0.11 km/s, measured from the dipole in the Planck maps. These three are measured against different things and point in different directions, so they are not added. The Moon is 384,400 km away on average; a light-year is 9.4607 × 10¹² km. A galactic year is 225–250 million years; this page uses 230. The Sun is about 26,700 light-years (8.18 kpc) from the galactic centre (GRAVITY Collaboration 2019).</p>
<h4>Light echo</h4>
<span class="eq">r = c t, &nbsp; N(r) ≈ n · (4/3)π r³</span>
<p>Within 13 light-years the page counts real systems from the RECONS list (brown dwarfs included). Beyond that it uses the mean local density from the Gaia 10-parsec census: 540 stars and brown dwarfs in 339 systems within 32.6 light-years (Reylé et al. 2021), or n ≈ 0.0037 objects and 0.0023 systems per cubic light-year, so a 30 ly sphere holds about 430 stars and brown dwarfs. The often-quoted round figure of 0.004 per cubic light-year gives 450.</p>
<p><strong>Follow my light</strong> draws the same numbers in three dimensions. Every system within 13 light-years is a real one, placed at its catalogued right ascension, declination and distance, and so are the named bright stars beyond. Everything else is a statistical fill at the Gaia density with a realistic mix of red, orange, yellow-white, white and brown dwarfs (thinned above ${SMALL ? '7,000' : '16,000'} points). The sphere is centred on the Sun; the Earth is only 8 light-minutes off-centre. The wavefront crosses your lifetime in 11 seconds, so it plays about ${FMT.sci(36.5 * JYEAR / 11, 1)} times faster than light for a 36-year-old.</p>
<h4>Cosmic calendar and radioactivity</h4>
<p>Carl Sagan's calendar maps 13.8 billion years onto one year, so one calendar second is about 437 years. Your body holds about 4,400 Bq of potassium-40, forged in supernovae before the Sun, and about 0.23 Bq of carbon-14 per gram of carbon, made by cosmic rays in the upper atmosphere. Together that is roughly 7,400 decays a second in a 70 kg adult, and the receipt scales it with your mass and carbon.</p>
<h4>Atomic turnover</h4>
<p>The old claim that 98% of your atoms are replaced every year comes from Paul Aebersold's 1953 radioisotope tracer work and is approximate. Body water turns over with a half-life of 7 to 10 days, and about 2.5 litres a day moves through you, roughly 3 × 10²¹ atoms a second. Some atoms stay for life, such as those in tooth enamel, the eye lens and the DNA of neurons.</p>
<h4>Simplified for the screen</h4>
<p>The body is a smooth idealisation, not an anatomical scan. Tissue placement is simplified. Neutron-star and cosmic-ray atoms are drawn several hundred (neutron stars) to a few thousand (cosmic rays) times more common than they are, because at true scale they would be less than one point. Turnover runs about 500,000 times faster than real life. The pulse wave crosses the body at 6 m/s (real arteries: 5–10 m/s). The galaxy behind you is a callback, not a view: nobody has seen the Milky Way from outside. The figure is lit from the galaxy's side and brightened at its silhouette, which is a rendering choice to show its shape.</p>
<span class="cite">Johnson, J. A. (2019). Populating the periodic table: Nucleosynthesis of the elements. Science 363, 474–478.</span>
<span class="cite">Sender, R., Fuchs, S. &amp; Milo, R. (2016). Revised estimates for the number of human and bacteria cells in the body. PLoS Biol 14, e1002533.</span>
<span class="cite">Sender, R. &amp; Milo, R. (2021). The distribution of cellular turnover in the human body. Nat. Med. 27, 45–48.</span>
<span class="cite">Planck Collaboration (2020). Planck 2018 results. I. Overview. A&amp;A 641, A1 (CMB dipole 369.82 ± 0.11 km/s).</span>
<span class="cite">Reylé, C. et al. (2021). The 10 parsec sample in the Gaia era. A&amp;A 650, A201; RECONS, recons.org.</span>
<span class="cite">GRAVITY Collaboration (2019). A geometric distance measurement to the Galactic Center black hole with 0.3% uncertainty. A&amp;A 625, L10.</span>
<span class="cite">Fleming, S. et al. (2011). Normal ranges of heart rate and respiratory rate in children. Lancet 377, 1011–1018.</span>
<span class="cite">Emsley, J. (1998). The Elements, 3rd ed. Oxford University Press.</span>
<span class="cite">Sagan, C. (1977). The Dragons of Eden. Random House.</span>
<span class="cite">Bhardwaj, R. D. et al. (2006). Neocortical neurogenesis in humans is restricted to development. PNAS 103, 12564.</span>`;
}

      hudPts.set(sm ? `1 pt = ${S.weigh ? sci(COMP.atoms / NMAIN, 2) + ' at.' : (S.mass / NMAIN * 1000).toFixed(2) + ' g'}` : `${grp(NMAIN)} points · 1 = ${S.weigh ? sci(COMP.atoms / NMAIN, 2) + ' atoms' : (S.mass / NMAIN * 1000).toFixed(2) + ' g'}`);
      ro.hr.set(Math.round(st.hr) + ' bpm'); ro.beats.set(sci(st.beats, 4)); ro.br.set(`${Math.round(st.rr)}/min · ${breath > 0.02 && (st.breaths % 1) < 0.4 ? 'in' : 'out'}`);
      ro.per.set(S.weigh ? sci(COMP.atoms / NMAIN, 2) + ' at.' : (S.mass / NMAIN * 1000).toFixed(2) + ' g');
    }
  }
  if (now - lastSlow > (slow && slow.st.A < 0.01 ? 2000 : 60000)) { lastSlow = now; receiptSlow(); }
  cpuMs = cpuMs * 0.95 + (performance.now() - tf0) * 0.05;
  fpsAcc += dt; fpsN++; if (fpsAcc > 1) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
}

/* ---------- boot ---------- */
assignParticles();
drawLogo();
receiptSlow();
lastSlow = Date.now();
ch.loop((dt, t) => { S.t = t; drawFrame(dt, t); }, { always: true });
geometryAsync({ seed: 20260929, nSurf: Math.round(NMAIN * 0.62), nVol: Math.round(NMAIN * 0.5), nBone: SMALL ? 5000 : 9000, nThy: 400 }).then((geo) => {
  GEO = geo;
  placeParticles(geo);
  drawFigureStamp();
  console.info(`[ch22] body: ${geo.ns} skin + ${geo.nv} volume + ${geo.nb} bone points from ${geo.prims} primitives, ${geo.workers} workers, ${geo.wall} ms`);
});
ch.onSound((on) => { if (on) ch.sound.ensure(); });

Cosmos.debug.state = () => ({
  ready: figReady, body: bodyReady, points: NMAIN, magnified: NMAG, asm: +S.asm.toFixed(3), colMode: S.colMode, weigh: S.weigh, hi: S.hi, hiSticky: S.hiSticky,
  receipt: S.receipt, printed: S.printed, example: S.example, mass: S.mass,
  age: slow ? +slow.st.A.toFixed(4) : null, beats: slow ? Math.floor(lifeStats(slow.b, slow.M, Date.now(), COMP).beats) : null,
  atoms: +COMP.atoms.toPrecision(4), hFracAtoms: +(COMP.by('H').atoms / COMP.atoms).toFixed(4),
  srcMass: Array.from(COMP.srcKg).map((v) => +(v / COMP.kgTot).toFixed(5)), srcAtoms: Array.from(COMP.srcAtoms).map((v) => +(v / COMP.atoms).toPrecision(3)),
  echo: +S.echo.toFixed(3), echoR: +S.echoR.toFixed(3), echoStars: ECHO_FILL0 + echoFillN,
  fps: +fps.toFixed(1), cpuMs: +cpuMs.toFixed(2), hdr: !!HDR, geoMs: GEO ? GEO.wall : null,
});
Cosmos.debug.receiptText = receiptText;
Cosmos.debug.lay = () => ({ LAY, CAM: { cx: CAM.cx, cy: CAM.cy, px: CAM.px }, fig: figureRect() });
Cosmos.debug.tune = (o) => { Object.assign(TUNE, o); GALM = galMatrix(); return TUNE; };
Cosmos.debug.setBirth = (v) => setBirth(v, 'debug');
})();
