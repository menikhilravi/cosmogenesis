  .im-out td:first-child { text-align: left; padding-left: 0; color: var(--dust); font-family: var(--f-ui); font-size: 12px; white-space: normal; }
  .im-out td.g { color: var(--faint); }
  .im-out p { margin: 10px 0 0; color: var(--dust); font-size: 12.5px; line-height: 1.5; }
  .im-out .cz-btns { margin-top: 12px; }
  .im-out .x { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--dust); cursor: pointer; font: 15px/1 var(--f-ui); }

</style>

<body>
<script src="cosmos.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   THE WAR WITHIN
   An agent-based model of a viral infection in a patch of airway
   epithelium: ~5,000 cells on a jittered hexagonal Voronoi sheet, fields
   of virions, interferon, chemokine and antibody on a grid, and individual
   macrophages, neutrophils, NK cells, dendritic cells and CD8⁺ T cells.
   A lymph-node model (clonal selection, programmed T-cell expansion,
   germinal-centre affinity maturation) feeds T cells and antibody back in.
   Rendered in WebGL2 as a confocal fluorescence image with bloom.
   ===================================================================== */

const NOTES = `
<p>You are looking down a confocal microscope at the lining of an airway, a few thousand cells seen from above. Blue ovals are nuclei and the faint teal lines are the seals between neighbouring cells. A few virus particles have just landed.</p>
<p>A virus slips into a cell and turns it into a factory. The cell blushes <strong style="color:var(--np)">pink</strong> as viral protein builds up, then sheds new virions, the bright points drifting out to infect its neighbours. Infected cells also raise the alarm. They release <strong style="color:var(--isg)">interferon</strong>, and the cells around them switch on hundreds of antiviral genes and resist infection. <strong style="color:var(--amber)">Macrophages</strong> swallow virus and debris, <strong style="color:var(--neu)">neutrophils</strong> swarm to the damage, and <strong style="color:var(--nk)">NK cells</strong> kill infected cells on sight.</p>
<p>Spidery <strong style="color:var(--dc)">dendritic cells</strong> grab viral protein and crawl into a lymphatic vessel. In the lymph node (in the controls) they show it to hundreds of T and B cell clones, each with a different receptor. Only a clone that fits is selected, and it doubles every 7 hours. Around day six, <strong style="color:var(--gfp)">killer T cells</strong> pour into the tissue and every kill flashes. Then <strong style="color:var(--igg)">antibodies</strong>, the tiny yellow Ys, coat virions so they can no longer infect.</p>
<p>The curves above the timeline draw the textbook picture as it happens: the virus peaks first, killer T cells a few days later, antibody last. When the adaptive response is decided in the lymph node, a cutaway of the node slides in. The tissue heals and a few memory cells stay behind. That memory is what a vaccine gives you in advance. Press <strong>Vaccinated</strong> and the same virus barely gets started.</p>
<h4>Try this</h4>
<ul>
<li>Turn on <strong>Split view</strong>: two copies of the same tissue meet the same virus, and one of them is vaccinated. Drag the divider.</li>
<li>Click any cell to inspect it. Pick a green T cell and press <strong>Follow</strong> to ride along as it hunts.</li>
<li>Try the <strong>Interferon-blocking virus</strong> and watch the cyan shield fail, or <strong>Escape variant</strong> and watch a coral strain take over.</li>
<li>Start the <strong>Antiviral drug</strong> on day 1, then on day 5. Timing is everything.</li>
</ul>`;

/* The Baccam et al. (2006) target-cell-limited model with an eclipse phase, integrated with the published
   parameters, drawn as an inline figure for the science tab. */
const BACCAM_SVG = (function () {
  const b = 3.2e-5, p = 4.6e-2, c = 5.2, d = 5.2, k = 4.0, dt = 2e-4;
  let T = 4e8, I1 = 0, I2 = 0, V = 7.5e-2, next = 0;
  const pts = [];
  for (let s = 0; s <= 40000; s++) {
    const t = s * dt;
    if (t >= next) { pts.push([t, Math.log10(Math.max(V, 1e-3)), T / 4e8, (I1 + I2) / 4e8]); next += 0.05; }
    const inf = b * T * V; T -= inf * dt; I1 += (inf - k * I1) * dt; I2 += (k * I1 - d * I2) * dt; V += (p * I2 - c * V) * dt;
  }
  const W = 360, H = 170, L = 34, R = 34, Tp = 12, B = 26;
  const X = (t) => L + t / 8 * (W - L - R), Yv = (v) => H - B - (v + 2) / 9 * (H - Tp - B), Yf = (f) => H - B - f * (H - Tp - B);
  const path = (fn, yi) => pts.map((q, i) => (i ? 'L' : 'M') + X(q[0]).toFixed(1) + ' ' + fn(q[yi]).toFixed(1)).join('');
  let g = '';
  for (let t = 0; t <= 8; t += 2) g += `<line x1="${X(t)}" y1="${Tp}" x2="${X(t)}" y2="${H - B}" stroke="rgba(236,230,214,.08)"/><text x="${X(t)}" y="${H - B + 13}" fill="#5e6479" font-size="9" text-anchor="middle">${t === 0 ? 'day 0' : t}</text>`;
  for (let v = -2; v <= 7; v += 3) g += `<text x="${L - 5}" y="${Yv(v) + 3}" fill="#ff7eb6" font-size="9" text-anchor="end">10${Cosmos.fmt.sup(v)}</text>`;
  for (const f of [0, 0.5, 1]) g += `<text x="${W - R + 5}" y="${Yf(f) + 3}" fill="#5ee0d2" font-size="9">${Math.round(f * 100)}%</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Baccam model: viral titre peaks at day 2.3 while target cells fall to zero" style="width:100%;height:auto;display:block;margin:.4em 0 .2em;font-family:var(--f-mono)">
  <rect x="${L}" y="${Tp}" width="${W - L - R}" height="${H - Tp - B}" fill="rgba(255,255,255,.025)"/>${g}
  <path d="${path(Yf, 2)}" fill="none" stroke="#5ee0d2" stroke-width="1.6"/>
  <path d="${path(Yf, 3)}" fill="none" stroke="#ffb04a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="${path(Yv, 1)}" fill="none" stroke="#ff7eb6" stroke-width="1.8"/>
  <text x="${X(5.2)}" y="${Tp + 14}" fill="#ff7eb6" font-size="9">V · TCID₅₀/ml</text><text x="${X(5.2)}" y="${Tp + 26}" fill="#5ee0d2" font-size="9">target cells T/T₀</text><text x="${X(5.2)}" y="${Tp + 38}" fill="#ffb04a" font-size="9">infected I/T₀</text>
</svg>`;
})();

const SCIENCE = `
<p><strong>An educational model, not medical advice.</strong> The virus is a generic respiratory virus with kinetics between influenza and SARS-CoV-2.</p>
<h4>The target-cell-limited model</h4>
<p>Within-host viral dynamics are classically written for uninfected target cells T, infected cells I and free virus V (Perelson 2002):</p>
<span class="eq">dT/dt = −β T V</span><span class="eq">dI/dt = β T V − δ I</span><span class="eq">dV/dt = p I − c V</span>
<p>β is the infection rate, δ the death rate of infected cells, p the virion production rate and c the clearance of free virus. Early on T ≈ T<sub>0</sub>, so the infection grows if each infected cell causes more than one new infection:</p>
<span class="eq">R<sub>0</sub> = β p T<sub>0</sub> / (c δ)</span>
<p>Baccam et al. (2006) fitted this model, with an added eclipse phase, to nasal washes from volunteers infected with influenza A: β = 3.2 × 10<sup>−5</sup> (TCID<sub>50</sub>/ml)<sup>−1</sup> d<sup>−1</sup>, p = 4.6 × 10<sup>−2</sup> TCID<sub>50</sub>/ml d<sup>−1</sup>, c = δ = 5.2 d<sup>−1</sup>, T<sub>0</sub> = 4 × 10<sup>8</sup> cells and an eclipse rate of 4 d<sup>−1</sup>. That gives R<sub>0</sub> ≈ 22, a free-virus half-life of about 3 h, and infected cells that wait about 6 h, then shed virus for about 5 h. Integrated here with those numbers, the model peaks at about 10<sup>5.9</sup> TCID<sub>50</sub>/ml on day 2.3 and falls on its own because target cells run out:</p>
${BACCAM_SVG}
<p>That is the model's famous weakness: every target cell is infected by day 2.5, while real airways lose only a fraction of their lining. Real infections also meet interferon and adaptive immunity, which is what this chapter adds.</p>
<h4>This simulation</h4>
<p>Each epithelial cell is an agent: healthy, eclipse (infected, not yet shedding), productive, dead, cleared, regenerating, or interferon-protected. Virions, interferon, chemokine and a neutrophil swarm signal live on an 8 µm grid:</p>
<span class="eq">∂V/∂t = D<sub>V</sub>∇²V + Σ p<sub>i</sub> − (c + k<sub>n</sub>A + k<sub>φ</sub>) V</span>
<p>with an effective (mucus-hindered) D<sub>V</sub> = 2,600 µm² d<sup>−1</sup>, c = 5.2 d<sup>−1</sup>, antibody neutralisation k<sub>n</sub>A and uptake by phagocytes k<sub>φ</sub>. A healthy cell is infected at rate βV(1 − 0.94 P), where P is its interferon-induced antiviral state (induced at 4 d<sup>−1</sup>, fading at 0.45 d<sup>−1</sup>). The eclipse lasts about 7 h and a productive cell sheds about 50 infectious units per day for a mean of 18 h, less if interferon reaches it. About 5 % of the virus escapes into the airway lumen and lands elsewhere, seeding new foci.</p>
<p>The readout R<sub>e</sub> counts new infections per infected cell that ended (died or was killed) over the last simulated day. It starts well above 1, falls below 1 once interferon, target depletion and killing take hold, and the infection then shrinks.</p>
<h4>Innate immunity</h4>
<p>Infected cells secrete type I and III interferon, which diffuses about 40 µm and makes neighbours refractory within hours. Chemokines from infected and dying cells, activated macrophages and interferon-stimulated epithelium recruit leukocytes from the venules at rates set by the local chemokine level. Neutrophils (fast, short-lived) release a leukotriene swarm signal, which makes them converge on damage; in intense swarms they also injure healthy bystander cells. NK cells kill infected cells without prior sensitisation. Macrophages and neutrophils engulf virions and debris, and pyrogenic cytokines (IL-1, IL-6, TNF) set the fever.</p>
<h4>Clonal selection</h4>
<p>Burnet's clonal selection theory (1957): each lymphocyte carries one randomly generated receptor, and antigen selects the few that fit, which then proliferate. A given viral epitope is recognised by roughly one naive CD8⁺ T cell in 10<sup>5</sup> to 10<sup>6</sup>. Dendritic cells carry antigen to the lymph node. After priming and a lag of about a day, the selected clone divides every 6 to 8 hours (7 h here) for about 3.4 days on a programmed schedule, a roughly 3,000-fold expansion, then keeps dividing only while antigen persists. The inset assumes about 150 naive precursors of the dominant clone in the draining node. Effector T cells reach the tissue from about day 6, crawl up CXCL9/10 gradients and kill on contact after a 40 min synapse. Two-photon imaging shows that one killer T cell kills about 2 to 16 infected cells a day and that kills are faster when several T cells cooperate (Halle et al. 2016), so a second hit here raises the kill probability from 0.55 to 0.95. When antigen is gone 90 to 95 % of effectors die, and the rest become memory.</p>
<h4>Antibodies and affinity maturation</h4>
<p>Activated B cells first make low-affinity <strong>IgM</strong> outside the follicles. With T-cell help they form a germinal centre, where they mutate their antibody genes at about 10<sup>−3</sup> per base pair per division and compete for antigen, so binding improves over weeks (Victora &amp; Nussenzweig 2012). The germinal centre here is a real population of 72 B cells: every 12 h each mutates (mostly harmful changes, σ = 0.18 log units) and the better binders survive and divide, raising the mean affinity from K<sub>D</sub> ≈ 1 µM to a few nM in about two weeks. Class-switched <strong>IgG</strong> follows from about day 10 and outlasts IgM (half-lives about 5 days for IgM and 3 weeks for IgG). Titres are shown as the last positive two-fold dilution, as a lab would report them.</p>
<h4>Memory and vaccines</h4>
<p>A vaccine leaves memory: 10 to 100 times more antigen-specific T cells, tissue-resident memory T cells already in the airway, memory B cells that switch straight to IgG, and some antibody already present. The same virus then meets a secondary response: faster, 10 to 100 times stronger, cleared in a few days with little damage.</p>
<h4>Sound</h4>
<p>With sound on, each kill by a T cell rings a high note and each NK kill a lower one, a soft drone brightens with the viral load, and a heartbeat quickens with the fever, by about 9 beats per minute per °C (Liebermeister's rule gives roughly 8 to 10).</p>
<h4>What is simplified</h4>
<ul>
<li>At the default speed time runs about 24,000 times faster than life, while cells crawl 50 to 200 times slower than they would at that pace, so you can follow them. Their search efficiency is tuned to compensate.</li>
<li>Virions and antibodies are drawn as diffraction-limited points and 2 µm Ys. Real virions are about 0.1 µm and antibodies about 10 nm.</li>
<li>The patch stands in for the whole airway when it drives the lymph node, CD4⁺ T-cell help is folded into the timing, and mucosal IgA is not modelled separately.</li>
<li>Units are arbitrary where marked a.u.; charts show the qualitative kinetics, not a fit to a patient.</li>
</ul>

    Kifn: 0.015,          // IFN level for half-maximal ISG induction
    protOn: 4.0, protOff: 0.45, protEff: 0.94, protProd: 0.5,
    ckE: 0.25, ckI: 1.0, ckD: 0.8, ckMac: 0.5, ckIfn: 2.0, kCK: 1.4,

try { sim = createImmuneSim({ cols: COLS, rows: ROWS, seed: 7, mobile: SMALL }); }
catch (e) { ch.fatal('The tissue model could not be built.', e); return; }

/* =====================================================================
   WebGL2 renderer: confocal fluorescence look
   ===================================================================== */
const canvas = ch.canvas('im-gl');
const gl = Cosmos.gl.context(canvas, { alpha: false, antialias: false });
if (!gl) { ch.fatal('This chapter needs WebGL2, which this browser or device does not provide.'); return; }
const over = document.createElement('canvas'); over.id = 'im-over'; ch.stage.append(over);
const octx = over.getContext('2d');
const HDR = gl.ext.floatRT || gl.ext.halfFloatRT;
const RT_INTERNAL = HDR ? gl.RGBA16F : gl.RGBA8;

const GLSL_COMMON = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), u.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 17.1; a *= .5; } return s; }
`;

/* ---- tissue: Voronoi epithelium + fields ---- */
const FS_TISSUE = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
out vec4 o;
uniform sampler2D uSites, uDyn, uDyn2, uFA, uFB;
uniform vec2 uRes; uniform vec3 uCam; uniform float uPx; uniform ivec2 uGrid; uniform vec2 uWorld; uniform vec2 uFSize; uniform float uDX;
uniform float uT; uniform vec4 uCh; uniform vec4 uLay; uniform vec4 uSc; uniform float uHiDef;
${GLSL_COMMON}
const float S = 10.0, RH = 8.660254;
const vec3 JUNC = vec3(0.09, 0.50, 0.50);
const vec3 DAPI = vec3(0.13, 0.26, 1.00);
const vec3 NP   = vec3(1.00, 0.24, 0.58);
const vec3 NPH  = vec3(1.00, 0.52, 0.76);
const vec3 NP2  = vec3(1.00, 0.34, 0.16);
const vec3 ISG  = vec3(0.16, 0.86, 0.78);
const vec3 CKC  = vec3(0.42, 0.20, 0.85);
const vec3 VESS = vec3(0.55, 0.06, 0.10);
const vec3 LYMC = vec3(0.45, 0.45, 0.62);
const vec3 IGG  = vec3(1.00, 0.84, 0.25);
vec4 field(sampler2D t, vec2 p){ return texture(t, (p / uDX + 0.5) / uFSize); }
void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 p = uCam.xy + vec2(fc.x - uRes.x * 0.5, uRes.y * 0.5 - fc.y) * uPx;
  float px = uPx;
  vec3 col = vec3(0.0);
  float inside = min(min(p.x, uWorld.x - p.x), min(p.y, uWorld.y - p.y));
  float edge = smoothstep(-2.0, 14.0, inside);
  if (inside < -30.0) { o = vec4(col, 1.0); return; }
  // ---- nearest site (hex lattice guided search) ----
  int cols = uGrid.x, rows = uGrid.y;
  int j0 = int(floor(p.y / RH));
  float d1 = 1e9; ivec2 nb = ivec2(-1); vec4 s1 = vec4(0);
  for (int dj = -1; dj <= 1; dj++) {
    int j = j0 + dj; if (j < 0 || j >= rows) continue;
    float off = float(j & 1) * 0.5;
    int i0 = int(floor(p.x / S - off));
    for (int di = -1; di <= 1; di++) {
      int i = i0 + di; if (i < 0 || i >= cols) continue;
      vec4 s = texelFetch(uSites, ivec2(i, j), 0);
      vec2 d = p - s.xy; float dd = dot(d, d);
      if (dd < d1) { d1 = dd; nb = ivec2(i, j); s1 = s; }
    }
  }
  if (nb.x < 0) { o = vec4(col, 1.0); return; }
  // ---- distance to the cell border (exact bisector distance) ----
  float de = 1e9, de2 = 1e9;
  for (int dj = -1; dj <= 1; dj++) {
    int j = nb.y + dj; if (j < 0 || j >= rows) continue;
    for (int di = -1; di <= 1; di++) {
      int i = nb.x + di; if (i < 0 || i >= cols || (di == 0 && dj == 0)) continue;
      vec2 c2 = texelFetch(uSites, ivec2(i, j), 0).xy;
      vec2 n = c2 - s1.xy; float ln = length(n);
      if (ln > 22.0) continue;
      float e = dot(s1.xy + n * 0.5 - p, n / ln);
      if (e < de) { de2 = de; de = e; } else if (e < de2) de2 = e;
    }
  }
  vec4 dy = texelFetch(uDyn, nb, 0);
  vec4 dz = texelFetch(uDyn2, nb, 0);
  float vp = dy.r, st = floor(dy.g * 255.0 / 40.0 + 0.5), prot = dy.b, anim = dy.a;
  float strain = dz.r, flash = dz.g, sel = dz.b, how = floor(dz.a * 255.0 / 40.0 + 0.5);
  vec2 q = p - s1.xy;
  float ca = cos(s1.z), sa = sin(s1.z);
  vec2 qn = vec2(ca * q.x + sa * q.y, -sa * q.x + ca * q.y);
  float sd = s1.w;
  vec3 npc = mix(NP, NP2, strain);
  vec3 nph = mix(NPH, vec3(1.0, 0.72, 0.45), strain);
  // pixel-aware line widths
  float w = max(0.42, 0.85 * px);
  // uneven illumination and slight defocus across the field, and cell-to-cell expression differences
  float illum = 0.62 + 0.62 * (0.62 * vnoise(p * 0.0045 + vec2(3.1, 7.7)) + 0.38 * vnoise(p * 0.011 + vec2(9.2, 1.3)));
  float cellB = 0.62 + 0.62 * fract(sd * 17.31);
  w *= 1.0 + 0.6 * smoothstep(0.75, 0.35, illum);
  float mem = exp(-de * de / (w * w));
  float memSoft = exp(-de / 1.6) * 0.3;
  float vert = exp(-(de * de + de2 * de2) / (w * w * 3.0));
  float jn = (0.55 + 0.7 * vnoise(p * 1.3 + sd * 40.0)) * illum * (0.85 + 0.3 * cellB) + vert * 1.1;
  // nucleus
  float na = 2.55 + 0.55 * sd, nbr = 1.85 + 0.35 * fract(sd * 7.31);
  float wob = (vnoise(qn * 0.9 + sd * 91.0) - 0.5) * 0.18;
  float dn = length(qn / vec2(na, nbr)) - 1.0 + wob;
  float aa = max(0.08, 1.2 * px / nbr);
  float nuc = smoothstep(aa, -aa, dn);
  float fine = smoothstep(0.35, 0.12, px);
  float chrom = nuc > 0.001 || st > 2.5 ? 0.55 + 0.75 * fbm(p * 1.35 + sd * 13.0) + fine * 0.35 * (vnoise(p * 5.0 + sd * 31.0) - 0.5) : 0.9;
  chrom *= 1.0 - 0.55 * exp(-dot(qn - vec2(0.8 * (sd - 0.5) * na, 0.3), qn - vec2(0.8 * (sd - 0.5) * na, 0.3)) / 0.35); // nucleolus
  float rim = smoothstep(-0.35, 0.0, dn) * nuc;
  float cyto = smoothstep(0.0, 0.6, de) ;
  float r2 = dot(q, q);
  float perinuc = exp(-max(dn, 0.0) * 1.6);

  float jGain = uCh.x, vGain = uCh.y, iGain = uCh.z;
  if (st < 0.5) {
    // healthy (possibly interferon-protected)
    col += JUNC * (mem * 0.46 * jn + memSoft * 0.12 * illum) * jGain;
    col += JUNC * 0.01 * cyto * jGain;
    col += DAPI * nuc * (0.36 * chrom + 0.2 * rim) * cellB * illum * jGain;
    col += ISG * prot * (0.10 * cyto * (0.6 + 0.4 * vnoise(p * 0.7)) + 0.16 * mem) * iGain;
    // ciliated cells: a faint brush of cilia, resolved only when zoomed in
    if (fine > 0.0 && sd < 0.62) {
      float cil = smoothstep(0.6, 0.95, vnoise(p * 3.4 + sd * 50.0)) * (0.5 + 0.5 * vnoise(p * 0.9 + sd * 7.0 + uT * 0.05));
      col += vec3(0.62, 0.64, 0.72) * cil * cyto * (1.0 - 0.7 * nuc) * 0.10 * fine * jGain;
    }
  } else if (st < 1.5) {
    // eclipse: viral nucleoprotein first accumulates in the nucleus, then speckles the cytoplasm
    col += JUNC * (mem * 0.5 * jn + memSoft * 0.18) * jGain;
    float nucNP = smoothstep(0.05, 0.5, vp);
    col += DAPI * nuc * (0.42 * chrom + 0.25 * rim) * (1.0 - 0.45 * nucNP) * jGain;
    col += npc * nuc * nucNP * (0.35 + 0.3 * chrom) * vGain;
    float speck = smoothstep(0.62, 0.9, vnoise(p * 2.4 + uT * 0.2 + sd * 7.0));
    col += npc * cyto * (1.0 - nuc) * vp * vp * (0.12 + 0.9 * speck) * perinuc * vGain;
    col += ISG * prot * 0.08 * cyto * iGain;
  } else if (st < 2.5) {
    // productive: cytoplasm full of viral protein, membrane studded with budding virions
    float age = anim;
    col += JUNC * mem * 0.18 * jGain;
    col += DAPI * nuc * (0.22 * chrom + 0.12 * rim) * jGain;
    float fill = (0.32 + 0.5 * vp) * (0.5 + 0.5 * perinuc) * (0.45 + 1.0 * fbm(p * 1.7 + sd * 5.0));
    col += npc * cyto * fill * (1.0 - 0.5 * nuc) * vGain;
    col += nph * nuc * 0.28 * vGain;
    col += nph * mem * (0.9 + 0.5 * sin(uT * 3.0 + sd * 30.0)) * vGain;
    // budding sites along the membrane
    float bang = atan(q.y, q.x);
    float bud = smoothstep(0.82, 0.98, vnoise(vec2(bang * 4.0 + sd * 20.0, uT * 0.8 + sd * 9.0)));
    col += vec3(1.0, 0.8, 0.92) * exp(-de * de / 0.45) * bud * 1.8 * vGain;
    col *= 1.0 - 0.25 * smoothstep(0.75, 1.0, age);
  } else if (st < 3.5) {
    // dying: apoptosis (killed) or lysis (viral cytopathic effect); debris lingers until engulfed
    float k = anim; // 0 → 1 over the first ~7 h after death
    float rr = length(q), ang = atan(q.y, q.x);
    float bleb = smoothstep(0.5, 0.9, vnoise(vec2(ang * 2.2 + sd * 11.0, k * 2.0 + sd)));
    float Rc = (4.4 - 2.0 * k) * (1.0 + 0.12 * bleb);
    float dd = rr - Rc;
    float body = smoothstep(0.5, -0.5, dd);
    float rim = exp(-dd * dd / 0.35) * (0.35 + 0.9 * bleb);
    // apoptotic blebs pinching off
    float bl = 0.0;
    for (int b = 0; b < 3; b++) { float ba = 6.2831 * fract(sd * 5.1 + float(b) * 0.37); vec2 bc2 = vec2(cos(ba), sin(ba)) * (Rc + 0.6 + 1.2 * k); bl += exp(-dot(q - bc2, q - bc2) / (0.35 + 0.3 * k)); }
    vec3 residue = mix(JUNC * 0.35, npc * 0.55, step(0.02, vp) * (1.0 - 0.6 * k));
    if (how > 0.5 && how < 1.5) {
      // lysis: the membrane tears open and viral protein leaks out
      float torn = step(0.5, vnoise(vec2(ang * 4.0 + sd * 3.0, sd * 9.0)));
      col += npc * (mem * torn * 0.55 * (1.0 - 0.7 * k) + body * 0.14 * (1.0 - k)) * vGain;
      col += npc * 0.06 * exp(-rr * rr / 30.0) * (1.0 - k) * vGain;
    } else {
      col += residue * (rim * 0.45 + body * 0.07 + bl * 0.25) * (1.0 - 0.45 * k);
    }
    // condensed, then fragmented nucleus (karyorrhexis)
    float frag = 0.0;
    for (int f = 0; f < 4; f++) {
      float fa = 6.2831 * (sd * 3.7 + float(f) * 0.27), fr = 1.6 * k * (0.5 + 0.5 * fract(sd * 13.0 + float(f) * 0.31));
      vec2 fcn = vec2(cos(fa), sin(fa)) * fr;
      frag += exp(-dot(q - fcn, q - fcn) / (0.35 + 0.8 * (1.0 - k)));
    }
    col += DAPI * (0.9 * frag * (1.0 - 0.3 * k) + nuc * 0.15 * (1.0 - k)) * jGain;
    col += vec3(0.6, 0.8, 1.0) * frag * 0.25 * (1.0 - k) * jGain;
  } else if (st < 4.5) {
    // cleared: a gap to the basement membrane
    float fib = fbm(vec2(p.x * 0.35 + p.y * 0.12, p.y * 0.9) + 3.0);
    col += vec3(0.07, 0.06, 0.11) * smoothstep(0.45, 0.8, fib) * 0.5;
  } else {
    // regenerating: a new cell spreads from the basal layer
    float g = anim;
    float rr = length(q);
    float R = 1.5 + 4.0 * g;
    float disc = smoothstep(R + 0.6, R - 0.4, rr);
    col += JUNC * (exp(-pow(rr - R, 2.0) / (w * w)) * 0.5 * (1.0 - g) + mem * 0.5 * jn * g) * jGain;
    float ns = 0.45 + 0.55 * g;
    float dn2 = length(qn / (vec2(na, nbr) * ns)) - 1.0;
    col += DAPI * smoothstep(0.1, -0.1, dn2) * (0.5 * chrom) * disc * jGain;
    col += ISG * prot * 0.08 * disc * iGain;
    col += vec3(0.07, 0.06, 0.11) * (1.0 - disc) * 0.3;
  }
  // kill flash (T cell: green-white, NK: orchid, lysis: pink)
  if (flash > 0.01) {
    vec3 fcol = how > 2.5 ? vec3(0.8, 0.5, 1.0) : how > 1.5 ? vec3(0.55, 1.0, 0.55) : npc;
    float f2 = flash * flash;
    col += fcol * f2 * (0.1 * cyto + 0.7 * mem);
  }
  // selection
  if (sel > 0.5) col += vec3(1.0, 0.5, 0.72) * (exp(-de * de / (w * w * 3.0)) * 1.6 + 0.05);

  // ---- fields ----
  vec4 fa = field(uFA, p), fb = field(uFB, p);
  float v1 = fa.r * fa.r * uSc.x, v2 = fa.g * fa.g * uSc.x, ifn = fa.b * fa.b * uSc.y, ck = fa.a * fa.a * uSc.z;
  float abl = fb.r * fb.r * uSc.w, dB = fb.g * 80.0, dL = fb.b * 80.0;
  // vessels in a deeper, out-of-focus plane
  float cover = st > 3.5 && st < 4.5 ? 0.55 : 0.16;
  float vess = exp(-dB * dB / 30.0) * 0.5 + exp(-pow(dB - 4.5, 2.0) / 3.0) * 0.35;
  col += VESS * vess * cover * uLay.w * (0.7 + 0.3 * vnoise(p * 0.2 + uT * 0.05));
  col += LYMC * (exp(-dL * dL / 50.0) * 0.12 + exp(-pow(dL - 5.5, 2.0) / 3.0) * 0.12) * cover * uLay.w;
  // chemokine gradient: faint violet haze
  col += CKC * smoothstep(0.0, 1.0, ck) * 0.075 * uLay.x;
  // interferon haze (optional)
  col += ISG * smoothstep(0.0, 1.0, ifn) * 0.12 * uLay.y;
  // free virions too many to draw individually: diffraction-limited speckle ∝ local density
  float vt = v1 + v2;
  if (vt > 0.004 && uLay.z > 0.0) {
    float cell = 1.7;
    vec2 gp = p / cell; vec2 gi = floor(gp);
    float tq = floor(uT * 5.0 + hash12(gi) * 7.0);
    float hsh = hash12(gi + tq * 0.137);
    float prob = 1.0 - exp(-vt * 0.035 * cell * cell);
    if (hsh < prob) {
      vec2 sp = (gi + 0.25 + 0.5 * vec2(hash12(gi + 3.1 + tq), hash12(gi + 7.7 + tq))) * cell;
      float r = length(p - sp);
      float ps = max(0.32, 0.9 * px);
      float blink = 0.6 + 0.4 * sin(uT * 7.0 + hsh * 40.0);
      vec3 vc = mix(vec3(1.0, 0.55, 0.82), vec3(1.0, 0.68, 0.45), v2 / (vt + 1e-5));
      col += vc * exp(-r * r / (ps * ps)) * 1.3 * blink * uLay.z * uHiDef;
    }
    col += mix(NP, NP2, v2 / (vt + 1e-5)) * (1.0 - exp(-vt * 0.25)) * 0.05 * uLay.z;
  }
  // antibodies too small to draw one by one: a faint golden dust in proportion to titre
  if (abl > 0.01) {
    float cell = 2.3;
    vec2 gi = floor(p / cell);
    float tq = floor(uT * 3.0 + hash12(gi + 5.0) * 5.0);
    if (hash12(gi + tq * 0.31 + 9.0) < min(0.5, abl * 0.18)) {
      vec2 sp = (gi + 0.2 + 0.6 * vec2(hash12(gi + tq + 1.3), hash12(gi + tq + 2.9))) * cell;
      float r = length(p - sp);
      float ps = max(0.25, 0.75 * px);
      col += IGG * exp(-r * r / (ps * ps)) * 0.55 * uHiDef;
    }
  }
  col *= edge;
  // sensor noise floor
  col += vec3(0.004, 0.005, 0.009) * hash12(fc + fract(uT * 13.1) * 91.0);
  o = vec4(col, 1.0);
}`;

/* ---- immune cells: instanced procedural sprites ---- */
const VS_AGENT = `#version 300 es
precision highp float;
layout(location=0) in vec4 iA; // x, y, r, type
layout(location=1) in vec4 iB; // heading, seed, act, cargo
layout(location=2) in vec4 iC; // flash, sel, state, speed
uniform vec2 uRes; uniform vec3 uCam; uniform float uPx;
out vec2 vL; flat out vec4 vA; flat out vec4 vB; flat out vec4 vC;
const vec2 Q[6] = vec2[6](vec2(-1,-1), vec2(1,-1), vec2(1,1), vec2(-1,-1), vec2(1,1), vec2(-1,1));
void main(){
  float ty = iA.w, r = iA.z;
  float ext = ty < 0.5 ? 2.0 : ty < 1.5 ? 2.2 : ty < 2.5 ? 2.2 : ty < 3.5 ? 3.6 : ty < 4.5 ? 2.9 : 1.6;
  ext += 1.4 * iC.y + 1.6 * iC.x;
  vec2 q = Q[gl_VertexID] * r * ext;
  float h = iB.x; mat2 R = mat2(cos(h), sin(h), -sin(h), cos(h));
  vec2 w = iA.xy + R * q;
  vec2 s = (w - uCam.xy) / uPx;
  gl_Position = vec4(s.x / (uRes.x * 0.5), -s.y / (uRes.y * 0.5), 0.0, 1.0);
  vL = q; vA = iA; vB = iB; vC = iC;
}`;
const FS_AGENT = `#version 300 es
precision highp float;
in vec2 vL; flat in vec4 vA; flat in vec4 vB; flat in vec4 vC;
uniform float uT; uniform float uPx; uniform float uImm;
out vec4 o;
${GLSL_COMMON}
const vec3 GFP = vec3(0.30, 1.00, 0.36);
const vec3 AMB = vec3(1.00, 0.52, 0.12);
const vec3 NEU = vec3(0.70, 0.80, 1.00);
const vec3 NKC = vec3(0.70, 0.40, 1.00);
const vec3 DCC = vec3(1.00, 0.86, 0.62);
const vec3 NPC = vec3(1.00, 0.26, 0.60);
const vec3 DAPI_I = vec3(0.16, 0.28, 1.00);
float smin(float a, float b, float k){ float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float sdCapsule(vec2 p, vec2 a, vec2 b, float r){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
float fill(float d, float aa){ return smoothstep(aa, -aa, d); }
void main(){
  vec2 l = vL; float r = vA.z, ty = vA.w, seed = vB.y, act = vB.z, cargo = vB.w;
  float flash = vC.x, sel = vC.y, state = vC.z, mv = vC.w;
  float aa = max(0.25, 1.1 * uPx);
  float th = atan(l.y, l.x), rl = length(l);
  float t = uT + seed * 50.0;
  vec3 col = vec3(0.0); float a = 0.0;
  if (ty < 0.5) {
    // macrophage: large amoeboid cell, pseudopods as smoothly merged lobes; engulfed virions glow pink in phagosomes
    float d = length(l * vec2(1.0, 1.08)) - r * 0.74 * (1.0 + 0.05 * sin(4.0 * th + t * 0.7 + seed * 9.0));
    for (int i = 0; i < 4; i++) {
      float fi = float(i);
      float an = (i == 0 ? 0.0 : seed * 6.28 + fi * 1.9) + 0.45 * sin(t * 0.23 + fi * 2.1);
      float ext = (i == 0 ? 0.62 : 0.42) + 0.22 * sin(t * (0.31 + 0.07 * fi) + fi * 1.7 + seed * 4.0);
      vec2 dir = vec2(cos(an), sin(an));
      vec2 pc = dir * r * ext;
      vec2 lp = l - pc; vec2 lr = vec2(dot(lp, dir), dot(lp, vec2(-dir.y, dir.x)));
      float dp = length(lr / vec2(r * (i == 0 ? 0.62 : 0.5), r * (i == 0 ? 0.42 : 0.3))) - 1.0;
      dp *= r * 0.36;
      d = smin(d, dp, r * 0.32);
    }
    d += (vnoise(l * 0.9 + t * 0.25 + seed * 3.0) - 0.5) * 0.9;
    float body = fill(d, aa);
    float rimL = exp(-d * d / 0.28) * (0.7 + 0.3 * vnoise(l * 1.4 + t * 0.4));
    float tex = 0.6 + 0.6 * fbm(l * 0.7 + seed * 30.0 + t * 0.03);
    float vac = smoothstep(0.58, 0.74, vnoise(l * 0.55 + seed * 9.0 + t * 0.02));
    float gr = smoothstep(0.78, 0.92, vnoise(l * 1.9 + seed * 5.0));
    vec2 nc = l + vec2(r * 0.22, -r * 0.08);
    float kid = length(nc * vec2(1.0, 1.45)) - r * 0.36 + 0.3 * r * exp(-dot(nc - vec2(r * 0.3, 0.0), nc - vec2(r * 0.3, 0.0)) / (r * r * 0.05));
    float nk = fill(kid, aa);
    col = AMB * (body * (0.17 * tex * (1.0 - 0.6 * vac) * (1.0 - 0.5 * nk) + 0.3 * gr) + rimL * 0.55) * (0.85 + 0.6 * act);
    col += DAPI_I * nk * body * (0.3 + 0.2 * fbm(l * 1.2 + seed));
    float n = min(cargo, 12.0);
    for (int i = 0; i < 12; i++) {
      if (float(i) >= n) break;
      float fi = float(i);
      vec2 cp = vec2(cos(fi * 2.399 + seed * 6.0), sin(fi * 2.399 + seed * 6.0)) * r * (0.2 + 0.45 * fract(fi * 0.618 + seed));
      cp += vec2(sin(t * 0.3 + fi), cos(t * 0.25 + fi)) * 0.6;

/* =====================================================================

function sparkDraw() {
  const cv = sparkCv;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
  if (!W || !H) return;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = W / dpr, h = H / dpr;
  c.clearRect(0, 0, w, h);
  const S = sim.stats, n = S.t.length;
  if (n < 2) return;
  const X = (d) => d / 21 * w;
  const top = 4, bot = h - 1.5;
  const Y = (f) => bot - U.clamp(f, 0, 1) * (bot - top);
  const G = ghost && ghost.t && ghost.t.length > 1 ? ghost : null;
  let cmax = 60;
  for (let i = 0; i < n; i++) if (S.cd8[i] > cmax) cmax = S.cd8[i];
  if (G) for (let i = 0; i < G.cd8.length; i++) if (G.cd8[i] > cmax) cmax = G.cd8[i];

    }

    path(G.t, G.cd8, fT); c.strokeStyle = 'rgba(125,255,138,0.38)'; c.stroke();
    path(G.t, G.igg, fG); c.strokeStyle = 'rgba(255,216,74,0.38)'; c.stroke();

  if (!isFinite(sim.tot.Vt)) { ch.toast('The model went unstable and was restarted.'); startScenario(scenKey); }
  handleEvents();
  updateCaption(now);
  // camera
  if (frame % 20 === 0) { measureFree(); layoutOverlays(); }
  if (follow >= 0) { const a = selSim.selA; if (a >= 0 && a < selSim.A.n && selSim.A.id[a] === follow) aimAt(selSim.A.x[a], selSim.A.y[a], cam.tz); else follow = -1; }
  director(now);
  const k = 1 - Math.exp(-rdt * (follow >= 0 ? 5 : 1.1));
  const kz = 1 - Math.exp(-rdt * 0.9);
  if (tour || follow >= 0) {
    cam.z += (cam.tz - cam.z) * kz;
    cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k;
    clampCam(cam);
  }
  {
    uploadState(sim, gpuA);
    if (compare && simB) uploadState(simB, gpuB);
    const t0 = performance.now();
    render(rt);
    // adaptive resolution: keep frame time in budget
    if (!ch.paused && dt > 0) { perfAcc += dt * 1000; perfN++; }
    if (perfN >= 90) { const ms = perfAcc / perfN; if (ms > 20 && simScale > 0.55) simScale = Math.max(0.55, simScale - 0.1); else if (ms < 17.5 && simScale < 1) simScale = Math.min(1, simScale + 0.05); perfAcc = 0; perfN = 0; }
  }
  if (tracksT.value && !ch.paused && (++trkFrame % 3 === 0)) updateTracks();
  if (!tracksT.value && tracks.size) tracks.clear();
  drawOverlay(now);
  placeCard();
  // UI at ~6 Hz
  if (now - slowUi > 160) {
    slowUi = now;
    const d = sim.t, tot = sim.tot;
    const dd = Math.floor(d), hh = Math.floor((d - dd) * 24), mm = Math.floor(((d - dd) * 24 - hh) * 60);
    dayEm.textContent = 'Day ' + dd; dayHm.textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    fillEl.style.width = Math.min(100, d / 21 * 100) + '%';
    const inf = (tot.E + tot.I) / sim.N;
    const phase = d < 0.6 ? 'Exposure' : sim.cleared >= 0 ? 'Resolution · memory' : sim.counts[sim.T_CD8] > 20 || (sim.ln.B[0].IgG + sim.ln.B[0].IgM) > 0.4 ? 'Adaptive response' : 'Innate response';
    phaseEl.textContent = ffOn ? 'Memory forms  ▸▸' : phase; phaseEl.title = ffOn ? 'Virus cleared: time runs twice as fast to day 21' : '';
    const vl = tot.Vt * 100;
    hudDay.set(d.toFixed(2)); hudVL.set(vl < 1 ? 'undetectable' : Cosmos.fmt.sci(vl, 2) + ' a.u.'); hudInf.set((inf * 100).toFixed(1) + '%'); hudT.set(sim.temp.toFixed(1) + ' °C' + (sim.temp >= 38 ? ' · fever' : '')); { const k = U.clamp((sim.temp - 37.3) / 2.2, 0, 1); hudT.el.lastChild.style.color = k > 0 ? `rgb(${Math.round(236 + 19 * k)},${Math.round(230 - 130 * k)},${Math.round(214 - 150 * k)})` : ''; }
    ro.day.set(d.toFixed(1)); ro.vl.set(vl < 1 ? '—' : Cosmos.fmt.sci(vl, 2)); ro.inf.set((inf * 100).toFixed(1) + '%'); ro.dmg.set(((tot.D + tot.X + tot.G) / sim.N * 100).toFixed(1) + '%');
    // effective reproduction number: new infections per infected cell that ended, over the last simulated day
    rtHist.push([sim.t, sim.tot.infections, sim.tot.infEnds]);
    while (rtHist.length > 2 && sim.t - rtHist[1][0] > 1) rtHist.shift();
    const h0 = rtHist[0], dI = sim.tot.infections - h0[1], dE = sim.tot.infEnds - h0[2];
    ro.rt.set(dE >= 8 ? (dI / dE).toFixed(2) : dI > 0 ? 'rising' : '—');
    ro.aff.set(sim.ln.B[0].gc || sim.ln.B[0].mem ? fmtKd(Math.pow(10, -sim.ln.B[0].aff)) : '—');
    ro.cd8.set(String(sim.counts[sim.T_CD8])); ro.kills.set(String(tot.kills[2]));
    const igg = sim.ln.B[0].IgG + sim.ln.B[1].IgG; ro.igg.set(fmtTitre(igg)); ro.temp.set(sim.temp.toFixed(1) + ' °C');
    chartDraw(chartCv);
    sparkDraw();
    const ln = sim.ln;
    const cap = ln.Tc[0].tAct < 0 ? (ln.ag[0] > 0.02 ? 'Antigen is arriving. Clones are being tested for a fit.' : 'Resting: 144 T-cell and 84 B-cell clones, each with its own receptor.')
      : 'CD8 clone ×' + Cosmos.fmt.num(Math.max(1, Math.round(ln.Tc[0].T))) + (ln.B[0].gc ? ' · germinal centre K_D ' + fmtKd(Math.pow(10, -ln.B[0].aff)) : '');
    lnCap.textContent = cap;
    if (lnBigOn) { document.getElementById('im-lnb-cap').textContent = cap; document.getElementById('im-lnb-sub').textContent = 'day ' + d.toFixed(1); }
    updateCard(false);
    // sound
    if (ch.sound.enabled) { ensureAudio(); if (audio) { const lv = Math.log10(1 + vl) / 6.5; audio.f.frequency.setTargetAtTime(140 + 900 * lv, audio.ctx.currentTime, 0.4); } }
  }
  if (!ch.paused && sim.tot.kills[2] > lastKills) { chime(0); lastKills = sim.tot.kills[2]; }
  if (sim.tot.kills[3] > lastNk) { chime(1); lastNk = sim.tot.kills[3]; }
  heartbeat();
  if (frame % 2 === 0) lnDraw(lnCv, false, !lnBigOn && !lnPipUntil);
  if (lnPipUntil) {
    if (lnPip.matches(':hover')) lnPipUntil = Math.max(lnPipUntil, now + 1500);
    if (now > lnPipUntil || lnBigOn || deckCovers()) hideLnPip();
    else { if (frame % 2 === 1) lnDraw(lnPipCv, true, true); lnPipBar.style.transform = 'scaleX(' + U.clamp((lnPipUntil - now) / lnPipDur, 0, 1).toFixed(3) + ')'; if (!lnPipRect) lnPipRect = lnPip.getBoundingClientRect(); }
  }
  if (lnBigOn) lnDraw(lnBigCv, true, frame % 2 === 0);
}, { always: true });
layoutOverlays();
Cosmos.debug.initMs = Math.round(performance.now() - T_START);
Cosmos.debug.w2s = w2s; Cosmos.debug.gpu = () => gpuA;
Cosmos.debug.perf = () => ({ simScale, perfAcc, perfN, canvas: [canvas.width, canvas.height] });

Cosmos.debug.sim = sim;
Cosmos.debug.state = () => ({
  day: +sim.t.toFixed(2), scenario: scenKey, cells: sim.N, grid: [COLS, ROWS],
  infectedPct: +((sim.tot.E + sim.tot.I) / sim.N * 100).toFixed(2), damagePct: +((sim.tot.D + sim.tot.X + sim.tot.G) / sim.N * 100).toFixed(2), protectedPct: +(sim.tot.R / sim.N * 100).toFixed(1),
  log10V: +Math.log10(1 + sim.tot.Vt * 100).toFixed(2), peakDay: +sim.peakDay.toFixed(2), cleared: +sim.cleared.toFixed(2),
  agents: { mac: sim.counts[0], neu: sim.counts[1], nk: sim.counts[2], dc: sim.counts[3], cd8: sim.counts[4] }, virions: sim.vis.n, antibodies: sim.ab.n,
  ln: { T: +sim.ln.T.toFixed(0), IgM: +(sim.ln.B[0].IgM + sim.ln.B[1].IgM).toFixed(2), IgG: +(sim.ln.B[0].IgG + sim.ln.B[1].IgG).toFixed(2), aff: +sim.ln.B[0].aff.toFixed(2) },
  temp: +sim.temp.toFixed(2), kills: Array.from(sim.tot.kills), cam: { x: +cam.x.toFixed(1), y: +cam.y.toFixed(1), z: +cam.z.toFixed(2), cover: +coverZ.toFixed(2) }, simScale, hdr: !!HDR,
});
Cosmos.debug.start = startScenario;
Cosmos.debug.jump = (day) => { while (sim.t < day) { sim.step(0.02, 0.016); if (compare && simB) simB.step(0.02, 0.016); handleEvents(); } return sim.t; };
Cosmos.debug.cam = (x, y, z) => { tour = false; tourBtn.set(false); cam.x = cam.tx = x; cam.y = cam.ty = y; cam.z = cam.tz = z; clampCam(cam); return [cam.x, cam.y, cam.z]; };
Cosmos.debug.lnBig = setLnBig;
Cosmos.debug.select = (type) => { let best = -1, bd = Infinity; for (let a = 0; a < sim.A.n; a++) { if (sim.A.type[a] !== type) continue; const [sx, sy] = w2s(sim.A.x[a], sim.A.y[a]); const d = Math.hypot(sx - free.cx, sy - free.cy); if (d < bd) { bd = d; best = a; } } if (best < 0) return null; const [sx, sy] = w2s(sim.A.x[best], sim.A.y[best]); pick(sx, sy); return [Math.round(sx), Math.round(sy)]; };
Cosmos.debug.selectCell = (state) => { for (let k = 0; k < sim.N; k++) if (sim.st[k] === state) { const [sx, sy] = w2s(sim.cx[k], sim.cy[k]); if (sx > free.l && sx < free.r && sy > free.t && sy < free.b) { pick(sx, sy); return [Math.round(sx), Math.round(sy)]; } } return null; };
})();
</script>
