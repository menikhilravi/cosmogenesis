<script>
(function () {
'use strict';

/* =====================================================================================
   Shared cosmology (flat ΛCDM). Stringified into the worker as well, so it must be
   self-contained: growth factor, growth rate, leapfrog drift/kick integrals, cosmic age,
   Eisenstein & Hu (1998) no-wiggle transfer function, σ8 normalisation, σ(M).
   Units: lengths in Mpc/h, time in 1/H0, masses in M☉/h.
   ===================================================================================== */
function cosmoLib() {
  'use strict';
  function simpson(f, a, b, n) { const hh = (b - a) / n; let s = f(a) + f(b); for (let i = 1; i < n; i++) s += f(a + i * hh) * (i & 1 ? 4 : 2); return s * hh / 3; }
  function make(o) {
    const Om = o.Om, OL = 1 - Om, h = o.h, ns = o.ns, Ob = o.Ob, s8 = o.s8;
    const E = (a) => Math.sqrt(Om / (a * a * a) + OL);
    const gI = (u) => { if (u <= 0) return 0; const a = u * u; return 2 * u * Math.pow(Om / a + OL * a * a, -1.5); };
    const I = (a) => simpson(gI, 0, Math.sqrt(a), 256);
    const Dun = (a) => 2.5 * Om * E(a) * I(a);
    const D1 = Dun(1);
    const D = (a) => Dun(a) / D1;
    const f = (a) => { const e = E(a); return -1.5 * Om / (a * a * a * e * e) + 1 / (a * a * e * e * e * I(a)); };
    const drift = (a0, a1) => simpson((a) => 1 / (a * a * a * E(a)), a0, a1, 32);
    const kick = (a0, a1) => simpson((a) => 1 / (a * a * E(a)), a0, a1, 32);
    const hubbleTimeGyr = 9.7779 / h;
    const age = (a) => hubbleTimeGyr * 2 / (3 * Math.sqrt(OL)) * Math.asinh(Math.sqrt(OL / Om) * Math.pow(a, 1.5));
    const om = Om * h * h, ob = Ob * h * h, fb = Ob / Om, th2 = Math.pow(2.7255 / 2.7, 2);
    const sEH = 44.5 * Math.log(9.83 / om) / Math.sqrt(1 + 10 * Math.pow(ob, 0.75));
    const aG = 1 - 0.328 * Math.log(431 * om) * fb + 0.38 * Math.log(22.3 * om) * fb * fb;
    const T = (k) => {
      if (k <= 0) return 1;
      const ks = 0.43 * k * h * sEH, Geff = Om * h * (aG + (1 - aG) / (1 + ks * ks * ks * ks));
      const q = k * th2 / Geff, L0 = Math.log(2 * Math.E + 1.8 * q), C0 = 14.2 + 731 / (1 + 62.5 * q);
      return L0 / (L0 + C0 * q * q);
    };
    const W = (x) => x < 1e-3 ? 1 - x * x / 10 : 3 * (Math.sin(x) - x * Math.cos(x)) / (x * x * x);
    const P0 = (k) => { const t = T(k); return Math.pow(k, ns) * t * t; };
    const sigR0 = (R, Pf) => Math.sqrt(simpson((lk) => { const k = Math.exp(lk), w = W(k * R); return k * k * k * Pf(k) * w * w; }, Math.log(1e-4), Math.log(2e2), 2400) / (2 * Math.PI * Math.PI));
    const A = Math.pow(s8 / sigR0(8, P0), 2);
    const Plin = (k, a) => { const d = a == null ? 1 : D(a); return A * P0(k) * d * d; };
    const rhoM = 2.775e11 * Om;
    const sigR = (R) => sigR0(R, (k) => A * P0(k));
    const sigmaM = (M) => sigR(Math.cbrt(3 * M / (4 * Math.PI * rhoM)));
    const sigG = (R) => Math.sqrt(simpson((lk) => { const k = Math.exp(lk); return k * k * k * A * P0(k) * Math.exp(-k * k * R * R); }, Math.log(1e-4), Math.log(50), 1600) / (2 * Math.PI * Math.PI));
    return { Om, OL, h, ns, Ob, s8, E, D, f, drift, kick, age, T, Plin, sigR, sigG, sigmaM, rhoM, A, hubbleTimeGyr };
  }
  return { make, simpson };
}

/*@worker-begin*/
/* =====================================================================================
   The particle-mesh N-body engine. Runs in a Blob worker.
   Comoving coordinates x (Mpc/h), momenta p = a² dx/dt (H0 = 1), KDK leapfrog in a:
     dx/da = p / (a³ E(a)),   dp/da = −∇φ / (a² E(a)),   ∇²φ = (3/2) Ωm δ
   CIC mass assignment, real-to-complex mixed-radix FFT Poisson solve,
   4-point finite-difference gradient, CIC force interpolation.
   ===================================================================================== */
function workerMain() {
  'use strict';
  const COS = cosmoLib();

  /* ---- Stockham FFT (radix 4, 2, 3) over n "rows", each row M contiguous floats ---- */
  function makeRows(n, M) {
    const fac = []; let m0 = n;
    while (m0 % 4 === 0) { fac.push(4); m0 /= 4; }
    while (m0 % 2 === 0) { fac.push(2); m0 /= 2; }
    while (m0 % 3 === 0) { fac.push(3); m0 /= 3; }
    if (m0 !== 1) throw new Error('FFT size must be 2^a 3^b');
    const NM = n * M;
    const Ar = new Float32Array(NM), Ai = new Float32Array(NM), Br = new Float32Array(NM), Bi = new Float32Array(NM);
    const cw = new Float64Array(n), sw = new Float64Array(n);
    for (let j = 0; j < n; j++) { cw[j] = Math.cos(2 * Math.PI * j / n); sw[j] = Math.sin(2 * Math.PI * j / n); }
    const H3 = Math.sqrt(3) / 2;
    const eng = { Ar, Ai, r: Ar, i: Ai };
    eng.run = function (sg) {
      let xr = Ar, xi = Ai, yr = Br, yi = Bi, nn = n, s = 1;
      for (let f = 0; f < fac.length; f++) {
        const r = fac[f], m = nn / r, sM = s * M, tstep = n / nn, istr = m * sM;
        for (let p = 0; p < m; p++) {
          const ib = sM * p, ob = sM * r * p, i1 = p * tstep;
          const w1r = cw[i1], w1i = sg * sw[i1];
          if (r === 4) {
            const i2 = 2 * i1, i3 = 3 * i1, w2r = cw[i2], w2i = sg * sw[i2], w3r = cw[i3], w3i = sg * sw[i3];
            const j1 = ib + istr, j2 = j1 + istr, j3 = j2 + istr, o1 = ob + sM, o2 = o1 + sM, o3 = o2 + sM;
            for (let t = 0; t < sM; t++) {
              const a0r = xr[ib + t], a0i = xi[ib + t], a1r = xr[j1 + t], a1i = xi[j1 + t];
              const a2r = xr[j2 + t], a2i = xi[j2 + t], a3r = xr[j3 + t], a3i = xi[j3 + t];
              const t0r = a0r + a2r, t0i = a0i + a2i, t1r = a0r - a2r, t1i = a0i - a2i;
              const t2r = a1r + a3r, t2i = a1i + a3i, t3r = a1r - a3r, t3i = a1i - a3i;
              const ur = -sg * t3i, ui = sg * t3r;
              yr[ob + t] = t0r + t2r; yi[ob + t] = t0i + t2i;
              let br = t0r - t2r, bi = t0i - t2i;
              yr[o2 + t] = br * w2r - bi * w2i; yi[o2 + t] = br * w2i + bi * w2r;
              br = t1r + ur; bi = t1i + ui;
              yr[o1 + t] = br * w1r - bi * w1i; yi[o1 + t] = br * w1i + bi * w1r;
              br = t1r - ur; bi = t1i - ui;
              yr[o3 + t] = br * w3r - bi * w3i; yi[o3 + t] = br * w3i + bi * w3r;
            }
          } else if (r === 2) {
            const j1 = ib + istr, o1 = ob + sM;
            for (let t = 0; t < sM; t++) {
              const a0r = xr[ib + t], a0i = xi[ib + t], a1r = xr[j1 + t], a1i = xi[j1 + t];
              yr[ob + t] = a0r + a1r; yi[ob + t] = a0i + a1i;
              const br = a0r - a1r, bi = a0i - a1i;
              yr[o1 + t] = br * w1r - bi * w1i; yi[o1 + t] = br * w1i + bi * w1r;
            }
          } else {
            const i2 = 2 * i1, w2r = cw[i2], w2i = sg * sw[i2];
            const j1 = ib + istr, j2 = j1 + istr, o1 = ob + sM, o2 = o1 + sM, c = sg * H3;
            for (let t = 0; t < sM; t++) {
              const a0r = xr[ib + t], a0i = xi[ib + t], a1r = xr[j1 + t], a1i = xi[j1 + t], a2r = xr[j2 + t], a2i = xi[j2 + t];
              const s1r = a1r + a2r, s1i = a1i + a2i, d1r = a1r - a2r, d1i = a1i - a2i;
              yr[ob + t] = a0r + s1r; yi[ob + t] = a0i + s1i;
              const mr = a0r - 0.5 * s1r, mi = a0i - 0.5 * s1i, nr = -c * d1i, ni = c * d1r;
              let br = mr + nr, bi = mi + ni;
              yr[o1 + t] = br * w1r - bi * w1i; yi[o1 + t] = br * w1i + bi * w1r;
              br = mr - nr; bi = mi - ni;
              yr[o2 + t] = br * w2r - bi * w2i; yi[o2 + t] = br * w2i + bi * w2r;
            }
          }
        }
        let tr = xr; xr = yr; yr = tr; tr = xi; xi = yi; yi = tr;
        nn = m; s *= r;
      }
      eng.r = xr; eng.i = xi;
    };
    return eng;
  }

  /* complex 3D FFT, in place, unnormalised (used once for the initial conditions) */
  function makeFFT3(N) {
    const E = makeRows(N, N), N2 = N * N, Ar = E.Ar, Ai = E.Ai;
    function transform(re, im, sg) {
      for (let z = 0; z < N; z++) {
        const b = z * N2;
        for (let y = 0; y < N; y++) { const o = b + y * N; for (let x = 0; x < N; x++) { Ar[x * N + y] = re[o + x]; Ai[x * N + y] = im[o + x]; } }
        E.run(sg);
        const RR = E.r, RI = E.i;
        for (let y = 0; y < N; y++) { const o = b + y * N; for (let x = 0; x < N; x++) { re[o + x] = RR[x * N + y]; im[o + x] = RI[x * N + y]; } }
      }
      for (let z = 0; z < N; z++) {
        const b = z * N2;
        Ar.set(re.subarray(b, b + N2)); Ai.set(im.subarray(b, b + N2));
        E.run(sg); re.set(E.r, b); im.set(E.i, b);
      }
      for (let y = 0; y < N; y++) {
        for (let z = 0; z < N; z++) { const o = z * N2 + y * N; Ar.set(re.subarray(o, o + N), z * N); Ai.set(im.subarray(o, o + N), z * N); }
        E.run(sg);
        const RR = E.r, RI = E.i;
        for (let z = 0; z < N; z++) { const o = z * N2 + y * N; re.set(RR.subarray(z * N, z * N + N), o); im.set(RI.subarray(z * N, z * N + N), o); }
      }
    }
    return { N, forward: (re, im) => transform(re, im, -1), inverse: (re, im) => transform(re, im, 1) };
  }

  /* real ↔ half-complex 3D FFT for the force mesh; spectrum layout [z][y][kx], kx = 0..N/2 */
  function makeRFFT3(N) {
    const H = N / 2, K = H + 1, NK = N * K, N2 = N * N;
    const Rx = makeRows(H, N), Ryz = makeRows(N, K);
    const ck = new Float64Array(K), sk = new Float64Array(K);
    for (let k = 0; k < K; k++) { ck[k] = Math.cos(2 * Math.PI * k / N); sk[k] = Math.sin(2 * Math.PI * k / N); }
    function yz(cr, ci, sg) {
      for (let z = 0; z < N; z++) {
        const b = z * NK;
        Ryz.Ar.set(cr.subarray(b, b + NK)); Ryz.Ai.set(ci.subarray(b, b + NK));
        Ryz.run(sg); cr.set(Ryz.r, b); ci.set(Ryz.i, b);
      }
      for (let y = 0; y < N; y++) {
        for (let z = 0; z < N; z++) { const o = z * NK + y * K; Ryz.Ar.set(cr.subarray(o, o + K), z * K); Ryz.Ai.set(ci.subarray(o, o + K), z * K); }
        Ryz.run(sg);
        const rr = Ryz.r, ri = Ryz.i;
        for (let z = 0; z < N; z++) { const o = z * NK + y * K; cr.set(rr.subarray(z * K, z * K + K), o); ci.set(ri.subarray(z * K, z * K + K), o); }
      }
    }
    function forward(f, cr, ci) {
      const Ar = Rx.Ar, Ai = Rx.Ai;
      for (let z = 0; z < N; z++) {
        const b = z * N2;
        for (let y = 0; y < N; y++) { const o = b + y * N; for (let n = 0; n < H; n++) { Ar[n * N + y] = f[o + 2 * n]; Ai[n * N + y] = f[o + 2 * n + 1]; } }
        Rx.run(-1);
        const Zr = Rx.r, Zi = Rx.i, ob = z * NK;
        for (let k = 0; k <= H; k++) {
          const ka = (k === H ? 0 : k) * N, kb = (k === 0 ? 0 : H - k) * N, c = ck[k], s = -sk[k];
          for (let y = 0; y < N; y++) {
            const zr = Zr[ka + y], zi = Zi[ka + y], wr = Zr[kb + y], wi = -Zi[kb + y];
            const fer = 0.5 * (zr + wr), fei = 0.5 * (zi + wi), for_ = 0.5 * (zi - wi), foi = -0.5 * (zr - wr);
            const o = ob + y * K + k;
            cr[o] = fer + c * for_ - s * foi; ci[o] = fei + c * foi + s * for_;
          }
        }
      }
      yz(cr, ci, -1);
    }
    function inverse(cr, ci, f) {
      yz(cr, ci, 1);
      const Ar = Rx.Ar, Ai = Rx.Ai;
      for (let z = 0; z < N; z++) {
        const ob = z * NK;
        for (let k = 0; k < H; k++) {
          const c = ck[k], s = sk[k], kb = H - k;
          for (let y = 0; y < N; y++) {
            const o = ob + y * K;
            const xr = cr[o + k], xi = ci[o + k], yr = cr[o + kb], yi = -ci[o + kb];
            const dr = xr - yr, di = xi - yi, tr = dr * c - di * s, ti = dr * s + di * c;
            Ar[k * N + y] = xr + yr - ti; Ai[k * N + y] = xi + yi + tr;
          }
        }
        Rx.run(1);
        const Zr = Rx.r, Zi = Rx.i, b = z * N2;
        for (let y = 0; y < N; y++) { const o = b + y * N; for (let n = 0; n < H; n++) { f[o + 2 * n] = Zr[n * N + y]; f[o + 2 * n + 1] = Zi[n * N + y]; } }
      }
    }
    return { N, K, NK, forward, inverse };
  }

  function rng(seed) { let s = seed >>> 0; return function () { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function schedule(ai, dlna, damax) {
    const s = [ai]; let a = ai;
    while (a < 1) { const da = Math.min(dlna * a, damax); a = a + da; if (a > 1 - 0.4 * damax) a = 1; s.push(a); }
    return s;
  }

  let S = null;
  let busy = false, timer = 0;
  const post = (m, tr) => self.postMessage(m, tr || []);

  function init(P) {
    const C = COS.make(P);
    const Np = P.Np, Nm = P.Nm, L = P.L, np = Np * Np * Np, nm3 = Nm * Nm * Nm, H = Nm / 2, K = H + 1;
    S = {
      P, C, Np, Nm, L, np, nm3, cellP: L / Np, cellM: L / Nm, off: 0.5 * Np / Nm,
      pos: new Float32Array(4 * np), mom: new Float32Array(3 * np), acc: new Float32Array(3 * np),
      rho: new Float32Array(nm3), phi: new Float32Array(nm3), cr: new Float32Array(Nm * Nm * K), ci: new Float32Array(Nm * Nm * K),
      gx: new Float32Array(nm3), gy: new Float32Array(nm3), gz: new Float32Array(nm3),
      rfft: makeRFFT3(Nm), sched: schedule(1 / (1 + P.zi), P.dlna || 0.05, P.damax || 0.01), k: 0, produced: 0, consumed: 0, pool: [],
      stats: { drms: 0, rmax: 0, ms: 0, s8: 0, sG: 0 }, fof: null,
    };
    const kf = 2 * Math.PI / L;
    // per-axis signed mode index and CIC window
    S.iax = new Int32Array(Nm); S.wax = new Float32Array(Nm);
    for (let i = 0; i < Nm; i++) { const ii = i < H ? i : i - Nm; S.iax[i] = ii; const x = Math.PI * ii / Nm; const sc = x === 0 ? 1 : Math.sin(x) / x; S.wax[i] = sc * sc; }
    // lookup tables over integer |n|² = nx² + ny² + nz²
    const n2max = 3 * H * H, nb = 26, kNy = Math.PI * Nm / L;
    S.pkLo = Math.log(kf * 0.999); S.pkHi = Math.log(kNy); S.pkNb = nb;
    S.binOf = new Int16Array(n2max + 1); S.inv2 = new Float32Array(n2max + 1); S.wth8 = new Float32Array(n2max + 1); S.wg = new Float32Array(n2max + 1); S.kOf = new Float32Array(n2max + 1);
    const binf = nb / (S.pkHi - S.pkLo);
    for (let n2 = 0; n2 <= n2max; n2++) {
      const k = Math.sqrt(n2) * kf; S.kOf[n2] = k;
      S.inv2[n2] = n2 ? 1 / (n2 * kf * kf) : 0;
      const b = n2 && k < kNy ? Math.floor((Math.log(k) - S.pkLo) * binf) : -1;
      S.binOf[n2] = b >= 0 && b < nb ? b : -1;
      const x = k * 8; S.wth8[n2] = x < 1e-3 ? 1 : 3 * (Math.sin(x) - x * Math.cos(x)) / (x * x * x);

  /* Zel'dovich initial conditions from a Gaussian random field with the ΛCDM spectrum.

            while (hk[h] !== -1) { if (hk[h] === nk) { st = hs[h]; break; } h = (h + 1) & msk; }
            if (st < 0) continue;
            for (let jj = st; jj < nc && sk[jj] === nk; jj++) {
              if (jj <= i) continue;
              const q = 4 * sp[jj];
              let ddx = pos[q] - xi; if (ddx > hL) ddx -= L; else if (ddx < -hL) ddx += L;
              let ddy = pos[q + 1] - yi; if (ddy > hL) ddy -= L; else if (ddy < -hL) ddy += L;
              let ddz = pos[q + 2] - zi; if (ddz > hL) ddz -= L; else if (ddz < -hL) ddz += L;
              if (ddx * ddx + ddy * ddy + ddz * ddz < b2) {
                const ra = find(i), rb = find(jj);
                if (ra !== rb) { if (ra < rb) par[rb] = ra; else par[ra] = rb; }
              }
            }
          }
        }
      }
    }
    cnt.fill(0, 0, nc);
    for (let i = 0; i < nc; i++) { const r = find(i); par[i] = r; cnt[r]++; }
    // halos with ≥ NMIN members: centre (periodic mean), size
    const NMIN = 10, mp = S.C.rhoM * L * L * L / np;
    let nh = 0;
    hid.fill(-1, 0, nc);
    const hx = [], hy = [], hz = [], hn = [], rx = [], ry = [], rz = [];
    for (let i = 0; i < nc; i++) {
      const r = par[i]; if (cnt[r] < NMIN) continue;
      let h = hid[r];
      const pi = 4 * sp[i];
      if (h < 0) { h = hid[r] = nh++; hx.push(0); hy.push(0); hz.push(0); hn.push(cnt[r]); rx.push(pos[pi]); ry.push(pos[pi + 1]); rz.push(pos[pi + 2]); }
      let dx = pos[pi] - rx[h]; if (dx > hL) dx -= L; else if (dx < -hL) dx += L;
      let dy = pos[pi + 1] - ry[h]; if (dy > hL) dy -= L; else if (dy < -hL) dy += L;
      let dz = pos[pi + 2] - rz[h]; if (dz > hL) dz -= L; else if (dz < -hL) dz += L;
      hx[h] += dx; hy[h] += dy; hz[h] += dz;

      const cls = Math.max(1, Math.min(30, 1 + Math.floor(10 * Math.log10(cnt[r] / NMIN))));
      pos[pi + 3] = Math.min(pos[pi + 3], 9990) + 1e4 * cls;
    }
    const order = [];
    for (let h = 0; h < nh; h++) {
      const n = hn[h];
      let x = rx[h] + hx[h] / n, y = ry[h] + hy[h] / n, z = rz[h] + hz[h] / n;
      x -= L * Math.floor(x / L); y -= L * Math.floor(y / L); z -= L * Math.floor(z / L);
      order.push([n, x, y, z]);
    }
    order.sort((u, v) => v[0] - u[0]);
    const top = Math.min(order.length, 96), halos = new Float32Array(4 * top);
    for (let i = 0; i < top; i++) { halos[4 * i] = order[i][1]; halos[4 * i + 1] = order[i][2]; halos[4 * i + 2] = order[i][3]; halos[4 * i + 3] = order[i][0] * mp; }
    // mass function: counts per 0.2 dex from 20 members
    const lm0 = Math.log10(20 * mp), nbin = 14, hmf = new Float32Array(nbin);
    for (let h = 0; h < order.length; h++) { const n = order[h][0]; if (n < 20) break; const bb = Math.floor((Math.log10(n * mp) - lm0) / 0.2); if (bb >= 0 && bb < nbin) hmf[bb]++; }
    res.n = nh; res.halos = halos; res.hmf = hmf; res.lm0 = lm0; res.maxN = order.length ? order[0][0] : 0; res.mp = mp; res.ms = performance.now() - t0;
    return res;
  }

  function kick(K) { const { mom, acc } = S; for (let i = 0, n = mom.length; i < n; i++) mom[i] += acc[i] * K; }
  function drift(Dr) {
    const { pos, mom, L, np } = S;
    for (let p = 0, j = 0, q = 0; p < np; p++, j += 4, q += 3) {
      for (let c = 0; c < 3; c++) {
        let v = pos[j + c] + mom[q + c] * Dr;
        if (v < 0) v += L; else if (v >= L) v -= L;
        if (!(v >= 0 && v < L)) v = ((v % L) + L) % L || 0;

    const { sched, C } = S, k = S.k;
    const a0 = sched[k], a1 = sched[k + 1], ah = 0.5 * (a0 + a1);
    const t0 = performance.now();
    kick(C.kick(a0, ah));
    drift(C.drift(a0, a1));
    forces();
    smoothField();
    kick(C.kick(ah, a1));
    S.k = k + 1;
    if (!isFinite(S.stats.drms) || !isFinite(S.stats.rmax)) { post({ type: 'nan', k: S.k }); S = null; return; }
    S.fof = a1 > 0.07 ? fof() : null;
    S.stats.ms = performance.now() - t0;
    emit();
  }

  function emit() {
    let buf = S.pool.pop();
    if (!buf || buf.byteLength !== S.pos.byteLength) buf = new ArrayBuffer(S.pos.byteLength);
    const out = new Float32Array(buf);
    out.set(S.pos);
    S.produced = S.k + 1;
    const f = S.fof;
    const halos = f ? f.halos : null;
    const vol = S.vol; S.vol = null;
    const tr = [buf]; if (halos) tr.push(halos.buffer); if (vol) tr.push(vol.buffer);
    post({ type: 'snap', k: S.k, a: S.sched[S.k], buf: out, vol, volG: S.volG, pk: S.pk.slice(), pkK: S.pkK.slice(), stats: Object.assign({}, S.stats, { tm: S.tm ? Object.assign({}, S.tm) : null }),

  }

  function pump() {
    timer = 0;
    if (!S || busy) return;
    if (S.k >= S.sched.length - 1) return;
    if (S.produced - S.consumed >= S.P.ahead) return;
    busy = true;
    try { step(); if (!S) { busy = false; return; } } catch (e) { post({ type: 'error', msg: String(e && e.stack || e) }); S = null; busy = false; return; }

const NOTES = `
<p>This cube is a piece of the universe 294 million parsecs across, almost a billion light-years. It holds <strong>262,144 particles of dark matter</strong>, each weighing about four trillion suns, roughly the mass of a few Milky Way halos. Your browser is computing their mutual gravity right now, from 50 million years after the Big Bang to today.</p>
<p>At the start the cube is almost perfectly smooth. Its density varies by only a few percent, a faint pattern of ripples left over from inflation and frozen into the oldest light. Gravity makes those ripples grow. A region that starts a little denser pulls a little harder, gathers more matter, and pulls harder still.</p>
<p>Matter drains out of the <em>voids</em>, collapses into thin <em>walls</em>, slides along the walls into <em>filaments</em>, and pours down the filaments into dense knots called <em>halos</em>. A halo glows gold once it has collapsed to roughly 200 times the average density. These are the groups and clusters of galaxies: gas later cools and sinks into them and lights up as stars.</p>
<p>Near the end, dark energy takes over the expansion. Structure still grows, but at about half its earlier pace, and the pattern is set. What remains is the <strong>cosmic web</strong>, the same pattern telescopes find when they map millions of galaxies. The blue glow is the dark matter itself, smoothed; each golden point in a cluster is a lump of dark matter as heavy as a big galaxy's halo.</p>
<h4>Try this</h4>
<ul>
<li>Press <strong>Fly through</strong> (<kbd>V</kbd>) to glide from cluster to cluster along the filaments. Labels name each cluster you pass and its distance.</li>
<li>Press <strong>Biggest cluster</strong> (<kbd>K</kbd>) to zoom into the heaviest halo in a 70 h⁻¹ Mpc slice and see the filaments that feed it.</li>
<li>Drag the <strong>Redshift</strong> slider to see any moment instantly in the Zel’dovich preview, then press <strong>N-body</strong> and watch the fuzzy prediction snap into tight halos.</li>
<li>Raise <strong>σ₈</strong> to 1.1 for a lumpier universe, or drop <strong>Ωm</strong> to 0.15 and watch the web freeze early.</li>
</ul>`;

const SCIENCE = `
<h4>What is simulated</h4>
<p>A periodic cube of side L = 200 h⁻¹ Mpc holding N = 64³ collisionless dark-matter particles (48³ on phones), evolved from redshift z = 49 to z = 0 in a flat ΛCDM universe. Positions x are comoving, so the overall expansion is divided out.</p>
<h4>Equations of motion</h4>
<p>With momentum p = a² dx/dt and time in units of 1/H₀, every particle obeys</p>
<span class="eq">dx/da = p / (a³ E),&nbsp;&nbsp; dp/da = −∇Φ / (a E)</span>
<span class="eq">E(a) = H/H₀ = √(Ω<sub>m</sub> a<sup>−3</sup> + Ω<sub>Λ</sub>)</span>
<p>The peculiar potential Φ solves the comoving Poisson equation, sourced only by the density contrast δ = ρ/ρ̄ − 1 (ρ̄ is the comoving mean density):</p>
<span class="eq">∇²Φ = 4πG ρ̄ δ / a = <sup>3</sup>⁄<sub>2</sub> Ω<sub>m</sub> H₀² δ / a</span>
<p>(equivalently 4πG a² ρ̄<sub>phys</sub> δ). The code solves ∇²φ = <sup>3</sup>⁄<sub>2</sub> Ω<sub>m</sub> δ on the mesh and uses Φ = φ/a, so the kick is dp/da = −∇φ / (a² E).</p>
<p>Time steps use kick–drift–kick leapfrog in the scale factor, with the exact drift and kick integrals ∫da/(a³E) and ∫da/(a²E): Δln a = 0.05 until a = 0.2, then Δa = 0.01, 127 steps in all.</p>
<h4>The particle-mesh method</h4>
<p>Each step spreads the particle mass onto a 128³ mesh (96³ on phones) with cloud-in-cell (CIC) weights. A real-to-complex FFT (mixed radix 4, 2 and 3, written for this page) turns the density into Fourier modes, and</p>
<span class="eq">φ<sub>k</sub> = −<sup>3</sup>⁄<sub>2</sub> Ω<sub>m</sub> δ<sub>k</sub> / (k² W<sub>CIC</sub>(k))</span>
<span class="eq">W<sub>CIC</sub>(k) = ∏<sub>i</sub> sinc²(k<sub>i</sub>Δ/2)</span>
<p>An inverse FFT gives φ on the mesh, a four-point finite difference gives the force, and the same CIC weights carry the force back to each particle. The deck shows the measured power spectrum P(k) against linear theory P<sub>lin</sub>(k) D²(a): large scales grow exactly as D², small scales break away as halos form.</p>
<h4>Initial conditions and the instant preview</h4>
<p>A Gaussian random field with P(k) ∝ k<sup>n<sub>s</sub></sup> T²(k), using the Eisenstein &amp; Hu no-wiggle transfer function (similar to the BBKS form), normalised to σ₈. Particles start on a lattice q and are displaced with the Zel’dovich approximation:</p>
<span class="eq">x = q + D(a) ψ(q),&nbsp;&nbsp; ψ<sub>k</sub> = i k δ<sub>k</sub> / k²</span>
<span class="eq">p = a² E(a) f(a) D(a) ψ(q)</span>
<span class="eq">D(a) ∝ E(a) ∫<sub>0</sub><sup>a</sup> da′ / (a′E)³</span>
<span class="eq">f = d ln D / d ln a ≈ Ω<sub>m</sub>(a)<sup>0.55</sup></span>
<p>The Zel’dovich preview draws the same formula on the GPU for any redshift, with density 1/|det(I + D ∂ψ/∂q)|. It is exact until streams of particles cross; after that particles sail through the walls instead of being held there. To keep the preview readable, ψ is smoothed with a 3.2 h⁻¹ Mpc Gaussian once streams begin to cross (the “truncated” Zel’dovich approximation).</p>
<h4>Halos</h4>
<p>After every step a friends-of-friends finder links particles closer than 0.2 of the mean spacing (Davis et al. 1985). Groups found this way enclose roughly 200 times the mean density. Groups of 10 or more particles (≥ 2.6 × 10¹³ h⁻¹ M☉ at full resolution) glow gold, and their abundance is compared with the Sheth–Tormen mass function.</p>
<h4>Parameters</h4>
<p>Ω<sub>m</sub> = 0.31, Ω<sub>Λ</sub> = 0.69, h = 0.68, Ω<sub>b</sub> = 0.049 (in the transfer function only), n<sub>s</sub> = 0.965, σ₈ = 0.81, T<sub>CMB</sub> = 2.7255 K. Particle mass m = ρ̄<sub>m</sub>L³/N = 2.6 × 10¹² h⁻¹ M☉ (6.2 × 10¹² on phones). Cosmic age follows t(a) = 2/(3H₀√Ω<sub>Λ</sub>) asinh(√(Ω<sub>Λ</sub>/Ω<sub>m</sub>) a<sup>3/2</sup>), 13.7 Gyr today. Dark energy overtakes matter at z = (Ω<sub>Λ</sub>/Ω<sub>m</sub>)<sup>1/3</sup> − 1 ≈ 0.31.</p>
<h4>Honest simplifications</h4>
<ul>
<li>Dark matter only: no gas, stars or feedback. Gold marks where galaxy groups and clusters would form.</li>
<li>Gravity is softened at the mesh scale (about 2 h⁻¹ Mpc), so halos are fuzzy balls with no inner structure, and individual galaxies are not resolved.</li>
<li>The box misses waves longer than 200 h⁻¹ Mpc, and one box is one random sample, so its biggest clusters can be rarer or commoner than average.</li>
<li>Zel’dovich starts leave small transients; second-order (2LPT) starts would reduce them.</li>
<li>Drawing: each particle is a soft sprite sized like an SPH kernel, h ∝ (m/ρ)<sup>1/3</sup>, and brighter where denser. The blue glow is a ray-marched volume of the mesh density, smoothed to about 3 h⁻¹ Mpc and drawn on a log scale; it also sets the particle colours, which removes shot noise from single particles. Early on each particle gets a random sub-lattice offset to hide the starting grid, and the contrast of both layers is stretched to follow the growing clumpiness, so the faint early web stays visible.</li>
<li>Gold deepens with halo mass: pale for groups of 10–30 particles, deep gold above about 4 × 10¹⁴ h⁻¹ M☉. A particle flashes white as it joins a halo.</li>
<li>The playback clock is not linear in time. Redshift 49 to 3 passes in about 6 s, and the web-building epoch from z = 3 to today gets about 34 s.</li>
</ul>
<span class="cite">Zel’dovich, Ya. B. (1970). Gravitational instability: an approximate theory for large density perturbations. A&amp;A 5, 84.</span>
<span class="cite">Peebles, P. J. E. (1980). The Large-Scale Structure of the Universe. Princeton University Press.</span>
<span class="cite">Bardeen, J. M., Bond, J. R., Kaiser, N. &amp; Szalay, A. S. (1986). The statistics of peaks of Gaussian random fields. ApJ 304, 15.</span>
<span class="cite">Bond, J. R., Kofman, L. &amp; Pogosyan, D. (1996). How filaments of galaxies are woven into the cosmic web. Nature 380, 603.</span>
<span class="cite">Springel, V. et al. (2005). Simulations of the formation, evolution and clustering of galaxies and quasars. Nature 435, 629.</span>
<span class="cite">Planck Collaboration (2020). Planck 2018 results. VI. Cosmological parameters. A&amp;A 641, A6.</span>
<span class="cite">Eisenstein, D. J. &amp; Hu, W. (1998). Baryonic features in the matter transfer function. ApJ 496, 605.</span>
<span class="cite">Sheth, R. K. &amp; Tormen, G. (1999). Large-scale bias and the peak background split. MNRAS 308, 119.</span>`;

/* ----------------------------------------------------------------------------- frame */

    if (view.tPhase < hold) view.D = 1;
    else {
      const u = U.smoothstep(0, 1, (view.tPhase - hold) / rew);
      view.D = Math.exp(U.lerp(Math.log(1), Math.log(Di), u));

    hud.d.set((COSMO.sigG2 * COSMO.D(a)).toFixed(2) + ' · linear');
  }
  ro.step.set(sim.kCur + ' / ' + Math.max(0, sim.sched.length - 1));
  const ms = sim.stepMs.length ? sim.stepMs.reduce((p, v) => p + v, 0) / sim.stepMs.length : sim.stats.ms;
  ro.ms.set(ms ? Math.round(ms) + ' ms' : '—');
  ro.s8.set(sim.stats.s8 ? sim.stats.s8.toFixed(3) + ' · ' + (params.s8 * COSMO.D(view.phase === 'za' ? view.zaA : sim.a)).toFixed(3) : '—');
  ro.rmax.set(sim.stats.rmax ? F.num(sim.stats.rmax, 0) : '—');
  ro.mesh.set(CFG.Nm + '³ · ' + (CFG.L / CFG.Nm).toFixed(2) + ' h⁻¹ Mpc');
  ro.mode.set(view.phase === 'za' ? 'Zel’dovich' : view.phase === 'intro' ? 'Preview' : 'PM N-body');
  ro.nh.set(sim.fof ? F.num(sim.fof.n) : '—');
  ro.fofms.set(sim.fof ? Math.round(sim.fof.ms) + ' ms' : '—');
  cosRo.seed.set(String(params.seed));
  cosRo.mp.set(F.sci(COSMO.rhoM * Math.pow(CFG.L, 3) / CFG.Np ** 3, 2) + ' M☉/h');
  if (view.phase === 'za') pkDirty = true;
}

/* ----------------------------------------------------------------------------- render */
const TUNE = { smoothW: 0.6, volGain: 0.12, volSig: 0.5, volFly: 1.4, volAtt: 0.5, gain: 0.06, tone: 1.15, bloomK: 0.22, box: 1, adapt: 1, kern: 2.2, kmin: 0.35, kmax: 3.2, prof: 3.0, voidB: 0.22, lam0: 0.4, lam1: 1.5,
  fly: { kern: 1.5, kmin: 0.5, kmax: 1.6, prof: 5.0, gain: 1.9, voidB: 0.3 } };
function contrastK() {   // brightness contrast follows the current clumpiness, so early structure is visible
  const sig = COSMO.sigG2 * view.D;
  // the truncated Zel'dovich field is smoother than σ(2 h⁻¹ Mpc) suggests, so stretch its contrast harder at mid redshift
  const za = (1 - view.mix) * (1 - U.smoothstep(0.55, 1.0, view.D));
  return U.clamp(sig / 1.3 * (1 - 0.55 * za), 0.12, 1);
}
function slabW() {
  let t = slabSl.value;
  if (view.visit) t = Math.min(t, VISIT_SLAB);              // a slice through the cluster, so its filaments read clearly
  return t >= CFG.L * 0.999 ? 100 : U.lerp(t / CFG.L, 100, camState.fog);
}
function render() {
  const w = canvas.width, h = canvas.height;
  // particles → HDR
  T.hdr.bind();
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (!(R.ready && view.phase !== 'boot')) {
    // initial conditions still computing: show the empty box, turning slowly
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(progs.line);
    const k = 0.5 + 0.5 * Math.sin(time * 2.2);
    Cosmos.gl.uniforms(gl, progs.line, { uView: camState.view, uProj: camState.proj, uCol: [0.05 + 0.03 * k, 0.07 + 0.04 * k, 0.16 + 0.08 * k] });
    gl.bindVertexArray(boxVao); gl.drawArrays(gl.LINES, 0, 24); gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
  }
  if (R.ready && view.phase !== 'boot') {
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.disable(gl.DEPTH_TEST);
    const p = progs.part; gl.useProgram(p);
    const Np = R.Np, L = CFG.L;
    const pxPerWorld = h / (2 * Math.tan(camState.fov / 2));
    const radius = 0.62 / Np; // world units (sprite diameter = 1.24 lattice spacings × kernel factor)
    const haze = 0.0 * (1 - U.smoothstep(0.03, 0.2, view.D));
    const size = sizeSl.value;
    // brightness: keep the mean projected column independent of Np, point size and haze
    const fe = camState.fog, fk = U.smoothstep(0.55, 1, fe), FT = TUNE.fly;
    const gain = TUNE.gain * (64 / Np) / (size * size * (1 + haze) * (1 + haze)) * U.lerp(1, FT.gain, fk) * U.lerp(1.3, 1, view.mix) * (1 + 0.8 * (1 - view.mix) * (1 - U.smoothstep(0.55, 1.0, view.D)) * U.smoothstep(0.1, 0.3, view.D));
    const fogF = Math.exp(U.lerp(Math.log(60), Math.log(0.47), fe));
    Cosmos.gl.uniforms(gl, p, {
      uView: camState.view, uProj: camState.proj, uS: sim.s, uD: view.D, uMix: view.mix, uL: L, uNp: Np, uOff: R.off,
      uPx: pxPerWorld * radius, uSize: size, uMaxPx: U.lerp(26, 18, fk) * (h / 900), uGain: gain, uColor: colT.value ? 1 : 0,
      uFogN: fogF * 0.3, uFogF: fogF, uNear: U.lerp(0.01, 0.04, fk),
      uHaze: haze, uStride: 1, uCopyGain: 1, uDepthCue: 1 - fe, uCamDist: camState.dist,
      uC: camState.C, uShift: [0, 0, 0], uTza: 1, uAdapt: TUNE.adapt,
      uKern: U.lerp(TUNE.kern, FT.kern, fk), uKmin: U.lerp(TUNE.kmin, FT.kmin, fk), uKmax: U.lerp(TUNE.kmax, FT.kmax, fk), uProf: U.lerp(TUNE.prof, FT.prof, fk),
      uVoidB: U.lerp(TUNE.voidB, FT.voidB, fk), uSlab: slabW(), uCon: contrastK(), uStar: fk, uCopies: 0, uLam: TUNE.lamF || (TUNE.lam0 + (TUNE.lam1 - TUNE.lam0) * U.smoothstep(0.35, 0.95, contrastK())),
      uJit: Math.max(1 - U.smoothstep(0.35, 0.9, view.D), 0.7 * (1 - view.mix)),
      uVolOn: VOL.ready ? 1 : 0, uSmoothW: TUNE.smoothW, uHaloHi: 1, uVolOff: VOL.G ? 0.5 / VOL.G : 0,
      uVolA: { tex: VOL.tex[R.cur], unit: 4 }, uVolB: { tex: VOL.tex[1 - R.cur], unit: 5 },
    });
    gl.bindVertexArray(R.vao[R.cur]);
    gl.drawArrays(gl.POINTS, 0, R.np);
    const copyA = copyT.value ? 1 - fe : 0;
    if (copyA > 0.01) {
      Cosmos.gl.uniforms(gl, p, { uCopies: 1, uShifts: SHIFTS, uStride: COPY_STRIDE, uCopyGain: 0.075 * COPY_STRIDE * copyA, uSlab: 100, uDepthCue: 0 });
      gl.bindVertexArray(R.cvao[R.cur]);
      gl.drawArraysInstanced(gl.POINTS, 0, Math.floor(R.np / COPY_STRIDE), 26);
      Cosmos.gl.uniforms(gl, p, { uCopies: 0, uStride: 1, uCopyGain: 1, uDepthCue: 1 - fe });
    }
    gl.bindVertexArray(null);
    // box edges
    const boxA = (boxT.value ? 1 : 0) * (1 - camState.fog);
    if (boxA > 0.01) {
      gl.useProgram(progs.line);
      Cosmos.gl.uniforms(gl, progs.line, { uView: camState.view, uProj: camState.proj, uCol: [0.022 * boxA * TUNE.box, 0.03 * boxA * TUNE.box, 0.06 * boxA * TUNE.box] });
      gl.bindVertexArray(boxVao); gl.drawArrays(gl.LINES, 0, 24); gl.bindVertexArray(null);
    }
    gl.disable(gl.BLEND);
    // volumetric dark-matter glow (N-body only: it is the simulation's own smoothed density)
    const vk = glowSl.value * view.mix * (VOL.ready ? 1 : 0);
    if (vk > 0.005) {
      const inv = M4.invert(M4.multiply(camState.proj, camState.view)) || M4.invert(M4.perspective(1, 1, 0.1, 10));
      const fwd = norm(camState.target.map((v, i) => v - camState.eye[i]));
      const lsig = U.lerp(VOL.lsigPrev || VOL.lsig, VOL.lsig, sim.s);
      T.vol.bind();
      gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(progs.vol);
      Cosmos.gl.uniforms(gl, progs.vol, {
        uVolA: { tex: VOL.tex[R.cur], unit: 4 }, uVolB: { tex: VOL.tex[1 - R.cur], unit: 5 },
        uInvVP: inv, uEye: camState.eye, uFwd: fwd, uC: camState.C.map((v) => v / L), uS: sim.s, uL: L,
        uFogN: fogF * 0.3, uFogF: fogF, uNear: U.lerp(0.01, 0.04, fk), uCamDist: camState.dist, uSlab: slabW(),
        uDepthCue: 1 - fe, uLam: TUNE.lam0 + (TUNE.lam1 - TUNE.lam0) * U.smoothstep(0.35, 0.95, contrastK()),
        uGain: TUNE.volGain * vk * U.lerp(1, TUNE.volFly, fk) * Math.pow(U.clamp(TUNE.volSig / Math.max(lsig, 1e-3), 1, 14) / 1.6, -TUNE.volAtt), uStretch: U.clamp(TUNE.volSig / Math.max(lsig, 1e-3), 1, 14),
        uT: time, uSteps: small ? 56 : 80, uColor: colT.value ? 1 : 0, uVolOff: VOL.G ? 0.5 / VOL.G : 0,
      });
      fsq();
      T.hdr.bind();
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(progs.copy);
      Cosmos.gl.uniforms(gl, progs.copy, { uT: T.vol.tex, uK: 1 });
      fsq();
      gl.disable(gl.BLEND);
    }
  }
  // bloom chain
  const lv = T.levels;
  gl.useProgram(progs.down);
  let src = T.hdr;
  for (let i = 0; i < lv.length; i++) {
    lv[i].bind();
    Cosmos.gl.uniforms(gl, progs.down, { uT: src.tex, uTx: [0.5 / src.w, 0.5 / src.h] });
    fsq(); src = lv[i];
  }
  gl.useProgram(progs.up);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = lv.length - 1; i > 0; i--) {
    lv[i - 1].bind();
    Cosmos.gl.uniforms(gl, progs.up, { uT: lv[i].tex, uTx: [0.5 / lv[i].w, 0.5 / lv[i].h], uK: 0.9 });
    fsq();
  }
  gl.disable(gl.BLEND);
  // composite
  Cosmos.gl.screen(gl);
  gl.useProgram(progs.comp);
  Cosmos.gl.uniforms(gl, progs.comp, {
    uHdr: T.hdr.tex, uBloom: lv[0].tex, uExp: expSl.value, uBloomK: bloomSl.value * TUNE.bloomK, uTone: TUNE.tone, uTime: time, uGrain: 0.035, uFade: view.phase === 'boot' ? 1 : view.fade, uRes: [w, h],
  });
  fsq();
}

ch.onResize(() => { pkDirty = true; });
document.addEventListener('visibilitychange', () => { /* rAF already stops; the worker idles once its look-ahead buffer is full */ });

Cosmos.debug.state = () => ({
  phase: view.phase, z: +(1 / sim.a - 1).toFixed(3), a: +sim.a.toFixed(4), step: sim.kCur, steps: sim.sched.length - 1, queued: sim.queue.length,
  tm: sim.stats.tm, fofMs: sim.fof ? Math.round(sim.fof.ms) : null,
  msPerStep: sim.stepMs.length ? Math.round(sim.stepMs.reduce((p, v) => p + v, 0) / sim.stepMs.length) : null,
  drms: +sim.stats.drms.toFixed(4), lsig: sim.stats.lsig != null ? +sim.stats.lsig.toFixed(4) : null, smax: sim.stats.smax != null ? +sim.stats.smax.toFixed(1) : null, vol: VOL.ready, rhoMax: +sim.stats.rmax.toFixed(1), D: +view.D.toFixed(4), mix: +view.mix.toFixed(2),
  fly: fly.on, np: R.np, mesh: CFG.Nm, seed: params.seed, s8: params.s8, Om: params.Om, psiRms: +sim.psiRms.toFixed(3), icMs: Math.round(sim.icMs),
  pk: sim.pk && Array.from(sim.pk).map((v, i) => [+sim.pkK[i].toFixed(4), +v.toFixed(1), +COSMO.Plin(sim.pkK[i], sim.a).toFixed(1)]),
});
Cosmos.debug.ui = { zSlider, speedSl, s8Sl, omSl, sizeSl, expSl, bloomSl, glowSl, slabSl, colT, boxT, labT, copyT }; Cosmos.debug.visit = visitCluster;
Cosmos.debug.tune = TUNE; Cosmos.debug.ch = ch; Cosmos.debug.setFly = setFly; Cosmos.debug.sim = sim; Cosmos.debug.view = view; Cosmos.debug.fly = fly; Cosmos.debug.cam = cam;

startRun({ intro: true });
})();
</script>
