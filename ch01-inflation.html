<script src="cosmos.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================================
   COSMOGENESIS 01 · QUANTUM FOAM — cosmic inflation.
   Physics: the inflaton φ obeys φ'' + (3H + Γ)φ' + V'(φ) = 0 with
   H² = (φ'²/2 + V + ρ_r)/3 in reduced Planck units (M_p = 1), time in units of 1/√V₀.
   The rolling field drives everything on screen: the zoom rate is d ln(aH)/dt, so the
   endless dive slows to a halt exactly when ε_H = 1 (ä = 0) and inflation ends.
   Visual: a sum of ~24 band-limited Gaussian random fields ("layers"), one every
   0.3 e-folds in wavenumber. Each layer is a de Sitter mode: inside the Hubble radius it
   oscillates, u ∝ (1 − i k/aH) e^{i k/aH}; outside it freezes.
   Finale: "Let gravity act" grows the final plate for 13.8 Gyr with the Zel'dovich approximation
   (GPU particles read the same frozen layers; ΛCDM growth factor and clock).
   ===================================================================================== */

const U = Cosmos.util, FMT = Cosmos.fmt;
const isSmall = () => window.matchMedia('(max-width: 760px)').matches;
const SMALL = isSmall();

/* ------------------------------------------------------------------ physics */
const S23 = Math.sqrt(2 / 3);
const MP_GEV = 2.435e18;                 // reduced Planck mass, GeV
const T_MP = 6.582e-25 / MP_GEV;         // ħ / (M_p c²) in seconds
const A_S = 2.1e-9;                      // Planck 2018 scalar amplitude
const N_TOTAL = 60;                      // e-folds of the run
const N_PIVOT = 55;                      // CMB pivot exits 55 e-folds before the end
const GAMMA_FRAC = 0.03;                 // inflaton decay rate Γ = 0.03 m

const POTS = {
  staro: {
    key: 'staro', label: 'Starobinsky R²', short: 'R²',
    formula: '= V₀(1 − e^−√⅔φ)²',
    f: (p) => { const e = Math.exp(-S23 * p); return (1 - e) * (1 - e); },
    fp: (p) => { const e = Math.exp(-S23 * p); return 2 * (1 - e) * S23 * e; },
    fpp: (p) => { const e = Math.exp(-S23 * p); return (4 / 3) * e * (2 * e - 1); },
    min: 0, bracket: [3, 8], more: +1,
    view: (phi, zoom) => [U.lerp(-1.25, -0.75, zoom), U.lerp(6.3, 1.1, zoom), U.lerp(1.2, 0.5, zoom)],
  },
  chaotic: {
    key: 'chaotic', label: 'Chaotic ½m²φ²', short: 'φ²',
    formula: '= ½ m²φ²',
    f: (p) => 0.5 * p * p, fp: (p) => p, fpp: () => 1,
    min: 0, bracket: [10, 20], more: +1,
    view: (phi, zoom, pre) => { const x1 = U.lerp(pre ? 20 : Math.max(3.2, phi * 1.1 + 1.2), 2.4, zoom); const x0 = U.lerp(-3.2, -2.4, zoom); return [x0, x1, 0.5 * x1 * x1 * 1.04]; },
  },
  hilltop: {
    key: 'hilltop', label: 'Hilltop [1 − (φ/μ)⁴]²', short: 'hilltop',
    formula: '= V₀[1 − (φ/μ)⁴]²',
    f: (p) => { const x = p * p * p * p; return (1 - x) * (1 - x); },
    fp: (p) => { const x = p * p * p * p; return -8 * p * p * p * (1 - x); },
    fpp: (p) => { const x = p * p * p * p; return 32 * x * p * p - 24 * p * p * (1 - x); },
    min: 1, bracket: [0.004, 0.3], more: -1,
    view: (phi, zoom) => [U.lerp(-1.32, 0.35, zoom), U.lerp(1.36, 1.3, zoom), U.lerp(1.22, 0.9, zoom)],
  },
};

/** One RK4 step of the background equations. s = {phi, pi, rr, N, tau} */
function makeStepper(P, Gam) {
  const d = new Float64Array(4);
  const der = (phi, pi, rr) => {
    const h = Math.sqrt(Math.max(1e-300, (0.5 * pi * pi + P.f(phi) + rr) / 3));
    d[0] = pi; d[1] = -(3 * h + Gam) * pi - P.fp(phi); d[2] = -4 * h * rr + Gam * pi * pi; d[3] = h;
    return d;
  };
  const k = [new Float64Array(4), new Float64Array(4), new Float64Array(4), new Float64Array(4)];
  return function step(s, dt) {
    k[0].set(der(s.phi, s.pi, s.rr));
    k[1].set(der(s.phi + dt / 2 * k[0][0], s.pi + dt / 2 * k[0][1], s.rr + dt / 2 * k[0][2]));
    k[2].set(der(s.phi + dt / 2 * k[1][0], s.pi + dt / 2 * k[1][1], s.rr + dt / 2 * k[1][2]));
    k[3].set(der(s.phi + dt * k[2][0], s.pi + dt * k[2][1], s.rr + dt * k[2][2]));
    s.phi += dt / 6 * (k[0][0] + 2 * k[1][0] + 2 * k[2][0] + k[3][0]);
    s.pi += dt / 6 * (k[0][1] + 2 * k[1][1] + 2 * k[2][1] + k[3][1]);
    s.rr = Math.max(0, s.rr + dt / 6 * (k[0][2] + 2 * k[1][2] + 2 * k[2][2] + k[3][2]));
    s.N += dt / 6 * (k[0][3] + 2 * k[1][3] + 2 * k[2][3] + k[3][3]);
    s.tau += dt;
  };
}
const hubble = (P, s) => Math.sqrt(Math.max(1e-300, (0.5 * s.pi * s.pi + P.f(s.phi) + s.rr) / 3));
const epsH = (P, s) => { const h = hubble(P, s); return (s.pi * s.pi + (4 / 3) * s.rr) / (2 * h * h); };
const maxDt = (P, s) => 0.02 / (Math.sqrt(Math.abs(P.fpp(s.phi))) + hubble(P, s) + 1e-3);

/** Solve for the starting field that gives exactly N_TOTAL e-folds, then record the model's numbers. */
function calibrate(P) {
  const m = Math.sqrt(P.fpp(P.min)), Gam = GAMMA_FRAC * m;
  const step = makeStepper(P, Gam);
  const init = (phi0) => { const h = Math.sqrt(P.f(phi0) / 3); return { phi: phi0, pi: -P.fp(phi0) / (3 * h), rr: 0, N: 0, tau: 0 }; };
  const runToEnd = (phi0, rec) => {
    const s = init(phi0);
    for (let i = 0; i < 400000; i++) {
      step(s, maxDt(P, s));
      if (rec) rec(s);
      if (epsH(P, s) >= 1) return s;
    }
    return s;
  };
  let lo = P.bracket[0], hi = P.bracket[1];
  for (let i = 0; i < 48; i++) {
    const mid = P.more > 0 ? 0.5 * (lo + hi) : Math.sqrt(lo * hi);
    const N = runToEnd(mid).N;
    if ((N > N_TOTAL) === (P.more > 0)) hi = mid; else lo = mid;
  }
  const phi0 = P.more > 0 ? 0.5 * (lo + hi) : Math.sqrt(lo * hi);
  const trace = [];
  const end = runToEnd(phi0, (s) => trace.push([s.N, s.phi, s.pi]));
  // horizon exit of the pivot (55 e-folds before the end)
  let star = trace[0];
  for (const t of trace) { if (end.N - t[0] >= N_PIVOT) star = t; else break; }
  const phiS = star[1], fS = P.f(phiS), fpS = P.fp(phiS), fppS = P.fpp(phiS);
  const epsV = 0.5 * (fpS / fS) ** 2, etaV = fppS / fS;
  const hS = Math.sqrt((0.5 * star[2] * star[2] + fS) / 3), epsHS = star[2] * star[2] / (2 * hS * hS);
  const V0 = A_S * 8 * Math.PI * Math.PI * epsHS / (hS * hS); // P_ζ = H²/(8π² ε) = A_s at the pivot
  const h0 = Math.sqrt(P.f(phi0) / 3), hEnd = hubble(P, end);
  return {
    P, m, Gam, phi0, h0, hEnd, tauEnd: end.tau, phiEnd: end.phi, phiStar: phiS, NEnd: end.N,
    ns: 1 - 6 * epsV + 2 * etaV, r: 16 * epsV, V0, sqrtV0: Math.sqrt(V0),
    HstarGeV: hS * Math.sqrt(V0) * MP_GEV, V14GeV: Math.pow(V0 * fS, 0.25) * MP_GEV,
    t0: 0.5 / (h0 * Math.sqrt(V0)) * T_MP, // radiation-era convention before inflation: t = 1/(2H)
  };
}
const MODELS = {};
for (const k in POTS) MODELS[k] = calibrate(POTS[k]);

/* ------------------------------------------------------------------ writing */
const NOTES = `
<p>You are inside a patch of space about 10<sup>−27</sup> metres across, about a trillion times smaller than a proton. It is filled with the <strong>inflaton</strong>, a field whose energy makes space push itself apart. The thin ring is the <em>Hubble radius</em>: the farthest a signal can travel while space grows by a factor of e.</p>
<p>The field rolls slowly down its potential, shown as the glowing ball in the controls. While it rolls, space grows exponentially. Each <em>e-fold</em> multiplies every length by 2.718. Sixty of them stretch the patch by 10<sup>26</sup>, from far smaller than a proton to the size of a grapefruit, in about 10<sup>−36</sup> seconds.</p>
<p>Quantum physics never lets the field sit still. On scales smaller than the ring it jitters: the bright foam. When expansion stretches a ripple past the ring, it can no longer oscillate. It freezes into a permanent crease, cooler and darker. New foam boils up to replace it and freezes in turn, so the dive never ends. The same thing happens at every scale.</p>
<p>When the ball reaches the steep part of the slope, inflation stops. The field sloshes, decays into particles and heats the universe into a plasma. The frozen ripples survive as differences in density of a few parts in 100,000. Gravity will grow them into every galaxy.</p>
<p>At the end, press <strong>Let gravity act</strong>. Up to a quarter of a million particles start on the final plate and fall toward its peaks for 13.8 billion years. Voids empty, matter piles into sheets and filaments, and the highest peaks become knots of galaxies. The pattern you watched freeze in the first 10<sup>−36</sup> seconds becomes the cosmic web.</p>
<h4>Try this</h4>
<ul>
<li>Wait for the zoom-out (or press <kbd>E</kbd> to skip ahead), then press <kbd>G</kbd>. Drag <strong>Cosmic time</strong> back and forth to watch the web form and unform.</li>
<li>Switch the potential to <strong>½m²φ²</strong>. The ball starts high, H falls twelvefold and the dive slows before it stops. Its gravitational-wave signal is ruled out.</li>
<li>Drag <strong>n<sub>s</sub></strong> to 0.90 for big blobs, then to 1.05 for fine grain. Planck measured 0.965.</li>
<li>Drag the ball in the potential lower, so inflation lasts under 50 e-folds. At the end the smooth patch is smaller than the sky we see, and the horizon problem is back.</li>
</ul>`;

const fmtE = (x, d = 2) => { const e = Math.floor(Math.log10(Math.abs(x))); const m = x / Math.pow(10, e); return m.toFixed(d) + '×10<sup>' + e + '</sup>'; };
const MS = MODELS.staro, MC = MODELS.chaotic, MH = MODELS.hilltop;
const SCIENCE = `
<h4>Expansion</h4>
<p>The Friedmann equation ties the expansion rate to the energy density. With a nearly constant density, the scale factor grows exponentially and we count growth in e-folds.</p>
<span class="eq">H² = (8πG/3) ρ = ρ / (3M<sub>p</sub>²),&nbsp;&nbsp; a ∝ e<sup>N</sup>,&nbsp;&nbsp; N = ∫ H dt ≈ 60</span>
<p>Here M<sub>p</sub> = (8πG)<sup>−1/2</sup> = 2.435×10<sup>18</sup> GeV is the reduced Planck mass. A patch 10<sup>−27</sup> m across grows by e<sup>60</sup> = 1.14×10<sup>26</sup> to 0.11 m. After reheating it grows by roughly another 10<sup>28</sup> and becomes our whole observable universe, 8.8×10<sup>26</sup> m across (the exact factor depends on the reheating temperature).</p>
<h4>The inflaton</h4>
<span class="eq">φ̈ + 3Hφ̇ + V′(φ) = 0,&nbsp;&nbsp; H² = (½φ̇² + V) / 3M<sub>p</sub>²</span>
<span class="eq">ε = (M<sub>p</sub>²/2)(V′/V)²,&nbsp;&nbsp; η = M<sub>p</sub>² V″/V,&nbsp;&nbsp; N ≈ M<sub>p</sub><sup>−2</sup>∫ V/V′ dφ</span>
<p>Inflation lasts while the slow-roll parameters are small. It ends exactly when ε<sub>H</sub> = −Ḣ/H² reaches 1, where the expansion stops accelerating (ä = 0). ε<sub>H</sub> ≈ ε in slow roll. The inset integrates the full equation with RK4, in units where M<sub>p</sub> = 1 and time is measured in 1/√V₀. The starting field is solved for so that N = 60 exactly at ε<sub>H</sub> = 1, and V₀ is fixed so that P<sub>ζ</sub> = 2.1×10<sup>−9</sup> at the pivot scale, 55 e-folds before the end.</p>
<p>The zoom on screen is driven by the comoving Hubble scale, d ln(aH)/dt = H(1 − ε<sub>H</sub>). It stops by itself when ε<sub>H</sub> = 1, so each potential makes a different show:</p>
<ul>
<li><strong>Starobinsky R²</strong>, V = V₀(1 − e<sup>−√(2/3)φ/M<sub>p</sub></sup>)²: φ starts at ${MS.phi0.toFixed(2)} M<sub>p</sub>, H ≈ ${fmtE(MS.HstarGeV, 1)} GeV, V<sup>1/4</sup> ≈ ${fmtE(MS.V14GeV, 1)} GeV, n<sub>s</sub> = ${MS.ns.toFixed(3)}, r = ${MS.r.toFixed(4)}. Inside the Planck contour.</li>
<li><strong>Chaotic</strong>, V = ½m²φ²: φ starts at ${MC.phi0.toFixed(1)} M<sub>p</sub>, m = ${fmtE(Math.sqrt(MC.V0) * MP_GEV, 1)} GeV, n<sub>s</sub> = ${MC.ns.toFixed(3)}, r = ${MC.r.toFixed(2)}. Excluded by r &lt; 0.036.</li>
<li><strong>Hilltop</strong>, V = V₀[1 − (φ/μ)⁴]² with μ = M<sub>p</sub>: φ starts at ${MH.phi0.toFixed(3)} M<sub>p</sub>, H ≈ ${fmtE(MH.HstarGeV, 1)} GeV, n<sub>s</sub> = ${MH.ns.toFixed(3)}, r ≈ ${fmtE(MH.r, 0)}. Its tilt is too red for Planck.</li>
</ul>
<h4>Quantum seeds</h4>
<p>Each Fourier mode of the field fluctuation behaves like a quantum oscillator. In de Sitter space its mode function is exact:</p>
<span class="eq">δφ<sub>k</sub> = (H/√(2k³)) (1 − i k/aH) e<sup>i k/aH</sup></span>
<p>Inside the horizon (k ≫ aH) it oscillates with amplitude ∝ k/aH. Outside (k ≪ aH) it freezes at δφ = H/2π per e-fold. Every layer on screen follows this behaviour. The “one ripple” plot in the controls draws the real part of the exact function, with its growth inside the horizon compressed so the whole curve fits, and each layer on screen as a dot. The frozen field sets the curvature perturbation ζ = −(H/φ̇)δφ, and later the density contrast.</p>
<span class="eq">P<sub>ζ</sub>(k) = H² / (8π² ε M<sub>p</sub>²) ∝ k<sup>n<sub>s</sub>−1</sup>,&nbsp;&nbsp; n<sub>s</sub> − 1 = −6ε + 2η,&nbsp;&nbsp; r = 16ε</span>
<p>Planck 2018 measured n<sub>s</sub> = 0.9649 ± 0.0042 and A<sub>s</sub> = 2.1×10<sup>−9</sup>. BICEP/Keck 2021 found r &lt; 0.036 (95%). The fluctuations are Gaussian and adiabatic, and they are correlated on scales that were outside the horizon at recombination, all as inflation predicts.</p>
<h4>Why inflate at all</h4>
<p><strong>Horizon problem:</strong> the cosmic microwave background has the same temperature to 1 part in 10<sup>5</sup> across regions that could never have exchanged light in a universe without inflation. <strong>Flatness problem:</strong> |Ω − 1| ∝ (aH)<sup>−2</sup> grows after inflation, so it must have started absurdly close to zero. Sixty e-folds shrink the comoving Hubble radius by about e<sup>60</sup>, solving both. You can test this: drag the ball lower so inflation lasts fewer e-folds. The zoom-out at the end then stops at the edge of the smoothed patch, which is smaller than the sky we see.</p>
<h4>Sizes today</h4>
<p>The ladder and scale bar convert to today's sizes with one factor for all expansion after inflation, ≈7.7×10<sup>27</sup>, chosen so that a 60-e-fold run turns the starting patch into today's observable universe. A ripple's comoving size maps to the mass it will gather, M = (π/6) ρ̄<sub>m</sub> d³ with ρ̄<sub>m</sub> ≈ 3.9×10<sup>10</sup> M<sub>☉</sub> Mpc<sup>−3</sup>: a Milky Way (1.3×10<sup>12</sup> M<sub>☉</sub>) grows from a region about 4 Mpc across, a rich cluster from about 37 Mpc. The final plate is about 30 Mpc wide, and the marked peaks are its highest regions, typically 2 to 4σ above the mean in the smoothed field. Rare high peaks like these collapse first and host the most massive galaxies.</p>
<h4>Where the seeds go</h4>
<p><strong>Let gravity act</strong> moves matter with the Zel’dovich approximation. Each particle starts at its Lagrangian position <b>q</b> on the final plate and travels in a straight line:</p>
<span class="eq"><b>x</b> = <b>q</b> + D(t) <b>ψ</b>(<b>q</b>),&nbsp;&nbsp; ∇·<b>ψ</b> = −δ<sub>lin</sub>,&nbsp;&nbsp; <b>ψ</b><sub>k</sub> = i<b>k</b> δ<sub>k</sub> / k²</span>
<p>The particles read the same frozen layers that paint the plate, so the web is that plate's own future. Where streams cross, they pile into sheets, filaments and knots (caustics). The clock is flat ΛCDM with Ω<sub>m</sub> = 0.315, Ω<sub>Λ</sub> = 0.685 and H₀ = 67.4 km s<sup>−1</sup> Mpc<sup>−1</sup>:</p>
<span class="eq">t(a) = (2 / 3H₀√Ω<sub>Λ</sub>) arsinh(√(Ω<sub>Λ</sub>/Ω<sub>m</sub>) a<sup>3/2</sup>),&nbsp;&nbsp; D(a) ∝ a g(a)</span>
<p>t(1) = 13.8 Gyr. The growth factor uses the Carroll, Press &amp; Turner fit for g(a), which falls below 1 once dark energy takes over, so growth slows in the last few billion years. The preview runs from 100 Myr (z ≈ 30) to today.</p>
<h4>What is simplified</h4>
<p>This is a 2D slice of a 3D field. Each layer is a band-limited Gaussian random field made by FFT, 0.3 e-folds wide in wavenumber, and about 20 layers are drawn at once. Time is compressed: 60 e-folds take about 28 s. The oscillation rate and amplitude of the sub-horizon foam are compressed for the eye. On screen the tilt is magnified 8× (switch it off to see the true, subtle tilt), and seed amplitudes follow the power law set by the n<sub>s</sub> slider, which defaults to the potential's prediction. The decay rate Γ = 0.03 m is chosen so reheating finishes in about five oscillations; real models usually decay far more slowly.</p>
<p>“Time since the Big Bang” assumes a radiation era before inflation (t₀ = 1/2H) and depends on the energy scale. The popular range of 10<sup>−36</sup> to 10<sup>−32</sup> s fits low-scale inflation. At Starobinsky's H ≈ 1.5×10<sup>13</sup> GeV, 60 e-folds take only about 3×10<sup>−36</sup> s.</p>
<p>The gravity preview is a 2D toy. The Zel’dovich approximation is exact only until streams cross: real matter then forms bound halos, while these particles stream on through each other, so knots stay fuzzy. The cold-dark-matter transfer function is approximated by δ ∝ λ<sup>−0.28</sup> so that small ripples collapse first, and the overall amplitude is chosen by eye so that ripples about 10 Mpc across are just turning nonlinear today, as they are in our universe (σ<sub>8</sub> ≈ 0.81). The growth factor D sets the pace on screen, so the clock races through the last billions of years.</p>
<p>Inflation is well supported but not proven. The decisive test would be primordial gravitational waves (r), which have not yet been seen.</p>

/* ---- band-limited Gaussian random field texture (FFT) ---- */
const TEX_N = SMALL ? 256 : 512;
const K0 = TEX_N / 16;           // 16 texels per wavelength
function fft1(re, im, n, inv) {
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (inv ? 2 : -2) * Math.PI / len, half = len >> 1;
    for (let k = 0; k < half; k++) {
      const wr = Math.cos(ang * k), wi = Math.sin(ang * k);
      for (let i = k; i < n; i += len) {
        const b = i + half;
        const xr = re[b] * wr - im[b] * wi, xi = re[b] * wi + im[b] * wr;
        re[b] = re[i] - xr; im[b] = im[i] - xi; re[i] += xr; im[i] += xi;
      }
    }
  }
}
function fft2(re, im, n) {
  const tr = new Float64Array(n), ti = new Float64Array(n);
  for (let y = 0; y < n; y++) { const o = y * n; for (let x = 0; x < n; x++) { tr[x] = re[o + x]; ti[x] = im[o + x]; } fft1(tr, ti, n, true); for (let x = 0; x < n; x++) { re[o + x] = tr[x]; im[o + x] = ti[x]; } }
  for (let x = 0; x < n; x++) { for (let y = 0; y < n; y++) { tr[y] = re[y * n + x]; ti[y] = im[y * n + x]; } fft1(tr, ti, n, true); for (let y = 0; y < n; y++) { re[y * n + x] = tr[y]; im[y * n + x] = ti[y]; } }
}
function makeNoise(n, seed) {
  const rng = U.rng(seed), out = new Float32Array(n * n * 4);
  const sig = 0.2;
  for (let pair = 0; pair < 2; pair++) {
    const re = new Float64Array(n * n), im = new Float64Array(n * n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const kx = x < n / 2 ? x : x - n, ky = y < n / 2 ? y : y - n, k = Math.hypot(kx, ky);
      const L = k > 0 ? Math.log(k / K0) : -99;
      const w = Math.exp(-(L * L) / (2 * sig * sig));
      re[y * n + x] = w * U.gauss(rng); im[y * n + x] = w * U.gauss(rng);
    }
    fft2(re, im, n);
    let sr = 0, si = 0;
    for (let i = 0; i < n * n; i++) { sr += re[i] * re[i]; si += im[i] * im[i]; }
    sr = 1 / Math.sqrt(sr / (n * n)); si = 1 / Math.sqrt(si / (n * n));
    for (let i = 0; i < n * n; i++) { out[i * 4 + pair * 2] = re[i] * sr; out[i * 4 + pair * 2 + 1] = im[i] * si; }
  }
  return out;
}
const NOISE = makeNoise(TEX_N, 1981);
const noiseTex = (() => {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  let n = TEX_N, data = NOISE, level = 0;
  for (;;) {
    gl.texImage2D(gl.TEXTURE_2D, level, gl.RGBA16F, n, n, 0, gl.RGBA, gl.FLOAT, data);
    if (n === 1) break;
    const m = n >> 1, next = new Float32Array(m * m * 4);
    for (let y = 0; y < m; y++) for (let x = 0; x < m; x++) for (let c = 0; c < 4; c++) {
      const a = ((2 * y) * n + 2 * x) * 4 + c;
      next[(y * m + x) * 4 + c] = 0.25 * (data[a] + data[a + 4] + data[a + n * 4] + data[a + n * 4 + 4]);
    }
    data = next; n = m; level++;
  }
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);

/** Bilinear CPU sample of the noise pair (A,B) at tile coords (u,v). */
function noiseAt(u, v, pair, out) {
  const n = TEX_N;
  let x = (u - Math.floor(u)) * n - 0.5, y = (v - Math.floor(v)) * n - 0.5;
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const X0 = (x0 + n) % n, X1 = (x0 + 1 + n) % n, Y0 = (y0 + n) % n, Y1 = (y0 + 1 + n) % n;
  const c = pair * 2;
  for (let k = 0; k < 2; k++) {
    const a = NOISE[(Y0 * n + X0) * 4 + c + k], b = NOISE[(Y0 * n + X1) * 4 + c + k], cc = NOISE[(Y1 * n + X0) * 4 + c + k], d = NOISE[(Y1 * n + X1) * 4 + c + k];
    out[k] = (a * (1 - fx) + b * fx) * (1 - fy) + (cc * (1 - fx) + d * fx) * fy;
  }
  return out;
}

const NLMAX = 28;

precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uNoise;
uniform vec2 uCenter;
uniform int uNL;
uniform vec4 uM[${NLMAX}];   // per layer: rotation × scale (texture tiles per device px)
uniform vec4 uO[${NLMAX}];   // offset.xy, channel pair, -

  Y -= uFsub.x; Od -= uFsub.y;
  float F = (Y + Od) * uGain.z;     // total frozen density contrast, in σ
  float Fy = Y * uGain.x, Fo = Od * uGain.y;
  L *= uGain.w;

  // ---- inflation: old frozen modes deep and cool, young frozen modes lilac, live foam violet-white
  vec3 col = vec3(0.007, 0.006, 0.018);
  vec3 old = vec3(0.036, 0.030, 0.120) * smoothstep(-2.4, 1.2, Fo)
           + vec3(0.10, 0.085, 0.36) * pow(smoothstep(-0.3, 2.4, Fo), 1.5);
  vec3 young = vec3(0.20, 0.18, 0.62) * pow(smoothstep(-0.4, 2.4, Fy), 1.4)
             + vec3(0.55, 0.55, 1.00) * pow(smoothstep(1.3, 3.0, Fy), 2.2);
  col += (old + young * (0.55 + 0.45 * smoothstep(-1.5, 1.5, Fo))) * uFrozen;
  float ridge = exp(-L * L * uTune.x);

  float crest = smoothstep(1.0, 3.0, abs(L));
  float sparkle = smoothstep(2.8, 3.8, L);

  // The mean sits in a deep violet so that voids read as dark and peaks burn white-gold.
  float d = F;

  pl = mix(pl, vec3(0.580, 0.440, 1.000), smoothstep(0.25, 1.45, d));
  pl = mix(pl, vec3(1.100, 0.940, 0.950), smoothstep(1.25, 2.35, d));
  pl = mix(pl, vec3(1.750, 1.220, 0.560), smoothstep(2.05, 3.25, d));

const WEB_VS = `#version 300 es

uniform sampler2D uNoise;
uniform vec2 uCenter, uRes, uOrigin, uPsi0;
uniform int uNL, uCols;

function stepPhysics(dt) {

/* ------------------------------------------------------------------ frame: layers → uniforms */
const LMIN = 8.5;   // smallest wavelength drawn, device px
const uniformsOut = { nl: 0, fsubY: 0, fsubO: 0, gY: 1, gO: 1, gT: 1, gL: 1, sF: 0, lamCross: 1 };
function buildLayers(dN, dt) {
  const r = canvas.width / Math.max(1, canvas.clientWidth);
  view.RHpx = view.RH * r;
  const lamCross = 2 * Math.PI * view.RHpx * Math.exp(sim.zOff);   // on-screen wavelength of a mode at horizon exit
  const halfDiag = 0.5 * Math.hypot(canvas.width, canvas.height);
  const lmin = LMIN * (1 + 1.2 * sim.plasma) * r / 1.5;           // in the plasma, diffusion erases the finest ripples
  const LMAX = halfDiag * TUNE.fz1 * 1.05;
  const Nv = sim.Nv;
  const X = magToggle.value ? 8 : 1;
  const tiltK = X * (nsSlider.value - 1) / 2;
  const idle = sim.phase === 'pre' ? 1.1 : sim.phase === 'inflate' ? 0.12 : 0;
  // phases and horizon memory for every layer that exists
  for (let i = 0; i < JN; i++) {
    const j = i - JOFF;
    const lnS = Nv - j * DELTA;
    if (lnS > 16) continue;
    const s = Math.exp(lnS);
    if ((sim.phase === 'pre' || sim.phase === 'inflate') && s > Lsmax[i]) Lsmax[i] = s;
    const se = Math.max(s, Lsmax[i]);
    // de Sitter mode: phase advances by k/aH per e-fold (compressed), and stops outside the horizon
    const W = Math.pow(se, -0.55) / (1 + Math.pow(se, 1.45));

  for (let j = jHi; j >= jLo; j--) {

/* ------------------------------------------------------------------ gravity preview: GPU particles */
const webState = { gain: 1, lmin: 1, lref: 1, psi0: [0, 0], cols: 0, rows: 0, sp: 1 };

/** CPU twin of WEB_VS: raw displacement ψ (device px, GL axes) and δ at a device-px offset from the view centre. */
function psiAtDev(px, py, out) {

/** Normalise the transferred field to unit variance and remove the bulk flow at the view centre. */
function updateWebState(W, H, r, amp) {
  const lmin = WEB.lminCss * r;

  for (let n = 0; n < uniformsOut.nl; n++) {

    const wl = U.smoothstep(lmin, lmin * 1.7, lam);
    if (wl <= 0) continue;
    const a = Math.hypot(uK[b4] + uK2[b4], uK[b4 + 1] + uK2[b4 + 1]);
    const T = Math.pow(lam / webState.lref, -WEB.beta) * wl;
    sW += (a * T) * (a * T);

/* ------------------------------------------------------------------ frame: render */
let prevZoomN = 0;

  const r = W / Math.max(1, canvas.clientWidth);
  const cx = view.fx * r, cy = (view.H - view.fy) * r;

  const ng = ac.createGain(); ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.5, t + 0.015); ng.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
  src.connect(lp).connect(ng).connect(n.out); src.start(t); src.stop(t + 2.9);
};
ch.onSound((on) => { if (on) makeSound(); else killSound(); });
const soundLevel = () => { const n = snd.nodes; if (!n) return; n.out.gain.setTargetAtTime(document.hidden ? 0 : ch.paused ? 0.25 : 1, n.ac.currentTime, 0.2); };
document.addEventListener('visibilitychange', soundLevel);
ch.onPause(soundLevel);

/* ------------------------------------------------------------------ readouts */
let roT = 0;
function updateReadouts(dt) {
  roT += dt; if (roT < 0.1) return; roT = 0;
  const s = sim.s, M = sim.model, P = sim.P;
  const Hgev = sim.h * M.sqrtV0 * MP_GEV;
  hud.N.set('N = ' + s.N.toFixed(2) + (sim.phase === 'pre' ? '  · about to inflate' : ''));
  hud.a.set('a = eᴺ = ' + FMT.sci(Math.exp(s.N), 3));
  hud.H.set('H = ' + FMT.sci(Hgev, 3) + ' GeV');
  const post = sim.phase !== 'pre' && sim.phase !== 'inflate';
  hud.eps.set('ε = ' + (sim.eps < 1e-3 ? FMT.sci(sim.eps, 2) : sim.eps.toFixed(3)) + (sim.phase === 'inflate' && sim.eps > 0.3 ? '  → 1 ends inflation' : post ? '  · inflation over' : ''));
  const tS = sim.t0 + s.tau * T_MP / M.sqrtV0;
  const webClock = sim.webMix > 0.05;
  if (webClock) {
    const z = 1 / sim.webA - 1;
    hud.t.set('t = ' + (sim.webT < 1 ? Math.round(sim.webT * 1000) + ' Myr' : sim.webT.toFixed(2) + ' Gyr') + ' · z = ' + (z < 10 ? z.toFixed(2) : z.toFixed(0)));
    clock.children[1].textContent = fmtAge(sim.webT);
    clock.children[2].textContent = 'z = ' + (z < 10 ? z.toFixed(2) : z.toFixed(1)) + ' · D = ' + sim.webD.toFixed(3);
  } else hud.t.set('t = ' + FMT.sci(tS, 3) + ' s');
  clock.classList.toggle('on', webClock && !view.compact && !document.body.classList.contains('cz-cinema'));
  const f = P.f(s.phi), fp = P.fp(s.phi), fpp = P.fpp(s.phi);
  const eV = 0.5 * (fp / f) ** 2, eta = fpp / f;
  const osc = sim.phase !== 'pre' && sim.phase !== 'inflate';
  infRO.phi.set(s.phi.toFixed(3) + ' M_p');
  infRO.epsV.set(osc || !isFinite(eV) ? '—' : eV < 1e-3 ? FMT.sci(eV, 2) : eV.toFixed(3));
  infRO.eta.set(osc || !isFinite(eta) ? '—' : Math.abs(eta) < 1e-3 ? FMT.sci(eta, 2) : eta.toFixed(3));
  infRO.epsH.set(sim.eps < 1e-3 ? FMT.sci(sim.eps, 2) : sim.eps.toFixed(3));
  physRO.H.set(FMT.sci(Hgev, 2) + ' GeV');
  physRO.ns.set('n_s = ' + M.ns.toFixed(3));
  physRO.r.set('r = ' + (M.r < 1e-3 ? FMT.sci(M.r, 2) : M.r.toFixed(3)));
  physRO.V14.set(FMT.sci(M.V14GeV, 2) + ' GeV');
  physRO.T.set(sim.TrhGeV ? FMT.sci(sim.TrhGeV, 2) + ' GeV' : '—');
  physRO.Or.set(sim.phase === 'pre' || sim.phase === 'inflate' ? '0' : (100 * U.clamp(sim.Or, 0, 1)).toFixed(0) + '%');
  if (sim.hist.length) {
    histChart.setXY(0, sim.hist.map((p) => [p[0], p[1]]));
    histChart.setXY(1, sim.hist.map((p) => [p[0], p[2]]));
    histChart.draw();
  }
}

/* ------------------------------------------------------------------ main loop */
resetRun(1.5);
drawNsr();
let fpsAcc = 0, fpsN = 0;
/** Adaptive resolution: drop the render scale if frames stay slow, restore it when there is headroom. */
const quality = { scale: 1, slow: 0, fast: 0 };
function adaptQuality(dt) {
  if (dt <= 0) return;
  if (dt > 1 / 38) { quality.slow++; quality.fast = 0; } else if (dt < 1 / 55) { quality.fast++; quality.slow = Math.max(0, quality.slow - 1); }
  if (quality.slow > 90 && quality.scale > 0.6) { quality.scale = Math.max(0.6, quality.scale * 0.85); quality.slow = 0; }
  if (quality.fast > 600 && quality.scale < 1) { quality.scale = Math.min(1, quality.scale / 0.85); quality.fast = 0; }
}
const PROF = { on: false, n: 0, layers: 0, gl: 0, overlay: 0, insets: 0, rest: 0 };
ch.loop((dt, t) => {
  const dN = stepPhysics(dt);
  // view easing and panning inertia
  view.fx += (view.tfx - view.fx) * Math.min(1, dt * 3);
  view.fy += (view.tfy - view.fy) * Math.min(1, dt * 3);
  if (sim.phase !== 'pullback') sim.zOff += (sim.zOffT - sim.zOff) * Math.min(1, dt * 4);
  if (!ptrs.size && (Math.abs(sim.panVX) + Math.abs(sim.panVY) > 0.5)) {
    panBy(sim.panVX * dt, sim.panVY * dt);
    const k = Math.exp(-dt * 2.2); sim.panVX *= k; sim.panVY *= k;
  }
  const P0 = PROF.on ? performance.now() : 0;
  buildLayers(dN, dt);
  const P1 = PROF.on ? performance.now() : 0;
  render(dt, t);
  const P2 = PROF.on ? performance.now() : 0;
  drawOverlay(t);
  const P3 = PROF.on ? performance.now() : 0;
  drawPot();
  drawMode();
  const P4 = PROF.on ? performance.now() : 0;
  updateReadouts(dt);
  snd.frame();
  if (PROF.on) { PROF.n++; PROF.layers += P1 - P0; PROF.gl += P2 - P1; PROF.overlay += P3 - P2; PROF.insets += P4 - P3; PROF.rest += performance.now() - P4; }
  fpsAcc += dt; fpsN++; if (fpsAcc > 1) { sim.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  adaptQuality(dt);
}, { always: false });
// keep the deck inset alive on pause
ch.onPause(() => drawPot());

Cosmos.debug.state = () => ({
  phase: sim.phase, potential: sim.P.key, N: +sim.s.N.toFixed(3), a: Math.exp(sim.s.N), phi: +sim.s.phi.toFixed(5),
  epsH: sim.eps, H_GeV: sim.h * sim.model.sqrtV0 * MP_GEV, t_s: sim.t0 + sim.s.tau * T_MP / sim.model.sqrtV0, Ntot: +sim.Ntot.toFixed(2), phi0: +sim.phi0.toFixed(4), tooShort: sim.tooShort,
  Nv: +sim.Nv.toFixed(3), zOff: +sim.zOff.toFixed(3), layers: uniformsOut.nl, frozenFill: +(uniformsOut.sF || 0).toFixed(3),
  Or: +sim.Or.toFixed(3), TrhGeV: sim.TrhGeV, ns: nsSlider.value, hdr: HDR, fps: Math.round(sim.fps), renderScale: +quality.scale.toFixed(2),
  web: { on: sim.webOn, mix: +sim.webMix.toFixed(3), u: +sim.webU.toFixed(3), tGyr: +sim.webT.toFixed(3), z: sim.webA ? +(1 / sim.webA - 1).toFixed(2) : null, D: +sim.webD.toFixed(4), particles: webState.cols * webState.rows },
  models: Object.fromEntries(Object.entries(MODELS).map(([k, M]) => [k, { phi0: +M.phi0.toFixed(4), NEnd: +M.NEnd.toFixed(3), ns: +M.ns.toFixed(4), r: M.r, H: M.HstarGeV, tauEnd: +M.tauEnd.toFixed(2) }])),
});
Cosmos.debug.sim = sim;
Cosmos.debug.tune = TUNE;
Cosmos.debug.prof = () => { if (!PROF.on) { PROF.on = true; return 'started'; } const o = {}; for (const k of ['layers', 'gl', 'overlay', 'insets', 'rest']) o[k] = +(PROF[k] / Math.max(1, PROF.n)).toFixed(3); o.frames = PROF.n; return o; };
Cosmos.debug.pot = { potPhiAt, potMap, potDrag, startRange: () => startRange(sim.model) };
Cosmos.debug.setStart = (phi) => { sim.phi0 = phi; resetRun(0.3); return sim.Ntot; };
Cosmos.debug.measure = () => { measure(); view.fx = view.tfx; view.fy = view.tfy; };
Cosmos.debug.freeze = (b) => { sim.freeze = !!b; return sim.freeze; };
Cosmos.debug.noBlur = () => { TUNE.blur = 0; };
/** Test helper: integrate straight to e-fold N (or the end of inflation). */
Cosmos.debug.jump = (N) => {
  if (sim.phase === 'pre') startInflation();
  let g = 0;
  while (sim.phase === 'inflate' && sim.s.N < N && g++ < 2e6) { const h = maxDt(sim.P, sim.s); sim.step(sim.s, h); if (epsH(sim.P, sim.s) >= 1) endInflation(); }
  sim.h = hubble(sim.P, sim.s); sim.Nv = sim.s.N + Math.log(sim.h) - sim.lnh0; prevZoomN = sim.Nv + sim.zOff;
  return sim.s.N;
};
Cosmos.debug.choose = choosePotential;
/** Test helper: run the simulation forward by `sec` seconds of wall time without rendering. */
Cosmos.debug.ff = (sec) => { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) { const dN = stepPhysics(1 / 30); buildLayers(dN, 1 / 30); if (sim.phase !== 'pullback') sim.zOff += (sim.zOffT - sim.zOff) * 0.13; } prevZoomN = sim.Nv + sim.zOff; return sim.phase; };
/** Test helper: show the gravity preview at progress u (0..1), paused. */
Cosmos.debug.web = (u) => { if (!sim.webOn && !startWeb(true)) return 'not ready'; sim.webPlay = false; setWebFromU(u); sim.webMix = 1; webSlider.set(sim.webT); webCaption(); syncButtons(); return { t: sim.webT, a: sim.webA, D: sim.webD }; };
Cosmos.debug.WEB = WEB;
Cosmos.debug.skip = skipAhead;
})();
</script>
